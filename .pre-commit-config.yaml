# SPDX-License-Identifier: AGPL-3.0-only
#
# Local secret-scanning hooks — the FRONT LINE that stops a secret before it
# reaches the remote (the .github/workflows/secret-scan.yml CI run is only a
# post-push backstop; GitHub Push Protection is the enforced server-side gate).
# Install once per clone (installs ALL THREE hook types via default_install_hook_types):
#
#     pip install pre-commit    # or pipx / brew
#     pre-commit install
#
# Layers:
#   - prepare-commit-msg : writes the DCO Signed-off-by trailer, so nobody has to
#                  remember `git commit -s`. It only adds the line; the gate that
#                  checks it is .github/workflows/dco.yml, on every pull request.
#   - pre-commit : gitleaks on STAGED changes — blocks the commit before it exists.
#   - pre-push   : gitleaks on the OUTGOING commit range — catches anything that
#                  bypassed pre-commit (--no-verify / committed before install),
#                  before it leaves the machine. Plus the full `make app-test`
#                  gate whenever the push touches web/.
# Both gitleaks layers are fast + fully offline and honour .gitleaks.toml. The
# app gate takes a few minutes, which is the price of never deploying a red
# suite. TruffleHog's value is
# live-credential *verification* (network calls) — too heavy per-commit, so it
# runs in CI (--only-verified) instead.
default_install_hook_types: [prepare-commit-msg, pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks           # pre-commit stage: scans staged changes

  - repo: local
    hooks:
      # FIRST because it is the only hook here that writes something rather
      # than refusing something, and it costs nothing.
      #
      # The sign-off is this project's inbound licence grant (CONTRIBUTING.md).
      # Without it a merged commit has no recorded grant and no agreement to the
      # stichting succession clause, which turns the handover into a hunt for
      # every past author. Typing `-s` every time is a rule people keep until
      # the day they are in a hurry, so the hook types it for them.
      - id: signoff
        name: sign-off (DCO trailer on the commit message)
        entry: tools/signoff-prepare-commit-msg.sh
        language: script
        stages: [prepare-commit-msg]
        always_run: true

      - id: gitleaks-prepush
        name: gitleaks (scan commits being pushed)
        entry: tools/gitleaks-prepush.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # The whole `make app-test` gate before code leaves the machine: the
      # test suite, both analyzers, php-cs-fixer and the four shell gates.
      # ci-app.yml runs the same set, but staging pushes deploy
      # right away, so the push is the last moment to catch a red gate.
      #
      # Fires on any change under web/, not only PHP: a Twig template, a
      # translation catalogue or an asset breaks tests just as readily. The
      # run itself is always full-project, see the script.
      - id: app-gate-prepush
        name: full app gate (PHPUnit + analyzers + format, over web/)
        entry: tools/app-gate-prepush.sh
        language: script
        stages: [pre-push]
        files: ^web/
        pass_filenames: false

      # Wiki prose is CC BY-SA 4.0 (README §License): every wiki/**/*.md must
      # open with its SPDX header. Runs only when wiki pages are staged, so a
      # new page can't land headerless; the rendered site footer comes from
      # mkdocs.yml `copyright` and needs nothing per page.
      - id: check-wiki-spdx
        name: wiki pages carry the CC-BY-SA-4.0 SPDX header
        entry: tools/check-wiki-spdx.sh
        language: script
        files: ^wiki/.*\.md$
        pass_filenames: false

      # The wiki teaches from real excerpts of this repo, which is the point —
      # a reader can open the file and see the thing being explained. It is
      # also the risk: nothing stops the code moving underneath the prose, so
      # a lesson can quietly become wrong while still reading perfectly and
      # still building clean. Every fenced block must declare whether it
      # quotes the repo (CODE-FROM, verified line by line against the source)
      # or is a hand-written teaching example (CODE-ILLUSTRATIVE, with a note
      # telling the reader which it is).
      #
      # Split deliberately by who is committing:
      #   editing a WIKI page  -> hard fail. You are touching the docs, so the
      #                           docs must be right.
      #   editing SOURCE       -> warn, never block. Holding a RideCheckService
      #                           change hostage to a wiki page is backwards,
      #                           and the predictable result is --no-verify,
      #                           which kills the gate's credibility. The commit
      #                           lands and the developer is told which pages
      #                           just went stale, while they still have the
      #                           context to fix them. `make wiki-check` and CI
      #                           still fail, so the wiki cannot SHIP stale — it
      #                           just cannot block unrelated work.
      - id: check-wiki-code-drift
        name: wiki code excerpts still match the code they quote
        entry: tools/check-wiki-code-drift.py
        language: python
        files: ^wiki/.*\.md$
        pass_filenames: false

      # ALWAYS runs, deliberately, rather than triggering on a path filter.
      #
      # It used to fire only on `web/**.{php,js}` and `pipeline/**.py`, which
      # silently missed six files the wiki actually quotes — among them
      # tools/divisions/config.py, developers/docker/compose.yaml and
      # web/translations/messages.en.yaml. Three of those were edited in one
      # day (2026-08-14) with no warning: the wiki could have gone stale and
      # the hook would have reported nothing, which is worse than having no
      # hook, because the silence reads as an all-clear.
      #
      # A filter listing every quoted path is a second copy of a list that
      # lives in the wiki's own CODE-FROM markers, and it drifts the same way.
      # The check reads those markers itself and takes **77 ms** over the whole
      # wiki, so there is nothing to optimise: running it every time is cheaper
      # than maintaining the filter, and cannot develop a blind spot.
      # (`pass_filenames: false` — it never used the staged list anyway.)
      - id: warn-wiki-code-drift
        name: does this code change make the wiki stale? (warning only)
        entry: tools/check-wiki-code-drift.py --warn-only
        language: python
        always_run: true
        pass_filenames: false

      # `make course-data` is the setup step the GIS course tells a reader to
      # run before chapter 1, so when it breaks, two courses' worth of "Try it"
      # exercises return nothing. It DID break, for two weeks: the 2026-08-26
      # letter renumbering updated tools/wallonia/export.py's own main() and
      # missed the Makefile's inline copy of the same call, which went on
      # writing water as letter C. GEOMETRY_KIND has no C, the import is one
      # transaction, and the whole target rolled back before the coverage step.
      # Nothing noticed, because the drift gate above reads quoted code, not
      # make recipes, and no test anywhere mentions course-data.
      #
      # Three files have to agree and none of them imports another: the
      # Makefile's recipe, the PHP importer's letter map, and the seed
      # command. This reads all three, then runs the exporter for real
      # (stdlib only, committed fixtures, no network, no database, ~2 s) so
      # the counts in the Makefile's comment are measured rather than
      # remembered.
      - id: check-course-data
        name: make course-data still imports (letters, geometry, counts)
        entry: tools/check-course-data.py --quiet
        language: python
        files: ^(Makefile|web/src/Catalog/Command/.*\.php|tools/wallonia/.*\.py|atlas/demo/.*)$
        pass_filenames: false

      # The courses quote measurements, and a measurement in a sentence is
      # invisible to the drift gate above: it reads quoted CODE. So the ones
      # that CAN be derived from a checkout are derived, once, into
      # wiki/developers/numbers.md, and pages cite that page. This fails when a
      # figure moves under it, which is how `check_date` left chapter 6 saying
      # 32 stored keys in five places and a figure.
      #
      # Regenerate rather than hand-edit: tools/wiki-numbers.py --write
      - id: wiki-numbers
        name: the numbers page still matches the repository
        entry: tools/wiki-numbers.py
        language: python
        always_run: true
        pass_filenames: false

      # /credits claims that everything the Commons is built on is named there.
      # That claim breaks silently: a dependency lands in composer.json, nobody
      # remembers the page, and the page goes on reading perfectly while being
      # wrong. Each credit declares what it covers with data-pkg, and the gate
      # diffs those markers against composer.json, the requirements.txt files,
      # the compose images and web/assets/lib. Contract:
      # docs/specs/credits-page.md.
      #
      # Split by who is committing, for the same reason as the wiki gate above:
      #   editing CREDITS  -> hard fail. You are touching the credits, so the
      #                       credits must be right.
      #   editing DEPS     -> warn, never block. Holding a composer bump hostage
      #                       to a copy page is backwards, and the predictable
      #                       result is --no-verify. `make credits-check` and CI
      #                       still fail, so the page cannot SHIP stale.
      #
      # Neither hook touches the network. Link rot is caught by `--links`, which
      # CI runs; keeping it out of here is what lets you commit offline.
      - id: check-credits
        name: /credits names every dependency
        entry: tools/credits/check_credits.py
        language: python
        files: ^web/templates/pages/credits\.html\.twig$
        pass_filenames: false

      - id: warn-credits-drift
        name: does this dependency change make /credits stale? (warning only)
        entry: tools/credits/check_credits.py --warn-only
        language: python
        files: ^(web/composer\.json|web/assets/lib/.*|.*/requirements\.txt|developers/docker/.*)$
        pass_filenames: false

      # five (en/fr/nl/de/es). Runs only when translation files are staged;
      # skips gracefully without php/vendor (CI still enforces it).
      - id: check-translations
        name: translation catalogs in parity (en/fr/nl/de/es)
        entry: tools/check-translations-precommit.sh
        language: script
        files: ^web/translations/messages\..*\.yaml$
        pass_filenames: false
