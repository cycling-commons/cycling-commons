name: cycling-commons-dev

# Full-stack dev environment for the Cycling Commons.
#   cp .env.example .env  &&  docker compose up
# See developers/docker/README.md for the URL table and the opt-in profiles.
#
# Every published port binds ${BIND_ADDR}, which defaults to 127.0.0.1: this
# stack is for THIS machine. It used to bind 0.0.0.0 and so offered the whole
# network a PostgreSQL, a MinIO console and an unauthenticated pipeline API
# (security scan 2026-08-25). Set BIND_ADDR=0.0.0.0 in .env if you actually
# want a phone or a colleague to reach it.
#
# The two passwords below use `:?` rather than a fallback value on purpose. A
# missing .env should stop the stack with a readable message, not quietly boot
# a database whose password is "cc".

services:
  # ---- the spine: PostgreSQL + PostGIS -------------------------------------
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyclingcommons}
      POSTGRES_USER: ${POSTGRES_USER:-cc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in developers/docker/.env (cp .env.example .env)}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18 images store data in a major-version subdir; mount the parent so PGDATA
      # (/var/lib/postgresql/18/docker) is persisted and pg_upgrade --link stays possible.
      - cc_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cc} -d ${POSTGRES_DB:-cyclingcommons}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---- shared state: sessions, rate limiters, the media circuit breaker, PoW ----
  # Deliberately NOT published to a host port: it is only reachable inside this
  # stack, so it cannot collide with a Redis you already run for another
  # project. If you have one, set REDIS_URL=redis://host.docker.internal:6379
  # in developers/docker/.env and this service just idles.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- serving the web app: Symfony on PHP-FPM, fronted by nginx (mirrors prod) ----
  app:
    build: ../../web
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-dev-not-secret-change-me}
      # cache/logs to a container-writable path so the bind-mounted source has no perms issues
      APP_CACHE_DIR: /tmp/cc-cache
      APP_LOG_DIR: /tmp/cc-log
      # NB: as a real env var this beats every .env* file — including .env.test.
      # tests/bootstrap.php therefore refuses to run against a non-*_test database;
      # to run phpunit inside this container, pass -e DATABASE_URL=…/cyclingcommons_test.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cc}:${POSTGRES_PASSWORD:-cc}@db:5432/${POSTGRES_DB:-cyclingcommons}?serverVersion=18&charset=utf8"
      # Shared state (sessions, rate limiters, media circuit breaker, PoW).
      # Override in developers/docker/.env to use a Redis you already run:
      #   REDIS_URL=redis://host.docker.internal:6379
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      # Email is caught by the bundled Mailpit over the internal network (see below).
      # To use a shared host instance instead, override MAILER_DSN, e.g.
      #   MAILER_DSN=smtp://host.docker.internal:1025
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
      # Coverage tiles (coverage-provider.md §8): opt-in via
      # developers/docker/.env once `make coverage-refresh` published to MinIO.
      COVERAGE_TILES: "${COVERAGE_TILES:-1}"
      COVERAGE_MANIFEST_URL: "${COVERAGE_MANIFEST_URL:-}"
      COVERAGE_CSP_HOST: "${COVERAGE_CSP_HOST:-}"
      # Rider media (photo-uploads.md §2). The credentials deliberately derive
      # from MINIO_ROOT_USER/PASSWORD — the same two variables the minio service
      # itself uses, set in developers/docker/.env from .env.example — so there
      # is exactly one place to change them and nothing to keep in sync.
      # Staging and production supply MEDIA_S3_* directly and never reach these
      # defaults.
      #
      # To use a MinIO running on the host instead of the bundled one (and skip
      # the `storage` profile entirely), override in developers/docker/.env,
      # following the MAILER_DSN precedent above:
      #   MEDIA_S3_ENDPOINT=http://host.docker.internal:9000
      #   MEDIA_S3_KEY=…  MEDIA_S3_SECRET=…  MEDIA_S3_PUBLIC_BUCKET_EU=cc-media-eu-01
      #   MEDIA_PUBLIC_BASE=http://localhost:9000
      #   MEDIA_CSP_HOST=http://localhost:9000
      # Those belong HERE, not in web/.env.dev.local: compose injects them as
      # real process environment variables, which beat every Symfony .env* file.
      #
      # Two hostnames, not interchangeable: the app writes server-side over the
      # compose network (minio:9000) while the browser reads from the published
      # port (localhost:9100).
      MEDIA_S3_ENDPOINT: "${MEDIA_S3_ENDPOINT:-http://minio:9000}"
      MEDIA_S3_REGION: "${MEDIA_S3_REGION:-us-east-1}"
      MEDIA_S3_KEY: "${MEDIA_S3_KEY:-${MINIO_ROOT_USER:-ccadmin}}"
      MEDIA_S3_SECRET: "${MEDIA_S3_SECRET:-${MINIO_ROOT_PASSWORD:-ccadminsecret}}"
      MEDIA_S3_PUBLIC_BUCKET_AF: "${MEDIA_S3_PUBLIC_BUCKET_AF:-cc-media-af-01}"
      MEDIA_S3_PUBLIC_BUCKET_AS: "${MEDIA_S3_PUBLIC_BUCKET_AS:-cc-media-as-01}"
      MEDIA_S3_PUBLIC_BUCKET_EU: "${MEDIA_S3_PUBLIC_BUCKET_EU:-cc-media-eu-01}"
      MEDIA_S3_PUBLIC_BUCKET_NA: "${MEDIA_S3_PUBLIC_BUCKET_NA:-cc-media-na-01}"
      MEDIA_S3_PUBLIC_BUCKET_OC: "${MEDIA_S3_PUBLIC_BUCKET_OC:-cc-media-oc-01}"
      MEDIA_S3_PUBLIC_BUCKET_SA: "${MEDIA_S3_PUBLIC_BUCKET_SA:-cc-media-sa-01}"
      MEDIA_S3_PRIVATE_BUCKET: "${MEDIA_S3_PRIVATE_BUCKET:-cc-media-private}"
      MEDIA_PUBLIC_BASE: "${MEDIA_PUBLIC_BASE:-http://localhost:9102/img}"
      MEDIA_CSP_HOST: "${MEDIA_CSP_HOST:-http://localhost:9102}"
      MESSENGER_TRANSPORT_DSN: "${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/cc_messages}"
    volumes:
      - ../../web:/app
      - cc_api_vendor:/app/vendor   # keep built vendor/ from being shadowed by the bind mount
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so the container can reach the host's Mailpit
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ---- the async tier: one messenger consumer (media scan-and-release, and
  # everything else the worker host will run). Same image and env as `app`,
  # different entrypoint. THIS is the container that gets the scanner; the web
  # container keeps neither proc_open nor clamd access.
  # stop_grace_period must stay comfortably above the slowest handler (the
  # scan + re-encode of a 15 MB photo, bounded by the 60s time-limit below):
  # a deploy that kills a message mid-flight orphans it.
  worker:
    build: ../../web
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    stop_grace_period: 90s
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-dev-not-secret-change-me}
      APP_CACHE_DIR: /tmp/cc-cache
      APP_LOG_DIR: /tmp/cc-log
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cc}:${POSTGRES_PASSWORD:-cc}@db:5432/${POSTGRES_DB:-cyclingcommons}?serverVersion=18&charset=utf8"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      MESSENGER_TRANSPORT_DSN: "${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/cc_messages}"
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
      CLAMAV_TCP_ADDR: "${CLAMAV_TCP_ADDR:-clamav:3310}"
      CLAMAV_REQUIRED: "${CLAMAV_REQUIRED:-1}"
      MEDIA_S3_ENDPOINT: "${MEDIA_S3_ENDPOINT:-http://minio:9000}"
      MEDIA_S3_REGION: "${MEDIA_S3_REGION:-us-east-1}"
      MEDIA_S3_KEY: "${MEDIA_S3_KEY:-${MINIO_ROOT_USER:-ccadmin}}"
      MEDIA_S3_SECRET: "${MEDIA_S3_SECRET:-${MINIO_ROOT_PASSWORD:-ccadminsecret}}"
      MEDIA_S3_PUBLIC_BUCKET_AF: "${MEDIA_S3_PUBLIC_BUCKET_AF:-cc-media-af-01}"
      MEDIA_S3_PUBLIC_BUCKET_AS: "${MEDIA_S3_PUBLIC_BUCKET_AS:-cc-media-as-01}"
      MEDIA_S3_PUBLIC_BUCKET_EU: "${MEDIA_S3_PUBLIC_BUCKET_EU:-cc-media-eu-01}"
      MEDIA_S3_PUBLIC_BUCKET_NA: "${MEDIA_S3_PUBLIC_BUCKET_NA:-cc-media-na-01}"
      MEDIA_S3_PUBLIC_BUCKET_OC: "${MEDIA_S3_PUBLIC_BUCKET_OC:-cc-media-oc-01}"
      MEDIA_S3_PUBLIC_BUCKET_SA: "${MEDIA_S3_PUBLIC_BUCKET_SA:-cc-media-sa-01}"
      MEDIA_S3_PRIVATE_BUCKET: "${MEDIA_S3_PRIVATE_BUCKET:-cc-media-private}"
      MEDIA_PUBLIC_BASE: "${MEDIA_PUBLIC_BASE:-http://localhost:9102/img}"
      MEDIA_CSP_HOST: "${MEDIA_CSP_HOST:-http://localhost:9102}"
    volumes:
      - ../../web:/app
      - cc_api_vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  # ---- virus scanner sidecar (media plan task 3). clamd takes ~a minute to
  # load signatures on first start; the generous healthcheck start_period is
  # that, not slowness. The worker waits for healthy so a scan never races the
  # signature load.
  clamav:
    image: clamav/clamav:stable
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  web:
    image: nginx:alpine
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8001}:80"
    volumes:
      - ../../web:/app:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      # 127.0.0.1 (not localhost): alpine resolves localhost to ::1 first, but
      # nginx only listens on IPv4 :80 — so localhost would falsely report unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---- Python pipeline: geospatial/raster/routing + coverage batch ----------
  pipeline:
    build: ../../pipeline
    # The image is a batch worker and defaults to no service (see its
    # Dockerfile). The dev stack is the one place the FastAPI scaffold runs, so
    # it asks for it explicitly rather than relying on the image default —
    # which is what keeps "no resident HTTP service" true everywhere else.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_DSN: "postgresql://${POSTGRES_USER:-cc}:${POSTGRES_PASSWORD:-cc}@db:5432/${POSTGRES_DB:-cyclingcommons}"
      DEM_DIR: /data/dem
      # Coverage batch (docs/specs/coverage-provider.md §3).
      # Defaults target the bundled MinIO (profile: storage, root creds from
      # .env); prod overrides point at the CC Hetzner bucket.
      #
      # This list must name every ONBOARDED country's Geofabrik extract, or
      # that country's coverage is never refreshed by anything that follows the
      # committed config. `europe/spain` was missing from 2026-08-08 (the ES
      # onboarding added it to COUNTRY_BY_REGION and not here), so Spain's
      # 234,958 POIs were only ever refreshed by an explicit `regions=` — the
      # exact silent-gap this list exists to prevent.
      COVERAGE_REGIONS: ${COVERAGE_REGIONS:-europe/belgium,europe/netherlands,europe/germany,europe/luxembourg,europe/france,europe/switzerland,europe/great-britain,europe/ireland-and-northern-ireland,europe/italy,europe/spain,europe/slovenia,africa/rwanda,africa/south-africa,south-america/colombia,south-america/chile,australia-oceania/australia,australia-oceania/new-zealand,asia/japan,north-america/us/california,north-america/us/colorado,north-america/canada/british-columbia,north-america/canada/quebec}
      COVERAGE_WORKDIR: /data/work
      COVERAGE_PBF_PATH: ${COVERAGE_PBF_PATH:-}
      COVERAGE_S3_ENDPOINT: ${COVERAGE_S3_ENDPOINT:-http://minio:9000}
      COVERAGE_S3_BUCKET: ${COVERAGE_S3_BUCKET:-cc-maps}
      COVERAGE_S3_KEY: ${COVERAGE_S3_KEY:-ccadmin}
      COVERAGE_S3_SECRET: ${COVERAGE_S3_SECRET:-ccadminsecret}
      COVERAGE_PUBLIC_BASE_URL: ${COVERAGE_PUBLIC_BASE_URL:-http://localhost:9100/cc-maps}
    ports:
      # 8012, not 8002: host 8002 is where ELEVATION_URL expects Europe's
      # Valhalla (the other continents sit on 8003/8004/8007, and the compose
      # valhalla service publishes 8003). The old default collided with it, so
      # a clone that did not copy .env.example bound the pipeline to 8002 and
      # elevation could not start. .env.example already used 8012; this makes
      # the fallback agree with it.
      - "${BIND_ADDR:-127.0.0.1}:${PIPELINE_PORT:-8012}:8000"
    volumes:
      - ../../pipeline:/app
      - ${DEM_DIR:-./data/dem}:/data/dem:ro   # downloaded DEM (see README)
      - cc_pipeline_data:/data/work           # coverage batch scratch (PBFs, GeoJSONL, PMTiles)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---- static frontend (the Atlas map demo in atlas/demo/) ------------------
  atlas:
    image: nginx:alpine
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ATLAS_PORT:-8099}:80"
    volumes:
      - ../../atlas/demo:/usr/share/nginx/html:ro
      - ./nginx/atlas.conf:/etc/nginx/conf.d/default.conf:ro   # dev: no-store cache so edits always show

  # ---- reference docs (MkDocs Material, live reload) -----------------------
  wiki:
    build:
      context: ../../
      dockerfile: developers/docker/wiki/Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WIKI_PORT:-8000}:8000"
    volumes:
      - ../../mkdocs.yml:/docs/mkdocs.yml:ro
      - ../../wiki:/docs/wiki:ro
      - ../../overrides:/docs/overrides:ro   # theme.custom_dir in mkdocs.yml (analytics partial; host-guarded, off in dev)
      - ../../tools:/docs/tools:ro           # mkdocs.yml `hooks:` — without this the container aborts with a config error

  # ---- opt-in: routing engine (consumes a PREBUILT tile set you download) --
  valhalla:
    profiles: ["routing"]
    image: ghcr.io/valhalla/valhalla:latest
    environment:
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VALHALLA_PORT:-8003}:8002"
    volumes:
      - ${VALHALLA_TILES:-./data/valhalla}:/custom_files   # drop the downloaded tiles here

  # ---- mail catcher: Mailpit (bundled, so the stack is self-contained) ------
  # The app sends to mailpit:1025 over the internal network — no host SMTP port.
  # Only the web UI is published, on ${MAILPIT_UI_PORT:-8025}. If that collides
  # with a shared host Mailpit, set MAILPIT_UI_PORT (e.g. 8026), or point the app
  # at your host instance with MAILER_DSN=smtp://host.docker.internal:1025.
  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"

  # ---- opt-in: S3-compatible object storage for PMTiles + rider media ------
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ccadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in developers/docker/.env (cp .env.example .env)}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_PORT:-9100}:9000"
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - cc_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: create the rider-media bucket with the anonymous-read policy the
  # browser needs, so a contributor running `make up-storage` never has to open
  # the MinIO console (docs/specs/photo-uploads.md §2). The coverage bucket is
  # not created here — pipeline/coverage/publish.py::ensure_bucket already does
  # that for itself, and duplicating it would give two owners for one bucket.
  #
  # The PRIVATE bucket gets NO anonymous policy, and that is the point: an
  # unscanned upload sits there world-unreadable until the worker's clean
  # verdict physically moves derivatives to the public bucket (media plan
  # task 2).
  #
  # Exits immediately after; `mb --ignore-existing` makes reruns free. Skipped
  # entirely when the storage profile is off, which is exactly the topology
  # where MEDIA_S3_* points at a MinIO the developer already runs and manages.
  minio-media-bucket:
    profiles: ["storage"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set cc http://minio:9000 '${MINIO_ROOT_USER:-ccadmin}' '${MINIO_ROOT_PASSWORD:-ccadminsecret}' &&
      mc mb --ignore-existing cc/${MEDIA_S3_PUBLIC_BUCKET_AF:-cc-media-af-01} &&
      mc anonymous set download cc/${MEDIA_S3_PUBLIC_BUCKET_AF:-cc-media-af-01} &&
      mc mb --ignore-existing cc/${MEDIA_S3_PUBLIC_BUCKET_AS:-cc-media-as-01} &&
      mc anonymous set download cc/${MEDIA_S3_PUBLIC_BUCKET_AS:-cc-media-as-01} &&
      mc mb --ignore-existing cc/${MEDIA_S3_PUBLIC_BUCKET_EU:-cc-media-eu-01} &&
      mc anonymous set download cc/${MEDIA_S3_PUBLIC_BUCKET_EU:-cc-media-eu-01} &&
      mc mb --ignore-existing cc/${MEDIA_S3_PUBLIC_BUCKET_NA:-cc-media-na-01} &&
      mc anonymous set download cc/${MEDIA_S3_PUBLIC_BUCKET_NA:-cc-media-na-01} &&
      mc mb --ignore-existing cc/${MEDIA_S3_PUBLIC_BUCKET_OC:-cc-media-oc-01} &&
      mc anonymous set download cc/${MEDIA_S3_PUBLIC_BUCKET_OC:-cc-media-oc-01} &&
      mc mb --ignore-existing cc/${MEDIA_S3_PUBLIC_BUCKET_SA:-cc-media-sa-01} &&
      mc anonymous set download cc/${MEDIA_S3_PUBLIC_BUCKET_SA:-cc-media-sa-01} &&
      mc mb --ignore-existing cc/${MEDIA_S3_PRIVATE_BUCKET:-cc-media-private}
      "

  # Serves MediaStorage::url()'s <base>/<shard>/<key> shape, which MinIO cannot
  # serve directly (it wants the full bucket name as the first path segment).
  # Staging and production have the equivalent as a real vhost; without this,
  # dev is the only environment that cannot display a photo.
  media-proxy:
    profiles: ["storage"]
    image: nginx:alpine
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Only MEDIA_-prefixed names are substituted, so nginx's own $shard and
      # $objkey survive envsubst untouched.
      NGINX_ENVSUBST_FILTER: "MEDIA_"
      MEDIA_BUCKET_PREFIX: "${MEDIA_BUCKET_PREFIX:-cc-media-}"
    volumes:
      - ./media-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MEDIA_PROXY_PORT:-9102}:80"

  # The tile half of the same story as media-proxy: staging serves tiles from
  # tiles-stg.cyclingcommons.org, rewriting the public /cc-maps/ prefix onto a
  # bucket whose name is not public. Dev pointed the browser straight at MinIO,
  # where /cc-maps/ resolves only because the dev bucket happens to carry that
  # name - so the rewrite staging relies on was never exercised locally.
  tiles-proxy:
    profiles: ["storage"]
    image: nginx:alpine
    depends_on:
      minio:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_FILTER: "CC_TILE_"
      CC_TILE_BUCKET: "${CC_TILE_BUCKET:-cc-maps}"
    volumes:
      - ./tiles-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${TILES_PROXY_PORT:-9103}:80"

volumes:
  cc_pgdata:
  cc_api_vendor:
  cc_minio:
  cc_pipeline_data:
