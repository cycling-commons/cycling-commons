name: cycling-commons-dev

# Full-stack dev environment for the Cycling Commons.
#   cp .env.example .env  &&  docker compose up
# See developers/docker/README.md for the URL table and the opt-in profiles.

services:
  # ---- the spine: PostgreSQL + PostGIS -------------------------------------
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyclingcommons}
      POSTGRES_USER: ${POSTGRES_USER:-cc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18 images store data in a major-version subdir; mount the parent so PGDATA
      # (/var/lib/postgresql/18/docker) is persisted and pg_upgrade --link stays possible.
      - cc_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cc} -d ${POSTGRES_DB:-cyclingcommons}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---- serving the web app: Symfony on PHP-FPM, fronted by nginx (mirrors prod) ----
  app:
    build: ../../web
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-dev-not-secret-change-me}
      # cache/logs to a container-writable path so the bind-mounted source has no perms issues
      APP_CACHE_DIR: /tmp/cc-cache
      APP_LOG_DIR: /tmp/cc-log
      # NB: as a real env var this beats every .env* file — including .env.test.
      # tests/bootstrap.php therefore refuses to run against a non-*_test database;
      # to run phpunit inside this container, pass -e DATABASE_URL=…/cyclingcommons_test.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cc}:${POSTGRES_PASSWORD:-cc}@db:5432/${POSTGRES_DB:-cyclingcommons}?serverVersion=18&charset=utf8"
      # Email is caught by the bundled Mailpit over the internal network (see below).
      # To use a shared host instance instead, override MAILER_DSN, e.g.
      #   MAILER_DSN=smtp://host.docker.internal:1025
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
      # Coverage tiles (coverage-provider.md §8): opt-in via
      # developers/docker/.env once `make coverage-refresh` published to MinIO.
      COVERAGE_TILES: "${COVERAGE_TILES:-1}"
      COVERAGE_MANIFEST_URL: "${COVERAGE_MANIFEST_URL:-}"
      COVERAGE_CSP_HOST: "${COVERAGE_CSP_HOST:-}"
      # Rider media (photo-uploads.md §2). The credentials deliberately derive
      # from MINIO_ROOT_USER/PASSWORD — the same two variables the minio service
      # itself uses, set in developers/docker/.env from .env.example — so there
      # is exactly one place to change them and nothing to keep in sync.
      # Staging and production supply MEDIA_S3_* directly and never reach these
      # defaults.
      #
      # To use a MinIO running on the host instead of the bundled one (and skip
      # the `storage` profile entirely), override in developers/docker/.env,
      # following the MAILER_DSN precedent above:
      #   MEDIA_S3_ENDPOINT=http://host.docker.internal:9000
      #   MEDIA_S3_KEY=…  MEDIA_S3_SECRET=…  MEDIA_S3_BUCKET_EU=cc-media-eu
      #   MEDIA_PUBLIC_BASE=http://localhost:9000
      #   MEDIA_CSP_HOST=http://localhost:9000
      # Those belong HERE, not in web/.env.dev.local: compose injects them as
      # real process environment variables, which beat every Symfony .env* file.
      #
      # Two hostnames, not interchangeable: the app writes server-side over the
      # compose network (minio:9000) while the browser reads from the published
      # port (localhost:9100).
      MEDIA_S3_ENDPOINT: "${MEDIA_S3_ENDPOINT:-http://minio:9000}"
      MEDIA_S3_REGION: "${MEDIA_S3_REGION:-us-east-1}"
      MEDIA_S3_KEY: "${MEDIA_S3_KEY:-${MINIO_ROOT_USER:-ccadmin}}"
      MEDIA_S3_SECRET: "${MEDIA_S3_SECRET:-${MINIO_ROOT_PASSWORD:-ccadminsecret}}"
      MEDIA_S3_BUCKET_EU: "${MEDIA_S3_BUCKET_EU:-cc-media-eu}"
      MEDIA_PUBLIC_BASE: "${MEDIA_PUBLIC_BASE:-http://localhost:9100}"
      MEDIA_CSP_HOST: "${MEDIA_CSP_HOST:-http://localhost:9100}"
      MEDIA_DEFAULT_CONTINENT: "${MEDIA_DEFAULT_CONTINENT:-EU}"
    volumes:
      - ../../web:/app
      - cc_api_vendor:/app/vendor   # keep built vendor/ from being shadowed by the bind mount
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so the container can reach the host's Mailpit
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    image: nginx:alpine
    ports:
      - "${API_PORT:-8001}:80"
    volumes:
      - ../../web:/app:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      # 127.0.0.1 (not localhost): alpine resolves localhost to ::1 first, but
      # nginx only listens on IPv4 :80 — so localhost would falsely report unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---- Python pipeline: geospatial/raster/routing + coverage batch ----------
  pipeline:
    build: ../../pipeline
    environment:
      DATABASE_DSN: "postgresql://${POSTGRES_USER:-cc}:${POSTGRES_PASSWORD:-cc}@db:5432/${POSTGRES_DB:-cyclingcommons}"
      DEM_DIR: /data/dem
      # Coverage batch (docs/specs/coverage-provider.md §3).
      # Defaults target the bundled MinIO (profile: storage, root creds from
      # .env); prod overrides point at the CC Hetzner bucket.
      COVERAGE_REGIONS: ${COVERAGE_REGIONS:-europe/belgium,europe/netherlands,europe/germany}
      COVERAGE_WORKDIR: /data/work
      COVERAGE_PBF_PATH: ${COVERAGE_PBF_PATH:-}
      COVERAGE_S3_ENDPOINT: ${COVERAGE_S3_ENDPOINT:-http://minio:9000}
      COVERAGE_S3_BUCKET: ${COVERAGE_S3_BUCKET:-cc-maps}
      COVERAGE_S3_KEY: ${COVERAGE_S3_KEY:-ccadmin}
      COVERAGE_S3_SECRET: ${COVERAGE_S3_SECRET:-ccadminsecret}
      COVERAGE_PUBLIC_BASE_URL: ${COVERAGE_PUBLIC_BASE_URL:-http://localhost:9100/cc-maps}
    ports:
      - "${PIPELINE_PORT:-8002}:8000"
    volumes:
      - ../../pipeline:/app
      - ${DEM_DIR:-./data/dem}:/data/dem:ro   # downloaded DEM (see README)
      - cc_pipeline_data:/data/work           # coverage batch scratch (PBFs, GeoJSONL, PMTiles)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---- static frontend (the Atlas map demo in atlas/demo/) ------------------
  atlas:
    image: nginx:alpine
    ports:
      - "${ATLAS_PORT:-8099}:80"
    volumes:
      - ../../atlas/demo:/usr/share/nginx/html:ro
      - ./nginx/atlas.conf:/etc/nginx/conf.d/default.conf:ro   # dev: no-store cache so edits always show

  # ---- reference docs (MkDocs Material, live reload) -----------------------
  wiki:
    build:
      context: ../../
      dockerfile: developers/docker/wiki/Dockerfile
    ports:
      - "${WIKI_PORT:-8000}:8000"
    volumes:
      - ../../mkdocs.yml:/docs/mkdocs.yml:ro
      - ../../wiki:/docs/wiki:ro
      - ../../overrides:/docs/overrides:ro   # theme.custom_dir in mkdocs.yml (analytics partial; host-guarded, off in dev)
      - ../../tools:/docs/tools:ro           # mkdocs.yml `hooks:` — without this the container aborts with a config error

  # ---- opt-in: routing engine (consumes a PREBUILT tile set you download) --
  valhalla:
    profiles: ["routing"]
    image: ghcr.io/valhalla/valhalla:latest
    environment:
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
    ports:
      - "${VALHALLA_PORT:-8003}:8002"
    volumes:
      - ${VALHALLA_TILES:-./data/valhalla}:/custom_files   # drop the downloaded tiles here

  # ---- mail catcher: Mailpit (bundled, so the stack is self-contained) ------
  # The app sends to mailpit:1025 over the internal network — no host SMTP port.
  # Only the web UI is published, on ${MAILPIT_UI_PORT:-8025}. If that collides
  # with a shared host Mailpit, set MAILPIT_UI_PORT (e.g. 8026), or point the app
  # at your host instance with MAILER_DSN=smtp://host.docker.internal:1025.
  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # ---- opt-in: S3-compatible object storage for PMTiles + rider media ------
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ccadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ccadminsecret}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - cc_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: create the rider-media bucket with the anonymous-read policy the
  # browser needs, so a contributor running `make up-storage` never has to open
  # the MinIO console (docs/specs/photo-uploads.md §2). The coverage bucket is
  # not created here — pipeline/coverage/publish.py::ensure_bucket already does
  # that for itself, and duplicating it would give two owners for one bucket.
  #
  # Exits immediately after; `mb --ignore-existing` makes reruns free. Skipped
  # entirely when the storage profile is off, which is exactly the topology
  # where MEDIA_S3_* points at a MinIO the developer already runs and manages.
  minio-media-bucket:
    profiles: ["storage"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set cc http://minio:9000 '${MINIO_ROOT_USER:-ccadmin}' '${MINIO_ROOT_PASSWORD:-ccadminsecret}' &&
      mc mb --ignore-existing cc/${MEDIA_S3_BUCKET_EU:-cc-media-eu} &&
      mc anonymous set download cc/${MEDIA_S3_BUCKET_EU:-cc-media-eu}
      "

volumes:
  cc_pgdata:
  cc_api_vendor:
  cc_minio:
  cc_pipeline_data:
