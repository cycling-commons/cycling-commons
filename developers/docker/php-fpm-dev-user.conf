; Dev-only pool override. Runs the www pool workers as the host developer's
; uid/gid (DEV_UID/DEV_GID, set by developers/docker/compose.yaml) instead of
; www-data, so files the app writes into the bind-mounted source (translations.md
; §7.3) stay owned by the developer. The php-fpm master still starts as root
; (web/Dockerfile) so it can perform this setuid drop; only the pool user/group
; changes here. Mounted as zz-dev-user.conf so it sorts after www.conf in
; php-fpm's glob(3) include order and its user/group win for the [www] pool.
; Dev only: never built into the image, so production keeps dropping to
; www-data.
[www]
user = ${DEV_UID}
group = ${DEV_GID}
