# nginx vhost for the Symfony web app — fronts PHP-FPM (the `app` service).
# Mirrors the production request path: nginx -> php-fpm -> Symfony.
server {
    listen 80;
    server_name _;
    root /app/public;

    # Frontend review 2026-07-12 C5: /map/catalog.json is ~1.15 MB raw and was
    # served uncompressed — gzip takes JSON ~8-10x smaller (~130 KB). html is
    # always compressed by the gzip module; the types below add the app's
    # other text payloads (catalog JSON, digested assets, inline SVG flags).
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # only the front controller is executed; everything routes through it
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # reject direct access to any other .php file
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 16m;
}
