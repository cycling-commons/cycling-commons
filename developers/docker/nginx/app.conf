# nginx vhost for the Symfony web app — fronts PHP-FPM (the `app` service).
# Mirrors the production request path: nginx -> php-fpm -> Symfony.

# Bulk export downloads, counted per address in nginx's own memory and never
# written anywhere (api-strategy.md §3.1). This file is included inside the
# http block, which is where a zone has to be declared.
limit_req_zone $binary_remote_addr zone=bulk_export:1m rate=1r/m;

server {
    listen 80;
    server_name _;
    root /app/public;

    # Label text responses UTF-8. Without this nginx sends `text/plain` and
    # `text/html` with no charset, and a browser falls back to its locale guess:
    # an em-dash came out as "â€"" in humans.txt (owner spotted it 2026-09-20).
    # The app sets its own charset on the responses it builds; this covers
    # everything nginx serves from disk.
    charset utf-8;
    charset_types text/plain text/css text/xml application/json application/javascript text/javascript image/svg+xml;

    # /map/catalog.json is ~1.15 MB raw; gzip takes JSON ~8-10x smaller (~130 KB). html is
    # always compressed by the gzip module; the types below add the app's
    # other text payloads (catalog JSON, digested assets, inline SVG flags).
    gzip on;
    # text/javascript as well as application/javascript: nginx's own mime.types
    # switched .js to text/javascript, and MapLibre's .mjs modules below are
    # served as text/javascript too. Naming only one of the pair silently left
    # ~580 KB of module uncompressed.
    gzip_types application/json application/geo+json application/javascript text/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;

    # Undigested third-party libraries (web/public/lib/<name>/<version>/...).
    #
    # MapLibre GL JS v6 is ES-module only and its files find each other by
    # relative URL at run time, which is why it cannot go through AssetMapper's
    # content hashing and lives here instead. Two things follow:
    #
    #  - .mjs is absent from nginx's stock mime.types, so it went out as
    #    application/octet-stream and the browser refused to execute the module
    #    (a module MUST arrive as a JavaScript MIME type). `include mime.types`
    #    then `types` merges within this one context: a bare `types` block would
    #    REPLACE the inherited map rather than add to it, and take every other
    #    extension with it.
    #  - the version sits in the path, so a URL here never changes content and
    #    can be cached for a year.
    location ^~ /lib/ {
        include mime.types;
        types {
            text/javascript mjs;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Bot probes (/.env, WordPress paths) answered here, before PHP.
    include /etc/nginx/snippets/bot-probes.conf;

    # The bulk export's snapshot files (api-strategy.md §3.1), served as the
    # production frontends serve them: straight from the `exports/` folder of
    # the tile bucket, never through PHP. Only these three names under a
    # well-formed stamp come here; every other /data/export/ path (the
    # `latest` redirects among them) goes to the app.
    #
    # The headers are the object's own, written by the builder
    # (BulkExportStorage): Content-Type, Content-Length, ETag, Last-Modified,
    # Cache-Control and Content-Disposition pass through untouched, and so do
    # Range, If-Range and the conditional headers, so a 206 or a 304 comes
    # back as the bucket gives it. A missing object, or one the bucket refuses,
    # is a plain 404 that names no bucket.
    #
    # Quoted: an unquoted { in a regex is read as the start of a block.
    location ~ "^/data/export/(\d{8}T\d{6}Z)/(places\.geojson\.gz|routes\.geojson\.gz|manifest\.json)$" {
        # GET admits HEAD as well.
        limit_except GET {
            deny all;
        }
        limit_req zone=bulk_export burst=30 nodelay;
        limit_req_status 429;

        resolver 127.0.0.11 valid=10s ipv6=off;
        # NOTE: `set` must precede proxy_pass's use of the captures.
        set $export_stamp $1;
        set $export_file $2;
        # The dev tile bucket, the one DATA_EXPORT_BUCKET names in compose.yaml.
        set $export_bucket cc-maps;
        proxy_pass http://minio:9000/$export_bucket/exports/snapshots/$export_stamp/$export_file;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # Nothing of the visitor's reaches the bucket but the request itself.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";

        proxy_intercept_errors on;
        error_page 403 404 = @export_missing;

        # The bytes and their type exactly as stored: no second gzip on
        # manifest.json, and no charset appended to its Content-Type.
        gzip off;
        charset off;

        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-bucket-region;
        proxy_hide_header x-amz-version-id;
        proxy_hide_header x-amz-delete-marker;
        proxy_hide_header x-amz-expiration;
        proxy_hide_header x-amz-restore;
        proxy_hide_header x-amz-replication-status;
        proxy_hide_header x-amz-server-side-encryption;
        proxy_hide_header x-amz-storage-class;
        proxy_hide_header x-amz-tagging-count;
        proxy_hide_header x-amz-mp-parts-count;
        proxy_hide_header x-amz-website-redirect-location;
        proxy_hide_header x-amz-object-lock-mode;
        proxy_hide_header x-amz-object-lock-retain-until-date;
        proxy_hide_header x-amz-object-lock-legal-hold;
        proxy_hide_header x-amz-checksum-crc32;
        proxy_hide_header x-amz-checksum-crc32c;
        proxy_hide_header x-amz-checksum-crc64nvme;
        proxy_hide_header x-amz-checksum-sha1;
        proxy_hide_header x-amz-checksum-sha256;
        proxy_hide_header x-amz-checksum-type;
        proxy_hide_header x-minio-deployment-id;
        proxy_hide_header x-ratelimit-limit;
        proxy_hide_header x-ratelimit-remaining;
    }

    location @export_missing {
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # only the front controller is executed; everything routes through it
    location ~ ^/index\.php(/|$) {
        # Docker's DNS, re-asked every 10 s: a variable in fastcgi_pass makes nginx
        # resolve "app" per request, so a recreated app container (new IP) keeps working
        resolver 127.0.0.11 valid=10s;
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # reject direct access to any other .php file
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 16m;
}
