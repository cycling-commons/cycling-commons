#
# Bot probes, answered by nginx without starting PHP.
#
# Scanners walk every public site asking for leaked secrets and for WordPress
# (production and staging, 2026-09-28: `/api/staging/.env` seven times,
# `//cms/wp-includes/wlwmanifest.xml`). Symfony answered each with a 404 after
# booting the kernel, and every one landed in the error tracker. None of these
# paths exists here, so nginx answers first, for the price of a string match.
#
# Included inside the server block, before the PHP locations: nginx picks the
# FIRST regex location that matches, and these must win over the front
# controller. The production and staging frontends carry this same file,
# copied unchanged.

# Any path segment that starts with a dot: /.env, /api/staging/.env, /.git/,
# /.aws/credentials. /.well-known/ is the one dot path that is real
# (security.txt), so it passes on to the app.
location ~ /\.(?!well-known/) {
    return 404;
}

# WordPress and the other stacks this site is not, anywhere in the path
# (//cms/wp-includes/wlwmanifest.xml, /blog/wp-login.php). The match is on a
# whole path segment, so a slug that merely CONTAINS "wp" is left alone.
location ~* (^|/)(wp-admin|wp-includes|wp-content|wp-json|wp-login\.php|xmlrpc\.php|wlwmanifest\.xml|phpmyadmin|cgi-bin)(/|$) {
    return 404;
}
