# Dev-only static server for the Atlas demo.
# No browser caching + no sendfile/etag, so edits to atlas/demo/ always show on reload
# (avoids the "I don't see my change" stale-cache / WSL2 bind-mount confusion).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index map.html index.html;

    sendfile off;          # bind-mounted files over WSL2 can serve stale with sendfile on
    etag off;

    # ONE security.txt, and it is the application's (RFC 9116 Canonical).
    #
    # There used to be a second, static copy here, and the two promptly drifted:
    # different Expires, different Preferred-Languages, different Policy URL. A
    # security contact that disagrees with itself is worse than one that is
    # merely old, because a researcher cannot tell which is current.
    #
    # The app's copy computes its own Expires, so it cannot rot. This host just
    # points at it. Dev hygiene only: the demo goes offline when the Symfony
    # app goes live (owner 2026-08-27), so there is no deployed atlas vhost to
    # mirror this into.
    location = /.well-known/security.txt {
        return 301 https://cyclingcommons.org/.well-known/security.txt;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
