# SPDX-License-Identifier: AGPL-3.0-only
# The privacy notice in Dutch: the whole page in one file, outside the `messages`
# domain the in-site translation system reads (docs/specs/privacy-notice.md). This
# file's history is the record of every change to the page in Dutch.
privacy:
  kicker: 'Privacy'
  title: 'Wat we verzamelen, en waarom.'
  lead: 'Gewone taal. De Cycling Commons-dataset is niet-persoonlijk: open geodata over plaatsen, nooit over mensen. Het <b>platformaccount</b> is een ander verhaal: dat bevat persoonsgegevens (e-mail, inloggegevens, sessielogboeken). Dit is wat we bijhouden, waarom, en de controle die je hebt.'
  h_responsible: 'Wie is verantwoordelijk'
  responsible_p1_pre: 'De verwerkingsverantwoordelijke is'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', gevestigd in Nederland, dat de Cycling Commons vandaag beheert. Zoals beschreven in ons'
  responsible_p1_governance: 'bestuursdocument'
  responsible_p1_post: ', heeft de Commons de intentie om over te gaan naar een onafhankelijke Nederlandse stichting; de verwerkingsverantwoordelijke wordt dan overgedragen en deze pagina wordt bijgewerkt.'
  responsible_p2_pre: 'Vragen over jouw gegevens:'
  responsible_p2_mid: '. Je hebt ook het recht om een klacht in te dienen bij de Nederlandse toezichthouder, de'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'We hebben <b>geen functionaris voor gegevensbescherming (FG) aangesteld</b>, en dat hoeft ook niet: we zijn een kleine club, we volgen mensen niet op grote schaal, en bijzondere persoonsgegevens horen niet bij wat we doen (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_37">AVG art. 37</a>). Vragen en verzoeken over gegevensbescherming gaan naar hetzelfde adres als al het andere,'
  dpo_post: '. Verandert dat ooit en stellen we wel iemand aan, dan komt die naam op deze pagina.'
  h_collect: 'Wat we verzamelen'
  collect_intro: 'We vragen het minimum dat nodig is om een open, betrouwbare kaart te beheren. We vragen nooit naar je echte naam.'
  h3_account: 'Wanneer je een account aanmaakt'
  collect_account_email: 'Je <b>e-mailadres</b>, om je in te loggen, het account te beveiligen en essentiële serviceberichten te sturen.'
  collect_account_password: 'Een <b>wachtwoord</b>. Het wachtwoord zelf bewaren we nooit, alleen een versleutelde vorm ervan die niet meer terug te rekenen is naar het wachtwoord. Als je inlogt, versleutelen we wat je typt op dezelfde manier en vergelijken we de twee.'
  collect_account_displayname: 'Een <b>weergavenaam</b> die je zelf kiest. Dat mag een pseudoniem zijn, en we vragen nooit naar je echte naam. Je profiel staat <b>standaard uit</b>: zolang het uit staat, tonen je bijdragen je <b>pseudoniem</b>, bijvoorbeeld rider#k3x9q2mf, in plaats van je weergavenaam. Het is hetzelfde op alles wat je toevoegt, dus anderen zien dat één persoon het maakte, maar niet wie je bent; samen kunnen die bijdragen ongeveer laten zien waar je fietst. Zet je profiel aan en je weergavenaam, je land, de maand waarin je lid werd en je aantallen bijdragen worden openbaar.'
  collect_account_2fa: 'Als je <b>twee-factor-authenticatie (2FA)</b> inschakelt, slaan we het TOTP-geheim <b>versleuteld op</b>, en je back-upcodes uitsluitend als hashes.'
  collect_account_base: 'Een optionele <b>uitvalsbasis</b> en rijradius, als je die instelt. We bewaren niet het punt dat je kiest: we bewaren een willekeurig punt tot 2,5 km daarvandaan, zodat het bewaarde punt niet meer zegt dan ongeveer welke plaats. Het wordt alleen gebruikt om je eigen kaartweergave af te bakenen. Het wordt nooit aan andere fietsers getoond en is nooit onderdeel van de Commons-dataset.'
  collect_account_timezone: 'Je <b>tijdzone</b>, zodat de tijden die we tonen in de jouwe staan: de zone die je in je instellingen kiest, of, zolang die op automatisch staat, de zone die je browser doorgeeft (bijvoorbeeld Europe/Amsterdam). Het is de naam van een zone, geen locatie.'
  h3_contribute: 'Wanneer je bijdraagt'
  collect_contribute_items: '<b>Alles wat je in de Commons schrijft.</b> Een plek, een beklimming, een route, een correctie, een stem, een controle ter plaatse, een regiobeschrijving, een vertaling, een melding, een bericht aan een regiobeheerder: als je het typte en verstuurde, hebben wij het. Elk daarvan is gekoppeld aan het account dat het verstuurde, zodat een regiobeheerder je kan terugschrijven. Berichten aan regiobeheerders en meldingen blijven tussen jou en de regiobeheerders: ze komen nooit op de kaart of in de dataset.'
  collect_contribute_media: 'De <b>foto''s</b> die je uploadt. Een foto kan verborgen gegevens bevatten (EXIF), zoals waar hij genomen is: die halen we eruit en we coderen het bestand opnieuw, dus wat we publiceren draagt er niets meer van. Daarna schrijven we één ding terug: een stempel dat de foto onder CC BY-SA 4.0 valt, en een link naar zijn pagina op Cycling Commons. <b>Je naam komt nooit in het bestand.</b> Via die link vindt iemand die de foto hergebruikt wie hij moet noemen, en die pagina noemt jou alleen zolang je profiel openbaar is.'
  collect_contribute_traffic: '<b>Verkeerssamenvattingen</b>, alleen als je er een verstuurt vanuit het nakijken van een rit in Scout met een radar achterop: per stuk weg dat je reed, hoe ver je reed, hoeveel auto''s je inhaalden en hoe hard, het deel van de dag (nacht, ochtendspits, dag, avondspits of avond), een groep van minstens vier datums van hetzelfde soort in plaats van de datum, en of het een werkdag of weekend was. Je ritbestand en het GPS-spoor erin verlaten je apparaat nooit; welke wegen je reed, met het deel van de dag, wel. Niets binnen 500 m van het begin of eind van een rit wordt ooit verstuurd. Om de rit aan wegen te koppelen laadt je browser de kaartgegevens van dat gebied van onze server, zoals de kaart dat doet voor elk gebied dat je bekijkt. Niets wat we bewaren noemt of codeert jou. Elke regel wacht versleuteld tot zijn weg genoeg ritten van meerdere dagen heeft, en gaat dan op in gewone totalen per weg; zo komt een rit in stukken in de totalen, gemengd met andere ritten. Regiobeheerders zien alleen rustig, matig of druk per weg. De resultaten gaan alleen naar curatoren, en nooit met je naam. Vanuit hetzelfde nakijken van een rit kun je ook de <b>tags</b> versturen die je tijdens de rit zette: elke tag wordt een gewone bijdrage met zijn plek op de kaart, en gaat door dezelfde controle als elke andere. Beide zijn optioneel: per rit kies je wat je verstuurt, en je kunt ook niets versturen. Scout krijgt later meer functies; verandert er een wat er verstuurd wordt, dan verandert deze verklaring eerst.'
  collect_contribute_profile: 'Optionele publieke-profielgegevens die je invult (bio, links, welke bijdragen te tonen). Profielen zijn'
  collect_contribute_profile_link: 'opt-in'
  collect_contribute_profile_post: ' en standaard uitgeschakeld.'
  h3_auto: 'Automatisch, wanneer je de site gebruikt'
  collect_auto_technical: '<b>Technische gegevens</b>: IP-adres, browsertype en tijdstempels in onze serverlogboeken, bijgehouden om de dienst te beheren en te beveiligen.'
  collect_auto_ratelimit: '<b>Dagelijkse gebruikstellers.</b> Gebruik je een hulpmiddel zonder account, zoals de ritcontrole, dan tellen we hoe vaak je het gebruikt, zodat één bezoeker het niet voor iedereen kan opmaken. We tellen niet op je IP-adres zelf. We maken er eerst een code van die niet terug te rekenen is naar het adres, en tellen op die code. Die code is nog steeds een persoonsgegeven, dus alles op deze pagina geldt ervoor.'
  collect_auto_errors: '<b>Foutmeldingen.</b> Als er op onze server iets misgaat, schrijft die een foutmelding: wat er misging, het adres van de pagina en het moment. Er staat nooit je IP-adres, je naam, je e-mailadres of wat je in een formulier typte in. De meldingen blijven op onze eigen machines bij Hetzner, met alles wat we verder draaien (zie <b>De bedrijven die gegevens voor ons verwerken</b>).'
  banner_bold: 'Geen routeregistratie.'
  banner_body: 'De Commons is een kaart van plaatsen, niet van mensen. We verzamelen <b>geen</b> GPS-sporen, jouw routes of je live locatie. Een verkeerssamenvatting die je vanuit het nakijken van een rit in Scout verstuurt, is ook geen GPS-spoor, maar zegt wel over welke wegen je reed en in welk deel van de dag (zie <b>Wanneer je bijdraagt</b>).'
  banner_locate: '<b>Toon mijn locatie</b> op de kaart leest je positie in je eigen browser, alleen als je erop tikt, en stuurt die nergens heen: geen enkel verzoek aan ons of iemand anders bevat haar. De kaart laadt daarna de kaartbeelden van dat gebied, zoals altijd wanneer je de kaart verschuift.'
  h_why: 'Waarom we het gebruiken (rechtsgronden)'
  why_contract: '<b>Om je account en de dienst te leveren</b>: uitvoering van een overeenkomst (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_6">AVG art. 6 lid 1 sub b</a>).'
  why_consent: '<b>Je naam tonen.</b> Een openbaar profiel, en met naam genoemd worden bij wat je bijdroeg, berust op jouw toestemming (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_6">AVG art. 6 lid 1 sub a</a>). Je trekt die op elk moment in bij je'
  why_consent_link: 'instellingen'
  why_consent_post: ' en je naam verdwijnt van die pagina''s. Bij ons gebeurt dat meteen. Een kopie van een pagina die iemand anders bewaarde, is buiten ons bereik.'
  why_licence: '<b>Publiceren wat je bijdraagt.</b> Een foto of een bewerking die je aan de Commons geeft, wordt gepubliceerd onder de licentie waarmee je akkoord ging toen je hem stuurde, en dat hoort bij onze overeenkomst met jou (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_6">AVG art. 6 lid 1 sub b</a>). Die licentie is volgens haar eigen voorwaarden <b>onherroepelijk</b>, dus je toestemming intrekken haalt je naam van de pagina maar maakt de bijdrage zelf niet ongedaan. Eén uitzondering telt: staat <b>jij</b> op de foto, dan zijn dat jouw persoonsgegevens, en een auteursrechtlicentie tekent je gegevensbeschermingsrechten niet weg. Elke fotopagina heeft een link om te vragen of hij weggehaald kan worden. Een foto die je niet mocht licentiëren, was nooit geldig gelicentieerd: meld het via dezelfde link en ook die gaat offline.'
  why_updates: '<b>Je laten weten wat er nieuw is.</b> Alleen als je erom vroeg: de instelling in je account is je toestemming (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_6">AVG art. 6 lid 1 sub a</a>), en die uitzetten trekt haar in. Je kiest hoe vaak: <b>alleen groot nieuws</b>, hoogstens 4 keer per jaar, of <b>elke update</b>, hoogstens 2 keer per maand. Elk bericht heeft ook een afmeldlink met één klik, zonder inloggen. Alleen nieuws over de Commons, nooit reclame, en de lijst wordt nooit gedeeld of verkocht.'
  why_legitimate: '<b>Beveiliging, misbruikpreventie en geaggregeerde analyses</b>: onze gerechtvaardigde belangen om de Commons eerlijk en werkend te houden (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_6">AVG art. 6 lid 1 sub f</a>).'
  why_legal: '<b>Wettelijke verplichtingen nakomen</b>: waar de wet dit vereist (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_6">AVG art. 6 lid 1 sub c</a>).'
  h_cookies: 'Cookies & analyses'
  cookies_body: 'We houden dit licht. We plaatsen <b>twee cookies</b>, allebei strikt noodzakelijk, en allebei hieronder volledig opgesomd. Voor gebruiksstatistieken draaien we <b>zelfgehoste analytics</b> op onze eigen infrastructuur: die ontvangt de pagina-URL, de verwijzende pagina, je schermgrootte en je browsertype, en ontvangt je <b>IP-adres</b>, dat een persoonsgegeven is, maar <b>bewaart het niet</b>. Het adres wordt alleen gebruikt om een globale locatie te bepalen (land, regio en stad) en om er een eenrichtings-sessiekenmerk uit af te leiden, en wordt daarna weggegooid. Er worden geen analytics-cookies geplaatst, geen bezoeker krijgt een blijvend kenmerk of wordt aan een account gekoppeld, en er is geen cross-site- of cross-device-tracking. Analytics-gegevens blijven op onze eigen infrastructuur en worden nooit gedeeld met of verkocht aan derden.'
  h3_cookie_table: 'De cookies die we plaatsen'
  ck_h_name: 'Naam'
  ck_h_purpose: 'Wat die doet'
  ck_h_life: 'Hoe lang die blijft'
  ck_session_purpose: 'Houdt je ingelogd, en draagt het token dat de formulieren die je ingelogd gebruikt beschermt tegen cross-site request forgery (CSRF), een aanval waarbij een andere website je browser hier als jou een formulier laat versturen. Het wordt gezet als je inlogt, of als je een formulier gebruikt dat iets moet onthouden tussen pagina''s, zoals je wachtwoord opnieuw instellen. De kaart en de rest van de site lezen, de contactpagina inbegrepen, zet helemaal geen cookie. Het bevat een willekeurige code en verder niets: geen naam, geen e-mailadres, geen overzicht van wat je bekeek.'
  ck_session_life: 'Tot je je browser sluit'
  ck_remember_purpose: 'Logt je bij je volgende bezoek weer in zonder om je wachtwoord te vragen. Wordt <b>alleen</b> gezet als je bij het inloggen <b>Onthoud mij</b> aanvinkt, en verdwijnt zodra je uitlogt. We raden het af op een computer die anderen ook gebruiken.'
  ck_remember_life: '7 dagen'
  cookies_none_body: 'Dat is de hele lijst. We plaatsen <b>geen</b> advertentiecookie, <b>geen</b> analysecookie en <b>geen</b> cross-site-trackingcookie, op geen enkele pagina. Beide cookies hierboven zijn strikt nodig om iets te leveren waar je zelf om vroeg, dus vraagt de wet er geen toestemming voor, en daarom staat er hier geen cookiebanner. Zouden we ooit iets toevoegen dat er wél een nodig heeft, dan vragen we het je eerst in plaats van het aan te nemen.'
  cookies_local_body: 'De kaart bewaart ook een paar van je eigen instellingen in de <b>lokale opslag</b> van je browser: het lichte of donkere kaartthema, het gebied waar je het laatst keek en welke filters je aan had. Dat is geen cookie, het wordt nooit naar onze server gestuurd, en je browsergegevens wissen haalt het weg. Andere websites kunnen het niet lezen: een browser houdt de lokale opslag van elke site apart. Twee dingen kunnen het wel lezen. Iedereen die dezelfde browser op dezelfde computer gebruikt, en elk script dat op deze site draait, zoals een browserextensie die je installeerde. Niets ervan is geheim: het is je thema, je laatste kaartgebied en je filters.'
  h_share: 'Met wie we het delen'
  share_infra: '<b>De bedrijven die onze infrastructuur draaien.</b> Hosting, back-ups, accountmail, en de kaartdiensten die je browser rechtstreeks ophaalt. Ze staan allemaal met naam in de twee tabellen hieronder, met wat ze doen en wat ze kunnen zien.'
  share_osm_pre: 'OpenStreetMap: bijdragen die je kiest terug te geven worden deel van de open kaart onder de'
  share_osm_link: 'ODbL'
  share_osm_post: '. Dat zijn publieke, open data, geen persoonsgegevens over jou.'
  share_noone: '<b>Niemand anders.</b> We verkopen geen persoonsgegevens en we zetten geen advertentietracking van derden in.'
  share_selfhosted: 'Eerst wat er <b>niet</b> in deze lijsten staat. We draaien zoveel mogelijk zelf: de kaartgegevens, de routeplanning, het hoogtemodel achter de stijgingspercentages, de foto-opslag en de gebruiksstatistieken en zelfs de foutmeldingen staan op onze eigen machines. Twee diensten die we vroeger extern aanriepen, voor routes en voor hoogte, hebben we juist daarom naar binnen gehaald. Zo bouwen kost meer tijd en meer geld. Het is ook waarom je browser met vier externe diensten praat in plaats van twintig, en waarom de tabellen hieronder zo kort zijn: elke naam erin is er een die we niet redelijkerwijs zelf konden draaien.'
  h3_processors: 'De bedrijven die gegevens voor ons verwerken'
  processors_intro: 'Drie bedrijven bewaren of verwerken je gegevens in onze opdracht. Zij zijn onze <b>verwerkers</b>: ze mogen alleen doen wat wij ze opdragen, onder een schriftelijk contract, en ze mogen je gegevens nergens voor zichzelf voor gebruiken.'
  pr_h_who: 'Wie'
  pr_h_where: 'Waar'
  pr_h_what: 'Wat ze voor ons doen'
  pr_h_sees: 'Wat ze kunnen zien'
  pr_hetzner_where: 'Europese Economische Ruimte'
  pr_hetzner_what: 'Draait de machines: de website, de database de opslag met geüploade foto''s, en de foutmeldingen.'
  pr_hetzner_sees: 'In principe alles wat we bewaren, want het staat op hun hardware: je e-mailadres, je bijdragen, je foto''s, de serverlogboeken en de foutmeldingen. Wachtwoorden en tweefactorgeheimen zijn ook daar onleesbaar (zie <b>Hoe we het beschermen</b>).'
  pr_scaleway_where: 'Europese Economische Ruimte'
  pr_scaleway_what: 'Bezorgt de e-mail die de site zelf verstuurt (adresbevestiging, wachtwoordherstel, verwijdercode, moderatieberichten) en bewaart de nachtelijke back-ups.'
  pr_scaleway_sees: 'Je e-mailadres en de inhoud van de berichten die de site je stuurt. De back-ups worden op onze eigen servers versleuteld voordat ze verstuurd worden, dus aan de andere kant is de inhoud niet te lezen.'
  pr_proton_where: 'Zwitserland (gedekt door een EU-adequaatheidsbesluit)'
  pr_proton_what: 'Beheert de mailbox van het project, het adres dat op deze pagina staat, en de antwoorden die een mens hier terugschrijft.'
  pr_proton_sees: 'Je e-mailadres en wat je ons ook maar schreef, zolang het gesprek bewaard blijft.'
  h3_browser_services: 'Diensten die je browser rechtstreeks benadert'
  browser_services_intro: 'De kaart wordt in je browser samengesteld, dus een paar onderdelen komen rechtstreeks van de partij die ze publiceert en niet via ons. We geven ze nooit je account, je weergavenaam of je e-mailadres. Ze zien wel het netwerkadres waar je verzoek vandaan komt, want elk verzoek op internet draagt er een. Niets in deze lijst laadt voordat je een pagina opent die het gebruikt.'
  bs_h_service: 'Dienst'
  bs_h_what: 'Waarvoor het is'
  bs_h_sees: 'Wat die ontvangt'
  bs_sees_ip: 'Je IP-adres en welke kaartvakjes je opvroeg.'
  bs_openfreemap_what: 'De basiskaart: de wegen, het water en de plaatsnamen onder al het andere.'
  bs_esri_what: 'De satellietweergave, pas zodra je die aanzet.'
  bs_esri_sees: 'Je IP-adres en welke beeldvakjes je opvroeg. Esri zit in de Verenigde Staten.'
  bs_mapillary_what: 'Straatbeeldfoto''s, pas zodra je het straatbeeld opent.'
  bs_mapillary_sees: 'Je IP-adres en welke foto''s je opende. Mapillary wordt gerund door Meta Platforms Ireland Limited, in Ierland, en de beeldbestanden zelf komen van het contentnetwerk van Meta, dat wereldwijd is.'
  bs_photon_what: 'Plaatszoeken, terwijl je in het zoekvak typt.'
  bs_photon_sees: 'Je IP-adres en de woorden die je in het zoekvak typt. Photon draait bij komoot, in Duitsland.'
  browser_services_post: 'Eén daarvan zit buiten de Europese Economische Ruimte (EER): <b>Esri</b>, in de Verenigde Staten. Open je de satellietlaag nooit, dan neemt je browser ook nooit contact met Esri op. Zie <b>Internationale overdrachten</b> hieronder.'
  h_transfers: 'Internationale overdrachten'
  transfers_body: 'Je account, je bijdragen, je foto''s en onze back-ups blijven in de Europese Economische Ruimte (EER). Twee diensten daarbuiten zien iets. <b>Proton</b>, in Zwitserland, beheert onze mailbox en ziet dus de e-mail die je ons schrijft. De EU heeft besloten dat de Zwitserse wet persoonsgegevens even goed beschermt als de EU-wet (een adequaatheidsbesluit), dus daarvoor is geen extra contract nodig. <b>Esri</b>, in de Verenigde Staten, levert het satellietbeeld. Pas als je dat beeld aanzet, vraagt je browser Esri om de beelden, en Esri ziet dan je IP-adres en welke beelden je opvroeg. Wij sturen Esri zelf niets. De straatfoto''s van Mapillary komen via het wereldwijde netwerk van Meta, dat ze van buiten de EER kan leveren; dat ziet hetzelfde als Esri, en pas als je de straatweergave opent.'
  h_retention: 'Hoe lang we het bewaren'
  retention_account: '<b>Accountgegevens.</b> Tot je je account verwijdert, en dan zijn ze weg. Verwijderen gebeurt direct: je vraagt het aan, wij mailen je een code, je bevestigt, en op dat moment verdwijnt het account uit de live database. Het e-mailadres, de wachtwoordhash, het tweefactorgeheim en de back-upcodes gaan mee. Er is geen wachttijd en er wordt niets achtergehouden voor het geval je van gedachten verandert. Onze nachtelijke back-ups bevatten het oude record nog tot ze uitrouleren, en dat duurt <b>hoogstens 90 dagen</b>; die back-ups zijn versleuteld en gaan alleen open om van een ramp te herstellen. Een account waarop <b>24 maanden</b> niemand heeft ingelogd, wordt op dezelfde manier verwijderd. We mailen je eerst, drie keer: na 12, 22 en 23 maanden, telkens met de datum waarop het sluit. Eén keer inloggen is genoeg om het te houden.'
  retention_unconfirmed: '<b>Onbevestigde accounts.</b> Een account waarvan het e-mailadres niet binnen <b>7 dagen</b> bevestigd is, wordt verwijderd, zonder waarschuwingsmail. Het adres kan van iemand zijn die zich nooit aanmeldde, en de enige mail die we konden sturen, zou bij die persoon terechtkomen.'
  retention_logs: '<b>Serverlogboeken.</b> Hoogstens <b>90 dagen</b> bewaard en daarna automatisch verwijderd. Sommige regels bevatten een volledig IP-adres. Volledige adressen bewaren we maar kort, voor beveiliging en de aanpak van misbruik.'
  retention_ratelimit: '<b>Dagelijkse gebruikstellers.</b> Eén dag.'
  retention_contributions: '<b>Bijdragen.</b> Feiten die je teruggaf aan de open kaart blijven bestaan als onderdeel van de Commons (met herkomst), ook nadat je vertrekt; het zijn geen persoonsgegevens over jou.'
  retention_traffic: '<b>Verkeerssamenvattingen.</b> Een regel wacht versleuteld tot zijn weg genoeg ritten heeft, gaat dan op in de totalen per weg en wordt verwijderd. De totalen blijven deel van de Commons. Er staat geen fietser in, dus er wordt niets uit verwijderd als je je account verwijdert.'
  retention_messages: '<b>Berichten over je bijdragen.</b> De berichten tussen jou en de regiobeheerders over wat je bijdroeg, blijven bewaard zolang je account bestaat en worden ermee verwijderd. Dat geldt ook voor je bijdragen die werden afgewezen of die je introk voordat een regiobeheerder erover besliste. Wat een regiobeheerder goedkeurde, blijft op de kaart, zonder je naam. Een bijdrage die voor een juridische zaak wordt vastgehouden, blijft met haar berichten bewaard zolang dat duurt.'
  retention_consent: '<b>Licentietoestemmingen.</b> Wanneer je een foto onder licentie aan de Commons geeft, leggen we vast dat je akkoord ging, met welke tekst precies, en wanneer. We bewaren die vastlegging onbeperkt, en ze blijft bestaan nadat je je account sluit: het is ons bewijs dat de licentie is verleend, dat we nodig kunnen hebben om een rechtsvordering in te stellen of te verdedigen (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_17">AVG art. 17(3)(e)</a>). Ze bevat een accountverwijzing en verder niets over jou, en zodra het account weg is, identificeert die verwijzing hier niemand meer.'
  retention_mail: '<b>E-mail en berichten via het contactformulier die je ons stuurt.</b> We bewaren een gesprek zolang de zaak loopt, en verwijderen het binnen <b>24 maanden</b> nadat die is afgerond. Dat dekt jou als je er een jaar later op terugkomt, en het dekt ons als er laat een klacht komt over hoe we het hebben aangepakt. Gesprekken die deel uitmaken van een juridische kwestie, zoals een auteursrechtclaim of een verwijderverzoek, bewaren we tot die kwestie is afgehandeld.'
  retention_bugs: '<b>Bugmeldingen.</b> Een bugmelding blijft bewaard, als deel van het overzicht van wat er stuk was en hoe het is opgelost. Het e-mailadres dat je opgaf voor ons antwoord bewaren we zolang de bug openstaat, en we verwijderen het <b>24 maanden</b> nadat we je de uitkomst hebben laten weten, dezelfde termijn als voor e-mail die je ons stuurt.'
  retention_reports: '<b>Meldingen over inhoud.</b> Meld je iets op de site, ook een foto waarop jij staat, dan bewaren we het adres dat je achterliet voor ons antwoord tot we over je melding hebben besloten: we hebben ingegrepen, we vonden niets mis, of we hebben de melding gesloten omdat ze niet meer van toepassing is. We verwijderen het adres <b>90 dagen</b> na dat besluit. De melding zelf blijft bewaard, als vastlegging van wat ons werd gemeld en wat we ermee hebben gedaan. Wordt de gemelde foto vastgehouden voor een juridische zaak, dan bewaren we het adres tot die vasthouding is opgeheven.'
  retention_updates: '<b>De uitgavelijst.</b> Je adres blijft erop tot je het er zelf afhaalt, via je instellingen of via de link in elk bericht. We bewaren de vastlegging dat je akkoord ging, en met welke tekst, net als bij een fotolicentie: dat is het bewijs dat we je mochten schrijven.'
  h_security: 'Hoe we het beschermen'
  security_intro: 'De wet vraagt ons maatregelen te nemen die bij het risico passen (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_32">AVG art. 32</a>). In gewone woorden:'
  security_passwords: '<b>Je wachtwoord wordt nooit bewaard.</b> We houden er alleen een onomkeerbare versleuteling van, dus niemand hier kan je wachtwoord lezen en een gestolen database geeft niemand het jouwe in handen.'
  security_secrets: '<b>Tweefactorgeheimen en back-upcodes zijn versleuteld waar ze staan</b>, met de sleutel buiten de database. Wie alleen de database steelt, krijgt er nog steeds geen werkende code uit.'
  security_transport: '<b>Alles gaat versleuteld</b>, tussen jou en ons, en opnieuw wanneer een back-up onze servers verlaat. Browsers krijgen te horen dat ze een onversleutelde verbinding met ons helemaal moeten weigeren.'
  security_access: '<b>Alleen wie je gegevens nodig heeft kan erbij</b>, en elke regiobeheerder en beheerder moet met twee factoren inloggen. Herhaalde mislukte inlogpogingen worden afgeremd en daarna geblokkeerd.'
  security_source_pre: 'Dat is de korte versie. De precieze maatregelen, en de redenering achter elke keuze, staan in onze'
  security_source_link: 'openbare broncode'
  security_source_post: '. Daar bouwen we het in de openbaarheid voor: je hoeft een veiligheidsalinea niet op ons woord te geloven.'
  security_honest: 'Geen systeem is perfect en we doen niet alsof het onze dat wel is. Er zit geen certificering achter deze alinea en geen pentest: wat er wel is, is een klein systeem dat zo weinig mogelijk bewaart, en code die iedereen kan nakijken.'
  h_breach: 'Als er ooit gegevens uitlekken'
  breach_pre: 'Als persoonsgegevens verloren gaan, blootliggen of bereikt worden door iemand die dat niet hoort, en dat waarschijnlijk een risico vormt voor de rechten van mensen, melden we het bij de'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>binnen 72 uur</b> nadat we het weten (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_33">AVG art. 33</a>). Is het risico voor jou persoonlijk hoog, dan nemen we ook rechtstreeks en zonder uitstel contact met je op (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_34">AVG art. 34</a>), in gewone taal: wat er gebeurd is, welke van je gegevens erbij betrokken waren, wat we eraan gedaan hebben en wat jij moet doen. We houden intern een register bij van elk datalek, ook de lekken die we niet hoeven te melden, zodat het patroon voor ons zichtbaar blijft ook als geen enkel geval op zichzelf meldingsplichtig is.'
  h_rights: 'Jouw rechten'
  rights_intro: 'Onder de <a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679">AVG</a> heb je de volgende rechten:'
  rights_access: '<b>Inzage (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_15">AVG art. 15</a>)</b>: vraag een kopie op van de persoonsgegevens die we over je bewaren.'
  rights_correct: '<b>Rectificatie (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_16">AVG art. 16</a>)</b>: corrigeer onjuiste gegevens, of vul ontbrekende gegevens aan.'
  rights_erase: '<b>Verwijdering (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_17">AVG art. 17</a>)</b>: verwijder je account op elk moment vanuit je accountinstellingen. Je persoonsgegevens gaan mee en komen niet terug. Sommige dingen blijven nog even: onze versleutelde back-ups bevatten het oude record tot ze vervangen zijn, hoogstens 90 dagen, en een bijdrage die voor een juridische zaak wordt vastgehouden, blijft zolang dat duurt. Twee dingen blijven bewust bestaan, en geen van beide identificeert je daarna: de bijdragen die je aan de open kaart gaf, en het record dat je een fotolicentie verleende. Dit alles staat hierboven onder <b>Hoe lang we het bewaren</b>.'
  rights_portability: '<b>Gegevensoverdraagbaarheid (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_20">AVG art. 20</a>)</b>: download wat we over je bewaren als één ZIP-bestand vanuit je accountinstellingen, tot 3 keer per dag. Die grens is er alleen om misbruik te stoppen. Het bevat onder meer je accountgegevens, je bijdragen, je berichten, je licentietoestemmingen en je foto''s als bestanden.'
  rights_restrict: '<b>Beperking en bezwaar (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_18">AVG art. 18–21</a>)</b>: beperk of maak bezwaar tegen bepaalde verwerkingen.'
  rights_withdraw: '<b>Toestemming intrekken</b> op elk moment, bijvoorbeeld door je openbare profiel of de nieuwsmails uit te zetten. Vanaf dat moment stoppen we met wat je toestond. Wat we daarvoor met je toestemming deden, blijft rechtmatig (<a href="https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679#art_7">AVG art. 7 lid 3</a>).'
  rights_third_party_photo: '<b>Geen gebruiker?</b> Deze rechten hangen niet af van een account. Sta je herkenbaar op een foto op onze kaart, dan heeft elke fotopagina een link <b>"deze foto toont mij"</b>. Meld het daar, zonder account en zonder identiteitsbewijs, en een regiobeheerder antwoordt uiterlijk binnen een maand.'
  rights_contact_pre: 'Stuur voor de uitoefening van elk van deze rechten een e-mail naar'
  rights_contact_mid: '. We antwoorden <b>uiterlijk binnen een maand</b>, en normaal gesproken veel eerder. De wet staat tot drie maanden toe voor een verzoek dat echt ingewikkeld is, maar alleen als we je binnen die eerste maand laten weten dat het langer duurt, en waarom. Ben je niet tevreden met ons antwoord, dan kun je klagen bij de'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Kinderen'
  children_body: 'De Commons is niet bedoeld voor kinderen jonger dan <b>16</b>. We verzamelen niet bewust persoonsgegevens van mensen onder die leeftijd; als je denkt dat een kind ons gegevens heeft verstrekt, neem dan contact op en we verwijderen ze.'
  h_automated: 'Geautomatiseerde beslissingen'
  automated_body: 'We nemen geen beslissingen over je op basis van uitsluitend geautomatiseerde verwerking, en we profileren je niet voor advertenties.'
  h_changes: 'Wijzigingen in dit beleid'
  changes_body: 'Als we veranderen hoe we met gegevens omgaan, voegen we hier een nieuwe versie toe, met de datum en wat er veranderde, en tonen we ingelogde fietsers een melding tot ze die gelezen hebben. Je account onthoudt welke versie je het laatst zag.'
  changes_versions_pre: 'Bekijk de'
  changes_versions_link: 'revisiegeschiedenis'
  changes_versions_post: ' op GitHub.'
  footer_disc_pre: 'Zie ook onze'
  footer_disc_terms: 'Gebruiksvoorwaarden'
  footer_disc_mid: 'en de data-, media- en code-'
  footer_disc_licences: 'licenties'
  footer_disc_post: '.'
  version_line: 'Versie %n% · %date%'
  changed_bar: 'Onze privacyverklaring is gewijzigd op %date%.'
  changed_read: 'Lees wat er is veranderd'
  change:
    v1_first: 'De eerste genummerde versie. Eerdere tekst staat in de revisiegeschiedenis hieronder.'
    v2_traffic: 'Nieuw: vanuit de ritcontrole in Scout kun je een <b>verkeerssamenvatting</b> van een rit met radar versturen: per weg de afstand, de auto’s en het deel van de dag. Je GPS-spoor blijft op je apparaat. Zie wat we verzamelen en hoe lang we het bewaren.'
    v2_time_zone: 'Nieuw: we bewaren je <b>tijdzone</b>, de zone die je in je instellingen kiest of die je browser doorgeeft, om tijden daarin te tonen.'
    v2_pseudonym: 'Gecorrigeerd: met je profiel uit tonen je bijdragen je vaste <b>pseudoniem</b>, niet helemaal geen naam.'
    v2_base_location: 'Gewijzigd: je <b>uitvalsbasis</b> wordt bewaard als een willekeurig punt tot 2,5 km van het punt dat je kiest, in plaats van een punt afgerond op ongeveer 1 km.'
    v2_clearer: 'Makkelijker te lezen. De verklaring zegt dat beide dingen die je vanuit Scout kunt versturen, verkeerssamenvattingen en tags, bij elke rit je eigen keuze zijn. Ze legt in gewone woorden uit hoe we je wachtwoord bewaren, waarom we tellen hoe vaak een hulpmiddel zonder account wordt gebruikt, en wat de kaart in je eigen browser bewaart. Bij elke dienst buiten de EER staat wat die dienst ziet. Elk AVG-artikel dat ze noemt, linkt naar de wettekst zelf.'
    v2_errors: 'Toegevoegd: <b>foutmeldingen</b> van onze server, wat erin staat, en dat ze op onze eigen machines blijven.'
