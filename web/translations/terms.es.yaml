# The terms of use in Spanish: the whole page in one file, outside the `messages`
# domain the in-site translation system reads (docs/specs/translations.md §6). This
# file's history is the record of every change to the page in Spanish.
terms:
  kicker: 'Condiciones de uso'
  title: 'El acuerdo, en lenguaje claro.'
  lead: 'Estas condiciones regulan el uso del sitio web y de la cuenta de Cycling Commons, en lenguaje claro.'
  last_updated: 'Última actualización: 1 de agosto de 2026'
  h1_accepting: 'Aceptación de estas condiciones'
  accepting_p1_pre: 'Al usar el sitio web de Cycling Commons o crear una cuenta, aceptas estas condiciones y nuestro'
  accepting_p1_privacy: 'aviso de privacidad'
  accepting_p1_mid: '. Si no estás de acuerdo, no uses el servicio. El Commons lo opera'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' en los Países Bajos, camino de una fundación independiente como se describe en nuestra'
  accepting_p1_governance: 'gobernanza'
  accepting_p1_post: '.'
  h2_who: 'Quién puede usarlo'
  who_body: 'Necesitas tener al menos <b>16</b> años para crear una cuenta. La información que nos facilites (como tu correo electrónico) debe ser exacta y de tu titularidad.'
  h3_account: 'Tu cuenta'
  account_password: 'Guarda bien tu contraseña; eres responsable de la actividad realizada con tu cuenta.'
  account_unauthorised: 'Avísanos sin demora si sospechas de un acceso no autorizado.'
  account_suspend: 'Podemos suspender o cerrar cuentas usadas para abusar del servicio o incumplir estas condiciones.'
  h4_using: 'Usarlo bien'
  using_intro: 'El Commons funciona porque la gente lo usa de buena fe.'
  using_no_illegal: 'No infrinjas la ley, no acoses a nadie y no publiques contenido ilícito, engañoso o dañino.'
  using_no_personal: 'No subas <b>datos personales de otras personas</b> (por ejemplo, personas identificables en fotos) sin una base adecuada — el Commons cartografía lugares, no personas.'
  using_no_reidentify_pre: 'No intentes reidentificar a los colaboradores ni socavar el'
  using_no_reidentify_link: 'límite de captación'
  using_no_reidentify_post: ' del proyecto, que es lo que mantiene fuera los datos personales.'
  using_no_scrape_pre: 'No hagas scraping del servicio. Punto — la'
  using_no_scrape_link: 'API y la exportación masiva'
  using_no_scrape_post: ' son la forma de obtener los datos. Ninguna de las dos está activa todavía, así que hasta entonces escribe a info@cyclingcommons.org y te daremos lo que necesites.'
  using_no_disrupt: 'No interrumpas el servicio ni intentes esquivar sus límites.'
  h5_contributions: 'Tus aportaciones'
  contributions_p1_pre: 'Conservas la autoría de lo que aportas. Para que el Commons pueda ser abierto, concedes las licencias de nuestras'
  contributions_p1_link: 'condiciones para colaboradores'
  contributions_p1_mid: ': los <b>datos</b> se incorporan al Commons bajo la'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', los <b>medios</b> (fotos, vídeo) bajo'
  contributions_p1_mid3: ', y las <b>traducciones de la interfaz</b> bajo'
  contributions_p1_agpl: 'AGPL-3.0-only'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Confirmas que tienes derecho a aportar lo que envías, que no vulnera derechos de terceros y que no son datos personales de otras personas.'
  h6_opendata: 'Datos abiertos y API'
  opendata_pre: 'Los datos y los medios del Commons son de uso libre para cualquiera, también con fines comerciales, bajo sus'
  opendata_link: 'licencias'
  opendata_mid: ', citando la fuente. Las traducciones de la interfaz también son de uso libre, bajo la licencia del código, que pide el código fuente en lugar de solo la atribución. Consulta la'
  opendata_dev_link: 'documentación para desarrolladores'
  opendata_post: ' para la línea de atribución, y para la API y la exportación masiva tal como se están diseñando — ninguna de las dos está activa todavía.'
  h7_code: 'Nuestro código y nuestra marca'
  code_pre: 'El código fuente de la plataforma es <b>software libre</b> bajo la'
  code_link: 'GNU Affero General Public License v3'
  code_post: ': cualquiera puede ejecutarlo, estudiarlo, modificarlo y compartirlo, también con fines comerciales. Lo que la licencia pide a cambio es el código fuente. Si ejecutas una versión modificada y dejas que otras personas la usen por red, también les debes tu código fuente. El nombre y el logotipo «Cycling Commons» <b>no</b> están cubiertos por esa licencia y siguen siendo del proyecto, algo que la sección 7(e) de la AGPL permite expresamente. Lo que puedes hacer con ellos se explica en nuestra'
  code_brand_link: 'política de marca'
  code_brand_post: '.'
  h8_preview: 'Una intención, no una garantía'
  preview_body: 'Cycling Commons es una intención, <b>no</b> una garantía. No dependas de él para la navegación, el estado de las carreteras ni tu seguridad — usa siempre tu propio criterio cuando ruedes.'
  h9_warranty: 'Sin garantías'
  warranty_body: 'El servicio se presta <b>«tal cual»</b> y «según disponibilidad», sin garantías de ningún tipo, en la máxima medida que permita la ley. No garantizamos que sea exacto, ininterrumpido ni libre de errores.'
  h10_liability: 'Responsabilidad'
  liability_body: 'En la máxima medida permitida por el Derecho neerlandés, BikeCoders no responde de los daños indirectos o consecuentes derivados de tu uso del Commons. Nada en estas condiciones limita la responsabilidad que la ley no permite limitar.'
  h11_suspension: 'Suspensión y finalización'
  suspension_pre: 'Puedes cerrar tu cuenta cuando quieras en los'
  suspension_link: 'ajustes'
  suspension_post: '. Podemos suspender o retirar el acceso si se incumplen estas condiciones o para proteger el Commons o a sus usuarios.'
  suspension_p2: 'Antes de irte puedes <b>descargar todo lo que tenemos sobre ti</b> en un único archivo ZIP desde esa misma página. Cerrar la cuenta elimina tus datos personales. Dos cosas se quedan, y ninguna te nombra después: las aportaciones que hiciste al mapa abierto y el registro de que concediste una licencia de foto, que conservamos como prueba de que la licencia existe. Las fotos que se hubieran aprobado siguen en el Commons bajo CC BY-SA 4.0, y al marcharte eliges si mantienen tu nombre o pasan a ser anónimas.'
  h12_moderation: 'Cómo funciona la moderación'
  mod_intro: 'El Commons se construye con lo que aporta la gente, así que parte de ello hay que revisarlo. Esta sección dice qué retiramos, quién decide, qué se le comunica y qué puede hacer al respecto.'
  mod_standard_h: 'Qué se retira'
  mod_std1: '<b>Todo lo ilícito.</b> Incluido lo que vulnera los derechos de otra persona.'
  mod_std2: '<b>Datos personales de otras personas.</b> El Commons cartografía lugares, no personas. Una persona reconocible en una foto, un nombre, una matrícula, una casa señalada como el domicilio de alguien.'
  mod_std3: '<b>Cosas que sencillamente no son ciertas.</b> Una fuente que nunca estuvo ahí, un firme que no se corresponde con el terreno, un puerto inventado para manipular una clasificación.'
  mod_std4: '<b>Los abusos.</b> Acoso, amenazas, o contenido dirigido a una persona en lugar de a un lugar.'
  mod_std5: '<b>La publicidad.</b> El Commons no es un directorio, y un lugar no está en él porque alguien pagara o lo pidiera.'
  mod_std6: '<b>Fotografías que no lo son.</b> Una imagen generada o alterada de forma sustancial por IA, por buena que parezca. El Commons es un mapa del mundo real, y la imagen de un lugar que nunca ha tenido ese aspecto vale menos que ninguna imagen.'
  h13_ai: 'Dónde intervienen las máquinas'
  ai_intro: 'Lista corta, y preferimos contártela a que la adivines:'
  ai_translation: '<b>Traducción automática.</b> Algunas descripciones de lugares vienen de Wikipedia en el idioma local y se traducen automáticamente al inglés. Todas llevan la marca <b>auto-translated</b> allí donde aparecen, porque una traducción automática de un puerto puede estar mal de una forma que se lee perfectamente.'
  ai_checks: '<b>Comprobaciones automáticas.</b> Un programa revisa el catálogo buscando cosas que parecen erróneas, dos fuentes a un metro una de otra, un enlace que ya no responde, y se las pone delante a una persona curadora. Señala; nunca decide.'
  ai_none: '<b>Nada más.</b> Ni chatbot, ni texto generado que hagamos pasar por nuestro, ni decisiones automatizadas sobre ti o tu cuenta, ni elaboración de perfiles. Si eso cambia algún día, esta sección cambia primero.'
  ai_uploads: '<b>Lo que no puedes subir.</b> Nada de imágenes generadas por IA, ni escenas alteradas. La edición normal está bien, con herramientas de IA o sin ellas: recortar, enderezar, ajustar el color, enfocar, quitar el ruido. Inventar o borrar algo que estaba ahí no lo está, y una imagen hecha por un modelo tampoco. El único cambio que pedimos: difumina caras y matrículas antes de subir. El consentimiento que marcas antes de subir lo dice, y es motivo de retirada.'
  ai_stance: 'Con esto no reclamamos el cumplimiento de nada. Las reglas de transparencia del Reglamento europeo de IA empiezan a aplicarse el <b>2 de agosto de 2026</b>, y es discutible hasta dónde alcanzan la descripción de una fuente. Te lo diríamos igualmente, porque un mapa solo vale si puedes distinguir lo que ha puesto una persona.'
  mod_who_h: 'Quién decide'
  mod_who: 'Decide un <b>curador</b>, y un curador es una persona. Los curadores son ciclistas que se presentaron y fueron aceptados, trabajan con un reglamento escrito, y cada decisión queda registrada con su nombre.'
  mod_automated: '<b>Nada se retira solo por software.</b> Hay comprobaciones automáticas que marcan cosas para que las mire un curador, pero nunca deciden. La única excepción funciona al revés y está para proteger a las personas, no para juzgarlas: una denuncia de imagen íntima o relativa a un menor oculta la foto de inmediato, antes de que nadie la haya visto, y después la revisa un curador.'
  mod_told_h: 'Qué se le comunica'
  mod_told_pre: 'Si algo que añadió se retira o se cambia, se lo decimos, con el motivo. El mensaje indica de qué se trataba y en qué se basó la decisión. Lo encontrará en sus'
  mod_told_link: 'mensajes'
  mod_told_post: '.'
  mod_appeal_h: 'Si no está de acuerdo'
  mod_appeal_pre: 'Responda a ese mensaje y un curador lo lee. Si prefiere hacerlo fuera de la cuenta, o ya no tiene una, escríbanos por la'
  mod_appeal_link: 'página de contacto'
  mod_appeal_post: '. Una decisión no es definitiva por haberse tomado una vez; un curador que se equivocó puede deshacerla.'
  mod_report_h: 'Denunciar algo'
  mod_report_pre: 'Cualquiera puede denunciar contenido, con o sin cuenta. Use la'
  mod_report_link: 'página de contacto'
  mod_report_post: ', o el enlace para denunciar en la propia foto. Confirmamos cada denuncia y te decimos qué decidimos. Las fotos tienen su propio enlace en cada página de foto.'
  h12_governing: 'Ley aplicable'
  governing_body: 'Estas condiciones se rigen por el Derecho de <b>los Países Bajos</b>. Los litigios se someterán a los tribunales neerlandeses competentes, salvo que la normativa imperativa de consumo te reconozca otros derechos.'
  h13_changes: 'Cambios'
  changes_body: 'Podemos actualizar estas condiciones; publicaremos los cambios aquí con una fecha nueva. Seguir usando el Commons después de un cambio significa que aceptas las condiciones actualizadas.'
  h14_contact: 'Contacto'
  contact_pre: 'Preguntas sobre estas condiciones:'
  contact_post: '.'
  footer_disc_pre: 'Consulta también nuestro'
  footer_disc_privacy: 'aviso de privacidad'
  footer_disc_mid: 'y las'
  footer_disc_licences: 'licencias'
  footer_disc_post: ' de los datos, los medios, las traducciones de la interfaz y el código.'
