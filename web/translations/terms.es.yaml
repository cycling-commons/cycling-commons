# domain the in-site translation system reads (docs/specs/translations.md §6). This
# file's history is the record of every change to the page in Spanish.
terms:
  kicker: 'Condiciones de uso'
  title: 'El acuerdo, en lenguaje claro.'
  lead: 'Estas condiciones regulan el uso del sitio web y de la cuenta de Cycling Commons, en lenguaje claro.'
  version_line: 'Versión %n% · %date%'
  changed_bar: 'Nuestras condiciones de uso cambiaron el %date%.'
  changing_bar: 'Nuestras condiciones de uso cambian el %date%.'
  changed_read: 'Ver qué ha cambiado'
  upcoming_box: 'A partir del %date% se aplica una nueva versión.'
  upcoming_link: 'Leer la nueva versión'
  next_box: 'Esta es la nueva versión. Se aplica a partir del %date%.'
  next_back: 'Leer la versión que se aplica ahora'
  h1_accepting: 'Aceptación de estas condiciones'
  accepting_p1_pre: 'Al usar el sitio web de Cycling Commons o crear una cuenta, aceptas estas condiciones y nuestro'
  accepting_p1_privacy: 'aviso de privacidad'
  accepting_p1_mid: '. Si no estás de acuerdo, no uses el servicio. El Commons lo opera'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' en los Países Bajos. Cómo se gobierna el proyecto, y hacia dónde va, se explica en nuestra página de'
  accepting_p1_governance: 'gobernanza'
  accepting_p1_post: '.'
  h2_who: 'Quién puede usarlo'
  who_body: 'Necesitas tener al menos <b>16</b> años para crear una cuenta. La información que nos facilites (como tu correo electrónico) debe ser exacta y de tu titularidad.'
  h3_account: 'Tu cuenta'
  account_password: 'Guarda bien tu contraseña; eres responsable de la actividad realizada con tu cuenta.'
  account_unauthorised: 'Avísanos sin demora si sospechas de un acceso no autorizado.'
  account_suspend: 'Podemos suspender o eliminar una cuenta usada para abusar del servicio o incumplir estas condiciones, como explica la sección 11.'
  h4_using: 'Usarlo bien'
  using_intro: 'El Commons funciona porque la gente lo usa de buena fe.'
  using_no_illegal: 'No infrinjas la ley, no acoses a nadie y no publiques contenido ilícito, engañoso o dañino.'
  using_no_personal: 'No subas <b>datos personales de otras personas</b> (por ejemplo, personas identificables en fotos) sin una base adecuada: el Commons cartografía lugares, no personas.'
  using_no_reidentify_pre: 'No intentes reidentificar a los colaboradores ni socavar el'
  using_no_reidentify_link: 'límite de captación'
  using_no_reidentify_post: ' del proyecto, que es lo que mantiene fuera los datos personales.'
  using_no_scrape_pre: 'No hagas scraping del servicio. La'
  using_no_scrape_link: 'página para desarrolladores'
  using_no_scrape_post: ' indica cómo obtener los datos, y para un uso masivo o sin conexión hay una'
  using_no_scrape_export_link: 'exportación gratuita'
  using_no_scrape_mid: '. Si lo que necesitas no está ahí, escríbenos desde la'
  using_no_scrape_contact_link: 'página de contacto'
  using_no_scrape_end: ' y veremos qué podemos hacer.'
  using_no_disrupt: 'No interrumpas el servicio ni intentes esquivar sus límites.'
  h5_contributions: 'Tus aportaciones'
  contributions_p1_pre: 'Conservas la autoría de lo que aportas. Para que el Commons pueda ser abierto, concedes las licencias de nuestras'
  contributions_p1_link: 'condiciones para colaboradores'
  contributions_p1_mid: ': los <b>datos</b> se incorporan al Commons bajo la'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', los <b>medios</b> (fotos, vídeo) bajo'
  contributions_p1_mid3: ', y el <b>código, la interfaz y las traducciones</b> bajo'
  contributions_p1_agpl: 'AGPL-3.0-only'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Confirmas que tienes derecho a aportar lo que envías, que no vulnera derechos de terceros y que no son datos personales de otras personas.'
  h6_opendata: 'Datos abiertos y API'
  opendata_pre: 'Los datos y los medios del Commons son de uso libre para cualquiera, también con fines comerciales, bajo sus'
  opendata_link: 'licencias'
  opendata_mid: ', citando la fuente. El código, la interfaz y las traducciones también son de uso libre, bajo AGPL-3.0-only, que pide el código fuente en lugar de solo la atribución. Consulta la'
  opendata_dev_link: 'documentación para desarrolladores'
  opendata_post: ' para la línea de atribución y las formas actuales de obtener los datos.'
  opendata_export_pre: 'Para un uso masivo o sin conexión, descarga la'
  opendata_export_link: 'exportación gratuita'
  opendata_export_post: '. Contiene los lugares y las rutas del Commons en GeoJSON, bajo la ODbL 1.0 para la base de datos y la DbCL 1.0 para su contenido. Cada registro indica su fuente, y se dejan fuera los registros cuya licencia no nos permite cederlos. No contiene datos personales, nada que esté aún pendiente de un curador, ni fotos.'
  h7_code: 'Nuestro código y nuestra marca'
  code_pre: 'El código fuente de la plataforma es <b>software libre</b> bajo la'
  code_link: 'GNU Affero General Public License v3'
  code_post: ': cualquiera puede ejecutarlo, estudiarlo, modificarlo y compartirlo, también con fines comerciales. Lo que la licencia pide a cambio es el código fuente. Si ejecutas una versión modificada y dejas que otras personas la usen por red, también les debes tu código fuente. El nombre y el logotipo «Cycling Commons» <b>no</b> están cubiertos por esa licencia y siguen siendo del proyecto, algo que la sección 7(e) de la AGPL permite expresamente. Lo que puedes hacer con ellos se explica en nuestra'
  code_brand_link: 'política de marca'
  code_brand_post: '.'
  h8_preview: 'Una intención, no una garantía'
  preview_body: 'Cycling Commons es una intención, <b>no</b> una garantía. No dependas de él para la navegación, el estado de las carreteras ni tu seguridad. Usa siempre tu propio criterio cuando ruedes.'
  h9_warranty: 'Sin garantías'
  warranty_body: 'El servicio se presta <b>«tal cual»</b> y «según disponibilidad», sin garantías de ningún tipo, en la máxima medida que permita la ley. No garantizamos que sea exacto, ininterrumpido ni libre de errores.'
  h10_liability: 'Responsabilidad'
  liability_body: 'En la máxima medida permitida por el Derecho neerlandés, BikeCoders no responde de los daños indirectos o consecuentes derivados de tu uso del Commons. Nada en estas condiciones limita la responsabilidad que la ley no permite limitar.'
  h11_suspension: 'Cerrar y eliminar cuentas'
  suspension_pre: 'Puedes cerrar tu cuenta cuando quieras en los'
  suspension_link: 'ajustes'
  suspension_post: '.'
  suspension_dormant: 'Una cuenta en la que nadie ha iniciado sesión durante <b>24 meses</b> se elimina de la misma forma. Antes te escribimos tres veces, a los 12, 22 y 23 meses, y basta con iniciar sesión una vez para conservarla. Una cuenta cuyo correo no se confirma en <b>7 días</b> se elimina sin aviso, porque la dirección puede ser de alguien que nunca se registró.'
  suspension_p2: 'Antes de irte puedes <b>descargar todo lo que tenemos sobre ti</b> en un único archivo ZIP desde esa misma página. Cerrar la cuenta elimina tus datos personales del sitio en el acto; nuestras copias de seguridad cifradas los conservan como máximo 90 días, como explica el aviso de privacidad. Tus solicitudes para ser curador se van con ella. Una petición de abrir un país solo se queda como un recuento anónimo, sin tu nota ni tu oferta de ser curador allí. Algunas cosas se quedan, sin vínculo con tu cuenta: lo que aportaste al mapa abierto, tus confirmaciones y tus marcas «La he rodado» (salvo en una ruta que propusiste tú, donde nunca contaron y se borran), el historial de ediciones, tus informes de errores y el registro de que concediste una licencia de foto, que conservamos como prueba de que la licencia existe. Las fotos aprobadas siguen en el Commons bajo CC BY-SA 4.0. Si tu perfil es público, al marcharte eliges si mantienen tu nombre visible; si no, pasan a ser anónimas. Lo que esté bajo conservación legal, por ejemplo porque quizá deba llegar a las autoridades, se guarda hasta que se levante la conservación.'
  suspension_admin: 'Un administrador puede <b>suspender</b> una cuenta de 1 a 365 días, o <b>eliminarla</b>, si se usa para abusar, para incumplir estas condiciones o para perjudicar al Commons o a quienes lo usan. El motivo siempre es uno de estos: abuso, spam, contenido ilícito, uso del servicio en contra de estas condiciones (como hacer scraping, perturbarlo o esquivar sus límites), datos de la cuenta que no son exactos o no son tuyos, aportaciones que no son ciertas, publicidad, o datos personales de otras personas. Mientras dura una suspensión, no puedes iniciar sesión, y una sesión ya abierta termina. Termina sola en la fecha y la hora que te indicamos. Lo que añadiste se queda donde está, y los 24 meses tras los cuales se elimina una cuenta sin uso se cuentan desde el final de la suspensión. La eliminación es inmediata y borra la cuenta igual que si la cerraras tú.'
  suspension_told: 'En ambos casos te enviamos por correo una exposición de motivos: qué decidimos, el motivo, los hechos, si hubo denuncias que llevaron a ello, y cómo recurrir. Tras una eliminación, se envía a tu dirección justo después de borrar la cuenta. Si crees que nos equivocamos, responde a ese correo o escríbenos desde la página de contacto; volvemos a revisar la decisión y te decimos qué hemos decidido.'
  h12_moderation: 'Cómo funciona la moderación'
  mod_intro: 'El Commons se construye con lo que aporta la gente, así que parte de ello hay que revisarlo. Esta sección dice qué retiramos, quién decide, qué se te comunica y qué puedes hacer al respecto.'
  mod_standard_h: 'Qué se retira'
  mod_std1: '<b>Todo lo ilícito.</b> Incluido lo que vulnera los derechos de otra persona.'
  mod_std2: '<b>Datos personales de otras personas.</b> El Commons cartografía lugares, no personas. Una persona reconocible en una foto, un nombre, una matrícula, una casa señalada como el domicilio de alguien.'
  mod_std3: '<b>Cosas que sencillamente no son ciertas.</b> Una fuente que nunca estuvo ahí, un firme que no se corresponde con el terreno, un puerto inventado para manipular una clasificación.'
  mod_std4: '<b>Los abusos.</b> Acoso, amenazas, o contenido dirigido a una persona en lugar de a un lugar.'
  mod_std5: '<b>La publicidad.</b> El Commons no es un directorio, y un lugar no está en él porque alguien pagara o lo pidiera.'
  mod_std6: '<b>Fotografías que no lo son.</b> Una imagen generada o alterada de forma sustancial por IA, por buena que parezca. El Commons es un mapa del mundo real, y la imagen de un lugar que nunca ha tenido ese aspecto vale menos que ninguna imagen.'
  mod_std7: '<b>Imágenes íntimas, o una foto en la que aparece un menor.</b> Una foto denunciada por este motivo primero se oculta y después se revisa, como explica «Quién decide».'
  mod_std8: '<b>Propiedad privada que no debería ser pública.</b> Un camino de entrada privado, un jardín, una vista del interior de una casa. Puede que la foto se tomara legalmente; aun así, un curador sopesa la petición del propietario.'
  mod_std9: '<b>La obra de otra persona.</b> Una foto o un texto que no hiciste tú y que no puedes compartir con nuestras licencias. Quien tiene los derechos puede denunciarlo como obra suya, y quien lo añadió puede responder una vez.'
  mod_accept: 'Un curador revisa lo que envía la gente. Una aportación tiene que ser exacta, comprobable y algo que el Commons cartografía; un curador rechaza lo que no lo es. Cuando dos entradas describen el mismo lugar, un curador conserva una y retira la otra del mapa.'
  h13_ai: 'Dónde intervienen las máquinas'
  ai_intro: 'Lista corta, y preferimos contártela a que la adivines:'
  ai_translation: '<b>Traducción automática.</b> Algunas descripciones de lugares están traducidas automáticamente desde otro idioma. Todas llevan una marca que lo indica allí donde aparecen, porque una traducción automática de un puerto puede estar mal de una forma que se lee perfectamente.'
  ai_none: '<b>Nada más.</b> Ni chatbot, ni texto generado que hagamos pasar por nuestro, ni elaboración de perfiles. Lo poco que el software hace por sí solo, como rechazar un archivo infectado o eliminar una cuenta nunca confirmada, está en «Quién decide», en la sección 12. Si esa lista crece algún día, estas secciones cambian primero.'
  ai_checks: '<b>Comprobaciones automáticas.</b> Un programa busca cosas que parecen erróneas, como dos fuentes a un metro una de otra, un lugar que podría ser el mismo que uno de OpenStreetMap o un enlace que figura en una lista de sitios peligrosos, y lo que encuentra se lo pone delante a un curador. Señala; decide un curador.'
  ai_uploads: '<b>Lo que no puedes subir.</b> Nada de imágenes generadas por IA, ni escenas alteradas. La edición normal está bien, con herramientas de IA o sin ellas: recortar, enderezar, ajustar el color, enfocar, quitar el ruido. Inventar o borrar algo que estaba ahí no lo está, y una imagen hecha por un modelo tampoco. Difuminar caras y matrículas está permitido, y es bienvenido. El consentimiento que marcas antes de subir dice lo mismo, y una foto que lo incumpla puede retirarse.'
  ai_stance: 'Con esto no reclamamos el cumplimiento de nada. El Reglamento europeo de IA tiene reglas de transparencia, y es discutible hasta dónde alcanzan la descripción de una fuente. Te lo decimos porque un mapa solo vale si puedes distinguir lo que ha puesto una persona.'
  mod_who_h: 'Quién decide'
  mod_who: 'Decide un <b>curador</b> o un <b>administrador</b>, siempre una persona. Trabajan con un reglamento escrito, y cada decisión queda registrada con su nombre.'
  mod_escalate: '<b>Amenazas para la vida o la seguridad.</b> Cuando algo hace sospechar un delito que amenaza la vida o la seguridad de alguien, un curador lo pasa a un administrador. Una foto o un envío se oculta en el acto y queda bajo conservación legal. El administrador informa a la policía o a la autoridad judicial del país afectado, o de los Países Bajos si no está claro, y le da lo que tenemos y necesita, lo que puede incluir los datos de la cuenta de quien lo publicó. El material se conserva hasta que esa autoridad diga que puede borrarse.'
  mod_automated: '<b>Lo que el software hace por sí solo.</b> La mayoría de las comprobaciones automáticas solo marcan cosas para que las mire una persona (sección 13). Estas actúan sin esperar a nadie:'
  mod_auto_files: '<b>Archivos.</b> Cada archivo que subes se analiza en busca de software malicioso y se comprueba antes de publicarse. Un archivo infectado, ilegible o que no está en un formato y un tamaño que aceptemos se rechaza, y te lo decimos.'
  mod_auto_scenic: '<b>Miradores.</b> Una foto en un mirador tiene que mostrar la vista desde ese punto. Si se tomó a más de 250 m del marcador, o no podemos saber dónde se tomó, queda oculta en ese lugar hasta que un curador confirme que se tomó allí.'
  mod_auto_urgent: '<b>Denuncias urgentes.</b> Una denuncia de imagen íntima o relativa a un menor oculta la foto de inmediato, antes de que nadie haya visto la denuncia, y después la revisa un curador. Esto protege a las personas; no las juzga. Esta ocultación automática tiene límites, para que el formulario no pueda usarse para retirar fotos en masa; una denuncia por encima de ellos pasa al principio de la lista de los curadores, y se avisa a un administrador.'
  mod_auto_accounts: '<b>Cuentas.</b> Las cuentas sin confirmar y las que llevan 24 meses sin usarse se eliminan, como explica la sección 11. Demasiados intentos fallidos de inicio de sesión bloquean un tiempo el acceso a una cuenta.'
  mod_told_h: 'Qué se te comunica'
  mod_told_pre: 'Cuando una decisión restringe algo que añadiste, te enviamos una exposición de motivos, en tus'
  mod_told_link: 'mensajes'
  mod_told_post: ' y por correo. Eso incluye un envío, una ruta o una traducción que un curador rechaza; una foto que se retira; una foto que se oculta tras una denuncia urgente, una vez que un curador la ha revisado, también cuando después vuelve al mapa; fotos que un curador deja fuera al decidir sobre el resto; un lugar o una ruta que se retira del mapa, también cuando un curador conserva otra entrada como el mismo lugar; una aportación que va a la papelera por abuso; una denuncia admitida sobre algo que añadiste; y un archivo que rechazan nuestras comprobaciones de subida. La exposición dice qué se decidió y qué abarca, los hechos, si hubo una denuncia, si nuestro software actuó por sí solo, la norma o la ley en que se basa, y cómo recurrir. Un curador que rechaza algo siempre escribe una nota, y la exposición la cita.'
  mod_told_p2: 'Una pregunta de un curador sobre algo que enviaste, o una foto restablecida tras una denuncia, también te llega a tus mensajes. Algunas decisiones no envían nada. Un envío que un curador manda a la papelera como spam desaparece sin mensaje, como permite el Reglamento de Servicios Digitales; se puede restaurar durante 30 días. Lo que está bajo conservación para las autoridades no recibe exposición de motivos mientras dura la conservación; la decisión posterior, sí. Una edición de un curador o de otro ciclista no envía nada, porque no restringe nada tuyo. Una exposición sobre un lugar va al ciclista cuyo lugar nuevo aprobó un curador; un lugar que vino de OpenStreetMap o de otra fuente no tiene autor a quien avisar. Los textos de región y las fichas de localidad no tienen un único autor, así que un cambio en ellos no llega a nadie.'
  mod_appeal_h: 'Si no estás de acuerdo'
  mod_appeal_pre: 'Responde al correo que te trajo la exposición, con su referencia, y volvemos a revisar la decisión. Si no te llegó nada, si prefieres no responder por correo o ya no tienes cuenta, escríbenos desde la'
  mod_appeal_link: 'página de contacto'
  mod_appeal_post: '. Una decisión no es definitiva por haberse tomado una vez; un curador que se equivocó puede cambiarla.'
  mod_report_h: 'Denunciar algo'
  mod_report_pre: 'Cualquiera puede denunciar contenido, con o sin cuenta. Usa la'
  mod_report_link: 'página de contacto'
  mod_report_post: ', o el enlace para denunciar en la propia página o foto. Una denuncia necesita una dirección de correo, salvo la que trata de imágenes íntimas o de un menor, que puedes enviar sin ella. Cuando tenemos una dirección (con sesión iniciada, la de tu cuenta), confirmamos que hemos recibido la denuncia y te decimos qué decidimos.'
  mod_report_p2: 'El formulario ofrece los motivos de arriba, y «Otra cosa» para lo que no encaje. Un curador que actúa sobre «Otra cosa» nombra primero la norma que se incumple.'
  h14_governing: 'Ley aplicable'
  governing_body: 'Estas condiciones se rigen por el Derecho de <b>los Países Bajos</b>, y los litigios corresponden a los tribunales neerlandeses competentes. Si usas el Commons como consumidor y vives en la UE, conservas la protección de la normativa imperativa de tu propio país, y puedes llevar un litigio a los tribunales de donde vives. Nosotros solo podemos demandarte allí.'
  h15_changes: 'Cambios'
  changes_body: 'Cuando estas condiciones cambian, añadimos aquí una nueva versión, con su fecha y lo que cambió, y mostramos un aviso a los ciclistas con sesión iniciada hasta que la hayan leído. Un cambio importante, como una nueva norma o un cambio en tus derechos, se envía además por correo a cada cuenta al menos 30 días antes de aplicarse, para que puedas leerlo y cerrar tu cuenta antes si no estás de acuerdo. Seguir usando el Commons después de que un cambio se aplique significa que lo aceptas.'
  changes_included: 'Estas condiciones incluyen otros tres textos: las condiciones para colaboradores (sección 5), la política de marca (sección 7) y la página de licencias con los textos de licencia que enlaza. Un cambio importante en cualquiera de ellos se anuncia igual que un cambio de estas condiciones, por correo al menos 30 días antes de aplicarse. Las correcciones de redacción, como una errata o un enlace roto, se aplican de inmediato.'
  changes_versions_pre: 'Consulta el'
  changes_versions_link: 'historial de revisiones'
  changes_versions_post: ' en GitHub.'
  h16_contact: 'Contacto'
  contact_pre: 'Preguntas sobre estas condiciones:'
  contact_post: '.'
  contact_poc_pre: 'Nuestra'
  contact_poc_link: 'página de contacto'
  contact_poc_post: ' es nuestro punto único de contacto para ciclistas y para autoridades, también en virtud del Reglamento europeo de Servicios Digitales. Puedes escribirnos en inglés, francés, neerlandés, alemán o español.'
  footer_disc_pre: 'Consulta también nuestro'
  footer_disc_privacy: 'aviso de privacidad'
  footer_disc_mid: 'y las'
  footer_disc_licences: 'licencias'
  footer_disc_post: ' de los datos, los medios, el código, la interfaz y las traducciones.'
  change:
    v2_data: 'Obtener los datos: las condiciones remiten a la página para desarrolladores, que indica cómo obtenerlos, en lugar de decir qué está activo, y nombran la exportación gratuita para un uso masivo o sin conexión. El scraping sigue prohibido.'
    v2_code: 'Contribuciones: el código, la interfaz y las traducciones se nombran juntos, todos bajo AGPL-3.0-only.'
    v2_backups: 'Cerrar una cuenta: las condiciones dicen que nuestras copias de seguridad cifradas conservan los datos personales como máximo 90 días, como ya decía el aviso de privacidad.'
    v2_notice: 'Cómo te avisamos de los cambios: un cambio importante te llega por correo al menos 30 días antes de aplicarse, y uno más pequeño recibe aquí una nueva versión.'
    v2_more: 'Moderación y cuentas: las condiciones enumeran todos los motivos que puede alegar una denuncia, lo que el software hace por sí solo, qué se te comunica tras una decisión, cuándo se elimina una cuenta, y que un consumidor conserva el Derecho y los tribunales de su propio país.'
    v2_reasons: 'Qué se te comunica: cuando una decisión restringe algo que añadiste, recibes una exposición de motivos en tus mensajes y por correo, con los hechos, la norma y cómo recurrir. Las condiciones dicen también qué no acepta un curador.'
    v2_suspension: 'Suspensión: un administrador puede ahora suspender una cuenta de 1 a 365 días, no solo eliminarla. Las condiciones enumeran los motivos, y ambas decisiones llegan con una exposición de motivos por correo.'
    v2_authorities: 'Amenazas para la vida o la seguridad: las condiciones explican cómo se conserva ese contenido y cómo un administrador informa a la policía o a una autoridad judicial.'
    v2_included: 'Textos incluidos: las condiciones para colaboradores, la política de marca y la página de licencias forman parte de las condiciones, y un cambio importante en ellos se anuncia de la misma forma.'
    v1_first: 'La primera versión numerada. La redacción anterior está en el historial de revisiones enlazado abajo.'
