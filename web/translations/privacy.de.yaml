# SPDX-License-Identifier: AGPL-3.0-only
# The privacy notice in German: the whole page in one file, outside the `messages`
# domain the in-site translation system reads (docs/specs/privacy-notice.md). This
# file's history is the record of every change to the page in German.
privacy:
  kicker: 'Datenschutz'
  title: 'Was wir erheben, und warum.'
  lead: 'Klare Sprache. Der Cycling-Commons-Datensatz ist nicht-personenbezogen: offene Geodaten über Orte, niemals über Menschen. Das <b>Plattformkonto</b> ist eine andere Sache: es enthält personenbezogene Daten (E-Mail, Zugangsdaten, Sitzungsprotokolle). Hier ist, was wir vorhalten, warum und welche Kontrolle du darüber hast.'
  h_responsible: 'Wer verantwortlich ist'
  responsible_p1_pre: 'Der Verantwortliche ist'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', mit Sitz in den Niederlanden, das Cycling Commons heute betreut. Wie in unserer'
  responsible_p1_governance: 'Governance'
  responsible_p1_post: 'dargelegt, ist The Commons verpflichtet, in eine unabhängige niederländische Stiftung auszugliedern; der Verantwortliche überträgt entsprechend, und diese Seite wird aktualisiert.'
  responsible_p2_pre: 'Fragen zu deinen Daten:'
  responsible_p2_mid: '. Du hast auch das Recht, eine Beschwerde bei der niederländischen Aufsichtsbehörde einzureichen, der'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'Wir haben <b>keine Datenschutzbeauftragte und keinen Datenschutzbeauftragten bestellt</b>, und das Gesetz verlangt es von uns auch nicht: wir sind ein kleiner Betrieb, wir überwachen niemanden in großem Umfang, und besondere Kategorien personenbezogener Daten gehören nicht zu unserer Tätigkeit (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_37">DSGVO Art. 37</a>). Fragen und Anträge zum Datenschutz gehen an dieselbe Adresse wie alles andere,'
  dpo_post: '. Sollte sich das ändern und wir doch jemanden bestellen, wird diese Seite den Namen nennen.'
  h_collect: 'Was wir erheben'
  collect_intro: 'Wir fragen nur das Minimum ab, das nötig ist, um eine offene, rechenschaftspflichtige Karte zu betreiben. Wir fragen nie nach deinem echten Namen.'
  h3_account: 'Wenn du ein Konto erstellst'
  collect_account_email: 'Deine <b>E-Mail-Adresse</b>, um dich anzumelden, das Konto zu sichern und wichtige Servicenachrichten zu senden.'
  collect_account_password: 'Ein <b>Passwort</b>. Das Passwort selbst speichern wir nie, nur eine verschlüsselte Form davon, aus der es sich nicht zurückrechnen lässt. Wenn du dich anmeldest, verschlüsseln wir deine Eingabe auf dieselbe Weise und vergleichen beides.'
  collect_account_displayname: 'Ein <b>Anzeigename</b>, den du wählst. Er darf ein Pseudonym sein, und wir fragen nie nach deinem echten Namen. Dein Profil ist <b>standardmäßig aus</b>: Solange es aus ist, zeigen deine Beiträge dein <b>Pseudonym</b>, zum Beispiel rider#k3x9q2mf, statt deines Anzeigenamens. Es ist auf allem, was du hinzufügst, dasselbe: Andere sehen, dass eine Person es erstellt hat, aber nicht wer; zusammen können diese Beiträge ungefähr zeigen, wo du fährst. Schalte dein Profil ein, und dein Anzeigename, dein Land, der Monat deiner Anmeldung und deine Beitragszahlen werden öffentlich.'
  collect_account_2fa: 'Wenn du die <b>Zwei-Faktor-Authentifizierung (2FA)</b> aktivierst, speichern wir das TOTP-Geheimnis <b>verschlüsselt im Ruhezustand</b>, und deine Backup-Codes nur als Hashes.'
  collect_account_base: 'Ein optionaler <b>Standort</b> und Fahrradius, falls du einen festlegst. Wir speichern nicht den Punkt, den du wählst: wir speichern einen zufälligen Punkt bis zu 2,5 km davon entfernt, sodass der gespeicherte Punkt kaum mehr verrät als ungefähr den Ort. Er dient nur dazu, deine eigene Kartenansicht einzugrenzen. Er wird nie anderen Fahrer:innen gezeigt und ist nie Teil des Commons-Datensatzes.'
  collect_account_timezone: 'Deine <b>Zeitzone</b>, damit die angezeigten Uhrzeiten deine sind: die Zone aus deinen Einstellungen oder, solange dort automatisch gewählt ist, die Zone, die dein Browser meldet (zum Beispiel Europe/Amsterdam). Es ist ein Zonenname, kein Standort.'
  h3_contribute: 'Wenn du beiträgst'
  collect_contribute_items: '<b>Alles, was du in The Commons schreibst.</b> Ein Ort, ein Anstieg, eine Route, eine Korrektur, eine Stimme, eine Prüfung vor Ort, eine Regionsbeschreibung, eine Übersetzung, eine Meldung, eine Nachricht an eine Kuratorin oder einen Kurator: wenn du es getippt und abgeschickt hast, haben wir es. Jedes davon ist mit dem Konto verknüpft, das es gesendet hat, damit das Kuratorenteam dir antworten kann. Nachrichten an das Kuratorenteam und Meldungen bleiben zwischen dir und dem Kuratorenteam: sie erscheinen nie auf der Karte oder im Datensatz.'
  collect_contribute_media: 'Die <b>Fotos</b>, die du hochlädst. Ein Foto kann verborgene Daten enthalten (EXIF), etwa den Aufnahmeort: die entfernen wir und kodieren die Datei neu, was wir veröffentlichen trägt also nichts davon. Danach schreiben wir eine Sache zurück: einen Vermerk, dass das Bild unter CC BY-SA 4.0 steht, und einen Link auf seine Seite bei Cycling Commons. <b>Dein Name kommt nie in die Datei.</b> Über diesen Link findet jemand, der das Foto weiterverwendet, wen er nennen muss, und diese Seite nennt dich nur, solange dein Profil öffentlich ist.'
  collect_contribute_traffic: '<b>Verkehrszusammenfassungen</b>, nur wenn du eine aus der Fahrtprüfung in Scout mit einem Rückradar sendest: für jedes Straßenstück, das du gefahren bist, wie weit du gefahren bist, wie viele Autos dich überholt haben und wie schnell, die Tageszeit (Nacht, Morgenspitze, Tag, Abendspitze oder Abend), eine Gruppe von mindestens vier Daten derselben Art statt des Datums und ob es ein Werktag oder ein Wochenende war. Deine Fahrtdatei und ihre GPS-Spur verlassen dein Gerät nie; welche Straßen du gefahren bist, mit Tageszeit, schon. Nichts im Umkreis von 500 m um Start oder Ziel einer Fahrt wird je gesendet. Um die Fahrt Straßen zuzuordnen, lädt dein Browser die Kartendaten des Gebiets von unserem Server, wie die Karte es für jedes Gebiet tut, das du ansiehst. Nichts, was wir speichern, nennt oder codiert dich. Jede Zeile wartet verschlüsselt, bis ihre Straße genug Fahrten von mehreren Tagen hat, und geht dann in einfache Summen pro Straße ein; so kommt eine Fahrt in Stücken in die Summen, gemischt mit anderen Fahrten. Kuratoren sehen nur ruhig, mäßig oder stark befahren pro Straße. Die Ergebnisse sehen nur Kuratoren, und nie mit deinem Namen. Aus derselben Fahrtprüfung kannst du auch die <b>Tags</b> senden, die du während der Fahrt gesetzt hast: jedes wird ein gewöhnlicher Beitrag mit seiner Stelle auf der Karte und durchläuft dieselbe Prüfung wie jeder andere. Beides ist freiwillig: pro Fahrt wählst du, was du sendest, und du kannst auch nichts senden. Scout bekommt später weitere Funktionen; ändert eine davon, was gesendet wird, ändert sich zuerst diese Erklärung.'
  collect_contribute_profile: 'Optionale öffentliche Profilangaben, die du ausfüllst (Bio, Links, welche Beiträge gezeigt werden sollen). Profile sind'
  collect_contribute_profile_link: 'opt-in'
  collect_contribute_profile_post: ' und standardmäßig deaktiviert.'
  h3_auto: 'Automatisch, wenn du die Seite nutzt'
  collect_auto_technical: '<b>Technische Daten</b>: IP-Adresse, Browsertyp und Zeitstempel in unseren Serverprotokollen, aufbewahrt zum Betrieb und zur Absicherung des Dienstes.'
  collect_auto_ratelimit: '<b>Tägliche Nutzungszähler.</b> Wenn du ein Werkzeug ohne Konto nutzt, etwa die Fahrtprüfung, zählen wir deine Nutzungen, damit nicht eine einzelne Person das Werkzeug für alle aufbraucht. Wir zählen nicht auf deine IP-Adresse selbst. Wir machen daraus zuerst einen Code, aus dem sich die Adresse nicht zurückrechnen lässt, und zählen auf diesen Code. Dieser Code ist trotzdem ein personenbezogenes Datum, also gilt alles auf dieser Seite auch für ihn.'
  collect_auto_errors: '<b>Fehlerberichte.</b> Wenn auf unserem Server etwas schiefgeht, schreibt er einen Fehlerbericht: was schiefging, die Adresse der Seite und den Zeitpunkt. Er enthält nie deine IP-Adresse, deinen Namen, deine E-Mail-Adresse oder das, was du in ein Formular getippt hast. Die Berichte bleiben auf unseren eigenen Maschinen bei Hetzner, mit allem anderen, was wir betreiben (siehe <b>Die Unternehmen, die Daten für uns verarbeiten</b>).'
  banner_bold: 'Kein Tourentracking.'
  banner_body: 'The Commons ist eine Karte von Orten, nicht von Menschen. Wir erheben <b>keine</b> GPS-Spuren, deine Routen oder deinen aktuellen Standort. Eine Verkehrszusammenfassung, die du aus der Fahrtprüfung in Scout sendest, ist auch keine GPS-Spur, sagt aber, welche Straßen du gefahren bist und zu welcher Tageszeit (siehe <b>Wenn du beiträgst</b>).'
  banner_locate: '<b>Meinen Standort zeigen</b> auf der Karte liest deine Position in deinem eigenen Browser, nur wenn du die Schaltfläche antippst, und schickt sie nirgendwohin: keine Anfrage an uns oder an andere enthält sie. Die Karte lädt danach die Kartenbilder dieses Gebiets, wie immer, wenn du die Karte verschiebst.'
  h_why: 'Warum wir es verwenden (Rechtsgrundlagen)'
  why_contract: '<b>Zur Bereitstellung deines Kontos und des Dienstes</b>: Erfüllung eines Vertrages (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. b</a>).'
  why_consent: '<b>Deinen Namen zeigen.</b> Ein öffentliches Profil, und namentlich genannt zu werden für das, was du beigetragen hast, beruht auf deiner Einwilligung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. a</a>). Du kannst sie jederzeit widerrufen in deinen'
  why_consent_link: 'Einstellungen'
  why_consent_post: ', dann verschwindet dein Name von diesen Seiten. Bei uns geschieht das sofort. Eine Kopie einer Seite, die jemand anderes gespeichert hat, liegt außerhalb unserer Reichweite.'
  why_licence: '<b>Veröffentlichen, was du beiträgst.</b> Ein Foto oder eine Bearbeitung, die du The Commons gibst, wird unter der Lizenz veröffentlicht, der du beim Absenden zugestimmt hast, und das gehört zu unserer Vereinbarung mit dir (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. b</a>). Diese Lizenz ist nach ihren eigenen Bedingungen <b>unwiderruflich</b>: eine widerrufene Einwilligung nimmt deinen Namen von der Seite, macht den Beitrag selbst aber nicht rückgängig. Eine Ausnahme zählt: zeigt das Foto <b>dich</b>, sind das deine personenbezogenen Daten, und eine Urheberrechtslizenz unterschreibt deine Datenschutzrechte nicht weg. Jede Fotoseite hat einen Link, um die Entfernung zu beantragen. Ein Foto, das du nicht lizenzieren durftest, war nie gültig lizenziert: sag es uns über denselben Link, dann wird es ebenfalls entfernt.'
  why_updates: '<b>Dir sagen, was neu ist.</b> Nur wenn du es wolltest: die Einstellung in deinem Konto ist deine Einwilligung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. a</a>), und sie auszuschalten widerruft sie. Du wählst, wie oft: <b>nur große Neuigkeiten</b>, höchstens 4-mal im Jahr, oder <b>jedes Update</b>, höchstens 2-mal im Monat. Jede Nachricht enthält außerdem einen Abmeldelink mit einem Klick, ohne Anmeldung. Nur Neuigkeiten über The Commons, nie Werbung, und die Liste wird nie weitergegeben oder verkauft.'
  why_legitimate: '<b>Sicherheit, Missbrauchsverhinderung und aggregierte Analysen</b>: unsere berechtigten Interessen daran, The Commons ehrlich und funktionsfähig zu halten (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. f</a>).'
  why_legal: '<b>Erfüllung gesetzlicher Pflichten</b>: wo das Gesetz es verlangt (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. c</a>).'
  h_cookies: 'Cookies & Analysen'
  cookies_body: 'Wir halten das simpel. Wir setzen <b>zwei Cookies</b>, beide unbedingt erforderlich und beide unten vollständig aufgeführt. Für Nutzungsstatistiken betreiben wir <b>selbst gehostete Analytics</b> auf unserer eigenen Infrastruktur: Sie erhalten die Seiten-URL, den Referrer, die Bildschirmgröße und den Browsertyp, und sie erhalten deine <b>IP-Adresse</b>, die personenbezogen ist, <b>speichern sie aber nicht</b>. Die Adresse dient nur dazu, einen ungefähren Ort zu bestimmen (Land, Region und Stadt) und daraus eine Einweg-Sitzungskennung abzuleiten, und wird danach verworfen. Es werden keine Analytics-Cookies gesetzt, kein Besucher erhält eine dauerhafte Kennung oder wird mit einem Konto verknüpft, und es gibt kein Cross-Site- oder Cross-Device-Tracking. Die Analysedaten bleiben auf unserer eigenen Infrastruktur und werden niemals an Dritte weitergegeben oder verkauft.'
  h3_cookie_table: 'Die Cookies, die wir setzen'
  ck_h_name: 'Name'
  ck_h_purpose: 'Wofür es da ist'
  ck_h_life: 'Wie lange es bleibt'
  ck_session_purpose: 'Hält dich angemeldet und trägt das Token, das die Formulare, die du angemeldet nutzt, gegen Cross-Site Request Forgery (CSRF) schützt, einen Angriff, bei dem eine andere Website deinen Browser hier in deinem Namen ein Formular absenden lässt. Es wird gesetzt, wenn du dich anmeldest oder ein Formular nutzt, das sich etwas von einer Seite zur nächsten merken muss, etwa beim Zurücksetzen deines Passworts. Die Karte und den Rest der Seite zu lesen, die Kontaktseite eingeschlossen, setzt überhaupt kein Cookie. Es enthält eine zufällige Kennung und sonst nichts: keinen Namen, keine E-Mail-Adresse, keine Aufzeichnung dessen, was du angesehen hast.'
  ck_session_life: 'Bis du den Browser schließt'
  ck_remember_purpose: 'Meldet dich beim nächsten Besuch wieder an, ohne nach deinem Passwort zu fragen. Wird <b>nur</b> gesetzt, wenn du beim Anmelden <b>Angemeldet bleiben</b> ankreuzt, und verschwindet beim Abmelden. Auf einem Computer, den auch andere nutzen, raten wir davon ab.'
  ck_remember_life: '7 Tage'
  cookies_none_body: 'Das ist die ganze Liste. Wir setzen <b>kein</b> Werbe-Cookie, <b>kein</b> Analyse-Cookie und <b>kein</b> Cross-Site-Tracking-Cookie, auf keiner Seite. Beide Cookies oben sind unbedingt erforderlich, um etwas zu liefern, worum du selbst gebeten hast, deshalb verlangt das Gesetz dafür keine Einwilligung, und darum gibt es hier kein Cookie-Banner. Sollten wir je etwas hinzufügen, das eines braucht, fragen wir dich vorher, statt es anzunehmen.'
  cookies_local_body: 'Die Karte speichert außerdem ein paar deiner eigenen Einstellungen im <b>lokalen Speicher</b> deines Browsers: das helle oder dunkle Kartenthema, das zuletzt angesehene Gebiet und welche Filter du eingeschaltet hattest. Das ist kein Cookie, es wird nie an unseren Server gesendet, und das Löschen deiner Browserdaten entfernt es. Andere Websites können es nicht lesen: ein Browser hält den lokalen Speicher jeder Website getrennt. Zwei Dinge können es trotzdem lesen. Jede Person, die denselben Browser auf demselben Computer nutzt, und jedes Skript, das auf dieser Seite läuft, etwa eine Browsererweiterung, die du installiert hast. Nichts davon ist geheim: es ist dein Thema, dein letztes Kartengebiet und deine Filter.'
  h_share: 'Mit wem wir es teilen'
  share_infra: '<b>Die Unternehmen, die unsere Infrastruktur betreiben.</b> Hosting, Backups, Konto-E-Mails und die Kartendienste, die dein Browser direkt abruft. Alle sind in den beiden Tabellen unten namentlich genannt, mit dem, was sie tun, und dem, was sie sehen können.'
  share_osm_pre: 'OpenStreetMap: Beiträge, die du zurückgeben möchtest, werden Teil der offenen Karte unter der'
  share_osm_link: 'ODbL'
  share_osm_post: '. Das sind öffentliche, offene Daten, keine personenbezogenen Daten über dich.'
  share_noone: '<b>Niemand sonst.</b> Wir verkaufen keine personenbezogenen Daten und betreiben kein Drittanbieter-Werbetracking.'
  share_selfhosted: 'Zuerst, was <b>nicht</b> in diesen Listen steht. Wir betreiben so viel wie möglich selbst: die Kartendaten, die Routenplanung, das Höhenmodell hinter den Steigungen, den Fotospeicher und die Nutzungsstatistik und sogar die Fehlerberichte laufen auf unseren eigenen Maschinen. Zwei Dienste, die wir früher von außen geholt haben, für Routen und für Höhen, sind genau deswegen zu uns gewandert. So zu bauen dauert länger und kostet mehr. Es ist auch der Grund, warum dein Browser mit vier fremden Diensten spricht statt mit zwanzig, und warum die Tabellen unten so kurz sind: jeder Name darin ist einer, den wir nicht vernünftig selbst betreiben konnten.'
  h3_processors: 'Die Unternehmen, die Daten für uns verarbeiten'
  processors_intro: 'Drei Unternehmen halten oder verarbeiten deine Daten in unserem Auftrag. Sie sind unsere <b>Auftragsverarbeiter</b>: sie dürfen nur tun, was wir ihnen vorgeben, auf Grundlage eines schriftlichen Vertrags, und sie dürfen deine Daten für nichts Eigenes verwenden.'
  pr_h_who: 'Wer'
  pr_h_where: 'Wo'
  pr_h_what: 'Was sie für uns tun'
  pr_h_sees: 'Was sie sehen können'
  pr_hetzner_where: 'Europäischer Wirtschaftsraum'
  pr_hetzner_what: 'Betreibt die Maschinen: die Website, die Datenbank den Speicher für hochgeladene Fotos und die Fehlerberichte.'
  pr_hetzner_sees: 'Im Prinzip alles, was wir speichern, denn es liegt auf ihrer Hardware: deine E-Mail-Adresse, deine Beiträge, deine Fotos, die Serverprotokolle und die Fehlerberichte. Passwörter und Zwei-Faktor-Geheimnisse sind auch dort unlesbar (siehe <b>Wie wir es schützen</b>).'
  pr_scaleway_where: 'Europäischer Wirtschaftsraum'
  pr_scaleway_what: 'Stellt die E-Mails zu, die die Seite selbst verschickt (Adressbestätigung, Passwort-Zurücksetzung, Löschcode, Moderationsnachrichten), und bewahrt die nächtlichen Backups auf.'
  pr_scaleway_sees: 'Deine E-Mail-Adresse und den Inhalt der Nachrichten, die die Seite dir schickt. Die Backups werden auf unseren eigenen Servern verschlüsselt, bevor sie das Haus verlassen, ihr Inhalt ist am anderen Ende also nicht lesbar.'
  pr_proton_where: 'Schweiz (durch einen EU-Angemessenheitsbeschluss gedeckt)'
  pr_proton_what: 'Beherbergt das Postfach des Projekts, die Adresse auf dieser Seite, und die Antworten, die ein Mensch hier zurückschreibt.'
  pr_proton_sees: 'Deine E-Mail-Adresse und alles, was du uns geschrieben hast, solange das Gespräch aufbewahrt wird.'
  h3_browser_services: 'Dienste, die dein Browser direkt kontaktiert'
  browser_services_intro: 'Die Karte wird in deinem Browser zusammengesetzt, ein paar Teile kommen deshalb direkt von denen, die sie veröffentlichen, und nicht über uns. Wir geben ihnen nie dein Konto, deinen Anzeigenamen oder deine E-Mail-Adresse. Sie sehen aber die Netzwerkadresse, von der deine Anfrage kommt, denn jede Anfrage im Internet trägt eine. Nichts aus dieser Liste lädt, bevor du eine Seite öffnest, die es benutzt.'
  bs_h_service: 'Dienst'
  bs_h_what: 'Wofür er da ist'
  bs_h_sees: 'Was er erhält'
  bs_sees_ip: 'Deine IP-Adresse und welche Kartenkacheln du angefordert hast.'
  bs_openfreemap_what: 'Die Grundkarte: die Straßen, die Gewässer und die Ortsnamen unter allem anderen.'
  bs_esri_what: 'Die Satellitenansicht, erst wenn du sie einschaltest.'
  bs_esri_sees: 'Deine IP-Adresse und welche Bildkacheln du angefordert hast. Esri sitzt in den Vereinigten Staaten.'
  bs_mapillary_what: 'Straßenbilder, erst wenn du die Straßenansicht öffnest.'
  bs_mapillary_sees: 'Deine IP-Adresse und welche Fotos du geöffnet hast. Mapillary wird von Meta Platforms Ireland Limited in Irland betrieben, und die Bilddateien selbst kommen aus Metas Content-Netzwerk, das weltweit ist.'
  bs_photon_what: 'Ortssuche, während du ins Suchfeld tippst.'
  bs_photon_sees: 'Deine IP-Adresse und die Wörter, die du ins Suchfeld tippst. Photon wird von komoot in Deutschland betrieben.'
  browser_services_post: 'Einer davon liegt außerhalb des Europäischen Wirtschaftsraums (EWR): <b>Esri</b>, in den Vereinigten Staaten. Öffnest du die Satellitenebene nie, nimmt dein Browser auch nie Kontakt zu Esri auf. Siehe <b>Internationale Übermittlungen</b> unten.'
  h_transfers: 'Internationale Übermittlungen'
  transfers_body: 'Dein Konto, deine Beiträge, deine Fotos und unsere Sicherungen bleiben im Europäischen Wirtschaftsraum (EWR). Zwei Dienste außerhalb sehen etwas. <b>Proton</b> in der Schweiz führt unser Postfach und sieht also die E-Mails, die du uns schreibst. Die EU hat entschieden, dass das Schweizer Recht personenbezogene Daten genauso gut schützt wie das EU-Recht (ein Angemessenheitsbeschluss), daher ist dafür kein zusätzlicher Vertrag nötig. <b>Esri</b> in den Vereinigten Staaten liefert die Satellitenansicht. Erst wenn du diese Ansicht einschaltest, fragt dein Browser Esri nach den Bildern, und Esri sieht dann deine IP-Adresse und welche Bilder du angefragt hast. Wir selbst senden Esri nichts. Die Straßenfotos von Mapillary kommen über das weltweite Netz von Meta, das sie von außerhalb des EWR ausliefern kann; es sieht dasselbe wie Esri, und erst wenn du die Straßenansicht öffnest.'
  h_retention: 'Wie lange wir es aufbewahren'
  retention_account: '<b>Kontodaten.</b> Bis du dein Konto löschst, dann sind sie weg. Die Löschung erfolgt sofort: du forderst sie an, wir mailen dir einen Code, du bestätigst, und in diesem Moment verschwindet das Konto aus der laufenden Datenbank. Die E-Mail-Adresse, der Passwort-Hash, das Zwei-Faktor-Geheimnis und die Backup-Codes gehen mit. Es gibt keine Wartezeit, und es wird nichts für den Fall zurückgehalten, dass du es dir anders überlegst. Unsere nächtlichen Backups enthalten den alten Datensatz noch, bis sie ausrotieren, und das dauert <b>höchstens 90 Tage</b>; diese Backups sind verschlüsselt und werden nur zur Wiederherstellung nach einem Ausfall geöffnet. Ein Konto, bei dem sich <b>24 Monate</b> niemand angemeldet hat, wird auf dieselbe Weise gelöscht. Wir schreiben dir vorher dreimal: nach 12, 22 und 23 Monaten, jedes Mal mit dem Datum, an dem es geschlossen wird. Einmal anmelden genügt, um es zu behalten.'
  retention_unconfirmed: '<b>Unbestätigte Konten.</b> Ein Konto, dessen E-Mail-Adresse nicht innerhalb von <b>7 Tagen</b> bestätigt wird, wird gelöscht, ohne Warn-E-Mail. Die Adresse kann jemandem gehören, der sich nie angemeldet hat, und die einzige E-Mail, die wir schicken könnten, ginge an diese Person.'
  retention_logs: '<b>Serverprotokolle.</b> Höchstens <b>90 Tage</b> aufbewahrt und danach automatisch gelöscht. Manche Einträge enthalten eine vollständige IP-Adresse. Vollständige Adressen werden nur kurz aufbewahrt, für Sicherheit und den Umgang mit Missbrauch.'
  retention_ratelimit: '<b>Tägliche Nutzungszähler.</b> Ein Tag.'
  retention_contributions: '<b>Beiträge.</b> Fakten, die du zur offenen Karte beisteuert, bleiben als Teil von The Commons erhalten (mit Provenienz), auch nachdem du gehst; sie sind keine personenbezogenen Daten über dich.'
  retention_traffic: '<b>Verkehrszusammenfassungen.</b> Eine Zeile wartet verschlüsselt, bis ihre Straße genug Fahrten hat, geht dann in die Summen pro Straße ein und wird gelöscht. Die Summen bleiben Teil des Commons. Sie enthalten keine Radfahrenden; daher wird mit deinem Konto nichts daraus gelöscht.'
  retention_messages: '<b>Nachrichten zu deinen Beiträgen.</b> Die Nachrichten zwischen dir und dem Kuratorenteam zu deinen Beiträgen bleiben erhalten, solange dein Konto besteht, und werden mit ihm gelöscht. Das gilt auch für deine Beiträge, die abgelehnt wurden oder die du zurückgezogen hast, bevor das Kuratorenteam darüber entschieden hat. Was das Kuratorenteam angenommen hat, bleibt auf der Karte, ohne deinen Namen. Ein Beitrag, der für ein rechtliches Verfahren festgehalten wird, bleibt mit seinen Nachrichten erhalten, solange das dauert.'
  retention_consent: '<b>Lizenz-Einwilligungen.</b> Wenn du ein Foto an The Commons lizenzierst, halten wir fest, dass du zugestimmt hast, welchem Wortlaut genau, und wann. Wir bewahren diesen Nachweis unbefristet auf, und er überdauert die Schließung deines Kontos: Er ist unser Beleg dafür, dass die Lizenz erteilt wurde, den wir zur Geltendmachung oder Verteidigung von Rechtsansprüchen benötigen könnten (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_17">DSGVO Art. 17(3)(e)</a>). Er enthält einen Kontoverweis und sonst nichts über dich, und sobald das Konto weg ist, identifiziert dieser Verweis hier niemanden mehr.'
  retention_mail: '<b>E-Mails und Nachrichten über das Kontaktformular, die du uns schickst.</b> Wir bewahren ein Gespräch auf, solange die Sache läuft, und löschen es innerhalb von <b>24 Monaten</b> nach ihrem Abschluss. Das deckt dich ab, wenn du ein Jahr später darauf zurückkommst, und uns, wenn spät eine Beschwerde über unseren Umgang damit eintrifft. Gespräche, die zu einer rechtlichen Sache gehören, etwa einer Urheberrechtsbeschwerde oder einem Löschverlangen, bewahren wir auf, bis diese Sache erledigt ist.'
  retention_bugs: '<b>Fehlermeldungen.</b> Eine Fehlermeldung bleibt erhalten, als Teil der Aufzeichnung darüber, was kaputt war und wie es behoben wurde. Die E-Mail-Adresse, die du für unsere Antwort angegeben hast, bewahren wir auf, solange der Fehler offen ist, und löschen sie <b>24 Monate</b>, nachdem wir dir das Ergebnis mitgeteilt haben, dieselbe Frist wie für E-Mails, die du uns schickst.'
  retention_reports: '<b>Meldungen zu Inhalten.</b> Wenn du etwas auf der Website meldest, auch ein Foto, das dich zeigt, bewahren wir die Adresse, die du für unsere Antwort hinterlassen hast, auf, bis wir über deine Meldung entschieden haben: Wir haben gehandelt, nichts Falsches gefunden oder die Meldung geschlossen, weil sie nicht mehr zutrifft. Wir löschen die Adresse <b>90 Tage</b> nach dieser Entscheidung. Die Meldung selbst bleibt erhalten, als Aufzeichnung dessen, was uns gemeldet wurde und was wir damit getan haben. Wird das gemeldete Foto für ein rechtliches Verfahren zurückgehalten, bewahren wir die Adresse auf, bis diese Sperre aufgehoben ist.'
  retention_updates: '<b>Die Release-Liste.</b> Deine Adresse bleibt darauf, bis du sie herunternimmst, in den Einstellungen oder über den Link in jeder Nachricht. Den Nachweis, dass du zugestimmt hast und welchem Wortlaut, bewahren wir wie eine Foto-Lizenzeinwilligung auf: er belegt, dass wir dir schreiben durften.'
  h_security: 'Wie wir es schützen'
  security_intro: 'Das Gesetz verlangt Maßnahmen, die zum Risiko passen (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_32">DSGVO Art. 32</a>). In einfachen Worten:'
  security_passwords: '<b>Dein Passwort wird nie gespeichert.</b> Wir behalten davon nur eine nicht umkehrbare Verschlüsselung, niemand hier kann dein Passwort lesen, und eine gestohlene Datenbank gibt auch niemandem deines in die Hand.'
  security_secrets: '<b>Zwei-Faktor-Geheimnisse und Backup-Codes sind dort verschlüsselt, wo sie liegen</b>, mit dem Schlüssel außerhalb der Datenbank. Wer nur die Datenbank stiehlt, bekommt daraus trotzdem keinen funktionierenden Code.'
  security_transport: '<b>Alles läuft verschlüsselt</b>, zwischen dir und uns und noch einmal, wenn ein Backup unsere Server verlässt. Browsern wird gesagt, eine unverschlüsselte Verbindung zu uns überhaupt abzulehnen.'
  security_access: '<b>Nur wer deine Daten braucht, kommt an sie heran</b>, und jede Moderations- und Verwaltungsanmeldung braucht zwei Faktoren. Wiederholte Fehlanmeldungen werden gebremst und dann gesperrt.'
  security_source_pre: 'Das ist die kurze Fassung. Die genauen Maßnahmen, und die Begründung für jede einzelne, stehen in unserem'
  security_source_link: 'öffentlichen Quellcode'
  security_source_post: '. Genau dafür bauen wir es offen: du musst einen Sicherheitsabsatz nicht auf Treu und Glauben hinnehmen.'
  security_honest: 'Kein System ist perfekt, und wir tun nicht so, als wäre unseres es. Hinter diesem Absatz steht keine Zertifizierung und kein Penetrationstest: was es gibt, ist ein kleines System, das so wenig wie möglich aufbewahrt, und Code, den jeder nachlesen kann.'
  h_breach: 'Wenn doch einmal Daten abfließen'
  breach_pre: 'Wenn personenbezogene Daten verloren gehen, offenliegen oder von jemandem erreicht werden, der sie nicht haben sollte, und das voraussichtlich ein Risiko für die Rechte von Menschen bedeutet, melden wir es der'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>innerhalb von 72 Stunden</b>, nachdem wir davon erfahren (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_33">DSGVO Art. 33</a>). Ist das Risiko für dich persönlich hoch, wenden wir uns außerdem direkt und unverzüglich an dich (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_34">DSGVO Art. 34</a>), in klarer Sprache: was passiert ist, welche deiner Daten betroffen waren, was wir dagegen getan haben und was du tun solltest. Wir führen intern ein Verzeichnis jeder Verletzung, auch der nicht meldepflichtigen, damit das Muster für uns sichtbar bleibt, selbst wenn kein einzelner Fall für sich meldepflichtig ist.'
  h_rights: 'Deine Rechte'
  rights_intro: 'Nach der <a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679">DSGVO</a> hast du folgende Rechte:'
  rights_access: '<b>Auskunft (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_15">DSGVO Art. 15</a>)</b>: fordere eine Kopie der personenbezogenen Daten an, die wir über dich vorhalten.'
  rights_correct: '<b>Berichtigung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_16">DSGVO Art. 16</a>)</b>: korrigiere Unrichtiges oder vervollständige Fehlendes.'
  rights_erase: '<b>Löschung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_17">DSGVO Art. 17</a>)</b>: lösche dein Konto jederzeit in deinen Kontoeinstellungen. Deine personenbezogenen Daten gehen mit und kommen nicht zurück. Manches bleibt noch eine Weile: unsere verschlüsselten Sicherungen enthalten den alten Datensatz, bis sie ersetzt werden, höchstens 90 Tage, und ein Beitrag, der für ein rechtliches Verfahren festgehalten wird, bleibt, solange das dauert. Zwei Dinge bleiben bewusst bestehen, und keines davon identifiziert dich danach: die Beiträge, die du der offenen Karte gegeben hast, und der Nachweis, dass du eine Fotolizenz erteilt hast. All das steht oben unter <b>Wie lange wir sie aufbewahren</b>.'
  rights_portability: '<b>Datenübertragbarkeit (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_20">DSGVO Art. 20</a>)</b>: lade herunter, was wir über dich gespeichert haben, als eine einzige ZIP-Datei in deinen Kontoeinstellungen, bis zu 3-mal am Tag. Diese Grenze ist nur da, um Missbrauch zu stoppen. Sie enthält unter anderem deine Kontodaten, deine Beiträge, deine Nachrichten, deine Lizenzeinwilligungen und deine Fotos als Dateien.'
  rights_restrict: '<b>Einschränkung und Widerspruch (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_18">DSGVO Art. 18–21</a>)</b>: schränke bestimmte Verarbeitungen ein oder widerspreche ihnen.'
  rights_withdraw: '<b>Einwilligung widerrufen</b> jederzeit, zum Beispiel indem du dein öffentliches Profil oder die Neuigkeiten-Mails ausschaltest. Ab diesem Moment hören wir mit dem auf, wozu du eingewilligt hattest. Was wir vorher mit deiner Einwilligung getan haben, bleibt rechtmäßig (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_7">DSGVO Art. 7 Abs. 3</a>).'
  rights_third_party_photo: '<b>Kein Konto?</b> Diese Rechte hängen nicht an einem Konto. Bist du auf einem Foto auf unserer Karte erkennbar, trägt jede Fotoseite den Link <b>"dieses Foto zeigt mich"</b>. Melde es dort, ohne Konto und ohne Ausweis, und eine Kuratorin oder ein Kurator antwortet spätestens innerhalb eines Monats.'
  rights_contact_pre: 'Um eines dieser Rechte wahrzunehmen, schreib'
  rights_contact_mid: '. Wir antworten <b>spätestens innerhalb eines Monats</b>, normalerweise deutlich früher. Das Gesetz erlaubt bis zu drei Monate für eine wirklich komplizierte Anfrage, aber nur, wenn wir dir innerhalb des ersten Monats sagen, dass es länger dauert, und warum. Bist du mit unserer Antwort nicht zufrieden, kannst du dich beschweren bei der'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: 'beschweren.'
  h_children: 'Kinder'
  children_body: 'The Commons ist nicht für Kinder unter <b>16</b> Jahren gedacht. Wir erheben wissentlich keine personenbezogenen Daten von Personen unter diesem Alter; wenn du glaubst, dass ein Kind uns Daten übermittelt hat, kontaktiere uns und wir löschen sie.'
  h_automated: 'Automatisierte Entscheidungen'
  automated_body: 'Wir treffen keine Entscheidungen über dich ausschließlich auf automatisiertem Wege und erstellen keine Profile von dir für Werbezwecke.'
  h_changes: 'Änderungen dieser Richtlinie'
  changes_body: 'Wenn wir ändern, wie wir mit Daten umgehen, fügen wir hier eine neue Version hinzu, mit Datum und Änderungen, und zeigen angemeldeten Radfahrenden einen Hinweis, bis sie sie gelesen haben. Dein Konto speichert, welche Version du zuletzt gesehen hast.'
  changes_versions_pre: 'Sieh dir die'
  changes_versions_link: 'Versionsgeschichte'
  changes_versions_post: ' auf GitHub an.'
  footer_disc_pre: 'Siehe auch unsere'
  footer_disc_terms: 'Nutzungsbedingungen'
  footer_disc_mid: 'und die Daten-, Medien- und Code-'
  footer_disc_licences: 'Lizenzen'
  footer_disc_post: '.'
  version_line: 'Version %n% · %date%'
  changed_bar: 'Unsere Datenschutzerklärung hat sich am %date% geändert.'
  changed_read: 'Lies, was sich geändert hat'
  change:
    v1_first: 'Die erste nummerierte Version. Frühere Fassungen stehen in der unten verlinkten Versionsgeschichte.'
    v2_traffic: 'Neu: In der Fahrtprüfung von Scout kannst du eine <b>Verkehrszusammenfassung</b> einer Fahrt mit Radar senden: pro Straße die Strecke, die Autos und die Tageszeit. Deine GPS-Spur bleibt auf deinem Gerät. Sieh, was wir erheben und wie lange wir es aufbewahren.'
    v2_time_zone: 'Neu: Wir speichern deine <b>Zeitzone</b>, die du in den Einstellungen wählst oder die dein Browser meldet, um Uhrzeiten darin anzuzeigen.'
    v2_pseudonym: 'Korrigiert: Bei ausgeschaltetem Profil zeigen deine Beiträge dein festes <b>Pseudonym</b>, nicht gar keinen Namen.'
    v2_base_location: 'Geändert: dein <b>Standort</b> wird als zufälliger Punkt bis zu 2,5 km vom gewählten Punkt gespeichert, statt als ein auf etwa 1 km gerundeter Punkt.'
    v2_clearer: 'Leichter zu lesen. Die Erklärung sagt, dass beides, was du aus Scout senden kannst, Verkehrszusammenfassungen und Tags, bei jeder Fahrt deine Wahl ist. Sie erklärt in einfachen Worten, wie wir dein Passwort aufbewahren, warum wir zählen, wie oft ein Werkzeug ohne Konto genutzt wird, und was die Karte in deinem eigenen Browser speichert. Für jeden Dienst außerhalb des EWR steht dort, was dieser Dienst sieht. Jeder genannte DSGVO-Artikel verlinkt auf den Gesetzestext selbst.'
    v2_errors: 'Ergänzt: <b>Fehlerberichte</b> unseres Servers, was sie enthalten, und dass sie auf unseren eigenen Maschinen bleiben.'
