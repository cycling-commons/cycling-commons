# The privacy notice in German: the whole page in one file, outside the `messages`
# domain the in-site translation system reads (docs/specs/privacy-notice.md). This
# file's history is the record of every change to the page in German.
privacy:
  kicker: 'Datenschutz'
  title: 'Was wir erheben, und warum.'
  lead: 'Klare Sprache. Der Cycling-Commons-Datensatz ist nicht-personenbezogen: offene Geodaten über Orte, niemals über Menschen. Das <b>Plattformkonto</b> ist eine andere Sache: es enthält personenbezogene Daten (E-Mail, Zugangsdaten, Sitzungsprotokolle). Hier ist, was wir vorhalten, warum und welche Kontrolle du darüber hast.'
  h_responsible: 'Wer verantwortlich ist'
  responsible_p1_pre: 'Der Verantwortliche ist'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', mit Sitz in den Niederlanden, das Cycling Commons heute betreut. Wie in unserer'
  responsible_p1_governance: 'Governance'
  responsible_p1_post: ' dargelegt, ist The Commons verpflichtet, in eine unabhängige niederländische Stiftung auszugliedern; der Verantwortliche überträgt entsprechend, und diese Seite wird aktualisiert.'
  responsible_p2_pre: 'Fragen zu deinen Daten:'
  responsible_p2_mid: '. Du hast auch das Recht, eine Beschwerde bei der niederländischen Aufsichtsbehörde einzureichen, der'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'Wir haben <b>keine Datenschutzbeauftragte und keinen Datenschutzbeauftragten bestellt</b>, und das Gesetz verlangt es von uns auch nicht: wir sind ein kleiner Betrieb, wir überwachen niemanden in großem Umfang, und besondere Kategorien personenbezogener Daten gehören nicht zu unserer Tätigkeit (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_37">DSGVO Art. 37</a>). Fragen und Anträge zum Datenschutz gehen an dieselbe Adresse wie alles andere,'
  dpo_post: '. Sollte sich das ändern und wir doch jemanden bestellen, wird diese Seite den Namen nennen.'
  h_collect: 'Was wir erheben'
  collect_intro: 'Wir fragen nur das Minimum ab, das nötig ist, um eine offene, rechenschaftspflichtige Karte zu betreiben. Wir fragen nie nach deinem echten Namen.'
  h3_account: 'Wenn du ein Konto erstellst'
  collect_account_email: 'Deine <b>E-Mail-Adresse</b>, um dich anzumelden, das Konto zu sichern und wichtige Servicenachrichten zu senden.'
  collect_account_password: 'Ein <b>Passwort</b>. Das Passwort selbst speichern wir nie, nur einen Hash davon: eine Art Fingerabdruck, aus dem sich das Passwort nicht zurückrechnen lässt. Wenn du dich anmeldest, bilden wir aus deiner Eingabe auf dieselbe Weise einen Hash und vergleichen beide.'
  collect_account_displayname: 'Ein <b>Anzeigename</b>, den du wählst. Er darf ein Pseudonym sein, und wir fragen nie nach deinem echten Namen. Dein Profil ist <b>standardmäßig aus</b>: Solange es aus ist, zeigen deine Beiträge dein <b>Pseudonym</b>, zum Beispiel rider#k3x9q2mf, statt deines Anzeigenamens. Es ist auf allem, was du hinzufügst, dasselbe: Andere sehen, dass eine Person es erstellt hat, aber nicht wer; zusammen können diese Beiträge ungefähr zeigen, wo du fährst. Schalte dein Profil ein, und dein Anzeigename, dein Land, der Monat deiner Anmeldung, die Fahrradtypen und Fahrstile, die du gewählt hast, deine Beitragszahlen und die Routen, die du vorgeschlagen hast, werden öffentlich.'
  collect_account_2fa: 'Wenn du die <b>Zwei-Faktor-Authentifizierung (2FA)</b> aktivierst, speichern wir das TOTP-Geheimnis <b>verschlüsselt im Ruhezustand</b>, und deine Backup-Codes nur als Hashes.'
  collect_account_base: 'Ein optionaler <b>Standort</b> und Fahrradius, falls du einen festlegst. Wir speichern nicht den Punkt, den du wählst: wir speichern einen zufälligen Punkt bis zu etwa 2,5 km davon entfernt, sodass der gespeicherte Punkt kaum mehr verrät als ungefähr den Ort. Wir speichern auch den Ortsnamen, den du dazu gewählt hast, und die Regionen und Länder, die dein Radius erreicht. Er passt nur an, was du selbst siehst: deine Kartenansicht und Voreinstellungen wie die Region, mit der die Bestenliste und die Abstimmung öffnen. Er wird nie anderen Fahrer:innen gezeigt und ist nie Teil des Commons-Datensatzes.'
  collect_account_timezone: 'Deine <b>Zeitzone</b>, damit die angezeigten Uhrzeiten deine sind: die Zone aus deinen Einstellungen oder, solange dort automatisch gewählt ist, die Zone, die dein Browser meldet (zum Beispiel Europe/Amsterdam). Es ist ein Zonenname, kein Standort.'
  collect_account_prefs: '<b>Deine Einstellungen.</b> Deine Sprache, Einheiten und dein Datumsformat, dein Kartenthema und Kartenmodus, die Fahrradtypen und Fahrstile, die du wählst und die bestimmen, was die Karte dir zuerst zeigt, und die Hinweise, die du geschlossen hast. Außerdem speichern wir das Datum, an dem du bestätigt hast, dass du mindestens 16 bist, und das Datum deiner letzten Anmeldung, ab dem die 24-Monats-Regel unter <b>Wie lange wir es aufbewahren</b> zählt.'
  h3_contribute: 'Wenn du beiträgst'
  collect_contribute_items: '<b>Alles, was du in The Commons schreibst.</b> Ein Ort, ein Anstieg, eine Route, eine Korrektur, eine Stimme, eine Prüfung vor Ort, eine Regionsbeschreibung, eine Übersetzung, eine Meldung, eine Nachricht an eine Kuratorin oder einen Kurator: wenn du es getippt und abgeschickt hast, haben wir es. Jedes davon ist mit dem Konto verknüpft, das es gesendet hat, damit das Kuratorenteam dir antworten kann. Nachrichten an das Kuratorenteam und Meldungen bleiben zwischen dir und dem Kuratorenteam: sie erscheinen nie auf der Karte oder im Datensatz.'
  collect_contribute_media: 'Die <b>Fotos</b>, die du hochlädst. Ein Foto kann verborgene Daten enthalten (EXIF), etwa den Aufnahmeort: die entfernen wir und kodieren die Datei neu, was wir veröffentlichen trägt also nichts davon. Danach schreiben wir eine Sache zurück: einen Vermerk, dass das Bild unter CC BY-SA 4.0 steht, und einen Link auf seine Seite bei Cycling Commons. <b>Dein Name kommt nie in die Datei.</b> Über diesen Link findet jemand, der das Foto weiterverwendet, wen er nennen muss, und diese Seite nennt dich nur, solange dein Profil öffentlich ist.'
  collect_contribute_traffic: '<b>Verkehrszusammenfassungen</b>, nur wenn du eine aus der Fahrtprüfung in Scout mit einem Rückradar sendest. Für jedes Straßenstück, das du gefahren bist, enthält eine Zusammenfassung: das Straßenstück und deine Fahrtrichtung darauf, wie weit und wie lange du dort gefahren bist, wie viele Autos dich überholt haben und wie schnell, deine eigene Durchschnittsgeschwindigkeit, die Tageszeit (Nacht, Morgenspitze, Tag, Abendspitze oder Abend), eine Gruppe von mindestens vier Daten derselben Art statt des Datums, das Quartal und ob es ein Werktag oder ein Wochenende war. Auf einem Radweg enthält sie, wie viele Autos das Radar in der Nähe gesehen hat, statt der Autos, die dich überholt haben. Jede Zeile trägt außerdem Prüfwerte, die aus der Fahrt gebildet werden, damit dieselbe Fahrt nie doppelt zählt. Deine Fahrtdatei verlässt dein Gerät nie, und eine Zusammenfassung enthält keine GPS-Spur; welche Straßen du gefahren bist, mit Tageszeit, schon. Nichts im Umkreis von 500 m um Start oder Ziel einer Fahrt wird je in einer Zusammenfassung gesendet. Um die Fahrt Straßen zuzuordnen, lädt dein Browser die Kartendaten des Gebiets von unserem Server, wie die Karte es für jedes Gebiet tut, das du ansiehst. Nichts, was wir speichern, nennt oder codiert dich. Jede Zeile wartet verschlüsselt, bis ihre Straße genug Fahrten von mehreren Tagen hat, und geht dann in einfache Summen pro Straße ein; so kommt eine Fahrt in Stücken in die Summen, gemischt mit anderen Fahrten. Das Kuratorenteam sieht nur ruhig, mäßig oder stark befahren pro Straße. Die Ergebnisse sieht nur das Kuratorenteam, und nie mit deinem Namen. Aus derselben Fahrtprüfung kannst du auch die <b>Tags</b> senden, die du während der Fahrt gesetzt hast. Ein Tag sendet seine Stelle auf der Karte, die du vorher verschieben kannst, den Namen und die Angaben, die du ihm gibst, Fotos, die du hinzufügst, und die Uhrzeit, zu der du es gesetzt hast, von der wir nur das Datum behalten. Ein Tag für ein Straßenstück, etwa für seinen Belag, sendet außerdem den Teil deiner Fahrt zwischen den beiden Enden, die du wählst. Jedes Tag wird ein gewöhnlicher Beitrag und durchläuft dieselbe Prüfung wie jeder andere. Beides ist freiwillig: pro Fahrt wählst du, was du sendest, und du kannst auch nichts senden. Scout bekommt später weitere Funktionen; ändert eine davon, was gesendet wird, ändert sich zuerst diese Erklärung.'
  collect_contribute_rode: '<b>"Bin ich gefahren"-Markierungen.</b> Markierst du eine Route als gefahren, speichern wir diese Markierung mit dem gewählten Fahrradtyp und dem Datum. Auf der Route steht nur, wie viele Radfahrende sie markiert haben.'
  collect_contribute_bugs: '<b>Fehlermeldungen.</b> Meldest du einen Fehler, speichern wir, was du geschrieben hast, die Bildschirmfotos, die du hinzufügst, die Adresse der Seite, auf der du warst, deinen Browser und seine Version, die Größe deines Fensters und deine E-Mail-Adresse, wenn du eine Antwort möchtest. Bist du angemeldet, ist die Meldung mit deinem Konto verknüpft. Das Kuratorenteam kann einen Fehler auf unserer Seite mit bekannten Problemen und als Issue auf GitHub veröffentlichen, mit einem Titel und Text, den es selbst schreibt; deine E-Mail-Adresse, die Seitenadresse und deine Bildschirmfotos kommen dort nie hin.'
  collect_contribute_curator: '<b>Bewerbungen als Kurator:in und Länderanfragen.</b> Bewirbst du dich als Kurator:in, speichern wir das Land und Gebiet, um das du bittest, was du über dich schreibst, einen Link, wenn du einen angibst, und deinen OpenStreetMap-Benutzernamen, wenn du ihn nennst. Unser Server schlägt diesen Namen bei OpenStreetMap nach, um zu sehen, ob es ihn gibt und wie viele Bearbeitungen er hat. Bittest du uns, ein Land zu öffnen, speichern wir das Land, die Region, die du nennst, ob du dort kuratieren würdest, und deine Notiz.'
  collect_contribute_profile: 'Optionale Profilangaben, die du wählst, etwa dein Land, deine Fahrradtypen und deine Fahrstile. Sie erscheinen nur auf deinem öffentlichen Profil, solange es eingeschaltet ist. Profile sind'
  collect_contribute_profile_link: 'opt-in'
  collect_contribute_profile_post: ' und standardmäßig deaktiviert.'
  h3_auto: 'Automatisch, wenn du die Seite nutzt'
  collect_auto_technical: '<b>Technische Daten</b>: IP-Adresse, Browsertyp und Zeitstempel in unseren Serverprotokollen, aufbewahrt zum Betrieb und zur Absicherung des Dienstes.'
  collect_auto_ratelimit: '<b>Nutzungszähler und codierte Adressen.</b> Damit nicht eine einzelne Person ein Werkzeug für alle aufbraucht oder ein Formular überflutet, zählen wir Anfragen. Bist du angemeldet, zählen wir auf dein Konto. Ohne Konto zählen die meisten Zähler, etwa der der Tourprüfung, auf einen Code aus deiner IP-Adresse, aus dem sich die Adresse nicht zurückrechnen lässt. Einige zählen auf die Adresse selbst: das Meldeformular, die öffentliche API, die Abdeckungsdaten der Karte und die Prüfung, die manche Formulare schützt. Dieselbe Art Code wird bei einer Inhaltsmeldung, einer Fehlermeldung oder einer Kontaktnachricht gespeichert, die du sendest, damit wir eine Flut erkennen. Dieser Code ist trotzdem ein personenbezogenes Datum, also gilt alles auf dieser Seite auch für ihn.'
  collect_auto_errors: '<b>Fehlerberichte.</b> Wenn auf unserem Server etwas schiefgeht, schreibt er einen Fehlerbericht: was schiefging, die Adresse der Seite und den Zeitpunkt. Er enthält nie deine IP-Adresse, deinen Namen, deine E-Mail-Adresse oder das, was du in ein Formular getippt hast. Die Berichte bleiben auf unseren eigenen Maschinen bei Hetzner, mit allem anderen, was wir betreiben (siehe <b>Die Unternehmen, die Daten für uns verarbeiten</b>).'
  banner_bold: 'Kein Tourentracking.'
  banner_body: 'The Commons ist eine Karte von Orten, nicht von Menschen. Wir verfolgen <b>nicht</b>, wo du fährst, und sehen nie deinen aktuellen Standort. Eine Linie, die du gefahren bist, haben wir nur, wenn du sie bewusst sendest: eine Route, die du vorschlägst, oder das Stück einer Fahrt, das ein Scout-Tag abdeckt. Eine Verkehrszusammenfassung aus der Fahrtprüfung in Scout ist keine GPS-Spur, sagt aber, welche Straßen du gefahren bist und zu welcher Tageszeit, und eine "Bin ich gefahren"-Markierung sagt, dass du diese Route gefahren bist (siehe <b>Wenn du beiträgst</b>). Die Tourprüfung liest auf unserem Server eine Fahrtdatei, die du ihr gibst, um Orte entlang der Strecke zu finden, und behält nichts davon.'
  banner_locate: '<b>Meinen Standort zeigen</b> auf der Karte liest deine Position in deinem eigenen Browser, nur wenn du die Schaltfläche antippst, und schickt sie nirgendwohin: keine Anfrage an uns oder an andere enthält sie. Die Karte lädt danach die Kartenbilder dieses Gebiets, wie immer, wenn du die Karte verschiebst.'
  h_why: 'Warum wir es verwenden (Rechtsgrundlagen)'
  why_contract: '<b>Zur Bereitstellung deines Kontos und des Dienstes</b>: Erfüllung eines Vertrages (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. b</a>).'
  why_consent: '<b>Deinen Namen zeigen.</b> Ein öffentliches Profil, und namentlich genannt zu werden für das, was du beigetragen hast, beruht auf deiner Einwilligung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. a</a>). Du kannst sie jederzeit widerrufen in deinen'
  why_consent_link: 'Einstellungen'
  why_consent_post: ', dann verschwindet dein Name von diesen Seiten. Bei uns geschieht das sofort. Eine Kopie einer Seite, die jemand anderes gespeichert hat, liegt außerhalb unserer Reichweite.'
  why_licence: '<b>Veröffentlichen, was du beiträgst.</b> Ein Foto oder eine Bearbeitung, die du The Commons gibst, wird unter der Lizenz veröffentlicht, der du beim Absenden zugestimmt hast, und das gehört zu unserer Vereinbarung mit dir (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. b</a>). Diese Lizenz ist nach ihren eigenen Bedingungen <b>unwiderruflich</b>: eine widerrufene Einwilligung nimmt deinen Namen von der Seite, macht den Beitrag selbst aber nicht rückgängig. Eine Ausnahme zählt: zeigt das Foto <b>dich</b>, sind das deine personenbezogenen Daten, und eine Urheberrechtslizenz unterschreibt deine Datenschutzrechte nicht weg. Jede Fotoseite hat einen Link, um die Entfernung zu beantragen. Ein Foto, das du nicht lizenzieren durftest, war nie gültig lizenziert: sag es uns über denselben Link, dann wird es ebenfalls entfernt.'
  why_updates: '<b>Dir sagen, was neu ist.</b> Nur wenn du es wolltest: die Einstellung in deinem Konto ist deine Einwilligung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. a</a>), und sie auszuschalten widerruft sie. In deinen Einstellungen wählst du, wie oft: <b>nur große Neuigkeiten</b> oder <b>jedes Update</b>. Jede Nachricht enthält außerdem einen Abmeldelink mit einem Klick, ohne Anmeldung. Nur Neuigkeiten über The Commons, nie Werbung, und die Liste wird nie weitergegeben oder verkauft.'
  why_legitimate: '<b>Sicherheit, Missbrauchsverhinderung und aggregierte Analysen</b>: unsere berechtigten Interessen daran, The Commons ehrlich und funktionsfähig zu halten (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. f</a>).'
  why_legal: '<b>Erfüllung gesetzlicher Pflichten</b>: wo das Gesetz es verlangt (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. c</a>). Dazu gehören die Begründung, die wir dir schulden, wenn wir etwas einschränken, das du hinzugefügt hast, oder dein Konto (Gesetz über digitale Dienste, Art. 17), und die Information der Polizei oder einer Justizbehörde bei einer Gefahr für das Leben oder die Sicherheit eines Menschen (dasselbe Gesetz, Art. 18).'
  h_cookies: 'Cookies & Analysen'
  cookies_body: 'Wir halten das simpel. Wir setzen <b>zwei Cookies</b>, beide unbedingt erforderlich und beide unten vollständig aufgeführt. Für Nutzungsstatistiken betreiben wir <b>selbst gehostete Analytics</b> auf unserer eigenen Infrastruktur: Sie erhalten die Seiten-URL, den Referrer, die Bildschirmgröße und den Browsertyp, und sie erhalten deine <b>IP-Adresse</b>, die personenbezogen ist, <b>speichern sie aber nicht</b>. Die Adresse dient nur dazu, einen ungefähren Ort zu bestimmen (Land, Region und Stadt) und daraus eine Einweg-Sitzungskennung abzuleiten, und wird danach verworfen. Es werden keine Analytics-Cookies gesetzt, kein Besucher erhält eine dauerhafte Kennung oder wird mit einem Konto verknüpft, und es gibt kein Cross-Site- oder Cross-Device-Tracking. Die Analysedaten bleiben auf unserer eigenen Infrastruktur und werden niemals an Dritte weitergegeben oder verkauft.'
  h3_cookie_table: 'Die Cookies, die wir setzen'
  ck_h_name: 'Name'
  ck_h_purpose: 'Wofür es da ist'
  ck_h_life: 'Wie lange es bleibt'
  ck_session_purpose: 'Hält dich angemeldet und trägt das Token, das die Formulare, die du angemeldet nutzt, gegen Cross-Site Request Forgery (CSRF) schützt, einen Angriff, bei dem eine andere Website deinen Browser hier in deinem Namen ein Formular absenden lässt. Es wird gesetzt, wenn du dich anmeldest oder ein Formular nutzt, das sich etwas von einer Seite zur nächsten merken muss, etwa beim Zurücksetzen deines Passworts. Die Karte und den Rest der Seite zu lesen, die Kontaktseite eingeschlossen, setzt überhaupt kein Cookie. Es enthält eine zufällige Kennung und sonst nichts: keinen Namen, keine E-Mail-Adresse, keine Aufzeichnung dessen, was du angesehen hast.'
  ck_session_life: 'Bis du den Browser schließt'
  ck_remember_purpose: 'Meldet dich beim nächsten Besuch wieder an, ohne nach deinem Passwort zu fragen. Wird <b>nur</b> gesetzt, wenn du beim Anmelden <b>Angemeldet bleiben</b> ankreuzt, und verschwindet beim Abmelden. Auf einem Computer, den auch andere nutzen, raten wir davon ab.'
  ck_remember_life: '7 Tage'
  cookies_none_body: 'Das ist die ganze Liste. Wir setzen <b>kein</b> Werbe-Cookie, <b>kein</b> Analyse-Cookie und <b>kein</b> Cross-Site-Tracking-Cookie, auf keiner Seite. Beide Cookies oben sind unbedingt erforderlich, um etwas zu liefern, worum du selbst gebeten hast, deshalb verlangt das Gesetz dafür keine Einwilligung, und darum gibt es hier kein Cookie-Banner. Sollten wir je etwas hinzufügen, das eines braucht, fragen wir dich vorher, statt es anzunehmen.'
  cookies_local_body: 'Dein Browser speichert außerdem ein paar Dinge für diese Seite auf deinem eigenen Gerät. Im <b>lokalen Speicher</b>: deine Anzeige- und Karteneinstellungen, etwa das Thema, das zuletzt angesehene Gebiet, deine Filter und die Größe eines Bereichs, und ein Heimatgebiet, wenn du ohne Konto eines festlegst. Eine Fehlermeldung, die du noch nicht gesendet hast, bleibt als Entwurf mit ihren Bildschirmfotos in der eigenen Datenbank des Browsers (IndexedDB). Während du etwas bearbeitest, liegt Arbeit in Bearbeitung im <b>Sitzungsspeicher</b>, den der Browser leert, wenn du den Tab schließt. Nichts davon ist ein Cookie. Alles bleibt in deinem Browser: wir lesen es dort nie aus, und ein Entwurf erreicht uns erst, wenn du ihn sendest. Das Löschen deiner Browserdaten entfernt es. Andere Websites können es nicht lesen: ein Browser hält den Speicher jeder Website getrennt. Zwei Dinge können es trotzdem lesen. Jede Person, die denselben Browser auf demselben Computer nutzt, und jedes Skript, das auf dieser Seite läuft, etwa eine Browsererweiterung, die du installiert hast. Ein Heimatgebiet verrät ungefähr, wo du wohnst; auf einem gemeinsam genutzten Computer legst du es deshalb vielleicht lieber nicht fest.'
  h_share: 'Mit wem wir es teilen'
  share_infra: '<b>Die Dienste, die unsere Infrastruktur betreiben, und die wenigen, die wir um eine Prüfung bitten.</b> Hosting, Backups, E-Mail, die Kartendienste, die dein Browser direkt abruft, und die Prüfungen, die unser Server macht. Jeder ist unten namentlich genannt, mit dem, was er tut, und dem, was er sehen kann.'
  share_osm_pre: 'OpenStreetMap: Beiträge, die du zurückgeben möchtest, werden Teil der offenen Karte unter der'
  share_osm_link: 'ODbL'
  share_osm_post: '. Das sind öffentliche, offene Daten, keine personenbezogenen Daten über dich.'
  share_authorities: '<b>Die Polizei oder eine Justizbehörde, wenn das Gesetz es verlangt.</b> Deutet etwas, das in The Commons veröffentlicht wurde, auf eine Straftat hin, die das Leben oder die Sicherheit eines Menschen bedroht, müssen wir die zuständige Strafverfolgungs- oder Justizbehörde des betroffenen Landes informieren, oder der Niederlande, wenn das unklar ist (Gesetz über digitale Dienste, Art. 18). Wir geben ihr, was sie zum Handeln braucht: was die Kuratorin oder der Kurator gesehen hat, die Referenz, die Zeitpunkte, wo es erschien, und die Daten, die wir zu dem Konto haben, von dem es stammt (Konto-ID, Anzeigename, E-Mail-Adresse und Registrierungsdatum). Das Material selbst geht nur mit, wenn sie danach fragt. Die Rechtsgrundlage ist unsere rechtliche Verpflichtung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_6">DSGVO Art. 6 Abs. 1 lit. c</a>).'
  share_noone: '<b>Niemand sonst.</b> Wir verkaufen keine personenbezogenen Daten und betreiben kein Drittanbieter-Werbetracking.'
  share_selfhosted: 'Zuerst, was <b>nicht</b> in diesen Listen steht. Wir betreiben so viel wie möglich selbst: die Kartendaten, die Routenplanung, das Höhenmodell hinter den Steigungen, den Fotospeicher, die Nutzungsstatistik und sogar die Fehlerberichte laufen auf unseren eigenen Maschinen. Zwei Dienste, die wir früher von außen geholt haben, für Routen und für Höhen, sind genau deswegen zu uns gewandert. So zu bauen dauert länger und kostet mehr. Es ist auch der Grund, warum dein Browser mit einer Handvoll fremder Dienste spricht, jeder unten genannt, statt mit zwanzig, und warum die Tabellen unten so kurz sind: jeder Name darin ist einer, den wir nicht vernünftig selbst betreiben konnten.'
  h3_processors: 'Die Unternehmen, die Daten für uns verarbeiten'
  processors_intro: 'Die Unternehmen unten halten oder verarbeiten deine Daten in unserem Auftrag. Sie sind unsere <b>Auftragsverarbeiter</b>: sie dürfen nur tun, was wir ihnen vorgeben, auf Grundlage eines schriftlichen Vertrags, und sie dürfen deine Daten für nichts Eigenes verwenden.'
  pr_h_who: 'Wer'
  pr_h_where: 'Wo'
  pr_h_what: 'Was sie für uns tun'
  pr_h_sees: 'Was sie sehen können'
  pr_hetzner_where: 'Europäischer Wirtschaftsraum'
  pr_hetzner_what: 'Betreibt die Maschinen: die Website, die Datenbank, den Speicher für hochgeladene Fotos und die Fehlerberichte.'
  pr_hetzner_sees: 'Im Prinzip alles, was wir speichern, denn es liegt auf ihrer Hardware: deine E-Mail-Adresse, deine Beiträge, deine Fotos, die Serverprotokolle und die Fehlerberichte. Passwörter und Zwei-Faktor-Geheimnisse sind auch dort unlesbar (siehe <b>Wie wir es schützen</b>).'
  pr_scaleway_where: 'Europäischer Wirtschaftsraum'
  pr_scaleway_what: 'Stellt die E-Mails zu, die die Seite dir schickt, und bewahrt die nächtlichen Backups auf.'
  pr_scaleway_sees: 'Deine E-Mail-Adresse und den Inhalt der Nachrichten, die die Seite dir schickt. Die Backups werden auf unseren eigenen Servern verschlüsselt, bevor sie das Haus verlassen, ihr Inhalt ist am anderen Ende also nicht lesbar.'
  pr_proton_where: 'Schweiz (durch einen EU-Angemessenheitsbeschluss gedeckt)'
  pr_proton_what: 'Beherbergt das Postfach des Projekts, die Adresse auf dieser Seite, und die Antworten, die ein Mensch hier zurückschreibt.'
  pr_proton_sees: 'Deine E-Mail-Adresse und alles, was du uns geschrieben hast, solange das Gespräch aufbewahrt wird.'
  h3_browser_services: 'Dienste, die dein Browser direkt kontaktiert'
  browser_services_intro: 'Die Karte wird in deinem Browser zusammengesetzt, ein paar Teile kommen deshalb direkt von denen, die sie veröffentlichen, und nicht über uns. Wir geben ihnen nie dein Konto, deinen Anzeigenamen oder deine E-Mail-Adresse. Sie sehen aber die Netzwerkadresse, von der deine Anfrage kommt, denn jede Anfrage im Internet trägt eine. Nichts aus dieser Liste lädt, bevor du eine Seite öffnest, die es benutzt.'
  bs_h_service: 'Dienst'
  bs_h_what: 'Wofür er da ist'
  bs_h_sees: 'Was er erhält'
  bs_sees_ip: 'Deine IP-Adresse und welche Kartenkacheln du angefordert hast.'
  bs_openfreemap_what: 'Die Grundkarte: die Straßen, die Gewässer und die Ortsnamen unter allem anderen.'
  bs_esri_what: 'Die Satellitenansicht, erst wenn du sie einschaltest.'
  bs_esri_sees: 'Deine IP-Adresse und welche Bildkacheln du angefordert hast. Esri sitzt in den Vereinigten Staaten.'
  bs_mapillary_what: 'Straßenbilder, erst wenn du die Straßenansicht öffnest.'
  bs_mapillary_sees: 'Deine IP-Adresse und welche Fotos du geöffnet hast. Mapillary wird von Meta Platforms Ireland Limited in Irland betrieben, und die Bilddateien selbst kommen aus Metas Content-Netzwerk, das weltweit ist.'
  bs_photon_what: 'Ortssuche: in der Kartensuche, in der Ortssuche des Beitragsformulars und im Feld für deinen Standort in den Einstellungen.'
  bs_photon_sees: 'Deine IP-Adresse, was du in eine Ortssuche tippst, und die Sprache der Seite. Aus der Kartensuche außerdem die Region oder das Land, auf das die Suche beschränkt ist. Photon wird von komoot in Deutschland betrieben.'
  browser_services_post: 'Zwei davon können außerhalb des Europäischen Wirtschaftsraums (EWR) liegen: <b>Esri</b> sitzt in den Vereinigten Staaten, und die Bilddateien von Mapillary kommen aus Metas weltweitem Netz. Öffnest du die Satellitenansicht und die Straßenansicht nie, nimmt dein Browser zu keinem von beiden Kontakt auf. Siehe <b>Internationale Übermittlungen</b> unten.'
  h3_server_services: 'Dienste, die unser Server fragt'
  server_services_body: 'Ein paar Prüfungen laufen von unserem Server aus, daher sehen diese Dienste die Adresse unseres Servers, nie deine. Fügt jemand einem Ort einen Weblink hinzu, kann unser Server <b>Google Safe Browsing</b> in den Vereinigten Staaten fragen, ob der Link als schädlich bekannt ist, wenn diese Prüfung eingeschaltet ist; er sendet nur den Link. Senden wir einen veröffentlichten Fehler an <b>GitHub</b> in den Vereinigten Staaten, eröffnet unser Server dort ein Issue mit dem öffentlichen Titel und Text des Fehlers, die nie eine Person nennen. Keiner dieser beiden Dienste erhält personenbezogene Daten über dich. Bewirbst du dich als Kurator:in, schlägt unser Server den Benutzernamen, den du angegeben hast, bei <b>OpenStreetMap</b> nach; dieser Name ist dort bereits öffentlich.'
  h_transfers: 'Internationale Übermittlungen'
  transfers_body: 'Dein Konto, deine Beiträge, deine Fotos und unsere Sicherungen bleiben im Europäischen Wirtschaftsraum (EWR). Eine Handvoll fremder Dienste kann von außerhalb etwas sehen, jeder oben genannt. <b>Proton</b> in der Schweiz führt unser Postfach und sieht also die E-Mails, die du uns schreibst. Die EU hat entschieden, dass das Schweizer Recht personenbezogene Daten genauso gut schützt wie das EU-Recht (ein Angemessenheitsbeschluss), daher ist dafür kein zusätzlicher Vertrag nötig. <b>Esri</b> in den Vereinigten Staaten liefert die Satellitenansicht. Erst wenn du diese Ansicht einschaltest, fragt dein Browser Esri nach den Bildern, und Esri sieht dann deine IP-Adresse und welche Bilder du angefragt hast. Wir selbst senden Esri nichts. Die Straßenfotos von Mapillary kommen über das weltweite Netz von Meta, das sie von außerhalb des EWR ausliefern kann; es sieht dasselbe wie Esri, und erst wenn du die Straßenansicht öffnest. Von unserem Server aus, und nie mit deiner IP-Adresse: <b>Google Safe Browsing</b> in den Vereinigten Staaten kann die Weblinks erhalten, die Radfahrende Orten hinzufügen, wenn diese Prüfung eingeschaltet ist, und <b>GitHub</b> in den Vereinigten Staaten erhält die Fehler, die das Kuratorenteam veröffentlicht, so wie das Kuratorenteam sie geschrieben hat.'
  h_retention: 'Wie lange wir es aufbewahren'
  retention_account: '<b>Kontodaten.</b> Bis du dein Konto löschst, dann sind sie weg. Die Löschung erfolgt sofort: du forderst sie an, wir mailen dir einen Code, du bestätigst, und in diesem Moment verschwindet das Konto aus der laufenden Datenbank. Die E-Mail-Adresse, der Passwort-Hash, das Zwei-Faktor-Geheimnis und die Backup-Codes gehen mit. Es gibt keine Wartezeit, und es wird nichts für den Fall zurückgehalten, dass du es dir anders überlegst. Unsere nächtlichen Backups enthalten den alten Datensatz noch, bis sie ausrotieren, und das dauert <b>höchstens 90 Tage</b>; diese Backups sind verschlüsselt und werden nur zur Wiederherstellung nach einem Ausfall geöffnet. Ein Konto, bei dem sich <b>24 Monate</b> niemand angemeldet hat, wird auf dieselbe Weise gelöscht. Wir schreiben dir vorher dreimal: nach 12, 22 und 23 Monaten, jedes Mal mit dem Datum, an dem es geschlossen wird. Einmal anmelden genügt, um es zu behalten. Auch nach dieser Löschung enthalten unsere Sicherungen den alten Eintrag, bis sie ersetzt werden, höchstens 90 Tage. Entfernt die Administration dein Konto wegen eines Verstoßes gegen unsere Bedingungen, lesen wir deine E-Mail-Adresse kurz vor der Löschung und verwenden sie ein einziges Mal, direkt danach, um dir die Begründung zu schicken. Danach ist sie weg, wie bei jeder Löschung. Geht diese E-Mail nicht hinaus, behalten wir die Adresse mit der Begründung, bis wir sie erneut senden oder entscheiden, es nicht zu tun, und löschen dann beides.'
  retention_unconfirmed: '<b>Unbestätigte Konten.</b> Ein Konto, dessen E-Mail-Adresse nicht innerhalb von <b>7 Tagen</b> bestätigt wird, wird gelöscht, ohne Warn-E-Mail. Die Adresse kann jemandem gehören, der sich nie angemeldet hat, und die einzige E-Mail, die wir schicken könnten, ginge an diese Person.'
  retention_logs: '<b>Serverprotokolle.</b> Höchstens <b>90 Tage</b> aufbewahrt und danach automatisch gelöscht. Manche Einträge enthalten eine vollständige IP-Adresse, für Sicherheit und den Umgang mit Missbrauch. Diese werden innerhalb derselben 90 Tage gelöscht.'
  retention_ratelimit: '<b>Nutzungszähler und codierte Adressen.</b> Ein Zähler läuft von selbst ab, spätestens zwei Tage nach deiner letzten Nutzung. Eine codierte Adresse bei einer Inhaltsmeldung oder Fehlermeldung bleibt so lange wie die Meldung. Eine bei einer Kontaktnachricht wird mit der Nachricht gelöscht, innerhalb von 24 Monaten nach Abschluss des Gesprächs.'
  retention_contributions: '<b>Beiträge.</b> Fakten, die du zur offenen Karte beisteuerst, bleiben als Teil von The Commons erhalten (mit Provenienz), auch nachdem du gehst; sie sind keine personenbezogenen Daten über dich. Deine Bestätigungen, deine "Bin ich gefahren"-Markierungen (außer auf einer Route, die du selbst vorgeschlagen hast: Die zählten nie und werden gelöscht) und die Geschichte deiner Bearbeitungen bleiben ebenfalls, wenn du gehst, ohne jede Verbindung zu deinem Konto.'
  retention_traffic: '<b>Verkehrszusammenfassungen.</b> Eine Zeile wartet verschlüsselt, bis ihre Straße genug Fahrten hat, geht dann in die Summen pro Straße ein und wird gelöscht. Die Summen bleiben Teil des Commons. Sie enthalten keine Radfahrenden; daher wird mit deinem Konto nichts daraus gelöscht.'
  retention_messages: '<b>Nachrichten zu deinen Beiträgen.</b> Die Nachrichten zwischen dir und dem Kuratorenteam zu deinen Beiträgen bleiben erhalten, solange dein Konto besteht, und werden mit ihm gelöscht. Das gilt auch für die Begründungen, die wir dir schicken, wenn eine Entscheidung etwas einschränkt, das du hinzugefügt hast, für deine Beiträge, die abgelehnt wurden oder die du zurückgezogen hast, bevor das Kuratorenteam darüber entschieden hat, und für deine Bewerbungen als Kurator:in. Eine Anfrage, ein Land zu öffnen, bleibt nur als anonyme Zählung, ohne deine Notiz und ohne dein Angebot, dort zu kuratieren. Was das Kuratorenteam angenommen hat, bleibt auf der Karte, ohne deinen Namen. Ein Beitrag, der für ein rechtliches Verfahren festgehalten wird, bleibt mit seinen Nachrichten erhalten, solange das dauert. Jede Begründung schicken wir dir auch per E-Mail; eine Begründung zu deinem Konto nur per E-Mail.'
  retention_suspension: '<b>Sperrungen.</b> Sperrt die Administration dein Konto, speichern wir dort, wann die Sperrung begann und wann sie endet, den Grund, die Tatsachen, wie wir sie dir geschickt haben, und wer aus der Administration entschieden hat. Das bleibt, bis eine spätere Sperrung es ersetzt oder das Konto gelöscht wird. Wird das Konto dieser Administratorin oder dieses Administrators gelöscht, wird die Verbindung dazu entfernt. Dein Datenexport enthält all das, außer wer entschieden hat. Unser Administrationsprotokoll hält das Konto, den Grund und das Enddatum fest, nie die Tatsachen oder deine Adresse.'
  retention_consent: '<b>Lizenz-Einwilligungen.</b> Wenn du ein Foto oder eine Übersetzung an The Commons lizenzierst, halten wir fest, dass du zugestimmt hast, welchem Wortlaut genau, und wann. Wir bewahren diesen Nachweis unbefristet auf, und er überdauert die Schließung deines Kontos: Er ist unser Beleg dafür, dass die Lizenz erteilt wurde, den wir zur Geltendmachung oder Verteidigung von Rechtsansprüchen benötigen könnten (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_17">DSGVO Art. 17 Abs. 3 lit. e</a>). Er enthält einen Verweis auf dein Konto und sonst nichts über dich. Wenn du dein Konto löschst, entfernen wir diesen Verweis, und der Eintrag bleibt nur mit dem Foto oder der Übersetzung verbunden.'
  retention_mail: '<b>E-Mails und Nachrichten über das Kontaktformular, die du uns schickst.</b> Wir bewahren ein Gespräch auf, solange die Sache läuft, und löschen es innerhalb von <b>24 Monaten</b> nach ihrem Abschluss. Das deckt dich ab, wenn du ein Jahr später darauf zurückkommst, und uns, wenn spät eine Beschwerde über unseren Umgang damit eintrifft. Gespräche, die zu einer rechtlichen Sache gehören, etwa einer Urheberrechtsbeschwerde oder einem Löschverlangen, bewahren wir auf, bis diese Sache erledigt ist.'
  retention_bugs: '<b>Fehlermeldungen.</b> Eine Fehlermeldung bleibt erhalten, als Teil der Aufzeichnung darüber, was kaputt war und wie es behoben wurde. Warst du angemeldet, ist sie mit deinem Konto verknüpft, bis du das Konto löschst; danach bleibt sie ohne diese Verknüpfung. Die E-Mail-Adresse, die du für unsere Antwort angegeben hast, bewahren wir auf, solange der Fehler offen ist, und löschen sie <b>24 Monate</b>, nachdem wir dir das Ergebnis mitgeteilt haben, dieselbe Frist wie für E-Mails, die du uns schickst.'
  retention_reports: '<b>Meldungen zu Inhalten.</b> Wenn du etwas auf der Website meldest, auch ein Foto, das dich zeigt, bewahren wir die Adresse, die du für unsere Antwort hinterlassen hast, auf, bis wir über deine Meldung entschieden haben: Wir haben gehandelt, nichts Falsches gefunden oder die Meldung geschlossen, weil sie nicht mehr zutrifft. Wir löschen die Adresse <b>90 Tage</b> nach dieser Entscheidung. Die Meldung selbst bleibt erhalten, als Aufzeichnung dessen, was uns gemeldet wurde und was wir damit getan haben. Wird das gemeldete Foto für ein rechtliches Verfahren zurückgehalten, bewahren wir die Adresse auf, bis diese Sperre aufgehoben ist.'
  retention_authorities: '<b>Meldungen an Behörden.</b> Wenn wir eine Behörde über etwas informieren, das hier veröffentlicht wurde, halten wir fest, wann, welche Behörde, ihr Aktenzeichen und wer aus der Administration es eingetragen hat. Dieser Eintrag bleibt beim Foto oder bei der Einreichung, solange es sie gibt, und das Material bleibt erhalten, bis die Behörde sagt, dass es gelöscht werden darf. Eine Zeile in unserem Administrationsprotokoll, mit dem Aktenzeichen und der Behörde, aber nichts vom Material, bleibt ohne Enddatum erhalten. Wird das Konto der Administratorin oder des Administrators gelöscht, wird die Verbindung dazu entfernt, und der Eintrag bleibt.'
  retention_updates: '<b>Die Release-Liste.</b> Deine Adresse bleibt darauf, bis du sie herunternimmst, in den Einstellungen oder über den Link in jeder Nachricht. Den Nachweis, dass du zugestimmt hast und welchem Wortlaut, bewahren wir wie eine Foto-Lizenzeinwilligung auf: er belegt, dass wir dir schreiben durften.'
  h_security: 'Wie wir es schützen'
  security_intro: 'Das Gesetz verlangt Maßnahmen, die zum Risiko passen (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_32">DSGVO Art. 32</a>). In einfachen Worten:'
  security_passwords: '<b>Dein Passwort wird nie gespeichert.</b> Wir behalten davon nur einen Hash, der sich nicht umkehren lässt: niemand hier kann dein Passwort lesen, und eine gestohlene Datenbank gibt auch niemandem deines in die Hand.'
  security_secrets: '<b>Zwei-Faktor-Geheimnisse und Backup-Codes sind dort verschlüsselt, wo sie liegen</b>, mit dem Schlüssel außerhalb der Datenbank. Wer nur die Datenbank stiehlt, bekommt daraus trotzdem keinen funktionierenden Code.'
  security_transport: '<b>Alles läuft verschlüsselt</b>, zwischen dir und uns und noch einmal, wenn ein Backup unsere Server verlässt. Browsern wird gesagt, eine unverschlüsselte Verbindung zu uns überhaupt abzulehnen.'
  security_access: '<b>Nur wer deine Daten braucht, kommt an sie heran</b>, und jede Moderations- und Verwaltungsanmeldung braucht zwei Faktoren. Wiederholte Fehlanmeldungen werden gebremst und dann gesperrt.'
  security_source_pre: 'Das ist die kurze Fassung. Die genauen Maßnahmen, und die Begründung für jede einzelne, stehen in unserem'
  security_source_link: 'öffentlichen Quellcode'
  security_source_post: '. Genau dafür bauen wir es offen: du musst einen Sicherheitsabsatz nicht auf Treu und Glauben hinnehmen.'
  security_honest: 'Kein System ist perfekt, und wir tun nicht so, als wäre unseres es. Hinter diesem Absatz steht keine Zertifizierung und kein Penetrationstest: was es gibt, ist ein kleines System, das so wenig wie möglich aufbewahrt, und Code, den jeder nachlesen kann.'
  h_breach: 'Wenn doch einmal Daten abfließen'
  breach_pre: 'Wenn personenbezogene Daten verloren gehen, offenliegen oder von jemandem erreicht werden, der sie nicht haben sollte, und das voraussichtlich ein Risiko für die Rechte von Menschen bedeutet, melden wir es der'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>innerhalb von 72 Stunden</b>, nachdem wir davon erfahren (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_33">DSGVO Art. 33</a>). Ist das Risiko für dich persönlich hoch, wenden wir uns außerdem direkt und unverzüglich an dich (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_34">DSGVO Art. 34</a>), in klarer Sprache: was passiert ist, welche deiner Daten betroffen waren, was wir dagegen getan haben und was du tun solltest. Wir führen intern ein Verzeichnis jeder Verletzung, auch der nicht meldepflichtigen, damit das Muster für uns sichtbar bleibt, selbst wenn kein einzelner Fall für sich meldepflichtig ist.'
  h_rights: 'Deine Rechte'
  rights_intro: 'Nach der <a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679">DSGVO</a> hast du folgende Rechte:'
  rights_access: '<b>Auskunft (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_15">DSGVO Art. 15</a>)</b>: fordere eine Kopie der personenbezogenen Daten an, die wir über dich vorhalten.'
  rights_correct: '<b>Berichtigung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_16">DSGVO Art. 16</a>)</b>: korrigiere Unrichtiges oder vervollständige Fehlendes.'
  rights_erase: '<b>Löschung (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_17">DSGVO Art. 17</a>)</b>: lösche dein Konto jederzeit in deinen Kontoeinstellungen. Deine personenbezogenen Daten gehen mit und kommen nicht zurück: deine Kontodaten, deine Nachrichten, deine Stimmen, deine Bewerbungen als Kurator:in und deine Beiträge, die abgelehnt wurden oder die du zurückgezogen hast. Manches bleibt noch eine Weile: unsere verschlüsselten Sicherungen enthalten den alten Datensatz, bis sie ersetzt werden, höchstens 90 Tage, und ein Beitrag, der für ein rechtliches Verfahren festgehalten wird, bleibt, solange das dauert. Manches bleibt bewusst bestehen, ohne jede Verbindung zu deinem Konto: die Beiträge, die du der offenen Karte gegeben hast, deine Bestätigungen und "Bin ich gefahren"-Markierungen (außer auf einer Route, die du selbst vorgeschlagen hast: Die zählten nie und werden gelöscht), die Geschichte der Bearbeitungen, deine Fehlermeldungen und der Nachweis, dass du eine Lizenz erteilt hast. Eine Anfrage, ein Land zu öffnen, bleibt nur als anonyme Zählung, ohne deine Notiz und ohne dein Angebot, dort zu kuratieren. Deine freigegebenen Fotos bleiben ebenfalls, einer anonymen Person zugeschrieben, außer dein Profil ist öffentlich und du entscheidest beim Gehen, deinen Namen darauf zu behalten. All das steht oben unter <b>Wie lange wir es aufbewahren</b>.'
  rights_portability: '<b>Datenübertragbarkeit (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_20">DSGVO Art. 20</a>)</b>: lade herunter, was wir über dich gespeichert haben, als eine einzige ZIP-Datei in deinen Kontoeinstellungen, bis zu 3-mal am Tag. Diese Grenze ist nur da, um Missbrauch zu stoppen. Sie enthält unter anderem deine Kontodaten, deine Beiträge, deine Nachrichten und Begründungen, deine Lizenzeinwilligungen und deine Fotos als Dateien. Sie enthält nicht, was jemand anderes geschrieben hat, als er oder sie eines deiner Fotos gemeldet hat, denn diese Worte gehören der meldenden Person. Solange das Kuratorenteam eine solche Meldung noch prüft oder ein Foto für die Behörden zurückgehalten wird, enthält sie auch den Grund nicht; die Entscheidung nennt ihn dir.'
  rights_restrict: '<b>Einschränkung und Widerspruch (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_18">DSGVO Art. 18–21</a>)</b>: schränke bestimmte Verarbeitungen ein oder widerspreche ihnen.'
  rights_withdraw: '<b>Einwilligung widerrufen</b> jederzeit, zum Beispiel indem du dein öffentliches Profil oder die Neuigkeiten-Mails ausschaltest. Ab diesem Moment hören wir mit dem auf, wozu du eingewilligt hattest. Was wir vorher mit deiner Einwilligung getan haben, bleibt rechtmäßig (<a href="https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32016R0679#art_7">DSGVO Art. 7 Abs. 3</a>).'
  rights_third_party_photo: '<b>Kein Konto?</b> Diese Rechte hängen nicht an einem Konto. Bist du auf einem Foto auf unserer Karte erkennbar, trägt jede Fotoseite den Link <b>"dieses Foto zeigt mich"</b>. Melde es dort, ohne Konto und ohne Ausweis, und eine Kuratorin oder ein Kurator antwortet spätestens innerhalb eines Monats.'
  rights_contact_pre: 'Um eines dieser Rechte wahrzunehmen, schreib'
  rights_contact_mid: '. Wir antworten <b>spätestens innerhalb eines Monats</b>, normalerweise deutlich früher. Das Gesetz erlaubt bis zu drei Monate für eine wirklich komplizierte Anfrage, aber nur, wenn wir dir innerhalb des ersten Monats sagen, dass es länger dauert, und warum. Bist du mit unserer Antwort nicht zufrieden, kannst du dich bei der'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: ' beschweren.'
  h_children: 'Kinder'
  children_body: 'The Commons ist nicht für Kinder unter <b>16</b> Jahren gedacht. Wir erheben wissentlich keine personenbezogenen Daten von Personen unter diesem Alter; wenn du glaubst, dass ein Kind uns Daten übermittelt hat, kontaktiere uns und wir löschen sie.'
  h_automated: 'Automatisierte Entscheidungen'
  automated_body: 'Wir treffen keine Entscheidungen über dich ausschließlich auf automatisiertem Wege und erstellen keine Profile von dir für Werbezwecke.'
  h_changes: 'Änderungen dieser Richtlinie'
  changes_body: 'Wenn wir ändern, wie wir mit Daten umgehen, fügen wir hier eine neue Version hinzu, mit Datum und Änderungen, und zeigen angemeldeten Radfahrenden einen Hinweis, bis sie sie gelesen haben. Eine wesentliche Änderung, etwa ein neuer Zweck, ein neuer Empfänger oder ein neues Land, schicken wir außerdem jedem Konto mindestens 30 Tage vor ihrem Inkrafttreten per E-Mail, damit du sie lesen und vorher dein Konto schließen kannst, wenn du nicht einverstanden bist. Dein Konto speichert, welche Version jeder Seite du zuletzt gesehen hast.'
  changes_versions_pre: 'Sieh dir die'
  changes_versions_link: 'Versionsgeschichte'
  changes_versions_post: ' auf GitHub an.'
  footer_disc_pre: 'Siehe auch unsere'
  footer_disc_terms: 'Nutzungsbedingungen'
  footer_disc_mid: 'und die'
  footer_disc_licences: 'Lizenzen für Daten, Medien und Code'
  footer_disc_post: '.'
  version_line: 'Version %n% · %date%'
  changed_bar: 'Unsere Datenschutzerklärung hat sich am %date% geändert.'
  changing_bar: 'Unsere Datenschutzerklärung ändert sich am %date%.'
  upcoming_box: 'Ab dem %date% gilt eine neue Version.'
  upcoming_link: 'Lies die neue Version'
  next_box: 'Dies ist die neue Version. Sie gilt ab dem %date%.'
  next_back: 'Lies die Version, die jetzt gilt'
  changed_read: 'Lies, was sich geändert hat'
  change:
    v1_first: 'Die erste nummerierte Version. Frühere Fassungen stehen in der unten verlinkten Versionsgeschichte.'
    v2_traffic: 'Neu: In der Fahrtprüfung von Scout kannst du eine <b>Verkehrszusammenfassung</b> einer Fahrt mit Radar senden: pro Straße die Strecke, die Autos und die Tageszeit. Eine Zusammenfassung enthält keine GPS-Spur. Sieh, was wir erheben und wie lange wir es aufbewahren.'
    v2_time_zone: 'Neu: Wir speichern deine <b>Zeitzone</b>, die du in den Einstellungen wählst oder die dein Browser meldet, um Uhrzeiten darin anzuzeigen.'
    v2_pseudonym: 'Korrigiert: Bei ausgeschaltetem Profil zeigen deine Beiträge dein festes <b>Pseudonym</b>, nicht gar keinen Namen.'
    v2_base_location: 'Geändert: dein <b>Standort</b> wird als zufälliger Punkt bis zu etwa 2,5 km vom gewählten Punkt gespeichert, statt als ein auf etwa 1 km gerundeter Punkt.'
    v2_clearer: 'Leichter zu lesen. Die Erklärung sagt, dass beides, was du aus Scout senden kannst, Verkehrszusammenfassungen und Tags, bei jeder Fahrt deine Wahl ist. Sie erklärt in einfachen Worten, wie wir dein Passwort aufbewahren, warum wir zählen, wie oft ein Werkzeug ohne Konto genutzt wird, und was die Karte in deinem eigenen Browser speichert. Für jeden Dienst außerhalb des EWR steht dort, was dieser Dienst sieht. Jeder genannte DSGVO-Artikel verlinkt auf den Gesetzestext selbst.'
    v2_errors: 'Ergänzt: <b>Fehlerberichte</b> unseres Servers, was sie enthalten, und dass sie auf unseren eigenen Maschinen bleiben.'
    v2_notice: 'Ergänzt: wie wir dich über Änderungen informieren. Eine wesentliche Änderung schicken wir dir mindestens 30 Tage vor ihrem Inkrafttreten per E-Mail; eine kleinere bekommt hier eine neue Version.'
    v2_more: 'Ergänzt: was ein Scout-Tag sendet; was wir von Fehlermeldungen, Bewerbungen als Kurator:in und "Bin ich gefahren"-Markierungen speichern; deine übrigen Einstellungen; wo wir codierte IP-Adressen speichern, und wie lange; dass Links, die Orten hinzugefügt werden, mit Google Safe Browsing geprüft werden können; und was mit jeder Art von Daten passiert, wenn du dein Konto löschst.'
    v2_statements: 'Ergänzt: die <b>Begründungen</b>, die wir schicken, wenn eine Entscheidung etwas einschränkt, das du hinzugefügt hast: bei deinen Nachrichten gespeichert, solange dein Konto besteht, Teil deines Datenexports und per E-Mail an dich geschickt.'
    v2_suspension: 'Ergänzt: was wir speichern, wenn die Administration ein Konto <b>sperrt</b>, wie lange, und was dein Datenexport davon enthält; und dass eine Entfernung wegen eines Verstoßes deine E-Mail-Adresse ein einziges Mal nutzt, um dir die Gründe zu schicken.'
    v2_authorities: 'Ergänzt: wann uns das Gesetz verpflichtet, die <b>Polizei oder eine Justizbehörde</b> über eine Gefahr für das Leben oder die Sicherheit eines Menschen zu informieren, was wir ihr geben, auf welcher Rechtsgrundlage und wie lange wir den Eintrag aufbewahren.'
