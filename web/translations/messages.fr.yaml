about:
  kicker: 'À propos'
  title: 'La carte appartient à tous.'
  lead1: 'Chaque cycliste porte une carte privée : la fontaine qui a sauvé un juillet brûlant, la montée qui vaut l''heure de détour, la petite route qui est toujours vide. Aujourd''hui ce savoir vit dans une tête et disparaît avec elle. Cycling Commons est l''endroit où il vit à la place.'
  lead2: 'C''est une carte ouverte, construite par la communauté, des plus belles expériences à vélo du monde, pour tous les types de cyclisme. Des données ouvertes que tout le monde peut utiliser, gouvernées par les cyclistes qui la construisent.'
  problem_kicker: 'Le problème'
  problem_title: 'Une application différente pour tout.'
  problem_lead1: 'Les cols dans une appli, les itinéraires dans une autre, les hébergements dans une troisième, l''état des routes nulle part, la plupart fermés, aucun connecté. Les cyclistes assemblent une douzaine d''outils et les données ne se rejoignent jamais. La plupart du savoir existe ; il est simplement éparpillé et/ou enfermé.'
  problem_lead2: 'Le Commons rassemble le savoir non personnel, la carte, jamais le cycliste, en un seul endroit ouvert. Libre à interroger, libre à exporter, libre à utiliser, par n''importe qui.'
  believe_kicker: 'Ce en quoi nous croyons'
  believe_princ1_num: 'II'
  believe_princ1_title: 'La carte, pas le cycliste.'
  believe_princ1_body: 'Des faits ouverts sur les lieux, pas les personnes, le Commons ne collecte rien sur comment, où, ni quand vous roulez.'
  believe_princ2_num: 'III'
  believe_princ2_title: 'Ouvert pour tous.'
  believe_princ2_body: 'Données ODbL, médias CC BY-SA 4.0, une API gratuite, utilisable par tous, à titre commercial ou non.'
  believe_princ3_num: 'I'
  believe_princ3_title: 'Curation, pas surcharge.'
  believe_princ3_body: 'Le meilleur d''une région, voté par les cyclistes, pas un déversement sans fin.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Gouverné, pas seulement publié.'
  believe_princ4_body: 'Fondé sur les principes d''Elinor Ostrom pour les biens communs qui ne s''effondrent pas et ne sont pas accaparés.'
  believe_ostrom: 'a montré que des communautés peuvent gérer une ressource partagée sans la privatiser et sans propriétaire central. Elle a partagé le prix Nobel d''économie 2009 avec Oliver E. Williamson, sa moitié pour son analyse des communs. La'
  believe_ostrom_link: 'page Gouvernance'
  believe_ostrom_suffix: 'associe chaque principe à une partie du système.'
  made_kicker: 'Comment ça se fait'
  made_title: 'Cinq sortes de personnes, une seule boucle.'
  made_ride: '<b>Les cyclistes</b> trouvent eau, ravitaillement, points de réparation, cols et hébergements sur une seule carte. Ils vérifient un itinéraire avant de partir, ou le préparent d''après ce que montre la carte et le terminent dans le planificateur qu''ils utilisent déjà.'
  made_add: '<b>Les contributeurs</b> ajoutent ce qu''ils trouvent en route, d''un nouveau robinet à un pont fermé. Un curateur vérifie chaque ajout avant sa mise en ligne.'
  made_curate: '<b>Les curateurs</b> veillent sur une région qu''ils connaissent : ils examinent ce que les cyclistes envoient, gardent cette partie de la carte juste et font connaître le Commons aux cyclistes du coin.'
  made_extend: '<b>Les makers</b> construisent la plateforme elle-même : code, chaînes de données, design, traductions et financement.'
  made_build: '<b>Les développeurs d''applications</b> intègrent les données ouvertes à leurs propres applis et outils, librement sous licence ouverte, pour qu''elles atteignent les cyclistes où qu''ils roulent. À terme, ce que leurs utilisateurs ajoutent revient par la même API.'
  partners_kicker: 'Partenaires, pas silos'
  partners_title: 'Là où de bonnes données ouvertes existent, nous les rejoignons.'
  partners_lead1_pre: 'Le Commons n''est pas là pour reconstruire ce que d''autres ont déjà ouvert. Nous nous appuyons sur'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'et y contribuons en retour. Et pour les couches que nous ne possédons pas, comme les hébergements bike-friendly, nous préférons'
  partners_lead1_partner: 'nous associer à des communautés ouvertes'
  partners_lead1_post: ', comme les réseaux d''hospitalité ouverts, plutôt que d''enfermer une copie privée de leurs données.'
  partners_lead2: 'Les données ouvertes doivent se connecter, pas se fragmenter davantage. Chaque partenariat enrichit l''atlas entier sans que personne ne le clôture.'
  steward_kicker: 'Qui le gère'
  steward_title: 'BikeCoders aujourd''hui, une fondation demain.'
  steward_lead: 'BikeCoders amorce et gère le Commons aujourd''hui. Mais l''engagement est public dès le premier jour : licence ouverte, données et comptes séparés, et une voie pour devenir une fondation indépendante une fois qu''une communauté sera là pour la gouverner. Tout ce qui est déjà publié, code comme données, reste ouvert pour de bon : aucun futur propriétaire, aucune vente, aucun revirement ne peut le reprendre.'
  steward_cta_map: 'Explorer la carte →'
  steward_cta_account: 'Créer un compte gratuit'
coverage:
  kicker: 'État de l''Atlas'
  title: 'La carte est-elle complète ?'
  lead: 'Ce qui est couvert, ce qui est lacunaire, et où l''aide est la bienvenue. Des chiffres en direct, tirés de la base de données.'
  kpi_pois: 'Éléments de référence recensés'
  kpi_items: 'Éléments du catalogue'
  kpi_routes: 'Itinéraires recommandés'
  kpi_countries: 'Pays démarrés'
  table_kicker: 'Couverture par pays'
  terms_reference: '<b>Éléments de référence</b> : la base que nous suivons pour chaque zone, moissonnée depuis OpenStreetMap. Cette couche est intégralement OSM ; les données d''autres sources sont importées comme éléments du catalogue, où elles conservent leur propre provenance.'
  terms_catalog: '<b>Éléments du catalogue</b> : ce que le Commons cure lui-même, avec ses propres attributs, historique et confirmations. La deuxième ligne indique d''où viennent ces entrées : <b>OSM</b> repris d''OpenStreetMap, <b>partenaire</b> importé d''un jeu de données ouvert maintenu par quelqu''un d''autre, <b>cyclistes</b> contribué ici, <b>dérivé</b> calculé par le pipeline.'
  terms_bars: '<b>Par %u%</b> : la densité sur la zone intégrée, pour qu''un petit pays se compare équitablement à un grand. La barre est ce même chiffre, mis à l''échelle du pays le plus dense.'
  th_country: 'Pays'
  th_regions: 'Régions'
  th_pois: 'Éléments de référence'
