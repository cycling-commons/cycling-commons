developers:
  kicker: 'Construisez sur le Commons'
  title: 'Données ouvertes. Une API ouverte.<br>Pour qui veut construire.'
  lead: 'Interrogez le Commons par zone et par type, ou téléchargez l''export hebdomadaire et hébergez-le vous-même. Les données sont ouvertes (ODbL), c''est ce qui en fait un commun. Pas de clé, pas de compte, pas de frais : une limite de débit et un usage raisonnable, c''est tout.'
  status: 'En conception — ces points de terminaison sont le contrat que nous construisons. Parcourez la <a href="/developers/api">référence interactive de l''API</a> (en anglais) ou la <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">spécification sur GitHub</a>.'
  ep_kicker: 'Points de terminaison'
  ep1_path: '/v1/search'
  ep1_desc: 'trouver la couverture par <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'un élément, avec notre enrichissement et sa provenance <b>(prévu)</b>'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'polygone de région et statistiques de couverture <b>(prévu)</b>'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'le best-of d''une région <b>(prévu)</b>'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'détail d''itinéraire et téléchargement GPX <b>(prévu)</b>'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'tuiles vectorielles et TileJSON, à intégrer dans votre style MapLibre <b>(prévu)</b>'
  ep7_path: '/v1/contributions'
  ep7_desc: 'contribuer <b>(prévu)</b>, passe par la même file de relecture que les contributions dans l''application'
  ex_kicker: 'Exemple de requête'
  resp_kicker: 'Réponse'
  ex_hydrate: 'Les réponses sont par défaut en référence seule : nos champs ajoutés plus l''<code>osm_ref</code> à hydrater auprès d''OSM. <code>?hydrate=osm</code> y fusionne notre sous-ensemble OSM en cache.'
  attr_kicker: 'Attribution obligatoire'
  rules_kicker: 'Les règles'
  rules_body: '<b>Usage raisonnable.</b> Les lectures sont ouvertes à tous, sans clé ni compte, dans une limite de débit par adresse qu''une application normale reste loin d''atteindre. Pour un usage massif ou hors ligne, téléchargez l''<b>export hebdomadaire</b> et hébergez-le, plutôt que de marteler l''API en direct ; le scraping du service n''est pas autorisé. Licences : données <b>ODbL 1.0</b>, médias <b>CC BY-SA 4.0</b>. Créditez, partagez à l''identique, gardez ouvert. L''usage commercial est permis. Voir le résumé en langage clair :'
  ep_export_desc: 'toutes les données en GeoJSON, reconstruites chaque semaine :'
  export_link: 'export en masse'
  ep_export_pending: 'Export en masse : toutes les données en GeoJSON, reconstruites chaque semaine. Le premier export est en préparation.'
data_export:
  # The bulk export's page (docs/specs/api-strategy.md section 3.1).
  meta_title: 'Export en masse de Cycling Commons'
  meta_description: 'Téléchargez toutes les données ouvertes de Cycling Commons en GeoJSON, reconstruites chaque semaine, sous Open Database License.'
  kicker: 'Construisez sur le Commons'
  title: 'L''export en masse'
  lead: 'Toutes les données ouvertes en deux fichiers : chaque lieu et chaque itinéraire de la carte, en GeoJSON, reconstruits chaque semaine. Téléchargez-les une fois et hébergez-les vous-même, plutôt que de parcourir le site ou l''API.'
  latest_kicker: 'Dernier instantané'
  empty: 'Aucun instantané n''a encore été publié. Le premier apparaîtra ici après la première construction hebdomadaire.'
  built: 'Construit le %when%.'
  file_places: '%n% lieux'
  file_routes: '%n% itinéraires'
  manifest_desc: 'ce que contient l''instantané : date de construction, licence et attribution par source, nombres, tailles et sommes de contrôle sha256'
  latest_links: 'Pour les scripts, un lien qui mène toujours au dernier instantané :'
  holds_kicker: 'Ce qu''il contient'
  holds_body: 'Chaque lieu et chaque itinéraire que montre la carte, avec les champs que leur donne l''API : nom, lettre de type, position ou tracé, niveau, degré de confiance et les preuves qui le fondent, région, pays, et la référence OpenStreetMap quand il y en a une. Chaque enregistrement indique sa <b>source</b>, pour que vous puissiez créditer comme sa licence le demande.'
  source_counts: '%places% lieux, %routes% itinéraires'
  leaves_kicker: 'Ce qu''il laisse de côté'
  leaves_body: 'Rien sur les personnes : ni comptes, ni noms, ni adresses e-mail, ni notes, ni dossiers de modération. Rien qu''un curateur n''ait laissé sur la carte : aucune contribution en attente, refusée ou à la corbeille, et aucune modification encore en attente de relecture. Pas de photos. Et aucun enregistrement dont la licence de la source ne permet pas le partage sous ODbL ; ceux-là sont comptés ici.'
  left_out_unknown: 'Source sans licence connue'
  attr_kicker: 'Attribution obligatoire'
  licence_body: 'La base de données est sous <b>Open Database License 1.0</b>, son contenu sous <b>Database Contents License 1.0</b>. Utilisez-la pour tout, y compris commercialement : créditez-la comme indiqué, partagez sous la même licence une base de données que vous en tirez, et gardez-la ouverte. Les sources qui demandent leur propre crédit sont listées ci-dessus et dans le manifeste. Voir le résumé en langage clair :'
  cadence_kicker: 'À quelle fréquence'
  cadence_body: 'Un nouvel instantané est construit chaque semaine. Les %keep% plus récents restent disponibles, les plus anciens sont supprimés. Un instantané ne change jamais une fois publié : une somme de contrôle que vous avez notée reste valable. Pour des données de moins d''une semaine, utilisez l''API.'
  format_body: 'Chaque fichier est une <code>FeatureCollection</code> GeoJSON compressée en gzip, en WGS84 (EPSG:4326), une entité par ligne, avec <code>licence</code> et <code>attribution</code> en tête. Les coordonnées ont six décimales.'
  back: 'Retour à la page développeurs'
