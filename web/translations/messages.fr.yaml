    field:
      community_voting_live:
        label: 'Le vote saisonnier est actif'
        help: 'Mettez 1 quand les tours de vote sont ouverts. À 0, chaque appel au vote sur la carte reste masqué — un bouton pour un tour qui n''existe pas semble cassé.'
      map_curated_default_threshold:
        label: 'Éligibilité au Best-of : total d’éléments'
        help: 'Nombre total d’éléments sélectionnés qu’une région doit atteindre avant qu’un curateur puisse l’ouvrir en mode Sélection par défaut. Abaissez-le pour débloquer plus tôt les jeunes régions, augmentez-le pour maintenir le niveau d’exigence.'
      map_curated_default_min_blocks:
        label: 'Éligibilité au Best-of : types d’éléments'
        help: 'Nombre de blocs différents (revêtement, cols, hébergements, panoramas, patrimoine, meilleurs itinéraires) devant chacun atteindre leur propre minimum. Réglez sur 1 pour revenir à un simple total.'
      map_curated_default_min_per_block:
        label: 'Éligibilité au Best-of : éléments par type'
        help: 'Ce qu’un bloc doit contenir pour compter dans l’exigence ci-dessus. Ensemble, ces deux nombres empêchent qu’une seule couche porte une région à elle seule.'
      map_confirmation_stale_months:
        label: "Les confirmations expirent après (mois)"
        help: "Combien de temps compte la vérification d'un point d'eau, d'un magasin, de toilettes ou d'un danger par un cycliste. Au-delà, la carte entoure le repère d'un anneau orange, pour qu'un cycliste qui passe sache qu'il vaut la peine d'y jeter un œil. Une vérification remet le compteur à zéro. Les lieux qui ne changent pas - cols, points de vue, patrimoine - n'expirent jamais."
      route_region_active_cap:
        label: 'Itinéraires actifs par région'
        help: 'Nombre d’itinéraires qu’une région peut afficher simultanément. Un curateur qui approuve au-delà du plafond est bloqué et invité à en retirer un d’abord.'
      route_ride_verify_threshold:
        label: 'Sorties nécessaires pour vérifier un itinéraire'
        help: 'Nombre de cyclistes, autres que l’auteur de la proposition, devant déclarer avoir parcouru l’itinéraire pour qu’il se vérifie de lui-même. Abaissez-le dans les jeunes régions où les itinéraires resteraient sinon en attente.'
      moderation_retention_months:
        label: 'Conservation des éléments traités (mois)'
        help: 'Durée de conservation des corrections et contributions déjà traitées avant leur suppression par le nettoyage automatique. La décision de modération, elle, est conservée.'
      media_urgent_breaker_hourly:
        label: 'Budget de retrait automatique : par heure'
        help: 'Combien de photos un signalement anonyme « image intime ou enfant » peut masquer seul sur la carte en une heure. Masquer n''est pas retirer — seul un curateur retire une photo. Au-delà de ce budget, les signalements parviennent toujours au bureau de modération mais ne masquent plus rien, et vous êtes prévenu par e-mail. Mettez 0 pour désactiver totalement le masquage automatique pendant une attaque prolongée.'
      media_urgent_breaker_daily:
        label: 'Budget de retrait automatique : par jour'
        help: 'Le même plafond mesuré sur une journée, pour qu''un goutte-à-goutte ne réussisse pas là où une rafale échoue. Les deux budgets doivent avoir de la marge avant qu''un signalement puisse masquer une photo de lui-même.'
      app_alert_emails:
        label: 'Destinataires des alertes'
        help: 'Adresses e-mail séparées par des virgules qui reçoivent les alertes opérationnelles : l''ouverture du coupe-circuit et chaque escalade de contenu suspecté illégal. Modifiez-la quand la personne habituelle est absente — une escalade doit atteindre quelqu''un le jour même. Au moins une adresse valide est requise.'
      app_support_emails:
        label: 'Destinataires du support'
        help: 'Adresses e-mail séparées par des virgules qui reçoivent les messages du formulaire de contact et les signalements de bogues. Distinctes des destinataires d''alerte ci-dessus, pour que la porte d''entrée et le bipeur puissent viser des personnes différentes. Laissez VIDE pour retomber sur les destinataires d''alerte.'
