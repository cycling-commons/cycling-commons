  vote_title: 'Cycling Commons — Voter'
  vote_description: 'Votez pour les meilleurs cols, itinéraires, panoramas, lieux de patrimoine et hébergements de votre région, saison après saison.'
  improve_title: 'Cycling Commons — Améliorer / ajouter un lieu'
  improve_description: 'Améliorez un lieu dans le Commons — corrigez les détails, signalez les conditions et gardez l''atlas cycliste ouvert exact pour chaque cycliste.'
  propose_route_title: 'Cycling Commons — Proposer un itinéraire'
  propose_route_description: 'Partagez une sortie recommandée : téléversez votre GPX, un curateur l''examine, la communauté vérifie et vote.'
  propose_route_edit_title: 'Cycling Commons · Modifier votre proposition d''itinéraire'
  propose_route_edit_description: 'Modifiez votre proposition d''itinéraire tant qu''elle attend son examen.'
  route_photos_title: 'Cycling Commons · Ajouter des photos à un itinéraire'
  route_photos_description: 'Ajoutez vos propres photos à un itinéraire recommandé. Un curateur les examine avant qu''elles n''apparaissent sur la carte.'
  contact_title: 'Cycling Commons — Contact'
  contact_description: 'Écrivez au Cycling Commons sans logiciel de messagerie et sans compte. Un formulaire, une adresse publiée, et qui gère légalement le site.'
  bug_report_title: 'Cycling Commons — Signaler un bogue'
  report_guide_title: 'Cycling Commons — Signaler une page ou une photo'
  report_guide_description: 'Où se trouve le lien Signaler pour un lieu, un itinéraire, une région, un cycliste, un message ou une photo, et une case qui ouvre le bon formulaire depuis un lien.'
  bug_report_description: 'Quelque chose ne marche pas sur le Cycling Commons ? Dites-le-nous, avec ou sans compte.'
  known_issues_title: 'Cycling Commons — Problèmes connus'
  known_issues_description: 'Ce que nous savons déjà cassé sur le Cycling Commons, confirmé par un curateur, pour que vous n''ayez pas à le signaler deux fois.'
  accessibility_title: 'Cycling Commons — Accessibilité'
  accessibility_description: 'L''utilisabilité du Cycling Commons, y compris ce qui n''est pas encore assez bon, et comment signaler un obstacle.'
  map_key_title: 'Cycling Commons — Légende de la carte'
  map_key_description: 'Chaque marque sur la carte du Cycling Commons et sa signification : épingles, disques, bordures, badges, lignes et grappes.'
  roles_title: 'Cycling Commons : contributeurs et curateurs'
  roles_description: 'Ce que fait un contributeur et ce que fait un curateur sur la carte Cycling Commons, et comment une modification devient confirmée.'
legend:
  kicker: 'Légende de la carte'
  title: 'Chaque marque sur la carte'
  lead: 'Une épingle empile quelques signaux indépendants sur une même forme : d''où vient la fiche, quel type de lieu c''est, et ce qui lui arrive.'
  axes_h: 'Lire une épingle'
  axis_shape_h: 'Forme'
  axis_shape_t: 'Un petit disque ou une goutte. Le disque est la base : une fiche tenue par un fournisseur générique, OpenStreetMap compris. La goutte est une fiche tenue par un fournisseur spécialisé ou par cette communauté.'
  axis_fill_h: 'Couleur de fond'
  axis_fill_t: 'La catégorie. Eau, toilettes, montées, services. Le fond ne dit jamais rien d''autre ; ce qu''un lieu est au sein de sa catégorie se lit dans le pictogramme.'
  axis_border_h: 'Bordure'
  axis_border_t: 'Qui tient la fiche. Petit disque : un fournisseur générique. Pointillés d''encre : une source spécialisée pour ce type de lieu et cette région. Papier plein : cette communauté. Un anneau orange signifie que personne ne l''a confirmée depuis %months% mois ; une bordure rouge épaisse, depuis %months_red% mois.'
  axis_badge_h: 'Badge'
  axis_badge_t: 'En haut à droite : un « ? » signifie que personne ne s''est tenu ici, à notre connaissance ; pas de « ? », un témoin daté est enregistré. En haut à gauche : un « ! » rouge signifie inutilisable pour l''instant, une horloge signifie présent, mais pas toujours.'
  tag_live: 'Sur la carte'
  tiers_h: 'D''où vient une fiche'
  tiers_note: 'Qui tient la fiche que vous lisez. Quand deux fiches décrivent un même lieu, la carte garde celle la plus proche du bas de cette liste. Rien ici ne dit si le lieu est bien ; seul le badge dit si quelqu''un s''y est tenu.'
  tier_baseline_h: 'Base importée'
  tier_baseline_t: 'Un petit disque. Quelqu''un l''a mis sur une carte publique et personne ici n''a repris la fiche. Le panneau nomme la source.'
  tier_external_h: 'Tenue par quelqu''un d''autre'
  tier_external_t: 'Une bordure en pointillés. Une source spécialisée pour ce type de lieu et cette région tient cette fiche. Le panneau la nomme et y renvoie.'
  tier_ours_h: 'Notre catalogue'
  tier_ours_t: 'Une bordure papier pleine. Cette communauté tient la fiche : un cycliste l''a ajoutée, ou des cyclistes l''ont confirmée et reprise.'
  tier_unconfirmed_h: 'Personne ne s''est tenu ici'
  tier_unconfirmed_t: 'Un badge « ? », sur n''importe laquelle des trois icônes ci-dessus. Aucun relevé daté, aucune confirmation de cycliste. Si vous passez par là, vérifiez.'
  basemap_h: 'Sur le fond de carte'
  basemap_note: 'Des marques que le fond de carte dessine pour un cycliste, lues en passant. Ce ne sont pas des lieux du catalogue : pas d''épingle, pas de panneau, rien à confirmer.'
  basemap_bollard_h: 'Potelet'
  basemap_bollard_t: 'Un poteau sur la chaussée. Les voitures s''arrêtent, les vélos passent.'
  basemap_gate_h: 'Barrière'
  basemap_gate_t: 'Une barrière en travers du chemin. Elle peut être fermée ; prévoyez de vous arrêter.'
  basemap_bicycle_parking_h: 'Stationnement vélo'
  basemap_bicycle_parking_t: 'Un endroit pour attacher un vélo.'
  basemap_cycle_barrier_h: 'Chicane'
  basemap_cycle_barrier_t: 'Une chicane. Franchissable, mais pas à vive allure.'
  kinds_h: 'Ce qu''est un lieu, au sein de sa catégorie'
  kinds_note: 'Le pictogramme distingue les types à l''intérieur d''une catégorie, et les types ne se comparent jamais d''une catégorie à l''autre : un robinet dont on ne peut pas boire est un autre type de lieu, pas un lieu cassé. Seules les catégories à plusieurs types sont listées.'
  kind_b_tap_h: 'Robinet d''eau potable'
  kind_b_tap_t: 'Une goutte bleue. OSM la cartographie comme eau potable et rien n''indique le contraire. À confirmer sur place.'
  kind_b_no_h: 'Non potable'
  kind_b_no_t: 'Une goutte barrée de rouge. Étiquetée non potable, ou un cycliste l''a dit.'
  kind_b_unk_h: 'Potabilité inconnue'
  kind_b_unk_t: 'Une goutte vide. Soit personne n''a dit si l''eau est potable, soit quelqu''un a regardé sans pouvoir trancher. À considérer comme inconnu.'
  kind_b_food_h: 'Halte ravitaillement'
  kind_b_food_t: 'Fourchette et couteau sur le disque de la catégorie. Une boulangerie, un magasin, un café.'
  kind_b_food_water_h: 'Ravitaillement avec eau'
  kind_b_food_water_t: 'La même, avec une petite goutte bleue : le lieu donne aussi de l''eau potable.'
  kind_d_shop_h: 'Magasin de vélos'
  kind_d_shop_t: 'Un engrenage.'
  kind_d_station_h: 'Station de réparation'
  kind_d_station_t: 'Marteau et pic : une borne en libre-service avec outils.'
  kind_d_pump_h: 'Pompe'
  kind_d_pump_t: 'Un plus cerclé : air comprimé ou pompe publique.'
  kind_g_basic_hut_h: 'Cabane sommaire'
  kind_g_basic_hut_t: 'Une petite cabane avec une porte. Dans OSM : shelter_type=basic_hut.'
  kind_g_dugout_h: 'Abri enterré'
  kind_g_dugout_t: 'Un tertre avec une ouverture. Dans OSM : shelter_type=dugout.'
  kind_g_field_shelter_h: 'Abri de pâture'
  kind_g_field_shelter_t: 'Un abri ouvert sur l’avant. Dans OSM : shelter_type=field_shelter.'
  kind_g_gazebo_h: 'Kiosque'
  kind_g_gazebo_t: 'Un toit sur poteaux. Dans OSM : shelter_type=gazebo.'
  kind_g_lean_to_h: 'Appentis'
  kind_g_lean_to_t: 'Un toit qui descend jusqu’au sol. Dans OSM : shelter_type=lean_to.'
  kind_g_pavilion_h: 'Pavillon'
  kind_g_pavilion_t: 'Un large toit sur colonnes. Dans OSM : shelter_type=pavilion.'
  kind_g_picnic_shelter_h: 'Abri de pique-nique'
  kind_g_picnic_shelter_t: 'Un toit au-dessus d’une table de pique-nique. Dans OSM : shelter_type=picnic_shelter.'
  kind_g_rock_shelter_h: 'Abri sous roche'
  kind_g_rock_shelter_t: 'Un surplomb rocheux. Dans OSM : shelter_type=rock_shelter.'
  kind_g_sun_shelter_h: 'Pare-soleil'
  kind_g_sun_shelter_t: 'Un pare-soleil. Dans OSM : shelter_type=sun_shelter.'
  kind_g_weather_shelter_h: 'Abri contre les intempéries'
  kind_g_weather_shelter_t: 'Un abri fermé avec un banc. Dans OSM : shelter_type=weather_shelter.'
  kind_g_wildlife_hide_h: 'Observatoire de faune'
  kind_g_wildlife_hide_t: 'Un affût sur pieds avec une fente d’observation. Dans OSM : shelter_type=wildlife_hide.'
  kind_g_bus_shelter_h: 'Abribus'
  kind_g_bus_shelter_t: 'Un panneau d’arrêt de bus. Dans OSM : shelter_type=public_transport.'
  kind_g_defibrillator_h: 'Défibrillateur'
  kind_g_defibrillator_t: 'Un cœur avec un éclair. Dans OSM : emergency=defibrillator.'
  kind_p_viewpoint_h: 'Point de vue'
  kind_p_viewpoint_t: 'Des jumelles : un endroit pour s’arrêter et regarder. Dans OSM : tourism=viewpoint.'
  kind_p_peak_h: 'Sommet'
  kind_p_peak_t: 'Un sommet. Dans OSM : natural=peak.'
  kind_p_waterfall_h: 'Cascade'
  kind_p_waterfall_t: 'De l’eau qui tombe d’un rebord. Dans OSM : waterway=waterfall.'
  kind_p_rapids_h: 'Rapides'
  kind_p_rapids_t: 'Des eaux vives dans une rivière. Dans OSM : waterway=rapids.'
  kind_p_cliff_h: 'Falaise'
  kind_p_cliff_t: 'Une paroi rocheuse. Dans OSM : natural=cliff.'
  kind_p_cave_h: 'Entrée de grotte'
  kind_p_cave_t: 'Une ouverture sombre dans la roche. Dans OSM : natural=cave_entrance.'
  kind_p_arch_h: 'Arche rocheuse'
  kind_p_arch_t: 'Une arche naturelle de roche. Dans OSM : natural=arch.'
  kind_p_rock_h: 'Rocher'
  kind_p_rock_t: 'Un rocher remarquable. Dans OSM : natural=rock.'
  kind_p_stone_h: 'Bloc erratique'
  kind_p_stone_t: 'Un bloc isolé au sol. Dans OSM : natural=stone.'
  kind_q_castle_h: 'Château'
  kind_q_castle_t: 'Une tour crénelée. Dans OSM : historic=castle.'
  kind_q_fort_h: 'Fort'
  kind_q_fort_t: 'Des remparts à bastions. Dans OSM : historic=fort.'
  kind_q_ruins_h: 'Ruines'
  kind_q_ruins_t: 'Un mur en ruine. Dans OSM : historic=ruins.'
  kind_q_monument_h: 'Monument'
  kind_q_monument_t: 'Un obélisque. Dans OSM : historic=monument.'
  kind_q_memorial_h: 'Mémorial'
  kind_q_memorial_t: 'Une stèle commémorative. Dans OSM : historic=memorial.'
  kind_q_archaeological_h: 'Site archéologique'
  kind_q_archaeological_t: 'Une amphore. Dans OSM : historic=archaeological_site.'
  kind_q_manor_h: 'Manoir'
  kind_q_manor_t: 'Une grande demeure. Dans OSM : historic=manor.'
  kind_q_monastery_h: 'Monastère'
  kind_q_monastery_t: 'Un cloître et son clocher. Dans OSM : historic=monastery.'
  kind_q_museum_h: 'Musée'
  kind_q_museum_t: 'Une façade de temple. Dans OSM : tourism=museum.'
  kind_q_worship_h: 'Lieu de culte'
  kind_q_worship_t: 'Une église et sa flèche. Dans OSM : amenity=place_of_worship.'
  kind_p_nature_h: 'Élément naturel'
  kind_p_nature_t: 'Un arbre : un beau tronçon à rouler, comme une route en forêt. Chez nous seulement : aucun tag OSM ne le décrit.'
  kind_q_heritage_h: 'Site patrimonial'
  kind_q_heritage_t: 'Un écusson : un site patrimonial qui n’est aucun type OSM précis. Chez nous seulement.'
  kind_q_architecture_h: 'Architecture'
  kind_q_architecture_t: 'Une façade à fenêtres cintrées : un bâtiment qui vaut l’arrêt pour son architecture. Chez nous seulement.'
  state_h: 'Ce qui arrive à une fiche'
  state_note: 'Ces marques se posent sur n''importe quelle épingle. Elles décrivent notre traitement de la fiche, pas le lieu lui-même.'
  state_stale_h: 'Vieillit'
  state_stale_t: 'Un anneau orange remplace la bordure papier. Personne ne l''a confirmée depuis %months% mois ; la carte demande « toujours là ? »'
  state_lapsed_h: 'Non confirmé depuis longtemps'
  state_lapsed_t: 'Une bordure rouge épaisse remplace la bordure papier. Personne ne l''a confirmée depuis %months_red% mois : vérifiez avant d''y compter.'
  state_pending_h: 'En attente d''un curateur'
  state_pending_t: 'Une épingle rouge avec un sablier. Quelqu''un l''a proposée et aucun curateur n''a encore tranché. Seuls l''auteur et les curateurs la voient.'
  state_cluster_h: 'Trop pour tout dessiner'
  state_cluster_t: 'Une bulle de comptage dans la couleur de la catégorie. Zoomez et elle se sépare.'
  state_look_h: 'Regardez ici'
  state_look_t: 'Un anneau orange pulsé montre où se trouve un résultat survolé ou une ville. La même pulsation entoure une épingle révélée par la recherche quand votre mode d''affichage la cache.'
  state_camera_h: 'Caméra photo de rue'
  state_camera_t: 'Une épingle verte marque l''endroit de la photo de rue ouverte. Elle bouge quand vous parcourez les images.'
  fact_h: 'Ce qui arrive au lieu lui-même'
  fact_note: 'Un robinet cassé aujourd''hui est LE fait dont un cycliste assoiffé a besoin. Ces marques portent ce type de fait.'
  fact_broken_h: 'Hors service'
  fact_broken_t: 'Un badge rouge « ! » en haut à gauche, indépendant de la couleur et du niveau de l''épingle. Un cycliste l''a signalé hors service ou fermé.'
  fact_hours_h: 'Pas toujours accessible'
  fact_hours_t: 'Un badge horloge en haut à gauche pour les lieux pas toujours disponibles : en journée uniquement, derrière une grille, ou un point d''eau saisonnier pendant les mois où il est coupé. Un badge, pas une couleur : l''épingle garde sa catégorie.'
  cats_h: 'Les catégories'
  cats_note: 'La couleur de fond ne répond qu''à « quel type de lieu ». Un seul jeu d''icônes alimente les épingles, la liste des couches et cette page.'
  cats_practical: 'Pratique, visant la couverture complète'
  cats_voted: 'Votées sur la carte par les cyclistes'
  cats_overlays: 'Surcouches de la carte'
  overlay_surface_h: 'Revêtements'
  overlay_routes_h: 'Réseau cyclable'
  overlay_switch: 'Interrupteur de surcouche'
  overlay_note: 'Les surcouches sont des interrupteurs dans le panneau des couches, pas des couches de données : elles habillent les routes elles-mêmes. Le revêtement vit ici, et sa légende sert aussi de filtre : cochez « gravier » seul et la carte ne montre que le gravier.'
  lines_h: 'Lignes'
  lines_note: 'Tout ce que la carte dessine en trait. La petite légende sur la carte montre les parties revêtement et réseau de cette liste.'
  lines_surfaces: 'Revêtements'
  line_unverified_t: 'Tirets rouges : la route n''a pas encore d''étiquette de revêtement. Le tiret est le sens : « à étiqueter ».'
  line_ticks_h: 'Points de qualité'
  line_ticks_t: 'Petits points cousus sur la ligne, du vert (excellent) à l''ambre puis au rouge (très mauvais), visibles en zoomant.'
  lines_climbs: 'Montées'
  line_climb_up_h: 'Ligne de montée, en montant'
  line_climb_up_t: 'Bandes violettes selon la pente, identiques aux barres du profil : claires sous 5 %, les plus sombres à partir de 16 %.'
  line_climb_down_h: 'Ligne de montée, en descendant'
  line_climb_down_t: 'Les mêmes bandes en bleu pour les tronçons qui descendent.'
  line_summit_h: 'Drapeau de sommet'
  line_summit_t: 'Où la montée se termine. L''épingle est au pied.'
  line_steep_h: 'Passage le plus raide, mesuré'
  line_steep_t: 'Les 250 m soutenus les plus raides que le modèle voit.'
  line_rider_h: 'Point le plus raide, marqué par un cycliste'
  line_rider_t: 'Où le mur se trouve vraiment. Volontairement une autre couleur et une autre forme que la marque mesurée.'
  lines_routes: 'Itinéraires'
  line_route_rest_h: 'Itinéraire recommandé'
  line_route_rest_t: 'Orange pâle sur un liseré papier.'
  line_route_sel_h: 'Itinéraire recommandé, sélectionné'
  scout_h: 'Vérification d’une sortie (Scout)'
  scout_none_h: 'Non envoyé'
  scout_none_t: 'Partie de la sortie, radar allumé, sans route trouvée. Elle reste sur votre appareil.'
  scout_gps_h: 'Votre trace GPS'
  scout_gps_t: 'Là où votre appareil dit que vous êtes passé. Elle peut longer la route à côté ; elle n’est jamais envoyée.'
  scout_path_h: 'Vélos seulement'
  scout_path_t: 'Envoyé. Une piste ou rue cyclable, à l’écart des voitures.'
  scout_lane_h: 'Bande cyclable'
  scout_lane_t: 'Envoyé. Une bande peinte sur la route, à côté des voitures.'
  scout_road_h: 'Route partagée'
  scout_road_t: 'Envoyé. Vous rouliez parmi les voitures.'
  scout_car_h: 'Voiture qui dépasse, vitesse en %unit%'
  scout_car_t: 'Une voiture que votre radar a vue vous dépasser. Le nombre indique sa vitesse en %unit%.'
  scout_near_h: 'Voiture à proximité, vitesse en %unit%'
  scout_near_t: 'Une voiture sur la route à côté de votre piste cyclable. Elle ne vous a pas dépassé : du bruit, pas un danger.'
  line_route_sel_t: 'Orange plein et plus large ; les autres s''estompent tant qu''un est ouvert.'
  line_knoop_h: 'Point-nœud'
  line_knoop_t: 'Disque blanc, anneau violet et numéro, exactement comme les tuiles du réseau le dessinent.'
  back_to_map: 'Retour à la carte'
