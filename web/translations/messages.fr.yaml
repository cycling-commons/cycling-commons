about:
  kicker: 'À propos'
  title: 'La carte appartient à tous.'
  lead1: 'Chaque cycliste porte une carte privée : la fontaine qui a sauvé un juillet brûlant, la montée qui vaut l''heure de détour, la petite route qui est toujours vide. Aujourd''hui ce savoir vit dans une tête et disparaît avec elle. Cycling Commons est l''endroit où il vit à la place.'
  lead2: 'C''est une carte ouverte, construite par la communauté, des meilleurs parcours du monde — pour tous les types de cyclisme. Des données ouvertes que tout le monde peut utiliser, gouvernées par les cyclistes qui la construisent.'
  problem_kicker: 'Le problème'
  problem_title: 'Une application différente pour tout.'
  problem_lead1: 'Les cols dans une appli, les itinéraires dans une autre, les hébergements dans une troisième, l''état des routes nulle part — la plupart fermés, aucun connecté. Les cyclistes assemblent une douzaine d''outils et les données ne se rejoignent jamais. Le savoir existe ; il est simplement éparpillé et enfermé.'
  problem_lead2: 'Le Commons rassemble le savoir non personnel — la carte, jamais le cycliste — en un seul endroit ouvert. Libre à interroger, libre à exporter, libre à utiliser, par n''importe qui.'
  believe_kicker: 'Ce en quoi nous croyons'
  believe_princ1_num: 'I'
  believe_princ1_title: 'La carte, pas le cycliste.'
  believe_princ1_body: 'Des faits ouverts sur les lieux, pas les personnes — le Commons ne collecte rien sur comment, où, ni quand vous roulez.'
  believe_princ2_num: 'II'
  believe_princ2_title: 'Ouvert pour tous.'
  believe_princ2_body: 'Données ODbL, médias CC BY-SA, une API gratuite — utilisable par tous, à titre commercial ou non.'
  believe_princ3_num: 'III'
  believe_princ3_title: 'Curation, pas surcharge.'
  believe_princ3_body: 'Le meilleur d''une région, voté par les cyclistes, pas un déversement sans fin.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Gouverné, pas seulement publié.'
  believe_princ4_body: 'Fondé sur les principes d''Elinor Ostrom pour les biens communs qui ne s''effondrent pas et ne sont pas accaparés.'
  believe_ostrom: 'a remporté le prix Nobel d''économie 2009 en montrant que des communautés peuvent gérer durablement une ressource partagée — sans la privatiser et sans propriétaire central — lorsque quelques principes de conception sont en place : des frontières claires, des règles établies par les personnes concernées, une surveillance et des sanctions progressives. Cycling Commons les applique ; la'
  believe_ostrom_link: 'page Gouvernance'
  believe_ostrom_suffix: 'associe chaque principe à une partie du système.'
  partners_kicker: 'Partenaires, pas silos'
  partners_title: 'Là où de bonnes données ouvertes existent, nous les rejoignons.'
  partners_lead1_pre: 'Le Commons n''est pas là pour reconstruire ce que d''autres ont déjà ouvert. Nous nous appuyons sur'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'et y contribuons en retour. Et pour les couches que nous ne possédons pas — comme les hébergements bike-friendly — nous préférons'
  partners_lead1_partner: 'nous associer à des communautés ouvertes'
  partners_lead1_post: ', comme les réseaux d''hospitalité ouverts, plutôt que d''enfermer une copie privée de leurs données.'
  partners_lead2: 'Les données ouvertes doivent se connecter, pas se fragmenter davantage. Chaque partenariat enrichit l''atlas entier sans que personne ne le clôture.'
  steward_kicker: 'Qui le gère'
  steward_title: 'BikeCoders aujourd''hui — une fondation demain.'
  steward_lead: 'BikeCoders amorce et gère le Commons aujourd''hui. Mais l''engagement est public dès le premier jour : licence ouverte, données et comptes séparés, et une voie pour devenir une fondation indépendante une fois qu''une communauté sera là pour la gouverner. La licence ouverte et la propriété séparée rendent une clôture ultérieure difficile à faire discrètement.'
  steward_cta_map: 'Explorer la carte →'
  steward_cta_account: 'Créer un compte gratuit'
privacy:
  kicker: 'Confidentialité'
  title: 'Ce que nous collectons, et pourquoi.'
  lead: 'En langage clair. Le jeu de données Cycling Commons est non personnel — géodonnées ouvertes sur des lieux, jamais sur des personnes. Le <b>compte de plateforme</b> est une autre affaire : il contient des données personnelles (email, identifiants, journaux de session). Voici ce que nous conservons, pourquoi, et le contrôle que vous avez.'
  last_updated: 'Dernière mise à jour le 27 août 2026'
  h_responsible: 'Qui est responsable'
  responsible_p1_pre: 'Le responsable du traitement est'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', basé aux Pays-Bas, qui gère Cycling Commons aujourd''hui. Comme indiqué dans notre page de'
  responsible_p1_governance: 'gouvernance'
  responsible_p1_post: ', le Commons s''est engagé à devenir une fondation néerlandaise indépendante ; le responsable du traitement changera en conséquence, et cette page sera mise à jour.'
  responsible_p2_pre: 'Questions sur vos données :'
  responsible_p2_mid: '. Vous avez également le droit de déposer une plainte auprès de l''autorité de contrôle néerlandaise, la'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'Nous n''avons <b>pas désigné de délégué à la protection des données (DPD)</b>, et la loi ne nous y oblige pas : nous sommes une petite structure, nous ne surveillons personne à grande échelle, et les données sensibles ne font pas partie de notre activité (RGPD art. 37). Les questions et demandes relatives à la protection des données vont à la même adresse que tout le reste,'
  dpo_post: ', et une personne les lit. Si cela change un jour et que nous en désignons un, cette page le nommera.'
  h_collect: 'Ce que nous collectons'
  collect_intro: 'Nous demandons le minimum nécessaire pour gérer une carte ouverte et transparente. Nous ne vous demandons jamais votre vrai nom.'
  h3_account: 'Quand vous créez un compte'
  collect_account_email: 'Votre <b>adresse email</b> — pour vous connecter, sécuriser le compte et envoyer des messages de service essentiels.'
  collect_account_password: 'Un <b>mot de passe</b>, que nous stockons uniquement sous forme de hachage salé — nous ne voyons ni ne conservons jamais le texte en clair.'
  collect_account_displayname: 'Un <b>nom affiché</b> que vous choisissez. Ce peut être un pseudonyme, et nous ne demandons jamais votre vrai nom. Votre profil est <b>désactivé par défaut</b> : tant qu''il l''est, ce que vous contribuez ne porte aucun nom. Activez-le et votre nom affiché, votre pays, le mois de votre arrivée et le nombre de vos contributions deviennent publics.'
  collect_account_2fa: 'Si vous activez l''<b>authentification à deux facteurs (2FA)</b>, nous stockons le secret TOTP <b>chiffré au repos</b>, et vos codes de secours uniquement sous forme de hachages.'
  collect_account_base: 'Une <b>localisation de base</b> facultative — un point à l''échelle de la ville (précision ~1 km) et un rayon de pratique, si vous en définissez une. Utilisée uniquement pour cadrer votre propre vue de la carte ; jamais montrée aux autres cyclistes, et jamais incluse dans le jeu de données Commons.'
  h3_contribute: 'Quand vous contribuez'
  collect_contribute_items: '<b>Tout ce que vous écrivez dans le Commons.</b> Un lieu, une ascension, un itinéraire, une correction, un vote, une vérification sur place, une description de région, une traduction, un signalement, un message à un curateur : si vous l''avez tapé et envoyé, nous l''avons. Chacun garde la trace qu''un compte l''a créé : c''est ce qui permet à un curateur de vous répondre, et ce qui montre aux autres que la carte est tenue par des gens. Tant que votre profil est désactivé, rien de tout cela ne porte votre nom.'
  collect_contribute_media: 'Les <b>photos</b> que vous envoyez. Une photo peut contenir des données cachées (EXIF), comme le lieu de la prise de vue : nous les retirons et ré-encodons le fichier, ce que nous publions n''en porte donc rien. Nous y réinscrivons ensuite une seule chose : une mention indiquant que l''image est sous licence CC BY-SA 4.0, et un lien vers sa page ici. <b>Votre nom n''est jamais écrit dans le fichier.</b> Ce lien permet à quelqu''un qui réutilise la photo de trouver qui créditer, et cette page ne vous nomme que tant que votre profil est public.'
  collect_contribute_profile: 'Les détails optionnels de profil public que vous renseignez (bio, liens, contributions à afficher). Les profils sont'
  collect_contribute_profile_link: 'optionnels'
  collect_contribute_profile_post: ' et désactivés par défaut.'
  h3_auto: 'Automatiquement, quand vous utilisez le site'
  collect_auto_technical: '<b>Données techniques</b> — adresse IP, type de navigateur et horodatages dans nos journaux serveur, conservés pour exploiter et sécuriser le service.'
  collect_auto_ratelimit: "<b>Compteurs de limite</b> — lorsque vous utilisez un outil sans compte, comme la vérification de parcours, nous comptons vos usages sur une empreinte à sens unique et salée de votre adresse IP plutôt que sur l'adresse elle-même. Cela permet d'appliquer une limite quotidienne équitable sans conserver la liste des visiteurs. Le hachage n'est pas une anonymisation : le compteur reste une donnée personnelle et tout ce qui figure sur cette page s'y applique."
  banner_bold: 'Pas de suivi de parcours.'
  banner_body: 'Le Commons est une carte de lieux, pas de personnes. Nous ne collectons <b>pas</b> de traces GPS, vos itinéraires, votre position en direct, ni aucun relevé de vos déplacements à vélo.'
  h_why: 'Pourquoi nous l''utilisons (bases légales)'
  why_contract: '<b>Pour fournir votre compte et le service</b>: exécution d''un contrat (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">RGPD Art. 6(1)(b)</a>).'
  why_consent: '<b>Afficher votre nom.</b> Un profil public, et être crédité nommément pour ce que vous avez contribué, repose sur votre consentement (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">RGPD art. 6(1)(a)</a>). Vous pouvez le retirer à tout moment dans vos'
  why_consent_link: 'les paramètres'
  why_consent_post: ', et votre nom disparaît de ces pages. Chez nous, c''est immédiat. Un fichier de carte déjà téléchargé par le navigateur de quelqu''un peut avoir jusqu''à une heure, et une copie de page que quelqu''un a enregistrée nous échappe complètement.'
  why_licence: '<b>Publier ce que vous contribuez.</b> Une photo ou une modification que vous donnez au Commons est publiée sous la licence que vous avez acceptée en l''envoyant, ce qui relève de notre accord avec vous (art. 6(1)(b)). Cette licence est <b>irrévocable</b> selon ses propres termes : retirer votre consentement ôte votre nom de la page mais ne dépublie pas la contribution elle-même. Une exception compte : si une photo vous <b>représente</b>, ce sont vos données personnelles, et une licence de droit d''auteur ne signe pas l''abandon de vos droits en la matière. Chaque page photo porte un lien pour en demander le retrait.'
  why_updates: '<b>Vous prévenir quand une version sort.</b> Seulement si vous l''avez demandé : l''interrupteur dans vos réglages est votre consentement (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">RGPD art. 6(1)(a)</a>), et l''éteindre le retire. Chaque message porte en outre une désinscription en un clic, sans connexion. Uniquement des notes de version, jamais de publicité, et la liste n''est jamais partagée ni vendue.'
  why_legitimate: '<b>Sécurité, prévention des abus et analyses agrégées</b>: nos intérêts légitimes à maintenir le Commons fiable et fonctionnel (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">Art. 6(1)(f)</a>).'
  why_legal: '<b>Respect des obligations légales</b>: lorsque la loi l''exige (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">Art. 6(1)(c)</a>).'
  h_cookies: 'Cookies & analyses'
  cookies_body: 'Nous faisons simple. Nous déposons <b>deux cookies</b>, tous deux strictement nécessaires et tous deux listés en entier ci-dessous. Pour les statistiques d''usage, nous hébergeons nous-mêmes nos <b>analyses</b> sur notre propre serveur, à <b>analytics.bikecoders.life</b> : il reçoit l''URL de la page, le référent, la taille d''écran et le type de navigateur, et il reçoit votre <b>adresse IP</b>, qui est une donnée personnelle, mais ne la <b>conserve pas</b>. L''adresse sert uniquement à déterminer une localisation approximative (pays, région et ville) et à dériver un identifiant de session à sens unique, puis elle est supprimée. Aucun cookie de mesure n''est déposé, aucun visiteur ne reçoit d''identifiant persistant ni n''est rattaché à un compte, et il n''y a aucun suivi intersites ou multi-appareils. Les données d''analyse restent sur notre propre infrastructure et ne sont jamais partagées ni vendues à des tiers.'
  h3_cookie_table: 'Les cookies que nous déposons'
  ck_h_name: 'Nom'
  ck_h_purpose: 'À quoi il sert'
  ck_h_life: 'Combien de temps il dure'
  ck_session_purpose: 'Vous garde connecté et porte le jeton qui protège chaque formulaire du site contre la falsification de requête intersites (CSRF), une attaque où un autre site fait envoyer un formulaire ici par votre navigateur, en votre nom. Il est déposé quand vous vous connectez, et sur les rares pages portant un formulaire que nous devons retenir pour vous, comme la page de contact. Lire la carte et le reste du site ne dépose aucun cookie. Il contient un identifiant aléatoire et rien d''autre : pas de nom, pas d''adresse électronique, aucune trace de ce que vous avez consulté.'
  ck_session_life: 'Jusqu''à la fermeture de votre navigateur'
  ck_remember_purpose: 'Vous reconnecte à votre prochaine visite sans redemander votre mot de passe. Déposé <b>uniquement</b> si vous cochez <b>Se souvenir de moi</b> à la connexion, et retiré à la déconnexion.'
  ck_remember_life: '7 jours'
  cookies_none_body: 'Voilà toute la liste. Nous ne déposons <b>aucun</b> cookie publicitaire, <b>aucun</b> cookie de mesure d''audience et <b>aucun</b> cookie de suivi intersites, sur aucune page. Les deux cookies ci-dessus sont strictement nécessaires à un service que vous avez demandé, la loi n''exige donc aucun consentement, et c''est pourquoi il n''y a pas de bandeau cookies ici. Si nous ajoutions un jour quelque chose qui en réclame un, nous vous le demanderions plutôt que de le supposer.'
  cookies_local_body: 'La carte garde aussi quelques-uns de vos réglages dans le <b>stockage local</b> de votre navigateur : le thème clair ou sombre de la carte, la zone que vous avez regardée en dernier, et les filtres que vous aviez activés. Ce n''est pas un cookie, cela n''est jamais envoyé à notre serveur, et effacer les données de votre navigateur le supprime. <b>Aucun autre site ne peut le lire.</b> Un navigateur cloisonne le stockage local de chaque site, ce qui est gardé ici n''est donc lisible que par ce site.'
  h_share: 'Avec qui nous les partageons'
  share_infra: '<b>Les entreprises qui font tourner notre infrastructure.</b> Hébergement, sauvegardes, courriels de compte, et les services cartographiques que votre navigateur va chercher directement. Toutes sont nommées dans les deux tableaux ci-dessous, avec ce qu''elles font et ce qu''elles peuvent voir.'
  share_osm_pre: 'OpenStreetMap — les contributions que vous choisissez de reverser font partie de la carte ouverte sous la licence'
  share_osm_link: 'ODbL'
  share_osm_post: '. Il s''agit de données publiques et ouvertes, pas de données personnelles vous concernant.'
  share_noone: '<b>Personne d''autre.</b> Nous ne vendons pas de données personnelles et ne faisons pas de suivi publicitaire tiers.'
  share_selfhosted: 'D''abord, ce qui ne figure <b>pas</b> dans ces listes. Nous hébergeons nous-mêmes tout ce que nous pouvons : les données cartographiques, le calcul d''itinéraire, le modèle d''élévation derrière les pourcentages, le stockage des photos et jusqu''aux statistiques d''usage tournent sur nos propres machines. Deux services que nous appelions à l''extérieur, pour les itinéraires et pour l''altitude, sont rentrés chez nous en 2026 précisément pour cela. Construire ainsi prend plus de temps et coûte plus cher. C''est aussi pourquoi votre navigateur parle à cinq services extérieurs et non à vingt, et pourquoi les tableaux ci-dessous sont aussi courts : chaque nom qui s''y trouve est un service que nous ne pouvions raisonnablement pas faire tourner nous-mêmes.'
  h3_processors: 'Les entreprises qui traitent des données pour nous'
  processors_intro: 'Trois entreprises détiennent ou manipulent vos données sur nos instructions. Ce sont nos <b>sous-traitants</b> : elles ne peuvent faire que ce que nous leur demandons, dans le cadre d''un contrat écrit, et ne peuvent pas utiliser vos données pour leur propre compte.'
  pr_h_who: 'Qui'
  pr_h_where: 'Où'
  pr_h_what: 'Ce qu''elles font pour nous'
  pr_h_sees: 'Ce qu''elles peuvent voir'
  pr_hetzner_where: 'Falkenstein, Allemagne (EEE)'
  pr_hetzner_what: 'Fait tourner les machines : le site, la base de données et le stockage des photos envoyées.'
  pr_hetzner_sees: 'En principe tout ce que nous stockons, puisque cela repose sur leur matériel : votre adresse électronique, vos contributions, vos photos et les journaux serveur. Les mots de passe et les secrets à deux facteurs y restent illisibles (voir <b>Comment nous les protégeons</b>).'
  pr_scaleway_where: 'Espace économique européen'
  pr_scaleway_what: 'Achemine les courriels que le site envoie lui-même (confirmation d''adresse, réinitialisation de mot de passe, code de suppression, messages de modération) et conserve les sauvegardes nocturnes.'
  pr_scaleway_sees: 'Votre adresse électronique et le contenu des messages que le site vous envoie. Les sauvegardes sont chiffrées sur nos propres serveurs avant de partir : leur contenu est donc illisible à l''arrivée.'
  pr_proton_where: 'Suisse (couverte par une décision d''adéquation de l''UE)'
  pr_proton_what: 'Héberge la boîte aux lettres du projet, l''adresse imprimée sur cette page, et les réponses qu''une personne d''ici vous écrit.'
  pr_proton_sees: 'Votre adresse électronique et tout ce que vous avez choisi de nous écrire, tant que l''échange est conservé.'
  h3_browser_services: 'Services que votre navigateur contacte directement'
  browser_services_intro: 'La carte est assemblée dans votre navigateur, quelques morceaux viennent donc directement de ceux qui les publient plutôt que de passer par nous. Nous ne leur transmettons jamais votre compte, votre nom affiché ni votre adresse électronique. Ils voient en revanche l''adresse réseau d''où part votre requête, car toute requête sur internet en porte une. Rien dans cette liste ne se charge avant que vous n''ouvriez une page qui l''utilise.'
  bs_h_service: 'Service'
  bs_h_what: 'À quoi il sert'
  bs_h_sees: 'Ce qu''il reçoit'
  bs_sees_ip: 'Votre adresse IP, et les tuiles de carte que vous avez demandées.'
  bs_openfreemap_what: 'Le fond de carte : les routes, l''eau et les noms de lieux sous tout le reste.'
  bs_esri_what: 'La vue satellite, seulement une fois que vous y passez.'
  bs_esri_sees: 'Votre adresse IP, et les tuiles d''image que vous avez demandées. Esri est aux États-Unis.'
  bs_mapillary_what: 'Les photos au niveau de la rue, seulement une fois que vous ouvrez la vue de rue.'
  bs_mapillary_sees: 'Votre adresse IP, et les photos que vous avez ouvertes. Mapillary est exploité par Meta Platforms Ireland Limited, en Irlande, et les fichiers image eux-mêmes viennent du réseau de diffusion de Meta, qui est mondial.'
  bs_photon_what: 'La recherche de lieux, pendant que vous tapez dans le champ de recherche.'
  bs_photon_sees: 'Votre adresse IP, et les mots que vous tapez dans le champ de recherche. Photon est exploité par komoot, en Allemagne.'
  bs_wikimedia_what: 'Les photos de référence de certaines montées et de certains lieux, quand l''image vient de Wikimedia Commons.'
  bs_wikimedia_sees: 'Votre adresse IP, et la photo affichée par la page. La Wikimedia Foundation est aux États-Unis.'
  browser_services_post: 'Deux d''entre eux se trouvent hors de l''Espace économique européen (EEE) : <b>Esri</b> et la <b>Wikimedia Foundation</b>, tous deux aux États-Unis. Si vous n''ouvrez jamais la couche satellite et ne consultez jamais une page portant une photo Commons, votre navigateur ne les contacte jamais. Voir <b>Transferts internationaux</b> ci-dessous.'
  h_transfers: 'Transferts internationaux'
  transfers_body: 'Certains fournisseurs d''infrastructure peuvent traiter des données en dehors de l''Espace économique européen. Le cas échéant, nous nous appuyons sur des garanties appropriées — telles que les Clauses contractuelles types de la Commission européenne ou une décision d''adéquation.'
  h_retention: 'Combien de temps nous les conservons'
  retention_account: '<b>Données de compte.</b> Jusqu''à ce que vous supprimiez votre compte, et là elles disparaissent. La suppression est immédiate : vous la demandez, nous vous envoyons un code par courriel, vous confirmez, et à cet instant le compte quitte la base de données en service. L''adresse électronique, l''empreinte du mot de passe, le secret à deux facteurs et les codes de secours partent avec lui. Il n''y a pas de délai d''attente et rien n''est gardé au cas où vous changeriez d''avis. Deux points méritent d''être dits franchement. Nos sauvegardes nocturnes contiennent encore l''ancien enregistrement jusqu''à leur rotation, ce qui prend <b>90 jours au maximum</b> ; elles sont chiffrées et ne sont ouvertes que pour se relever d''un sinistre. Et nous ne supprimons <b>pas</b> un compte au seul motif que personne ne s''y est connecté depuis des années. Si nous nous y mettons un jour, nous vous écrirons d''abord et vous laisserons le temps de le garder.'
  retention_logs: '<b>Journaux serveur.</b> Conservés <b>30 jours</b>, puis supprimés automatiquement. Ils contiennent des adresses IP : un serveur web inscrit l''adresse du visiteur dans ses entrées d''erreur et n''offre aucun réglage pour l''en retirer ; c''est donc cette durée qui limite la conservation, et non une promesse sur le contenu.'
  retention_ratelimit: "<b>Compteurs de limite.</b> Un jour."
  retention_contributions: '<b>Contributions.</b> Les faits que vous reversez à la carte ouverte persistent dans le Commons (avec provenance), même après votre départ ; ils ne constituent pas des données personnelles vous concernant.'
  retention_consent: '<b>Consentements de licence.</b> Lorsque vous placez une photo sous licence pour le Commons, nous enregistrons votre accord, le texte exact auquel vous avez consenti et la date. Nous conservons cet enregistrement indéfiniment, et il survit à la fermeture de votre compte : c''est notre preuve que la licence a bien été accordée, dont nous pourrions avoir besoin pour constater ou défendre un droit en justice (Art. 17(3)(e)). Il ne contient qu''une référence de compte et rien d''autre à votre sujet, et une fois le compte supprimé, cette référence n''identifie plus personne ici.'
  retention_mail: '<b>Les courriels que vous nous envoyez.</b> Nous conservons un échange tant que l''affaire est ouverte, et le supprimons dans les <b>24 mois</b> qui suivent sa clôture. Cela vous couvre si vous y revenez un an plus tard, et cela nous couvre si une plainte sur notre façon de l''avoir traitée arrive tardivement. Les échanges qui relèvent d''une affaire juridique, comme une revendication de droits ou une demande de retrait, sont conservés jusqu''à la fin de cette affaire.'
  retention_updates: '<b>La liste des versions.</b> Votre adresse y reste jusqu''à ce que vous l''en retiriez, depuis vos réglages ou depuis le lien de n''importe quel message. Nous gardons la trace de votre accord, et du texte accepté, comme pour un consentement de licence photo : c''est la preuve que nous avions le droit de vous écrire.'
  h_security: 'Comment nous les protégeons'
  security_intro: 'La loi nous demande des mesures adaptées au risque (art. 32). En clair :'
  security_passwords: '<b>Votre mot de passe n''est jamais stocké.</b> Nous n''en gardons qu''une empreinte irréversible : personne ici ne peut lire votre mot de passe, et une base de données volée ne le livre pas davantage.'
  security_secrets: '<b>Les secrets à deux facteurs et les codes de secours sont chiffrés là où ils reposent</b>, la clé étant conservée hors de la base de données. Voler la seule base de données ne permet toujours pas de produire un code valable.'
  security_transport: '<b>Tout circule chiffré</b>, entre vous et nous, puis de nouveau quand une sauvegarde quitte nos serveurs. Les navigateurs reçoivent l''instruction de refuser purement et simplement une connexion non chiffrée vers nous.'
  security_access: '<b>Seules les personnes qui en ont besoin accèdent à vos données</b>, et toute modération ou administration exige une connexion à deux facteurs. Les échecs de connexion répétés sont ralentis puis bloqués.'
  security_source_pre: 'Voilà la version courte. Les mesures exactes, et le raisonnement derrière chacune, se trouvent dans notre'
  security_source_link: 'code source public'
  security_source_post: '. C''est bien pour cela que nous construisons à ciel ouvert : vous n''avez pas à croire un paragraphe de sécurité sur parole.'
  security_honest: 'Aucun système n''est parfait et nous ne prétendrons pas que le nôtre l''est. Il n''y a derrière ce paragraphe ni certification ni test d''intrusion : ce qu''il y a, c''est un petit système qui garde le moins possible, et du code que chacun peut vérifier.'
  h_breach: 'Si des données fuitent un jour'
  breach_pre: 'Si des données personnelles sont perdues, exposées, ou atteintes par quelqu''un qui ne devrait pas y accéder, et que cela risque de porter atteinte aux droits des personnes, nous le signalons à l''autorité de contrôle néerlandaise, la'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>dans les 72 heures</b> suivant le moment où nous l''apprenons (art. 33). Si le risque vous concernant est élevé, nous vous contactons aussi directement et sans délai (art. 34), en langage clair : ce qui s''est passé, lesquelles de vos données étaient concernées, ce que nous avons fait, et ce que vous devriez faire. Nous tenons un registre interne de chaque violation, y compris celles que nous ne sommes pas tenus de signaler, pour que la tendance reste visible même quand aucun cas pris isolément n''est à notifier.'
  h_rights: 'Vos droits'
  rights_intro: 'En vertu du <a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">RGPD</a>, vous disposez des droits suivants :'
  rights_access: '<b>Accès (Art. 15)</b> — demander une copie des données personnelles que nous détenons sur vous.'
  rights_correct: '<b>Rectification (Art. 16)</b> — corriger toute inexactitude ou compléter ce qui manque.'
  rights_erase: '<b>Effacement (Art. 17)</b> — supprimez votre compte à tout moment depuis les paramètres de votre compte. Vos données personnelles partent avec lui et ne reviennent pas. Deux choses subsistent délibérément, et aucune ne vous identifie ensuite : les contributions que vous avez données à la carte ouverte, et l''enregistrement de l''octroi d''une licence photo. Les deux sont décrits sous <b>Combien de temps nous les conservons</b> ci-dessus.'
  rights_portability: '<b>Portabilité des données (Art. 20)</b> — téléchargez tout ce que nous détenons à votre sujet dans un seul fichier ZIP, à tout moment, depuis les paramètres de votre compte. Il contient les détails de votre compte, vos contributions, vos messages, vos consentements de licence et vos photos sous forme de fichiers.'
  rights_restrict: '<b>Limitation et opposition (Arts. 18–21)</b> — limiter ou s''opposer à certains traitements.'
  rights_withdraw: '<b>Retirer votre consentement</b> à tout moment (par exemple en désactivant votre profil public) — cela n''affecte pas les traitements déjà effectués.'
  rights_third_party_photo: '<b>Pas d''utilisateur ?</b> Ces droits ne dépendent pas d''un compte. Si vous êtes reconnaissable sur une photo de notre carte, chaque page photo porte un lien <b>"cette photo me montre"</b>. Signalez-le là, sans compte ni pièce d''identité, et un curateur répond dans un délai d''un mois au plus tard.'
  rights_contact_pre: 'Pour exercer l''un de ces droits, écrivez à'
  rights_contact_mid: '. Nous répondons <b>dans un délai d''un mois au plus tard</b>, et le plus souvent bien avant. La loi autorise jusqu''à trois mois pour une demande vraiment complexe, mais seulement si nous vous prévenons dans le premier mois que ce sera plus long, et pourquoi. Si notre réponse ne vous satisfait pas, vous pouvez porter plainte auprès de la'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Enfants'
  children_body: 'Le Commons n''est pas destiné aux enfants de moins de <b>16</b> ans. Nous ne collectons pas sciemment de données personnelles de personnes de moins de cet âge ; si vous pensez qu''un enfant nous a fourni des données, contactez-nous et nous les supprimerons.'
  h_automated: 'Décisions automatisées'
  automated_body: 'Nous ne prenons pas de décisions vous concernant par des moyens exclusivement automatisés, et nous ne vous profilons pas à des fins publicitaires.'
  h_changes: 'Modifications de cette politique'
  changes_body: 'Si nous modifions la façon dont nous traitons les données, nous mettrons à jour cette page et sa date, et — pour les changements importants — nous en informerons les contributeurs connectés.'
  changes_versions_pre: 'Vous pouvez aussi le vérifier vous-même plutôt que nous croire sur parole. La plateforme est à source ouverte consultable : cette page et son texte vivent dans un dépôt public, et chaque modification y est consignée avec sa date et sa raison, dans'
  changes_versions_link: 'l''historique de la page'
  changes_versions_post: '.'
  footer_disc_pre: 'Voir aussi nos'
  footer_disc_terms: 'Conditions d''utilisation'
  footer_disc_mid: 'et les licences des données, médias et code'
  footer_disc_licences: 'licences'
  footer_disc_post: '.'
terms:
  kicker: 'Conditions d''utilisation'
  title: 'L''accord, en langage clair.'
  lead: 'Ces conditions régissent l''utilisation du site web et du compte Cycling Commons, en langage clair.'
  last_updated: 'Dernière mise à jour le 1er août 2026'
  h1_accepting: 'Acceptation de ces conditions'
  accepting_p1_pre: 'En utilisant le site web Cycling Commons ou en créant un compte, vous acceptez ces conditions et notre'
  accepting_p1_privacy: 'Politique de confidentialité'
  accepting_p1_mid: '. Si vous n''acceptez pas, veuillez ne pas utiliser le service. Le Commons est exploité par'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' aux Pays-Bas, en route vers une fondation indépendante comme décrit dans notre page de'
  accepting_p1_governance: 'gouvernance'
  accepting_p1_post: '.'
  h2_who: 'Qui peut l''utiliser'
  who_body: 'Vous devez avoir au moins <b>16</b> ans pour créer un compte. Les informations que vous nous fournissez (comme votre email) doivent être exactes et vous appartenir.'
  h3_account: 'Votre compte'
  account_password: 'Gardez votre mot de passe en sécurité ; vous êtes responsable de l''activité sous votre compte.'
  account_unauthorised: 'Signalez-nous rapidement tout accès non autorisé suspecté.'
  account_suspend: 'Nous pouvons suspendre ou fermer des comptes utilisés de manière abusive ou pour enfreindre ces conditions.'
  h4_using: 'Une utilisation responsable'
  using_intro: 'Le Commons fonctionne parce que les gens l''utilisent de bonne foi.'
  using_no_illegal: 'N''enfreignez pas la loi, ne harcelez personne et ne publiez pas de contenu illicite, trompeur ou nuisible.'
  using_no_personal: 'Ne téléversez pas de <b>données personnelles sur d''autres personnes</b> (par exemple, des personnes identifiables sur des photos) sans base légale appropriée — le Commons cartographie les lieux, pas les personnes.'
  using_no_reidentify_pre: 'N''essayez pas de ré-identifier des contributeurs ni de compromettre la'
  using_no_reidentify_link: 'frontière de collecte'
  using_no_reidentify_post: ' du projet qui maintient les données personnelles à l''écart.'
  using_no_scrape_pre: 'Ne récupérez pas le service par scraping. Point — l'''
  using_no_scrape_link: 'API et l''export groupé'
  using_no_scrape_post: ' sont la façon d''obtenir les données. Ni l''un ni l''autre n''est encore en service : en attendant, écrivez à info@cyclingcommons.org et nous vous fournirons ce qu''il vous faut.'
  using_no_disrupt: 'Ne perturbez pas le service et ne contournez pas ses limites.'
  h5_contributions: 'Vos contributions'
  contributions_p1_pre: 'Vous conservez la paternité de ce que vous contribuez. Pour que le Commons reste ouvert, vous accordez les licences de nos'
  contributions_p1_link: 'conditions de contribution'
  contributions_p1_mid: ': les <b>données</b> rejoignent le Commons sous la licence'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', et les <b>médias</b> (photos, vidéos) et '
  contributions_p1_mid3: 'les <b>traductions d''interface</b> sous'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Vous confirmez avoir le droit de contribuer ce que vous soumettez, que cela ne viole pas les droits de tiers, et qu''il ne s''agit pas de données personnelles sur d''autres personnes.'
  h6_opendata: 'Données ouvertes & API'
  opendata_pre: 'Les données, médias et traductions d''interface du Commons sont librement utilisables par tous — y compris commercialement — sous leurs'
  opendata_link: 'licences'
  opendata_mid: ', avec attribution. Consultez la'
  opendata_dev_link: 'documentation développeur'
  opendata_post: ' pour la ligne d''attribution, et pour l''API et l''export groupé tels qu''ils sont conçus — ni l''un ni l''autre n''est encore en service.'
  h7_code: 'Notre code & notre marque'
  code_pre: 'Le code source de la plateforme est <b>disponible en source</b> sous la licence'
  code_link: 'PolyForm Shield License 1.0.0'
  code_post: ' — utilisez-le à toutes fins sauf pour exploiter un produit concurrent de Cycling Commons. Le nom "Cycling Commons" et le logo ne sont pas licenciés pour des usages impliquant une approbation ou une affiliation.'
  h8_preview: 'Une intention, pas une garantie'
  preview_body: 'Le Cycling Commons est une intention, <b>pas</b> une garantie. Ne vous y fiez pas pour l''itinéraire, l''état des routes ou votre sécurité sur la route — utilisez toujours votre propre jugement à vélo.'
  h9_warranty: 'Absence de garantie'
  warranty_body: 'Le service est fourni <b>"tel quel"</b> et "tel que disponible", sans garantie d''aucune sorte, dans toute la mesure permise par la loi. Nous ne garantissons pas qu''il sera exact, ininterrompu ou exempt d''erreurs.'
  h10_liability: 'Responsabilité'
  liability_body: 'Dans toute la mesure permise par le droit néerlandais, BikeCoders n''est pas responsable des pertes indirectes ou consécutives découlant de votre utilisation du Commons. Rien dans ces conditions ne limite une responsabilité qui ne peut être limitée par la loi.'
  h11_suspension: 'Suspension & résiliation'
  suspension_pre: 'Vous pouvez fermer votre compte à tout moment dans'
  suspension_link: 'les paramètres'
  suspension_post: '. Nous pouvons suspendre ou mettre fin à l''accès si ces conditions sont enfreintes ou pour protéger le Commons ou ses utilisateurs.'
  suspension_p2: 'Avant de partir, vous pouvez <b>télécharger tout ce que nous détenons à votre sujet</b> dans un seul fichier ZIP depuis la même page. La fermeture de votre compte supprime vos données personnelles. Deux choses restent, et aucune ne vous nomme ensuite : les contributions que vous avez données à la carte ouverte, et l''enregistrement de l''octroi d''une licence photo, que nous conservons comme preuve de l''existence de la licence. Les photos que vous aviez fait approuver restent dans le Commons sous CC BY-SA 4.0, et vous choisissez au moment de partir si elles conservent votre nom ou deviennent anonymes.'
  h12_moderation: 'Comment fonctionne la modération'
  mod_intro: 'Le Commons est fait de ce que les cyclistes ajoutent, donc une partie doit être vérifiée. Cette section dit ce que nous retirons, qui décide, ce qui vous est dit et ce que vous pouvez y faire.'
  mod_standard_h: 'Ce qui est retiré'
  mod_std1: '<b>Tout ce qui est illicite.</b> Y compris ce qui porte atteinte aux droits d''autrui.'
  mod_std2: '<b>Des données personnelles sur autrui.</b> Le Commons cartographie des lieux, pas des personnes. Une personne reconnaissable sur une photo, un nom, une plaque, une maison désignée comme le domicile de quelqu''un.'
  mod_std3: '<b>Des choses simplement fausses.</b> Un point d''eau qui n''a jamais existé, un revêtement qui ne correspond pas au terrain, un col inventé pour truquer un classement.'
  mod_std4: '<b>Les abus.</b> Harcèlement, menaces, ou contenu visant une personne plutôt qu''un lieu.'
  mod_std5: '<b>La publicité.</b> Le Commons n''est pas un annuaire, et un lieu n''y figure pas parce que quelqu''un a payé ou demandé.'
  mod_std6: '<b>Des photographies qui n''en sont pas.</b> Une image produite ou substantiellement modifiée par une IA, si réussie soit-elle. Le Commons est une carte du monde réel, et l''image d''un lieu qui n''a jamais ressemblé à cela vaut moins que pas d''image du tout.'
  h13_ai: 'Là où des machines interviennent'
  ai_intro: 'Liste courte, et nous préférons vous la donner plutôt que vous laisser deviner :'
  ai_translation: '<b>Traduction automatique.</b> Certaines descriptions de lieux viennent de Wikipédia dans la langue locale et sont traduites automatiquement en anglais. Chacune porte la mention <b>auto-translated</b> là où elle s''affiche, car une traduction automatique de col peut être fausse d''une manière qui se lit parfaitement.'
  ai_checks: '<b>Vérifications automatiques.</b> Un logiciel parcourt le catalogue à la recherche de ce qui semble faux, deux fontaines à un mètre l''une de l''autre, un lien qui ne répond plus, et le soumet à un curateur. Il signale ; il ne décide jamais.'
  ai_none: '<b>Rien d''autre.</b> Pas de robot conversationnel, pas de texte généré présenté comme le nôtre, aucune décision automatisée à votre sujet ou sur votre compte, et aucun profilage. Si cela change un jour, cette section changera la première.'
  ai_uploads: '<b>Ce que vous ne pouvez pas envoyer.</b> Aucune image produite ou retouchée par une IA. Les retouches ordinaires vont très bien : recadrer, redresser, déboucher les ombres. Inventer ou faire disparaître ce qui était là, non, et une image fabriquée par un modèle non plus. Le consentement que vous cochez avant l''envoi le dit, et c''est un motif de retrait.'
  ai_stance: 'Nous ne revendiquons par là aucune conformité. Les règles de transparence du règlement européen sur l''IA s''appliquent à partir du <b>2 août 2026</b>, et leur portée sur la description d''une fontaine est discutable. Nous vous le dirions de toute façon, car une carte ne vaut que si vous pouvez distinguer ce qu''une personne y a mis.'
  mod_who_h: 'Qui décide'
  mod_who: 'Un <b>curateur</b> décide, et un curateur est une personne. Les curateurs sont des cyclistes qui ont postulé et été acceptés, ils travaillent selon un règlement écrit, et chaque décision est enregistrée à leur nom.'
  mod_automated: '<b>Rien n''est retiré par un logiciel seul.</b> Des contrôles automatiques existent et signalent des éléments à un curateur, mais ils ne décident jamais. La seule exception fonctionne à l''inverse et protège les personnes au lieu de les juger : un signalement d''image intime ou concernant un enfant masque la photo immédiatement, avant qu''une personne ait vu le signalement, et un curateur l''examine ensuite.'
  mod_told_h: 'Ce qui vous est dit'
  mod_told_pre: 'Si quelque chose que vous avez ajouté est retiré ou modifié, nous vous le disons, avec le motif. Le message indique ce dont il s''agissait et sur quelle base la décision a été prise. Vous le trouverez dans vos'
  mod_told_link: 'messages'
  mod_told_post: '.'
  mod_appeal_h: 'Si vous n''êtes pas d''accord'
  mod_appeal_pre: 'Répondez à ce message et un curateur le lit. Si vous préférez sortir du compte, ou si vous n''en avez plus, écrivez-nous via la'
  mod_appeal_link: 'page de contact'
  mod_appeal_post: '. Une décision n''est pas définitive parce qu''elle a été prise une fois ; un curateur qui s''est trompé peut la rétablir.'
  mod_report_h: 'Signaler quelque chose'
  mod_report_pre: 'N''importe qui peut signaler un contenu, avec ou sans compte. Utilisez la'
  mod_report_link: 'page de contact'
  mod_report_post: ', ou le lien de signalement sur la photo elle-même. Nous accusons réception de chaque signalement et nous vous disons ce que nous avons décidé. Les photos ont leur propre lien de signalement sur chaque page de photo.'
  h12_governing: 'Droit applicable'
  governing_body: 'Ces conditions sont régies par le droit des <b>Pays-Bas</b>. Les litiges seront soumis aux tribunaux néerlandais compétents, sauf si le droit de la consommation obligatoire vous confère d''autres droits.'
  h13_changes: 'Modifications'
  changes_body: 'Nous pouvons mettre à jour ces conditions ; nous publierons les modifications ici avec une nouvelle date. Continuer à utiliser le Commons après une modification signifie que vous acceptez les conditions mises à jour.'
  h14_contact: 'Contact'
  contact_pre: 'Questions sur ces conditions :'
  contact_post: '.'
  footer_disc_pre: 'Voir aussi notre'
  footer_disc_privacy: 'Politique de confidentialité'
  footer_disc_mid: 'et les licences des données, médias, traductions d''interface et code'
  footer_disc_licences: 'licences'
  footer_disc_post: '.'
licenses:
  kicker: 'Licences'
  title: 'La version courte.'
  lead: 'En langage clair, pour savoir ce que vous pouvez faire. Quatre licences — une pour les <b>données</b>, une pour les <b>médias</b>, une pour les <b>traductions d''interface</b> et une pour le <b>code</b> : les données, les médias et les traductions d''interface sont ouverts, le code est en source disponible.'
  can_h: 'Vous pouvez'
  must_h: 'Vous devez'
  data_h: 'Les données'
  data_sub: 'Open Database License 1.0 (ODbL) · contenus DbCL 1.0'
  data_tldr: 'Utilisez les données à n''importe quelle fin — y compris des produits commerciaux — à condition de les créditer, de reverser toute base de données améliorée sous la même licence et de la maintenir ouverte. Le même accord qu''OpenStreetMap.'
  data_can1: 'Les utiliser, les copier et les partager — gratuitement'
  data_can2: 'Les adapter et créer des produits sur leur base'
  data_can3: 'Les utiliser commercialement'
  data_must1_b: 'Attribution'
  data_must1_body: '— créditer Cycling Commons et la source dont proviennent les données : OpenStreetMap, et les autres jeux de données ouverts que nous importons, chacun <a href="%url%">indiqué avec sa licence</a>.'
  data_must2_b: 'Partage à l''identique'
  data_must2_body: '— publier une base de données adaptée sous ODbL'
  data_must3_b: 'Maintenir l''ouverture'
  data_must3_body: '— pas de DRM ni de verrouillage des données'
  media_h: 'Les médias'
  media_sub: 'Creative Commons Attribution-ShareAlike 4.0 (CC BY-SA 4.0)'
  media_tldr: 'Utilisez les photos et vidéos à toutes fins — y compris commercialement — si vous créditez le créateur et le Commons, et publiez toute adaptation sous la même licence.'
  media_can1: 'Les utiliser, les copier et les partager — gratuitement'
  media_can2: 'Les adapter, recadrer et remixer'
  media_can3: 'Les utiliser commercialement'
  media_must1_b: 'Attribution'
  media_must1_body: '— créditer le créateur et Cycling Commons'
  media_must2_b: 'Partage à l''identique'
  media_must2_body: '— publier les adaptations sous CC BY-SA 4.0'
  ui_h: 'Les traductions d''interface'
  ui_sub: 'Creative Commons Attribution-ShareAlike 4.0 (CC BY-SA 4.0)'
  ui_tldr: 'Utilisez les traductions d''interface soumises sur le site à toutes fins — y compris commercialement — si vous créditez le Commons (et le traducteur lorsqu''il est crédité), et publiez toute adaptation sous la même licence. Ce ne sont pas les fichiers de locale livrés par les développeurs dans git.'
  ui_can1: 'Les utiliser, les copier et les partager — gratuitement'
  ui_can2: 'Les adapter et les remixer'
  ui_can3: 'Les utiliser commercialement'
  ui_must1_b: 'Attribution'
  ui_must1_body: '— créditer Cycling Commons, et le traducteur s''il est crédité'
  ui_must2_b: 'Partage à l''identique'
  ui_must2_body: '— publier les adaptations sous CC BY-SA 4.0'
  code_h: 'Le code'
  code_sub: 'PolyForm Shield License 1.0.0 · source disponible'
  code_tldr: 'Lisez, exécutez, modifiez et construisez sur le code source de Cycling Commons à toutes fins — sauf pour exploiter un produit concurrent de Cycling Commons. Un atlas pour randonneurs, coureurs ou kayakistes, c''est exactement ce à quoi ce code sert. Vous créez pour les cyclistes ? Construisez plutôt sur les données ouvertes et l''API — libres à tout usage, y compris commercial.'
