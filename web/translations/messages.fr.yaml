developers:
  kicker: 'Construisez sur le Commons'
  title: 'Données ouvertes. Une API ouverte.<br>Pour qui veut construire.'
  lead: 'Interrogez le Commons par zone et par type, ou hébergez-le vous-même depuis l''export périodique. Les données sont ouvertes (ODbL), c''est ce qui en fait un commun. Pas de clé, pas de compte, pas de frais: une limite de débit et un usage raisonnable, c''est tout.'
  status: 'En conception — ces points de terminaison sont le contrat que nous construisons. Parcourez la <a href="/developers/api">référence interactive de l''API</a> (en anglais) ou la <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">spécification sur GitHub</a>.'
  ep_kicker: 'Points de terminaison'
  ep1_path: '/v1/search'
  ep1_desc: 'trouver la couverture par <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'un élément, avec notre enrichissement et sa provenance <b>(prévu)</b>'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'polygone de région et statistiques de couverture <b>(prévu)</b>'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'le best-of d''une région <b>(prévu)</b>'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'détail d''itinéraire et téléchargement GPX <b>(prévu)</b>'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'tuiles vectorielles et TileJSON, à intégrer dans votre style MapLibre <b>(prévu)</b>'
  ep7_path: '/v1/contributions'
  ep7_desc: 'contribuer <b>(prévu)</b>, passe par la même file de relecture que les contributions dans l''application'
  ex_kicker: 'Exemple de requête'
  resp_kicker: 'Réponse'
  ex_hydrate: 'Les réponses sont par défaut en référence seule : nos champs ajoutés plus l''<code>osm_ref</code> à hydrater auprès d''OSM. <code>?hydrate=osm</code> y fusionne notre sous-ensemble OSM en cache.'
  attr_kicker: 'Attribution obligatoire'
  rules_kicker: 'Les règles'
  rules_body: '<b>Usage raisonnable.</b> Les lectures sont ouvertes à tous, sans clé ni compte, à <b>120 requêtes par minute</b> par adresse. C''est une fenêtre glissante: une rafale emprunte à la minute suivante plutôt que de vous bloquer. Pour un usage massif ou hors ligne, prenez l''<b>export périodique</b> et hébergez-le, plutôt que de marteler l''API en direct; le scraping du service n''est pas autorisé. Licences: données <b>ODbL 1.0</b>, médias <b>CC BY-SA 4.0</b>. Créditez, partagez à l''identique, gardez ouvert. L''usage commercial est permis. Voir le résumé en langage clair:'
