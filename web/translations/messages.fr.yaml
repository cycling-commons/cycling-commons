developers:
  kicker: 'Construisez sur le Commons'
  title: 'Des données ouvertes. Une API ouverte. Pour que tous construisent dessus.'
  lead: 'Interrogez le Commons par zone et par type, intégrez nos tuiles vectorielles dans votre propre style de carte, ou auto-hébergez l''export périodique gratuit. Les données sont ouvertes (ODbL) — c''est ce qui en fait un bien commun. L''accès est en libre-service : une clé gratuite, un palier gratuit, et des quotas payants uniquement pour un usage intensif toujours à jour.'
  status: 'En conception — ces points de terminaison sont le contrat que nous construisons. Parcourez la <a href="/developers/api">référence interactive de l''API</a> (en anglais) ou la <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">spécification sur GitHub</a>.'
  ep_kicker: 'Points de terminaison'
  ep1_path: '/v1/search'
  ep1_desc: 'chercher la couverture par <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'un élément — notre enrichissement, provenance, vérification (<code>?hydrate=osm</code>)'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'polygone de la région + statistiques de couverture'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'le meilleur curé d''une région'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'détail de l''itinéraire + téléchargement GPX'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'tuiles vectorielles à clé + TileJSON — à intégrer dans votre propre style MapLibre'
  ep7_path: '/v1/contributions'
  ep7_desc: 'contribuer — prévu (phase 2), passe par la file de révision'
  ex_kicker: 'Exemple de requête'
  resp_kicker: 'Réponse'
  ex_hydrate: 'Les réponses sont par défaut en référence seule : nos champs ajoutés plus l''<code>osm_ref</code> à hydrater auprès d''OSM. <code>?hydrate=osm</code> y fusionne notre sous-ensemble OSM en cache.'
  attr_kicker: 'Attribution obligatoire'
  rules_kicker: 'Les règles'
  rules_body: '<b>Libre-service &amp; usage équitable.</b> Les lectures utilisent une clé gratuite en libre-service avec un quota mensuel gratuit ; les paliers payants ajoutent du débit et des données toujours à jour pour un usage intensif. Pour un usage en masse ou hors ligne, prenez l''<b>export périodique gratuit</b> et hébergez-le vous-même plutôt que de solliciter l''API en direct — le scraping du service est interdit. <b>Les écritures sont prévues (phase 2)</b> et passeront par la même révision que les contributions dans l''appli. Licences : données <b>ODbL 1.0</b>, médias <b>CC BY-SA 4.0</b> — attribuez, partagez à l''identique, maintenez ouvert ; l''usage commercial est autorisé. Voir le résumé en langage clair :'
