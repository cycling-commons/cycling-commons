  improve_title: 'Cycling Commons — Améliorer / ajouter un lieu'
  improve_description: 'Améliorez un lieu dans le Commons — corrigez les détails, signalez les conditions et gardez l''atlas cycliste ouvert exact pour chaque cycliste.'
  propose_route_title: 'Cycling Commons — Proposer un itinéraire'
  propose_route_description: 'Partagez une sortie recommandée : téléversez votre GPX, un curateur l''examine, la communauté vérifie et vote.'
  contact_title: 'Cycling Commons — Contact'
  contact_description: 'Écrivez au Cycling Commons sans logiciel de messagerie et sans compte. Un formulaire, une adresse publiée, et qui gère légalement le site.'
  bug_report_title: 'Cycling Commons — Signaler un bogue'
  report_guide_title: 'Cycling Commons — Signaler une page ou une photo'
  report_guide_description: 'Où se trouve le lien Signaler pour un lieu, un itinéraire, une région, un cycliste, un message ou une photo, et une case qui ouvre le bon formulaire depuis un lien.'
  bug_report_description: 'Quelque chose ne marche pas sur le Cycling Commons ? Dites-le-nous, avec ou sans compte.'
  known_issues_title: 'Cycling Commons — Problèmes connus'
  known_issues_description: 'Ce que nous savons déjà cassé sur le Cycling Commons, confirmé par un curateur, pour que vous n''ayez pas à le signaler deux fois.'
  accessibility_title: 'Cycling Commons — Accessibilité'
  accessibility_description: 'L''utilisabilité du Cycling Commons, y compris ce qui n''est pas encore assez bon, et comment signaler un obstacle.'
  map_key_title: 'Cycling Commons — Légende de la carte'
  map_key_description: 'Chaque marque sur la carte du Cycling Commons et sa signification : épingles, disques, bordures, badges, lignes et grappes.'
legend:
  kicker: 'Légende de la carte'
  title: 'Chaque marque sur la carte'
  lead: 'Une épingle empile quelques signaux indépendants sur une même forme : d''où vient la fiche, quel type de lieu c''est, et ce qui lui arrive. Cette page est la légende complète.'
  axis_shape_h: 'Forme'
  axis_shape_t: 'Le magasin où vit la fiche. Un petit disque ou une goutte : des données de base importées ; une épingle en goutte : une fiche que cette communauté tient.'
  axis_fill_h: 'Couleur de fond'
  axis_fill_t: 'La catégorie. Eau, toilettes, montées, services. Le fond ne dit jamais rien d''autre ; ce qu''un lieu est au sein de sa catégorie se lit dans le pictogramme.'
  axis_border_h: 'Bordure'
  axis_border_t: 'Qui a apporté la fiche et son état chez nous : pointillés noir et blanc = ajoutée par un cycliste, bordure rouge épaisse = en attente d''un modérateur, anneau orange = en train de vieillir.'
  axis_badge_h: 'Badge'
  axis_badge_t: 'Un fait qui doit survivre au daltonisme. En haut à droite : un « ? » signifie qu''aucun cycliste ne l''a encore confirmé, un petit point papier que quelqu''un était sur place et l''a vérifié. En haut à gauche : un « ! » rouge signifie inutilisable pour l''instant, une horloge présent, mais pas toujours.'
  tag_live: 'Sur la carte'
  tag_plan: 'Prévu'
  plan_note: 'Les marques « Prévu » sont conçues mais pas encore sur la carte. Elles figurent ici pour montrer où va la légende ; la carte les dessinera dès que les données derrière elles arriveront.'
  tiers_h: 'D''où vient une fiche'
  tiers_note: 'Le niveau que vous lisez, que vous le sachiez ou non. Quand deux fiches décrivent un même lieu, la carte garde celle la plus proche du bas de cette liste.'
  tier_osm_h: 'Base importée'
  tier_osm_t: 'Petit disque, couleur de la catégorie, fin anneau sombre. La majorité de la carte. OpenStreetMap aujourd''hui, rejoint par des registres publics au fil des imports. Le panneau de la fiche nomme toujours la vraie source.'
  tier_provider_h: 'Registre officiel, non confirmé'
  tier_provider_t: 'Un organisme de référence pour ce type de lieu s''en porte garant, et aucun cycliste ici ne l''a encore confirmé. L''éditeur est nommé dans le panneau du lieu. Pleine couleur, le badge « ? », et la bordure en tirets de l''épingle cycliste inversée : tirets blancs sur noir.'
  tier_community_h: 'Non confirmé'
  tier_community_t: 'Bordure en pointillés noir et blanc et badge « ? ». Un cycliste ou un registre public l''a placée et personne ne l''a encore confirmée. Si vous passez par là, vérifiez-la.'
  tier_ours_h: 'Notre catalogue'
  tier_ours_t: 'Goutte en pleine couleur avec bordure papier. Une fiche que cette communauté tient : sélectionnée, modifiée ou confirmée par un cycliste.'
  tier_verified_h: 'Vérifiée'
  tier_verified_t: 'La même épingle avec un petit point papier. Quelqu''un était sur place et a dit que c''est réel.'
  kinds_h: 'Ce qu''est un lieu, au sein de sa catégorie'
  kinds_note: 'Le pictogramme distingue les types à l''intérieur d''une catégorie, et les types ne se comparent jamais d''une catégorie à l''autre : un robinet dont on ne peut pas boire est un autre type de lieu, pas un lieu cassé. Seules les catégories à plusieurs types sont listées.'
  kind_b_tap_h: 'Robinet d''eau potable'
  kind_b_tap_t: 'Une goutte bleue. OSM la cartographie comme eau potable et rien n''indique le contraire. À confirmer sur place.'
  kind_b_no_h: 'Non potable'
  kind_b_no_t: 'Une goutte barrée. Étiquetée non potable, ou un cycliste l''a dit.'
  kind_b_unk_h: 'Robinet, rien d''indiqué'
  kind_b_unk_t: 'Une goutte vide. Un point d''eau dont personne n''a rien dit ; à considérer comme inconnu.'
  kind_b_food_h: 'Halte ravitaillement'
  kind_b_food_t: 'Fourchette et couteau sur le disque de la catégorie. Une boulangerie, un magasin, un café.'
  kind_b_food_water_h: 'Ravitaillement avec eau'
  kind_b_food_water_t: 'La même, avec une petite goutte bleue : le lieu donne aussi de l''eau potable.'
  kind_d_shop_h: 'Magasin de vélos'
  kind_d_shop_t: 'Un engrenage.'
  kind_d_station_h: 'Station de réparation'
  kind_d_station_t: 'Marteau et pic : une borne en libre-service avec outils.'
  kind_d_pump_h: 'Pompe'
  kind_d_pump_t: 'Un plus cerclé : air comprimé ou pompe publique.'
  state_h: 'Ce qui arrive à une fiche'
  state_note: 'Ces marques se posent sur n''importe quelle épingle. Elles décrivent notre traitement de la fiche, pas le lieu lui-même.'
  state_stale_h: 'Vieillit'
  state_stale_t: 'Un anneau orange remplace la bordure papier. Personne ne l''a confirmée depuis longtemps ; la carte demande « toujours là ? »'
  state_pending_h: 'En attente d''un modérateur'
  state_pending_t: 'Une bordure rouge épaisse. Quelqu''un l''a proposée et aucun curateur n''a encore tranché. Visible pour l''auteur et les curateurs.'
  state_cluster_h: 'Trop pour tout dessiner'
  state_cluster_t: 'Une bulle de comptage dans la couleur de la catégorie. Zoomez et elle se sépare.'
  state_look_h: 'Regardez ici'
  state_look_t: 'Un anneau orange pulsé montre où se trouve un résultat survolé ou une ville. La même pulsation entoure une épingle révélée par la recherche quand votre mode d''affichage la cache.'
  state_camera_h: 'Caméra photo de rue'
  state_camera_t: 'Une épingle verte marque l''endroit de la photo de rue ouverte. Elle bouge quand vous parcourez les images.'
  fact_h: 'Ce qui arrive au lieu lui-même'
  fact_note: 'Un robinet cassé aujourd''hui est LE fait dont un cycliste assoiffé a besoin. Ces marques portent ce type de fait.'
  fact_broken_h: 'Hors service'
  fact_broken_t: 'Un badge rouge « ! » en haut à gauche, indépendant de la couleur et du niveau de l''épingle. Un cycliste l''a signalé hors service ou fermé.'
  fact_hours_h: 'Pas toujours accessible'
  fact_hours_t: 'Un badge horloge en haut à gauche pour les lieux pas toujours disponibles : en journée uniquement, derrière une grille, ou un point d''eau saisonnier pendant les mois où il est coupé. Un badge, pas une couleur : l''épingle garde sa catégorie.'
  cats_h: 'Les catégories'
  cats_note: 'La couleur de fond ne répond qu''à « quel type de lieu ». Un seul jeu d''icônes alimente les épingles, la liste des couches et cette page.'
  cats_practical: 'Pratique, visant la couverture complète'
  cats_voted: 'Votées sur la carte par les cyclistes'
  cats_overlays: 'Surcouches de la carte'
  overlay_surface_h: 'Revêtements'
  overlay_routes_h: 'Réseau cyclable'
  overlay_switch: 'Interrupteur de surcouche'
  overlay_note: 'Les surcouches sont des interrupteurs dans le panneau des couches, pas des couches de données : elles habillent les routes elles-mêmes. Le revêtement vit ici, et sa légende sert aussi de filtre : cochez « gravier » seul et la carte ne montre que le gravier.'
  lines_h: 'Lignes'
  lines_note: 'Tout ce que la carte dessine en trait. La petite légende sur la carte montre les parties revêtement et réseau de cette liste.'
  lines_surfaces: 'Revêtements'
  line_unverified_t: 'Tirets rouges : la route n''a pas encore d''étiquette de revêtement. Le tiret est le sens : « à étiqueter ».'
  line_ticks_h: 'Points de qualité'
  line_ticks_t: 'Petits points cousus sur la ligne, du vert (excellent) à l''ambre puis au rouge (très mauvais), visibles en zoomant.'
  lines_climbs: 'Montées'
  line_climb_up_h: 'Ligne de montée, en montant'
  line_climb_up_t: 'Bandes violettes selon la pente, identiques aux barres du profil : claires sous 5 %, les plus sombres à partir de 16 %.'
  line_climb_down_h: 'Ligne de montée, en descendant'
  line_climb_down_t: 'Les mêmes bandes en bleu pour les tronçons qui descendent.'
  line_summit_h: 'Drapeau de sommet'
  line_summit_t: 'Où la montée se termine. L''épingle est au pied.'
  line_steep_h: 'Passage le plus raide, mesuré'
  line_steep_t: 'Les 100 m soutenus les plus raides que le modèle voit.'
  line_rider_h: 'Point le plus raide, marqué par un cycliste'
  line_rider_t: 'Où le mur se trouve vraiment. Volontairement une autre couleur et une autre forme que la marque mesurée.'
  lines_routes: 'Itinéraires'
  line_route_rest_h: 'Itinéraire recommandé'
  line_route_rest_t: 'Orange pâle sur un liseré papier.'
  line_route_sel_h: 'Itinéraire recommandé, sélectionné'
  line_route_sel_t: 'Orange plein et plus large ; les autres s''estompent tant qu''un est ouvert.'
  line_knoop_h: 'Point-nœud'
  line_knoop_t: 'Disque blanc, anneau violet et numéro, exactement comme les tuiles du réseau le dessinent.'
  back_to_map: 'Retour à la carte'
