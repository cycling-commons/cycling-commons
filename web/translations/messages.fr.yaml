  what_p1: 'Vous êtes la seule personne à savoir que la route est coupée, que le gravier commence ici, ou que la fontaine de la place fonctionne. D''habitude cette connaissance s''évapore avant votre retour. Scout la capte au moment où vous passez : une pression, et c''est enregistré avec votre position et l''heure.'
  what_p2: 'Scout <b>fonctionne seul</b>. L''application et son format marchent avec ou sans le Cycling Commons — vos marqueurs sont à vous, dans votre propre fichier, lisibles par n''importe quel outil.'
