roadmap:
  kicker: 'Feuille de route'
  title: 'Ce que nous construisons ensuite.'
  lead: 'Pas de dates, car nous ne ferions que deviner. Ce qui se construit maintenant, ce qui vient ensuite, et ce que nous voulons sans l''avoir planifié. L''ordre au sein de chaque groupe n''est pas figé.'
  group_now: 'Maintenant'
  group_now_sub: 'En construction. Quelqu''un y travaille vraiment.'
  group_next: 'Ensuite'
  group_next_sub: 'Décidé, en attente d''un tour. Sauf surprise, c''est ce qui suit.'
  group_later: 'Plus tard'
  group_later_sub: 'Souhaité, non planifié. De vraies intentions, aucune promesse de date.'
  item_going_live: '<b>Le lancement.</b> Les premières semaines en ligne : trouver des testeurs, corriger vite ce qu''ils rencontrent, et faire connaître le Commons auprès des cyclistes.'
  item_provider_refresh: '<b>Plus de sources de données, qui se mettent à jour seules.</b> Des sources officielles ouvertes, comme un registre national des points d''eau potable, ajoutées depuis le bureau des curateurs et actualisées selon un calendrier.'
  item_region_vote: '<b>Le vote saisonnier.</b> Voter pour les meilleurs cols, itinéraires, points de vue, patrimoine et hébergements d''une région, une saison à la fois. Le scrutin est construit et ouvrira après le lancement.'
  item_heatmap: '<b>Là où les cyclistes aiment aller.</b> Une couche de chaleur qui met en avant les lieux appréciés par beaucoup, comme les panoramas et les cols. Uniquement à partir de points anonymes, et un lieu n''apparaît que lorsque assez de cyclistes différents le soutiennent, pour ne jamais désigner une seule personne.'
  item_standing: '<b>La réputation du contributeur.</b> Les cyclistes dont le travail est régulièrement approuvé gagnent une main plus légère, comme des modifications publiées aussitôt, au lieu de l''obtenir à la main.'
  item_osm_giveback: '<b>Rendre à OpenStreetMap.</b> Ce que les cyclistes confirment ici, proposé en amont sous une forme qu''OpenStreetMap peut accepter.'
  item_map_a11y: '<b>Rendre la carte utilisable sans souris.</b> Le manque assumé de notre déclaration d''accessibilité : l''accès clavier et lecteur d''écran à la carte elle-même, pas seulement aux pages autour.'
  item_route_export: '<b>Emportez un itinéraire.</b> Esquissez-le d''après ce que montre la carte, puis envoyez-le au planificateur ou à l''appareil que vous utilisez déjà.'
  item_region_portrait: '<b>Un portrait de chaque région.</b> La page d''une région compte ce qui s''y trouve. Elle devrait dire à quoi ressemble le vélo là-bas : le relief, la part de routes revêtues, les grands cols, le réseau balisé, l''eau et les toilettes aux cent kilomètres, les itinéraires que les cyclistes recommandent, et la fraîcheur des données.'
  item_reviews: '<b>Vos propres mots sur n''importe quel lieu.</b> Une courte note à vous sur une fontaine, un col, un hébergement ou un itinéraire, à côté des faits : ce que c''était quand vous y étiez. Plusieurs cyclistes, plusieurs notes. Pas une note chiffrée.'
  item_favourites: '<b>Vos lieux favoris.</b> Enregistrez un point d’eau, une montée, un hébergement ou un itinéraire dans une liste de favoris de votre profil, pour le retrouver avant la prochaine sortie.'
  item_roadmap_votes: '<b>Avoir voix au chapitre.</b> Voter pour ce qui compte pour vous, suivre un élément, et en proposer un.'
  item_more_countries: '<b>Plus de pays et de régions.</b> Le Commons s''ouvre à de nouveaux pays, chacun avec des curateurs qui connaissent les routes. Demandez le vôtre sur la page d''inscription.'
  item_scout_devices: '<b>Scout sur plus d''appareils.</b> Signalez ce que vous croisez, d''abord sur Android, puis sur Hammerhead Karoo et iPhone.'
  item_open_api: '<b>L''API de données ouvertes, complète.</b> Chaque lieu, col et itinéraire lisible par une API stable et documentée, avec des téléchargements en masse des données et des tuiles de la carte, pour que chacun puisse bâtir sur le Commons ou en héberger une copie.'
  foot_shipped_pre: 'Ce qui est déjà sorti est dans le'
  foot_shipped_link: 'journal des nouveautés'
  foot_shipped_mid: '. Il manque quelque chose dont vous avez besoin ? Dites-le sur la'
  foot_contact_link: 'page de contact'
  foot_shipped_post: ', une personne le lira.'
changelog:
  kicker: 'Nouveautés'
  title: 'Ce qui est nouveau.'
  lead: 'Chaque version, la plus récente d''abord, en mots simples. La version indiquée ici est celle imprimée au pied de chaque page : vous savez toujours ce que vous regardez.'
  feed_title: 'Cycling Commons : ce qui est nouveau'
  feed_subtitle: 'Versions de la plateforme Cycling Commons.'
  feed_pre: 'Suivez sans compte : abonnez-vous au'
  feed_link: 'flux Atom'
  feed_mid: '. Ce qui vient ensuite est sur la'
  feed_roadmap: 'feuille de route'
  feed_post: '.'
  v091_banner: "<b>La carte dit où elle ne va pas encore.</b> En dehors des pays couverts, un bandeau le signale et montre comment aider à en ajouter un."
  v091_climbs: "<b>Marquez le point le plus raide d'une montée.</b> L'éditeur de montées permet d'indiquer où une montée est la plus raide, et les longues montées ont désormais aussi leur profil de pente."
  v091_languages: "<b>Anglais et néerlandais.</b> Le site est proposé en anglais et en néerlandais ; une adresse dans une autre langue mène à l'une des deux."
  v091_reset: "<b>Réinitialisation du mot de passe dans votre langue.</b> Le courriel arrive dans la langue dans laquelle vous utilisez le site, avec le lien aussi écrit en toutes lettres."
  v091_bugs: "<b>Signaler un bogue est plus simple.</b> Le bouton peut faire une capture d'écran de la page pour vous, le panneau peut être agrandi, et il répond dans votre langue."
  v091_safety: "<b>Chaque image est vérifiée avant que quiconque la voie.</b> Les captures jointes aux signalements sont analysées contre les virus et redessinées en arrière-plan, et les photos de Wikimedia Commons sont toujours affichées depuis notre propre copie."
  section_public: "Site public"
  section_rider: "Compte cycliste"
  section_curator: "Compte curateur"
  v095_privacy: "<b>Une politique de confidentialité plus claire, qui vous dit quand elle change.</b> Elle a un numéro de version et une liste de ce qui a changé. Si vous êtes connecté, un avis s'affiche jusqu'à ce que vous ayez lu la nouvelle version. Elle utilise des mots simples, nomme chaque service hors de l'UE et ce qu'il voit, et chaque article du RGPD renvoie directement à cet article."
  v095_terms: "<b>Des conditions et un consentement photo qui disent la même chose.</b> Les conditions affichent un numéro de version, sa date et ce qui a changé, comme la notice de confidentialité, et les deux renvoient à tout leur historique des révisions. Le consentement photo dit désormais ce que disent les conditions : une retouche ordinaire comme le recadrage est permise, ajouter ou retirer des éléments ne l'est pas. Vous le cochez une fois de plus lors de votre prochain envoi."
  v095_security: "<b>Plusieurs améliorations de sécurité et de confidentialité.</b>"
  v095_fixes: "<b>Parmi les petites corrections :</b> chaque section des conditions a son propre numéro, l'enregistrement d'une description de photo fonctionne de nouveau, le surlignage rouge se place sur le lieu choisi, et les icônes d'abri figurent dans la légende."
  v095_traffic: "<b>Montrez à quel point une route est fréquentée.</b> Si vous roulez avec un radar arrière, la vérification de sortie de Scout peut envoyer un résumé du trafic : par route, la distance parcourue, le nombre de voitures qui vous ont dépassé et la vitesse de ces voitures, et si vous étiez sur une piste cyclable, une bande cyclable ou la route. Votre fichier de sortie et votre trace GPS restent sur votre appareil. Vous choisissez pour chaque sortie."
  v095_rides: "<b>Vérifiez plusieurs sorties à la fois.</b> Choisissez ou déposez plusieurs fichiers .fit, ou un zip de fichiers .fit, comme un export Scout. La carte montre les routes parcourues, et un seul résumé les additionne."
  v095_time_zone: "<b>Les heures dans votre propre fuseau horaire.</b> Choisissez un fuseau dans vos paramètres, ou gardez Automatique pour utiliser celui de votre navigateur. Chaque date et heure du site le suit."
  v095_base: "<b>Votre localisation de base est plus privée.</b> Nous stockons un point au hasard jusqu'à 2,5 km de l'endroit choisi, il n'indique donc guère plus que la commune."
  v095_traffic_desk: "<b>Voyez à quel point les routes sont fréquentées.</b> Le trafic mesuré se trouve sous Plus dans le bureau. Il indique calme, modéré ou chargé pour chaque route dès qu'assez de sorties sur plusieurs jours sont arrivées. Dès la première sortie, il montre combien de routes ont des données, par pays et par région."
  v095_kinds: "<b>Les lieux disent ce qu'ils sont.</b> Un point de vue peut être un belvédère, une cascade, une falaise ou une grotte ; un lieu d'histoire, un château, une ruine ou un mémorial ; un abri, un abri de pique-nique, un appentis ou une cabane. Chaque type a sa propre icône sur la carte et dans la légende. Ce sont les types d'OpenStreetMap, pour que ce que nous ajoutons puisse y retourner."
  v095_map: "<b>Une carte plus calme.</b> En vue large, un voile léger montre où OpenStreetMap a des lieux, et les icônes apparaissent quand vous zoomez, l'eau d'abord. Nos propres repères grandissent quand vous zoomez, les icônes des lieux passent au-dessus des itinéraires, et les étiquettes de sommet et de pente des montées apparaissent de plus près."
  v095_search: "<b>Une meilleure recherche.</b> Un lieu n'apparaît qu'une fois, avec sa région. Un nom long tient sur deux lignes, et la liste revient quand vous cliquez de nouveau dans le champ de recherche."
  v095_scout_tags: "<b>Les étiquettes de Scout gardent votre choix.</b> Quand vous marquez des nids-de-poule ou une cascade pendant une sortie, la revue de sortie affiche cette réponse. Pour un point de vue ou un lieu d'histoire, elle demande de quel type de lieu il s'agit, par exemple un belvédère ou un château."
  v095_hints: "<b>Fermez une note une fois lue.</b> La note sur vos repères en attente de validation a un bouton de fermeture, et elle reste fermée sur tous vos appareils."
  v095_curator_kinds: "<b>Le type vient juste après le nom.</b> Sur chaque formulaire, le Type est le deuxième champ, trié par ordre alphabétique dans votre langue. Une étiquette de Scout arrive avec son type rempli quand le cycliste en a choisi un."
  v095_grant: "<b>Les droits de curateur viennent avec leurs zones.</b> Quand un administrateur nomme quelqu'un curateur, il choisit d'abord les zones, ou coche Toutes les zones, dans la même étape."
  v094_ballot: "<b>Votez pour le meilleur de votre région, une saison à l'avance.</b> Choisissez jusqu'à 5 cols, itinéraires, points de vue, lieux de patrimoine ou hébergements dans chaque liste, dans votre ordre. Votre numéro un reçoit le plus de points. Une fois validé, votre bulletin compte."
  v094_best: "<b>Découvrez ce que les cyclistes ont préféré chaque saison, au nord comme au sud de l'équateur.</b> La page du meilleur montre les gagnants de chaque saison, région par région, en commençant par la vôtre. Chaque région suit ses propres saisons. Un favori manque ? Ajoutez-le dès maintenant à la carte pour pouvoir voter pour lui."
  v094_fair: "<b>Chaque lieu a sa chance.</b> Le bulletin classe les lieux de A à Z, et personne ne voit le classement tant que le vote est ouvert. Le top 5 de l'an dernier a un petit désavantage, pour que d'autres lieux ou de nouveaux lieux puissent gagner aussi."
  v094_climbs: "<b>Voyez où un col fait le plus mal.</b> Le profil du col marque les 250 m les plus raides et le point le plus raide, et un col doux ne ressemble plus à un mur. Quand vous ajoutez un col, la carte trouve le point le plus raide pour vous ; déplacez-le s'il est faux. Le formulaire part du dénivelé et de la pente moyenne connus du col."
  v094_map: "<b>Trouvez les lieux plus vite sur la carte.</b> Les épingles au même endroit s'écartent, pour que vous puissiez toucher chacune. Une recherche partout trouve aussi les cols et les itinéraires. Un lien vers un lieu d'OpenStreetMap l'ouvre sur la carte. Sur téléphone, le profil du col s'ouvre au-dessus du panneau du bas."
  v094_security: "<b>Plusieurs améliorations de sécurité</b> pour la connexion, l'authentification à deux facteurs et nos e-mails."
  v094_fixes: "<b>Parmi les petites corrections :</b> les filtres ont le même aspect et le même fonctionnement sur chaque page, et les textes français et néerlandais retrouvent leurs apostrophes."
  v094_name: "<b>Sachez comment les autres vous voient.</b> Vos paramètres montrent le nom que voient les autres cyclistes : votre nom anonyme tant que votre profil est privé, votre nom affiché quand il est public."
  v094_confirmations: "<b>Retrouvez vite vos confirmations et vos votes.</b> Les lieux que vous avez confirmés ont leur propre onglet, page par page, et vos votes montrent ce que vous avez choisi."
  v094_bugs: "<b>Triez les rapports de bug plus vite.</b> Les rapports de bug ont maintenant les catégories API, messages et bureaux. Un rapport sans adresse de son auteur n'attend pas de réponse quand vous le fermez."
  v094_providers: "<b>Remplissez ce qu'une source de données entière a en commun.</b> Sur le bureau des fournisseurs, vous fixez des valeurs par défaut par catégorie, par exemple : chaque robinet RIVM est un robinet d'eau potable gratuit. Une mise à jour ne remplit une valeur par défaut que là où un lieu n'a pas de valeur, et jamais par-dessus la modification d'un cycliste. « Toujours conforme à la carte ? » n'a jamais de valeur par défaut : seul un cycliste qui a regardé peut y répondre."
  v094_desk: "<b>Rien n'attend sans être vu.</b> Les compteurs non lus des onglets des bureaux sont orange, comme tous les autres compteurs. L'adresse de support reçoit un e-mail pour chaque candidature de curateur et chaque demande de nouveau pays."
  v093_climbs: "<b>Une montée compte quand vous roulez jusqu'en haut.</b> Un parcours emprunte une montée seulement s'il en gravit la plus grande partie et finit près du sommet. Le contrôle de sortie liste les montées de votre sortie."
  v093_texts: "<b>Écrivez le texte de votre commune ou région.</b> Toute personne connectée peut proposer un texte pour une commune ou une région, et indique s'il est adapté de Wikipédia ou écrit avec ses propres mots. Le curateur de la région l'approuve. La ligne de crédit nomme l'auteur, et ne renvoie vers Wikipédia que si le texte s'en inspire."
  v093_contributions: "<b>Toutes vos contributions dans une seule liste.</b> Lieux et parcours sont ensemble, les plus récents d'abord. Vous pouvez ouvrir sur la carte un parcours que vous avez proposé et le modifier, photos comprises, jusqu'à la décision d'un curateur."
  v093_signin: "<b>La connexion est plus claire.</b> Rester connecté indique que cela dure 7 jours dans ce navigateur, et qu'il ne faut pas l'utiliser sur un appareil partagé. Votre première connexion après la confirmation de votre e-mail ouvre vos paramètres."
  v093_updates: "<b>Choisissez la fréquence de nos messages.</b> Tenez-moi au courant, dans vos paramètres, demande maintenant à quelle fréquence : les grandes nouvelles au plus 4 fois par an, ou chaque mise à jour au plus 2 fois par mois."
  v093_privacy: "<b>Plus de vie privée.</b> Chaque cycliste a un nom anonyme aléatoire, et un cycliste au profil non public ne se trouve que par ce nom. Vos paramètres l'affichent. La carte ne montre plus à quelle distance du repère se tenait un photographe. Les messages sur vos contributions sont conservés tant que votre compte existe et supprimés avec lui, et un compte que personne n'a utilisé pendant 24 mois est supprimé. Les messages de contact partent 24 mois après la fin de l'affaire, et l'adresse de réponse d'un signalement 90 jours après la décision."
  v093_messages: "<b>Non lu reste non lu jusqu'à ce que vous l'ouvriez.</b> Un message, un message de la salle ou un nouveau travail sur un bureau garde sa marque jusqu'à ce que vous l'ouvriez, pas quand une liste se contente de l'afficher. Le nom d'un lieu ou d'un parcours dans un message est entre guillemets et en italique."
  v093_access: "<b>Plus simple au téléphone et au clavier.</b> Le menu du téléphone mène à chaque page principale. Les choix de région et de Participer fonctionnent au clavier seul, et chaque champ de formulaire montre où vous êtes. La carte de couverture est d'un lavande plus clair."
  v093_fixes: "<b>Parmi les nombreuses petites corrections :</b> les e-mails ont une vraie version en texte brut, les longues listes le long d'un parcours se replient après deux lignes, un lieu connu de deux sources garde la fiche de la source la plus fiable, Voir sur la carte dans vos messages ouvre le lieu lui-même, les listes de langues ne montrent que les langues du site, et la légende des revêtements ne clignote plus à l'ouverture de la carte."
  v093_curators: "<b>Pour les curateurs.</b> Le règlement est sur le site, en onglets, et chaque règle correspond au fonctionnement du site. La file et l'Historique se filtrent par catégorie. Vous corrigez une suggestion de texte et l'approuvez dans le même formulaire, où vous décidez aussi si le crédit Wikipédia reste. Les suggestions de texte portent une icône de commune ou de région. La corbeille garde un élément 30 jours, et vous pouvez le restaurer depuis la page Corbeille."
  v092_area: "<b>La carte charge votre zone, pas le monde entier.</b> Elle ne télécharge que les régions que vous regardez : elle démarre plus vite et consomme bien moins de données. Les autres régions se chargent quand vous y allez."
  v092_search: "<b>Chercher partout, itinéraires compris.</b> Avec Partout activé, la recherche trouve nos lieux dans tous les pays, et la case Itinéraires ajoute les itinéraires aux résultats. Choisissez-en un et il s'ouvre sur la carte."
  v092_fresh: "<b>Les repères montrent quand quelqu'un a vérifié.</b> Un lieu que personne n'a confirmé depuis 6 mois a un contour orange, depuis 12 mois un contour rouge."
  v092_key: "<b>La légende est complète.</b> Le panneau Légende explique chaque marque de la carte avec un exemple, et les badges des repères sont plus grands et plus lisibles."
  v092_similar: "<b>Les lieux semblables avant d'en ajouter un.</b> Quand vous ajoutez un lieu, le formulaire montre les lieux du même type à proximité. Marquez ceux qui sont le même lieu : le vôtre les remplace une fois approuvé."
  v092_bugs: "<b>Le panneau de bugs garde votre brouillon.</b> Il indique quand il a gardé un signalement non envoyé, et un bouton efface tout."
  v092_speed: "<b>Des pages plus rapides quand vous n'êtes pas connecté.</b> Le meilleur et les autres pages publiques se chargent plus vite, même après une page qui demande de se connecter. Une fois connecté, les pages sont faites pour vous et se chargent à la vitesse habituelle."
  v092_confirm: "<b>Confirmez votre e-mail avant de vous connecter.</b> Un nouveau compte peut se connecter une fois son adresse e-mail confirmée. Le lien de l'e-mail fonctionne 24 heures. Un lien expiré vous mène à une page où vous pouvez en demander un nouveau."
  v092_strava: "<b>Roulez avec nous sur Strava.</b> Le pied de page mène au club Cycling Commons sur Strava."
  v090_towns: "<b>Les villes sur la carte.</b> Une ville ouvre désormais sa propre fiche, signalée par le repère du site."
  v090_fresh: "<b>Les données de la carte se rafraîchissent seules.</b> Chaque nuit, le site relit OpenStreetMap pour les régions qu'il couvre : ce que vous voyez a quelques jours, pas quelques mois."
  v090_surface: "<b>Revêtement et itinéraires, reconstruits chaque semaine.</b> Les couches de revêtement et d'itinéraires sont régénérées automatiquement, et non plus à la main."
  v090_photos: "<b>Chaque photo est analysée avant d'apparaître.</b> Un envoi est vérifié en arrière-plan et n'est publié qu'une fois validé."
  v090_accounts: "<b>Les comptes jamais confirmés sont supprimés.</b> Si une inscription n'est pas menée à son terme, l'enregistrement ne subsiste pas."
  v080_map: '<b>La carte.</b> Lieux, ascensions et itinéraires dans dix-neuf pays, avec une couche de revêtement, l''imagerie satellite et de rue, et un thème clair comme un thème sombre.'
  v080_photos: '<b>Photos.</b> Ajoutez une photo à n''importe quel lieu, sous licence CC BY-SA 4.0. Les données de localisation sont retirées avant publication, et chaque photo a sa page.'
  v080_routes: '<b>Itinéraires.</b> Proposez un itinéraire depuis un fichier GPX, votez sur ceux que vous avez roulés, et voyez le meilleur d''une région.'
  v080_contribute: '<b>Contribuer.</b> Ajoutez et corrigez des lieux depuis la carte elle-même, confirmez que quelque chose est toujours là, et suivez ce qu''un curateur a décidé et pourquoi.'
  v080_accounts: '<b>Comptes.</b> Profil public facultatif, connexion à deux facteurs, export complet de vos données, et suppression de compte qui prend effet immédiatement.'
  v080_languages: '<b>Cinq langues.</b> Anglais, français, néerlandais, allemand et espagnol, avec un moyen de proposer une meilleure traduction.'
  v080_legal: '<b>Les papiers faits correctement.</b> Une politique de confidentialité qui nomme chaque sous-traitant, une déclaration d''accessibilité qui liste ce qui ne marche pas encore, et un contact qui arrive chez une personne.'
