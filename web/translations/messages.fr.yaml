  howto2_post: ': c''est cela qui façonne la prochaine étape.'
  howto3_b: 'Ajoutez un lieu que vous connaissez.'
  howto3_link: 'Choisissez une catégorie et placez-le sur la carte'
  howto3_post: ' — un point d''eau, un danger, un point de vue, un hébergement accueillant pour les cyclistes. Un curateur le lit avant que quiconque le voie.'
  howto4_b: 'Gardez juste la zone autour de chez vous.'
  howto4_link: 'Ouvrez la carte là où vous roulez'
  howto4_post: 'et parcourez ce qui s''y trouve déjà. Confirmez ce qui tient toujours, corrigez ce qui a bougé, ajoutez ce qui manque. Aucun rôle, aucune candidature: c''est la chose la plus utile à faire, et c''est ainsi qu''une région cesse d''être une approximation.'
  howto5_b: 'Prenez une région en charge.'
  howto5_link: 'Voir quelles régions cherchent une personne de curation'
  howto5_post: 'ou demandez un pays que le Commons n''a pas encore atteint. Les deux commencent sur la même page.'
  skills_kicker: 'Prêtez vos compétences'
  skills_h2: 'Aidez à construire et pérenniser le projet.'
  role1_rk: '01 · CONSTRUIRE'
  role1_h: 'Développeurs'
  role1_p: 'La vraie plateforme : le backend &amp; API (Symfony 7 LTS), le frontend MapLibre, et le pipeline géospatial (PostGIS, routage, altitude, import OSM).'
  role1_link: 'Commencer sur GitHub →'
  role2_rk: '02 · DÉVELOPPER'
  role2_h: 'Réseaux sociaux & communauté'
  role2_p: 'Racontez l''histoire et faites grandir la communauté: écrire le blog, animer les canaux, accueillir les nouveaux, et garder la communauté saine à mesure qu''elle grandit.'
  role2_link: 'Prendre contact →'
  role3_rk: '03 · PÉRENNISER'
  role3_h: 'Leveurs de fonds & rédacteurs de subventions'
  role3_p: 'Subventions de données ouvertes et de mobilité durable, financement européen pour le cyclisme — le carburant qui maintient le Commons gratuit et indépendant.'
  role3_link: 'Prendre contact →'
  role4_rk: '04 · PROTÉGER'
  role4_h: 'Juridique & gouvernance'
  role4_p: 'La mise en place de la fondation indépendante, les licences ODbL / CC, les conditions de contribution et le RGPD — la structure qui le maintient ouvert pour de bon.'
  role4_link: 'Prendre contact →'
  also_welcome: '<b>Également bienvenus :</b> traducteurs, designers, cartographes OpenStreetMap, photographes et bâtisseurs de partenariats (clubs cyclistes, offices de tourisme, hébergements bike-friendly). Vous ne voyez pas votre rôle ?'
  also_tell: 'Dites-nous ce que vous apporteriez.'
