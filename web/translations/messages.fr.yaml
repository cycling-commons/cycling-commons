    reveal: 'Afficher la photo'
    note_label: 'Note pour le registre (facultatif)'
    note_placeholder: 'ex. signalé aux autorités le …, référence …'
    release: 'Lever le blocage'
    release_help: 'Lève le blocage et rend la photo à la modération normale. Cela ne la remet pas sur la carte et ne supprime rien.'
    released: 'Le blocage a été levé.'
    release_failed: 'La photo n''a pas pu revenir du stockage privé, le blocage reste donc en place. Réessayez plus tard.'
  flood:
    title: 'Playbook : vague de signalements de photos'
    state_open_b: 'Le coupe-circuit de retrait automatique est OUVERT.'
    state_open: 'Les signalements anonymes ne masquent plus de photos d''eux-mêmes. Suivez les étapes ci-dessous.'
    state_closed: 'Le coupe-circuit est fermé. Fonctionnement normal.'
    lead: 'La voie de signalement permet à quiconque de dire qu''il figure sur une photo, sans compte, parce que la loi ne fait pas dépendre ce droit d''un compte. Cette ouverture est aussi sa faiblesse : un attaquant distribué peut signaler depuis des milliers d''adresses à la fois. Cette page dit quoi faire dans ce cas.'
    h_what: 'Ce qui s''est déjà produit automatiquement'
    what: 'Un budget à l''échelle du site plafonne le nombre de photos que les signalements anonymes peuvent masquer seuls : %hourly% par heure et %daily% par jour. Au-delà, les signalements urgents arrivent toujours et attendent un curateur, mais ne masquent plus rien ; le bureau de modération affiche une bannière et l''adresse d''alerte reçoit un e-mail par heure. Rien n''a été supprimé ni retiré : les photos masquées sont toujours stockées, leurs contributeurs ont été prévenus qu''elles sont masquées, et seule une décision de curateur retire quoi que ce soit.'
    h_steps: 'Étapes'
    step_verify: 'Regardez les signalements en attente avant d''agir. Une vraie urgence et une attaque ne se ressemblent pas : les vrais signalements sont rares, précis sur une personne, et étalés dans le temps.'
    step_restore: 'Restaurez en une action ce qui est manifestement abusif — les contributeurs sont prévenus du retour de leurs photos. Cette page rejette les signalements sans les refuser, donc une réclamation authentique ultérieure sur la même photo sera toujours entendue.'
    step_zero: 'Si cela continue, mettez le budget horaire à 0. Les signalements anonymes ne masquent alors plus jamais de photo d''eux-mêmes ; tout attend un curateur. C''est l''arrêt d''urgence, sans déploiement.'
    step_desk: 'Prévenez les curateurs de service que le bureau va se remplir de bruit et qu''ils ne doivent pas le refuser en masse : un refus est un jugement et ferme cette catégorie pour cette photo à jamais.'
    step_after: 'Une fois terminé, remettez les budgets et notez le rythme réel observé. Les bons chiffres sont ceux qu''enseigne un incident réel.'
    h_dont: 'À ne pas faire'
    dont_decline: 'Ne refusez pas en masse depuis le bureau de modération. Utilisez la page de restauration : un refus immunise définitivement la photo contre le prochain signalement authentique du même type.'
    dont_raise: 'N''augmentez pas les budgets pour faire disparaître la bannière. Le budget est précisément ce qui borne les dégâts.'
    dont_disclose: 'Ne dites rien aux signalants ni aux téléverseurs l''un sur l''autre, et ne publiez ni les seuils, ni le test de décision exact, ni la catégorie qui agit le plus vite. Tout ce qu''un curateur sait sur la façon de faire retirer une photo est aussi un script d''ingénierie sociale.'
    dont_ignore: 'Ne supposez pas qu''il s''agit d''une attaque. Vérifiez d''abord ; le levier existe pour du réel.'
    h_real: 'Si c''est réel'
    real: 'Si les signalements sont authentiques — une véritable campagne d''images illégales sur la carte — le coupe-circuit n''est pas votre ennemi : les signalements arrivent toujours et rien n''est perdu. Retenez vous-même depuis le bureau de modération ce qui doit l''être, conservez les traces, et impliquez immédiatement le propriétaire du site. Ne supprimez jamais les preuves de contenu illégal avant qu''il ait été signalé aux autorités.'
    h_escalated: 'Si un curateur escalade un contenu comme illégal'
    escalated_intro: 'Les photos escaladées sont déjà masquées au public et au bureau de modération, et rien dans l''application ne peut les supprimer. Elles sont ici'
    esc_step_read: 'Lisez d''abord les mots du curateur et décidez si vous devez seulement regarder l''image. Souvent, non.'
    esc_step_report: 'Signalez-le là où il faut. Un contenu impliquant une menace pour la vie ou la sécurité d''une personne doit être signalé sans délai aux autorités (DSA art. 18). Pour du matériel pédocriminel, utilisez la ligne dédiée (Offlimits / Meldpunt Kinderporno) et/ou la police. Le contenu terroriste impose une conservation de six mois.'
    esc_step_preserve: 'Ne supprimez rien et ne demandez à personne de le faire. Le blocage existe pour que la trace subsiste jusqu''au signalement ; l''autorité destinataire décide du moment où cela peut disparaître.'
    esc_step_release: 'Ne levez le blocage que s''il s''avère que ce n''était pas ce que cela semblait être. Lever rend le contenu à la modération normale — cela ne le remet pas sur la carte.'
    esc_step_curator: 'Prenez des nouvelles du curateur qui a escaladé. Il l''a vu pour que personne d''autre n''ait à le voir : cela mérite un message.'
  withheld:
