roadmap:
  kicker: 'Feuille de route'
  title: 'Ce que nous construisons ensuite.'
  lead: 'Pas de dates, parce que nous ne ferions que deviner. Voici l''ordre du travail, tenu honnêtement : ce qui est en construction, ce qui est décidé et attend, et ce que nous voulons sans l''avoir planifié. Ce qui est terminé quitte cette page pour le journal des nouveautés.'
  group_now: 'Maintenant'
  group_now_sub: 'En construction. Quelqu''un y travaille vraiment.'
  group_next: 'Ensuite'
  group_next_sub: 'Décidé, en attente d''un tour. Sauf surprise, c''est ce qui suit.'
  group_later: 'Plus tard'
  group_later_sub: 'Souhaité, non planifié. De vraies intentions, aucune promesse de date.'
  item_curator_direct: '<b>Le nouveau lieu d''un curateur va directement sur la carte.</b> Les modifications d''un curateur sautent déjà la file ; un nouveau lieu y attend encore. L''assistant posera la seule question que la file pose aujourd''hui, le lieu est-il déjà dans OpenStreetMap, puis publiera.'
  item_pending_notice: '<b>Vous prévenir quand un lieu a déjà une modification en attente.</b> Deux cyclistes qui corrigent la même fontaine devraient voir le travail l''un de l''autre avant de commencer, pas après un curateur.'
  item_provider_refresh: '<b>Des fournisseurs de données qui se rafraîchissent seuls.</b> Des sources officielles, comme un registre national de l''eau potable, moissonnées selon un calendrier, avec un bouton Lancer et un formulaire pour ajouter un fournisseur depuis le bureau des curateurs.'
  item_release_mail: '<b>Le courriel de version.</b> Vous pouvez déjà rejoindre la liste sur votre page de réglages ; rien n''a encore été envoyé. Le premier courriel partira avec la prochaine version.'
  item_support_thread: '<b>Une conversation avec le support que vous pouvez suivre.</b> Un expéditeur connecté garde une copie de ce qu''il a écrit, et la réponse arrive dans son compte : une question devient un fil, pas deux courriels.'
  item_surface_loop: '<b>Les corrections de revêtement, toute la boucle.</b> La correction d''un cycliste sur un revêtement atteint les tuiles, et un curateur peut la voir et l''annuler.'
  item_photo_link: '<b>Ajouter une photo par lien.</b> Une image déjà sur Wikimedia Commons, ajoutée par son adresse : la licence est vérifiée et le fichier est récupéré, jamais lié à chaud.'
  item_phone_map: '<b>Le plan du site sur un téléphone.</b> L''annuaire des pages est une carte routière qui défile latéralement sur un téléphone aujourd''hui. Elle devrait s''empiler en une carte-bande qui défile vers le bas.'
  item_region_vote: '<b>Le vote saisonnier.</b> Classer les montées, hébergements, panoramas et patrimoine d''une région, reclassés chaque saison. La page est un aperçu de conception aujourd''hui ; le scrutin derrière est prévu.'
  item_heatmap: '<b>La carte de chaleur des sorties, de retour sur la carte.</b> Masquée tant que les cyclistes n''ont pas ajouté assez d''itinéraires pour qu''elle dise quelque chose.'
  item_saved_regions: '<b>Régions enregistrées.</b> Gardez les régions où vous roulez dans une liste à vous.'
  item_observations: '<b>Des observations qui vieillissent.</b> Une fermeture ou un état signalé pendant une sortie s''efface de lui-même au bout d''un moment, sauf si quelqu''un le confirme à nouveau.'
  item_item_links: '<b>Des liens sortants depuis un lieu.</b> Un lieu porte les pages qui le décrivent, comme un site officiel ou un article de wiki.'
  item_standing: '<b>La réputation du contributeur.</b> Les cyclistes dont le travail est régulièrement approuvé gagnent une main plus légère, comme des modifications publiées aussitôt, au lieu de l''obtenir à la main.'
  item_curator_room: '<b>Une salle des curateurs.</b> Un tableau dans le bureau de modération où un curateur peut demander avant d''agir, et voir ce que les autres ont demandé.'
  item_beta: '<b>Un programme de bêta-testeurs.</b> Des cyclistes qui veulent essayer les choses avant leur sortie, et un moyen de nous dire ce qui a cassé.'
  item_osm_giveback: '<b>Rendre à OpenStreetMap.</b> Ce que les cyclistes confirment ici, proposé en amont sous une forme qu''OpenStreetMap peut accepter.'
  item_map_a11y: '<b>Rendre la carte utilisable sans souris.</b> Le manque assumé de notre déclaration d''accessibilité : l''accès clavier et lecteur d''écran à la carte elle-même, pas seulement aux pages autour.'
  item_route_export: '<b>Emporter un itinéraire.</b> Export vers votre appareil ou votre planificateur, et un lien permanent vers une vue de la carte.'
  item_roadmap_votes: '<b>Avoir voix au chapitre.</b> Voter pour ce qui compte pour vous, suivre un élément, et en proposer un.'
  foot_shipped_pre: 'Ce qui est déjà sorti est dans le'
  foot_shipped_link: 'journal des nouveautés'
  foot_shipped_mid: '. Il manque quelque chose dont vous avez besoin ? Dites-le sur la'
  foot_contact_link: 'page de contact'
  foot_shipped_post: ', une personne le lira.'
changelog:
  kicker: 'Nouveautés'
  title: 'Ce qui est nouveau.'
  lead: 'Chaque version, la plus récente d''abord, en mots simples. La version indiquée ici est celle imprimée au pied de chaque page : vous savez toujours ce que vous regardez.'
  feed_title: 'Cycling Commons : ce qui est nouveau'
  feed_subtitle: 'Versions de la plateforme Cycling Commons.'
  feed_pre: 'Suivez sans compte : abonnez-vous au'
  feed_link: 'flux Atom'
  feed_mid: '. Ce qui vient ensuite est sur la'
  feed_roadmap: 'feuille de route'
  feed_post: '.'
  v080_map: '<b>La carte.</b> Lieux, ascensions et itinéraires dans dix-neuf pays, avec une couche de revêtement, l''imagerie satellite et de rue, et un thème clair comme un thème sombre.'
  v080_photos: '<b>Photos.</b> Ajoutez une photo à n''importe quel lieu, sous licence CC BY-SA 4.0. Les données de localisation sont retirées avant publication, et chaque photo a sa page.'
  v080_routes: '<b>Itinéraires.</b> Proposez un itinéraire depuis un fichier GPX, votez sur ceux que vous avez roulés, et voyez le meilleur d''une région.'
  v080_contribute: '<b>Contribuer.</b> Ajoutez et corrigez des lieux depuis la carte elle-même, confirmez que quelque chose est toujours là, et suivez ce qu''un curateur a décidé et pourquoi.'
  v080_accounts: '<b>Comptes.</b> Profil public facultatif, connexion à deux facteurs, export complet de vos données, et suppression de compte qui prend effet immédiatement.'
  v080_languages: '<b>Cinq langues.</b> Anglais, français, néerlandais, allemand et espagnol, avec un moyen de proposer une meilleure traduction.'
  v080_legal: '<b>Les papiers faits correctement.</b> Une politique de confidentialité qui nomme chaque sous-traitant, une déclaration d''accessibilité qui liste ce qui ne marche pas encore, et un contact qui arrive chez une personne.'
