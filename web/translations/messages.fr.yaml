admin:
  col_id: 'ID'
  escalated:
    title: 'Photos sous blocage légal'
    warning_b: 'À manipuler avec précaution.'
    warning: 'Ces photos ont été escaladées comme contenu suspecté illégal. Elles sont masquées au public et au bureau de modération, et rien dans l''application ne peut les supprimer. Ne supprimez pas le contenu : lorsqu''il relève des cas à signaler, la trace doit subsister jusqu''à ce qu''il l''ait été, et l''autorité destinataire décide du moment où il peut disparaître.'
    lead: 'Un curateur a vu quelque chose qu''il n''a pas voulu trancher seul. Lisez ce qu''il a écrit avant de décider de regarder l''image.'
    playbook_link: 'Ouvrir le playbook d''incident'
