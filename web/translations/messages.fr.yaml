  tick_label: 'Lancement'
  tick_year: '2026'
  corner_br: 'DÉFILER ↓'
  disc_label: 'POUR TOUS LES TYPES DE CYCLISME —'
  frag_kicker: 'UN SEUL ENDROIT, PAS UNE DOUZAINE D''APPLIS'
  frag_h2: 'Le savoir cycliste est éparpillé. Le Commons le rassemble.'
  frag_lead1: 'Aujourd''hui chaque couche vit dans son propre silo — une appli pour les cols, une autre pour les itinéraires, une autre pour les hébergements bike-friendly, une autre pour l''état des routes — et la plupart sont fermées. Les cyclistes assemblent une douzaine d''outils et les données ne se rejoignent jamais. Le Commons réunit le savoir non personnel en un seul endroit ouvert, libre à interroger et à utiliser.'
  frag_lead2: 'Et là où de bonnes données ouvertes existent déjà, nous ne les reconstruisons pas — nous nous <b>associons</b>. Nous nous connectons et interopérons avec d''autres communautés de données ouvertes (comme les réseaux d''hospitalité ouverts pour les hébergements) au lieu de nous enfermer dans notre propre copie. Les données ouvertes doivent se rejoindre, pas se fragmenter davantage.'
  frag_panel_h: 'Aujourd''hui. Une douzaine d''applis pour votre sortie.'
  frag_climbs: 'Cols &amp; montées'
  frag_climbs_tag: 'silo fermé'
  frag_rides: 'Itinéraires recommandés &amp; évaluations'
  frag_rides_tag: 'silo fermé'
  frag_scenic: 'Paysages, panoramas &amp; patrimoine'
  frag_scenic_tag: 'éparpillé'
  frag_stays: 'Hébergements bike-friendly'
  frag_stays_tag: 'silo fermé'
  frag_road: 'Revêtement &amp; état des routes'
  frag_road_tag: 'éparpillé'
  frag_water: 'Eau · ravitaillement · services'
  frag_water_tag: 'éparpillé'
  frag_vs: 'Le Commons → un atlas ouvert'
  what_kicker: 'LE PRINCIPE'
  what_h2: 'Des données ouvertes sur le monde — jamais sur vous.'
  what_lead: 'Le Commons détient la carte : cols, eau, dangers, hébergements — des faits sur les lieux, jamais sur les personnes. Pas d''identité, pas de suivi, rien de personnel. Fondé sur OpenStreetMap, reversé à lui, gouverné par sa communauté.'
  what_in_h: 'Les données cyclistes du monde'
  what_in_p: 'Cols, points d''eau, panoramas, POI patrimoniaux, hébergements bike-friendly, état des routes — ouverts sous ODbL.'
  what_out_h: 'Tout ce qui est personnel'
  what_out_p: 'Votre identité et vos données privées — le Commons ne les collecte jamais. Il cartographie le monde, pas le cycliste.'
  what_free_h: 'Pour tous sans exception'
