  data_h: 'Les données'
  data_sub: 'Les sources dont l''atlas est construit'
  osm_p: 'La fondation de l''atlas. Les infrastructures cyclables, les noms de lieux et les points confirmés par les cyclistes partent tous des données OpenStreetMap, © les contributeurs OpenStreetMap.'
  overture_p: 'Chaque limite de région de l''atlas provient du thème divisions d''Overture Maps, qui fusionne OpenStreetMap et geoBoundaries et porte les codes ISO 3166 sur lesquels repose l''annuaire mondial.'
  wallonia_p: 'Hébergements et points d''intérêt pour la Wallonie, issus de la base PIVOT du Géoportail de la Wallonie.'
  georegister_p: 'Le Georegistre national néerlandais, géré par het Kadaster. Il porte le registre des points d''eau potable publics, créé par drinkwaterkaart.nl et publié par le RIVM.'
  geofabrik_p: 'Extraits régionaux d''OpenStreetMap qui alimentent le pipeline de couverture.'
  drinkwater_p: 'Les points d''eau néerlandais renvoient vers drinkwaterkaart.nl pour vérifier un robinet avant de compter dessus.'
  map_h: 'La carte'
  map_sub: 'Rendu, tuiles et recherche'
  maplibre_p: 'Le moteur de rendu open source qui dessine chaque carte du site.'
  openfreemap_p: 'Sert les tuiles du fond de carte (style Liberty) — libre et ouvert, sans clé d''API.'
  protomaps_p: 'Le format d''archive monofichier PMTiles derrière nos couches de couverture.'
  wikimedia_p: 'Les photos initiales de cols et de lieux viennent de Wikimedia Commons ; chaque photo porte son propre crédit et sa licence dans le panneau.'
  wikipedia_p: 'Les pages de région s''ouvrent sur une courte introduction encyclopédique de la Wikipédia locale, récupérée à la construction du site et affichée telle quelle ; chaque page renvoie vers l''article exact qu''elle cite.'
  copernicus_p: 'Modèle d''élévation derrière les pentes des cols. "produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved". The organisations in charge of the Copernicus programme by law or by delegation do not incur any liability for any use of the Copernicus WorldDEM-30.'
