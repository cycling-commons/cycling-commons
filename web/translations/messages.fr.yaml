    lead: 'Toutes les photos qu''un signalement anonyme a masquées sur la carte et qui attendent encore une décision. Masquées, pas retirées : rien n''a été supprimé, et le contributeur a été prévenu qu''elle est masquée et pourquoi. Les restaurer ici les remet en ligne, prévient le contributeur et acte que le signalement n''était pas réel — cela ne ferme pas la catégorie, donc un futur signalement authentique sur la même photo sera toujours entendu.'
