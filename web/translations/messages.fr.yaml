markers:
  title: 'Marqueurs'
  lede: 'Chaque échelon de l''échelle de preuve, dessiné selon les règles de la carte. La bordure dit qui tient la fiche, le badge dit si quelqu''un s''est tenu sur place. Si deux échelons se ressemblent ici, c''est un constat, pas un bug d''affichage.'
  grid_h: 'La grille'
  grid_t: 'Trois bordures sur deux états de badge. La garde ne dit jamais qu''une fiche est moins bonne ; la preuve ne dit jamais à qui elle appartient.'
  axis_border: 'Bordure : qui tient la fiche'
  badge_on: 'Personne ne s''est tenu ici, à notre connaissance'
  badge_off: 'Un témoin daté est enregistré'
  custody_gross: 'Un fournisseur générique, petit disque'
  custody_specialty: 'Un fournisseur spécialisé, pointillés'
  custody_ours: 'À nous, papier plein'
  sentence: 'Le « ? » signifie que personne ne s''est tenu ici, à notre connaissance.'
  ladder_h: 'L''échelle'
  ladder_t: 'Classée d''abord par nature de preuve, puis par nombre, puis par fraîcheur. Une affirmation fossile a été saisie une fois et ne porte aucune date. Une affirmation vivante vient d''une source qui a republié la fiche dans la fenêtre. Un témoin est une personne sur place à une date connue.'
  col_rung: 'Échelon'
  col_dark: 'Carte sombre'
  col_light: 'Carte claire'
  col_evidence: 'Preuve'
  col_grade: 'Niveau'
  rung_1: 'Une affirmation fossile : la fiche d''un fournisseur générique, saisie une fois et jamais datée.'
  rung_2: 'Un fournisseur générique porte encore la fiche : une affirmation vivante.'
  rung_3: 'L''une de nos propres fiches. Un cycliste l''a ajoutée et un curateur l''a acceptée ; personne ne l''a encore confirmée.'
  rung_4: 'La fiche d''un fournisseur spécialisé, sans date : une affirmation fossile.'
  rung_5: 'Un fournisseur spécialisé a republié la fiche dans la fenêtre : une affirmation vivante.'
  rung_6: 'Un fournisseur spécialisé avec un état de service par fiche, comme le drapeau « hors service » d''un registre.'
  rung_7: 'Un témoin sorti de la fenêtre. Toujours un témoin, donc au-dessus de toute affirmation, mais le badge revient.'
  rung_8: 'Un témoin publié dans la fenêtre : une date de vérification OpenStreetMap ou le relevé daté d''un registre.'
  rung_9: 'Un cycliste dans la fenêtre, sous le seuil de vérification. La garde ne conditionne pas cet échelon.'
  rung_10: 'Vérifié : le nombre seuil de cyclistes s''est tenu ici.'
  rung_11: 'Vérifié : la parole d''un curateur, sous le seuil.'
  rung_12: 'Vérifié, et cinq cyclistes ou plus se sont tenus ici.'
  grade_claimed: 'affirmé'
  grade_attested: 'attesté'
  grade_minimum: 'minimum'
  grade_high: 'élevé'
  not_produced: 'pas encore produit'
  utility: 'Les échelons sont utilitaires et n''atteignent jamais le Best of. Cinquante cyclistes disant qu''un point de vue existe, ce n''est aucun d''eux disant qu''il est beau.'

