export:
  readme: |
    VOS DONNÉES CYCLING COMMONS
    ===========================

    Généré le %generated% pour le compte « %account% ».

    Cette archive répond à deux droits du RGPD à la fois : le droit d'accès
    (Art. 15) et le droit à la portabilité des données (Art. 20). La
    portabilité ne couvre que ce que vous nous avez fourni vous-même et
    l'accès couvre davantage, donc plutôt que de vous faire choisir entre deux
    téléchargements, voici l'ensemble.

    CE QU'ELLE CONTIENT

      account.json        Votre compte : email, nom affiché, langue, pays,
                          localisation de base, préférences et horodatages.
      contributions.json  Les soumissions que vous avez faites, et les
                          modifications de champs qu'elles ont produites sur la
                          carte une fois acceptées par un curateur.
      community.json      Confirmations, votes d'itinéraires, sorties,
                          suggestions de correction, demandes de pays,
                          candidatures de curateur.
      messages.json       Vos messages de tableau de bord, dans les deux sens.
      consent.json        Chaque licence photo accordée : quel texte, quelle
                          version, et quand.
      translations.json   Vos propositions de traduction de l'interface. Ce
                          sont des contributions CC BY-SA, pas des données
                          personnelles sur le cycliste.
      photos/index.json   Une entrée par photo envoyée, avec son statut et le
                          fichier correspondant.
      photos/*.webp       Les photos elles-mêmes.

    CE QU'ELLE NE CONTIENT PAS, ET POURQUOI

      Votre mot de passe, votre secret à deux facteurs et vos codes de secours.
      Ce sont les identifiants qui protègent ce compte. Une exportation est un
      fichier que l'on transfère et que l'on sauvegarde, et livrer les clés
      avec le contenu vous rendrait moins en sécurité, pas mieux informé.

      L'identité des curateurs qui ont traité votre travail. Ce qui a été
      décidé sur vos soumissions est votre donnée et tout figure ici, notes
      comprises. Qui a pris la décision est la leur.

    À PROPOS DES PHOTOS

      Ce sont nos copies traitées, pas les fichiers que vous avez envoyés. Nous
      réencodons chaque photo à l'arrivée et supprimons ses métadonnées, y
      compris toute localisation enregistrée par l'appareil : le fichier tel
      que vous l'avez envoyé n'est pas quelque chose que nous conservons. Une
      entrée de l'index avec "file": null est une photo dont les objets
      stockés ont déjà été supprimés ; sa trace subsiste.

      Les photos approuvées par un curateur sont sous licence CC BY-SA 4.0 et
      restent dans le Commons. Cette licence ne peut pas être retirée. Votre
      nom, en revanche, n'est pas dans les fichiers : l'attribution est résolue
      en direct depuis votre profil, donc rendre votre profil privé, ou fermer
      votre compte, change ce que crédite chaque copie de votre photo, y
      compris celles téléchargées il y a longtemps.

    QUESTIONS

      info@cyclingcommons.org
scout:
  kicker: 'Scout · le CC Tagger'
  title: 'Marquez ce que vous voyez, en roulant.'
  lead: 'Scout est un enregistreur de terrain à une pression, pour votre compteur. Signalez un danger, une route fermée, un changement de revêtement ou un point d''eau au moment où vous passez — sans vous arrêter, sans téléphone, sans rien taper. Chaque marqueur est écrit directement dans le fichier de votre sortie, dans un format ouvert et documenté.'
