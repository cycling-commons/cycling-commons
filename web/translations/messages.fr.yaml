  prototype_bold: 'Ceci est un prototype — une première ébauche de nos intentions, pas une politique finale ou contraignante.'
  prototype_body: 'Les licences ci-dessous décrivent la direction que nous envisageons pour le Commons, en langage clair — susceptible de changer avant le lancement.'
