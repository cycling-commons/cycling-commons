  howto2_mid1: 'et améliorez un lieu, ou passez directement à'
  howto2_addclimb: 'l''ajout d''une ascension'
  howto2_mid2: '. Un curateur lit chaque envoi. Là où le parcours ne correspond pas à la façon dont vous saisiriez vos données,'
  howto2_email: 'écrivez-nous'
  howto2_mid3: 'ou'
