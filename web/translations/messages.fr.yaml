  valhalla_p: 'Le moteur de routage et d''altitude que nous hébergeons nous-mêmes : il mesure chaque profil de col sur le MNT Copernicus et cale les tracés de l''éditeur de cols sur le réseau routier.'
  fflate_p: 'Ouvre les archives de sortie Scout dans votre navigateur, pour que le zip ne quitte jamais votre téléphone.'
  redoc_p: 'Affiche la référence publique de l''API, servie depuis ce site.'
