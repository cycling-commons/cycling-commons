    media_restored_after_review: 'Le signalement concernant votre photo n''a pas tenu : elle est de retour sur la carte, exactement comme avant. Merci de votre patience — masquer d''abord est ce qui garantit qu''une plainte authentique ne reste jamais en ligne des jours, et cela implique qu''une photo est parfois retirée un temps pour rien.'
