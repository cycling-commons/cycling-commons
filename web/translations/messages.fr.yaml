join:
  kicker: 'Participer'
  title: 'Construisez le Commons avec nous.'
  lead1: 'Cycling Commons est construit par les personnes qui l''utilisent — en code, en connaissance locale, et dans tout ce qui les entoure. C''est tôt, c''est ouvert, et il y a de la place pour vous.'
  lead2: 'Un bien commun ne grandit pas en recrutant ; il grandit quand les gens se montrent. Voici où nous avons besoin de mains.'
  heart_kicker: 'Le cœur du projet'
  heart_h2: 'Les cyclistes &amp; la connaissance locale.'
  heart_lead: 'Le Commons ne vaut que ce que les cyclistes savent : la montée qui vaut le détour, où trouver de l''eau, le carrefour piège, la boucle discrètement parfaite. Ce savoir est tout l''enjeu — et c''est la seule chose que personne ne peut construire à votre place.'
  hnote_b: 'Note honnête — le système de contribution n''est pas encore en ligne.'
  hnote_body: 'Ce que vous voyez est un prototype fonctionnel : les flux sont réels, mais rien n''est sauvegardé. Voici comment vous pouvez amorcer le Commons <i>dès aujourd''hui</i>, sans attendre :'
  howto1_b: 'Cartographiez des faits objectifs dans OpenStreetMap.'
  howto1_body_pre: 'Points d''eau, stations de réparation, revêtements — ajoutez-les à'
  howto1_body_post: ' maintenant. Nous nous appuyons sur OSM et contribuons en retour, donc tout rejoint le Commons. Rien à faire ici.'
  howto2_b: 'Façonnez le prototype.'
  howto2_body_pre: 'Naviguez dans'
  howto2_themap: 'la carte'
  howto2_mid1: ', '
  howto2_addclimb: 'ajoutez un col'
  howto2_mid2: ', ou un tour de vote, puis'
  howto2_email: 'écrivez-nous'
  howto2_mid3: ' — ou'
  howto2_issue: 'ouvrez un ticket'
  howto2_post: '— là où ça ne correspond pas à la façon dont vous entreriez vraiment vos données. Pour l''instant, le retour <i>est</i> la contribution.'
  howto3_b: 'Envoyez votre connaissance locale.'
  howto3_link: 'Contribuez un lieu sur GitHub'
  howto3_post: ' — un col, un danger, une belle sortie — et nous le curerons à mesure que le Commons se remplit.'
  howto4_b: 'Soyez parmi les premiers.'
  howto4_link: 'Laissez votre email'
  howto4_post: ' et nous vous dirons dès que la contribution ouverte sera en ligne.'
  skills_kicker: 'Prêtez vos compétences'
  skills_h2: 'Aidez à construire et pérenniser le projet.'
  role1_rk: '01 · CONSTRUIRE'
  role1_h: 'Développeurs'
  role1_p: 'La vraie plateforme : le backend &amp; API (Symfony 7 LTS), le frontend MapLibre, et le pipeline géospatial (PostGIS, routage, altitude, import OSM).'
  role1_link: 'Commencer sur GitHub →'
  role2_rk: '02 · DÉVELOPPER'
  role2_h: 'Réseaux sociaux &amp; communauté'
  role2_p: 'Racontez l''histoire, développez la base de cyclistes, accueillez les nouveaux venus et maintenez la communauté saine à mesure qu''elle grandit.'
  role2_link: 'Prendre contact →'
  role3_rk: '03 · PÉRENNISER'
  role3_h: 'Leveurs de fonds &amp; rédacteurs de subventions'
  role3_p: 'Subventions de données ouvertes et de mobilité durable, financement européen pour le cyclisme — le carburant qui maintient le Commons gratuit et indépendant.'
  role3_link: 'Prendre contact →'
  role4_rk: '04 · PROTÉGER'
  role4_h: 'Juridique &amp; gouvernance'
  role4_p: 'La mise en place de la <i>Stichting</i> (fondation) néerlandaise, les licences ODbL / CC, les conditions de contribution et le RGPD — la structure qui le maintient ouvert pour de bon.'
  role4_link: 'Prendre contact →'
  also_welcome: '<b>Également bienvenus :</b> traducteurs, designers, cartographes OpenStreetMap, photographes et bâtisseurs de partenariats (clubs cyclistes, offices de tourisme, hébergements bike-friendly). Vous ne voyez pas votre rôle ?'
  also_tell: 'Dites-nous ce que vous apporteriez.'
  start_kicker: 'Commencez maintenant'
  start_h2: 'Un bien commun grandit quand les gens se montrent.'
  start_lead: 'Du code, une connaissance locale ou quelques heures d''expertise — tout cela fait avancer la carte. La porte est ouverte.'
  start_cta_code: 'Contribuer du code →'
  start_cta_email: 'Écrire à l''équipe'
