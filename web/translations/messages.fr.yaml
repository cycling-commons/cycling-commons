home:
  eyebrow: 'DONNÉES CYCLISTES OUVERTES · UN APERÇU DE CE QUI POURRAIT ÊTRE'
  h1: 'Chaque route.<br/>Chaque sentier.<br/>Un <em>atlas ouvert</em><span class="endp">.</span>'
  lede: 'Une carte communautaire des meilleurs parcours du monde — cols, eau, panoramas, hébergements bike-friendly — libre à utiliser, améliorer et construire dessus, pour tous.'
  cta_map: 'Explorer la carte'
