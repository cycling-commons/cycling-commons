roles:
  kicker: 'Participer'
  title: 'Contributeurs et curateurs'
  lead: 'Deux façons de garder la carte juste. La première est ouverte à tous. La seconde est pour un lieu que vous connaissez.'
  contributor_h: 'Un contributeur'
  contributor_who: 'Tout cycliste avec un compte.'
  contributor_l1: 'Ajoute un lieu, une montée ou un itinéraire.'
  contributor_l2: 'Corrige ce qui est faux ou disparu.'
  contributor_l3: 'Confirme qu''un lieu est toujours là.'
  contributor_note: 'Un curateur vérifie votre modification avant qu''elle n''aille sur la carte.'
  contributor_cta: 'Ajouter ou corriger quelque chose sur la carte'
  curator_h: 'Un curateur'
  curator_who: 'Un cycliste que nous avons accepté pour une région ou un pays entier. La personne qui fait vivre cet endroit.'
  curator_can: 'Tout cela, autant ou aussi peu que vous voulez. Rien n''est une obligation.'
  curator_l1: 'Trouver des données ouvertes à importer : points d''eau, stations de réparation, itinéraires, montées.'
  curator_l2: 'Combler les trous que seul quelqu''un qui connaît le terrain peut voir.'
  curator_l3: 'Faire connaître les Commons sur place : clubs, boutiques, offices de tourisme, cyclistes du coin.'
  curator_l4: 'Accueillir les nouveaux contributeurs et répondre à leurs questions.'
  curator_l5: 'Vérifier les modifications envoyées par les cyclistes, et les confirmer, corriger ou refuser avec un mot en retour.'
  curator_l6: 'Ajouter directement de nouveaux éléments et corriger ce qui existe, sans attendre de vérification.'
  curator_note: 'Vous postulez depuis la page des régions, pour une région ou un pays entier.'
  curator_cta: 'Choisir un lieu à curer'
  example_h: 'Comment ça marche'
  example_p: 'Julien ajoute un point d''eau à Annecy. Camille est curatrice d''Auvergne-Rhône-Alpes. Elle le voit dans sa file, le vérifie et le confirme. Il est maintenant sur la carte, confirmé par la communauté.'
  one_account: 'Un seul compte, les deux rôles : chaque curateur est aussi contributeur.'
  progress_h: 'Ce que tout cela donne'
  progress_lead: 'Le Commons est incubé chez BikeCoders, avec la promesse publique de devenir une fondation indépendante. Deux compteurs balisent le chemin, lus en direct de cette base de données.'
  progress_contrib_l: 'contributeurs externes'
  progress_contrib_def: 'Comptes uniques ayant une contribution validée au projet — code, traduction, curation ou textes — comptes de l’équipe exclus.'
  progress_points_l: 'données validées par des cyclistes'
  progress_points_def: 'Lieux ajoutés ou confirmés par des cyclistes, chaque compte comptant une fois par lieu ; ajouter et confirmer ont le même poids.'
  progress_gov_link: 'L’engagement complet : gouvernance'
a11y:
  kicker: 'Accessibilité'
  title: 'Ce qui marche, et ce qui ne marche pas encore.'
  lead: 'Un compte rendu honnête de l''utilisabilité de ce site, y compris ce qui n''est pas assez bon. Si quelque chose vous bloque, dites-le-nous et nous le corrigerons.'
  last_updated: 'Dernière mise à jour le 27 août 2026'
  report_pre: 'Quelque chose vous bloque ici ?'
  report_link: 'Signalez un obstacle'
  report_post: '. Pas besoin de compte. Nous répondons sous un mois, et plus tôt quand nous le pouvons.'
  h_aim: 'Ce que nous visons'
  aim_body: 'Nous tenons ce site aux <b>WCAG 2.2, niveau AA</b>. C''est un objectif vers lequel nous travaillons, pas un certificat que nous détenons : certaines parties le respectent aujourd''hui et d''autres non, et les deux listes ci-dessous disent lesquelles.'
  h_works: 'Ce qui marche aujourd''hui'
  works_intro: 'Chacun de ces points a été mesuré, pas supposé.'
  works_keyboard: '<b>Clavier.</b> Toute page hors de la carte s''utilise sans souris, et le contour de focus n''est jamais supprimé.'
  works_skip: '<b>Aller au contenu.</b> La première chose qu''un clavier atteint sur chaque page, et elle enjambe les bandeaux d''annonce au lieu d''y atterrir.'
  works_contrast: '<b>Contraste.</b> Le texte a été mesuré sur son propre fond dans tout le site et l''habillage de la carte, en thème clair comme sombre, et les échecs ont été corrigés.'
  works_targets: '<b>Cibles tactiles.</b> Chaque contrôle que nous dessinons dépasse le minimum de 24px, vérifié sur un téléphone plutôt que dans une fenêtre rétrécie.'
  works_zoom: '<b>Zoom.</b> Le texte peut être agrandi à 200% sans que rien soit coupé ni exiger de défilement latéral.'
  works_motion: '<b>Aucun mouvement non demandé.</b> Rien ne démarre tout seul, rien ne clignote, et il n''y a pas de carrousel.'
  h_gaps: 'Ce qui ne marche pas encore'
  gaps_intro: 'Ce sont de vrais problèmes et nous ne les cachons pas.'
  gap_map: '<b>La carte n''est pas utilisable au lecteur d''écran.</b> C''est un dessin sur un canvas, et déplacer et zoomer une image n''a aucun sens sans la vue. C''est le plus gros manque du site et nous n''avons pas de correctif rapide. Voir ci-dessous quoi utiliser à la place.'
  gap_vendor: '<b>Certains contrôles de la carte ne sont pas les nôtres.</b> Les boutons de zoom et le bouton d''attribution viennent de la bibliothèque cartographique. Ils atteignent le minimum mais sont plus petits que ce que nous dessinerions, et nous ne pouvons pas les restyler sans la forker.'
  gap_audit: '<b>Personne d''extérieur n''a audité cela.</b> Tout ce qui précède a été mesuré par ceux qui ont construit le site, ce qui n''est pas la même chose qu''un test par quelqu''un qui utilise un lecteur d''écran tous les jours.'
  gap_translations: '<b>Les traductions sont en retard sur l''anglais.</b> Les nouveaux textes paraissent d''abord en anglais, une page dans une autre langue peut donc afficher brièvement un mélange.'
  h_instead: 'Quoi utiliser à la place de la carte'
  instead_pre: 'Tout ce que la carte dessine existe aussi en texte ou en données. Les'
  instead_regions: 'pages de région'
  instead_mid: ' listent ce qui a été trouvé à chaque endroit, en titres et listes ordinaires. L'''
  instead_api: 'API ouverte'
  instead_post: ' fournit les mêmes données à l''outil de votre choix. Ni l''un ni l''autre n''est un remplacement complet, et nous le savons.'
  h_legal: 'Notre position juridique'
  legal_body: 'Nous ne revendiquons pas la conformité à l''<b>European Accessibility Act</b>, car il n''est pas clair qu''il s''applique à nous. La loi vise des services de consommation précis, une carte ouverte et gratuite n''en est pas manifestement un, et les micro-entreprises fournissant des services sont de toute façon exemptées. Nous préférons le dire franchement plutôt que de laisser croire à une obligation que nous n''avons peut-être pas. Nous nous tenons aux WCAG parce que c''est juste, pas parce qu''on nous y oblige.'
  h_how: 'Comment cela a été vérifié'
  how_body: 'À la main, dans un vrai navigateur, sur un vrai téléphone : parcours au clavier, contraste mesuré sur le fond réellement affiché, et cibles tactiles mesurées en place plutôt que devinées depuis la feuille de style. Une partie est verrouillée par des tests automatisés pour éviter toute régression silencieuse. Aucune surcouche d''accessibilité n''a été utilisée, et il n''y en aura jamais : elles dégradent le site pour les personnes qu''elles prétendent aider.'
  footer_pre: 'Cette page n''a de valeur que si elle change. Si vous rencontrez quelque chose qui n''y figure pas,'
  footer_link: 'dites-le-nous'
  footer_post: ' et cela ira sur la liste.'

