developers:
  demo_label: 'Démo'
  demo_body: '— un aperçu de l''API ouverte &amp; des exports en masse. Lancement en 2026.'
  kicker: 'Construisez sur le Commons'
  title: 'Une API ouverte. Gratuite. Pour que tous construisent dessus.'
  lead: 'Interrogez le Commons par type et zone, ou récupérez des exports complets par pays. Ouvert par défaut — c''est ce qui en fait un bien commun. Les lectures sont ouvertes et anonymes, dans les limites d''un usage équitable ; les écritures nécessitent un token de compte gratuit. Nous limitons le débit et surveillons les abus pour que ça reste rapide et gratuit pour tous.'
  ep_kicker: 'Points de terminaison'
  ep1_path: '/v1/features'
  ep1_desc: 'filtrer par <code>type</code>, <code>bbox</code>, <code>region</code>'
  ep2_path: '/v1/regions/{id}/best'
  ep2_desc: 'le meilleur curé d''une région'
  ep3_path: '/v1/export/{country}.geojson'
  ep3_desc: 'export ODbL en masse'
  ep4_path: '/v1/features'
  ep4_desc: 'contribuer (token + soumis à révision)'
  ex_kicker: 'Exemple de requête'
  resp_kicker: 'Réponse'
  attr_kicker: 'Attribution obligatoire'
  rules_kicker: 'Les règles'
  rules_body: '<b>Limites de débit &amp; usage équitable.</b> Les lectures anonymes sont <b>limitées en débit</b> — un bien commun n''est pas un CDN et nous n''avons pas des serveurs infinis. Une clé API gratuite augmente votre limite ; pour un usage intensif ou répété, utilisez les <b>exports en masse par pays</b> plutôt que de solliciter l''API en direct. Les écritures nécessitent un token de compte gratuit et passent par une révision. Licences : données <b>ODbL 1.0</b>, médias <b>CC BY-SA 4.0</b> — voir le résumé en langage clair. Attribuez, partagez à l''identique, maintenez ouvert ; l''usage commercial est autorisé.'
