  playbook_email:
    title: 'Guide : demandes de changement d’e-mail'
    why: 'L’e-mail est en lecture seule dans les réglages ; chaque demande de changement arrive donc dans la boîte support. Vérifiez le contrôle des ancres existantes du compte avant toute action — le message de demande ne prouve rien en soi.'
    s1_t: 'Ne jamais se fier au message de demande'
    s1_b: 'Les en-têtes « From » sont falsifiables, et « j’écris depuis ma nouvelle adresse car j’ai perdu l’ancienne » est l’ouverture classique d’un détournement. Pseudo, contributions et date d’inscription sont publics — les connaître ne prouve rien.'
    s2_t: 'Ancre 1 — l’ancienne boîte mail'
    s2_b: 'Répondez à l’adresse au dossier (saisie depuis cet admin, jamais via « répondre ») avec un code à usage unique et exigez-le en retour. Si la personne peut y recevoir, le changement est à faible risque.'
    s3_t: 'Ancre 2 — une session connectée'
    s3_b: 'Ancienne boîte déclarée perdue ? Dictez une action dans le compte (« réglez votre rayon à 120 km », « collez ce code dans votre pseudo pendant une heure ») et vérifiez qu’elle a eu lieu. Cela prouve le mot de passe — et le facteur 2FA sur les comptes inscrits.'
    s4_t: 'Plus aucune ancre = refuser'
    s4_b: 'Impossible de recevoir à l’ancienne adresse ET impossible de se connecter : aucun moyen honnête de distinguer propriétaire et attaquant. La réponse sûre est « créez un nouveau compte ». Refuser ici est la raison d’être du processus manuel, pas un échec du support.'
    s5_t: 'Après vérification, rester prudent'
    s5_b: 'Prévenez l’ancienne adresse avec un délai de contestation « ce n’était pas moi », différez l’exécution de 48–72 h et consignez le changement avec une note d’audit sur la fiche utilisateur.'
    rule: 'L’urgence est un signal d’alerte, jamais une raison de sauter une étape — le vrai propriétaire survit à un délai de 48 h ; la fenêtre de l’attaquant rarement.'
    spec: 'Version canonique : docs/specs/account-and-auth.md §8 « Support playbook » — garder les deux synchronisés.'
  settings:
    title: 'Configuration du système'
    intro: 'Les nombres éditoriaux qui régissent le site. Un changement prend effet dès la requête suivante — sans déploiement ni redémarrage. Chaque modification est consignée dans le journal d’activité avec son ancienne et sa nouvelle valeur.'
    infra_note: 'Les valeurs d’infrastructure (tuiles de couverture, URL du manifeste, hôte Content-Security-Policy de la carte) n’y figurent délibérément pas : elles sont définies dans l’environnement et les modifier exige un déploiement.'
    save: 'Enregistrer les réglages'
    reset: 'Réinitialiser'
    overridden: 'Modifié ici'
    default_note: 'Par défaut : %value%'
    range_note: 'Autorisé : %min%–%max%'
    error_range: 'Saisissez un nombre entier entre %min% et %max%.'
    group:
      map: 'Carte'
      routes: 'Itinéraires'
      moderation: 'Modération'
    field:
      map_curated_default_threshold:
        label: 'Éligibilité au mode Sélection : total d’éléments'
        help: 'Nombre total d’éléments sélectionnés qu’une région doit atteindre avant qu’un curateur puisse l’ouvrir en mode Sélection par défaut. Abaissez-le pour débloquer plus tôt les jeunes régions, augmentez-le pour maintenir le niveau d’exigence.'
      map_curated_default_min_blocks:
        label: 'Éligibilité au mode Sélection : types d’éléments'
        help: 'Nombre de blocs différents (revêtement, cols, hébergements, panoramas, patrimoine, meilleurs itinéraires) devant chacun atteindre leur propre minimum. Réglez sur 1 pour revenir à un simple total.'
      map_curated_default_min_per_block:
        label: 'Éligibilité au mode Sélection : éléments par type'
        help: 'Ce qu’un bloc doit contenir pour compter dans l’exigence ci-dessus. Ensemble, ces deux nombres empêchent qu’une seule couche porte une région à elle seule.'
      route_region_active_cap:
        label: 'Itinéraires actifs par région'
        help: 'Nombre d’itinéraires qu’une région peut afficher simultanément. Un curateur qui approuve au-delà du plafond est bloqué et invité à en retirer un d’abord.'
      route_ride_verify_threshold:
        label: 'Sorties nécessaires pour vérifier un itinéraire'
        help: 'Nombre de cyclistes, autres que l’auteur de la proposition, devant déclarer avoir parcouru l’itinéraire pour qu’il se vérifie de lui-même. Abaissez-le dans les jeunes régions où les itinéraires resteraient sinon en attente.'
      moderation_retention_months:
        label: 'Conservation des éléments traités (mois)'
        help: 'Durée de conservation des corrections et contributions déjà traitées avant leur suppression par le nettoyage automatique. La décision de modération, elle, est conservée.'
