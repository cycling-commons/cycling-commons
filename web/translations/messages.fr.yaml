  tag_resupply_p: 'De l''eau, à manger, ou un arrêt réparation et pompe.'
  tag_closure: 'Fermeture'
  tag_closure_p: 'Route coupée ou déviation — et à peu près combien de temps vous pensez que ça va durer, ce qui permet à la carte de la retirer d''elle-même plus tard.'
  tag_surface: 'Revêtement'
  tag_surface_p: 'Marquez une portion avec un type de départ et un END, pour qu''elle soit enregistrée comme un segment et non comme un point. Aligné sur les valeurs de surface d''OpenStreetMap.'
