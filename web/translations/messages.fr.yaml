    media_hidden_pending_review: 'Quelqu''un a signalé une de vos photos et, vu ce qu''affirme le signalement, nous l''avons immédiatement masquée sur la carte le temps qu''un curateur l''examine. Masquée n''est pas supprimée : la photo reste la vôtre, elle est toujours stockée, rien n''a été effacé. Si le signalement ne tient pas, elle revient sous quelques jours et nous vous le dirons. Seul un curateur peut retirer une photo, jamais un signalement à lui seul. Et nous ne pouvons pas vous dire qui a signalé, tout comme cette personne n''a pas su qui avait téléversé.'
    media_restored_after_review: 'Quelqu''un a signalé une de vos photos et, vu ce qu''affirmait le signalement, nous l''avons immédiatement masquée sur la carte le temps qu''un curateur l''examine. Le signalement n''a pas tenu : elle est de retour sur la carte, exactement comme avant. Masquer d''abord est ce qui garantit qu''une plainte authentique ne reste jamais en ligne des jours, et cela implique qu''une photo est parfois retirée un temps pour rien. Nous ne pouvons pas vous dire qui a signalé, tout comme cette personne n''a pas su qui avait téléversé.'
    media_ready: 'Les vérifications de votre photo se sont terminées après que vous avez cessé d''attendre. Elle est maintenant sur la carte et passe devant un curateur comme toute autre contribution.'
    media_scan_rejected: 'Nous n''avons pas pu accepter cette photo. Nos vérifications ont trouvé quelque chose dans le fichier, ou n''ont pas pu le lire comme une image. Personne n''a regardé l''image : c''est un contrôle automatique du fichier lui-même. Essayez une autre photo, ou la même enregistrée à nouveau en JPEG.'
