roadmap:
  kicker: 'Hoja de ruta'
  title: 'Qué construimos a continuación.'
  lead: 'Sin fechas, porque solo estaríamos adivinando. Este es el orden del trabajo, llevado con honestidad: lo que se está construyendo, lo que está decidido y espera, y lo que queremos pero no hemos programado. Lo terminado sale de esta página y pasa al registro de cambios.'
  group_now: 'Ahora'
  group_now_sub: 'En construcción. Aquí hay alguien trabajando de verdad.'
  group_next: 'A continuación'
  group_next_sub: 'Decidido y esperando turno. Salvo sorpresa, esto es lo que sigue.'
  group_later: 'Más adelante'
  group_later_sub: 'Lo queremos, no está programado. Intenciones reales, ninguna promesa de cuándo.'
  item_copyright: '<b>Una vía para reclamaciones de derechos de autor.</b> Las fotos entran bajo CC BY-SA con la palabra de quien las sube de que la obra es suya. Cuando esa palabra falla, quien tiene los derechos necesita a dónde acudir, y no solo una dirección general.'
  item_report_flow: '<b>Poder avisar de cualquier contenido, no solo fotos.</b> La descripción de una ruta, un nombre visible, una nota de un puerto: un botón de aviso que llega a una persona curadora, con respuesta escrita y forma de recurrir.'
  item_email_updates: '<b>Avísame cuando salga algo.</b> Una suscripción en tu página de ajustes, para no tener que acordarte de mirar aquí.'
  item_photo_alt: '<b>Texto alternativo en las fotos aportadas.</b> Una foto sin él no existe para quien usa un lector de pantalla, y ahora el asistente no lo pide.'
  item_dormant_accounts: '<b>Cerrar cuentas sin uso.</b> Una cuenta en la que ya nadie entra se conserva para siempre. Debería ofrecértela primero y cerrarse después.'
  item_map_a11y: '<b>Hacer el mapa usable sin ratón.</b> El hueco que reconocemos en nuestra declaración de accesibilidad: acceso con teclado y lector de pantalla al mapa mismo, no solo a las páginas de alrededor.'
  item_route_export: '<b>Llevarte una ruta.</b> Exportar a tu dispositivo o a tu planificador, y un enlace permanente a una vista del mapa.'
  item_roadmap_votes: '<b>Opinar sobre esta lista.</b> Votar lo que te importa, seguir un punto y proponer el tuyo.'
  foot_shipped_pre: 'Lo que ya ha salido está en el'
  foot_shipped_link: 'registro de cambios'
  foot_shipped_mid: '. ¿Echas en falta algo que necesitas? Dínoslo en la'
  foot_contact_link: 'página de contacto'
  foot_shipped_post: ' y lo leerá una persona.'
changelog:
  kicker: 'Registro de cambios'
  title: 'Qué hay de nuevo.'
  lead: 'Cada versión, la más reciente primero, en palabras llanas. La versión que ves aquí es la misma que aparece al pie de cada página, así que siempre sabes qué estás mirando.'
  feed_title: 'Cycling Commons: qué hay de nuevo'
  feed_subtitle: 'Versiones de la plataforma Cycling Commons.'
  feed_pre: 'Sigue el proyecto sin cuenta: suscríbete al'
  feed_link: 'canal Atom'
  feed_mid: '. Lo que viene después está en la'
  feed_roadmap: 'hoja de ruta'
  feed_post: '.'
  v080_map: '<b>El mapa.</b> Lugares, puertos y rutas en diecinueve países, con capa de firme, imágenes por satélite y a pie de calle, y tema claro y oscuro.'
  v080_photos: '<b>Fotos.</b> Aporta una foto a cualquier lugar, con licencia CC BY-SA 4.0. Los datos de ubicación se retiran antes de publicarla, y cada foto tiene su propia página.'
  v080_routes: '<b>Rutas.</b> Propón una ruta desde un archivo GPX, vota las que has rodado y mira lo mejor de una región.'
  v080_contribute: '<b>Aportar.</b> Añade y corrige lugares desde el propio mapa, confirma que algo sigue ahí y sigue lo que decidió una persona curadora y por qué.'
  v080_accounts: '<b>Cuentas.</b> Perfil público opcional, inicio de sesión con doble factor, exportación completa de tus datos y borrado de cuenta que surte efecto al instante.'
  v080_languages: '<b>Cinco idiomas.</b> Inglés, francés, neerlandés, alemán y español, con una forma de proponer una traducción mejor.'
  v080_legal: '<b>El papeleo bien hecho.</b> Un aviso de privacidad que nombra a cada encargado, una declaración de accesibilidad que enumera lo que aún no funciona, y una vía de contacto que llega a una persona.'
