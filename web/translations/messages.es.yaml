home:
  eyebrow: 'DATOS CICLISTAS ABIERTOS'
  h1: 'Todo lo que saben los ciclistas.<br/>En un <em>atlas abierto</em><span class="endp">.</span>'
  lede: 'Un mapa construido por la comunidad con lo mejor que se puede rodar en el mundo — puertos, agua, vistas, alojamientos que acogen bien a los ciclistas — libre para que cualquiera lo use, construya sobre él y lo mejore.'
  cta_map: 'Explorar el mapa'
  cta_contribute: 'Aportar'
  tick_label: 'Lanzamiento'
  tick_year: '2026'
  corner_br: 'BAJA ↓'
  disc_label: 'PARA TODAS LAS FORMAS DE CICLISMO —'
  frag_kicker: 'UN SOLO SITIO, NO UNA DOCENA DE APLICACIONES'
  frag_h2: 'El conocimiento ciclista está disperso. El Commons lo reúne.'
  frag_lead1: 'Hoy cada capa vive en su propio silo — una aplicación para los puertos, otra para las rutas, otra para los alojamientos que acogen bien a los ciclistas, otra para el estado de la carretera — y casi todas son cerradas. Los ciclistas cosen una docena de herramientas y los datos nunca acaban de encajar. El Commons reúne el conocimiento no personal en un único lugar abierto, libre de consultar y de construir encima.'
  frag_lead2: 'Y donde ya existen buenos datos abiertos, no los reconstruimos: nos <b>aliamos</b>. Enlazamos e interoperamos con otras comunidades de datos abiertos (como las redes de hospitalidad abierta para dormir) en lugar de encerrar nuestra propia copia. Los datos abiertos deberían unirse, no fragmentarse más.'
  frag_panel_h: 'Hoy. Una docena de aplicaciones para tu salida.'
  frag_climbs: 'Puertos y cols'
  frag_climbs_tag: 'silo cerrado'
  frag_rides: 'Rutas recomendadas y valoraciones'
  frag_rides_tag: 'silo cerrado'
  frag_scenic: 'Paisaje, vistas y patrimonio'
  frag_scenic_tag: 'disperso'
  frag_stays: 'Alojamientos para ciclistas'
  frag_stays_tag: 'silo cerrado'
  frag_road: 'Firme y estado de la carretera'
  frag_road_tag: 'disperso'
  frag_water: 'Agua · comida · servicios'
  frag_water_tag: 'disperso'
  frag_vs: 'El Commons → un solo atlas abierto'
  what_kicker: 'EL PRINCIPIO'
  what_h2: 'Datos abiertos sobre el mundo — nunca sobre ti.'
  what_lead: 'El Commons guarda el mapa: puertos, agua, peligros, alojamientos — hechos sobre lugares, nunca sobre personas. Sin identidad, sin seguimiento, sin nada personal. Construido sobre OpenStreetMap, devuelto a OpenStreetMap, gobernado por su comunidad.'
  what_in_h: 'Los datos ciclistas del mundo'
  what_in_p: 'Puertos, puntos de agua, miradores, patrimonio, alojamientos para ciclistas, estado de la carretera — abiertos bajo ODbL.'
  what_out_h: 'Cualquier cosa personal'
  what_out_p: 'Tu identidad y tus datos privados — el Commons no los recoge nunca. Cartografía el mundo, no al ciclista.'
  what_free_h: 'Para cualquiera'
  what_free_p: 'Consúltalo, expórtalo, construye sobre él. Eso es lo que lo convierte en un bien común.'
  cur_kicker: 'CURADURÍA, NO SATURACIÓN'
  cur_h2: 'Lo mejor de una región, elegido por ciclistas.'
  cur_lead: 'Llega a un sitio nuevo y ve los puertos, las vistas y las rutas que merecen tu fin de semana — votados por los ciclistas que lo conocen y renovados cada temporada. Los datos de utilidad, como el agua, aspiran a cobertura total; el volcado completo espera en la reserva por si lo quieres todo.'
  cur_panel_pin: 'VALONIA · MEJORES PUERTOS · VERANO 2026'
  cur_panel_h: 'Lo mejor de esta región'
  cur_voted: '— VOTADO · NO VOLCADO —'
