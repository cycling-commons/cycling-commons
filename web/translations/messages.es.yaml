  cat_suggest_p: 'Esta lista no está cerrada — dinos qué capa práctica te haría salir a rodar.'
  cat_suggest_link: 'Proponer una capa →'
  cat_emotional_h: 'Emocional'
  cat_emotional_sub: 'experiencia — curada y votada por ciclistas'
  cat_card_climbs_h: 'Puertos'
