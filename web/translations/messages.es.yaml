developers:
  kicker: 'Construye sobre el Commons'
  title: 'Datos abiertos. Una API abierta.<br>Para que cualquiera construya.'
  lead: 'Consulta el Commons por zona y tipo, o alójalo tú desde la exportación periódica. Los datos son abiertos (ODbL), y eso es lo que lo hace un procomún. Sin clave, sin cuenta, sin coste: un límite de peticiones y uso razonable, nada más.'
  status: 'En diseño — estos endpoints son el contrato que estamos construyendo. Consulta la <a href="/developers/api">referencia interactiva de la API</a> o la <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">especificación en GitHub</a>.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/search'
  ep1_desc: 'encontrar cobertura por <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'un elemento, con nuestro enriquecimiento y procedencia <b>(previsto)</b>'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'polígono de región y estadísticas de cobertura <b>(previsto)</b>'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'lo mejor de una región <b>(previsto)</b>'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'detalle de ruta y descarga GPX <b>(previsto)</b>'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'teselas vectoriales y TileJSON, para tu propio estilo MapLibre <b>(previsto)</b>'
  ep7_path: '/v1/contributions'
  ep7_desc: 'contribuir <b>(previsto)</b>, entra en la misma cola de revisión que las contribuciones desde la aplicación'
  ex_kicker: 'Ejemplo de petición'
  resp_kicker: 'Respuesta'
  ex_hydrate: 'Por defecto, las respuestas son solo de referencia: nuestros campos añadidos más el <code>osm_ref</code> con el que hidratar contra OSM. <code>?hydrate=osm</code> fusiona por ti nuestro subconjunto de OSM en caché.'
  attr_kicker: 'Atribución obligatoria'
  rules_kicker: 'Las reglas'
  rules_body: '<b>Uso razonable.</b> La lectura está abierta a cualquiera, sin clave ni cuenta, con <b>120 peticiones por minuto</b> por dirección. Es una ventana deslizante: un pico toma prestado del minuto siguiente en vez de bloquearte. Para uso masivo o sin conexión, coge la <b>exportación periódica</b> y alójala tú, en lugar de castigar la API en vivo; hacer scraping del servicio no está permitido. Licencias: datos <b>ODbL 1.0</b>, medios <b>CC BY-SA 4.0</b>. Atribuye, comparte igual, mantenlo abierto. El uso comercial está bien. Consulta el resumen en lenguaje claro:'
