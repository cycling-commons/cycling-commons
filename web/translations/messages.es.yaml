export:
  readme: |
    TUS DATOS DE CYCLING COMMONS
    ============================

    Generado el %generated% para la cuenta «%account%».

    Este archivo responde a dos derechos del RGPD a la vez: el derecho de
    acceso (art. 15) y el derecho a la portabilidad de los datos (art. 20).
    La portabilidad cubre solo lo que nos diste tú y el acceso cubre más que
    eso, así que en lugar de obligarte a elegir entre dos descargas, esto es
    la suma de ambas.

    QUÉ HAY AQUÍ DENTRO

      account.json        Tu cuenta: correo, nombre público, idioma, país,
                          ubicación base, preferencias y marcas de tiempo.
      contributions.json  Los envíos que hiciste y los cambios campo a campo
                          que produjeron en el mapa cuando un curador los
                          aceptó.
      community.json      Confirmaciones, votos de rutas, salidas, sugerencias
                          de corrección, peticiones de país y solicitudes de
                          curaduría.
      messages.json       Tus mensajes del panel, en ambos sentidos.
      consent.json        Cada licencia de foto que concediste: con qué texto,
                          con qué versión y cuándo.
      photos/index.json   Una entrada por cada foto que subiste, con su estado
                          y el archivo al que corresponde.
      photos/*.webp       Las fotos en sí.

    QUÉ NO HAY AQUÍ, Y POR QUÉ

      Tu contraseña, tu secreto de doble factor y tus códigos de respaldo.
      Son las credenciales que protegen esta cuenta. Una exportación es un
      archivo que la gente reenvía y guarda, y entregar las llaves junto con
      el contenido te dejaría menos protegido, no mejor informado.

      La identidad de los curadores que trataron tu trabajo. Lo que se decidió
      sobre tus envíos son datos tuyos y está todo aquí, con las notas
      incluidas. Quién tomó la decisión es dato suyo.

    SOBRE LAS FOTOS

      Estas son nuestras copias procesadas, no los archivos que subiste.
      Recodificamos cada foto al llegar y le quitamos los metadatos, incluida
      cualquier ubicación que registrara la cámara, así que el archivo tal y
      como lo enviaste no es algo que conservemos. Una entrada del índice con
      "file": null es una foto cuyos objetos almacenados ya se han borrado; el
      registro de que existió sobrevive.

      Las fotos que aprobó un curador están licenciadas bajo CC BY-SA 4.0 y se
      quedan como parte del Commons. Esa licencia no se puede retirar. Tu
      nombre, en cambio, no está dentro de los archivos: la atribución se
      resuelve en vivo desde tu perfil, así que hacer privado tu perfil, o
      cerrar tu cuenta, cambia a quién acredita cada copia de tu foto, también
      las copias descargadas hace mucho.

    PREGUNTAS

      info@cyclingcommons.org
scout:
  kicker: 'Scout · el CC Tagger'
  title: 'Marca lo que ves, mientras ruedas.'
  lead: 'Scout es un registrador de campo de un solo toque para tu ciclocomputador. Marca un peligro, un corte, un cambio de firme o una fuente justo cuando pasas por delante — sin parar, sin móvil, sin escribir. Cada marca se escribe directamente en el archivo de tu ruta, en un formato abierto y documentado.'
  plat_garmin: 'Garmin Edge'
  plat_android: 'Android'
  plat_karoo: 'Hammerhead Karoo'
  plat_available: 'Ya disponible'
  plat_soon: 'Muy pronto'
  plat_planned: 'Previsto'
  shot_garmin_alt: 'El menú de marcas de Scout en un Garmin Edge, con los seis tipos y un contador de adelantamientos'
  logo_alt: 'El logotipo de Scout'
  shot_garmin_cap: 'En el manillar'
  shot_android_alt: 'Scout en un teléfono Android, con el botón de marcar y las marcas de esta ruta'
  shot_android_cap: 'En el bolsillo'
  what_h: 'Qué hace'
  what_p1: 'Eres la única persona que sabe que la carretera está cortada, que la grava empieza aquí o que la fuente de la plaza funciona. Normalmente ese conocimiento se evapora antes de que llegues a casa. Scout lo captura en el momento en que pasas: un toque, y queda registrado con tu posición y la hora.'
  what_p2: 'Scout <b>funciona por su cuenta</b>. La aplicación y su formato sirven con o sin Cycling Commons — tus marcas son tuyas, en tu propio archivo, legibles por cualquier cosa que sepa leerlo.'
  step1_no: '01'
  step1_h: 'Toca mientras ruedas'
  step1_p: 'Una marca es un toque. Elige un tipo en el submenú si quieres concretar, o déjalo y ya lo resolverás luego.'
  step2_no: '02'
  step2_h: 'Aterriza en tu archivo'
  step2_p: 'Cada marca se escribe en la actividad que tu ciclocomputador ya estaba grabando, en formato abierto — nada aparte que sincronizar ni que perder.'
  step3_no: '03'
  step3_h: 'Ordénalo al volver'
  step3_p: 'En casa corriges un toque mal dado, mueves una marca al punto correcto de la carretera y, si quieres, la envías al Commons, donde pasa la misma revisión que cualquier otra aportación.'
  tags_h: 'Qué puedes marcar'
  tags_lead: 'Seis tipos de marca, más una automática si ruedas con radar.'
  tags_col_tag: 'Marca'
  tags_col_what: 'Para qué sirve'
  tag_resupply: 'Avituallamiento'
  tag_resupply_p: 'Agua, comida, o una parada de reparación y bombín.'
  tag_closure: 'Corte'
  tag_closure_p: 'Carretera cortada o desvío — y más o menos cuánto crees que durará, que es lo que permite al mapa retirarlo por sí solo más adelante.'
  tag_surface: 'Firme'
  tag_surface_p: 'Marca un tramo con un tipo de inicio y un END, para que quede registrado como segmento y no como punto. Alineado con los valores de surface de OpenStreetMap.'
  tag_notice: 'Aviso'
  tag_notice_p: 'Una curva fea, un cruce, baches, o cualquier cosa que dé mala espina.'
  tag_scenery: 'Paisaje'
  tag_scenery_p: 'Una vista que merece recordarse.'
  tag_other: 'Otro'
  tag_other_p: 'Todo lo demás. Un toque, sin submenú — ya decidirás qué era al llegar a casa.'
  tag_radar: 'Adelantamientos'
  tag_radar_p: 'Con un radar compatible con Varia emparejado, Scout cuenta automáticamente los vehículos que te adelantan. Es lo más parecido que hay a una medida objetiva del tráfico real de una carretera.'
