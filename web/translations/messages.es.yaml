a11y:
  kicker: 'Accesibilidad'
  title: 'Qué funciona, y qué todavía no.'
  lead: 'Un relato honesto de lo usable que es este sitio, incluidas las partes que no son lo bastante buenas. Si algo le bloquea, díganoslo y lo arreglamos.'
  last_updated: 'Última actualización 27 de agosto de 2026'
  report_pre: '¿Algo aquí le estorba?'
  report_link: 'Informe de una barrera'
  report_post: '. No hace falta cuenta. Respondemos en un mes, y antes cuando podemos.'
  h_aim: 'Qué buscamos'
  aim_body: 'Medimos este sitio con <b>WCAG 2.2, nivel AA</b>. Es un objetivo hacia el que trabajamos, no un certificado que tengamos: hoy algunas partes lo cumplen y otras no, y las dos listas de abajo dicen cuáles.'
  h_works: 'Qué funciona hoy'
  works_intro: 'Cada uno de estos se ha medido, no supuesto.'
  works_keyboard: '<b>Teclado.</b> Toda página fuera del mapa se puede usar sin ratón, y el contorno de foco nunca se quita.'
  works_skip: '<b>Saltar al contenido.</b> Lo primero que alcanza un teclado en cada página, y salta por encima de las barras de aviso en vez de caer en ellas.'
  works_contrast: '<b>Contraste.</b> El texto se midió contra su propio fondo en todo el sitio y en el marco del mapa, en tema claro y oscuro, y se corrigieron los fallos.'
  works_targets: '<b>Objetivos táctiles.</b> Cada control que dibujamos supera el mínimo de 24px, comprobado en un teléfono y no en una ventana estrechada.'
  works_zoom: '<b>Zoom.</b> El texto se puede ampliar al 200% sin que nada se corte ni haga falta desplazamiento lateral.'
  works_motion: '<b>Ningún movimiento que no haya pedido.</b> Nada se reproduce solo, nada parpadea, y no hay carrusel.'
  h_gaps: 'Qué todavía no funciona'
  gaps_intro: 'Estos son reales y no los ocultamos.'
  gap_map: '<b>El mapa no se puede usar con lector de pantalla.</b> Es un dibujo sobre un lienzo, y desplazar y ampliar una imagen no significa nada sin vista. Es la mayor carencia del sitio y no tenemos un arreglo rápido. Abajo se indica qué usar en su lugar.'
  gap_vendor: '<b>Algunos controles del mapa no son nuestros.</b> Los botones de zoom y el conmutador de atribución vienen de la biblioteca de mapas. Superan el mínimo pero son más pequeños de lo que los dibujaríamos, y no podemos rediseñarlos sin bifurcarla.'
  gap_audit: '<b>Nadie de fuera lo ha auditado.</b> Todo lo anterior lo midieron quienes construyeron el sitio, que no es lo mismo que ser probado por alguien que usa un lector de pantalla a diario.'
  gap_translations: '<b>Las traducciones van por detrás del inglés.</b> Los textos nuevos aparecen primero en inglés, así que una página en otro idioma puede mostrar brevemente una mezcla.'
  h_instead: 'Qué usar en lugar del mapa'
  instead_pre: 'Todo lo que dibuja el mapa existe también como texto o como datos. Las'
  instead_regions: 'páginas de región'
  instead_mid: ' enumeran lo encontrado en cada lugar, como encabezados y listas normales. La'
  instead_api: 'API abierta'
  instead_post: ' sirve los mismos datos a la herramienta que prefiera. Ninguna es un sustituto completo, y lo sabemos.'
  h_legal: 'Nuestra posición legal'
  legal_body: 'No afirmamos cumplir la <b>European Accessibility Act</b>, porque no está claro que se nos aplique. La ley nombra servicios de consumo concretos, un mapa abierto y gratuito no es obviamente uno de ellos, y las microempresas que prestan servicios están exentas en cualquier caso. Preferimos decirlo con claridad antes que insinuar un deber que quizá no tengamos. Nos atenemos a WCAG porque es lo correcto, no porque nos obliguen.'
  h_how: 'Cómo se ha comprobado'
  how_body: 'A mano, en un navegador real, en un teléfono real: recorridos con teclado, contraste medido sobre el fondo realmente representado, y objetivos táctiles medidos en su sitio en vez de deducidos de la hoja de estilos. Parte de ello está fijado con pruebas automáticas para que no retroceda en silencio. No se ha usado ninguna capa de accesibilidad, y nunca se usará: empeoran el sitio para las mismas personas a las que dicen ayudar.'
  footer_pre: 'Esta página solo vale algo si cambia. Si encuentra algo que no aparece,'
  footer_link: 'díganoslo'
  footer_post: ' y pasará a la lista.'

