admin:
  escalated:
    title: 'Fotos bajo retención legal'
    warning_b: 'Trátalo con cuidado.'
    warning: 'Estas fotos se escalaron como presunto contenido ilegal. Están ocultas para el público y para el escritorio de moderación, y nada dentro de la aplicación puede borrarlas. No borres el material: cuando sea del tipo que hay que denunciar, el registro tiene que sobrevivir hasta que se haya denunciado, y es la autoridad ante la que denuncias quien decide cuándo puede desaparecer.'
    lead: 'Un curador vio algo que no estaba dispuesto a decidir en solitario. Lee lo que escribió antes de decidir si mirar la imagen en sí.'
    playbook_link: 'Abrir el protocolo de incidentes'
    empty: 'Ahora mismo no hay nada retenido.'
    no_item: 'No está asociada a ningún lugar'
    by: 'Escalada por %who% el %when%'
    their_words: 'Lo que escribió el curador:'
    reveal: 'Mostrar la foto'
    note_label: 'Nota para el registro (opcional)'
    note_placeholder: 'p. ej. denunciado a las autoridades el …, referencia …'
    release: 'Levantar la retención'
    release_help: 'Levanta la retención y devuelve la foto a la moderación normal. No la vuelve a poner en el mapa y no borra nada.'
    released: 'La retención se ha levantado.'
  flood:
    title: 'Protocolo: avalancha de informes sobre fotos'
    state_open_b: 'El interruptor de ocultación automática está ABIERTO ahora mismo.'
    state_open: 'Los informes anónimos ya no ocultan fotos por su cuenta. Sigue los pasos de abajo.'
    state_closed: 'El interruptor de ocultación automática está cerrado. Funcionamiento normal.'
    lead: 'La vía de informes sobre fotos permite que cualquiera diga que sale en una foto, sin cuenta, porque la ley no hace depender ese derecho de tenerla. Esa apertura es también su debilidad: un atacante distribuido puede presentar informes desde miles de direcciones a la vez. Esta página es qué hacer cuando eso ocurre.'
    h_what: 'Qué ha pasado ya de forma automática'
    what: 'Un presupuesto para todo el sitio limita cuántas fotos pueden ocultar por su cuenta los informes anónimos: %hourly% por hora y %daily% por día. Pasado ese límite, los informes urgentes siguen llegando y siguen haciendo cola para un curador, pero no ocultan nada, el escritorio de moderación muestra un aviso y se envía un correo a la dirección de alertas una vez por hora. No se ha borrado ni retirado nada — las fotos ocultas siguen almacenadas, se ha avisado a quienes las aportaron de que están ocultas, y solo retira algo un curador que conceda una solicitud.'
    h_steps: 'Pasos'
    step_verify: 'Mira los informes en cola antes de tocar nada. Una emergencia real y un ataque tienen aspecto distinto: los informes auténticos son pocos, concretos sobre una persona y repartidos en el tiempo.'
    step_restore: 'Restaura de una sola vez lo que sea abuso evidente — a quienes aportaron las fotos se les avisa de que han vuelto. Esa página descarta los informes en lugar de rechazarlos, así que una reclamación auténtica posterior sobre la misma foto se sigue escuchando.'
    step_zero: 'Si continúa, pon el presupuesto horario a 0. Entonces los informes anónimos nunca ocultan una foto por su cuenta; todo espera a un curador. Esta es la parada de emergencia y no necesita despliegue.'
    step_desk: 'Avisa a los curadores de guardia de que el escritorio se llenará de ruido y de que no deben rechazarlo en bloque — rechazar es un juicio y cierra esa categoría para esa foto para siempre.'
    step_after: 'Cuando termine, devuelve los presupuestos a su sitio y anota cómo era el ritmo real. Los números correctos son los que enseña un incidente de verdad.'
    h_dont: 'No hagas esto'
    dont_decline: 'No rechaces en masa desde el escritorio de moderación. Usa la página de restauración: un rechazo inmuniza la foto de forma permanente contra el siguiente informe auténtico del mismo tipo.'
    dont_raise: 'No subas los presupuestos para que desaparezca el aviso. El presupuesto es justo lo que acota el daño.'
    dont_disclose: 'No cuentes nada a quien informa ni a quien subió la foto sobre la otra parte, y no publiques los umbrales, el criterio exacto de decisión ni qué categoría de informe actúa más rápido. Todo lo que un curador sabe sobre cómo conseguir que se retire una foto es también un guion para la ingeniería social.'
    dont_ignore: 'No des por hecho que es un ataque. Compruébalo primero; la palanca existe para algo real.'
    h_real: 'Si es real'
    real: 'Si los informes son auténticos — una campaña real de imágenes ilegales en el mapa — el interruptor no es tu enemigo: los informes siguen llegando y no se pierde nada. Oculta tú mismo desde el escritorio de moderación lo que haya que ocultar, conserva los registros e implica de inmediato al responsable del sitio. Nunca borres pruebas de material ilegal antes de haberlo denunciado a las autoridades.'
    h_escalated: 'Si un curador escala algo como ilegal'
    escalated_intro: 'Las fotos escaladas ya están ocultas para el público y para el escritorio de moderación, y nada en la aplicación puede borrarlas. Están aquí'
    esc_step_read: 'Lee primero las palabras del curador y decide si necesitas mirar la imagen siquiera. Muchas veces no hace falta.'
    esc_step_report: 'Denúncialo donde corresponde. El material que implique una amenaza para la vida o la seguridad de alguien debe denunciarse sin demora a las fuerzas del orden (art. 18 del DSA). Para material de abuso sexual infantil, usa la línea de denuncia (Offlimits / Meldpunt Kinderporno) y/o la policía. El contenido terrorista lleva un deber de conservación de seis meses.'
    esc_step_preserve: 'No borres nada, y no le pidas a nadie que lo haga. La retención existe para que el registro sobreviva hasta que se haya denunciado; la autoridad ante la que denuncias decide cuándo puede desaparecer.'
    esc_step_release: 'Levanta la retención solo si resulta que no era lo que parecía. Levantarla lo devuelve a la moderación normal — no lo vuelve a poner en el mapa.'
    esc_step_curator: 'Interésate por el curador que lo escaló. Lo vio para que nadie más tuviera que verlo, y eso merece un mensaje.'
  withheld:
    title: 'Fotos ocultadas por un informe'
    lead: 'Todas las fotos que un informe anónimo ha ocultado del mapa y que siguen esperando una decisión. Ocultas, no retiradas: no se ha borrado nada, y a quien las aportó se le ha dicho que están ocultas y por qué. Restaurarlas aquí las devuelve, avisa a quien las aportó y deja constancia de que el informe no era real — no cierra la categoría, así que un futuro informe auténtico sobre la misma foto se sigue escuchando.'
    empty: 'Ahora mismo no hay ninguna foto oculta por un informe de un tercero.'
