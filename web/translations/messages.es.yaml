  attribution_line5: 'Fotos © sus autores, vía Cycling Commons, bajo CC BY-SA 4.0.'
  attribution_line6: 'Traducciones de la interfaz © sus traductores, vía Cycling Commons, bajo CC BY-SA 4.0.'
