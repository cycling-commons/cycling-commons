  cat_card_surface_h: 'Firme'
  cat_card_surface_p: 'Asfalto, gravilla o adoquín — dibujado para que elijas la bici adecuada.'
  cat_card_water_h: 'Puntos de agua'
  cat_card_water_p: 'Fuentes, grifos, puntos de rellenado — más cafés y paradas de avituallamiento.'
  cat_card_services_h: 'Servicios ciclistas'
  cat_card_services_p: 'Tiendas, estaciones de reparación, carga de bicicletas eléctricas.'
  cat_card_hazards_h: 'Peligros'
