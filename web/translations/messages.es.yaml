    field:
      community_voting_live:
        label: 'La votación de temporada está activa'
        help: 'Ponlo a 1 cuando las rondas de votación estén abiertas. A 0, toda llamada a votar en el mapa queda oculta — un botón para una ronda que no existe parece roto.'
      map_curated_default_threshold:
        label: 'Preparación de Lo mejor: elementos totales'
        help: 'Cuántos elementos curados necesita una región en total antes de que un curador pueda abrirla en modo Curado por defecto. Bájalo para desbloquear antes las regiones jóvenes; súbelo para mantener el listón de calidad.'
      map_curated_default_min_blocks:
        label: 'Preparación de Lo mejor: tipos de cosas'
        help: 'Cuántos bloques distintos (firme, puertos, alojamientos, paisaje, historia, mejores rutas) deben alcanzar cada uno su propio mínimo. Ponlo a 1 para que la preparación vuelva a ser un simple total.'
      map_curated_default_min_per_block:
        label: 'Preparación de Lo mejor: elementos por tipo'
        help: 'Qué necesita un bloque para contar de cara al requisito de arriba. Juntos, estos dos impiden que una sola capa completa sostenga una región por sí sola.'
      map_confirmation_stale_months:
        label: "Las confirmaciones caducan a los (meses)"
        help: "Cuánto tiempo cuenta la comprobación de una fuente, tienda, aseo o peligro por parte de un ciclista. Pasado ese plazo el mapa rodea la chincheta con un anillo naranja, para que quien pase sepa que merece un vistazo. Una comprobación reinicia el contador. Los lugares que no cambian - puertos, miradores, patrimonio - nunca caducan."
      route_region_active_cap:
        label: 'Rutas activas por región'
        help: 'Cuántas rutas puede tener publicadas a la vez una región. A un curador que apruebe por encima del tope se le bloquea y se le pide que retire algo primero.'
      route_ride_verify_threshold:
        label: 'Salidas necesarias para verificar una ruta'
        help: 'Cuántos ciclistas distintos de quien la propuso deben marcar una ruta como rodada antes de que se verifique sola. Bájalo en regiones jóvenes donde, si no, las rutas nunca saldrían de la cola.'
      moderation_retention_months:
        label: 'Conservación de los elementos decididos (meses)'
        help: 'Cuánto tiempo se conservan las correcciones y los envíos ya decididos antes de que la limpieza los borre. La decisión de moderación en sí se conserva igualmente.'
      media_urgent_breaker_hourly:
        label: 'Presupuesto de ocultación automática: por hora'
        help: 'Cuántas fotos puede ocultar del mapa por su cuenta, en una hora, un informe anónimo de «imágenes íntimas o un menor». Ocultar no es retirar — solo un curador retira una foto. Pasado este presupuesto, los informes siguen llegando al escritorio de moderación pero dejan de ocultar nada, y se te avisa por correo. Ponlo a 0 para desactivar del todo la ocultación automática durante un ataque sostenido.'
      media_urgent_breaker_daily:
        label: 'Presupuesto de ocultación automática: por día'
        help: 'El mismo techo medido a lo largo de un día, para que un goteo lento no pueda hacer lo que no puede hacer una ráfaga. Ambos presupuestos deben tener margen para que un informe pueda ocultar una foto por su cuenta.'
      app_alert_emails:
        label: 'Destinatarios de las alertas'
        help: 'Direcciones de correo separadas por comas que reciben las alertas operativas: la apertura del interruptor de ocultación automática y cada escalado de presunto contenido ilegal. Cámbialas cuando quien las lee habitualmente esté fuera — un escalado tiene que llegarle a alguien el mismo día. Hace falta al menos una dirección válida.'
      app_support_emails:
        label: 'Destinatarios de soporte'
        help: 'Direcciones de correo separadas por comas que reciben los mensajes del formulario de contacto y los informes de errores. Distintas de los destinatarios de alertas de arriba, para que la puerta de entrada y el busca puedan apuntar a personas diferentes. Déjelo VACÍO para recurrir a los destinatarios de alertas.'
