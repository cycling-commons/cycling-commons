join:
  kicker: 'Participa'
  title: 'Construye el Commons con nosotros.'
  lead1: 'Cycling Commons lo construye la gente que lo usa — en código, en conocimiento local y en todo lo que hay alrededor. Es pronto, está abierto y hay sitio para ti.'
  lead2: 'Un bien común no crece contratando; crece porque la gente aparece. Aquí es donde hacen falta manos.'
  heart_kicker: 'El corazón del asunto'
  heart_h2: 'Ciclistas y conocimiento local.'
  heart_lead: 'El Commons vale lo que vale lo que saben los ciclistas: el puerto que merece el rodeo, dónde está el agua, el cruce que muerde, el circuito que es discretamente perfecto. Ese conocimiento es la razón de ser — y es lo único que nadie puede construir por ti.'
  howto1_b: 'Cartografía hechos objetivos en OpenStreetMap.'
  howto1_body_pre: 'Puntos de agua, estaciones de reparación, superficies: añádelos a'
  howto1_body_post: 'ya. Construimos sobre OSM y le devolvemos lo que aportamos, así que fluye hacia el Commons. Aquí no hace falta nada.'
  howto2_b: 'Añade aquí lo que sabes.'
  howto2_body_pre: 'Abre'
  howto2_themap: 'el mapa'
  howto2_mid1: 'y mejora un lugar, o ve directamente a'
  howto2_addclimb: 'añadir un puerto'
  howto2_mid2: '. Un curador lee todos los envíos. Allí donde el proceso no encaje con la forma en que tú introducirías tus datos,'
  howto2_email: 'escríbenos'
  howto2_mid3: 'o'
  howto2_issue: 'abre una incidencia'
  howto2_post: ': eso es lo que da forma a la siguiente ronda.'
  howto3_b: 'Añade un lugar que conozcas.'
  howto3_link: 'Elige una categoría y ponlo en el mapa'
  howto3_post: ' — un punto de agua, un peligro, un mirador, un alojamiento que acoja bien a los ciclistas. Un curador lo lee antes de que lo vea nadie más.'
  howto4_b: 'Mantén bien la zona de tu casa.'
  howto4_link: 'Abre el mapa por donde ruedas'
  howto4_post: 'y repasa lo que ya hay. Confirma lo que sigue siendo cierto, corrige lo que ha cambiado, añade lo que falta. Sin rol y sin solicitar nada: es lo más útil que puede hacer cualquiera, y así una región deja de ser una suposición.'
  howto5_b: 'Hazte cargo de una región.'
  howto5_link: 'Ver qué regiones buscan una persona curadora'
  howto5_post: 'o pide un país al que el Commons aún no ha llegado. Ambas cosas empiezan en la misma página.'
  skills_kicker: 'Aporta lo que sabes hacer'
  skills_h2: 'Ayuda a construirlo y a sostenerlo.'
  role1_rk: '01 · CONSTRUIR'
  role1_h: 'Desarrolladores'
  role1_p: 'La plataforma de verdad: el backend y la API (Symfony 7 LTS), el frontend en MapLibre y la canalización geoespacial (PostGIS, enrutado, elevación, importación de OSM).'
  role1_link: 'Empezar en GitHub →'
  role2_rk: '02 · CRECER'
  role2_h: 'Redes sociales y comunidad'
  role2_p: 'Cuenta la historia y haz crecer el grupo: escribir el blog, llevar los canales, dar la bienvenida a quien llega, y mantener sana la comunidad mientras crece.'
  role2_link: 'Ponte en contacto →'
  role3_rk: '03 · SOSTENER'
  role3_h: 'Captación de fondos y subvenciones'
  role3_p: 'Ayudas de datos abiertos y movilidad sostenible, financiación ciclista de la UE — la pista de despegue que mantiene el Commons gratuito e independiente.'
  role3_link: 'Ponte en contacto →'
  role4_rk: '04 · PROTEGER'
  role4_h: 'Jurídico y gobernanza'
  role4_p: 'La constitución de la fundación independiente, las licencias ODbL y CC, las condiciones para colaboradores y el RGPD — la estructura que lo mantiene abierto para siempre.'
  role4_link: 'Ponte en contacto →'
  also_welcome: '<b>También son bienvenidos:</b> traductores, diseñadores, cartógrafos de OpenStreetMap, fotógrafos y quien construya alianzas (clubes ciclistas, oficinas de turismo, alojamientos para ciclistas). ¿No ves tu papel aquí?'
  also_tell: 'Cuéntanos qué aportarías.'
  start_kicker: 'Empieza ahora'
  start_h2: 'Un bien común crece cuando la gente aparece.'
  start_lead: 'Código, conocimiento local o unas horas de tu experiencia — todo hace avanzar el mapa. La puerta está abierta.'
  start_cta_code: 'Aportar código →'
  start_cta_email: 'Escribir al equipo'
