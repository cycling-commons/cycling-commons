  title: 'Marca lo que ves, mientras ruedas.'
  lead: 'Scout es un registrador de campo de un solo toque para tu ciclocomputador. Marca un peligro, un corte, un cambio de firme o una fuente justo cuando pasas por delante — sin parar, sin móvil, sin escribir. Cada marca se escribe directamente en el archivo de tu ruta, en un formato abierto y documentado.'
