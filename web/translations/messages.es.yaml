    media_restored_after_review: 'El informe sobre tu foto no se ha sostenido, así que vuelve a estar en el mapa exactamente como estaba. Gracias por tu paciencia — ocultarla primero es como nos aseguramos de que una queja auténtica nunca se quede publicada durante días, y eso hace que alguna foto de vez en cuando desaparezca un tiempo para nada.'
