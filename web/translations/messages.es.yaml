about:
  kicker: 'Quiénes somos'
  title: 'El mapa es de todos.'
  lead1: 'Cada ciclista lleva encima un mapa privado: la fuente que salvó un julio abrasador, el puerto que merece la hora extra, la carretera secundaria que por alguna razón siempre está vacía. Hoy ese conocimiento vive en una sola cabeza y ahí muere. Cycling Commons es donde vive en su lugar.'
  lead2: 'Es un mapa abierto, construido por la comunidad, de lo mejor que se puede rodar en el mundo — para todas las formas de ciclismo. Datos abiertos que cualquiera puede usar, gobernados por los ciclistas que los construyen.'
  problem_kicker: 'El problema'
  problem_title: 'Una aplicación distinta para cada cosa.'
  problem_lead1: 'Los puertos en una aplicación, las rutas en otra, dónde dormir en una tercera, el estado de la carretera en ninguna — casi todo cerrado y nada conectado entre sí. Los ciclistas pagan una docena de herramientas y aun así no ven el conjunto. El conocimiento existe; solo está disperso y bajo llave.'
  problem_lead2: 'El Commons reúne el conocimiento no personal — el mapa, nunca el ciclista — en un único lugar abierto. Libre de consultar, libre de exportar, libre de construir encima, para cualquiera.'
  believe_kicker: 'En qué creemos'
  believe_princ1_num: 'I'
  believe_princ1_title: 'El mapa, no el ciclista.'
  believe_princ1_body: 'Datos abiertos sobre lugares, no sobre personas — el Commons no recoge nada sobre cómo, dónde ni cuándo ruedas.'
  believe_princ2_num: 'II'
  believe_princ2_title: 'Abierto para todo el mundo.'
  believe_princ2_body: 'Datos ODbL, medios CC BY-SA y una API gratuita — utilizables por cualquiera, con fines comerciales o no.'
  believe_princ3_num: 'III'
  believe_princ3_title: 'Curaduría, no saturación.'
  believe_princ3_body: 'Lo mejor de cada región, votado por los ciclistas, no un vertido interminable.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Gobernado, no solo publicado.'
  believe_princ4_body: 'Construido sobre los principios de Elinor Ostrom para los bienes comunes que no se hunden ni acaban capturados.'
  believe_ostrom: 'ganó el Premio Nobel de Economía en 2009 por demostrar que una comunidad puede gobernar un recurso compartido de forma sostenible — sin privatizarlo y sin un propietario central — cuando se dan unos cuantos principios de diseño: límites claros, reglas fijadas por quienes se ven afectados, seguimiento y sanciones graduales. El Cycling Commons los aplica; la'
  believe_ostrom_link: 'página de gobernanza'
  believe_ostrom_suffix: 'relaciona cada principio con una parte del sistema.'
  partners_kicker: 'Socios, no silos'
  partners_title: 'Donde ya existen buenos datos abiertos, nos sumamos.'
  partners_lead1_pre: 'El Commons no está aquí para reconstruir lo que otros ya han abierto. Construimos sobre'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'y le devolvemos lo que aportamos. Y para las capas que no son nuestras — como los alojamientos que acogen bien a los ciclistas — preferimos'
  partners_lead1_partner: 'aliarnos con comunidades abiertas'
  partners_lead1_post: ', como las redes de hospitalidad abierta, antes que encerrar una copia privada de sus datos.'
  partners_lead2: 'Los datos abiertos deberían conectarse, no fragmentarse más. Cada alianza enriquece el atlas entero sin que nadie lo cerque.'
  steward_kicker: 'Quién lo gestiona'
  steward_title: 'BikeCoders hoy — una fundación mañana.'
  steward_lead: 'BikeCoders siembra y gestiona el Commons hoy. Pero el compromiso es público desde el primer día: licencia abierta, datos y cuentas separados, y un camino hacia una fundación independiente en cuanto haya una comunidad que lo gobierne. La licencia abierta y la titularidad separada hacen difícil que más adelante alguien lo cerque en silencio.'
  steward_cta_map: 'Explorar el mapa →'
  steward_cta_account: 'Crear una cuenta gratuita'
privacy:
  kicker: 'Privacidad'
  title: 'Qué recogemos y por qué.'
  lead: 'En lenguaje claro. El conjunto de datos de Cycling Commons no es personal: son geodatos abiertos sobre lugares, nunca sobre personas. La <b>cuenta de la plataforma</b> es otra cosa: contiene datos personales (correo electrónico, credenciales, registros de sesión). Esto es lo que guardamos, por qué, y el control que tienes sobre ello.'
  last_updated: 'Última actualización: 27 de agosto de 2026'
  h_responsible: 'Quién es el responsable'
  responsible_p1_pre: 'El responsable del tratamiento es'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', con sede en los Países Bajos, que gestiona hoy el Cycling Commons. Como se explica en nuestra'
  responsible_p1_governance: 'gobernanza'
  responsible_p1_post: ', el Commons se ha comprometido a constituirse como fundación neerlandesa independiente; el responsable cambiará en consecuencia y esta página se actualizará.'
  responsible_p2_pre: 'Preguntas sobre tus datos:'
  responsible_p2_mid: '. También tienes derecho a presentar una reclamación ante la autoridad de control neerlandesa, la'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: '<b>No hemos nombrado delegado de protección de datos (DPD)</b>, y la ley tampoco nos obliga: somos una operación pequeña, no vigilamos a nadie a gran escala y las categorías especiales de datos no forman parte de lo que hacemos (RGPD art. 37). Las preguntas y solicitudes sobre protección de datos van a la misma dirección que todo lo demás,'
  dpo_post: ', y las lee una persona. Si eso cambia algún día y nombramos a alguien, esta página dirá quién es.'
  h_collect: 'Qué recogemos'
  collect_intro: 'Pedimos el mínimo necesario para mantener un mapa abierto y responsable. Nunca te pedimos tu nombre real.'
  h3_account: 'Cuando creas una cuenta'
  collect_account_email: 'Tu <b>dirección de correo electrónico</b> — para iniciar sesión, proteger la cuenta y enviarte los mensajes de servicio imprescindibles.'
  collect_account_password: 'Una <b>contraseña</b>, que guardamos solo como hash con sal — nunca vemos ni conservamos el texto en claro.'
  collect_account_displayname: 'Un <b>nombre visible</b> que eliges tú. Puede ser un seudónimo, y nunca te pedimos tu nombre real. Tu perfil está <b>desactivado por defecto</b>: mientras lo esté, lo que aportas no lleva ningún nombre. Si lo activas, tu nombre visible, tu país, el mes en que entraste y el número de aportaciones pasan a ser públicos.'
  collect_account_2fa: 'Si activas la <b>autenticación en dos factores (2FA)</b>, guardamos el secreto TOTP <b>cifrado en reposo</b>, y tus códigos de respaldo solo como hashes.'
  collect_account_base: 'Una <b>ubicación base</b> opcional — un punto a escala de municipio (precisión de ~1 km) y un radio de rodaje, si lo configuras. Se usa solo para acotar tu propia vista del mapa; nunca se muestra a otros ciclistas y nunca forma parte del conjunto de datos del Commons.'
  h3_contribute: 'Cuando aportas algo'
  collect_contribute_items: '<b>Todo lo que escribes en el Commons.</b> Un lugar, un puerto, una ruta, una corrección, un voto, una comprobación sobre el terreno, una descripción de región, una traducción, un aviso, un mensaje a una persona curadora: si lo escribiste y lo enviaste, lo tenemos. De cada uno queda registrado que lo hizo una cuenta: eso permite que te respondan y enseña a otras personas que el mapa lo cuida gente. Mientras tu perfil esté desactivado, nada de ello lleva tu nombre.'
  collect_contribute_media: 'Las <b>fotos</b> que subes. Una foto puede llevar datos ocultos (EXIF), como dónde se tomó: los quitamos y volvemos a codificar el archivo, así que lo que publicamos no lleva nada de eso. Después escribimos una sola cosa dentro: una marca de que la imagen está bajo CC BY-SA 4.0, y un enlace a su página aquí. <b>Tu nombre nunca se escribe en el archivo.</b> Ese enlace es como alguien que reutilice la foto encuentra a quién acreditar, y esa página solo te nombra mientras tu perfil sea público.'
  collect_contribute_profile: 'Los datos opcionales de perfil público que rellenes (biografía, enlaces, qué aportaciones mostrar). Los perfiles son'
  collect_contribute_profile_link: 'voluntarios'
  collect_contribute_profile_post: ' y están desactivados por defecto.'
  h3_auto: 'De forma automática, al usar el sitio'
  collect_auto_technical: '<b>Datos técnicos</b> — dirección IP, tipo de navegador y marcas de tiempo en los registros del servidor, conservados para operar y proteger el servicio.'
  collect_auto_ratelimit: "<b>Contadores de límite</b> — cuando usas una herramienta sin cuenta, como la comprobación de ruta, contamos tus usos sobre un hash unidireccional con sal de tu dirección IP en lugar de la dirección misma. Así aplicamos un límite diario justo sin guardar una lista de quién nos visitó. El hash no es anonimización: el contador sigue siendo un dato personal y todo lo de esta página se le aplica."
  banner_bold: 'Sin seguimiento de rutas.'
  banner_body: 'El Commons es un mapa de lugares, no de personas. <b>No</b> recogemos trazas GPS, tus rutas, tu ubicación en tiempo real ni ningún registro de por dónde ruedas.'
  h_why: 'Por qué lo usamos (bases jurídicas)'
  why_contract: '<b>Para prestarte la cuenta y el servicio</b>: ejecución de un contrato (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">art. 6.1.b del RGPD</a>).'
  why_consent: '<b>Mostrar tu nombre.</b> Un perfil público, y que se te acredite por tu nombre en lo que aportaste, se basa en tu consentimiento (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">RGPD art. 6.1.a</a>). Puedes retirarlo cuando quieras en tus'
  why_consent_link: 'ajustes'
  why_consent_post: ', y tu nombre desaparece de esas páginas. Por nuestra parte ocurre al instante. Un archivo de mapa que el navegador de otra persona ya se había descargado puede tener hasta una hora, y una copia de página que alguien guardó queda del todo fuera de nuestro alcance.'
  why_licence: '<b>Publicar lo que aportas.</b> Una foto o una edición que das al Commons se publica bajo la licencia que aceptaste al enviarla, y eso forma parte de nuestro acuerdo contigo (art. 6.1.b). Esa licencia es <b>irrevocable</b> por sus propios términos: retirar el consentimiento quita tu nombre de la página, pero no despublica la aportación en sí. Hay una excepción que importa: si en la foto sales <b>tú</b>, eso son datos personales tuyos, y una licencia de derechos de autor no firma la renuncia a tus derechos de protección de datos. Cada página de foto lleva un enlace para pedir que se retire.'
  why_updates: '<b>Avisarte cuando salga una versión.</b> Solo si lo pediste: el interruptor de tus ajustes es tu consentimiento (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">RGPD art. 6.1.a</a>), y apagarlo lo retira. Además, cada mensaje lleva una baja de un clic que no exige iniciar sesión. Solo notas de versión, nunca publicidad, y la lista no se comparte ni se vende jamás.'
  why_legitimate: '<b>Seguridad, prevención de abusos y analítica agregada</b>: nuestro interés legítimo en mantener el Commons honesto y en funcionamiento (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">art. 6.1.f</a>).'
  why_legal: '<b>Cumplimiento de obligaciones legales</b>: cuando la ley lo exige (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">art. 6.1.c</a>).'
  h_cookies: 'Cookies y analítica'
  cookies_body: 'Aquí vamos ligeros. Ponemos <b>dos cookies</b>, ambas estrictamente necesarias y ambas listadas al completo más abajo. Para las estadísticas de uso alojamos nuestra propia <b>analítica</b> en nuestro servidor, en <b>analytics.bikecoders.life</b>: recibe la URL de la página, el referente, el tamaño de pantalla y el tipo de navegador, y recibe tu <b>dirección IP</b>, que es un dato personal, pero <b>no la guarda</b>. La dirección solo sirve para deducir una ubicación aproximada (país, región y ciudad) y para derivar un identificador de sesión de un solo sentido, y después se descarta. No se instala ninguna cookie de analítica, ningún visitante recibe un identificador persistente ni queda vinculado a una cuenta, y no hay seguimiento entre sitios ni entre dispositivos. Los datos de analítica permanecen en nuestra propia infraestructura y nunca se comparten ni se venden a terceros.'
  h3_cookie_table: 'Las cookies que ponemos'
  ck_h_name: 'Nombre'
  ck_h_purpose: 'Para qué sirve'
  ck_h_life: 'Cuánto dura'
  ck_session_purpose: 'Mantiene tu sesión iniciada y lleva el token que protege cada formulario del sitio frente a la falsificación de petición entre sitios (CSRF), un ataque en el que otra web hace que tu navegador envíe aquí un formulario en tu nombre. Se pone cuando inicias sesión, y en las pocas páginas con un formulario que tenemos que recordar por ti, como la página de contacto. Leer el mapa y el resto del sitio no pone ninguna cookie. Contiene un identificador aleatorio y nada más: ni nombre, ni dirección de correo, ni registro de lo que has mirado.'
  ck_session_life: 'Hasta que cierras el navegador'
  ck_remember_purpose: 'Vuelve a iniciar tu sesión en la siguiente visita sin pedirte la contraseña. Se pone <b>solo</b> si marcas <b>Recordarme</b> al iniciar sesión, y se retira al cerrar sesión.'
  ck_remember_life: '7 días'
  cookies_none_body: 'Esa es la lista completa. No ponemos <b>ninguna</b> cookie publicitaria, <b>ninguna</b> cookie de analítica y <b>ninguna</b> cookie de seguimiento entre sitios, en ninguna página. Las dos de arriba son estrictamente necesarias para darte algo que tú mismo pediste, así que la ley no exige consentimiento, y por eso aquí no hay aviso de cookies. Si algún día añadiéramos algo que sí lo necesita, te lo preguntaríamos antes en lugar de darlo por hecho.'
  cookies_local_body: 'El mapa también guarda algunos ajustes tuyos en el <b>almacenamiento local</b> del navegador: el tema claro u oscuro del mapa, la zona que miraste por última vez y los filtros que tenías activos. Eso no es una cookie, nunca llega a nuestro servidor, y borrar los datos del navegador lo elimina. <b>Ningún otro sitio puede leerlo.</b> El navegador mantiene separado el almacenamiento local de cada sitio, así que lo que se guarda aquí solo lo puede leer este sitio.'
  h_share: 'Con quién lo compartimos'
  share_infra: '<b>Las empresas que sostienen nuestra infraestructura.</b> Alojamiento, copias de seguridad, correo de cuenta y los servicios de mapa que tu navegador pide directamente. Todas aparecen con nombre en las dos tablas de abajo, con lo que hacen y lo que pueden ver.'
  share_osm_pre: 'OpenStreetMap — las aportaciones que decidas devolver pasan a formar parte del mapa abierto bajo la'
  share_osm_link: 'ODbL'
  share_osm_post: '. Eso son datos públicos y abiertos, no datos personales sobre ti.'
  share_noone: '<b>Con nadie más.</b> No vendemos datos personales y no usamos seguimiento publicitario de terceros.'
  share_selfhosted: 'Primero, lo que <b>no</b> está en estas listas. Alojamos por nuestra cuenta todo lo que podemos: los datos del mapa, el cálculo de rutas, el modelo de elevación que hay detrás de los desniveles, el almacenamiento de fotos e incluso las estadísticas de uso están en nuestras propias máquinas. Dos servicios que antes pedíamos fuera, el de rutas y el de altitud, se vinieron a casa en 2026 justo por esto. Construirlo así lleva más tiempo y cuesta más. También es la razón de que tu navegador hable con cinco servicios externos y no con veinte, y de que las tablas de abajo sean tan cortas: cada nombre que aparece en ellas es uno que no podíamos mantener nosotros de forma razonable.'
  h3_processors: 'Las empresas que tratan datos por encargo nuestro'
  processors_intro: 'Tres empresas guardan o manejan tus datos siguiendo nuestras instrucciones. Son nuestros <b>encargados del tratamiento</b>: solo pueden hacer lo que les indicamos, bajo contrato escrito, y no pueden usar tus datos para nada propio.'
  pr_h_who: 'Quién'
  pr_h_where: 'Dónde'
  pr_h_what: 'Qué hacen para nosotros'
  pr_h_sees: 'Qué pueden ver'
  pr_hetzner_where: 'Falkenstein, Alemania (EEE)'
  pr_hetzner_what: 'Hace funcionar las máquinas: el sitio web, la base de datos y el almacenamiento de las fotos subidas.'
  pr_hetzner_sees: 'En principio todo lo que guardamos, porque está en su hardware: tu dirección de correo, tus aportaciones, tus fotos y los registros del servidor. Las contraseñas y los secretos de doble factor siguen siendo ilegibles también ahí (ver <b>Cómo lo protegemos</b>).'
  pr_scaleway_where: 'Espacio Económico Europeo'
  pr_scaleway_what: 'Entrega el correo que el propio sitio envía (confirmación de dirección, restablecimiento de contraseña, código de borrado, mensajes de moderación) y guarda las copias de seguridad nocturnas.'
  pr_scaleway_sees: 'Tu dirección de correo y el contenido de los mensajes que el sitio te envía. Las copias de seguridad se cifran en nuestros propios servidores antes de salir, así que su contenido no se puede leer al otro lado.'
  pr_proton_where: 'Suiza (amparada por una decisión de adecuación de la UE)'
  pr_proton_what: 'Aloja el buzón del proyecto, la dirección que aparece en esta página, y las respuestas que una persona de aquí te escribe.'
  pr_proton_sees: 'Tu dirección de correo y lo que hayas decidido escribirnos, mientras se conserve la conversación.'
  h3_browser_services: 'Servicios que tu navegador contacta directamente'
  browser_services_intro: 'El mapa se arma en tu navegador, así que algunas piezas vienen directamente de quien las publica en lugar de pasar por nosotros. Nunca les damos tu cuenta, tu nombre visible ni tu dirección de correo. Sí ven la dirección de red desde la que sale tu petición, porque toda petición en internet lleva una. Nada de esta lista se carga hasta que abres una página que lo usa.'
  bs_h_service: 'Servicio'
  bs_h_what: 'Para qué es'
  bs_h_sees: 'Qué recibe'
  bs_sees_ip: 'Tu dirección IP y qué teselas de mapa pediste.'
  bs_openfreemap_what: 'El mapa base: las carreteras, el agua y los nombres de lugar bajo todo lo demás.'
  bs_esri_what: 'La vista por satélite, solo cuando la activas.'
  bs_esri_sees: 'Tu dirección IP y qué teselas de imagen pediste. Esri está en Estados Unidos.'
  bs_mapillary_what: 'Fotos a pie de calle, solo cuando abres la vista de calle.'
  bs_mapillary_sees: 'Tu dirección IP y qué fotos abriste. Mapillary lo opera Meta Platforms Ireland Limited, en Irlanda, y los archivos de imagen vienen de la red de contenido de Meta, que es mundial.'
  bs_photon_what: 'La búsqueda de lugares, mientras escribes en el buscador.'
  bs_photon_sees: 'Tu dirección IP y las palabras que escribes en el buscador. Photon lo opera komoot, en Alemania.'
  bs_wikimedia_what: 'Fotos de referencia de algunos puertos y lugares, cuando la imagen viene de Wikimedia Commons.'
  bs_wikimedia_sees: 'Tu dirección IP y qué foto mostró la página. La Wikimedia Foundation está en Estados Unidos.'
  browser_services_post: 'Dos de ellos están fuera del Espacio Económico Europeo (EEE): <b>Esri</b> y la <b>Wikimedia Foundation</b>, ambos en Estados Unidos. Si nunca abres la capa de satélite y nunca miras una página con una foto de Commons, tu navegador no los contacta nunca. Ver <b>Transferencias internacionales</b> más abajo.'
  h_transfers: 'Transferencias internacionales'
  transfers_body: 'Algunos proveedores de infraestructura pueden tratar datos fuera del Espacio Económico Europeo. Cuando lo hacen, nos apoyamos en garantías adecuadas — como las Cláusulas Contractuales Tipo de la Comisión Europea o una decisión de adecuación.'
  h_retention: 'Cuánto tiempo lo conservamos'
  retention_account: '<b>Datos de la cuenta.</b> Hasta que borres la cuenta, y entonces desaparecen. El borrado es inmediato: lo pides, te enviamos un código por correo, lo confirmas, y en ese momento la cuenta sale de la base de datos en servicio. La dirección de correo, el hash de la contraseña, el secreto de doble factor y los códigos de respaldo se van con ella. No hay periodo de espera ni se guarda nada por si cambias de idea. Dos cosas merecen decirse con claridad. Nuestras copias de seguridad nocturnas todavía contienen el registro antiguo hasta que rotan, y eso tarda <b>90 días como máximo</b>; están cifradas y solo se abren para recuperarse de un desastre. Y <b>no</b> borramos una cuenta solo porque lleve años sin que nadie entre en ella. Si algún día empezamos a hacerlo, te escribiremos antes y te daremos tiempo para conservarla.'
  retention_logs: '<b>Registros del servidor.</b> Se conservan <b>30 días</b> y después se eliminan automáticamente. Contienen direcciones IP: un servidor web anota la dirección de quien visita en sus entradas de error y no ofrece ninguna opción para omitirla, así que ese plazo es el límite real, no una promesa sobre el contenido.'
  retention_ratelimit: "<b>Contadores de límite.</b> Un día."
  retention_contributions: '<b>Aportaciones.</b> Los hechos que devuelves al mapa abierto permanecen como parte del Commons (con su procedencia), incluso después de que te vayas; no son datos personales sobre ti.'
  retention_consent: '<b>Consentimientos de licencia.</b> Cuando licencias una foto al Commons registramos que aceptaste, el texto exacto que aceptaste y cuándo. Ese registro lo conservamos indefinidamente y sobrevive al cierre de tu cuenta: es nuestra prueba de que la licencia se concedió, y podemos necesitarla para formular o defender reclamaciones (art. 17.3.e). Contiene una referencia a la cuenta y nada más sobre ti, y una vez desaparecida la cuenta esa referencia ya no identifica a nadie aquí.'
  retention_mail: '<b>El correo que nos envías.</b> Guardamos una conversación mientras el asunto sigue abierto, y la borramos dentro de los <b>24 meses</b> siguientes a su cierre. Eso te cubre si vuelves sobre ello un año después, y nos cubre si llega tarde una reclamación sobre cómo lo tratamos. Las conversaciones que forman parte de un asunto legal, como una reclamación de derechos o una retirada, se conservan hasta que ese asunto termina.'
  retention_updates: '<b>La lista de versiones.</b> Tu dirección sigue en ella hasta que la quites, desde tus ajustes o desde el enlace de cualquier mensaje. Guardamos el registro de que aceptaste, y con qué texto, igual que un consentimiento de licencia de foto: es la prueba de que podíamos escribirte.'
  h_security: 'Cómo lo protegemos'
  security_intro: 'La ley nos pide medidas acordes al riesgo (art. 32). En palabras llanas:'
  security_passwords: '<b>Tu contraseña no se guarda nunca.</b> Solo conservamos una transformación irreversible: nadie aquí puede leer tu contraseña, y una base de datos robada tampoco se la entrega a nadie.'
  security_secrets: '<b>Los secretos de doble factor y los códigos de respaldo están cifrados donde reposan</b>, con la clave fuera de la base de datos. Quien robe solo la base de datos sigue sin poder producir un código válido.'
  security_transport: '<b>Todo viaja cifrado</b>, entre tú y nosotros y otra vez cuando una copia de seguridad sale de nuestros servidores. A los navegadores se les indica que rechacen por completo una conexión sin cifrar con nosotros.'
  security_access: '<b>Solo quien necesita tus datos puede llegar a ellos</b>, y toda cuenta de moderación o administración entra con doble factor. Los intentos fallidos repetidos se frenan y luego se bloquean.'
  security_source_pre: 'Esa es la versión corta. Las medidas exactas, y el razonamiento detrás de cada una, están en nuestro'
  security_source_link: 'código fuente público'
  security_source_post: '. Para eso lo construimos a la vista: no tienes que creerte un párrafo de seguridad sin más.'
  security_honest: 'Ningún sistema es perfecto y no vamos a fingir que el nuestro lo sea. Detrás de este párrafo no hay certificación ni prueba de intrusión: lo que hay es un sistema pequeño que guarda lo menos posible, y código que cualquiera puede revisar.'
  h_breach: 'Si alguna vez se filtran datos'
  breach_pre: 'Si se pierden datos personales, quedan expuestos o llega a ellos alguien que no debería, y eso puede poner en riesgo los derechos de las personas, lo comunicamos a la'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>en un plazo de 72 horas</b> desde que lo sabemos (art. 33). Si el riesgo para ti en concreto es alto, además te lo comunicamos directamente y sin demora (art. 34), en lenguaje claro: qué ha pasado, cuáles de tus datos estaban implicados, qué hemos hecho al respecto y qué deberías hacer tú. Llevamos un registro interno de cada brecha, incluidas las que no estamos obligados a comunicar, para que el patrón siga siendo visible aunque ningún caso suelto sea notificable.'
  h_rights: 'Tus derechos'
  rights_intro: 'El <a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">RGPD</a> te reconoce los siguientes derechos:'
  rights_access: '<b>Acceso (art. 15)</b> — solicitar una copia de los datos personales que tenemos sobre ti.'
  rights_correct: '<b>Rectificación (art. 16)</b> — corregir lo que sea inexacto o completar lo que falte.'
  rights_erase: '<b>Supresión (art. 17)</b> — borra tu cuenta cuando quieras desde los ajustes. Tus datos personales se van con ella y no vuelven. Dos cosas sobreviven deliberadamente, y ninguna te identifica después: las aportaciones que hiciste al mapa abierto y el registro de que concediste una licencia de foto. Ambas se describen arriba, en <b>Cuánto tiempo lo conservamos</b>.'
  rights_portability: '<b>Portabilidad (art. 20)</b> — descarga todo lo que tenemos sobre ti en un único archivo ZIP, cuando quieras, desde los ajustes de tu cuenta. Incluye los datos de la cuenta, tus aportaciones, tus mensajes, tus consentimientos de licencia y tus fotos como archivos.'
  rights_restrict: '<b>Limitación y oposición (arts. 18 a 21)</b> — limitar determinados tratamientos u oponerte a ellos.'
  rights_withdraw: '<b>Retirar el consentimiento</b> en cualquier momento (por ejemplo, desactivando tu perfil público) — esto no afecta al tratamiento ya realizado.'
  rights_third_party_photo: '<b>¿No tienes cuenta?</b> Estos derechos no dependen de tener una. Si se te reconoce en una foto de nuestro mapa, cada página de foto lleva un enlace <b>"esta foto me muestra"</b>. Avísanos ahí, sin cuenta y sin documento de identidad, y una persona curadora responde en un plazo máximo de un mes.'
  rights_contact_pre: 'Para ejercer cualquiera de ellos, escribe a'
  rights_contact_mid: '. Respondemos <b>en un plazo máximo de un mes</b>, y casi siempre mucho antes. La ley permite hasta tres meses para una solicitud realmente complicada, pero solo si dentro del primer mes te decimos que tardaremos más, y por qué. Si no te convence nuestra respuesta, puedes reclamar ante la'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Menores'
  children_body: 'El Commons no está destinado a menores de <b>16</b> años. No recogemos a sabiendas datos personales de nadie por debajo de esa edad; si crees que un menor nos ha facilitado datos, escríbenos y los borraremos.'
  h_automated: 'Decisiones automatizadas'
  automated_body: 'No tomamos decisiones sobre ti por medios exclusivamente automatizados, y no elaboramos perfiles con fines publicitarios.'
  h_changes: 'Cambios en esta política'
  changes_body: 'Si cambiamos la forma en que tratamos los datos, actualizaremos esta página y su fecha y — cuando el cambio sea sustancial — avisaremos a los colaboradores con sesión iniciada.'
  changes_versions_pre: 'También puedes comprobarlo por tu cuenta en vez de creernos sin más. La plataforma es de código consultable, así que esta página y su texto viven en un repositorio público, y cada cambio queda anotado con su fecha y su motivo en el'
  changes_versions_link: 'historial de la página'
  changes_versions_post: '.'
  footer_disc_pre: 'Consulta también nuestras'
  footer_disc_terms: 'Condiciones de uso'
  footer_disc_mid: 'y las'
  footer_disc_licences: 'licencias'
  footer_disc_post: ' de los datos, los medios y el código.'
terms:
  kicker: 'Condiciones de uso'
  title: 'El acuerdo, en lenguaje claro.'
  lead: 'Estas condiciones regulan el uso del sitio web y de la cuenta de Cycling Commons, en lenguaje claro.'
  last_updated: 'Última actualización: 1 de agosto de 2026'
  h1_accepting: 'Aceptación de estas condiciones'
  accepting_p1_pre: 'Al usar el sitio web de Cycling Commons o crear una cuenta, aceptas estas condiciones y nuestro'
  accepting_p1_privacy: 'aviso de privacidad'
  accepting_p1_mid: '. Si no estás de acuerdo, no uses el servicio. El Commons lo opera'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' en los Países Bajos, camino de una fundación independiente como se describe en nuestra'
  accepting_p1_governance: 'gobernanza'
  accepting_p1_post: '.'
  h2_who: 'Quién puede usarlo'
  who_body: 'Necesitas tener al menos <b>16</b> años para crear una cuenta. La información que nos facilites (como tu correo electrónico) debe ser exacta y de tu titularidad.'
  h3_account: 'Tu cuenta'
  account_password: 'Guarda bien tu contraseña; eres responsable de la actividad realizada con tu cuenta.'
  account_unauthorised: 'Avísanos sin demora si sospechas de un acceso no autorizado.'
  account_suspend: 'Podemos suspender o cerrar cuentas usadas para abusar del servicio o incumplir estas condiciones.'
  h4_using: 'Usarlo bien'
  using_intro: 'El Commons funciona porque la gente lo usa de buena fe.'
  using_no_illegal: 'No infrinjas la ley, no acoses a nadie y no publiques contenido ilícito, engañoso o dañino.'
  using_no_personal: 'No subas <b>datos personales de otras personas</b> (por ejemplo, personas identificables en fotos) sin una base adecuada — el Commons cartografía lugares, no personas.'
  using_no_reidentify_pre: 'No intentes reidentificar a los colaboradores ni socavar el'
  using_no_reidentify_link: 'límite de captación'
  using_no_reidentify_post: ' del proyecto, que es lo que mantiene fuera los datos personales.'
  using_no_scrape_pre: 'No hagas scraping del servicio. Punto — la'
  using_no_scrape_link: 'API y la exportación masiva'
  using_no_scrape_post: ' son la forma de obtener los datos. Ninguna de las dos está activa todavía, así que hasta entonces escribe a info@cyclingcommons.org y te daremos lo que necesites.'
  using_no_disrupt: 'No interrumpas el servicio ni intentes esquivar sus límites.'
  h5_contributions: 'Tus aportaciones'
  contributions_p1_pre: 'Conservas la autoría de lo que aportas. Para que el Commons pueda ser abierto, concedes las licencias de nuestras'
  contributions_p1_link: 'condiciones para colaboradores'
  contributions_p1_mid: ': los <b>datos</b> se incorporan al Commons bajo la'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', y los <b>medios</b> (fotos, vídeo) y '
  contributions_p1_mid3: 'las <b>traducciones de la interfaz</b> bajo'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Confirmas que tienes derecho a aportar lo que envías, que no vulnera derechos de terceros y que no son datos personales de otras personas.'
  h6_opendata: 'Datos abiertos y API'
  opendata_pre: 'Los datos, los medios y las traducciones de la interfaz del Commons son de uso libre para cualquiera — también con fines comerciales — bajo sus'
  opendata_link: 'licencias'
  opendata_mid: ', citando la fuente. Consulta la'
  opendata_dev_link: 'documentación para desarrolladores'
  opendata_post: ' para la línea de atribución, y para la API y la exportación masiva tal como se están diseñando — ninguna de las dos está activa todavía.'
  h7_code: 'Nuestro código y nuestra marca'
  code_pre: 'El código fuente de la plataforma es <b>source-available</b> bajo la'
  code_link: 'PolyForm Shield License 1.0.0'
  code_post: ' — úsalo para lo que quieras, salvo para operar un producto que compita con Cycling Commons. El nombre y el logotipo «Cycling Commons» no se licencian para usos que sugieran respaldo o vinculación.'
  h8_preview: 'Una intención, no una garantía'
  preview_body: 'Cycling Commons es una intención, <b>no</b> una garantía. No dependas de él para la navegación, el estado de las carreteras ni tu seguridad — usa siempre tu propio criterio cuando ruedes.'
  h9_warranty: 'Sin garantías'
  warranty_body: 'El servicio se presta <b>«tal cual»</b> y «según disponibilidad», sin garantías de ningún tipo, en la máxima medida que permita la ley. No garantizamos que sea exacto, ininterrumpido ni libre de errores.'
  h10_liability: 'Responsabilidad'
  liability_body: 'En la máxima medida permitida por el Derecho neerlandés, BikeCoders no responde de los daños indirectos o consecuentes derivados de tu uso del Commons. Nada en estas condiciones limita la responsabilidad que la ley no permite limitar.'
  h11_suspension: 'Suspensión y finalización'
  suspension_pre: 'Puedes cerrar tu cuenta cuando quieras en los'
  suspension_link: 'ajustes'
  suspension_post: '. Podemos suspender o retirar el acceso si se incumplen estas condiciones o para proteger el Commons o a sus usuarios.'
  suspension_p2: 'Antes de irte puedes <b>descargar todo lo que tenemos sobre ti</b> en un único archivo ZIP desde esa misma página. Cerrar la cuenta elimina tus datos personales. Dos cosas se quedan, y ninguna te nombra después: las aportaciones que hiciste al mapa abierto y el registro de que concediste una licencia de foto, que conservamos como prueba de que la licencia existe. Las fotos que se hubieran aprobado siguen en el Commons bajo CC BY-SA 4.0, y al marcharte eliges si mantienen tu nombre o pasan a ser anónimas.'
  h12_moderation: 'Cómo funciona la moderación'
  mod_intro: 'El Commons se construye con lo que aporta la gente, así que parte de ello hay que revisarlo. Esta sección dice qué retiramos, quién decide, qué se le comunica y qué puede hacer al respecto.'
  mod_standard_h: 'Qué se retira'
  mod_std1: '<b>Todo lo ilícito.</b> Incluido lo que vulnera los derechos de otra persona.'
  mod_std2: '<b>Datos personales de otras personas.</b> El Commons cartografía lugares, no personas. Una persona reconocible en una foto, un nombre, una matrícula, una casa señalada como el domicilio de alguien.'
  mod_std3: '<b>Cosas que sencillamente no son ciertas.</b> Una fuente que nunca estuvo ahí, un firme que no se corresponde con el terreno, un puerto inventado para manipular una clasificación.'
  mod_std4: '<b>Los abusos.</b> Acoso, amenazas, o contenido dirigido a una persona en lugar de a un lugar.'
  mod_std5: '<b>La publicidad.</b> El Commons no es un directorio, y un lugar no está en él porque alguien pagara o lo pidiera.'
  mod_std6: '<b>Fotografías que no lo son.</b> Una imagen generada o alterada de forma sustancial por IA, por buena que parezca. El Commons es un mapa del mundo real, y la imagen de un lugar que nunca ha tenido ese aspecto vale menos que ninguna imagen.'
  h13_ai: 'Dónde intervienen las máquinas'
  ai_intro: 'Lista corta, y preferimos contártela a que la adivines:'
  ai_translation: '<b>Traducción automática.</b> Algunas descripciones de lugares vienen de Wikipedia en el idioma local y se traducen automáticamente al inglés. Todas llevan la marca <b>auto-translated</b> allí donde aparecen, porque una traducción automática de un puerto puede estar mal de una forma que se lee perfectamente.'
  ai_checks: '<b>Comprobaciones automáticas.</b> Un programa revisa el catálogo buscando cosas que parecen erróneas, dos fuentes a un metro una de otra, un enlace que ya no responde, y se las pone delante a una persona curadora. Señala; nunca decide.'
  ai_none: '<b>Nada más.</b> Ni chatbot, ni texto generado que hagamos pasar por nuestro, ni decisiones automatizadas sobre ti o tu cuenta, ni elaboración de perfiles. Si eso cambia algún día, esta sección cambia primero.'
  ai_uploads: '<b>Lo que no puedes subir.</b> Nada de imágenes generadas ni retocadas por IA. La edición normal está bien: recortar, enderezar, levantar las sombras. Inventar o borrar algo que estaba ahí no lo está, y una imagen hecha por un modelo tampoco. El consentimiento que marcas antes de subir lo dice, y es motivo de retirada.'
  ai_stance: 'Con esto no reclamamos el cumplimiento de nada. Las reglas de transparencia del Reglamento europeo de IA empiezan a aplicarse el <b>2 de agosto de 2026</b>, y es discutible hasta dónde alcanzan la descripción de una fuente. Te lo diríamos igualmente, porque un mapa solo vale si puedes distinguir lo que ha puesto una persona.'
  mod_who_h: 'Quién decide'
  mod_who: 'Decide un <b>curador</b>, y un curador es una persona. Los curadores son ciclistas que se presentaron y fueron aceptados, trabajan con un reglamento escrito, y cada decisión queda registrada con su nombre.'
  mod_automated: '<b>Nada se retira solo por software.</b> Hay comprobaciones automáticas que marcan cosas para que las mire un curador, pero nunca deciden. La única excepción funciona al revés y está para proteger a las personas, no para juzgarlas: una denuncia de imagen íntima o relativa a un menor oculta la foto de inmediato, antes de que nadie la haya visto, y después la revisa un curador.'
  mod_told_h: 'Qué se le comunica'
  mod_told_pre: 'Si algo que añadió se retira o se cambia, se lo decimos, con el motivo. El mensaje indica de qué se trataba y en qué se basó la decisión. Lo encontrará en sus'
  mod_told_link: 'mensajes'
  mod_told_post: '.'
  mod_appeal_h: 'Si no está de acuerdo'
  mod_appeal_pre: 'Responda a ese mensaje y un curador lo lee. Si prefiere hacerlo fuera de la cuenta, o ya no tiene una, escríbanos por la'
  mod_appeal_link: 'página de contacto'
  mod_appeal_post: '. Una decisión no es definitiva por haberse tomado una vez; un curador que se equivocó puede deshacerla.'
  mod_report_h: 'Denunciar algo'
  mod_report_pre: 'Cualquiera puede denunciar contenido, con o sin cuenta. Use la'
  mod_report_link: 'página de contacto'
  mod_report_post: ', o el enlace para denunciar en la propia foto. Confirmamos cada denuncia y te decimos qué decidimos. Las fotos tienen su propio enlace en cada página de foto.'
  h12_governing: 'Ley aplicable'
  governing_body: 'Estas condiciones se rigen por el Derecho de <b>los Países Bajos</b>. Los litigios se someterán a los tribunales neerlandeses competentes, salvo que la normativa imperativa de consumo te reconozca otros derechos.'
  h13_changes: 'Cambios'
  changes_body: 'Podemos actualizar estas condiciones; publicaremos los cambios aquí con una fecha nueva. Seguir usando el Commons después de un cambio significa que aceptas las condiciones actualizadas.'
  h14_contact: 'Contacto'
  contact_pre: 'Preguntas sobre estas condiciones:'
  contact_post: '.'
  footer_disc_pre: 'Consulta también nuestro'
  footer_disc_privacy: 'aviso de privacidad'
  footer_disc_mid: 'y las'
  footer_disc_licences: 'licencias'
  footer_disc_post: ' de los datos, los medios, las traducciones de la interfaz y el código.'
licenses:
  kicker: 'Licencias'
  title: 'La versión corta.'
  lead: 'En lenguaje claro, para que sepas qué puedes hacer. Cuatro licencias — una para los <b>datos</b>, otra para los <b>medios</b>, otra para las <b>traducciones de la interfaz</b> y otra para el <b>código</b>: los datos, los medios y las traducciones de la interfaz son abiertos, el código es source-available.'
  can_h: 'Puedes'
  must_h: 'Debes'
  data_h: 'Los datos'
  data_sub: 'Open Database License 1.0 (ODbL) · contenidos DbCL 1.0'
  data_tldr: 'Usa los datos para lo que quieras — productos comerciales incluidos — siempre que cites la fuente, devuelvas cualquier base de datos mejorada bajo la misma licencia y la mantengas abierta. El mismo trato que OpenStreetMap.'
  data_can1: 'Usarlos, copiarlos y compartirlos — gratis'
  data_can2: 'Adaptarlos y crear productos sobre ellos'
  data_can3: 'Usarlos con fines comerciales'
  data_must1_b: 'Atribuir'
  data_must1_body: '— cita a Cycling Commons y a la fuente de la que provienen los datos: OpenStreetMap y los demás conjuntos de datos abiertos que importamos, cada uno <a href="%url%">listado con su licencia</a>.'
  data_must2_b: 'Compartir igual'
  data_must2_body: '— publica cualquier base de datos adaptada bajo ODbL'
  data_must3_b: 'Mantenerlos abiertos'
  data_must3_body: '— sin DRM ni bloqueos sobre los datos'
  media_h: 'Los medios'
  media_sub: 'Creative Commons Reconocimiento-CompartirIgual 4.0 (CC BY-SA 4.0)'
  media_tldr: 'Usa las fotos y los vídeos para lo que quieras — también con fines comerciales — si citas a su autor y al Commons y publicas cualquier adaptación bajo la misma licencia.'
  media_can1: 'Usarlos, copiarlos y compartirlos — gratis'
  media_can2: 'Adaptarlos, recortarlos y remezclarlos'
  media_can3: 'Usarlos con fines comerciales'
  media_must1_b: 'Atribuir'
  media_must1_body: '— cita al autor y a Cycling Commons'
  media_must2_b: 'Compartir igual'
  media_must2_body: '— publica las adaptaciones bajo CC BY-SA 4.0'
  ui_h: 'Las traducciones de la interfaz'
  ui_sub: 'Creative Commons Reconocimiento-CompartirIgual 4.0 (CC BY-SA 4.0)'
  ui_tldr: 'Usa las traducciones de la interfaz enviadas desde el sitio para lo que quieras — también con fines comerciales — si citas al Commons (y al traductor cuando figure) y publicas cualquier adaptación bajo la misma licencia. No son los archivos de locale que los desarrolladores entregan en git.'
  ui_can1: 'Usarlas, copiarlas y compartirlas — gratis'
  ui_can2: 'Adaptarlas y remezclarlas'
  ui_can3: 'Usarlas con fines comerciales'
  ui_must1_b: 'Atribuir'
  ui_must1_body: '— cita a Cycling Commons, y al traductor si figura'
  ui_must2_b: 'Compartir igual'
  ui_must2_body: '— publica las adaptaciones bajo CC BY-SA 4.0'
  code_h: 'El código'
  code_sub: 'PolyForm Shield License 1.0.0 · source-available'
  code_tldr: 'Lee, ejecuta, modifica y construye sobre el código de Cycling Commons con cualquier finalidad — salvo operar un producto que compita con Cycling Commons. Un atlas para senderistas, corredores o piragüistas es justo para lo que está aquí este código. ¿Construyes para ciclistas? Construye entonces sobre los datos abiertos y la API — gratis para cualquier uso, comercial incluido.'
  code_can1: 'Leer, ejecutar y modificar el código — gratis'
  code_can2: 'Adaptarlo a un uso que no compita (por ejemplo, otro deporte)'
  code_can3: 'Autoalojarlo y devolver mejoras'
  code_must1_b: 'No competir'
  code_must1_body: '— ningún producto que compita con Cycling Commons'
  code_must2_b: 'Conservar los avisos'
  code_must2_body: '— mantén la licencia y el Aviso Obligatorio'
