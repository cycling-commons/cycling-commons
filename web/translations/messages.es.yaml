  cat_suggest2_h: '¿Por qué saldrías a rodar?'
  cat_suggest2_p: 'Estas capas crecen con la comunidad — propón una que todavía no hayamos cartografiado.'
  how_kicker: 'CÓMO CRECE'
  scout_kicker: 'El registrador de campo'
  scout_h: 'Scout — márcalo mientras ruedas'
  scout_p: 'Casi todo lo que sabe el Commons empezó como algo que alguien vio al pasar. Scout es el registrador de un toque que lo captura: peligros, cortes, cambios de firme y fuentes, escritos directamente en tu archivo de ruta. Garmin ya, Android muy pronto.'
  scout_cta: 'Descubre Scout'
  how_h2: 'Un grifo cada vez.'
  how_step1_no: '01 / DETECTA'
  how_step1_h: 'Detecta algo'
  how_step1_p: 'Un grifo, una carretera cortada, una vista por la que merece la pena parar — de esas cosas que solo sabe quien estuvo allí.'
  how_step2_no: '02 / APORTA'
  how_step2_h: 'Un toque o un voto'
  how_step2_p: 'Confirmar lo que ya está es un toque, y votar también. Añadir algo nuevo pasa por un formulario breve — en cualquier caso el mapa crece a trocitos.'
  how_step3_no: '03 / EXPLORA'
  how_step3_h: 'Todo el mundo explora'
  how_step3_p: 'Toda la comunidad — y cualquiera que construya sobre los datos abiertos — se lleva un mapa mejor.'
  cta_band_h2: 'El mapa es de todos.'
  cta_band_map: 'Explorar el mapa'
  cta_band_account: 'Crear una cuenta gratuita'
join:
  kicker: 'Participa'
  title: 'Construye el Commons con nosotros.'
  lead1: 'Cycling Commons lo construye la gente que lo usa — en código, en conocimiento local y en todo lo que hay alrededor. Es pronto, está abierto y hay sitio para ti.'
  lead2: 'Un bien común no crece contratando; crece porque la gente aparece. Aquí es donde hacen falta manos.'
  heart_kicker: 'El corazón del asunto'
  heart_h2: 'Ciclistas y conocimiento local.'
  heart_lead: 'El Commons vale lo que vale lo que saben los ciclistas: el puerto que merece el rodeo, dónde está el agua, el cruce que muerde, el circuito que es discretamente perfecto. Ese conocimiento es la razón de ser — y es lo único que nadie puede construir por ti.'
  hnote_b: 'Nota honesta — qué funciona ya y qué no.'
  hnote_body: 'Las aportaciones son reales: lo que añades va a un curador y, en cuanto pasa, está en el mapa para todo el mundo. Lo que <i>todavía</i> no funciona es la votación estacional y la API pública. Por dónde empezar:'
  howto1_b: 'Cartografía hechos objetivos en OpenStreetMap.'
  howto1_body_pre: 'Puntos de agua, estaciones de reparación, firmes — añádelos a'
  howto1_body_post: ' ya. Construimos sobre OSM y le devolvemos lo que aportamos, así que fluye hacia el Commons. Aquí no hace falta nada.'
  howto2_b: 'Añade aquí lo que sabes.'
  howto2_body_pre: 'Abre'
  howto2_themap: 'el mapa'
  howto2_mid1: ' y mejora un lugar, o ve directamente a'
  howto2_addclimb: 'añadir un puerto'
  howto2_mid2: '. Un curador lee todos los envíos. Allí donde el proceso no encaje con la forma en que tú introducirías tus datos,'
  howto2_email: 'escríbenos'
  howto2_mid3: ' — o'
  howto2_issue: 'abre una incidencia'
  howto2_post: '— eso es lo que da forma a la siguiente ronda.'
  howto3_b: 'Añade un lugar que conozcas.'
  howto3_link: 'Elige una categoría y ponlo en el mapa'
  howto3_post: ' — un punto de agua, un peligro, un mirador, un alojamiento que acoja bien a los ciclistas. Un curador lo lee antes de que lo vea nadie más.'
  howto4_b: 'Cuida tu propia zona.'
  howto4_link: 'Mira qué regiones necesitan un curador'
  howto4_post: ' — o pide un país al que el Commons todavía no ha llegado. Las dos cosas empiezan en la misma página.'
