  terms_reference: '<b>Elementos de referencia</b>: la base que seguimos en cada zona, recogida de OpenStreetMap. Esta capa es OSM de arriba abajo; los datos de otras fuentes se importan como elementos del catálogo, donde conservan su propia procedencia.'
  terms_catalog: '<b>Elementos del catálogo</b>: lo que el Commons cura por sí mismo, con sus propios atributos, historial y confirmaciones. La segunda línea dice de dónde salieron esas filas: <b>OSM</b> replicado de OpenStreetMap, <b>socio</b> importado de un conjunto de datos abierto que mantiene otra persona, <b>ciclistas</b> aportado aquí, <b>derivado</b> calculado por la canalización.'
  terms_bars: '<b>Por %u%</b>: densidad sobre el área incorporada, para que un país pequeño quede junto a uno grande de forma justa. La barra es esa misma cifra, escalada frente al país más denso.'
