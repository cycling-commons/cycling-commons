about:
  kicker: 'Quiénes somos'
  title: 'El mapa es de todos.'
  lead1: 'Cada ciclista lleva encima un mapa privado: la fuente que salvó un julio abrasador, el puerto que merece la hora extra, la carretera secundaria que por alguna razón siempre está vacía. Hoy ese conocimiento vive en una sola cabeza y ahí muere. Cycling Commons es donde vive en su lugar.'
  lead2: 'Es un mapa abierto, construido por la comunidad, de lo mejor que se puede rodar en el mundo — para todas las formas de ciclismo. Datos abiertos que cualquiera puede usar, gobernados por los ciclistas que los construyen.'
  problem_kicker: 'El problema'
  problem_title: 'Una aplicación distinta para cada cosa.'
  problem_lead1: 'Los puertos en una aplicación, las rutas en otra, dónde dormir en una tercera, el estado de la carretera en ninguna — casi todo cerrado y nada conectado entre sí. Los ciclistas pagan una docena de herramientas y aun así no ven el conjunto. El conocimiento existe; solo está disperso y bajo llave.'
  problem_lead2: 'El Commons reúne el conocimiento no personal — el mapa, nunca el ciclista — en un único lugar abierto. Libre de consultar, libre de exportar, libre de construir encima, para cualquiera.'
  believe_kicker: 'En qué creemos'
  believe_princ1_num: 'I'
  believe_princ1_title: 'El mapa, no el ciclista.'
  believe_princ1_body: 'Datos abiertos sobre lugares, no sobre personas — el Commons no recoge nada sobre cómo, dónde ni cuándo ruedas.'
  believe_princ2_num: 'II'
  believe_princ2_title: 'Abierto para todo el mundo.'
  believe_princ2_body: 'Datos ODbL, medios CC BY-SA y una API gratuita — utilizables por cualquiera, con fines comerciales o no.'
  believe_princ3_num: 'III'
  believe_princ3_title: 'Curaduría, no saturación.'
  believe_princ3_body: 'Lo mejor de cada región, votado por los ciclistas, no un vertido interminable.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Gobernado, no solo publicado.'
  believe_princ4_body: 'Construido sobre los principios de Elinor Ostrom para los bienes comunes que no se hunden ni acaban capturados.'
  believe_ostrom: 'ganó el Premio Nobel de Economía en 2009 por demostrar que una comunidad puede gobernar un recurso compartido de forma sostenible — sin privatizarlo y sin un propietario central — cuando se dan unos cuantos principios de diseño: límites claros, reglas fijadas por quienes se ven afectados, seguimiento y sanciones graduales. El Cycling Commons los aplica; la'
  believe_ostrom_link: 'página de gobernanza'
  believe_ostrom_suffix: 'relaciona cada principio con una parte del sistema.'
  partners_kicker: 'Socios, no silos'
  partners_title: 'Donde ya existen buenos datos abiertos, nos sumamos.'
  partners_lead1_pre: 'El Commons no está aquí para reconstruir lo que otros ya han abierto. Construimos sobre'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'y le devolvemos lo que aportamos. Y para las capas que no son nuestras — como los alojamientos que acogen bien a los ciclistas — preferimos'
  partners_lead1_partner: 'aliarnos con comunidades abiertas'
  partners_lead1_post: ', como las redes de hospitalidad abierta, antes que encerrar una copia privada de sus datos.'
  partners_lead2: 'Los datos abiertos deberían conectarse, no fragmentarse más. Cada alianza enriquece el atlas entero sin que nadie lo cerque.'
  steward_kicker: 'Quién lo gestiona'
  steward_title: 'BikeCoders hoy — una fundación mañana.'
  steward_lead: 'BikeCoders siembra y gestiona el Commons hoy. Pero el compromiso es público desde el primer día: licencia abierta, datos y cuentas separados, y un camino hacia una fundación independiente en cuanto haya una comunidad que lo gobierne. La licencia abierta y la titularidad separada hacen difícil que más adelante alguien lo cerque en silencio.'
  steward_cta_map: 'Explorar el mapa →'
  steward_cta_account: 'Crear una cuenta gratuita'
privacy:
  kicker: 'Privacidad'
  title: 'Qué recogemos y por qué.'
  lead: 'En lenguaje claro. El conjunto de datos de Cycling Commons no es personal: son geodatos abiertos sobre lugares, nunca sobre personas. La <b>cuenta de la plataforma</b> es otra cosa: contiene datos personales (correo electrónico, credenciales, registros de sesión). Esto es lo que guardamos, por qué, y el control que tienes sobre ello.'
  last_updated: 'Última actualización: 1 de agosto de 2026'
  h_responsible: 'Quién es el responsable'
  responsible_p1_pre: 'El responsable del tratamiento es'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', con sede en los Países Bajos, que gestiona hoy el Cycling Commons. Como se explica en nuestra'
  responsible_p1_governance: 'gobernanza'
  responsible_p1_post: ', el Commons se ha comprometido a constituirse como fundación neerlandesa independiente; el responsable cambiará en consecuencia y esta página se actualizará.'
  responsible_p2_pre: 'Preguntas sobre tus datos:'
  responsible_p2_mid: '. También tienes derecho a presentar una reclamación ante la autoridad de control neerlandesa, la'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  h_collect: 'Qué recogemos'
  collect_intro: 'Pedimos el mínimo necesario para mantener un mapa abierto y responsable. Nunca te pedimos tu nombre real.'
  h3_account: 'Cuando creas una cuenta'
  collect_account_email: 'Tu <b>dirección de correo electrónico</b> — para iniciar sesión, proteger la cuenta y enviarte los mensajes de servicio imprescindibles.'
  collect_account_password: 'Una <b>contraseña</b>, que guardamos solo como hash con sal — nunca vemos ni conservamos el texto en claro.'
  collect_account_displayname: 'Un <b>nombre público</b> que eliges tú — puede ser un seudónimo, y es lo único que ven los demás.'
  collect_account_2fa: 'Si activas la <b>autenticación en dos factores (2FA)</b>, guardamos el secreto TOTP <b>cifrado en reposo</b>, y tus códigos de respaldo solo como hashes.'
  collect_account_base: 'Una <b>ubicación base</b> opcional — un punto a escala de municipio (precisión de ~1 km) y un radio de rodaje, si lo configuras. Se usa solo para acotar tu propia vista del mapa; nunca se muestra a otros ciclistas y nunca forma parte del conjunto de datos del Commons.'
  h3_contribute: 'Cuando aportas algo'
  collect_contribute_items: 'Los <b>puertos, lugares, correcciones y votos</b> que envías, y el hecho de que los hizo una cuenta (procedencia). Si tu perfil es privado, tus aportaciones se mantienen anónimas.'
  collect_contribute_media: 'Las <b>fotos o vídeos</b> que subas. Los archivos pueden llevar metadatos incrustados (EXIF), como el lugar de captura — por nuestra parte eliminamos los metadatos de ubicación de todo lo que se sube.'
  collect_contribute_profile: 'Los datos opcionales de perfil público que rellenes (biografía, enlaces, qué aportaciones mostrar). Los perfiles son'
  collect_contribute_profile_link: 'voluntarios'
  collect_contribute_profile_post: ' y están desactivados por defecto.'
  h3_auto: 'De forma automática, al usar el sitio'
  collect_auto_technical: '<b>Datos técnicos</b> — dirección IP, tipo de navegador y marcas de tiempo en los registros del servidor, conservados para operar y proteger el servicio.'
  banner_bold: 'Sin seguimiento de rutas.'
  banner_body: 'El Commons es un mapa de lugares, no de personas. <b>No</b> recogemos trazas GPS, tus rutas, tu ubicación en tiempo real ni ningún registro de por dónde ruedas.'
  h_why: 'Por qué lo usamos (bases jurídicas)'
  why_contract: '<b>Para prestarte la cuenta y el servicio</b> — ejecución de un contrato (art. 6.1.b del RGPD).'
  why_consent: '<b>Perfil público y visualización de medios, ambos opcionales</b> — tu consentimiento (art. 6.1.a), que puedes retirar cuando quieras en los'
  why_consent_link: 'ajustes'
  why_consent_post: '.'
  why_legitimate: '<b>Seguridad, prevención de abusos y analítica agregada</b> — nuestro interés legítimo en mantener el Commons honesto y en funcionamiento (art. 6.1.f).'
  why_legal: '<b>Cumplimiento de obligaciones legales</b> — cuando la ley lo exige (art. 6.1.c).'
  h_cookies: 'Cookies y analítica'
  cookies_body: 'Aquí vamos ligeros. Usamos una única <b>cookie imprescindible</b> para mantener tu sesión iniciada — ninguna cookie publicitaria ni de seguimiento entre sitios. Para las estadísticas de uso alojamos nuestra propia <b>analítica</b> en nuestro servidor, en <b>analytics.bikecoders.life</b>: recibe la URL de la página, el referente, el tamaño de pantalla y el tipo de navegador, y recibe tu <b>dirección IP</b> — que es un dato personal — pero <b>no la guarda</b>. La dirección solo sirve para deducir una ubicación aproximada (país, región y ciudad) y para derivar un identificador de sesión de un solo sentido, y después se descarta. No se instala ninguna cookie de analítica, ningún visitante recibe un identificador persistente ni queda vinculado a una cuenta, y no hay seguimiento entre sitios ni entre dispositivos. Los datos de analítica permanecen en nuestra propia infraestructura y nunca se comparten ni se venden a terceros.'
  h_share: 'Con quién lo compartimos'
  share_infra: '<b>Proveedores de infraestructura</b> que nos ayudan a operar el sitio (alojamiento y, para el mapa, los proveedores de teselas e imágenes de calle, como la CDN de la biblioteca de mapas y Mapillary). Pueden tratar tu dirección IP para entregar el contenido. Para esa entrega actúan como encargados nuestros o como responsables independientes.'
  share_osm_pre: 'OpenStreetMap — las aportaciones que decidas devolver pasan a formar parte del mapa abierto bajo la'
  share_osm_link: 'ODbL'
  share_osm_post: '. Eso son datos públicos y abiertos, no datos personales sobre ti.'
  share_noone: '<b>Con nadie más.</b> No vendemos datos personales y no usamos seguimiento publicitario de terceros.'
  h_transfers: 'Transferencias internacionales'
  transfers_body: 'Algunos proveedores de infraestructura pueden tratar datos fuera del Espacio Económico Europeo. Cuando lo hacen, nos apoyamos en garantías adecuadas — como las Cláusulas Contractuales Tipo de la Comisión Europea o una decisión de adecuación.'
  h_retention: 'Cuánto tiempo lo conservamos'
  retention_account: '<b>Datos de la cuenta</b> — mientras la cuenta esté abierta, más un breve periodo de gracia tras cerrarla.'
  retention_logs: '<b>Registros del servidor</b> — se conservan <b>30 días</b> y después se eliminan automáticamente. Contienen direcciones IP: un servidor web anota la dirección de quien visita en sus entradas de error y no ofrece ninguna opción para omitirla, así que ese plazo es el límite real, no una promesa sobre el contenido.'
  retention_contributions: '<b>Aportaciones</b> — los hechos que devuelves al mapa abierto permanecen como parte del Commons (con su procedencia), incluso después de que te vayas; no son datos personales sobre ti.'
  retention_consent: '<b>Consentimientos de licencia</b> — cuando licencias una foto al Commons registramos que aceptaste, el texto exacto que aceptaste y cuándo. Ese registro lo conservamos indefinidamente y sobrevive al cierre de tu cuenta: es nuestra prueba de que la licencia se concedió, y podemos necesitarla para formular o defender reclamaciones (art. 17.3.e). Contiene una referencia a la cuenta y nada más sobre ti, y una vez desaparecida la cuenta esa referencia ya no identifica a nadie aquí.'
  h_rights: 'Tus derechos'
  rights_intro: 'El RGPD te reconoce los siguientes derechos:'
  rights_access: '<b>Acceso (art. 15)</b> — solicitar una copia de los datos personales que tenemos sobre ti.'
  rights_correct: '<b>Rectificación (art. 16)</b> — corregir lo que sea inexacto o completar lo que falte.'
  rights_erase: '<b>Supresión (art. 17)</b> — borra tu cuenta cuando quieras desde los ajustes. Tus datos personales se van con ella y no vuelven. Dos cosas sobreviven deliberadamente, y ninguna te identifica después: las aportaciones que hiciste al mapa abierto y el registro de que concediste una licencia de foto. Ambas se describen arriba, en <b>Cuánto tiempo lo conservamos</b>.'
  rights_portability: '<b>Portabilidad (art. 20)</b> — descarga todo lo que tenemos sobre ti en un único archivo ZIP, cuando quieras, desde los ajustes de tu cuenta. Incluye los datos de la cuenta, tus aportaciones, tus mensajes, tus consentimientos de licencia y tus fotos como archivos.'
  rights_restrict: '<b>Limitación y oposición (arts. 18 a 21)</b> — limitar determinados tratamientos u oponerte a ellos.'
  rights_withdraw: '<b>Retirar el consentimiento</b> en cualquier momento (por ejemplo, desactivando tu perfil público) — esto no afecta al tratamiento ya realizado.'
  rights_third_party_photo: '<b>¿No tienes cuenta?</b> Estos derechos no dependen de tenerla. Si eres reconocible en una foto de nuestro mapa, cada página de foto lleva un enlace <b>«esta foto me muestra a mí»</b> — repórtalo ahí, sin cuenta y sin identificarte, y un curador responde en el plazo de un mes.'
  rights_contact_pre: 'Para ejercer cualquiera de ellos, escribe a'
  rights_contact_mid: '. Responderemos en el plazo de un mes. Si nuestra respuesta no te satisface, puedes reclamar ante la'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Menores'
  children_body: 'El Commons no está destinado a menores de <b>16</b> años. No recogemos a sabiendas datos personales de nadie por debajo de esa edad; si crees que un menor nos ha facilitado datos, escríbenos y los borraremos.'
  h_automated: 'Decisiones automatizadas'
  automated_body: 'No tomamos decisiones sobre ti por medios exclusivamente automatizados, y no elaboramos perfiles con fines publicitarios.'
  h_changes: 'Cambios en esta política'
  changes_body: 'Si cambiamos la forma en que tratamos los datos, actualizaremos esta página y su fecha y — cuando el cambio sea sustancial — avisaremos a los colaboradores con sesión iniciada.'
  footer_disc_pre: 'Consulta también nuestras'
  footer_disc_terms: 'Condiciones de uso'
  footer_disc_mid: 'y las'
  footer_disc_licences: 'licencias'
  footer_disc_post: ' de los datos, los medios y el código.'
terms:
  kicker: 'Condiciones de uso'
  title: 'El acuerdo, en lenguaje claro.'
  lead: 'Estas condiciones regulan el uso del sitio web y de la cuenta de Cycling Commons, en lenguaje claro.'
  last_updated: 'Última actualización: 1 de agosto de 2026'
  h1_accepting: 'Aceptación de estas condiciones'
  accepting_p1_pre: 'Al usar el sitio web de Cycling Commons o crear una cuenta, aceptas estas condiciones y nuestro'
  accepting_p1_privacy: 'aviso de privacidad'
  accepting_p1_mid: '. Si no estás de acuerdo, no uses el servicio. El Commons lo opera'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' en los Países Bajos, camino de una fundación independiente como se describe en nuestra'
  accepting_p1_governance: 'gobernanza'
  accepting_p1_post: '.'
  h2_who: 'Quién puede usarlo'
  who_body: 'Necesitas tener al menos <b>16</b> años para crear una cuenta. La información que nos facilites (como tu correo electrónico) debe ser exacta y de tu titularidad.'
  h3_account: 'Tu cuenta'
  account_password: 'Guarda bien tu contraseña; eres responsable de la actividad realizada con tu cuenta.'
  account_unauthorised: 'Avísanos sin demora si sospechas de un acceso no autorizado.'
  account_suspend: 'Podemos suspender o cerrar cuentas usadas para abusar del servicio o incumplir estas condiciones.'
  h4_using: 'Usarlo bien'
  using_intro: 'El Commons funciona porque la gente lo usa de buena fe.'
  using_no_illegal: 'No infrinjas la ley, no acoses a nadie y no publiques contenido ilícito, engañoso o dañino.'
  using_no_personal: 'No subas <b>datos personales de otras personas</b> (por ejemplo, personas identificables en fotos) sin una base adecuada — el Commons cartografía lugares, no personas.'
  using_no_reidentify_pre: 'No intentes reidentificar a los colaboradores ni socavar el'
  using_no_reidentify_link: 'límite de captación'
  using_no_reidentify_post: ' del proyecto, que es lo que mantiene fuera los datos personales.'
  using_no_scrape_pre: 'No hagas scraping del servicio. Punto — la'
  using_no_scrape_link: 'API y la exportación masiva'
  using_no_scrape_post: ' son la forma de obtener los datos. Ninguna de las dos está activa todavía, así que hasta entonces escribe a info@cyclingcommons.org y te daremos lo que necesites.'
  using_no_disrupt: 'No interrumpas el servicio ni intentes esquivar sus límites.'
  h5_contributions: 'Tus aportaciones'
  contributions_p1_pre: 'Conservas la autoría de lo que aportas. Para que el Commons pueda ser abierto, concedes las licencias de nuestras'
  contributions_p1_link: 'condiciones para colaboradores'
  contributions_p1_mid: ': los <b>datos</b> se incorporan al Commons bajo la'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', y los <b>medios</b> (fotos, vídeo) bajo'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Confirmas que tienes derecho a aportar lo que envías, que no vulnera derechos de terceros y que no son datos personales de otras personas.'
  h6_opendata: 'Datos abiertos y API'
  opendata_pre: 'Los datos y los medios del Commons son de uso libre para cualquiera — también con fines comerciales — bajo sus'
  opendata_link: 'licencias'
  opendata_mid: ', citando la fuente. Consulta la'
  opendata_dev_link: 'documentación para desarrolladores'
  opendata_post: ' para la línea de atribución, y para la API y la exportación masiva tal como se están diseñando — ninguna de las dos está activa todavía.'
  h7_code: 'Nuestro código y nuestra marca'
  code_pre: 'El código fuente de la plataforma es <b>source-available</b> bajo la'
  code_link: 'PolyForm Shield License 1.0.0'
  code_post: ' — úsalo para lo que quieras, salvo para operar un producto que compita con Cycling Commons. El nombre y el logotipo «Cycling Commons» no se licencian para usos que sugieran respaldo o vinculación.'
  h8_preview: 'Una intención, no una garantía'
  preview_body: 'Cycling Commons es una intención, <b>no</b> una garantía. No dependas de él para la navegación, el estado de las carreteras ni tu seguridad — usa siempre tu propio criterio cuando ruedes.'
  h9_warranty: 'Sin garantías'
  warranty_body: 'El servicio se presta <b>«tal cual»</b> y «según disponibilidad», sin garantías de ningún tipo, en la máxima medida que permita la ley. No garantizamos que sea exacto, ininterrumpido ni libre de errores.'
  h10_liability: 'Responsabilidad'
  liability_body: 'En la máxima medida permitida por el Derecho neerlandés, BikeCoders no responde de los daños indirectos o consecuentes derivados de tu uso del Commons. Nada en estas condiciones limita la responsabilidad que la ley no permite limitar.'
  h11_suspension: 'Suspensión y finalización'
  suspension_pre: 'Puedes cerrar tu cuenta cuando quieras en los'
  suspension_link: 'ajustes'
  suspension_post: '. Podemos suspender o retirar el acceso si se incumplen estas condiciones o para proteger el Commons o a sus usuarios.'
  suspension_p2: 'Antes de irte puedes <b>descargar todo lo que tenemos sobre ti</b> en un único archivo ZIP desde esa misma página. Cerrar la cuenta elimina tus datos personales. Dos cosas se quedan, y ninguna te nombra después: las aportaciones que hiciste al mapa abierto y el registro de que concediste una licencia de foto, que conservamos como prueba de que la licencia existe. Las fotos que se hubieran aprobado siguen en el Commons bajo CC BY-SA 4.0, y al marcharte eliges si mantienen tu nombre o pasan a ser anónimas.'
  h12_governing: 'Ley aplicable'
  governing_body: 'Estas condiciones se rigen por el Derecho de <b>los Países Bajos</b>. Los litigios se someterán a los tribunales neerlandeses competentes, salvo que la normativa imperativa de consumo te reconozca otros derechos.'
  h13_changes: 'Cambios'
  changes_body: 'Podemos actualizar estas condiciones; publicaremos los cambios aquí con una fecha nueva. Seguir usando el Commons después de un cambio significa que aceptas las condiciones actualizadas.'
  h14_contact: 'Contacto'
  contact_pre: 'Preguntas sobre estas condiciones:'
  contact_post: '.'
  footer_disc_pre: 'Consulta también nuestro'
  footer_disc_privacy: 'aviso de privacidad'
  footer_disc_mid: 'y las'
  footer_disc_licences: 'licencias'
  footer_disc_post: ' de los datos, los medios y el código.'
licenses:
  kicker: 'Licencias'
  title: 'La versión corta.'
  lead: 'En lenguaje claro, para que sepas qué puedes hacer. Tres licencias — una para los <b>datos</b>, otra para los <b>medios</b> y otra para el <b>código</b>: los datos y los medios son abiertos, el código es source-available.'
  can_h: 'Puedes'
  must_h: 'Debes'
  data_h: 'Los datos'
  data_sub: 'Open Database License 1.0 (ODbL) · contenidos DbCL 1.0'
  data_tldr: 'Usa los datos para lo que quieras — productos comerciales incluidos — siempre que cites la fuente, devuelvas cualquier base de datos mejorada bajo la misma licencia y la mantengas abierta. El mismo trato que OpenStreetMap.'
  data_can1: 'Usarlos, copiarlos y compartirlos — gratis'
  data_can2: 'Adaptarlos y crear productos sobre ellos'
  data_can3: 'Usarlos con fines comerciales'
  data_must1_b: 'Atribuir'
  data_must1_body: '— cita a Cycling Commons y a la fuente de la que provienen los datos: OpenStreetMap y los demás conjuntos de datos abiertos que importamos, cada uno <a href="%url%">listado con su licencia</a>.'
  data_must2_b: 'Compartir igual'
  data_must2_body: '— publica cualquier base de datos adaptada bajo ODbL'
  data_must3_b: 'Mantenerlos abiertos'
  data_must3_body: '— sin DRM ni bloqueos sobre los datos'
  media_h: 'Los medios'
  media_sub: 'Creative Commons Reconocimiento-CompartirIgual 4.0 (CC BY-SA 4.0)'
  media_tldr: 'Usa las fotos y los vídeos para lo que quieras — también con fines comerciales — si citas a su autor y al Commons y publicas cualquier adaptación bajo la misma licencia.'
  media_can1: 'Usarlos, copiarlos y compartirlos — gratis'
  media_can2: 'Adaptarlos, recortarlos y remezclarlos'
  media_can3: 'Usarlos con fines comerciales'
