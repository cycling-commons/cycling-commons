developers:
  kicker: 'Construye sobre el Commons'
  title: 'Datos abiertos. Una API abierta. Para que cualquiera construya encima.'
  lead: 'Consulta el Commons por zona y tipo, integra nuestras teselas vectoriales en tu propio estilo de mapa o autoalójalo a partir de la exportación masiva periódica y gratuita. Los datos son abiertos (ODbL) — eso es lo que lo convierte en un bien común. El acceso es autoservicio: clave gratuita, capa gratuita y cuotas de pago solo para usos intensivos que necesiten datos siempre frescos.'
  status: 'En diseño — estos endpoints son el contrato que estamos construyendo. Consulta la <a href="/developers/api">referencia interactiva de la API</a> o la <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">especificación en GitHub</a>.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/search'
  ep1_desc: 'buscar cobertura por <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'un elemento — nuestro enriquecimiento, procedencia y verificación (<code>?hydrate=osm</code>)'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'polígono de la región + estadísticas de cobertura'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'lo mejor de una región'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'detalle de la ruta + descarga en GPX'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'teselas vectoriales con clave + TileJSON — intégralas en tu propio estilo de MapLibre'
  ep7_path: '/v1/contributions'
  ep7_desc: 'aportar — previsto (fase 2), llega a la cola de revisión'
  ex_kicker: 'Ejemplo de petición'
  resp_kicker: 'Respuesta'
  ex_hydrate: 'Por defecto, las respuestas son solo de referencia: nuestros campos añadidos más el <code>osm_ref</code> con el que hidratar contra OSM. <code>?hydrate=osm</code> fusiona por ti nuestro subconjunto de OSM en caché.'
  attr_kicker: 'Atribución obligatoria'
  rules_kicker: 'Las reglas'
  rules_body: '<b>Autoservicio y uso razonable.</b> Las lecturas usan una clave gratuita de autoservicio con una cuota mensual gratuita; las capas de pago añaden capacidad y datos siempre frescos para usos intensivos. Para uso masivo o sin conexión, coge la <b>exportación periódica gratuita</b> y autoalójala en lugar de machacar la API en vivo — hacer scraping del servicio no está permitido. <b>Las escrituras están previstas (fase 2)</b> y pasarán por la misma revisión que las aportaciones hechas dentro de la aplicación. Licencias: datos <b>ODbL 1.0</b>, medios <b>CC BY-SA 4.0</b> — atribuye, comparte igual, mantenlo abierto; el uso comercial está bien. Consulta el resumen en lenguaje claro:'
