    media_takedown_declined: 'Un curador ha revisado tu solicitud de retirada y no ha encontrado un motivo de datos personales sobre el que actuar, así que la foto vuelve a estar publicada. Si te hemos entendido mal — sobre todo si sales tú en la foto — responde a este mensaje o escribe a info@cyclingcommons.org y lo revisaremos otra vez.'
    media_removed_on_report: 'Se ha retirado una de tus fotos tras un informe que decía que muestra a una persona identificable que no dio su permiso para publicarla. Esto va de esa imagen concreta, no de tu aportación — gracias por ella. No podemos decirte quién lo informó, ni en un sentido ni en el otro: a esa persona tampoco se le dijo quién la había subido. Si crees que la retirada está mal, responde a este mensaje y un curador lo leerá.'
