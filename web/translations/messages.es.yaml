    media_hidden_pending_review: 'Alguien ha informado sobre una de tus fotos y, por lo que dice el informe, la hemos ocultado del mapa de inmediato mientras un curador la revisa. Oculta no es retirada: la foto sigue siendo tuya, sigue almacenada y no se ha borrado nada. Si el informe no se sostiene, vuelve en unos días y te lo diremos. Solo un curador puede retirar una foto, nunca un informe por sí solo — y no podemos decirte quién lo hizo, igual que a esa persona no se le dijo quién la había subido.'
    media_restored_after_review: 'El informe sobre tu foto no se ha sostenido, así que vuelve a estar en el mapa exactamente como estaba. Gracias por tu paciencia — ocultarla primero es como nos aseguramos de que una queja auténtica nunca se quede publicada durante días, y eso hace que alguna foto de vez en cuando desaparezca un tiempo para nada.'
