  playbook_email:
    title: 'Protocolo: solicitudes de cambio de correo'
    why: 'El correo es de solo lectura en los ajustes, así que toda solicitud de cambio aterriza en el buzón de soporte. Verifica el control de los anclajes existentes de la cuenta antes de tocar nada — el propio correo de la solicitud no prueba nada.'
    s1_t: 'Nunca te fíes del correo de la solicitud'
    s1_b: 'Las cabeceras From se pueden falsificar, y «escribo desde mi dirección nueva porque perdí la antigua» es el arranque estándar de un secuestro de cuenta. El nombre público, las aportaciones y la fecha de alta son públicos — conocerlos no prueba nada.'
    s2_t: 'Anclaje 1 — el buzón antiguo'
    s2_b: 'Responde a la dirección que consta en el registro (escrita desde este panel, nunca con responder-a) con un código de un solo uso y exige que te lo devuelvan. Si puede recibir ahí, el cambio es de bajo riesgo.'
    s3_t: 'Anclaje 2 — una sesión iniciada'
    s3_b: '¿Dice que el buzón antiguo está muerto? Dicta una acción dentro de la cuenta («pon tu radio de rodaje en 120 km», «pega este código en tu nombre público durante una hora») y verifica que ha ocurrido. Eso prueba la contraseña — y el factor 2FA en las cuentas que lo tengan.'
    s4_t: 'Sin ningún anclaje = rechazar'
    s4_b: 'No puede recibir en la dirección antigua Y no puede iniciar sesión: no hay forma honesta de distinguir al titular del atacante. La respuesta segura es «crea una cuenta nueva». Rechazar aquí es justo el sentido del flujo manual, no un fallo de soporte.'
    s5_t: 'Después de verificar, cúbrete igualmente'
    s5_b: 'Avisa a la dirección antigua con una ventana para impugnar («esto no he sido yo»), retrasa la ejecución 48-72 h y deja constancia del cambio con una nota de auditoría en la ficha del usuario.'
    rule: 'La urgencia es una señal de alarma, nunca un motivo para saltarse un paso — el titular legítimo sobrevive a un retraso de 48 horas; la ventana del atacante normalmente no.'
    spec: 'Versión canónica: docs/specs/account-and-auth.md §8 «Support playbook» — mantén ambas sincronizadas.'
  settings:
    title: 'Configuración del sistema'
    intro: 'Las cifras editoriales con las que funciona el sitio. Un cambio surte efecto en la siguiente petición — sin despliegue, sin reinicio. Cada cambio queda registrado en el historial de actividad con su valor anterior y el nuevo.'
    infra_note: 'Los valores de infraestructura (teselas de cobertura, la URL del manifiesto, el host de la Content-Security-Policy del mapa) están deliberadamente fuera de aquí: se fijan en el entorno y cambiar uno requiere un despliegue.'
