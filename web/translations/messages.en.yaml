# licence identifiers live in the template; only the prose is translated.
credits:
  kicker: 'Who we build on'
  title: 'Credits'
  lead: 'The data, software and design the Cycling Commons builds on — and the licences they come under.'
  lic_free_tiles: 'Free vector tiles'
  lic_various: 'Various open-source licences'
  lic_flags_pd: 'artwork public domain'
  data_h: 'The data'
  data_sub: 'The sources the atlas is built from'
  osm_p: 'The foundation of the atlas. Cycling infrastructure, place names and the points riders confirm all start from OpenStreetMap data, © OpenStreetMap contributors.'
  overture_p: 'Every region boundary on the atlas comes from the Overture Maps divisions theme, which conflates OpenStreetMap with geoBoundaries and carries the ISO 3166 codes the world directory is keyed on.'
  wallonia_p: 'Accommodation and points of interest for Wallonia, from the Walloon geoportal''s PIVOT database.'
  georegister_p: 'The Dutch national Georegistry, run by het Kadaster. It carries the public drinking-water tap register, created by drinkwaterkaart.nl and published by RIVM.'
  geofabrik_p: 'Regional OpenStreetMap extracts that feed the coverage pipeline.'
  drinkwater_p: 'Dutch water points link to drinkwaterkaart.nl so riders can double-check a tap before counting on it.'
  map_h: 'The map'
  map_sub: 'Rendering, tiles and search'
  maplibre_p: 'The open-source renderer that draws every map on this site.'
  openfreemap_p: 'Serves the basemap tiles (Liberty style) — free and open, no API keys.'
  protomaps_p: 'The PMTiles single-file archive format behind the coverage overlays.'
  wikimedia_p: 'Seeded climb and place photos come from Wikimedia Commons; every photo carries its own author credit and licence in the drawer.'
  wikipedia_p: 'Region pages open with a short encyclopedic lead from the local Wikipedia, fetched at build time and shown verbatim; each page links the exact article it quotes.'
  copernicus_p: 'Elevation model behind the climb gradients. "produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved". The organisations in charge of the Copernicus programme by law or by delegation do not incur any liability for any use of the Copernicus WorldDEM-30.'
  req_badge: 'required notice'
  made_by: 'Dataset made by %creator%.'
  req_legend: 'marks an attribution the licence or terms of that source legally require — the wording there is theirs, not ours, and must not be edited. Everything else on this page is a thank-you.'
  valhalla_p: 'The routing and elevation engine we run ourselves: it measures every climb profile against the Copernicus DEM and snaps the climb editor''s lines to the road network.'
  fflate_p: 'Opens Scout ride bundles in your browser, so the zip never leaves your phone.'
  redoc_p: 'Renders the public API reference, served from this site.'
  mapillary_p: 'Street-level photo coverage in the map''s street view dock.'
  esri_p: 'Satellite imagery behind the climb editor''s satellite layer.'
  photon_p: 'Search-as-you-type geocoding by komoot, also built on OpenStreetMap.'
  lic_api: 'API'
  mymemory_p: 'Machine translation. Turns a Wikipedia summary in the local language into the English place description you see on the map, always labelled auto-translated.'
  software_h: 'The software'
  software_sub: 'What the site runs on'
  symfony_p: 'The PHP framework the whole site is built with.'
  postgis_p: 'The database that stores and spatially indexes the Commons.'
  isocodes_p: 'ISO country and subdivision reference data behind the world directory.'
  oss_more_who: '…and many more'
  oss_more_p: 'The rest of what the site and its pipelines are built on. These are the direct dependencies, each under its own open-source licence.'
  design_h: 'Type & flags'
  design_sub: 'The look of the place'
  bricolage_p: 'The display face on our headings.'
  splinesans_p: 'Body and mono type across the site.'
  flags_p: 'The SVG country flags in the region directory, by Panayiotis Lipiridis and contributors.'
  android_robot_p: 'The Android robot on the Scout page is reproduced and modified from work created and shared by Google, used under the Creative Commons 3.0 Attribution License.'
  scout_p: 'Our field tagger for bike computers and phones, and the FIT reader the review page uses. A separate project with its own MIT licence, so anyone who builds on the Commons code can use Scout too.'
  lic_garmin_badge: '© Garmin · used under Garmin’s brand guidelines'
  garmin_badge_p: 'Garmin’s own badge on the Scout page, unaltered, linking to Scout in the Connect IQ Store. It is Garmin’s trademark, not covered by our licences: get it from Garmin to use it elsewhere.'
