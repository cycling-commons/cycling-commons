roadmap:
  kicker: 'Roadmap'
  title: 'What we are building next.'
  lead: 'No dates, because we would only be guessing. This is the order of work, honestly kept: what is being built now, what is decided and waiting, and what we want but have not scheduled. When something lands it leaves this page for the changelog.'
  group_now: 'Now'
  group_now_sub: 'Being built. These are the ones with someone actually on them.'
  group_next: 'Next'
  group_next_sub: 'Decided and waiting for a turn. Barring a surprise, these are what follows.'
  group_later: 'Later'
  group_later_sub: 'Wanted, not scheduled. Real intentions, no promises about when.'
  item_curator_direct: '<b>A curator''s own new place goes straight on the map.</b> A curator''s edits already skip the queue; a new place still waits in it. The wizard will ask the one question the queue asks today, whether the place is already in OpenStreetMap, and publish.'
  item_pending_notice: '<b>Tell you when a place already has a change waiting.</b> Two riders correcting the same tap should see each other''s work before they start, not after a curator does.'
  item_provider_refresh: '<b>Data providers that refresh themselves.</b> Official sources, such as a national drinking-water register, harvested on a schedule, with a Run button and a form to add a provider from the curator desk.'
  item_release_mail: '<b>The release mail.</b> You can already join the list on your settings page; nothing has been sent yet. The first mail goes out with the next release.'
  item_support_thread: '<b>A support conversation you can follow.</b> A signed-in sender keeps a copy of what they wrote, and the reply lands in their account, so a question is a thread rather than two emails.'
  item_surface_loop: '<b>Surface corrections, the whole loop.</b> A rider''s correction to a road surface reaches the tiles, and a curator can see it and undo it.'
  item_photo_link: '<b>Add a photo by link.</b> A picture already on Wikimedia Commons, added by its address: the licence is checked and the file is fetched, never hot-linked.'
  item_phone_map: '<b>The site map on a phone.</b> The pages directory is a road map that pans sideways on a phone today. It should stack into a strip map that scrolls down.'
  item_region_vote: '<b>The seasonal vote.</b> Rank a region''s climbs, stays, views and heritage, re-ranked each season. The page is a design preview today; the ballot behind it is planned.'
  item_heatmap: '<b>The ride heatmap, back on the map.</b> Hidden until riders have added enough routes for it to say something.'
  item_saved_regions: '<b>Saved regions.</b> Keep the regions you ride in a list of your own.'
  item_observations: '<b>Observations that age.</b> A closure or a condition tagged on a ride fades out on its own after a while, unless somebody confirms it again.'
  item_item_links: '<b>Links out from a place.</b> A place carries the pages that describe it, such as an official site or a wiki article.'
  item_standing: '<b>Contributor standing.</b> Riders whose work keeps being approved earn a lighter touch, such as edits going live at once, instead of being granted it by hand.'
  item_curator_room: '<b>A curators'' room.</b> A board inside the moderation desk where a curator can ask before acting, and see what others asked.'
  item_beta: '<b>A beta-tester programme.</b> Riders who want to try things before they ship, and a way to tell us what broke.'
  item_osm_giveback: '<b>Giving back to OpenStreetMap.</b> What riders confirm here, offered back upstream in a form OpenStreetMap can take.'
  item_map_a11y: '<b>Make the map usable without a mouse.</b> The honest gap in our accessibility statement: keyboard and screen-reader access to the map itself, not only to the pages around it.'
  item_route_export: '<b>Take a route with you.</b> Export to your device or your planner, and a permanent link to a view of the map.'
  item_contraflow: '<b>One-way streets a bike may ride against.</b> Contraflow cycling is common in Belgian and Dutch towns and OpenStreetMap records it. The map should show it, and a route should not send you the long way round a street you are allowed to ride up.'
  item_region_portrait: '<b>A portrait of each region.</b> The region page counts what is there. It should say what the riding is like: how hilly, how much is paved, the big climbs, the signed network, water and toilets per hundred kilometres, the routes riders recommend, and how fresh the data is.'
  item_reviews: '<b>Your own words on any place.</b> A short note under your name on a tap, a climb, a stay or a route, next to the facts: what it was like when you were there. Several riders, several notes. Not a rating, and not part of the open dataset.'
  item_roadmap_votes: '<b>Have a say in this list.</b> Vote on what matters to you, follow an item, and propose one of your own.'
  foot_shipped_pre: 'Already shipped is on the'
  foot_shipped_link: 'changelog'
  foot_shipped_mid: '. Something missing that you need? Tell us on the'
  foot_contact_link: 'contact page'
  foot_shipped_post: ' and it will be read by a person.'
changelog:
  kicker: 'Changelog'
  title: 'What is new.'
  lead: 'Every release, newest first, in plain words. The version here is the same one printed at the foot of every page, so you can always tell which one you are looking at.'
  feed_title: 'Cycling Commons: what is new'
  feed_subtitle: 'Releases of the Cycling Commons platform.'
  feed_pre: 'Follow along without an account: subscribe to the'
  feed_link: 'Atom feed'
  feed_mid: '. What is coming next is on the'
  feed_roadmap: 'roadmap'
  feed_post: '.'
  v080_map: '<b>The map.</b> Places, climbs and routes across nineteen countries, with a surface layer, satellite and street-level imagery, and a light and a dark theme.'
  v080_photos: '<b>Photos.</b> Contribute a photo to any place, licensed CC BY-SA 4.0. Location data is stripped before publication, and every photo has a page of its own.'
  v080_routes: '<b>Routes.</b> Propose a route from a GPX file, vote on the ones you have ridden, and see the best of a region.'
  v080_contribute: '<b>Contributing.</b> Add and correct places from the map itself, confirm that something is still there, and follow what a curator decided and why.'
  v080_accounts: '<b>Accounts.</b> Optional public profile, two-factor sign-in, a full data export, and account deletion that takes effect immediately.'
  v080_languages: '<b>Five languages.</b> English, French, Dutch, German and Spanish, with a way for riders to propose a better translation.'
  v080_legal: '<b>The paperwork done properly.</b> A privacy notice that names every processor, an accessibility statement that lists what does not work yet, and a contact route that reaches a person.'
