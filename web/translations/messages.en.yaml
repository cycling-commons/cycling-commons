developers:
  kicker: 'Build on the Commons'
  title: 'Open data. An open API.<br>For anyone to build on.'
  lead: 'Query the Commons by area and type, or download the weekly bulk export and host it yourself. The data is open (ODbL), which is what makes it a commons. No key, no account, no charge: a rate limit and fair use are the whole of it.'
  status: 'In design — these endpoints are the contract we''re building. Browse the <a href="/developers/api">interactive API reference</a> or the <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">spec on GitHub</a>.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/search'
  ep1_desc: 'find coverage by <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'one item, with our enrichment and provenance <b>(planned)</b>'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'region polygon and coverage stats <b>(planned)</b>'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'the best-of for a region <b>(planned)</b>'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'route detail and GPX download <b>(planned)</b>'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'vector tiles and TileJSON, to bind into your own MapLibre style <b>(planned)</b>'
  ep7_path: '/v1/contributions'
  ep7_desc: 'contribute <b>(planned)</b>, lands in the same review queue as in-app contributions'
  ex_kicker: 'Example request'
  resp_kicker: 'Response'
  ex_hydrate: 'Responses are reference-only by default: our added fields plus the <code>osm_ref</code> to hydrate against OSM. <code>?hydrate=osm</code> merges our cached OSM subset in for you.'
  attr_kicker: 'Required attribution'
  rules_kicker: 'The rules'
  rules_body: '<b>Fair use.</b> Reads are open to anybody, with no key and no account, within a rate limit per address that a normal app stays well below. For bulk or offline use, download the <b>weekly bulk export</b> and host it yourself instead of hammering the live API; scraping the service is not allowed. Licences: data <b>ODbL 1.0</b>, media <b>CC BY-SA 4.0</b>. Attribute, share alike, keep open. Commercial use is fine. See the plain-language summary:'
  ep_export_desc: 'the whole dataset as GeoJSON, rebuilt every week:'
  export_link: 'bulk export'
  ep_export_pending: 'Bulk export: the whole dataset as GeoJSON, rebuilt every week. The first export is on its way.'
data_export:
  # The bulk export's page (docs/specs/api-strategy.md section 3.1).
  meta_title: 'Cycling Commons bulk export'
  meta_description: 'Download the Cycling Commons catalogue as GeoJSON, rebuilt every week, under the Open Database License.'
  kicker: 'Build on the Commons'
  title: 'The bulk export'
  lead: 'The Commons catalogue in two files: the places and routes that riders, curators and our open-data sources added, as GeoJSON, rebuilt every week. Download it once and host it yourself, instead of crawling the site or the API.'
  latest_kicker: 'Latest snapshot'
  empty: 'No snapshot has been published yet. The first one appears here after the first weekly build.'
  built: 'Built %when%.'
  file_places: '%n% places'
  file_routes: '%n% routes'
  manifest_desc: 'what the snapshot holds: build time, licence and attribution per source, counts, sizes and sha256 checksums'
  latest_links: 'For scripts, a link that always leads to the newest snapshot:'
  holds_kicker: 'What it holds'
  holds_body: 'The places and routes of the Commons itself, with the fields the API gives them: name, type letter, position or line, tier, grade and the evidence behind it, region, country, and the OpenStreetMap reference where there is one. Each record names its <b>source</b>, so you can give the credit its licence asks for.'
  source_counts: '%places% places, %routes% routes'
  leaves_kicker: 'What it leaves out'
  leaves_body: 'Nothing about people: no accounts, names, email addresses, notes or moderation records. Nothing a curator has not let onto the map: no pending, rejected or trashed contributions, and no edit still waiting for review. No photos. And no record whose source licence does not let it be shared under the ODbL; those are counted here.'
  osm_body: '<b>Not in it: the OpenStreetMap features the map also shows</b>, by far the largest part of it: water taps, shops, shelters, road surfaces, cycle routes and much more. Get them from OpenStreetMap itself, with the same filters we use:'
  osm_link: 'how to get the OpenStreetMap data we use'
  left_out_unknown: 'Source with no licence on record'
  attr_kicker: 'Required attribution'
  licence_body: 'The database is licensed under the <b>Open Database License 1.0</b> and its contents under the <b>Database Contents License 1.0</b>. Use it for anything, commercial use included: credit it as shown, share a database you build from it under the same licence, and keep it open. Sources that ask for their own credit are listed above and in the manifest. See the plain-language summary:'
  cadence_kicker: 'How often'
  cadence_body: 'A new snapshot is built every week. The newest %keep% stay available and older ones are deleted. A snapshot never changes once published, so a checksum you kept stays valid. For data fresher than a week, use the API.'
  format_body: 'Each file is a gzip-compressed GeoJSON <code>FeatureCollection</code> in WGS84 (EPSG:4326), one feature per line, with <code>licence</code> and <code>attribution</code> at the top. Coordinates have six decimals.'
  back: 'Back to the developer page'
