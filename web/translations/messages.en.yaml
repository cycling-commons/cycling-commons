admin:
  escalated:
    title: 'Photos under legal hold'
    warning_b: 'Handle with care.'
    warning: 'These photos were escalated as suspected illegal content. They are hidden from the public and from the moderation desk, and nothing in the application can delete them. Do not delete the material: where it is the kind that must be reported, the record has to survive until it has been, and the authority you report to decides when it may go.'
    lead: 'A curator saw something they were not willing to decide alone. Read what they wrote before deciding whether to look at the image itself.'
    playbook_link: 'Open the incident playbook'
    empty: 'Nothing is currently held.'
    no_item: 'Not attached to a place'
    by: 'Escalated by %who% on %when%'
    their_words: 'What the curator wrote:'
    reveal: 'Show the photo'
    note_label: 'Note for the record (optional)'
    note_placeholder: 'e.g. reported to the authorities on …, reference …'
    release: 'Release the hold'
    release_help: 'Lifts the hold and hands the photo back to normal moderation. It does not put it back on the map and it deletes nothing.'
    released: 'The hold has been released.'
  flood:
    title: 'Playbook: a flood of photo reports'
    state_open_b: 'The auto-withhold breaker is OPEN right now.'
    state_open: 'Anonymous reports are no longer hiding photos by themselves. Work through the steps below.'
    state_closed: 'The auto-withhold breaker is closed. Normal operation.'
    lead: 'The photo-report route lets anyone say they are in a photo, without an account, because the law does not make that right depend on one. That openness is also its weakness: a distributed attacker can file from thousands of addresses at once. This page is what to do when that happens.'
    h_what: 'What already happened automatically'
    what: 'A site-wide budget caps how many photos anonymous reports may hide on their own: %hourly% per hour and %daily% per day. Past it, urgent reports still arrive and still queue for a curator, but they hide nothing, the moderation desk shows a banner, and the alert address is emailed once an hour. Nothing has been deleted or removed — hidden photos are still stored, their contributors have been told they are hidden, and only a curator granting a request removes anything.'
    h_steps: 'Steps'
    step_verify: 'Look at the queued reports before touching anything. A genuine emergency and an attack look different: real reports are few, specific about a person, and spread over time.'
    step_restore: 'Restore what is obviously abuse in one action — the contributors are told their photos are back. That page dismisses the reports rather than declining them, so a later genuine claim about the same photo is still heard.'
    step_zero: 'If it continues, set the hourly budget to 0. Anonymous reports then never hide a photo on their own; everything waits for a curator. This is the emergency stop and it needs no deploy.'
    step_desk: 'Tell the curators on duty that the desk will fill with noise, and that they must not bulk-decline it — declining is a judgement and closes that category for that photo forever.'
    step_after: 'When it is over, put the budgets back and write down what the real rate looked like. The right numbers are the ones a real incident teaches.'
    h_dont: 'Do not'
    dont_decline: 'Do not mass-decline on the moderation desk. Use the restore page: a decline permanently immunises the photo against the next genuine report of the same kind.'
    dont_raise: 'Do not raise the budgets to make the banner go away. The budget is the thing bounding the damage.'
    dont_disclose: 'Do not tell reporters or uploaders anything about each other, and do not publish the thresholds, the exact decision test, or which report category acts fastest. Everything a curator knows about how to get a photo removed is also a script for social engineering.'
    dont_ignore: 'Do not assume it is an attack. Check first; the lever exists for something real.'
    h_real: 'If it is real'
    real: 'If the reports are genuine — an actual campaign of illegal images on the map — the breaker is not your enemy: reports still arrive and nothing is lost. Withhold what needs withholding from the moderation desk yourself, preserve the records, and involve the site owner immediately. Never delete evidence of illegal material before it has been reported to the authorities.'
    h_escalated: 'If a curator escalates something as illegal'
    escalated_intro: 'Escalated photos are already hidden from the public and from the moderation desk, and nothing in the app can delete them. They are here'
    esc_step_read: 'Read the curator''s words first and decide whether you need to look at the image at all. Often you do not.'
    esc_step_report: 'Report it where it belongs. Material involving a threat to someone''s life or safety must be reported promptly to law enforcement (DSA Art. 18). For child sexual abuse material, use the hotline (Offlimits / Meldpunt Kinderporno) and/or the police. Terrorist content carries a six-month preservation duty.'
    esc_step_preserve: 'Do not delete anything, and do not ask anyone to. The hold exists so the record survives until it has been reported; the authority you report to decides when it may go.'
    esc_step_release: 'Release the hold only if it turns out not to be what it looked like. Releasing returns it to normal moderation — it does not put it back on the map.'
    esc_step_curator: 'Check on the curator who escalated it. They saw it so nobody else had to, and that is worth a message.'
  withheld:
    title: 'Photos withheld by a report'
    lead: 'Every photo an anonymous report has hidden from the map and that is still waiting for a decision. Hidden, not removed: nothing has been deleted, and the contributor has been told it is hidden and why. Restoring here puts them back, tells the contributor, and records that the report was not real — it does not close the category, so a future genuine report about the same photo is still heard.'
    empty: 'No photo is currently hidden by a third-party report.'
    breaker_open_b: 'The auto-withhold circuit breaker is open.'
    breaker_open: 'Urgent reports are arriving far faster than any genuine rate, so they are no longer taking photos down by themselves. Restore anything below that is not a real claim, and expect more to arrive.'
