developers:
  kicker: 'Build on the Commons'
  title: 'Open data. An open API. For anyone to build on.'
  lead: 'Query the Commons by area and type, bind our vector tiles into your own map style, or self-host from the free periodic bulk export. The data is open (ODbL) — that''s what makes it a commons. Access is self-serve: a free key, a free tier, and paid quotas only for heavy, always-fresh use.'
  status: 'In design — these endpoints are the contract we''re building. Browse the <a href="/developers/api">interactive API reference</a> or the <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">spec on GitHub</a>.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/search'
  ep1_desc: 'find coverage by <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'one item — our enrichment, provenance, verification (<code>?hydrate=osm</code>)'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'region polygon + coverage stats'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'the curated best-of for a region'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'route detail + GPX download'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'keyed vector tiles + TileJSON — bind them into your own MapLibre style'
  ep7_path: '/v1/contributions'
  ep7_desc: 'contribute — planned (phase 2), lands in the review queue'
  ex_kicker: 'Example request'
  resp_kicker: 'Response'
  ex_hydrate: 'Responses are reference-only by default: our added fields plus the <code>osm_ref</code> to hydrate against OSM. <code>?hydrate=osm</code> merges our cached OSM subset in for you.'
  attr_kicker: 'Required attribution'
  rules_kicker: 'The rules'
  rules_body: '<b>Self-serve &amp; fair use.</b> Reads use a free self-serve key with a free monthly quota; paid tiers add throughput and always-fresh data for heavy use. For bulk or offline use, take the <b>free periodic export</b> and self-host it instead of hammering the live API — scraping the service is not allowed. <b>Writes are planned (phase 2)</b> and will pass through the same review as in-app contributions. Licences: data <b>ODbL 1.0</b>, media <b>CC BY-SA 4.0</b> — attribute, share-alike, keep open; commercial use is fine. See the plain-language summary:'
