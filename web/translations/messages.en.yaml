about:
  kicker: 'About'
  title: 'The map belongs to everyone.'
  lead1: 'Every rider carries a private map: the fountain that saved a hot July, the climb worth the extra hour, the back road that''s somehow always empty. Today that knowledge lives in one head and dies there. Cycling Commons is where it lives instead.'
  lead2: 'It''s an open, community-built map of the world''s best riding, for every kind of cycling. Open data anyone can use, governed by the riders who build it.'
  problem_kicker: 'The problem'
  problem_title: 'A different app for everything.'
  problem_lead1: 'Climbs in one app, routes in another, places to sleep in a third, road conditions nowhere at all. Most of it closed, none of it joined up. Riders pay for a dozen tools and still can''t see the whole picture. Most of the knowledge exists; it''s just scattered and/or locked away.'
  problem_lead2: 'The Commons gathers the non-personal knowledge, the map and never the rider, into one open place. Free to query, free to export, free to build on, by anyone at all.'
  believe_kicker: 'What we believe'
  believe_princ1_num: 'II'
  believe_princ1_title: 'The map, not the rider.'
  believe_princ1_body: 'Open facts about places, not people. The Commons collects nothing about how, where, or when you ride.'
  believe_princ2_num: 'III'
  believe_princ2_title: 'Open for everyone.'
  believe_princ2_body: 'ODbL data, CC BY-SA 4.0 media, a free API: usable by anyone, commercial or not.'
  believe_princ3_num: 'I'
  believe_princ3_title: 'Curation, not overload.'
  believe_princ3_body: 'The best of a region, voted by riders, not an endless dump.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Governed, not just published.'
  believe_princ4_body: 'Built on Elinor Ostrom''s principles for commons that don''t collapse or get captured.'
  believe_ostrom: 'showed that communities can govern a shared resource without privatising it and without a central owner. She shared the 2009 Nobel Memorial Prize in Economic Sciences with Oliver E. Williamson, her half for her analysis of the commons. The'
  believe_ostrom_link: 'Governance page'
  believe_ostrom_suffix: 'maps each principle to a part of the system.'
  made_kicker: 'How it gets made'
  made_title: 'Five kinds of people, one loop.'
  made_ride: '<b>Riders</b> find water, repair stands, climbs and places to sleep on one map, and check a route before they leave.'
  made_add: '<b>Contributors</b> put in what they find. A curator checks it before it goes on the map.'
  made_curate: '<b>Curators</b> look after a region they know.'
  made_extend: '<b>Makers</b> grow the platform: code, data pipelines, design, translations, funding.'
  made_build: '<b>Builders</b> take the open data into their own apps, and it comes back to riders.'
  partners_kicker: 'Partners, not silos'
  partners_title: 'Where good open data exists, we join it.'
  partners_lead1_pre: 'The Commons isn''t here to rebuild what others have already opened. We build on'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'and contribute back to it. And for the layers we don''t own, like bike-friendly places to sleep, we''d rather'
  partners_lead1_partner: 'partner with open communities'
  partners_lead1_post: ', such as open hospitality networks, than wall off a private copy of their data.'
  partners_lead2: 'Open data should connect, not fragment further. Every partnership makes the whole atlas richer without anyone enclosing it.'
  steward_kicker: 'Who stewards it'
  steward_title: 'BikeCoders today, a foundation tomorrow.'
  steward_lead: 'BikeCoders seeds and stewards the Commons today. But the commitment is public from day one: open licence, separate data and accounts, and a path to spin out into an independent foundation once there''s a community to govern it. The open licence and separate ownership make later enclosure hard to do quietly.'
  steward_cta_map: 'Explore the map →'
  steward_cta_account: 'Create a free account'
privacy:
  kicker: 'Privacy'
  title: 'What we collect, and why.'
  lead: 'Plain language. The Cycling Commons dataset is non-personal — open geodata about places, never about people. The <b>platform account</b> is a different matter: it holds personal data (email, credentials, session logs). Here''s what we hold, why, and the control you have over it.'
  last_updated: 'Last updated 27 August 2026'
  h_responsible: 'Who is responsible'
  responsible_p1_pre: 'The data controller is'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', based in the Netherlands, which stewards the Cycling Commons today. As set out in our'
  responsible_p1_governance: 'governance'
  responsible_p1_post: ', the Commons is committed to spinning out to an independent Dutch foundation; the controller will transfer accordingly, and this page will be updated.'
  responsible_p2_pre: 'Questions about your data:'
  responsible_p2_mid: '. You also have the right to lodge a complaint with the Dutch supervisory authority, the'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'We have <b>not appointed a Data Protection Officer (DPO)</b>, and the law does not require one of us: we are a small operation, we do not monitor people on a large scale, and special-category data is not part of what we do (GDPR Art. 37). Data protection questions and requests go to the same address as everything else,'
  dpo_post: ', and a person reads them. If that ever changes and we do appoint one, this page will name them.'
  h_collect: 'What we collect'
  collect_intro: 'We ask for the minimum needed to run an open, accountable map. We never ask for your real name.'
  h3_account: 'When you create an account'
  collect_account_email: 'Your <b>email address</b> — to sign you in, secure the account, and send essential service messages.'
  collect_account_password: 'A <b>password</b>, which we store only as a salted hash — we never see or keep the plain text.'
  collect_account_displayname: 'A <b>display name</b> you choose. It can be a pseudonym, and we never ask for your real name. Your profile is <b>off by default</b>: while it is off, what you contribute carries no name at all. Turn it on and your display name, your country, the month you joined and your contribution counts become public.'
  collect_account_2fa: 'If you enable <b>two-factor authentication (2FA)</b>, we store the TOTP secret <b>encrypted at rest</b>, and your backup codes only as hashes.'
  collect_account_base: 'An optional <b>base location</b> — a town-level point (~1 km precision) and riding radius, if you set one. Used only to scope your own map view; never shown to other riders, and never part of the Commons dataset.'
  h3_contribute: 'When you contribute'
  collect_contribute_items: '<b>Everything you write into the Commons.</b> A place, a climb, a route, a correction, a vote, an on-the-spot check, a region description, a translation, a report, a message to a curator: if you typed it and sent it, we have it. Each one records that an account made it, which is what lets a curator write back and lets other riders see the map is kept by people. While your profile is off, none of it carries your name.'
  collect_contribute_media: 'Any <b>photos</b> you upload. A photo can carry hidden data (EXIF), such as where it was taken: we strip that out and re-encode the file, so what we publish carries none of it. We then write one thing back in: a stamp saying the picture is licensed CC BY-SA 4.0, and a link to its page here. <b>Your name is never written into the file.</b> The link is how somebody reusing the photo finds who to credit, and that page names you only while your profile is public.'
  collect_contribute_profile: 'Optional public-profile details you fill in (bio, links, which contributions to show). Profiles are'
  collect_contribute_profile_link: 'opt-in'
  collect_contribute_profile_post: ' and off by default.'
  h3_auto: 'Automatically, when you use the site'
  collect_auto_technical: '<b>Technical data</b> — IP address, browser type, and timestamps in our server logs, kept to operate and secure the service.'
  collect_auto_ratelimit: "<b>Rate-limit counters</b> — when you use a tool without an account, such as the ride check, we count your uses against a salted one-way hash of your IP address rather than the address itself. That lets us apply a fair daily limit without keeping a list of who visited. Hashing is not anonymisation: the counter is still personal data and everything on this page applies to it."
  banner_bold: 'No ride tracking.'
  banner_body: 'The Commons is a map of places, not of people. We do <b>not</b> collect GPS traces, your routes, your live location, or any record of where you ride.'
  h_why: 'Why we use it (legal bases)'
  why_contract: '<b>To provide your account and the service</b>: performance of a contract (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">GDPR Art. 6(1)(b)</a>).'
  why_consent: '<b>Showing your name.</b> A public profile, and being credited by name on what you contributed, rests on your consent (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">GDPR Art. 6(1)(a)</a>). Withdraw it any time in'
  why_consent_link: 'settings'
  why_consent_post: ' and your name comes off those pages. On our side that happens at once. A map file that somebody''s browser already downloaded can be up to an hour old, and a copy of a page that somebody else saved is beyond our reach entirely.'
  why_licence: '<b>Publishing what you contribute.</b> A photo or an edit you give to the Commons is published under the licence you agreed to when you sent it, which is part of our agreement with you (Art. 6(1)(b)). That licence is <b>irrevocable</b> by its own terms, so withdrawing consent takes your name off the page but does not un-publish the contribution itself. One exception matters: if a photo shows <b>you</b>, that is your personal data, and a copyright licence does not sign away data-protection rights. Every photo page carries a link to ask for it to come down.'
  why_updates: '<b>Telling you when a release ships.</b> Only if you asked: the toggle in your settings is your consent (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">GDPR Art. 6(1)(a)</a>), and turning it off withdraws it. Every message also carries a one-click unsubscribe that needs no sign-in. Release notes only, never marketing, and the list is never shared or sold.'
  why_legitimate: '<b>Security, abuse prevention, and aggregate analytics</b>: our legitimate interests in keeping the Commons honest and working (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">Art. 6(1)(f)</a>).'
  why_legal: '<b>Meeting legal obligations</b>: where the law requires it (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">Art. 6(1)(c)</a>).'
  h_cookies: 'Cookies & analytics'
  cookies_body: 'We keep this light. We set <b>two cookies</b>, both of them strictly necessary, and both listed in full below. For usage statistics we run <b>self-hosted analytics</b> on our own server at <b>analytics.bikecoders.life</b>: it receives the page URL, referrer, screen size and browser type, and it receives your <b>IP address</b>, which is personal data, but does <b>not store it</b>. The address is used only to work out an approximate location (country, region and city) and to derive a one-way session identifier, and is then discarded. No analytics cookies are set, no visitor is given a persistent identifier or tied to an account, and there is no cross-site or cross-device tracking. Analytics data stays on our own infrastructure and is never shared with, or sold to, third parties.'
  h3_cookie_table: 'The cookies we set'
  ck_h_name: 'Name'
  ck_h_purpose: 'What it does'
  ck_h_life: 'How long it lasts'
  ck_session_purpose: 'Keeps you signed in, and carries the token that protects every form on the site against cross-site request forgery (CSRF), an attack in which another website makes your browser submit a form here as you. It is set when you sign in, and on the few pages that carry a form we have to remember for you, such as the contact page. Reading the map and the rest of the site sets no cookie at all. It holds a random identifier and nothing else: no name, no email address, no record of what you looked at.'
  ck_session_life: 'Until you close your browser'
  ck_remember_purpose: 'Signs you back in on your next visit without asking for your password. Set <b>only</b> if you tick <b>Remember me</b> when you sign in, and removed when you sign out.'
  ck_remember_life: '7 days'
  cookies_none_body: 'That is the whole list. We set <b>no</b> advertising cookie, <b>no</b> analytics cookie and <b>no</b> cross-site tracking cookie, on any page. Both cookies above are strictly necessary to deliver something you asked for, so the law needs no consent for them, and that is why there is no cookie banner here. If we ever added something that did need one, we would ask you first rather than assume.'
  cookies_local_body: 'The map also keeps a few of your own settings in your browser''s <b>local storage</b>: the light or dark map theme, the area you last looked at, and which filters you had switched on. That is not a cookie, it is never sent to our server, and clearing your browser data removes it. <b>No other website can read it.</b> A browser keeps each site''s local storage sealed off from every other site, so what we store here is readable by this site alone.'
  h_share: 'Who we share it with'
  share_infra: '<b>The companies that run our infrastructure.</b> Hosting, backups, account email, and the map services your browser fetches directly. Every one of them is named in the two tables below, with what it does and what it can see.'
  share_osm_pre: 'OpenStreetMap — contributions you choose to give back become part of the open map under the'
  share_osm_link: 'ODbL'
  share_osm_post: '. That is public, open data, not personal data about you.'
  share_noone: '<b>No one else.</b> We don''t sell personal data and we don''t run third-party ad tracking.'
  share_selfhosted: 'First, what is <b>not</b> in these lists. We run as much of this ourselves as we can: the map data, the route planning, the elevation model behind the climb gradients, the photo storage and even the usage statistics all sit on our own machines. Two services we used to call out to, for routing and for elevation, were brought in-house in 2026 for exactly this reason. It is slower to build that way and it costs more. It is also why your browser talks to five outside services instead of twenty, and why the tables below are as short as they are: every name in them is one we could not reasonably run ourselves.'
  h3_processors: 'The companies that handle data for us'
  processors_intro: 'Three companies hold or handle your data on our instructions. They are our <b>processors</b>: they may only do what we tell them to, under a written contract, and they may not use your data for anything of their own.'
  pr_h_who: 'Who'
  pr_h_where: 'Where'
  pr_h_what: 'What they do for us'
  pr_h_sees: 'What they can see'
  pr_hetzner_where: 'Falkenstein, Germany (EEA)'
  pr_hetzner_what: 'Runs the machines: the website, the database, and the storage that holds uploaded photos.'
  pr_hetzner_sees: 'In principle everything we store, because it sits on their hardware: your email address, your contributions, your photos and the server logs. Passwords and two-factor secrets are unreadable even there (see <b>How we protect it</b>).'
  pr_scaleway_where: 'European Economic Area'
  pr_scaleway_what: 'Delivers the email the site itself sends (address confirmation, password reset, deletion code, moderation messages), and stores the nightly backups.'
  pr_scaleway_sees: 'Your email address and the contents of the messages the site sends you. The backups are encrypted on our own servers before they are sent, so their contents cannot be read at the other end.'
  pr_proton_where: 'Switzerland (covered by an EU adequacy decision)'
  pr_proton_what: 'Holds the project mailbox, the address printed on this page, and the replies a person here writes back.'
  pr_proton_sees: 'Your email address and whatever you chose to write to us, for as long as the conversation is kept.'
  h3_browser_services: 'Services your browser contacts directly'
  browser_services_intro: 'The map is assembled in your browser, so a few pieces are fetched straight from the people who publish them rather than passing through us. We never hand them your account, your display name or your email address. They do see the network address your request comes from, because every request on the internet carries one. Nothing in this list loads until you open a page that uses it.'
  bs_h_service: 'Service'
  bs_h_what: 'What it is for'
  bs_h_sees: 'What it receives'
  bs_sees_ip: 'Your IP address, and which map squares you asked for.'
  bs_openfreemap_what: 'The base map: the roads, water and place names under everything else.'
  bs_esri_what: 'The satellite view, only once you switch to it.'
  bs_esri_sees: 'Your IP address, and which image squares you asked for. Esri is in the United States.'
  bs_mapillary_what: 'Street-level photos, only once you open the street view.'
  bs_mapillary_sees: 'Your IP address, and which photos you opened. Mapillary is run by Meta Platforms Ireland Limited, in Ireland, and the image files themselves come from Meta''s content network, which is worldwide.'
  bs_photon_what: 'Place search, while you type in the search box.'
  bs_photon_sees: 'Your IP address, and the words you type into the search box. Photon is run by komoot, in Germany.'
  bs_wikimedia_what: 'Reference photos of some climbs and places, where the picture comes from Wikimedia Commons.'
  bs_wikimedia_sees: 'Your IP address, and which photo the page showed. The Wikimedia Foundation is in the United States.'
  browser_services_post: 'Two of these sit outside the European Economic Area (EEA): <b>Esri</b> and the <b>Wikimedia Foundation</b>, both in the United States. If you never open the satellite layer and never look at a page carrying a Commons photo, your browser never contacts either. See <b>International transfers</b> below.'
  h_transfers: 'International transfers'
  transfers_body: 'Some infrastructure providers may process data outside the European Economic Area. Where they do, we rely on appropriate safeguards — such as the European Commission''s Standard Contractual Clauses or an adequacy decision.'
  h_retention: 'How long we keep it'
  retention_account: '<b>Account data.</b> Until you delete your account, and then it is gone. Deletion is immediate: you ask, we email you a code, you confirm, and the account is removed from the live database in that moment. The email address, the password hash, the two-factor secret and the backup codes go with it. There is no waiting period and nothing is held back in case you change your mind. Two things are worth stating plainly. Our nightly backups still hold the old record until they rotate out, which takes <b>at most 90 days</b>; those backups are encrypted and are opened only to recover from a disaster. And we do <b>not</b> currently delete an account just because nobody has signed into it for years. If we ever start, we will write to you first and give you time to keep it.'
  retention_logs: '<b>Server logs.</b> Kept for <b>30 days</b>, then deleted automatically. They contain IP addresses: a web server writes the visitor''s address into its error entries and offers no setting that removes it, so the time limit is what bounds this rather than any promise about the contents.'
  retention_ratelimit: '<b>Rate-limit counters.</b> One day.'
  retention_contributions: '<b>Contributions.</b> Facts you give back to the open map persist as part of the Commons (with provenance), even after you leave; they are not personal data about you.'
  retention_consent: '<b>Licence consents.</b> When you licence a photo to the Commons we record that you agreed, the exact wording you agreed to, and when. We keep that record indefinitely, and it survives closing your account: it is our evidence that the licence was granted, which we may need to establish or defend a legal claim (Art. 17(3)(e)). It holds an account reference and nothing else about you, and once the account is gone that reference no longer identifies anyone here.'
  retention_mail: '<b>Email you send us.</b> We keep a conversation while the matter is open, and delete it within <b>24 months</b> of it ending. That covers you coming back to us about the same thing a year later, and it covers us if a complaint about how we handled it arrives late. Threads that are part of a legal matter, such as a copyright claim or a takedown, are kept until that matter is finished.'
  retention_updates: '<b>The release list.</b> Your address stays on it until you take it off, from your settings or from the link in any message. We keep the record that you agreed, and to what wording, the same way we keep a photo licence consent: it is the evidence that we were allowed to write to you.'
  h_security: 'How we protect it'
  security_intro: 'The law asks us to take measures that fit the risk (Art. 32). In plain words:'
  security_passwords: '<b>Your password is never stored.</b> We keep only a one-way scramble of it, so nobody here can read your password and a stolen database does not hand anyone yours either.'
  security_secrets: '<b>Two-factor secrets and backup codes are encrypted where they sit</b>, with the key held outside the database. Somebody who steals only the database still cannot produce a working code.'
  security_transport: '<b>Everything travels encrypted</b>, between you and us and again when a backup leaves our servers. Browsers are told to refuse an unencrypted connection to us at all.'
  security_access: '<b>Only the people who need your data can reach it</b>, and every moderator and administrator has to use two-factor sign-in. Repeated failed sign-ins are slowed down and then locked out.'
  security_source_pre: 'That is the short version. The exact measures, and the reasoning behind each one, are in our'
  security_source_link: 'public source code'
  security_source_post: ', which is the point of building it in the open: you do not have to take a security paragraph on trust.'
  security_honest: 'No system is perfect and we will not pretend ours is. There is no certification behind that paragraph and no penetration test: what there is, is a small system that keeps as little as it can, and code anyone can check.'
  h_breach: 'If data ever leaks'
  breach_pre: 'If personal data is lost, exposed, or reached by somebody who should not have it, and that is likely to put people''s rights at risk, we report it to the'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>within 72 hours</b> of finding out (Art. 33). If the risk to you personally is high, we also contact you directly and without delay (Art. 34), in plain language: what happened, which of your data was involved, what we have done about it, and what you should do. We keep an internal record of every breach, including the ones we are not obliged to report, so the pattern stays visible to us even when no single one is reportable.'
  h_rights: 'Your rights'
  rights_intro: 'Under the <a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">GDPR</a> you have the following rights:'
  rights_access: '<b>Access (Art. 15)</b> — request a copy of the personal data we hold about you.'
  rights_correct: '<b>Rectification (Art. 16)</b> — correct anything inaccurate, or complete anything missing.'
  rights_erase: '<b>Erasure (Art. 17)</b> — delete your account at any time from your account settings. Your personal data goes with it and does not come back. Two things deliberately survive, and neither identifies you afterwards: the contributions you gave to the open map, and the record that you granted a photo licence. Both are described under <b>How long we keep it</b> above.'
  rights_portability: '<b>Data portability (Art. 20)</b> — download everything we hold about you as a single ZIP file, any time, from your account settings. It holds your account details, your contributions, your messages, your licence consents, and your photos as files.'
  rights_restrict: '<b>Restriction and objection (Arts. 18–21)</b> — restrict or object to certain processing.'
  rights_withdraw: '<b>Withdraw consent</b> at any time (e.g. by turning off your public profile) — this doesn''t affect processing already done.'
  rights_third_party_photo: '<b>Not a user?</b> These rights don''t depend on having an account. If you are recognisable in a photo on our map, every photo page carries a <b>"this photo shows me"</b> link. Report it there, no account and no ID required, and a curator answers within one month at the latest.'
  rights_contact_pre: 'To exercise any of these, email'
  rights_contact_mid: '. We answer within <b>one month at the latest</b>, and usually much sooner. The law allows up to three months for a request that is genuinely complicated, but only if we tell you inside the first month that we are taking longer, and why. If you are unhappy with our answer, you can complain to the'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Children'
  children_body: 'The Commons isn''t intended for children under <b>16</b>. We don''t knowingly collect personal data from anyone under that age; if you believe a child has given us data, contact us and we''ll delete it.'
  h_automated: 'Automated decisions'
  automated_body: 'We don''t make decisions about you by solely automated means, and we don''t profile you for advertising.'
  h_changes: 'Changes to this policy'
  changes_body: 'If we change how we handle data, we''ll update this page and its date, and — for material changes — let signed-in contributors know.'
  changes_versions_pre: 'You can also check that for yourself instead of taking our word for it. The platform is open source, so this page and its wording live in a public repository, and every change to it is recorded with a date and a reason in the'
  changes_versions_link: 'page history'
  changes_versions_post: '.'
  footer_disc_pre: 'See also our'
  footer_disc_terms: 'Terms of Use'
  footer_disc_mid: 'and the data, media and code'
  footer_disc_licences: 'licences'
  footer_disc_post: '.'
terms:
  kicker: 'Terms of Use'
  title: 'The deal, in plain language.'
  lead: 'These terms cover using the Cycling Commons website and account, in plain language.'
  last_updated: 'Last updated 1 August 2026'
  h1_accepting: 'Accepting these terms'
  accepting_p1_pre: 'By using the Cycling Commons website or creating an account, you agree to these terms and to our'
  accepting_p1_privacy: 'Privacy notice'
  accepting_p1_mid: '. If you don''t agree, please don''t use the service. The Commons is operated by'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' in the Netherlands, heading to an independent foundation as described in our'
  accepting_p1_governance: 'governance'
  accepting_p1_post: '.'
  h2_who: 'Who can use it'
  who_body: 'You need to be at least <b>16</b> to create an account. The information you give us (such as your email) must be accurate and yours to use.'
  h3_account: 'Your account'
  account_password: 'Keep your password safe; you''re responsible for activity under your account.'
  account_unauthorised: 'Tell us promptly if you suspect unauthorised access.'
  account_suspend: 'We may suspend or close accounts used for abuse or to break these terms.'
  h4_using: 'Using it well'
  using_intro: 'The Commons works because people use it in good faith.'
  using_no_illegal: 'Do not break the law, harass others, or post unlawful, misleading, or harmful content.'
  using_no_personal: 'Do not upload <b>personal data about other people</b> (for example, identifiable individuals in photos) without a proper basis — the Commons maps places, not people.'
  using_no_reidentify_pre: 'Do not try to re-identify contributors or undermine the project''s'
  using_no_reidentify_link: 'sensing boundary'
  using_no_reidentify_post: ' that keeps personal data out.'
  using_no_scrape_pre: 'Do not scrape the service. Period — the'
  using_no_scrape_link: 'API and bulk export'
  using_no_scrape_post: ' are how you get the data. Neither is live yet, so until they are, email info@cyclingcommons.org and we will get you what you need.'
  using_no_disrupt: 'Do not disrupt the service or work around its limits.'
  h5_contributions: 'Your contributions'
  contributions_p1_pre: 'You keep authorship of what you contribute. To let the Commons be open, you grant the licences in our'
  contributions_p1_link: 'contributor terms'
  contributions_p1_mid: ': <b>data</b> joins the Commons under the'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', <b>media</b> (photos, video) under'
  contributions_p1_mid3: ', and <b>UI translations</b> under'
  contributions_p1_agpl: 'AGPL-3.0-only'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'You confirm that you have the right to contribute what you submit, that it doesn''t infringe anyone else''s rights, and that it isn''t personal data about other people.'
  h6_opendata: 'Open data & the API'
  opendata_pre: 'The Commons data and media are free for anyone to use, commercial use included, under their'
  opendata_link: 'licences'
  opendata_mid: ', with attribution. UI translations are free to use too, under the code licence, which asks for source rather than credit alone. See the'
  opendata_dev_link: 'developer docs'
  opendata_post: ' for the attribution line, and for the API and bulk export as they are being designed — neither is live yet.'
  h7_code: 'Our code & brand'
  code_pre: 'The platform source is <b>free software</b> under the'
  code_link: 'GNU Affero General Public License v3'
  code_post: ': anyone may run it, study it, change it and share it, commercial use included. What the licence asks back is source. Run a changed version and let people use it over a network, and you owe those people your source too. The "Cycling Commons" name and logo are <b>not</b> covered by that licence and stay with the project, which AGPL section 7(e) expressly allows. What you may do with them is set out in our'
  code_brand_link: 'trademark policy'
  code_brand_post: '.'
  h8_preview: 'An intent, not a guarantee'
  preview_body: 'The Cycling Commons is an intent, <b>not</b> a guarantee. Don''t rely on it for routing, road conditions, or your safety on the road — always use your own judgement when riding.'
  h9_warranty: 'No warranty'
  warranty_body: 'The service is provided <b>"as is"</b> and "as available", without warranties of any kind, to the fullest extent permitted by law. We don''t guarantee it will be accurate, uninterrupted, or error-free.'
  h10_liability: 'Liability'
  liability_body: 'To the fullest extent permitted by Dutch law, BikeCoders is not liable for indirect or consequential loss arising from your use of the Commons. Nothing in these terms limits liability that cannot be limited by law.'
  h11_suspension: 'Suspension & ending'
  suspension_pre: 'You can close your account at any time in'
  suspension_link: 'settings'
  suspension_post: '. We may suspend or end access if these terms are broken or to protect the Commons or its users.'
  suspension_p2: 'Before you go, you can <b>download everything we hold about you</b> as a single ZIP file from the same page. Closing your account removes your personal data. Two things stay, and neither names you afterwards: the contributions you gave to the open map, and the record that you granted a photo licence, which we keep as evidence that the licence exists. Photos you had approved stay in the Commons under CC BY-SA 4.0, and you choose on your way out whether they keep your name or become anonymous.'
  h12_moderation: 'How moderation works'
  mod_intro: 'The Commons is built from what riders add, so some of it has to be checked. This section says what we take down, who decides, what you are told, and what you can do about it.'
  mod_standard_h: 'What gets taken down'
  mod_std1: '<b>Anything unlawful.</b> Including content that infringes somebody else''s rights.'
  mod_std2: '<b>Personal data about other people.</b> The Commons maps places, not people. A recognisable person in a photo, a name, a number plate, a house that is identified as somebody''s home.'
  mod_std3: '<b>Things that are simply not true.</b> A water point that was never there, a road surface that does not match the ground, a climb invented to game a ranking.'
  mod_std4: '<b>Abuse.</b> Harassment, threats, or content aimed at a person rather than at a place.'
  mod_std5: '<b>Advertising.</b> The Commons is not a listings site, and a place is not on it because somebody paid or asked.'
  mod_std6: '<b>Photographs that are not photographs.</b> An image generated or materially altered by AI, however good it looks. The Commons is a map of the real world, and a picture of a place that has never looked like that is worse than no picture at all.'
  h13_ai: 'Where machines are involved'
  ai_intro: 'Short list, and we would rather you knew it than guessed:'
  ai_translation: '<b>Machine translation.</b> Some place descriptions are taken from Wikipedia in the local language and translated automatically into English. Every one of them is labelled <b>auto-translated</b> where it appears, because a machine translation of a mountain pass can be wrong in ways that read perfectly well.'
  ai_checks: '<b>Automatic checks.</b> Software scans the catalogue for things that look wrong, two taps mapped a metre apart, a link that no longer resolves, and puts them in front of a curator. It flags; it never decides.'
  ai_none: '<b>Nothing else.</b> No chatbot, no generated text passed off as ours, no automated decision about you or your account, and no profiling. If that ever changes, this section changes first.'
  ai_uploads: '<b>What you may not upload.</b> No AI-generated images, and no altered scenes. Ordinary editing is fine, with AI tools or without: crop it, straighten it, tone it, sharpen it, take the noise out. Inventing or removing something that was there is not, and neither is a picture a model made. The one change we ask for: blur faces and number plates before you upload. The consent you tick before uploading says so, and it is a ground for removal.'
  ai_stance: 'We are not claiming compliance with anything by writing this. The EU AI Act''s transparency rules start applying on <b>2 August 2026</b>, and it is arguable how far they reach a description of a water tap. We would tell you either way, because a map is only worth having if you can tell what a person put on it.'
  mod_who_h: 'Who decides'
  mod_who: 'A <b>curator</b> decides, and a curator is a person. Curators are riders who applied and were accepted, they work to a written rulebook, and every decision they make is recorded with their name against it.'
  mod_automated: '<b>Nothing is removed by software alone.</b> Automated checks do run, and they flag things for a curator to look at, but they never decide. The one exception works the other way round and is there to protect people, not to judge them: a report of intimate imagery or of a child hides the photo immediately, before any person has seen the report, and a curator then reviews it.'
  mod_told_h: 'What you are told'
  mod_told_pre: 'If something you added is removed or changed, we tell you, and we tell you why. The message names what it was about and the ground it was decided on. You will find it in your'
  mod_told_link: 'messages'
  mod_told_post: '.'
  mod_appeal_h: 'If you disagree'
  mod_appeal_pre: 'Reply to that message and a curator reads it. If you would rather go outside the account, or you no longer have one, write to us on the'
  mod_appeal_link: 'contact page'
  mod_appeal_post: '. A decision is not final because it was made once; a curator who got it wrong can put it back.'
  mod_report_h: 'Reporting something'
  mod_report_pre: 'Anyone can report content, with or without an account. Use the'
  mod_report_link: 'contact form'
  mod_report_post: ', or the report link on the photo itself. We acknowledge every report, and we tell you what we decided. Photos have their own report link on every photo page.'
  h12_governing: 'Governing law'
  governing_body: 'These terms are governed by the law of <b>the Netherlands</b>. Disputes will be subject to the competent Dutch courts, unless mandatory consumer law gives you other rights.'
  h13_changes: 'Changes'
  changes_body: 'We may update these terms; we''ll post changes here with a new date. Continuing to use the Commons after a change means you accept the updated terms.'
  h14_contact: 'Contact'
  contact_pre: 'Questions about these terms:'
  contact_post: '.'
  footer_disc_pre: 'See also our'
  footer_disc_privacy: 'Privacy notice'
  footer_disc_mid: 'and the data, media, UI translations and code'
  footer_disc_licences: 'licences'
  footer_disc_post: '.'
licenses:
  kicker: 'Licensing'
  title: 'The short version.'
  lead: 'Plain language, so you know what you can do. Four licences, one each for the <b>data</b>, the <b>media</b>, the <b>UI translations</b> and the <b>code</b>. All four are open. The name and the logo are not, and that is deliberate.'
  can_h: 'You can'
  must_h: 'You must'
  data_h: 'The data'
  data_sub: 'Open Database License 1.0 (ODbL) · contents DbCL 1.0'
  data_tldr: 'Use the data for anything — including commercial products — as long as you credit it, share back any improved database under the same licence, and keep it open. The same deal as OpenStreetMap.'
  data_can1: 'Use, copy, and share it — free'
  data_can2: 'Adapt it and build products on it'
  data_can3: 'Use it commercially'
  data_must1_b: 'Attribute'
  data_must1_body: '— credit the Cycling Commons and whichever source the data came from: OpenStreetMap, and the other open datasets we import, each <a href="%url%">listed with its licence</a>.'
  data_must2_b: 'Share-alike'
  data_must2_body: '— publish an adapted database under ODbL'
  data_must3_b: 'Keep it open'
  data_must3_body: '— no DRM or lock-out of the data'
  media_h: 'The media'
  media_sub: 'Creative Commons Attribution-ShareAlike 4.0 (CC BY-SA 4.0)'
  media_tldr: 'Use the photos and video for anything — including commercially — if you credit the creator and the Commons, and release any adaptations under the same licence.'
  media_can1: 'Use, copy, and share it — free'
  media_can2: 'Adapt, crop, and remix it'
  media_can3: 'Use it commercially'
  media_must1_b: 'Attribute'
  media_must1_body: '— credit the creator and the Cycling Commons'
  media_must2_b: 'Share-alike'
  media_must2_body: '— release adaptations under CC BY-SA 4.0'
  ui_h: 'The UI translations'
  ui_sub: 'GNU Affero General Public License v3 (AGPL-3.0-only)'
  ui_tldr: 'A translated interface string is a rewrite of the English one, so it carries the licence of the code it belongs to. Use it, change it, ship it commercially. Ship a changed version and your source goes with it. This covers both the locale files in git and the translations submitted through this site: the old split between those two is gone.'
  ui_can1: 'Use, copy and share them, free'
  ui_can2: 'Adapt and remix them'
  ui_can3: 'Use them commercially'
  ui_must1_b: 'Share source'
  ui_must1_body: 'including when a changed version runs as a network service'
  ui_must2_b: 'Keep notices'
  ui_must2_body: 'the licence and the copyright lines stay with the file'
  code_h: 'The code'
  code_sub: 'GNU Affero General Public License v3 (AGPL-3.0-only) · free software'
  code_tldr: 'Read it, run it, change it, fork it, for any purpose at all, a commercial one included. There is no field of use to stay out of and nobody to ask. What the licence asks back is source: ship a changed version, or let people use one over a network, and those people get your source too.'
  code_can1: 'Read, run and modify the source, free'
  code_can2: 'Fork it for anything, another sport included'
  code_can3: 'Self-host it, sell it, contribute back'
  code_must1_b: 'Share source'
  code_must1_body: 'including to people who only ever reach it over a network (section 13)'
  code_must2_b: 'Keep notices'
  code_must2_body: 'retain the licence and the copyright lines'
  # The fifth card. Every other one on this page grants something; this one
  # withholds, which AGPL v3 §7(e) expressly permits a free-software project
  # to do. Full policy in TRADEMARK.md.
  brand_h: 'The name and logo'
  brand_sub: 'All rights reserved · not an open licence'
  brand_tldr: 'The one thing here that is not given away. Because the code is free, anyone can stand up a copy of this site, and the name is the only thing left that tells a rider whether they are looking at the Cycling Commons or at somebody else''s fork of it. Say your work is built on the Commons. Do not call your work the Commons.'
  brand_can1: 'Say your work uses or is built on the Commons'
  brand_can2: 'Name us in articles, talks and reviews'
