    blurb: 'One sentence about what we use it for, in English. The site translates it the way it translates everything else.'
    blurb_key: 'This sentence comes from the catalogue key %key%, so it already reads in five languages. Text typed here is ignored while that key exists.'
    creator: 'Who made the dataset, when that is somebody other than who publishes it. A credit naming only the publisher credits the pipe rather than the person.'
    match_radius: 'How close an upstream point must be to an OpenStreetMap node to count as the same thing. Too small and you get two pins for one tap; too large and one pin swallows two.'
    reclaim: 'A record riders confirmed is ours. This provider takes it back only at harvest, only when its own dated survey is newer than our newest confirmation by the margin, and only if the box is ticked. A provider that publishes no dates never can. Riders take it back with the next confirmation, and no confirmation is ever removed.'
    promoted: 'A licence that obliges nothing gets a name in the comma run. Tick this to give it a full row anyway, which is for a dataset whose creator deserves the sentence.'
    rank: 'Where this sits among the other authorities when two of them describe one place. It can never outrank a rider: every authority sits below them whatever this says. 0 means the question does not apply.'
    rank_system: 'This provider is built in. Its rank is where the ladder has always put it, and moving it would silently reorder every duplicate decision on the map.'

markers:
  title: 'Markers'
  lede: 'Every rung of the evidence ladder, drawn by the rules the map draws. The border says who keeps the record, the badge says whether anybody has stood there. If two rungs look the same here, that is a finding, not a rendering bug.'
  grid_h: 'The grid'
  grid_t: 'Three borders by two badge states. Custody never says a record is worse; evidence never says who owns it.'
  axis_border: 'Border: who keeps the record'
  badge_on: 'Nobody has stood here on record'
  badge_off: 'A dated witness is on record'
  custody_gross: 'A gross provider, small disc'
  custody_specialty: 'A specialty provider, dashed'
  custody_ours: 'Ours, solid paper'
  sentence: 'The "?" means nobody has stood here on record.'
  ladder_h: 'The ladder'
  ladder_t: 'Ordered by the kind of evidence first, then how many, then how recent. A fossil claim was typed once and carries no date. A live claim is a source that republished the record inside the window. A witness is a person at the point on a known date.'
  col_rung: 'Rung'
  col_dark: 'Dark map'
  col_light: 'Light map'
  col_evidence: 'Evidence'
  col_grade: 'Grade'
  rung_1: 'A fossil claim: a gross provider''s row, typed once and never dated.'
  rung_2: 'A gross provider still carries the row: a live claim.'
  rung_3: 'One of our own rows. A rider put it here and a curator accepted it; nobody has confirmed it yet.'
  rung_4: 'A specialty provider''s row with no dates: a fossil claim.'
  rung_5: 'A specialty provider republished the row inside the window: a live claim.'
  rung_6: 'A specialty provider with a per-record operational status, such as a register''s "out of order" flag.'
  rung_7: 'A witness that aged out of the window. Still a witness, so above every claim, but the badge returns.'
  rung_8: 'A published witness inside the window: an OpenStreetMap check date or a register''s dated survey.'
  rung_9: 'One rider inside the window, below the verify threshold. Custody does not gate this rung.'
  rung_10: 'Verified: the threshold number of riders stood here.'
  rung_11: 'Verified: one curator''s word, below the threshold.'
  rung_12: 'Verified, and five or more riders stood here.'
  grade_claimed: 'claimed'
  grade_attested: 'attested'
  grade_minimum: 'minimum'
  grade_high: 'high'
  not_produced: 'not produced yet'
  utility: 'The rungs are utility and never reach Best of. Fifty riders saying a viewpoint is there is none of them saying it is good.'
