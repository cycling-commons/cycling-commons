home:
  eyebrow: 'OPEN CYCLING DATA · A PREVIEW OF WHAT COULD BE'
  h1: 'Every road.<br/>Every trail.<br/>One <em>open atlas</em><span class="endp">.</span>'
  lede: 'A community-built map of the world''s best riding — climbs, water, views, bike-friendly stays — free for anyone to use, build on, and improve.'
  cta_map: 'Explore the map'
  cta_contribute: 'Contribute'
  tick_label: 'Launching'
  tick_year: '2026'
  corner_br: 'SCROLL ↓'
  disc_label: 'FOR EVERY KIND OF CYCLING —'
  frag_kicker: 'ONE PLACE, NOT A DOZEN APPS'
  frag_h2: 'Cycling knowledge is scattered. The Commons gathers it.'
  frag_lead1: 'Today every layer lives in its own silo — one app for climbs, another for routes, another for bike-friendly stays, another for road conditions — and most are closed. Riders stitch a dozen tools together and the data never joins up. The Commons brings the non-personal knowledge into one open place, free to query and build on.'
  frag_lead2: 'And where good open data already exists, we don''t rebuild it — we <b>partner</b>. We link and interoperate with other open-data communities (such as open hospitality networks for places to sleep) instead of walling off our own copy. Open data should join up, not fragment further.'
  frag_panel_h: 'Today. A dozen apps for your ride.'
  frag_climbs: 'Climbs &amp; cols'
  frag_climbs_tag: 'closed silo'
  frag_rides: 'Recommended routes &amp; ratings'
  frag_rides_tag: 'closed silo'
  frag_scenic: 'Scenic, views &amp; heritage'
  frag_scenic_tag: 'scattered'
  frag_stays: 'Bike-friendly stays'
  frag_stays_tag: 'closed silo'
  frag_road: 'Road surface &amp; conditions'
  frag_road_tag: 'scattered'
  frag_water: 'Water · food · services'
  frag_water_tag: 'scattered'
  frag_vs: 'The Commons → one open atlas'
  what_kicker: 'THE PRINCIPLE'
  what_h2: 'Open data about the world — never about you.'
  what_lead: 'The Commons holds the map: climbs, water, hazards, stays — facts about places, never about people. No identity, no tracking, nothing personal. Built on OpenStreetMap, given back to it, governed by its community.'
  what_in_h: 'The world''s riding data'
  what_in_p: 'Climbs, water points, scenic views, heritage POIs, bike-friendly stays, road conditions — open under ODbL.'
  what_out_h: 'Anything personal'
  what_out_p: 'Your identity and private data — the Commons never collects it. It maps the world, not the rider.'
  what_free_h: 'For anyone at all'
  what_free_p: 'Query it, export it, build on it. That''s what makes it a commons.'
  cur_kicker: 'CURATION, NOT OVERLOAD'
  cur_h2: 'The best of a region, chosen by riders.'
  cur_lead: 'Arrive somewhere new and see the climbs, views and routes worth your weekend — voted by the riders who know it, refreshed each season. Utility data like water aims for full coverage; the firehose waits in the backlog if you want it all.'
