# Credits — who and what the Commons builds on. Project names, URLs and
# licence identifiers live in the template; only the prose is translated.
credits:
  kicker: 'Who we build on'
  title: 'Credits'
  lead: 'The data, software and design the Cycling Commons builds on — and the licences they come under.'
  lic_open_data: 'Open data'
  lic_osm_extracts: 'OSM extracts'
  lic_linked: 'Linked service'
  lic_free_tiles: 'Free vector tiles'
  lic_various: 'Various open-source licences'
  lic_flags_pd: 'artwork public domain'
  data_h: 'The data'
  data_sub: 'The sources the atlas is built from'
  osm_p: 'The foundation of the atlas. Cycling infrastructure, place names and the points riders confirm all start from OpenStreetMap data, © OpenStreetMap contributors.'
  wallonia_p: 'Accommodation and points of interest for Wallonia, from the Walloon geoportal''s PIVOT database.'
  georegister_p: 'The Dutch national open-data registry — the source for drinking-water tap points in the Netherlands.'
  geofabrik_p: 'Regional OpenStreetMap extracts that feed the coverage pipeline.'
  drinkwater_p: 'Dutch water points link to drinkwaterkaart.nl so riders can double-check a tap before counting on it.'
  map_h: 'The map'
  map_sub: 'Rendering, tiles and search'
  maplibre_p: 'The open-source renderer that draws every map on this site.'
  openfreemap_p: 'Serves the basemap tiles (Liberty style) — free and open, no API keys.'
  protomaps_p: 'The PMTiles single-file archive format behind the coverage overlays.'
  lic_per_photo: 'per-photo licence · credit shown on each photo'
  wikimedia_p: 'Seeded climb and place photos come from Wikimedia Commons; every photo carries its own author credit and licence in the drawer.'
  copernicus_p: 'Elevation model behind the climb gradients. "produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved". The organisations in charge of the Copernicus programme by law or by delegation do not incur any liability for any use of the Copernicus WorldDEM-30.'
  req_badge: 'required notice'
  req_legend: 'marks an attribution the licence or terms of that source legally require — the wording there is theirs, not ours, and must not be edited. Everything else on this page is a thank-you.'
