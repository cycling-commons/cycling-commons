developers:
  demo_label: 'Demo'
  demo_body: '— a preview of the open API &amp; bulk exports. Launching 2026.'
  kicker: 'Build on the Commons'
  title: 'An open API. Free. For anyone to build on.'
  lead: 'Query the Commons by type and area, or pull bulk dumps per country. Open by default — that''s what makes it a commons. Reads are open and anonymous, within fair-use rate limits; writes need a free account token. We rate-limit and monitor for abuse so it stays fast and free for everyone.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/features'
  ep1_desc: 'filter by <code>type</code>, <code>bbox</code>, <code>region</code>'
  ep2_path: '/v1/regions/{id}/best'
  ep2_desc: 'the curated best-of for a region'
  ep3_path: '/v1/export/{country}.geojson'
  ep3_desc: 'bulk ODbL dump'
  ep4_path: '/v1/features'
  ep4_desc: 'contribute (token + goes to review)'
  ex_kicker: 'Example request'
  resp_kicker: 'Response'
  attr_kicker: 'Required attribution'
  rules_kicker: 'The rules'
  rules_body: '<b>Rate limits &amp; fair use.</b> Anonymous reads are <b>rate-limited</b> — a commons isn''t a CDN and we don''t have infinite servers. A free API key raises your limit; for heavy or repeated use, pull the <b>per-country bulk exports</b> instead of hammering the live API. Writes need a free account token and pass through review. Licences: data <b>ODbL 1.0</b>, media <b>CC BY-SA 4.0</b> — see the plain-language summary. Attribute, share-alike, keep open; commercial use is fine.'
