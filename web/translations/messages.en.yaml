  playbook_email:
    title: 'Playbook: email-change requests'
    why: 'Email is read-only in settings, so every change request lands in the support mailbox. Verify control of the account’s existing anchors before touching anything — the request mail itself proves nothing.'
    s1_t: 'Never trust the request mail'
    s1_b: 'From-headers are spoofable, and “writing from my new address because I lost the old one” is the standard opening of a takeover. Display name, contributions and join date are public — knowing them proves nothing.'
    s2_t: 'Anchor 1 — the old mailbox'
    s2_b: 'Reply to the address on file (typed from this admin, never reply-to) with a one-time code and require it back. If they can receive there, the change is low-risk.'
    s3_t: 'Anchor 2 — a logged-in session'
    s3_b: 'Old mailbox claimed dead? Dictate an in-account action (“set your riding radius to 120 km”, “paste this code into your display name for an hour”) and verify it happened. That proves the password — and the 2FA factor on enrolled accounts.'
    s4_t: 'No anchor left = refuse'
    s4_b: 'Cannot receive at the old address AND cannot log in: there is no honest way to tell owner from attacker. The safe answer is “create a new account”. Refusing here is the point of the manual flow, not a support failure.'
    s5_t: 'After verifying, still hedge'
    s5_b: 'Notify the old address with a “this wasn’t me” contest window, delay execution 48–72 h, and record the change with an audit note on the user record.'
    rule: 'Urgency is a red flag, never a reason to skip a step — the legitimate owner survives a 48-hour delay; the attacker’s window usually doesn’t.'
    spec: 'Canonical version: docs/specs/account-and-auth.md §8 “Support playbook” — keep the two in sync.'
  settings:
    title: 'System configuration'
    intro: 'The editorial numbers the site runs on. A change takes effect on the next request — no deploy, no restart. Every change is recorded in the activity log with its old and new value.'
    infra_note: 'Infrastructure values (coverage tiles, the manifest URL, the map’s Content-Security-Policy host) are deliberately not here: they are set in the environment and changing one needs a deploy.'
    save: 'Save settings'
    reset: 'Reset'
    overridden: 'Changed here'
    default_note: 'Default: %value%'
    range_note: 'Allowed: %min%–%max%'
    error_range: 'Enter a whole number between %min% and %max%.'
    error_required: 'This cannot be empty — every setting needs a value.'
    error_text: 'That value is not acceptable for this setting.'
    group:
      map: 'Map'
      routes: 'Routes'
      moderation: 'Moderation'
      media: 'Photos'
      alerts: 'Alerts'
      community: 'Community'
    field:
      community_voting_live:
        label: 'Seasonal voting is live'
        help: 'Set to 1 when the voting rounds are open. At 0 every vote call-to-action on the map stays hidden — a button for a round that does not exist reads as broken.'
      traffic_grouping:
        label: 'Measured traffic: time groups'
        help: 'How curators see measured traffic: all (one group per road), daytype (workdays and weekends apart) or daytype_band (that, split into five parts of the day). One scheme at a time, so no group can be worked out from two others. Every change is logged.'
      traffic_map_layer_live:
        label: 'Measured traffic: on the map'
        help: 'Set to 1 to show curators the measured-traffic layer on the map. At 0 the layer and its controls are hidden: it is not in use yet.'
      map_confirmed_default_threshold:
        label: 'Confirmed readiness: checked places'
        help: 'How many places somebody has checked a region needs before a curator may open it in Confirmed mode by default. It needs no spread over kinds of thing, only enough that the mode does not look empty.'
      map_curated_default_threshold:
        label: 'Best of readiness: total items'
        help: 'How many curated items a region needs in total before a curator may open it in Curated mode by default. Lower it to unlock young regions sooner; raise it to hold the line on quality.'
      map_curated_default_min_blocks:
        label: 'Best of readiness: kinds of thing'
        help: 'How many different blocks (surface, climbs, stays, scenic, history, best-of routes) must each carry their own minimum. Set it to 1 to make readiness a plain total again.'
      map_curated_default_min_per_block:
        label: 'Best of readiness: items per kind'
        help: 'What a block needs before it counts towards the requirement above. Together these two stop one full layer from carrying a region on its own.'
      map_confirmation_stale_months:
        label: "Confirmations go stale after (months)"
        help: "How long a rider's check on a tap, shop, toilet or hazard counts for. Past this the map gives the pin an orange ring, so a rider passing it knows it is worth a look. One check resets the clock. Places that do not change - climbs, viewpoints, history - never go stale."
      map_item_verify_threshold:
        label: 'Riders needed to verify a place'
        help: 'How many riders other than the submitter must confirm a place before it verifies itself and loses its "?" badge. A curator still settles it in one tap. Lower it for quiet regions where two riders would otherwise never stand at the same tap.'
      route_region_active_cap:
        label: 'Active routes per region'
        help: 'How many routes a region may have live at once. A curator approving beyond the cap is blocked and asked to retire something first.'
      route_ride_verify_threshold:
        label: 'Rides needed to verify a route'
        help: 'How many riders other than the proposer must mark a route as ridden before it verifies itself. Lower it for young regions where routes would otherwise never leave the queue.'
      moderation_retention_months:
        label: 'Rejected photos: files kept (months)'
        help: 'How long the files of a rejected photo are kept before the cleanup deletes them. The photo''s record and the moderation decision stay. Turned-down contributions and their messages are not on this timer: they stay while the rider''s account does.'
      media_urgent_breaker_hourly:
        label: 'Auto-withhold budget: per hour'
        help: 'How many photos an anonymous "intimate imagery or a child" report may hide from the map by itself in one hour. Hiding is not removing — only a curator removes a photo. Past this budget the reports still reach the moderation desk but stop hiding anything, and you are emailed. Set it to 0 to switch automatic hiding off entirely during a sustained attack.'
      media_urgent_breaker_daily:
        label: 'Auto-withhold budget: per day'
        help: 'The same ceiling measured over a day, so a slow drip cannot do what a burst cannot. Both budgets must have room before a report can hide a photo on its own.'
      app_alert_emails:
        label: 'Alert recipients'
        help: 'Comma-separated email addresses that receive operational alerts: the auto-withhold breaker opening, and every escalation of suspected illegal content. Change it when the usual reader is away — an escalation must reach somebody the same day. At least one valid address is required.'
      app_support_emails:
        label: 'Support recipients'
        help: 'Comma-separated email addresses that receive contact-form messages and bug reports. Separate from the alert recipients above, so the front door and the pager can point at different people. Leave it EMPTY to fall back to the alert recipients.'
