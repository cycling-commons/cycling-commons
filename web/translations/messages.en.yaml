about:
  kicker: 'About'
  title: 'The map belongs to everyone.'
  lead1: 'Every rider carries a private map: the fountain that saved a hot July, the climb worth the extra hour, the back road that''s somehow always empty. Today that knowledge lives in one head and dies there. Cycling Commons is where it lives instead.'
  lead2: 'It''s an open, community-built map of the world''s best riding, for every kind of cycling. Open data anyone can use, governed by the riders who build it.'
  problem_kicker: 'The problem'
  problem_title: 'A different app for everything.'
  problem_lead1: 'Climbs in one app, routes in another, places to sleep in a third, road conditions nowhere at all. Most of it closed, none of it joined up. Riders pay for a dozen tools and still can''t see the whole picture. Most of the knowledge exists; it''s just scattered and/or locked away.'
  problem_lead2: 'The Commons gathers the non-personal knowledge, the map and never the rider, into one open place. Free to query, free to export, free to build on, by anyone at all.'
  believe_kicker: 'What we believe'
  believe_princ1_num: 'II'
  believe_princ1_title: 'The map, not the rider.'
  believe_princ1_body: 'Open facts about places, not people. The Commons collects nothing about how, where, or when you ride.'
  believe_princ2_num: 'III'
  believe_princ2_title: 'Open for everyone.'
  believe_princ2_body: 'ODbL data, CC BY-SA 4.0 media, a free API: usable by anyone, commercial or not.'
  believe_princ3_num: 'I'
  believe_princ3_title: 'Curation, not overload.'
  believe_princ3_body: 'The best of a region, voted by riders, not an endless dump.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Governed, not just published.'
  believe_princ4_body: 'Built on Elinor Ostrom''s principles for commons that don''t collapse or get captured.'
  believe_ostrom: 'showed that communities can govern a shared resource without privatising it and without a central owner. She shared the 2009 Nobel Memorial Prize in Economic Sciences with Oliver E. Williamson, her half for her analysis of the commons. The'
  believe_ostrom_link: 'Governance page'
  believe_ostrom_suffix: 'maps each principle to a part of the system.'
  made_kicker: 'How it gets made'
  made_title: 'Five kinds of people, one loop.'
  made_ride: '<b>Riders</b> find water, food, repair stops, climbs and places to sleep on one map. They check a route before they set off, or plan it around what the map shows and finish it in the planner they already use.'
  made_add: '<b>Contributors</b> add what they find on the road, from a new tap to a closed bridge. A curator checks each addition before it goes live.'
  made_curate: '<b>Curators</b> look after a region they know: they review what riders send in, keep that part of the map true, and bring the Commons to riders there.'
  made_extend: '<b>Makers</b> build the platform itself: code, data pipelines, design, translations and funding.'
  made_build: '<b>Builders</b> take the open data into their own apps and tools, free under an open licence, so it reaches riders wherever they ride. In time, what their users add comes back through the same API.'
  partners_kicker: 'Partners, not silos'
  partners_title: 'Where good open data exists, we join it.'
  partners_lead1_pre: 'The Commons isn''t here to rebuild what others have already opened. We build on'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'and contribute back to it. And for the layers we don''t own, like bike-friendly places to sleep, we''d rather'
  partners_lead1_partner: 'partner with open communities'
  partners_lead1_post: ', such as open hospitality networks, than wall off a private copy of their data.'
  partners_lead2: 'Open data should connect, not fragment further. Every partnership makes the whole atlas richer without anyone enclosing it.'
  steward_kicker: 'Who stewards it'
  steward_title: 'BikeCoders today, a foundation tomorrow.'
  steward_lead: 'BikeCoders seeds and stewards the Commons today. But the commitment is public from day one: open licence, separate data and accounts, and a path to spin out into an independent foundation once there''s a community to govern it. Everything already released, code and data alike, stays open for good: no future owner, sale or change of heart can take it back.'
  steward_cta_map: 'Explore the map →'
  steward_cta_account: 'Create a free account'
coverage:
  kicker: 'State of the Atlas'
  title: 'How complete is the map?'
  lead: 'What''s covered, what''s thin, and where help is needed. Live numbers, straight from the database.'
  kpi_pois: 'Reference items on file'
  kpi_items: 'Catalog items'
  kpi_routes: 'Recommended routes'
  kpi_countries: 'Countries started'
  table_kicker: 'Coverage by country'
  terms_reference: '<b>Reference items</b>: the baseline we track for each area, harvested from OpenStreetMap. This layer is OSM top to bottom; data from other sources is imported as catalog items instead, where it keeps its own provenance.'
  terms_catalog: '<b>Catalog items</b>: what the Commons curates itself, with its own attributes, history and confirmations. The second line says where those rows came from: <b>OSM</b> mirrored from OpenStreetMap, <b>partner</b> imported from an open dataset somebody else maintains, <b>riders</b> contributed here, <b>derived</b> computed by the pipeline.'
  terms_bars: '<b>Per %u%</b>: density over the onboarded area, so a small country stands next to a big one fairly. The bar is that same figure, scaled against the densest country.'
  th_country: 'Country'
  th_regions: 'Regions'
