roles:
  kicker: 'Get involved'
  title: 'Contributors and curators'
  lead: 'Two ways to keep the map true. Anyone can do the first. The second is for a place you know.'
  contributor_h: 'A contributor'
  contributor_who: 'Any rider with an account.'
  contributor_l1: 'Adds a place, a climb or a route.'
  contributor_l2: 'Fixes what is wrong or gone.'
  contributor_l3: 'Confirms a place is still there.'
  contributor_note: 'A curator checks your edit before it goes on the map.'
  contributor_cta: 'Add or fix something on the map'
  curator_h: 'A curator'
  curator_who: 'A rider we accepted for a region or a whole country. The person who brings that place to life.'
  curator_can: 'Any of these, as much or as little as suits you. None of it is a duty.'
  curator_l1: 'Find open data we can import there: taps, repair stands, routes, climbs.'
  curator_l2: 'Fill the gaps only someone who knows the place would see.'
  curator_l3: 'Make the Commons known there: clubs, shops, tourist offices, local riders.'
  curator_l4: 'Welcome new contributors and answer their questions.'
  curator_l5: 'Check the edits riders send in, and confirm, correct or decline them with a note back.'
  curator_l6: 'Add new items and fix what is there directly, with no wait for a check.'
  curator_note: 'You apply from the regions page, for one region or a whole country.'
  curator_cta: 'Pick a place to curate'
  example_h: 'How it works'
  example_p: 'Sam adds a water tap in Bath. Alice curates England. She sees it in her queue, checks it and confirms it. Now it is on the map, confirmed by the community.'
  one_account: 'One account, both roles: every curator is also a contributor.'
  progress_h: 'What this adds up to'
  progress_lead: 'The Commons is incubated inside BikeCoders, with a public promise to spin it out to an independent foundation. Two counters mark the way there, read live from this database.'
  progress_contrib_l: 'external contributors'
  progress_contrib_def: 'Unique accounts with one reviewed contribution to the project — code, translation, curation or writing — staff accounts excluded.'
  progress_points_l: 'rider-backed data points'
  progress_points_def: 'Places riders added or confirmed, each account counting once per place; adding and verifying weigh the same.'
  progress_gov_link: 'The full commitment: governance'
a11y:
  kicker: 'Accessibility'
  title: 'What works, and what does not yet.'
  lead: 'An honest account of how usable this site is, including the parts that are not good enough. If something here stops you, tell us and we will fix it.'
  last_updated: 'Last updated 27 August 2026'
  report_pre: 'Something here in your way?'
  report_link: 'Report a barrier'
  report_post: '. No account needed. We answer within one month, and sooner where we can.'
  h_aim: 'What we aim for'
  aim_body: 'We hold this site to <b>WCAG 2.2, level AA</b>. That is a target we work towards, not a certificate we hold: parts of the site meet it today and parts do not, and the two lists below say which is which.'
  h_works: 'What works today'
  works_intro: 'Each of these was measured, not assumed.'
  works_keyboard: '<b>Keyboard.</b> Every page outside the map can be used without a mouse, and the focus outline is never removed.'
  works_skip: '<b>Skip to content.</b> The first thing a keyboard reaches on every page, and it steps over announcement bars rather than landing on them.'
  works_contrast: '<b>Contrast.</b> Text was measured against its own background across the site and the map chrome, in both the light and the dark map theme, and the failures were fixed.'
  works_targets: '<b>Touch targets.</b> Every control we draw clears the 24px minimum, checked on a phone rather than in a browser window made narrow.'
  works_zoom: '<b>Zoom.</b> Text can be enlarged to 200% without anything being cut off or needing sideways scrolling.'
  works_motion: '<b>No motion you did not ask for.</b> Nothing autoplays, nothing flashes, and there is no carousel.'
  h_gaps: 'What does not work yet'
  gaps_intro: 'These are real and we are not hiding them.'
  gap_map: '<b>The map is not usable with a screen reader.</b> It is a drawing on a canvas, and panning and zooming a picture has no meaning without sight. This is the biggest gap on the site and we have no quick fix for it. See below for what to use instead.'
  gap_vendor: '<b>Some map controls are not ours.</b> The zoom buttons and the attribution toggle come from the map library. They clear the minimum but they are smaller than we would draw them, and we cannot restyle them without forking it.'
  gap_audit: '<b>Nobody outside has audited this.</b> Everything above was measured by the people who built the site, which is not the same as being tested by someone who uses a screen reader every day.'
  gap_translations: '<b>Translations lag behind English.</b> New wording appears in English first, so a page in another language can briefly show a mix.'
  h_instead: 'What to use instead of the map'
  instead_pre: 'Everything the map draws also exists as text or as data. The'
  instead_regions: 'region pages'
  instead_mid: ' list what has been found in each place, as ordinary headings and lists. The'
  instead_api: 'open API'
  instead_post: ' serves the same data to any tool you prefer. Neither is a full replacement, and we know it.'
  h_legal: 'Where we stand legally'
  legal_body: 'We are not claiming compliance with the <b>European Accessibility Act</b>, because it is not clear that it applies to us. The Act names particular consumer services, a free open map is not obviously one of them, and micro-enterprises providing services are exempt in any case. We would rather say that plainly than imply a duty we may not have. We hold ourselves to WCAG because it is the right thing to do, not because somebody made us.'
  h_how: 'How this was checked'
  how_body: 'By hand, in a real browser, on a real phone: keyboard walkthroughs, contrast measured against the actual rendered background, and touch targets measured in place rather than guessed from the stylesheet. Some of it is pinned by automated tests so it cannot quietly regress. None of it involved an accessibility overlay, and it never will: those make a site worse for the people they claim to help.'
  footer_pre: 'This page is only worth anything if it changes. If you hit something it does not mention,'
  footer_link: 'tell us'
  footer_post: ' and it goes on the list.'

