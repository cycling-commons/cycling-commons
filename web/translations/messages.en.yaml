export:
  readme: |
    YOUR CYCLING COMMONS DATA
    =========================

    Generated %generated% for the account "%account%".

    This archive answers two GDPR rights at once: the right of access
    (Art. 15) and the right to data portability (Art. 20). Portability covers
    only what you gave us yourself and access covers more than that, so rather
    than make you pick between two downloads, this is the superset.

    WHAT IS IN HERE

      account.json        Your account: email, display name, language, country,
                          base location, preferences and timestamps.
      contributions.json  The submissions you made, and the field-level changes
                          they produced on the map once a curator accepted them.
      community.json      Confirmations, route votes, rides, correction
                          suggestions, country requests, curator applications.
      messages.json       Your dashboard messages, in both directions.
      consent.json        Every photo licence you granted: which wording, which
                          version of it, and when.
      translations.json   Your proposed UI translations. These are AGPL-3.0-only
                          contributions, not personal data about the rider.
      photos/index.json   One entry per photo you uploaded, with its status and
                          the file it corresponds to.
      photos/*.webp       The photos themselves.

    WHAT IS NOT IN HERE, AND WHY

      Your password, your two-factor secret and your backup codes. These are
      the credentials that protect this account. An export is a file people
      forward and back up, and handing over the keys along with the contents
      would make you less safe, not better informed.

      The identity of the curators who handled your work. What was decided
      about your submissions is your data and all of it is here, notes
      included. Which person made the decision is theirs.

    ABOUT THE PHOTOS

      These are our processed copies, not the files you uploaded. We re-encode
      every photo on arrival and strip its metadata, including any location the
      camera recorded, so the file exactly as you sent it is not something we
      keep. An entry in the index with "file": null is a photo whose stored
      objects have already been deleted; the record of it survives.

      Photos a curator approved are licensed CC BY-SA 4.0 and stay part of the
      Commons. That licence cannot be withdrawn. Your name, however, is not in
      the files: attribution is resolved live from your profile, so making your
      profile private, or closing your account, changes what every copy of your
      photo credits, including copies downloaded long ago.

    QUESTIONS

      info@cyclingcommons.org
scout:
  kicker: 'Scout · the CC Tagger'
  title: 'Tag what you see, while you ride.'
  lead: 'Scout is a one-tap field recorder for your bike computer. Mark a hazard, a closure, a surface change or a water stop as you pass it — no stopping, no phone, no typing. Every tag is written straight into your ride file, in an open, documented format.'
  plat_garmin: 'Garmin Edge'
  plat_android: 'Android'
  plat_karoo: 'Hammerhead Karoo'
  plat_available: 'Available now'
  plat_soon: 'Coming soon'
  plat_planned: 'Planned'
  shot_garmin_alt: 'The Scout tag menu on a Garmin Edge, showing the six tag types and an overtake count'
  logo_alt: 'The Scout logo'
  shot_garmin_cap: 'On the bars'
  shot_android_alt: 'Scout on an Android phone, showing the tag button and the tags recorded so far this ride'
  shot_android_cap: 'In your pocket'
  what_h: 'What it does'
  what_p1: 'You are the only person who knows the road is shut, that the gravel starts here, or that the tap in the square works. That knowledge normally evaporates by the time you get home. Scout catches it at the moment you ride past: one tap on the screen, and it is recorded with your position and the time.'
  what_p2: 'Scout <b>stands alone</b>. The app and its file format work with or without the Cycling Commons — your tags are yours, in your own ride file, readable by anything that can read it.'
  step1_no: '01'
  step1_h: 'Tap as you ride'
  step1_p: 'A tag takes one press. Pick a type from the submenu if you want to be specific, or leave it and sort it out later.'
  step2_no: '02'
  step2_h: 'It lands in your ride file'
  step2_p: 'Every tag is written into the activity your computer was already recording, in an open format — nothing separate to sync or lose.'
  step3_no: '03'
  step3_h: 'Tidy it up afterwards'
  step3_p: 'Back home you can correct a mis-tap, move a tag to the right spot on the road, and — if you want to — send it to the Commons, where it goes through the same review as any other contribution.'
  tags_h: 'What you can tag'
  tags_lead: 'Six tag types, plus an automatic one if you ride with a radar.'
  tags_col_tag: 'Tag'
  tags_col_what: 'What it is for'
  tag_resupply: 'Resupply'
  tag_resupply_p: 'Water, food, or a bike-repair and pump stop.'
  tag_closure: 'Closure'
  tag_closure_p: 'Road shut or a detour — and roughly how long you think it will last, which is what lets the map retire it by itself later.'
  tag_surface: 'Surface'
  tag_surface_p: 'Mark a stretch with a start type and an END, so it is recorded as a segment rather than a point. Aligned to OpenStreetMap surface values.'
  tag_notice: 'Notice'
  tag_notice_p: 'A bad corner, a junction, potholes, or anything else sketchy.'
  tag_scenery: 'Scenery'
  tag_scenery_p: 'A view worth remembering.'
  tag_other: 'Other'
  tag_other_p: 'Everything else. Single tap, no submenu — decide what it was when you get home.'
  tag_radar: 'Overtakes'
  tag_radar_p: 'With a Varia-compatible radar paired, Scout counts the vehicles that pass you, automatically. It is the closest thing there is to an objective measure of how busy a road really feels.'
  privacy_h: 'Your ride stays yours'
  review_title: 'Review a ride'
  review_pick: 'Choose a ride file'
  review_close: 'Close'
  review_send_all: 'Send the rest'
  review_photo_drop: 'Choose a photo, or drop one here'
  review_hint: 'The .fit file your ride was recorded to — or drop it here.'
  review_approved: 'sent to the Commons'
  privacy_p: 'If you send tags to the Commons, <b>only the tags travel</b> — the point you tapped, what you tagged it as, and when. Your route is read in your own browser and never uploaded, never stored, and never held by us.'
