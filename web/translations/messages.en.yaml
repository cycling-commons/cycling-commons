roadmap:
  kicker: 'Roadmap'
  title: 'What we are building next.'
  lead: 'No dates, because we would only be guessing. What is being built now, what comes next, and what we want but have not scheduled. The order within each group is not fixed.'
  group_now: 'Now'
  group_now_sub: 'Being built. These are the ones with someone actually on them.'
  group_next: 'Next'
  group_next_sub: 'Decided and waiting for a turn. Barring a surprise, these are what follows.'
  group_later: 'Later'
  group_later_sub: 'Wanted, not scheduled. Real intentions, no promises about when.'
  item_going_live: '<b>The launch.</b> The first weeks online: finding testers, quickly fixing what they run into, and making the Commons known among riders.'
  item_provider_refresh: '<b>More data providers, refreshing themselves.</b> Official open sources, such as a national drinking-water register, added from the curator desk and refreshed on a schedule.'
  item_region_vote: '<b>The seasonal vote.</b> Vote for a region''s best climbs, routes, views, heritage and places to sleep, one season at a time. The ballot is built and opens after launch.'
  item_heatmap: '<b>Where riders like to go.</b> A heat layer that lifts the places many riders value, such as views and climbs. Built from anonymous points only, and a spot only shows once enough different riders are behind it, so it never points to one person.'
  item_standing: '<b>Contributor standing.</b> Riders whose work keeps being approved earn a lighter touch, such as edits going live at once, instead of being granted it by hand.'
  item_osm_giveback: '<b>Giving back to OpenStreetMap.</b> What riders confirm here, offered back upstream in a form OpenStreetMap can take.'
  item_map_a11y: '<b>Make the map usable without a mouse.</b> The honest gap in our accessibility statement: keyboard and screen-reader access to the map itself, not only to the pages around it.'
  item_route_export: '<b>Take a route with you.</b> Shape a route around what the map shows, then send it to the planner or device you already use.'
  item_region_portrait: '<b>A portrait of each region.</b> The region page counts what is there. It should say what the riding is like: how hilly, how much is paved, the big climbs, the signed network, water and toilets per hundred kilometres, the routes riders recommend, and how fresh the data is.'
  item_reviews: '<b>Your own words on any place.</b> A short note of your own on a tap, a climb, a stay or a route, next to the facts: what it was like when you were there. Several riders, several notes. Not a rating.'
  item_favourites: '<b>Your favourite places.</b> Save a tap, a climb, a stay or a route to a favourites list in your profile, so you find it again before the next ride.'
  item_roadmap_votes: '<b>Have a say in this list.</b> Vote on what matters to you, follow an item, and propose one of your own.'
  item_more_countries: '<b>More countries and regions.</b> The Commons opening in new countries, each with curators who know the roads. Ask for yours on the join page.'
  item_scout_devices: '<b>Scout on more devices.</b> Tag what you pass on Android first, then on Hammerhead Karoo and iPhone.'
  item_open_api: '<b>The open data API, complete.</b> Every place, climb and route readable through one stable, documented API, plus bulk downloads of the data and the map tiles, so anyone can build on the Commons or host a copy.'
  foot_shipped_pre: 'Already shipped is on the'
  foot_shipped_link: 'changelog'
  foot_shipped_mid: '. Something missing that you need? Tell us on the'
  foot_contact_link: 'contact page'
  foot_shipped_post: ' and it will be read by a person.'
changelog:
  kicker: 'Changelog'
  title: 'What is new.'
  lead: 'Every release, newest first, in plain words. The version here is the same one printed at the foot of every page, so you can always tell which one you are looking at.'
  feed_title: 'Cycling Commons: what is new'
  feed_subtitle: 'Releases of the Cycling Commons platform.'
  feed_pre: 'Follow along without an account: subscribe to the'
  feed_link: 'Atom feed'
  feed_mid: '. What is coming next is on the'
  feed_roadmap: 'roadmap'
  feed_post: '.'
  v091_banner: "<b>The map says where it does not reach yet.</b> Outside the countries it covers, a banner says so and shows how to help bring one in."
  v091_climbs: "<b>Mark a climb's steepest point.</b> The climb editor lets you mark where a climb is steepest, and long climbs now get their gradient profile too."
  v091_languages: "<b>English and Dutch.</b> The site is served in English and Dutch; an address in another language leads to one of the two."
  v091_reset: "<b>Password reset in your language.</b> The reset email comes in the language you use the site in, with the link also written out as text."
  v091_bugs: "<b>Reporting a bug is easier.</b> The bug button can take a screenshot of the page for you, the panel can be made bigger, and it answers in your language."
  v091_safety: "<b>Every picture is checked before anyone sees it.</b> Screenshots in bug reports are virus-scanned and redrawn in the background, and photos from Wikimedia Commons are always shown from our own copy."
  section_public: "Public site"
  section_rider: "Rider account"
  section_curator: "Curator account"
  v095_privacy: "<b>A clearer privacy notice that tells you when it changes.</b> It has a version number and a list of what changed. If you are signed in, you see a notice until you have read the new version. It uses plain words, names each service outside the EU and what it sees, and every GDPR article links straight to that article."
  v095_terms: "<b>Terms and photo consent that say the same.</b> The terms show a version number, its date and what changed, like the privacy notice, and both link their full revision history. The photo consent now says what the terms say: ordinary editing such as cropping is fine, adding or removing things is not. You tick it once more on your next upload. If you are signed in, you see a notice until you have read new terms. A big change to either page is emailed to you at least 30 days before it applies."
  v095_reasons: "<b>Reasons for every decision about what you added.</b> When a curator turns down, hides or removes something you added, you get a message and an email that says what was decided, why, which rule applies and how to contest it. An account can now be suspended for a set time instead of removed, and the holder is told why."
  v095_export: "<b>The Commons catalogue as a weekly download.</b> The places and routes that riders, curators and our open-data sources added are on the developer page as one GeoJSON download, rebuilt every week, under the Open Database License. A guide on the developer wiki shows how to get the OpenStreetMap data the map also uses, with the same filters."
  v095_security: "<b>Several security and privacy improvements.</b>"
  v095_fixes: "<b>Among smaller fixes:</b> every section of the terms has its own number, saving a photo description works again, the red highlight sits on the place you picked, and the shelter icons are in the map key."
  v095_traffic: "<b>Show how busy a road really is.</b> Ride with a rear radar, and Scout's ride review can send a traffic summary: per road, how far you rode, how many cars passed you and how fast those cars were going, and whether you were on a cycle path, a cycle lane or the road. Your ride file and GPS track stay on your device. You choose for every ride."
  v095_rides: "<b>Review several rides at once.</b> Pick or drop several .fit files, or one zip with .fit files, such as a Scout export. The map shows the roads you rode, and one summary adds them all up."
  v095_time_zone: "<b>Times in your own time zone.</b> Choose a time zone in your settings, or keep Automatic to use your browser's. Every date and time on the site follows it."
  v095_base: "<b>Your base location is more private.</b> We store a random point up to 2.5 km from the spot you pick, so it shows no more than roughly which town."
  v095_traffic_desk: "<b>See how busy roads are.</b> Measured traffic sits under More on the desk. It shows quiet, moderate or busy for each road once enough rides on several days have come in. From the first ride, it shows how many roads have data, per country and region."
  v095_kinds: "<b>Places say what they are.</b> A scenic view is a viewpoint, a waterfall, a cliff or a cave; a history spot is a castle, a ruin or a memorial; a shelter is a picnic shelter, a lean-to or a hut. Each kind has its own icon on the map and in the map key. The kinds are the ones OpenStreetMap uses, so what we add can go back to it."
  v095_map: "<b>A calmer map.</b> Zoomed out, a soft haze shows where OpenStreetMap has places, and the icons appear as you zoom in, water first. Our own pins grow as you zoom in, place icons sit on top of routes, and the summit and gradient labels of climbs appear from closer in."
  v095_search: "<b>Better search.</b> A place shows once, with its region. A long name gets two lines, and the list comes back when you click the search box again."
  v095_scout_tags: "<b>Scout tags keep what you picked.</b> When you tag potholes or a waterfall during a ride, the ride review shows that answer. For a scenic view or a history spot, it asks what kind of place it is, such as a viewpoint or a castle."
  v095_hints: "<b>Close a note once you have read it.</b> The note about your pins waiting for review has a close button, and it stays closed on every device."
  v095_curator_kinds: "<b>The kind comes right after the name.</b> On every form the Type is the second field, sorted alphabetically in your language. A Scout tag arrives with its kind filled in when the rider picked one."
  v095_grant: "<b>Curator rights come with their areas.</b> When an admin makes someone a curator, they pick the areas first, or tick All areas, in the same step."
  v094_ballot: "<b>Vote for your region's best, one season ahead.</b> Pick up to 5 climbs, routes, views, heritage places or places to sleep in each list, in your own order. Your number one gets the most points. Once you submit, your ballot counts."
  v094_best: "<b>See what riders liked most each season, north and south of the equator.</b> The best-of page shows each season's winners, region by region, starting with your own. Each region follows its own seasons. Is a favourite missing? Add it to the map now, so you can vote for it."
  v094_fair: "<b>Every place gets a fair chance.</b> The ballot lists places A to Z, and nobody sees the standings while voting is open. Last year's top 5 get a small disadvantage, so other or new places can win too."
  v094_climbs: "<b>See where a climb hurts most.</b> The climb profile marks the steepest 250 m and the steepest point, and a gentle climb no longer looks like a wall. When you add a climb, the map finds the steepest point for you; drag it if it is wrong. The form starts from the climb's known height gain and average gradient."
  v094_map: "<b>Find places faster on the map.</b> Pins on one spot fan out, so you can tap each one. A search everywhere also finds climbs and routes. A link to a place from OpenStreetMap opens it on the map. On a phone, the climb profile opens above the bottom panel."
  v094_security: "<b>Several security improvements</b> to sign-in, two-factor and our emails."
  v094_fixes: "<b>Among smaller fixes:</b> filters look and work the same on every page, and French and Dutch texts have their apostrophes back."
  v094_name: "<b>Know how others see you.</b> Your settings show the name other riders see: your anonymous name while your profile is private, your display name when it is public."
  v094_confirmations: "<b>Find your confirmations and votes quickly.</b> The places you confirmed have their own tab, page by page, and your votes show what you picked."
  v094_bugs: "<b>Sort bug reports faster.</b> Bug reports now have the categories API, messages and desks. A report without a reporter address needs no reply when you close it."
  v094_providers: "<b>Fill in what a whole data source has in common.</b> On the Providers desk you set defaults per category, for example: every RIVM tap is a free drinking tap. A refresh fills a default only where a place has no value, and never over a rider's edit. \"Still as mapped?\" never gets a default: only a rider who looked can answer it."
  v094_desk: "<b>Nothing waits unseen.</b> Unread counts on the desk tabs are orange, like every other count. The support address gets an email for each curator application and each new country request."
  v093_climbs: "<b>Climbs count when you ride to the top.</b> A route rides a climb only when it goes up most of it and ends near the summit. The ride check lists the climbs on your ride."
  v093_texts: "<b>Write the text for your town or region.</b> Anyone signed in can suggest a town or region text, and says whether it is adapted from Wikipedia or written in their own words. The region's curator approves it. The credit line names the writer, and links Wikipedia only when the text is based on it."
  v093_contributions: "<b>All your contributions in one list.</b> Places and routes are together, newest first. You can open a route you proposed on the map and edit it, photos included, until a curator decides."
  v093_signin: "<b>Signing in is clearer.</b> Stay signed in says it lasts 7 days on this browser, and not to use it on a shared device. Your first sign-in after you confirm your email opens your settings."
  v093_updates: "<b>Choose how often we write.</b> Keep me up to date, in your settings, now asks how often: big news at most 4 times a year, or every update at most 2 times a month."
  v093_privacy: "<b>More privacy.</b> Every rider has a random anonymous name, and a rider with Public profile off is found only by that name. Your settings show it. The map no longer shows how far a photographer stood from the pin. The messages about your contributions are kept while your account exists and deleted with it, and an account nobody has used for 24 months is deleted. Contact messages go 24 months after the matter ends, and a report's reply address 90 days after the decision."
  v093_messages: "<b>Unread stays unread until you open it.</b> A message, a room post or new work on a desk keeps its mark until you open it, not when a list merely shows it. A place or route name in a message is quoted and in italics."
  v093_access: "<b>Easier on phones and keyboards.</b> The phone menu reaches every main page. The region and Get involved pickers work with the keyboard alone, and every form field shows where you are. The coverage heatmap is a lighter lavender."
  v093_fixes: "<b>Among many smaller fixes:</b> emails have a proper plain-text version, long lists along a route fold after two rows, a place known from two sources keeps the record from the source we trust most, View it on the map in your messages opens the place itself, language lists show only the languages the site is in, and the surface key no longer flashes when the map opens."
  v093_curators: "<b>For curators.</b> The rulebook is on the site, in tabs, and every rule matches how the site works. The queue and History filter by category. You correct a text suggestion and approve it on the same form, where you also decide whether the Wikipedia credit stays. Text suggestions carry a town or region icon. Trash keeps an item for 30 days, and you can restore it from the Trash page."
  v092_area: "<b>The map loads your area, not the world.</b> It downloads only the regions you are looking at, so it starts faster and uses far less data. Other regions load when you go there."
  v092_search: "<b>Search everywhere, routes included.</b> With Everywhere on, the search finds our places in every country, and the Routes box adds routes to the results. Pick one and it opens on the map."
  v092_fresh: "<b>Pins show how recently someone checked.</b> A place nobody has confirmed for 6 months has an orange border, for 12 months a red one."
  v092_key: "<b>The map key is complete.</b> The Map key panel explains every mark on the map with an example of each, and the badges on the pins are bigger and easier to read."
  v092_similar: "<b>Similar places before you add one.</b> When you add a place, the form lists places of the same kind nearby. Mark the ones that are the same place, and yours replaces them once it is approved."
  v092_bugs: "<b>The bug panel keeps your draft.</b> It says when it kept an unsent report for you, and one button clears everything."
  v092_speed: "<b>Faster pages when you are not signed in.</b> Best of and the other public pages load faster, also after you open a page that asks you to sign in. Once you sign in, pages are made for you and load at the usual speed."
  v092_confirm: "<b>Confirm your email before you sign in.</b> A new account can sign in once its email address is confirmed. The link in the email works for 24 hours. An expired link takes you to a page where you can ask for a new one."
  v092_strava: "<b>Ride with us on Strava.</b> The footer links the Cycling Commons club on Strava."
  v090_towns: "<b>Towns on the map.</b> A town now opens a card of its own, marked with the site's own pin."
  v090_fresh: "<b>The map's data refreshes itself.</b> Every night the site re-reads OpenStreetMap for the regions it covers, so what you see is days old at most, not months."
  v090_surface: "<b>Road surface and routes, rebuilt weekly.</b> The surface and route layers are regenerated on a schedule instead of by hand."
  v090_photos: "<b>Every photo is scanned before it appears.</b> An upload is checked in the background, and published only once it has passed."
  v090_accounts: "<b>Accounts that were never confirmed are removed.</b> If a sign-up is never completed, the record does not linger."
  v080_map: '<b>The map.</b> Places, climbs and routes across nineteen countries, with a surface layer, satellite and street-level imagery, and a light and a dark theme.'
  v080_photos: '<b>Photos.</b> Contribute a photo to any place, licensed CC BY-SA 4.0. Location data is stripped before publication, and every photo has a page of its own.'
  v080_routes: '<b>Routes.</b> Propose a route from a GPX file, vote on the ones you have ridden, and see the best of a region.'
  v080_contribute: '<b>Contributing.</b> Add and correct places from the map itself, confirm that something is still there, and follow what a curator decided and why.'
  v080_accounts: '<b>Accounts.</b> Optional public profile, two-factor sign-in, a full data export, and account deletion that takes effect immediately.'
  v080_languages: '<b>Five languages.</b> English, French, Dutch, German and Spanish, with a way for riders to propose a better translation.'
  v080_legal: '<b>The paperwork done properly.</b> A privacy notice that names every processor, an accessibility statement that lists what does not work yet, and a contact route that reaches a person.'
