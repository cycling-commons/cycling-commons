legend:
  kicker: 'Map key'
  title: 'Every mark on the map'
  lead: 'A pin stacks a few independent signals on one shape: where the record comes from, what kind of place it is, and what is happening to it.'
  axes_h: 'How to read a pin'
  axis_shape_h: 'Shape'
  axis_shape_t: 'A small disc or a teardrop. The disc is the baseline: a record a gross provider keeps, OpenStreetMap among them. The teardrop is a record a specialty provider or this community keeps.'
  axis_fill_h: 'Fill colour'
  axis_fill_t: 'Which category. Water, toilets, climbs, services. The fill never says anything else; what a place is within its category lives in the glyph.'
  axis_border_h: 'Border'
  axis_border_t: 'Who keeps the record. A small disc: a gross provider. Dashed ink: a specialist source for this kind of place and this region. Solid paper: this community. An orange ring means nobody has confirmed it in %months% months; a thick red border, in %months_red% months.'
  axis_badge_h: 'Badge'
  axis_badge_t: 'Top right: a "?" means nobody has stood here on record; no "?" means a dated witness is on record. Top left: a red "!" means not usable right now, a clock means there, but not always.'
  tag_live: 'On the map'
  tiers_h: 'Where a record comes from'
  tiers_note: 'Who keeps the record you are reading. When two records describe one place, the map keeps the one nearest the bottom of this list. None of this says how good the place is; only the badge says whether anybody has stood there.'
  tier_baseline_h: 'Imported baseline'
  tier_baseline_t: 'A small disc. Somebody put this on a public map and nobody here has taken the record on. The panel names the source.'
  tier_external_h: 'Kept by somebody else'
  tier_external_t: 'A dashed border. A specialist source for this kind of place and this region keeps this record. The panel names them and links to them.'
  tier_ours_h: 'Our catalogue'
  tier_ours_t: 'A solid paper border. This community keeps the record: a rider added it, or riders confirmed it and took it on.'
  tier_unconfirmed_h: 'Nobody has stood here'
  tier_unconfirmed_t: 'A "?" badge, on any of the three icons above. No dated survey and no rider confirmation. If you ride past, check it.'
  basemap_h: 'From the basemap'
  basemap_note: 'Marks the basemap draws for a rider to read in passing. They are not places in the catalogue: no pin, no panel, nothing to confirm.'
  basemap_bollard_h: 'Bollard'
  basemap_bollard_t: 'A post in the road. Cars stop here, bikes pass.'
  basemap_gate_h: 'Gate'
  basemap_gate_t: 'A gate across the way. It may be closed; expect to stop.'
  basemap_bicycle_parking_h: 'Bicycle parking'
  basemap_bicycle_parking_t: 'A place to lock a bike.'
  basemap_cycle_barrier_h: 'Cycle barrier'
  basemap_cycle_barrier_t: 'A chicane. Passable, but not at speed.'
  kinds_h: 'What a place is, within its category'
  kinds_note: 'The glyph tells kinds apart inside one category, and kinds are never compared across categories: a tap you cannot drink from is a different kind of thing, not a broken one. Only the categories with more than one kind are listed.'
