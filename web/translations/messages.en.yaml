developers:
  kicker: 'Build on the Commons'
  title: 'Open data. An open API.<br>For anyone to build on.'
  lead: 'Query the Commons by area and type, or self-host from the periodic bulk export. The data is open (ODbL), which is what makes it a commons. No key, no account, no charge: a rate limit and fair use are the whole of it.'
  status: 'In design — these endpoints are the contract we''re building. Browse the <a href="/developers/api">interactive API reference</a> or the <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">spec on GitHub</a>.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/search'
  ep1_desc: 'find coverage by <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'one item, with our enrichment and provenance <b>(planned)</b>'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'region polygon and coverage stats <b>(planned)</b>'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'the best-of for a region <b>(planned)</b>'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'route detail and GPX download <b>(planned)</b>'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'vector tiles and TileJSON, to bind into your own MapLibre style <b>(planned)</b>'
  ep7_path: '/v1/contributions'
  ep7_desc: 'contribute <b>(planned)</b>, lands in the same review queue as in-app contributions'
  ex_kicker: 'Example request'
  resp_kicker: 'Response'
  ex_hydrate: 'Responses are reference-only by default: our added fields plus the <code>osm_ref</code> to hydrate against OSM. <code>?hydrate=osm</code> merges our cached OSM subset in for you.'
  attr_kicker: 'Required attribution'
  rules_kicker: 'The rules'
  rules_body: '<b>Fair use.</b> Reads are open to anybody, with no key and no account, at <b>120 requests a minute</b> per address. That is a sliding window, so a burst borrows from the next minute rather than locking you out. For bulk or offline use, take the <b>periodic export</b> and self-host it instead of hammering the live API; scraping the service is not allowed. Licences: data <b>ODbL 1.0</b>, media <b>CC BY-SA 4.0</b>. Attribute, share alike, keep open. Commercial use is fine. See the plain-language summary:'
