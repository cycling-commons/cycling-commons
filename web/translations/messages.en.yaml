join:
  kicker: 'Get involved'
  title: 'Build the Commons with us.'
  lead1: 'The Cycling Commons is built by the people who use it — in code, in local knowledge, and in everything around them. It''s early, it''s open, and there''s room for you.'
  lead2: 'A commons doesn''t grow by hiring; it grows by people showing up. Here''s where we need hands.'
  heart_kicker: 'The heart of it'
  heart_h2: 'Riders &amp; local knowledge.'
  heart_lead: 'The Commons is only as good as what riders know: the climb worth the detour, where the water is, the junction that bites, the loop that''s quietly perfect. That knowledge is the whole point — and it''s the one thing no one can build for you.'
  hnote_b: 'Honest note — what is live, and what is not.'
  hnote_body: 'Contributions are real: what you add goes to a curator, and once it passes it is on the map for every rider. What is <i>not</i> live yet is the seasonal best-of vote and the public API. Here is where to start:'
  howto1_b: 'Map objective facts in OpenStreetMap.'
  howto1_body_pre: 'Water points, repair stations, surfaces — add them to'
  howto1_body_post: ' now. We build on OSM and contribute back, so it flows into the Commons. Nothing here needed.'
  howto2_b: 'Add what you know, here.'
  howto2_body_pre: 'Open'
  howto2_themap: 'the map'
  howto2_mid1: ' and improve a place, or go straight to'
  howto2_addclimb: 'adding a climb'
  howto2_mid2: '. A curator reads every submission. Where the flow does not match how you would actually enter your data,'
  howto2_email: 'email us'
  howto2_mid3: ' — or'
  howto2_issue: 'open an issue'
  howto2_post: '— that is what shapes the next round.'
  howto3_b: 'Add a place you know.'
  howto3_link: 'Pick a category and put it on the map'
  howto3_post: ' — a water point, a hazard, a viewpoint, somewhere bike-friendly to sleep. A curator reads it before anyone else sees it.'
  howto4_b: 'Look after your own patch.'
  howto4_link: 'See which regions need a curator'
  howto4_post: ' — or ask for a country the Commons has not reached yet. Both start on the same page.'
  skills_kicker: 'Lend your skills'
  skills_h2: 'Help build and sustain it.'
  role1_rk: '01 · BUILD'
  role1_h: 'Developers'
  role1_p: 'The real platform: the backend &amp; API (Symfony 7 LTS), the MapLibre frontend, and the geospatial pipeline (PostGIS, routing, elevation, OSM import).'
  role1_link: 'Start on GitHub →'
  role2_rk: '02 · GROW'
  role2_h: 'Social media &amp; community'
  role2_p: 'Tell the story, grow the rider base, welcome newcomers, and keep the community healthy as it scales.'
  role2_link: 'Get in touch →'
  role3_rk: '03 · SUSTAIN'
  role3_h: 'Fundraisers &amp; grant writers'
  role3_p: 'Open-data and sustainable-mobility grants, EU cycling funding — the runway that keeps the Commons free and independent.'
  role3_link: 'Get in touch →'
  role4_rk: '04 · PROTECT'
  role4_h: 'Legal &amp; governance'
  role4_p: 'The independent foundation setup, ODbL / CC licensing, contributor terms, and GDPR — the structure that keeps it open for good.'
  role4_link: 'Get in touch →'
  also_welcome: '<b>Also welcome:</b> translators, designers, OpenStreetMap mappers, photographers, and partnership-builders (cycling clubs, tourism boards, bike-friendly stays). Don''t see your role?'
  also_tell: 'Tell us what you''d bring.'
  start_kicker: 'Start now'
  start_h2: 'A commons grows when people show up.'
  start_lead: 'Code, local knowledge, or a few hours of expertise — all of it moves the map forward. The door''s open.'
