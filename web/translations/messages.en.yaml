  contribute_description: 'Choose what to contribute to the Cycling Commons — climbs, water, surface, hazards, stays, views and more. One open atlas, built by riders.'
  vote_title: 'Cycling Commons — Vote'
  vote_description: 'Rank this region''s best riding. The community decides the seasonal best-of, kept fresh by the riders who ride it.'
  improve_title: 'Cycling Commons — Improve / add a place'
  improve_description: 'Improve a place in the Commons — fix details, flag conditions, and keep the open cycling atlas accurate for every rider.'
  propose_route_title: 'Cycling Commons — Propose a route'
  propose_route_description: 'Share a recommended ride: upload your GPX, a curator reviews it, the community verifies and votes.'
  contact_title: 'Cycling Commons — Contact'
  contact_description: 'Write to the Cycling Commons without a mail app and without an account. A form, a published address, and who legally runs the site.'
  bug_report_title: 'Cycling Commons — Report a bug'
  report_guide_title: 'Cycling Commons — Report a page or a photo'
  report_guide_description: 'Where the Report link is for a place, route, region, rider, message or photo, and a box that opens the right form from a Commons link.'
  bug_report_description: 'Something on the Cycling Commons is broken? Tell us, with or without an account.'
  known_issues_title: 'Cycling Commons — Known issues'
  known_issues_description: 'What we already know is broken on the Cycling Commons, confirmed by a curator, so you do not have to report it twice.'
  accessibility_title: 'Cycling Commons — Accessibility'
  accessibility_description: 'How usable the Cycling Commons is, including the parts that are not good enough yet, and how to report a barrier.'
  map_key_title: 'Cycling Commons — Map key'
  map_key_description: 'Every mark on the Cycling Commons map and what it means: pins, discs, borders, badges, lines and clusters.'
  roles_title: 'Cycling Commons: contributors and curators'
  roles_description: 'What a contributor does and what a curator does on the Cycling Commons map, and how an edit becomes confirmed.'
legend:
  kicker: 'Map key'
  title: 'Every mark on the map'
  lead: 'A pin stacks a few independent signals on one shape: where the record comes from, what kind of place it is, and what is happening to it. This page is the complete key.'
  axis_shape_h: 'Shape'
  axis_shape_t: 'A small disc or a teardrop. The disc is the baseline: a record a gross provider keeps, OpenStreetMap among them. The teardrop is a record a specialty provider or this community keeps.'
  axis_fill_h: 'Fill colour'
  axis_fill_t: 'Which category. Water, toilets, climbs, services. The fill never says anything else; what a place is within its category lives in the glyph.'
  axis_border_h: 'Border'
  axis_border_t: 'Who keeps the record. A small disc: a gross provider. Dashed ink: a specialist source for this kind of place and this region. Solid paper: this community. A thick red border means the record waits for a moderator; an orange ring means nobody has confirmed it in a long time.'
  axis_badge_h: 'Badge'
  axis_badge_t: 'A fact that must survive colour blindness. Top right: a "?" means nobody has stood here on record; no "?" means a dated witness is on record. Top left: a red "!" means not usable right now, a clock means there, but not always.'
  tag_live: 'On the map'
  tiers_h: 'Where a record comes from'
  tiers_note: 'Who keeps the record you are reading. When two records describe one place, the map keeps the one nearest the bottom of this list. None of this says how good the place is; only the badge says whether anybody has stood there.'
  tier_baseline_h: 'Imported baseline'
  tier_baseline_t: 'A small disc. Somebody put this on a public map and nobody here has taken the record on. The panel names the source.'
  tier_external_h: 'Kept by somebody else'
  tier_external_t: 'A dashed border. A specialist source for this kind of place and this region keeps this record. The panel names them and links to them.'
  tier_ours_h: 'Our catalogue'
  tier_ours_t: 'A solid paper border. This community keeps the record: a rider added it, or riders confirmed it and took it on.'
  tier_unconfirmed_h: 'Nobody has stood here'
  tier_unconfirmed_t: 'A "?" badge, on any of the three icons above. No dated survey and no rider confirmation. If you ride past, check it.'
  basemap_h: 'From the basemap'
  basemap_note: 'Marks the basemap draws for a rider to read in passing. They are not places in the catalogue: no pin, no panel, nothing to confirm.'
  basemap_bollard_h: 'Bollard'
  basemap_bollard_t: 'A post in the road. Cars stop here, bikes pass.'
  basemap_gate_h: 'Gate'
  basemap_gate_t: 'A gate across the way. It may be closed; expect to stop.'
  basemap_bicycle_parking_h: 'Bicycle parking'
  basemap_bicycle_parking_t: 'A place to lock a bike.'
  basemap_cycle_barrier_h: 'Cycle barrier'
  basemap_cycle_barrier_t: 'A chicane. Passable, but not at speed.'
  kinds_h: 'What a place is, within its category'
  kinds_note: 'The glyph tells kinds apart inside one category, and kinds are never compared across categories: a tap you cannot drink from is a different kind of thing, not a broken one. Only the categories with more than one kind are listed.'
  kind_b_tap_h: 'Drinking tap'
  kind_b_tap_t: 'A blue drop. OSM maps it as drinking water and nothing says otherwise. Confirm on the spot.'
  kind_b_no_h: 'Not for drinking'
  kind_b_no_t: 'A drop with a bar across it. Tagged not drinkable, or a rider said so.'
  kind_b_unk_h: 'Potability not known'
  kind_b_unk_t: 'An unfilled drop. Either nobody has said whether you can drink here, or somebody looked and could not tell. Treat it as unknown.'
  kind_b_food_h: 'Food stop'
  kind_b_food_t: 'A fork and knife on the category disc. A bakery, a shop, a café.'
  kind_b_food_water_h: 'Food stop with water'
  kind_b_food_water_t: 'The same, with a small blue drop: the place also gives drinking water.'
  kind_d_shop_h: 'Bike shop'
  kind_d_shop_t: 'A cog.'
  kind_d_station_h: 'Repair stand'
  kind_d_station_t: 'A hammer and pick: a self-service stand with tools.'
  kind_d_pump_h: 'Pump'
  kind_d_pump_t: 'A circled plus: compressed air or a public pump.'
  state_h: 'What is happening to a record'
  state_note: 'These ride on top of any pin. They describe our handling of the record, not the place itself.'
  state_stale_h: 'Going stale'
  state_stale_t: 'An orange ring replaces the paper border. Nobody has confirmed this in a long time, so the map is asking "still there?"'
  state_pending_h: 'Waiting for a moderator'
  state_pending_t: 'A thick red border. Somebody proposed this and no curator has decided yet. Shown to the proposer and to curators.'
  state_cluster_h: 'Too many to draw'
  state_cluster_t: 'A count bubble in the category colour. Zoom in and it breaks apart.'
  state_look_h: 'Look here'
  state_look_t: 'A pulsing orange ring shows where a hovered list result or town sits. The same pulse wraps a pin revealed by search when your view mode hides it.'
  state_camera_h: 'Street photo camera'
  state_camera_t: 'A green pin marks where the opened street-level photo was taken. It moves as you walk the imagery.'
  fact_h: 'What is happening to the place itself'
  fact_note: 'A tap that is broken today is the one fact a thirsty rider needs. These marks carry that kind of fact.'
  fact_broken_h: 'Out of order'
  fact_broken_t: 'A red "!" badge at the top left, independent of the pin colour and tier. A rider reported it out of order or closed.'
  fact_hours_h: 'Not always reachable'
  fact_hours_t: 'A clock badge at the top left for places that are not always available: daytime only, behind a gate, or a seasonal tap in the months it is shut. A badge, not a colour, so the pin keeps its category.'
  cats_h: 'The categories'
  cats_note: 'Fill colour only ever answers "what kind of place". One icon set feeds the pins, the layer list and this page, so you can match any tile to any pin.'
  cats_practical: 'Practical, aiming for full coverage'
  cats_voted: 'Voted onto the map by riders'
  cats_overlays: 'Map overlays'
  overlay_surface_h: 'Surfaces'
  overlay_routes_h: 'Route network'
  overlay_switch: 'Overlay switch'
  overlay_note: 'Overlays are switches in the layer panel, not data layers: they skin the roads themselves. Road surface lives here, and its legend doubles as a filter: tick gravel alone and the map shows gravel alone.'
  lines_h: 'Lines'
  lines_note: 'Everything the map draws as a stroke. The small key on the map itself shows the surface and route-network parts of this list.'
  lines_surfaces: 'Road surfaces'
  line_unverified_t: 'Red dashes: the road has no surface tag yet. The dash is the meaning, "needs a tag".'
  line_ticks_h: 'Quality ticks'
  line_ticks_t: 'Small stitches over a line, from green (excellent) through amber to red (very bad), visible when zoomed in.'
  lines_climbs: 'Climbs'
  line_climb_up_h: 'Climb line, uphill'
  line_climb_up_t: 'Purple bands by steepness, matching the climb profile bars: light below 5%, darkest at 16% and up.'
  line_climb_down_h: 'Climb line, downhill'
  line_climb_down_t: 'The same bands in blue for descending stretches.'
  line_summit_h: 'Summit flag'
  line_summit_t: 'Where the climb ends. The pin sits at the foot.'
  line_steep_h: 'Steepest pitch, measured'
  line_steep_t: 'The steepest sustained 100 m the model can see.'
  line_rider_h: 'Steepest point, rider-marked'
  line_rider_t: 'Where a rider says the wall actually is. A different colour and glyph from the measured one on purpose.'
  lines_routes: 'Routes'
  line_route_rest_h: 'Recommended route'
  line_route_rest_t: 'Pale orange over a paper casing.'
  line_route_sel_h: 'Recommended route, selected'
  line_route_sel_t: 'Full orange and wider; the other routes dim while one is open.'
  line_knoop_h: 'Numbered node'
  line_knoop_t: 'A knooppunt: white disc, purple ring and number, exactly as the network tiles draw it.'
  back_to_map: 'Back to the map'
