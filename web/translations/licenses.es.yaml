  code_h: 'El código'
  code_sub: 'GNU Affero General Public License v3 (AGPL-3.0-only) · software libre'
  code_tldr: 'Léelo, ejecútalo, modifícalo, haz un fork, con la finalidad que sea, también comercial. No hay ningún ámbito de uso vedado ni nadie a quien pedir permiso. Lo que la licencia pide a cambio es el código fuente: si distribuyes una versión modificada, o dejas que otras personas usen una por red, esas personas reciben también tu código fuente.'
