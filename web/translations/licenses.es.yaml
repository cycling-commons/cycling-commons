  lead: 'En lenguaje claro, para que sepas qué puedes hacer. Cuatro licencias, una para los <b>datos</b>, otra para los <b>medios</b>, otra para las <b>traducciones de la interfaz</b> y otra para el <b>código</b>. Las cuatro son abiertas. El nombre y el logotipo no lo son, y es a propósito.'
