  ui_h: 'Las traducciones de la interfaz'
  ui_sub: 'GNU Affero General Public License v3 (AGPL-3.0-only)'
  ui_tldr: 'Una cadena traducida de la interfaz es una reescritura de la inglesa, así que lleva la licencia del código al que pertenece. Úsala, cámbiala, distribúyela con fines comerciales. Si distribuyes una versión modificada, tu código fuente va con ella. Esto cubre tanto los archivos de locale que están en git como las traducciones enviadas desde este sitio: entre unos y otras ya no hay separación alguna.'
  ui_can1: 'Usarlas, copiarlas y compartirlas libremente'
  ui_can2: 'Adaptarlas y remezclarlas'
  ui_can3: 'Usarlas con fines comerciales'
  ui_must1_b: 'Compartir el código fuente'
