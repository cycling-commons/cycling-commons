# SPDX-License-Identifier: AGPL-3.0-only
# The privacy notice in English: the whole page in one file, outside the `messages`
# domain the in-site translation system reads (docs/specs/privacy-notice.md). This
# file's history is the record of every change to the page in English.
privacy:
  kicker: 'Privacy'
  title: 'What we collect, and why.'
  lead: 'Plain language. The Cycling Commons dataset is non-personal: open geodata about places, never about people. The <b>platform account</b> is a different matter: it holds personal data (email, credentials, session logs). Here''s what we hold, why, and the control you have over it.'
  h_responsible: 'Who is responsible'
  responsible_p1_pre: 'The data controller is'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', based in the Netherlands, which stewards the Cycling Commons today. As set out in our'
  responsible_p1_governance: 'governance'
  responsible_p1_post: ', the Commons is committed to spinning out to an independent Dutch foundation; the controller will transfer accordingly, and this page will be updated.'
  responsible_p2_pre: 'Questions about your data:'
  responsible_p2_mid: '. You also have the right to lodge a complaint with the Dutch supervisory authority, the'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'We have <b>not appointed a Data Protection Officer (DPO)</b>, and the law does not require one of us: we are a small operation, we do not monitor people on a large scale, and special-category data is not part of what we do (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_37">GDPR Art. 37</a>). Data protection questions and requests go to the same address as everything else,'
  dpo_post: '. If that ever changes and we do appoint one, this page will name them.'
  h_collect: 'What we collect'
  collect_intro: 'We ask for the minimum needed to run an open, accountable map. We never ask for your real name.'
  h3_account: 'When you create an account'
  collect_account_email: 'Your <b>email address</b>, to sign you in, secure the account, and send essential service messages.'
  collect_account_password: 'A <b>password</b>. We never store the password itself, only a scrambled form of it that cannot be turned back into the password. When you sign in, we scramble what you type in the same way and compare the two.'
  collect_account_displayname: 'A <b>display name</b> you choose. It can be a pseudonym, and we never ask for your real name. Your profile is <b>off by default</b>: while it is off, what you contribute shows your <b>pseudonym</b>, for example rider#k3x9q2mf, instead of your display name. It is the same on everything you add, so others can see that one person made it, but not who you are; together, those contributions can show roughly where you ride. Turn your profile on and your display name, your country, the month you joined, the bike types and riding styles you picked, your contribution counts and the routes you proposed become public.'
  collect_account_2fa: 'If you enable <b>two-factor authentication (2FA)</b>, we store the TOTP secret <b>encrypted at rest</b>, and your backup codes only as hashes.'
  collect_account_base: 'An optional <b>base location</b> and riding radius, if you set one. We do not store the point you pick: we store a random point up to about 2.5 km from it, so the stored point says no more than roughly which town. We also keep the place name you chose with it, and the regions and countries your radius reaches. It tailors only what you yourself see: your map view, and defaults such as the region the best-of page and the ballot open on. It is never shown to other riders and never part of the Commons dataset.'
  collect_account_timezone: 'Your <b>time zone</b>, so the times we show read in your own: the one you choose in your settings, or, while that is set to automatic, the zone your browser reports (for example Europe/Amsterdam). It is a zone name, not a location.'
  collect_account_prefs: '<b>Your settings.</b> Your language, units and date format, your map theme and map mode, the bike types and riding styles you pick, which decide what the map shows you first, and the tips you closed. We also keep the date you confirmed you are 16 or older, and the date you last signed in, which the 24-month rule under <b>How long we keep it</b> counts from.'
  h3_contribute: 'When you contribute'
  collect_contribute_items: '<b>Everything you write into the Commons.</b> A place, a climb, a route, a correction, a vote, an on-the-spot check, a region description, a translation, a report, a message to a curator: if you typed it and sent it, we have it. Each one is linked to the account that sent it, so that a curator can write back to you. Messages to curators and reports stay between you and the curators: they never appear on the map or in the dataset.'
  collect_contribute_media: 'Any <b>photos</b> you upload. A photo can carry hidden data (EXIF), such as where it was taken: we strip that out and re-encode the file, so what we publish carries none of it. We then write one thing back in: a stamp saying the picture is licensed CC BY-SA 4.0, and a link to its page on Cycling Commons. <b>Your name is never written into the file.</b> The link is how somebody reusing the photo finds who to credit, and that page names you only while your profile is public.'
  collect_contribute_traffic: '<b>Traffic summaries</b>, only if you send one from Scout''s ride review with a rear radar. For each road piece you rode, a summary holds: the road piece and your direction on it, how far and how long you rode there, how many cars passed you and how fast they went, your own average speed, the part of the day (night, morning rush, day, evening rush or evening), a group of at least four dates of the same kind instead of the date, the quarter of the year, and whether it was a workday or a weekend. On a cycle path it holds how many cars the radar saw nearby instead of cars passing you. Each line also carries check values made from the ride, so that the same ride is never counted twice. Your ride file never leaves your device, and a summary holds no GPS track; which roads you rode, with the part of the day, does. Nothing within 500 m of where a ride starts or ends is ever sent in a summary. To match the ride, your browser loads map data for the ride''s area from our server, as the map does for any area you look at. Nothing we store names you or codes you. Each line waits, encrypted, until its road has enough rides from several days, and then joins plain totals per road, so a ride reaches the totals in pieces, mixed with other rides. Curators see only quiet, moderate or busy per road. Results go to curators only, and never with your name. From the same ride review you can also send the <b>tags</b> you set during the ride. A tag sends its spot on the map, which you can move first, the name and details you give it, any photos you add, and the time you set it, of which we keep only the date. A tag for a stretch of road, such as its surface, also sends the part of your ride between the two ends you pick. Each tag becomes an ordinary contribution and goes through the same review as any other. Both are optional: per ride, you choose what to send, and you can send nothing. Scout will get more features; when one changes what is sent, this notice changes first.'
  collect_contribute_rode: '<b>"I rode this" marks.</b> When you mark a route as ridden, we keep the mark with the bike type you chose and the date. On the route, only the number of riders who marked it shows.'
  collect_contribute_bugs: '<b>Bug reports.</b> When you report a bug, we keep what you wrote, the screenshots you add, the address of the page you were on, your browser and its version, the size of your window, and your email address if you want an answer. If you are signed in, the report is linked to your account. A curator may publish a bug on our known-issues page and as an issue on GitHub, with a title and text the curator writes; your email address, the page address and your screenshots never go there.'
  collect_contribute_curator: '<b>Curator applications and country requests.</b> If you apply to curate, we keep the country and area you ask for, what you write about yourself, a link if you add one, and your OpenStreetMap username if you give it. Our server looks that username up on OpenStreetMap to see whether it exists and how many edits it has. If you ask us to open a country, we keep the country, the region you name, whether you would curate there, and your note.'
  collect_contribute_profile: 'Optional profile details you choose, such as your country, your bike types and your riding styles. They show on your public profile only while it is on. Profiles are'
  collect_contribute_profile_link: 'opt-in'
  collect_contribute_profile_post: ' and off by default.'
  h3_auto: 'Automatically, when you use the site'
  collect_auto_technical: '<b>Technical data</b>: IP address, browser type, and timestamps in our server logs, kept to operate and secure the service.'
  collect_auto_ratelimit: '<b>Use counters and coded addresses.</b> To stop one visitor from using up a tool for everybody, or from flooding a form, we count requests. Signed in, we count against your account. Without an account, most counters, such as the one on the ride check, count against a code made from your IP address, which cannot be turned back into the address. A few count against the address itself: the report form, the public API, the map''s coverage data, and the check that protects some forms. The same kind of code is kept with a content report, a bug report or a contact message you send, so that we can spot a flood. That code is still personal data, so everything on this page applies to it.'
  collect_auto_errors: '<b>Error reports.</b> When something breaks on our server, it writes an error report: what went wrong, the address of the page and the moment. It never holds your IP address, your name, your email address or what you typed into a form. The reports stay on our own machines at Hetzner, with everything else we run (see <b>The companies that handle data for us</b>).'
  banner_bold: 'No ride tracking.'
  banner_body: 'The Commons is a map of places, not of people. We do <b>not</b> track where you ride and never see your live location. We hold a line you rode only when you send it on purpose: a route you propose, or the stretch of a ride a Scout tag covers. A traffic summary from Scout''s ride review is not a GPS trace, but it does say which roads you rode and in which part of the day, and an "I rode this" mark says you rode that route (see <b>When you contribute</b>). The ride check reads a ride file you give it on our server, to find places along it, and keeps nothing of it.'
  banner_locate: '<b>Locate me</b> on the map reads your position in your own browser, only when you tap it, and sends it nowhere: no request to us or anyone else carries it. The map then loads the map images for that area, as it does whenever you move the map.'
  h_why: 'Why we use it (legal bases)'
  why_contract: '<b>To provide your account and the service</b>: performance of a contract (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_6">GDPR Art. 6(1)(b)</a>).'
  why_consent: '<b>Showing your name.</b> A public profile, and being credited by name on what you contributed, rests on your consent (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_6">GDPR Art. 6(1)(a)</a>). Withdraw it any time in'
  why_consent_link: 'settings'
  why_consent_post: ' and your name comes off those pages. On our side that happens at once. A copy of a page that somebody else saved is beyond our reach.'
  why_licence: '<b>Publishing what you contribute.</b> A photo or an edit you give to the Commons is published under the licence you agreed to when you sent it, which is part of our agreement with you (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_6">GDPR Art. 6(1)(b)</a>). That licence is <b>irrevocable</b> by its own terms, so withdrawing consent takes your name off the page but does not un-publish the contribution itself. One exception matters: if a photo shows <b>you</b>, that is your personal data, and a copyright licence does not sign away data-protection rights. Every photo page carries a link to ask for it to come down. A photo you had no right to license was never validly licensed: tell us through the same link and it comes down too.'
  why_updates: '<b>Telling you what is new.</b> Only if you asked for it: the setting in your account is your consent (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_6">GDPR Art. 6(1)(a)</a>), and switching it off withdraws it. In your settings you choose how often: <b>big news only</b> or <b>every update</b>. Every message also carries a one-click unsubscribe that needs no sign-in. News about the Commons only, never advertising, and the list is never shared or sold.'
  why_legitimate: '<b>Security, abuse prevention, and aggregate analytics</b>: our legitimate interests in keeping the Commons honest and working (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_6">GDPR Art. 6(1)(f)</a>).'
  why_legal: '<b>Meeting legal obligations</b>: where the law requires it (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_6">GDPR Art. 6(1)(c)</a>). That includes the statement of reasons we owe you when we restrict something you added or your account (Digital Services Act Art. 17), and informing the police or a judicial authority of a threat to somebody''s life or safety (Digital Services Act Art. 18).'
  h_cookies: 'Cookies & analytics'
  cookies_body: 'We keep this light. We set <b>two cookies</b>, both of them strictly necessary, and both listed in full below. For usage statistics we run <b>self-hosted analytics</b> on our own infrastructure: it receives the page URL, referrer, screen size and browser type, and it receives your <b>IP address</b>, which is personal data, but does <b>not store it</b>. The address is used only to work out an approximate location (country, region and city) and to derive a one-way session identifier, and is then discarded. No analytics cookies are set, no visitor is given a persistent identifier or tied to an account, and there is no cross-site or cross-device tracking. Analytics data stays on our own infrastructure and is never shared with, or sold to, third parties.'
  h3_cookie_table: 'The cookies we set'
  ck_h_name: 'Name'
  ck_h_purpose: 'What it does'
  ck_h_life: 'How long it lasts'
  ck_session_purpose: 'Keeps you signed in, and carries the token that protects the forms you use while signed in against cross-site request forgery (CSRF), an attack in which another website makes your browser submit a form here as you. It is set when you sign in, or when you use a form that has to remember something between pages, such as resetting your password. Reading the map and the rest of the site, the contact page included, sets no cookie at all. It holds a random identifier and nothing else: no name, no email address, no record of what you looked at.'
  ck_session_life: 'Until you close your browser'
  ck_remember_purpose: 'Signs you back in on your next visit without asking for your password. Set <b>only</b> if you tick <b>Remember me</b> when you sign in, and removed when you sign out. We do not recommend it on a computer that other people use.'
  ck_remember_life: '7 days'
  cookies_none_body: 'That is the whole list. We set <b>no</b> advertising cookie, <b>no</b> analytics cookie and <b>no</b> cross-site tracking cookie, on any page. Both cookies above are strictly necessary to deliver something you asked for, so the law needs no consent for them, and that is why there is no cookie banner here. If we ever added something that did need one, we would ask you first rather than assume.'
  cookies_local_body: 'Your browser also keeps a few things for this site on your own device. In its <b>local storage</b>: your display and map preferences, such as the theme, the area you last looked at, your filters and the size of a panel, and a home area if you set one without an account. A bug report you have not sent yet is kept as a draft, with its screenshots, in the browser''s own database (IndexedDB). While you edit, some work in progress sits in <b>session storage</b>, which the browser clears when you close the tab. None of this is a cookie. It all stays in your browser: we never read it from there, and a draft reaches us only when you send it. Clearing your browser data removes it. Other websites cannot read it: a browser keeps each site''s storage apart. Two things can still read it. Anybody who uses the same browser on the same computer, and any script that runs on this site, such as a browser extension you installed. A home area says roughly where you live, so on a shared computer you may prefer not to set one.'
  h_share: 'Who we share it with'
  share_infra: '<b>The services that run our infrastructure, and the few we ask for a check.</b> Hosting, backups, email, the map services your browser fetches directly, and the checks our server makes. Each one is named below, with what it does and what it can see.'
  share_osm_pre: 'OpenStreetMap: contributions you choose to give back become part of the open map under the'
  share_osm_link: 'ODbL'
  share_osm_post: '. That is public, open data, not personal data about you.'
  share_authorities: '<b>The police or a judicial authority, when the law requires it.</b> If something posted on the Commons suggests a crime that threatens somebody''s life or safety, we must inform the competent law-enforcement or judicial authority of the country concerned, or of the Netherlands when that is not clear (Digital Services Act Art. 18). We give them what they need to act: what the curator saw, the reference, the dates, where it appeared, and the account details we hold for whoever posted it (account number, display name, email address and sign-up date). The material itself goes only if they ask for it. The legal basis is our legal obligation (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_6">GDPR Art. 6(1)(c)</a>).'
  share_noone: '<b>No one else.</b> We don''t sell personal data and we don''t run third-party ad tracking.'
  share_selfhosted: 'First, what is <b>not</b> in these lists. We run as much of this ourselves as we can: the map data, the route planning, the elevation model behind the climb gradients, the photo storage, the usage statistics and even the error reports all sit on our own machines. Two services we used to call out to, for routing and for elevation, were brought in-house for exactly this reason. It is slower to build that way and it costs more. It is also why your browser talks to a handful of outside services, each listed below, instead of twenty, and why the tables below are as short as they are: every name in them is one we could not reasonably run ourselves.'
  h3_processors: 'The companies that handle data for us'
  processors_intro: 'The companies below hold or handle your data on our instructions. They are our <b>processors</b>: they may only do what we tell them to, under a written contract, and they may not use your data for anything of their own.'
  pr_h_who: 'Who'
  pr_h_where: 'Where'
  pr_h_what: 'What they do for us'
  pr_h_sees: 'What they can see'
  pr_hetzner_where: 'European Economic Area'
  pr_hetzner_what: 'Runs the machines: the website, the database, the storage that holds uploaded photos, and the error reports.'
  pr_hetzner_sees: 'In principle everything we store, because it sits on their hardware: your email address, your contributions, your photos, the server logs and the error reports. Passwords and two-factor secrets are unreadable even there (see <b>How we protect it</b>).'
  pr_scaleway_where: 'European Economic Area'
  pr_scaleway_what: 'Delivers the mail the site sends you, and stores the nightly backups.'
  pr_scaleway_sees: 'Your email address and the contents of the messages the site sends you. The backups are encrypted on our own servers before they are sent, so their contents cannot be read at the other end.'
  pr_proton_where: 'Switzerland (covered by an EU adequacy decision)'
  pr_proton_what: 'Holds the project mailbox, the address printed on this page, and the replies a person here writes back.'
  pr_proton_sees: 'Your email address and whatever you chose to write to us, for as long as the conversation is kept.'
  h3_browser_services: 'Services your browser contacts directly'
  browser_services_intro: 'The map is assembled in your browser, so a few pieces are fetched straight from the people who publish them rather than passing through us. We never hand them your account, your display name or your email address. They do see the network address your request comes from, because every request on the internet carries one. Nothing in this list loads until you open a page that uses it.'
  bs_h_service: 'Service'
  bs_h_what: 'What it is for'
  bs_h_sees: 'What it receives'
  bs_sees_ip: 'Your IP address, and which map squares you asked for.'
  bs_openfreemap_what: 'The base map: the roads, water and place names under everything else.'
  bs_esri_what: 'The satellite view, only once you switch to it.'
  bs_esri_sees: 'Your IP address, and which image squares you asked for. Esri is in the United States.'
  bs_mapillary_what: 'Street-level photos, only once you open the street view.'
  bs_mapillary_sees: 'Your IP address, and which photos you opened. Mapillary is run by Meta Platforms Ireland Limited, in Ireland, and the image files themselves come from Meta''s content network, which is worldwide.'
  bs_photon_what: 'Place search: in the map search, in the place search of the contribution form, and in the base location field of your settings.'
  bs_photon_sees: 'Your IP address, what you type into a place search, and the language of the page. From the map search, also the region or country the search is limited to. Photon is run by komoot, in Germany.'
  browser_services_post: 'Two of these can reach outside the European Economic Area (EEA): <b>Esri</b> is in the United States, and Mapillary''s image files come from Meta''s worldwide network. If you never open the satellite view or the street view, your browser contacts neither. See <b>International transfers</b> below.'
  h3_server_services: 'Services our server asks'
  server_services_body: 'A few checks run from our server, so these services see our server''s address, never yours. When someone adds a web link to a place, our server may ask <b>Google Safe Browsing</b>, in the United States, whether the link is known to be harmful, when that check is switched on; it sends only the link. When we send a published bug to <b>GitHub</b>, in the United States, our server opens an issue there with the bug''s public title and text, which never name a person. Neither of these services gets personal data about you. When you apply to curate, our server looks up the username you gave on <b>OpenStreetMap</b>; that username is already public there.'
  h_transfers: 'International transfers'
  transfers_body: 'Your account, your contributions, your photos and our backups stay in the European Economic Area (EEA). A handful of outside services can see something from outside it, each one named above. <b>Proton</b>, in Switzerland, holds our mailbox, so it sees the email you write to us. The EU has decided that Swiss law protects personal data as well as EU law does (an adequacy decision), so no extra contract is needed for that. <b>Esri</b>, in the United States, serves the satellite view. Only when you switch that view on does your browser ask Esri for the images, and Esri then sees your IP address and which images you asked for. We send Esri nothing ourselves. The street-level photos from Mapillary come through Meta''s worldwide network, which can serve them from outside the EEA; it sees the same as Esri does, and only once you open the street view. From our server, and never with your IP address: <b>Google Safe Browsing</b>, in the United States, may receive the web links riders add to places, when that check is switched on, and <b>GitHub</b>, in the United States, receives the bugs a curator publishes, as the curator wrote them.'
  h_retention: 'How long we keep it'
  retention_account: '<b>Account data.</b> Until you delete your account, and then it is gone. Deletion is immediate: you ask, we email you a code, you confirm, and the account is removed from the live database in that moment. The email address, the password hash, the two-factor secret and the backup codes go with it. There is no waiting period and nothing is held back in case you change your mind. Our nightly backups still hold the old record until they rotate out, which takes <b>at most 90 days</b>; those backups are encrypted and are opened only to recover from a disaster. An account nobody has signed into for <b>24 months</b> is deleted in the same way. We email you first, three times: after 12, 22 and 23 months, each time with the date it will close. Signing in once is enough to keep it. After that deletion too, our backups hold the old record until they rotate out, at most 90 days. If an administrator removes your account for a breach of our terms, we read your email address just before the deletion and use it once, right after, to send you the statement of reasons. It is then gone, as with any deletion. If that email does not go out, we keep the address with the statement until we send it again or decide not to, and then delete both.'
  retention_unconfirmed: '<b>Unconfirmed accounts.</b> An account whose email address is not confirmed within <b>7 days</b> is deleted, without a warning email. The address may belong to someone who never signed up, and the only email we could send would go to them.'
  retention_logs: '<b>Server logs.</b> Kept for at most <b>90 days</b>, then deleted automatically. Some entries record a full IP address, for security and abuse handling. Those are deleted within the same 90 days.'
  retention_ratelimit: '<b>Use counters and coded addresses.</b> A counter expires on its own, at the latest two days after your last use. A coded address kept with a content report or a bug report stays as long as the report does. One kept with a contact message is deleted with the message, within 24 months of the conversation ending.'
  retention_contributions: '<b>Contributions.</b> Facts you give back to the open map persist as part of the Commons (with provenance), even after you leave; they are not personal data about you. Your confirmations, your "I rode this" marks (except on a route you proposed yourself, where they never counted and are deleted) and the history of your edits also stay when you leave, without any link to your account.'
  retention_traffic: '<b>Traffic summaries.</b> A line waits, encrypted, until its road has enough rides, then joins the totals per road and is deleted. The totals persist as part of the Commons. They hold no rider, so nothing in them is deleted with your account.'
  retention_messages: '<b>Messages about your contributions.</b> The messages between you and the curators about what you contributed are kept as long as your account exists, and deleted with it. So are the statements of reasons we send you when a decision restricts something you added, your contributions that were turned down or that you withdrew before a curator decided on them, and your curator applications. A request to open a country stays only as an anonymous count, without your note or your offer to curate. What a curator approved stays on the map, without your name. A contribution held for a legal case is kept, with its messages, while the hold lasts. Each statement of reasons is also emailed to you; one about your account goes by email only.'
  retention_suspension: '<b>Suspensions.</b> If an administrator suspends your account, we keep on it when the suspension started and when it ends, the ground, the facts as we sent them to you, and which administrator decided. That stays until a later suspension replaces it or the account is deleted. If that administrator''s account is deleted, the link to them is cleared. Your data export holds all of it except who decided. Our admin log records the account, the ground and the end date, never the facts or your address.'
  retention_consent: '<b>Licence consents.</b> When you licence a photo or a translation to the Commons we record that you agreed, the exact wording you agreed to, and when. We keep that record indefinitely, and it survives closing your account: it is our evidence that the licence was granted, which we may need to establish or defend a legal claim (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_17">GDPR Art. 17(3)(e)</a>). It holds a reference to your account and nothing else about you. When you delete your account, we remove that reference, and the record stays linked only to the photo or translation.'
  retention_mail: '<b>Email and contact-form messages you send us.</b> We keep a conversation while the matter is open, and delete it within <b>24 months</b> of it ending. That covers you coming back to us about the same thing a year later, and it covers us if a complaint about how we handled it arrives late. Threads that are part of a legal matter, such as a copyright claim or a takedown, are kept until that matter is finished.'
  retention_bugs: '<b>Bug reports.</b> A bug report stays, as part of the record of what was broken and how it was fixed. If you were signed in, it is linked to your account until you delete the account; then it stays without that link. The email address you gave for our answer is kept while the bug is open, and deleted <b>24 months</b> after we tell you the outcome, the same period as for email you send us.'
  retention_reports: '<b>Reports about content.</b> When you report something on the site, including a photo that shows you, we keep the address you leave for our answer until we have decided on your report: acted on it, found nothing wrong, or closed it because it no longer applies. We delete the address <b>90 days</b> after that decision. The report itself stays, as the record of what we were told and what we did about it. If the reported photo is held for a legal case, we keep the address until that hold is lifted.'
  retention_authorities: '<b>Reports to the authorities.</b> When we inform an authority about something posted here, we record when, which authority, its reference, and which administrator recorded it. The record stays with the photo or submission for as long as that exists, and the material is kept until the authority says it may go. A line in our admin log, with the reference and the authority but nothing of the material, is kept with no end date. If the administrator''s account is deleted, the link to them is cleared and the record stays.'
  retention_updates: '<b>The release list.</b> Your address stays on it until you take it off, from your settings or from the link in any message. We keep the record that you agreed, and to what wording, the same way we keep a photo licence consent: it is the evidence that we were allowed to write to you.'
  h_security: 'How we protect it'
  security_intro: 'The law asks us to take measures that fit the risk (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_32">GDPR Art. 32</a>). In plain words:'
  security_passwords: '<b>Your password is never stored.</b> We keep only a one-way scramble of it, so nobody here can read your password and a stolen database does not hand anyone yours either.'
  security_secrets: '<b>Two-factor secrets and backup codes are encrypted where they sit</b>, with the key held outside the database. Somebody who steals only the database still cannot produce a working code.'
  security_transport: '<b>Everything travels encrypted</b>, between you and us and again when a backup leaves our servers. Browsers are told to refuse an unencrypted connection to us at all.'
  security_access: '<b>Only the people who need your data can reach it</b>, and every curator and administrator has to use two-factor sign-in. Repeated failed sign-ins are slowed down and then locked out.'
  security_source_pre: 'That is the short version. The exact measures, and the reasoning behind each one, are in our'
  security_source_link: 'public source code'
  security_source_post: ', which is the point of building it in the open: you do not have to take a security paragraph on trust.'
  security_honest: 'No system is perfect and we will not pretend ours is. There is no certification behind that paragraph and no penetration test: what there is, is a small system that keeps as little as it can, and code anyone can check.'
  h_breach: 'If data ever leaks'
  breach_pre: 'If personal data is lost, exposed, or reached by somebody who should not have it, and that is likely to put people''s rights at risk, we report it to the'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>within 72 hours</b> of finding out (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_33">GDPR Art. 33</a>). If the risk to you personally is high, we also contact you directly and without delay (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_34">GDPR Art. 34</a>), in plain language: what happened, which of your data was involved, what we have done about it, and what you should do. We keep an internal record of every breach, including the ones we are not obliged to report, so the pattern stays visible to us even when no single one is reportable.'
  h_rights: 'Your rights'
  rights_intro: 'Under the <a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679">GDPR</a> you have the following rights:'
  rights_access: '<b>Access (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_15">GDPR Art. 15</a>)</b>: request a copy of the personal data we hold about you.'
  rights_correct: '<b>Rectification (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_16">GDPR Art. 16</a>)</b>: correct anything inaccurate, or complete anything missing.'
  rights_erase: '<b>Erasure (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_17">GDPR Art. 17</a>)</b>: delete your account at any time from your account settings. Your personal data goes with it and does not come back: your account details, your messages, your votes, your curator applications, and your contributions that were turned down or that you withdrew. Some things stay for a while longer: our encrypted backups hold the old record until they rotate out, at most 90 days, and a contribution held for a legal case is kept while the hold lasts. Some things deliberately stay, without any link to your account: the contributions you gave to the open map, your confirmations and "I rode this" marks (except on a route you proposed yourself, where they never counted and are deleted), the history of edits, your bug reports, and the record that you granted a licence. A request to open a country stays only as an anonymous count, without your note or your offer to curate. Your approved photos stay too, credited to an anonymous rider, unless your profile is public and you choose to keep your name on them when you leave. All of this is described under <b>How long we keep it</b> above.'
  rights_portability: '<b>Data portability (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_20">GDPR Art. 20</a>)</b>: download what we hold about you as a single ZIP file from your account settings, up to 3 times a day. That limit is only there to stop abuse. Among other things it holds your account details, your contributions, your messages and statements of reasons, your licence consents, and your photos as files. It leaves out what somebody else wrote when they reported one of your photos, because those words are theirs. While a curator is still looking at such a report, or while a photo is held for the authorities, it also leaves out the reason; the decision tells you.'
  rights_restrict: '<b>Restriction and objection (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_18">GDPR Arts. 18–21</a>)</b>: restrict or object to certain processing.'
  rights_withdraw: '<b>Withdraw consent</b> at any time, for example by turning off your public profile or the news emails. From that moment we stop doing what you consented to. What we did with your consent before then stays lawful (<a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679#art_7">GDPR Art. 7(3)</a>).'
  rights_third_party_photo: '<b>Not a user?</b> These rights don''t depend on having an account. If you are recognisable in a photo on our map, every photo page carries a <b>"this photo shows me"</b> link. Report it there, no account and no ID required, and a curator answers within one month at the latest.'
  rights_contact_pre: 'To exercise any of these, email'
  rights_contact_mid: '. We answer within <b>one month at the latest</b>, and normally much sooner. The law allows up to three months for a request that is genuinely complicated, but only if we tell you inside the first month that we are taking longer, and why. If you are unhappy with our answer, you can complain to the'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Children'
  children_body: 'The Commons isn''t intended for children under <b>16</b>. We don''t knowingly collect personal data from anyone under that age; if you believe a child has given us data, contact us and we''ll delete it.'
  h_automated: 'Automated decisions'
  automated_body: 'We don''t make decisions about you by solely automated means, and we don''t profile you for advertising.'
  h_changes: 'Changes to this policy'
  changes_body: 'If we change how we handle data, we add a new version here, with its date and what changed, and show signed-in riders a notice until they have read it. A significant change, such as a new purpose, a new recipient or a new country, is also emailed to every account at least 30 days before it applies, so you can read it and close your account first if you do not agree. Your account records the version of each page you last saw.'
  changes_versions_pre: 'View the'
  changes_versions_link: 'revision history'
  changes_versions_post: ' on GitHub.'
  footer_disc_pre: 'See also our'
  footer_disc_terms: 'Terms of Use'
  footer_disc_mid: 'and the data, media and code'
  footer_disc_licences: 'licences'
  footer_disc_post: '.'
