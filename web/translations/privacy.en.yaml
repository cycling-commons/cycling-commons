  change:
    v1_first: 'The first numbered version. Earlier wording is in the revision history linked below.'
    v2_traffic: 'New: from Scout''s ride review you can send a <b>traffic summary</b> of a ride with a radar: per road, the distance, the cars and the part of the day. A summary holds no GPS track. See what we collect and how long we keep it.'
    v2_time_zone: 'New: we store your <b>time zone</b>, the one you choose in your settings or the one your browser reports, to show times in it.'
    v2_pseudonym: 'Corrected: with your profile off, your contributions show your fixed <b>pseudonym</b>, not no name at all.'
    v2_base_location: 'Changed: your <b>base location</b> is stored as a random point up to about 2.5 km from the point you pick, instead of a point rounded to about 1 km.'
    v2_clearer: 'Easier to read. It says that both things you can send from Scout, traffic summaries and tags, are your choice for every ride. It explains in plain words how we keep your password, why we count how often a tool is used without an account, and what the map stores in your own browser. For each service outside the EEA it says what that service sees. Every GDPR article it names links to the law itself.'
    v2_errors: 'Added: <b>error reports</b> from our server, what they hold, and that they stay on our own machines.'
    v2_notice: 'Added: how we tell you about changes. A significant change is emailed to you at least 30 days before it applies; a smaller one gets a new version here.'
    v2_more: 'Added: what a Scout tag sends; what we keep from bug reports, curator applications and "I rode this" marks; your other settings; where we keep coded IP addresses, and for how long; that links added to places may be checked with Google Safe Browsing; and what happens to each kind of data when you delete your account.'
    v2_statements: 'Added: the <b>statements of reasons</b> we send when a decision restricts something you added: kept with your messages as long as your account, part of your data export, and emailed to you.'
    v2_suspension: 'Added: what we keep when an administrator <b>suspends</b> an account, for how long, and what your data export holds of it; and that a removal for a breach uses your email address once, to send you the reasons.'
    v2_authorities: 'Added: when the law requires us to inform the <b>police or a judicial authority</b> of a threat to somebody''s life or safety, what we give them, on which legal basis, and how long we keep the record.'
