terms:
  kicker: 'Nutzungsbedingungen'
  title: 'Die Vereinbarung, in klarer Sprache.'
  lead: 'Diese Bedingungen regeln die Nutzung der Cycling-Commons-Website und des Kontos, in klarer Sprache.'
  version_line: 'Version %n% · %date%'
  changed_bar: 'Unsere Nutzungsbedingungen haben sich am %date% geändert.'
  changing_bar: 'Unsere Nutzungsbedingungen ändern sich am %date%.'
  changed_read: 'Lies, was sich geändert hat'
  upcoming_box: 'Ab dem %date% gilt eine neue Version.'
  upcoming_link: 'Lies die neue Version'
  next_box: 'Dies ist die neue Version. Sie gilt ab dem %date%.'
  next_back: 'Lies die Version, die jetzt gilt'
  h1_accepting: 'Akzeptieren dieser Bedingungen'
  accepting_p1_pre: 'Durch die Nutzung der Cycling-Commons-Website oder die Erstellung eines Kontos stimmst du diesen Bedingungen und unserem'
  accepting_p1_privacy: 'Datenschutzhinweis'
  accepting_p1_mid: ' zu. Wenn du nicht zustimmst, nutze den Dienst bitte nicht. The Commons wird betrieben von'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' in den Niederlanden. Wie das Projekt geführt wird und wohin es geht, steht auf unserer'
  accepting_p1_governance: 'Governance-Seite'
  accepting_p1_post: '.'
  h2_who: 'Wer es nutzen kann'
  who_body: 'Du musst mindestens <b>16</b> Jahre alt sein, um ein Konto zu erstellen. Die Angaben, die du uns machst (wie deine E-Mail), müssen korrekt und zur Nutzung berechtigt sein.'
  h3_account: 'Dein Konto'
  account_password: 'Halte dein Passwort sicher; du bist für die Aktivitäten unter deinem Konto verantwortlich.'
  account_unauthorised: 'Teile uns umgehend mit, wenn du unbefugten Zugriff vermutest.'
  account_suspend: 'Wir können ein Konto sperren oder entfernen, das für Missbrauch oder Verstöße gegen diese Bedingungen genutzt wird, wie Abschnitt 11 erklärt.'
  h4_using: 'Richtige Nutzung'
  using_intro: 'The Commons funktioniert, weil Menschen ihn in gutem Glauben nutzen.'
  using_no_illegal: 'Brich keine Gesetze, belästige niemanden und veröffentliche keine rechtswidrigen, irreführenden oder schädlichen Inhalte.'
  using_no_personal: 'Lade keine <b>personenbezogenen Daten anderer Menschen</b> hoch (zum Beispiel identifizierbare Personen auf Fotos) ohne angemessene Grundlage: The Commons kartiert Orte, nicht Menschen.'
  using_no_reidentify_pre: 'Versuche nicht, Beitragende zu re-identifizieren, und untergrabe nicht die'
  using_no_reidentify_link: 'Datenschutzgrenze'
  using_no_reidentify_post: ' des Projekts, die personenbezogene Daten fernhält.'
  using_no_scrape_pre: 'Scrape den Dienst nicht. Die'
  using_no_scrape_link: 'Entwicklerseite'
  using_no_scrape_post: ' nennt die Wege zu den Daten, und für Massen- oder Offline-Nutzung gibt es einen'
  using_no_scrape_export_link: 'kostenlosen Export'
  using_no_scrape_mid: '. Ist dort nicht dabei, was du brauchst, schreib uns über die'
  using_no_scrape_contact_link: 'Kontaktseite'
  using_no_scrape_end: ', und wir sehen, was wir tun können.'
  using_no_disrupt: 'Störe den Dienst nicht und umgehe seine Grenzen nicht.'
  h5_contributions: 'Deine Beiträge'
  contributions_p1_pre: 'Du behältst die Urheberschaft an dem, was du beisteuert. Damit The Commons offen sein kann, erteilst du die Lizenzen in unseren'
  contributions_p1_link: 'Beitragendenkonditionen'
  contributions_p1_mid: ': <b>Daten</b> treten The Commons unter der'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ' bei, <b>Medien</b> (Fotos, Video) unter'
  contributions_p1_mid3: ' und <b>Code, Benutzeroberfläche und Übersetzungen</b> unter'
  contributions_p1_agpl: 'AGPL-3.0-only'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Du bestätigst, dass du das Recht hast, das Eingereichte beizutragen, dass es keine Rechte anderer verletzt und dass es keine personenbezogenen Daten über andere Menschen enthält.'
  h6_opendata: 'Offene Daten & die API'
  opendata_pre: 'Die Commons-Daten und -Medien stehen allen frei zur Verfügung, auch für kommerzielle Nutzung, unter ihren'
  opendata_link: 'Lizenzen'
  opendata_mid: ' mit Namensnennung. Auch Code, Benutzeroberfläche und Übersetzungen sind frei nutzbar, unter AGPL-3.0-only, die den Quelltext verlangt statt allein eine Nennung. Siehe die'
  opendata_dev_link: 'Entwicklerdokumentation'
  opendata_post: ' für die Attributionszeile und die aktuellen Wege zu den Daten.'
  opendata_export_pre: 'Für Massen- oder Offline-Nutzung lade den'
  opendata_export_link: 'kostenlosen Export'
  opendata_export_post: ' herunter. Er enthält die Orte und Routen von The Commons als GeoJSON, unter der ODbL 1.0 für die Datenbank und der DbCL 1.0 für ihre Inhalte. Jeder Datensatz nennt seine Quelle, und Datensätze, deren Lizenz uns die Weitergabe nicht erlaubt, bleiben draußen. Er enthält keine personenbezogenen Daten, nichts, was noch auf eine Kuratorin oder einen Kurator wartet, und keine Fotos.'
  h7_code: 'Unser Code & unsere Marke'
  code_pre: 'Der Plattformquellcode ist <b>freie Software</b> unter der'
  code_link: 'GNU Affero General Public License v3'
  code_post: ': Jede und jeder darf ihn ausführen, untersuchen, ändern und weitergeben, auch kommerziell. Was die Lizenz zurückverlangt, ist der Quelltext. Wer eine geänderte Fassung betreibt und Menschen über ein Netzwerk nutzen lässt, schuldet diesen Menschen auch den Quelltext. Der Name „Cycling Commons“ und das Logo fallen <b>nicht</b> unter diese Lizenz und bleiben beim Projekt, was Abschnitt 7(e) der AGPL ausdrücklich erlaubt. Was du damit tun darfst, steht in unserer'
  code_brand_link: 'Markenrichtlinie'
  code_brand_post: '.'
  h8_preview: 'Eine Absicht, keine Garantie'
  preview_body: 'The Cycling Commons ist eine Absicht, <b>keine</b> Garantie. Verlass dich nicht darauf für Routen, Straßenzustand oder deine Sicherheit auf der Straße. Nutze beim Fahren immer dein eigenes Urteil.'
  h9_warranty: 'Keine Gewährleistung'
  warranty_body: 'Der Dienst wird <b>„wie besehen"</b> und „wie verfügbar" bereitgestellt, ohne jegliche Garantien, soweit gesetzlich zulässig. Wir garantieren nicht, dass er korrekt, unterbrechungsfrei oder fehlerfrei ist.'
  h10_liability: 'Haftung'
  liability_body: 'Soweit nach niederländischem Recht zulässig, haftet BikeCoders nicht für mittelbare oder Folgeschäden, die aus der Nutzung von The Commons entstehen. Nichts in diesen Bedingungen schränkt die Haftung ein, die nicht gesetzlich eingeschränkt werden kann.'
  h11_suspension: 'Konten schließen und entfernen'
  suspension_pre: 'Du kannst dein Konto jederzeit in den'
  suspension_link: 'Einstellungen'
  suspension_post: ' schließen.'
  suspension_dormant: 'Ein Konto, bei dem sich <b>24 Monate</b> lang niemand angemeldet hat, wird auf dieselbe Weise gelöscht. Wir schreiben dir vorher dreimal, nach 12, 22 und 23 Monaten, und eine einzige Anmeldung genügt, um es zu behalten. Ein Konto, dessen E-Mail-Adresse nicht innerhalb von <b>7 Tagen</b> bestätigt wird, wird ohne Warnung gelöscht, denn die Adresse kann jemandem gehören, der sich nie registriert hat.'
  suspension_p2: 'Bevor du gehst, kannst du auf derselben Seite <b>alles herunterladen, was wir über dich gespeichert haben</b>, als eine einzige ZIP-Datei. Das Schließen deines Kontos entfernt deine personenbezogenen Daten sofort von der Website; unsere verschlüsselten Sicherungen bewahren sie höchstens 90 Tage auf, wie die Datenschutzerklärung erklärt. Deine Bewerbungen als Kuratorin oder Kurator werden mit gelöscht. Eine Anfrage, ein Land zu öffnen, bleibt nur als anonyme Zählung, ohne deine Notiz und ohne dein Angebot, dort zu kuratieren. Manches bleibt, ohne Verbindung zu deinem Konto: was du zur offenen Karte beigetragen hast, deine Bestätigungen und „Bin ich gefahren“-Markierungen (außer auf einer Route, die du selbst vorgeschlagen hast: Die zählten nie und werden gelöscht), der Bearbeitungsverlauf, deine Fehlermeldungen und der Nachweis, dass du eine Fotolizenz erteilt hast, den wir als Beleg für das Bestehen der Lizenz aufbewahren. Freigegebene Fotos bleiben unter CC BY-SA 4.0 in The Commons. Ist dein Profil öffentlich, entscheidest du beim Verlassen, ob sie deinen Anzeigenamen behalten; sonst werden sie anonym. Was unter einer rechtlichen Sperre steht, etwa weil es an Behörden gehen könnte, bleibt, bis die Sperre aufgehoben ist.'
  suspension_admin: 'Die Administration kann ein Konto für 1 bis 365 Tage <b>sperren</b> oder es <b>entfernen</b>, wenn es für Missbrauch, für Verstöße gegen diese Bedingungen oder dazu genutzt wird, The Commons oder den Menschen, die ihn nutzen, zu schaden. Der Grund ist immer einer von diesen: Missbrauch, Spam, rechtswidrige Inhalte, Nutzung des Dienstes entgegen diesen Bedingungen (etwa Scraping, Störungen oder das Umgehen seiner Grenzen), Kontodaten, die nicht stimmen oder nicht deine eigenen sind, Beiträge, die nicht stimmen, Werbung oder personenbezogene Daten über andere Menschen. Solange eine Sperrung läuft, kannst du dich nicht anmelden, und eine schon offene Sitzung endet. Sie endet von selbst zu dem Datum und der Uhrzeit, die wir dir nennen. Was du beigetragen hast, bleibt, wo es ist, und die 24 Monate, nach denen ein ungenutztes Konto gelöscht wird, zählen ab dem Ende der Sperrung. Das Entfernen geschieht sofort und löscht das Konto genauso, wie wenn du es selbst schließt.'
  suspension_told: 'In beiden Fällen schicken wir dir per E-Mail eine Begründung: was wir entschieden haben, den Grund, die Tatsachen, ob Meldungen dazu geführt haben, und wie du widersprechen kannst. Nach einer Entfernung geht sie an deine Adresse, gleich nachdem das Konto gelöscht ist. Wenn du meinst, dass wir uns geirrt haben, antworte auf diese E-Mail oder schreib uns über die Kontaktseite; wir sehen uns die Entscheidung noch einmal an und sagen dir, was wir entschieden haben.'
  h12_moderation: 'Wie die Moderation arbeitet'
  mod_intro: 'The Commons besteht aus dem, was Radfahrende beitragen, also muss ein Teil davon geprüft werden. Dieser Abschnitt sagt, was wir entfernen, wer entscheidet, was dir mitgeteilt wird und was du dagegen tun kannst.'
  mod_standard_h: 'Was entfernt wird'
  mod_std1: '<b>Alles Rechtswidrige.</b> Auch Inhalte, die die Rechte anderer verletzen.'
  mod_std2: '<b>Personenbezogene Daten über andere.</b> The Commons kartiert Orte, keine Menschen. Eine erkennbare Person auf einem Foto, ein Name, ein Kennzeichen, ein als Wohnung einer Person bezeichnetes Haus.'
  mod_std3: '<b>Dinge, die schlicht nicht stimmen.</b> Eine Wasserstelle, die es nie gab, ein Belag, der nicht der Wirklichkeit entspricht, ein erfundener Anstieg, um eine Rangliste zu manipulieren.'
  mod_std4: '<b>Missbrauch.</b> Belästigung, Drohungen, oder Inhalte, die auf eine Person zielen statt auf einen Ort.'
  mod_std5: '<b>Werbung.</b> The Commons ist kein Branchenverzeichnis, und ein Ort steht nicht darauf, weil jemand gezahlt oder gefragt hat.'
  mod_std6: '<b>Fotos, die keine Fotos sind.</b> Ein Bild, das von KI erzeugt oder wesentlich verändert wurde, so gut es auch aussieht. The Commons ist eine Karte der wirklichen Welt, und ein Bild von einem Ort, der nie so ausgesehen hat, ist schlechter als gar kein Bild.'
  mod_std7: '<b>Intimes Bildmaterial oder ein Foto, das ein Kind zeigt.</b> Ein Foto, das aus diesem Grund gemeldet wird, wird zuerst verborgen und danach geprüft, wie „Wer entscheidet“ erklärt.'
  mod_std8: '<b>Privatbesitz, der nicht öffentlich sein sollte.</b> Eine private Einfahrt, ein Garten, ein Blick in jemandes Haus. Das Foto mag rechtmäßig entstanden sein; eine Kuratorin oder ein Kurator wägt die Bitte der Eigentümer trotzdem ab.'
  mod_std9: '<b>Das Werk von jemand anderem.</b> Ein Foto oder ein Text, den du nicht selbst gemacht hast und nicht unter unseren Lizenzen teilen darfst. Wer die Rechte hält, kann es als eigenes Werk melden, und wer es hinzugefügt hat, kann einmal antworten.'
  mod_accept: 'Eine Kuratorin oder ein Kurator prüft, was Radfahrende schicken. Ein Beitrag muss stimmen, überprüfbar sein und etwas sein, das The Commons kartiert; was das nicht ist, wird abgelehnt. Beschreiben zwei Einträge denselben Ort, behält eine Kuratorin oder ein Kurator einen und nimmt den anderen von der Karte.'
  h13_ai: 'Wo Maschinen beteiligt sind'
  ai_intro: 'Kurze Liste, und wir sagen sie dir lieber, als dass du raten musst:'
  ai_translation: '<b>Maschinelle Übersetzung.</b> Manche Ortsbeschreibungen sind maschinell aus einer anderen Sprache übersetzt. Jede davon ist an Ort und Stelle als solche gekennzeichnet, denn eine maschinelle Übersetzung eines Passes kann auf eine Weise falsch sein, die sich völlig richtig liest.'
  ai_none: '<b>Sonst nichts.</b> Kein Chatbot, kein generierter Text, den wir als unseren ausgeben, und kein Profiling. Das Wenige, was Software von sich aus tut, etwa eine infizierte Datei ablehnen oder ein nie bestätigtes Konto löschen, steht unter „Wer entscheidet“ in Abschnitt 12. Sollte diese Liste je länger werden, ändern sich zuerst diese Abschnitte.'
  ai_checks: '<b>Automatische Prüfungen.</b> Software sucht nach Dingen, die falsch aussehen, etwa zwei Brunnen im Abstand von einem Meter, ein Ort, der derselbe sein könnte wie ein Objekt in OpenStreetMap, oder ein Link, der auf einer Liste unsicherer Seiten steht, und legt, was sie findet, einer Kuratorin oder einem Kurator vor. Sie markiert; eine Kuratorin oder ein Kurator entscheidet.'
  ai_uploads: '<b>Was du nicht hochladen darfst.</b> Keine von KI erzeugten Bilder und keine veränderten Szenen. Normales Bearbeiten ist in Ordnung, mit KI-Werkzeugen oder ohne: zuschneiden, gerade rücken, Farben abstimmen, schärfen, entrauschen. Etwas zu erfinden oder wegzunehmen, was da war, ist es nicht, und ein Bild, das ein Modell gemacht hat, auch nicht. Gesichter und Kennzeichen unkenntlich zu machen ist erlaubt und willkommen. Die Einwilligung, die du vor dem Hochladen setzt, sagt dasselbe, und ein Foto, das dagegen verstößt, kann entfernt werden.'
  ai_stance: 'Wir behaupten damit keine Konformität mit irgendetwas. Die EU-KI-Verordnung enthält Transparenzregeln, und es ist strittig, wie weit sie bis zur Beschreibung eines Wasserhahns reichen. Wir sagen es dir, weil eine Karte nur etwas taugt, wenn du erkennen kannst, was ein Mensch darauf gesetzt hat.'
  mod_who_h: 'Wer entscheidet'
  mod_who: 'Es entscheiden <b>Kuratorinnen und Kuratoren</b> oder <b>Administratorinnen und Administratoren</b>, immer Menschen. Sie arbeiten nach einem schriftlichen Regelwerk, und jede Entscheidung wird mit ihrem Namen festgehalten.'
  mod_escalate: '<b>Gefahr für Leben oder Sicherheit.</b> Deutet etwas auf eine Straftat hin, die das Leben oder die Sicherheit eines Menschen bedroht, gibt eine Kuratorin oder ein Kurator es an die Administration weiter. Ein Foto oder eine Einreichung wird sofort verborgen und unter eine rechtliche Sperre gestellt. Die Administration informiert die Polizei oder Justizbehörde des betroffenen Landes, oder der Niederlande, wenn das unklar ist, und gibt ihr, was wir haben und sie braucht; dazu können die Daten des Kontos gehören, von dem es stammt. Das Material bleibt erhalten, bis diese Behörde sagt, dass es gelöscht werden darf.'
  mod_automated: '<b>Was Software von sich aus tut.</b> Die meisten automatischen Prüfungen markieren nur etwas für einen Menschen (Abschnitt 13). Diese handeln, ohne auf jemanden zu warten:'
  mod_auto_files: '<b>Dateien.</b> Jede Datei, die du hochlädst, wird auf Schadsoftware geprüft und kontrolliert, bevor sie erscheint. Eine Datei, die infiziert oder unlesbar ist oder nicht in einem Format und einer Größe vorliegt, die wir annehmen, wird abgelehnt, und du erfährst es.'
  mod_auto_scenic: '<b>Aussichtspunkte.</b> Ein Foto an einem Aussichtspunkt muss die Aussicht von genau dort zeigen. Wurde es mehr als 250 m von der Stecknadel entfernt aufgenommen, oder können wir nicht erkennen, wo, bleibt es an diesem Ort verborgen, bis eine Kuratorin oder ein Kurator bestätigt, dass es dort aufgenommen wurde.'
  mod_auto_urgent: '<b>Dringende Meldungen.</b> Eine Meldung über intimes Bildmaterial oder über ein Kind verbirgt das Foto sofort, bevor ein Mensch die Meldung gesehen hat, und anschließend prüft es eine Kuratorin oder ein Kurator. Das schützt Menschen; es urteilt nicht über sie. Dieses automatische Verbergen hat Grenzen, damit das Meldeformular nicht genutzt werden kann, um Fotos massenhaft zu entfernen; eine Meldung darüber hinaus steht ganz oben auf der Liste der Kuratorinnen und Kuratoren, und die Administration wird alarmiert.'
  mod_auto_accounts: '<b>Konten.</b> Unbestätigte Konten und Konten, die 24 Monate ungenutzt sind, werden gelöscht, wie Abschnitt 11 erklärt. Zu viele fehlgeschlagene Anmeldungen sperren die Anmeldung bei einem Konto für eine Weile.'
  mod_told_h: 'Was dir mitgeteilt wird'
  mod_told_pre: 'Schränkt eine Entscheidung etwas ein, das du hinzugefügt hast, schicken wir dir eine Begründung, in deine'
  mod_told_link: 'Nachrichten'
  mod_told_post: ' und per E-Mail. Das gilt für eine Einreichung, Route oder Übersetzung, die eine Kuratorin oder ein Kurator ablehnt; ein Foto, das entfernt wird; ein Foto, das nach einer dringenden Meldung verborgen wurde, sobald es geprüft ist, auch wenn es danach auf die Karte zurückkommt; Fotos, die bei der Entscheidung über den Rest weggelassen werden; einen Ort oder eine Route, die von der Karte genommen wird, auch wenn ein anderer Eintrag als derselbe Ort behalten wird; einen Beitrag, der wegen Missbrauchs in den Papierkorb kommt; eine bestätigte Meldung über etwas, das du hinzugefügt hast; und eine Datei, die unsere Upload-Prüfungen ablehnen. Die Begründung sagt, was entschieden wurde und was es umfasst, die Tatsachen, ob eine Meldung der Anlass war, ob unsere Software von sich aus gehandelt hat, auf welcher Regel oder welchem Gesetz es beruht und wie du widersprechen kannst. Wer etwas ablehnt, schreibt immer eine Notiz, und die Begründung zitiert sie.'
  mod_told_p2: 'Eine Frage einer Kuratorin oder eines Kurators zu etwas, das du geschickt hast, oder ein Foto, das nach einer Meldung wiederhergestellt wird, erreicht dich ebenfalls in deinen Nachrichten. Manche Entscheidungen schicken nichts. Eine Einreichung, die als Spam in den Papierkorb verschoben wird, verschwindet ohne Nachricht, wie es das Gesetz über digitale Dienste erlaubt; sie kann 30 Tage lang wiederhergestellt werden. Was für die Behörden unter einer rechtlichen Sperre steht, bekommt keine Begründung, solange die Sperre dauert; die Entscheidung danach schon. Eine Bearbeitung durch Kuratorinnen, Kuratoren oder andere Radfahrende schickt nichts, weil sie nichts von dir einschränkt. Eine Begründung zu einem Ort geht an die Person, deren neuen Ort eine Kuratorin oder ein Kurator freigegeben hat; ein Ort aus OpenStreetMap oder einer anderen Quelle hat niemanden, dem wir Bescheid geben könnten. Regionstexte und Ortskarten haben keine einzelne Autorin und keinen einzelnen Autor, also erreicht eine Änderung daran niemanden.'
  mod_appeal_h: 'Wenn du anderer Meinung bist'
  mod_appeal_pre: 'Antworte auf die E-Mail mit der Begründung, mit ihrer Referenz, und wir sehen uns die Entscheidung noch einmal an. Wenn dich nichts erreicht hat, du lieber nicht per E-Mail antwortest oder kein Konto mehr hast, schreib uns über die'
  mod_appeal_link: 'Kontaktseite'
  mod_appeal_post: '. Eine Entscheidung ist nicht endgültig, nur weil sie einmal getroffen wurde; wer sich geirrt hat, kann sie ändern.'
  mod_report_h: 'Etwas melden'
  mod_report_pre: 'Jede und jeder kann Inhalte melden, mit oder ohne Konto. Nutze die'
  mod_report_link: 'Kontaktseite'
  mod_report_post: ' oder den Meldelink auf der Seite oder dem Foto selbst. Eine Meldung braucht eine E-Mail-Adresse, außer einer Meldung über intimes Bildmaterial oder ein Kind, die du ohne Adresse schicken kannst. Wenn wir eine Adresse haben (angemeldet ist es die deines Kontos), bestätigen wir den Eingang und sagen dir, was wir entschieden haben.'
  mod_report_p2: 'Das Formular bietet die oben genannten Gründe an, und „Etwas anderes“ für alles, was nicht passt. Wer als Kuratorin oder Kurator auf „Etwas anderes“ hin handelt, nennt zuerst die Regel, gegen die verstoßen wurde.'
  h14_governing: 'Geltendes Recht'
  governing_body: 'Diese Bedingungen unterliegen dem Recht der <b>Niederlande</b>, und Streitigkeiten gehen vor die zuständigen niederländischen Gerichte. Nutzt du The Commons als Verbraucherin oder Verbraucher und lebst in der EU, behältst du den Schutz des zwingenden Rechts deines eigenen Landes und kannst einen Streit vor die Gerichte an deinem Wohnort bringen. Wir können eine Klage gegen dich nur dort erheben.'
  h15_changes: 'Änderungen'
  changes_body: 'Wenn sich diese Bedingungen ändern, fügen wir hier eine neue Version hinzu, mit Datum und Änderungen, und zeigen angemeldeten Radfahrenden einen Hinweis, bis sie sie gelesen haben. Eine wesentliche Änderung, etwa eine neue Regel oder eine Änderung deiner Rechte, schicken wir außerdem jedem Konto mindestens 30 Tage vor ihrem Inkrafttreten per E-Mail, damit du sie lesen und vorher dein Konto schließen kannst, wenn du nicht einverstanden bist. Wer The Commons nach dem Inkrafttreten einer Änderung weiter nutzt, akzeptiert sie.'
  changes_included: 'Diese Bedingungen schließen drei weitere Texte ein: die Beitragendenkonditionen (Abschnitt 5), die Markenrichtlinie (Abschnitt 7) und die Lizenzseite mit den Lizenztexten, auf die sie verlinkt. Eine wesentliche Änderung an einem davon kündigen wir an wie eine Änderung dieser Bedingungen, per E-Mail mindestens 30 Tage vor ihrem Inkrafttreten. Redaktionelle Korrekturen, etwa ein Tippfehler oder ein defekter Link, gelten sofort.'
  changes_versions_pre: 'Sieh dir die'
  changes_versions_link: 'Versionsgeschichte'
  changes_versions_post: ' auf GitHub an.'
  h16_contact: 'Kontakt'
  contact_pre: 'Fragen zu diesen Bedingungen:'
  contact_post: '.'
  contact_poc_pre: 'Unsere'
  contact_poc_link: 'Kontaktseite'
  contact_poc_post: ' ist unsere zentrale Kontaktstelle für Radfahrende und für Behörden, auch nach dem EU-Gesetz über digitale Dienste. Du kannst uns auf Englisch, Französisch, Niederländisch, Deutsch oder Spanisch schreiben.'
  footer_disc_pre: 'Siehe auch unseren'
  footer_disc_privacy: 'Datenschutzhinweis'
  footer_disc_mid: 'und die Daten-, Medien-, Code-, Oberflächen- und Übersetzungs-'
  footer_disc_licences: 'Lizenzen'
  footer_disc_post: '.'
  change:
    v2_data: 'An die Daten kommen: Die Bedingungen verweisen auf die Entwicklerseite, die die Wege nennt, statt aufzuzählen, was live ist, und nennen den kostenlosen Export für Massen- und Offline-Nutzung. Scraping bleibt verboten.'
    v2_code: 'Beiträge: Code, Benutzeroberfläche und Übersetzungen werden zusammen genannt, alle unter AGPL-3.0-only.'
    v2_backups: 'Ein Konto schließen: Die Bedingungen sagen, dass unsere verschlüsselten Sicherungen die personenbezogenen Daten höchstens 90 Tage aufbewahren, wie es die Datenschutzerklärung schon tat.'
    v2_notice: 'Wie wir dich über Änderungen informieren: Eine wesentliche Änderung schicken wir dir mindestens 30 Tage vor ihrem Inkrafttreten per E-Mail, und eine kleinere bekommt hier eine neue Version.'
    v2_more: 'Moderation und Konten: Die Bedingungen nennen jeden Grund, den eine Meldung angeben kann, was Software von sich aus tut, was dir nach einer Entscheidung mitgeteilt wird, wann ein Konto entfernt oder gelöscht wird, und dass Verbraucherinnen und Verbraucher das Recht und die Gerichte ihres eigenen Landes behalten.'
    v2_reasons: 'Was dir mitgeteilt wird: Schränkt eine Entscheidung etwas ein, das du hinzugefügt hast, bekommst du eine Begründung in deine Nachrichten und per E-Mail, mit den Tatsachen, der Regel und wie du widersprechen kannst. Die Bedingungen sagen auch, was nicht angenommen wird.'
    v2_suspension: 'Sperrung: Die Administration kann ein Konto jetzt für 1 bis 365 Tage sperren, nicht nur entfernen. Die Bedingungen nennen die Gründe, und zu beiden Entscheidungen gibt es eine Begründung per E-Mail.'
    v2_authorities: 'Gefahr für Leben oder Sicherheit: Die Bedingungen sagen, wie solche Inhalte gesichert werden und wie die Administration die Polizei oder eine Justizbehörde informiert.'
    v2_included: 'Eingeschlossene Texte: Die Beitragendenkonditionen, die Markenrichtlinie und die Lizenzseite gehören zu den Bedingungen, und eine wesentliche Änderung daran kündigen wir genauso an.'
    v1_first: 'Die erste nummerierte Version. Frühere Fassungen stehen in der unten verlinkten Versionsgeschichte.'
