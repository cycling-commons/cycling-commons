developers:
  kicker: 'Auf The Commons aufbauen'
  title: 'Offene Daten. Eine offene API. Für alle zum Aufbauen.'
  lead: 'Frage The Commons nach Gebiet und Typ ab, binde unsere Vektor-Tiles in deinen eigenen Kartenstil ein, oder hoste den kostenlosen periodischen Massenexport selbst. Die Daten sind offen (ODbL) — das macht es zu einem Commons. Der Zugang ist Self-Service: ein kostenloser Schlüssel, eine kostenlose Stufe, und bezahlte Kontingente nur für intensive, immer aktuelle Nutzung.'
  status: 'In Entwurf — diese Endpunkte sind der Vertrag, den wir bauen. Sieh dir die <a href="/developers/api">interaktive API-Referenz</a> (Englisch) oder die <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">Spezifikation auf GitHub</a> an.'
  ep_kicker: 'Endpunkte'
  ep1_path: '/v1/search'
  ep1_desc: 'Abdeckung finden nach <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'ein Element — unsere Anreicherung, Herkunft, Verifizierung (<code>?hydrate=osm</code>)'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'Regionspolygon + Abdeckungsstatistiken'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'das kuratierte Beste einer Region'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'Routendetail + GPX-Download'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'Vektor-Tiles mit Schlüssel + TileJSON — in deinen eigenen MapLibre-Stil einzubinden'
  ep7_path: '/v1/contributions'
  ep7_desc: 'beitragen — geplant (Phase 2), landet in der Prüfwarteschlange'
  ex_kicker: 'Beispielanfrage'
  resp_kicker: 'Antwort'
  ex_hydrate: 'Antworten sind standardmäßig nur-Referenz: unsere ergänzten Felder plus die <code>osm_ref</code> zum Hydrieren gegen OSM. <code>?hydrate=osm</code> mischt unseren zwischengespeicherten OSM-Teilbestand gleich mit ein.'
  attr_kicker: 'Erforderliche Attribution'
  rules_kicker: 'Die Regeln'
  rules_body: '<b>Self-Service &amp; faire Nutzung.</b> Lesezugriffe nutzen einen kostenlosen Self-Service-Schlüssel mit kostenlosem Monatskontingent; bezahlte Stufen bieten mehr Durchsatz und immer aktuelle Daten für intensive Nutzung. Nimm für Massen- oder Offline-Nutzung den <b>kostenlosen periodischen Export</b> und hoste ihn selbst, anstatt die Live-API zu belasten — Scraping des Dienstes ist nicht erlaubt. <b>Schreibzugriffe sind geplant (Phase 2)</b> und durchlaufen dieselbe Prüfung wie Beiträge in der App. Lizenzen: Daten <b>ODbL 1.0</b>, Medien <b>CC BY-SA 4.0</b> — Attribution, Share-alike, offen halten; kommerzielle Nutzung ist in Ordnung. Siehe die Zusammenfassung in klarer Sprache:'
