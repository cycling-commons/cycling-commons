  sent_title: 'Danke. Sie liegt bei einer Kuratorin.'
  sent_body: 'Eine Person sieht sich das an. Eine Bestätigung ist an deine Adresse unterwegs, und dort erfährst du <b>spätestens innerhalb eines Monats</b>, was entschieden wurde. Der Inhalt bleibt online, solange die Meldung wartet: eine Meldung ist eine Bitte, keine Entfernung.'
  sent_body_no_contact: 'Eine Person sieht sich das an und entscheidet <b>spätestens innerhalb eines Monats</b>. Du hast keine Adresse hinterlassen, deshalb können wir dir das Ergebnis nicht mitteilen. Der Inhalt bleibt online, solange die Meldung wartet: eine Meldung ist eine Bitte, keine Entfernung.'
