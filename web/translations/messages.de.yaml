  body:
    submission_approved: 'Dein Beitrag %title% wurde angenommen und ist jetzt live auf der Karte. Danke, dass du den Commons verbesserst!'
    submission_rejected: 'Dein Beitrag %title% wurde nicht angenommen.'
    submission_needs_info: 'Ein Kurator benötigt weitere Informationen zu %title%, bevor entschieden werden kann. Du kannst unten antworten.'
    route_approved: 'Deine Route %name% wurde angenommen und erscheint jetzt als vorgeschlagene Route auf der Karte. Danke!'
    route_rejected: 'Deine Route %name% wurde nicht angenommen.'
    route_retired: 'Deine Route %name% wurde von der Karte zurückgezogen.'
    correction_done: 'Deine Korrektur an %name% wurde bearbeitet. Danke, dass du die Karte ehrlich hältst!'
    correction_dismissed: 'Deine Korrektur an %name% wurde verworfen.'
    media_takedown_granted: 'Dein Foto wurde aus The Commons entfernt und unsere Kopien davon sind gelöscht. Kopien, die andere unter der Lizenz heruntergeladen haben, können wir nicht erreichen, aber die Seite, die dich genannt hat, nennt niemanden mehr.'
    media_takedown_declined: 'Ein Kurator hat deinen Antrag auf Entfernung geprüft und darin keinen datenschutzrechtlichen Grund gefunden, also ist das Foto wieder veröffentlicht. Falls wir dich falsch verstanden haben — besonders wenn du selbst auf dem Foto bist — antworte auf diese Nachricht oder schreib an info@cyclingcommons.org, dann sehen wir es uns erneut an.'
    media_removed_on_report: 'Eines deiner Fotos wurde nach einer Meldung entfernt, dass es eine erkennbare Person zeigt, die der Veröffentlichung nicht zugestimmt hat. Es geht um dieses eine Bild, nicht um deinen Beitrag — danke dafür. Wer gemeldet hat, können wir nicht sagen, in keine Richtung: Die Person hat auch nicht erfahren, wer hochgeladen hat. Hältst du die Entfernung für falsch, antworte auf diese Nachricht; ein Kurator liest sie.'
    media_hidden_pending_review: 'Jemand hat eines deiner Fotos gemeldet, und wegen dessen, was die Meldung behauptet, haben wir es sofort von der Karte verborgen, während eine kuratierende Person es prüft. Verborgen ist nicht entfernt: Das Foto bleibt deins, ist weiterhin gespeichert, und nichts wurde gelöscht. Hält die Meldung nicht stand, ist es binnen Tagen zurück und wir sagen dir Bescheid. Nur eine kuratierende Person kann ein Foto entfernen, niemals eine Meldung allein — und wir können dir nicht sagen, wer gemeldet hat, so wie dieser Person nicht gesagt wurde, wer hochgeladen hat.'
    media_restored_after_review: 'Die Meldung zu deinem Foto hielt nicht stand, es ist also wieder auf der Karte, genau wie zuvor. Danke für deine Geduld — erst zu verbergen ist der Weg, mit dem eine echte Beschwerde nie tagelang online bleibt, und das heißt, dass gelegentlich ein Foto eine Weile umsonst verschwindet.'
  reply_label: 'Deine Antwort'
  reply_send: 'Antwort senden'
  reply_sent: 'Antwort gesendet — dein Beitrag ist wieder in der Prüfwarteschlange.'
  reply_too_late: 'Dieser Beitrag wartet nicht mehr auf deine Antwort.'

