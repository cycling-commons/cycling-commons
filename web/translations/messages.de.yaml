  title: 'Was funktioniert, und was noch nicht.'
  lead: 'Ein ehrlicher Bericht darüber, wie nutzbar diese Website ist, samt der Stellen, die nicht gut genug sind. Wenn Sie etwas aufhält, sagen Sie es uns, und wir beheben es.'
  last_updated: 'Zuletzt aktualisiert am 27. August 2026'
  report_pre: 'Steht Ihnen hier etwas im Weg?'
  report_link: 'Melden Sie eine Barriere'
  report_post: '. Kein Konto nötig. Wir antworten innerhalb eines Monats, und früher, wo es geht.'
  h_aim: 'Was wir anstreben'
  aim_body: 'Wir messen diese Website an <b>WCAG 2.2, Stufe AA</b>. Das ist ein Ziel, auf das wir hinarbeiten, kein Zertifikat, das wir besitzen: Teile der Website erfüllen es heute, andere nicht, und die beiden Listen unten sagen, welche.'
  h_works: 'Was heute funktioniert'
  works_intro: 'Jedes davon wurde gemessen, nicht angenommen.'
  works_keyboard: '<b>Tastatur.</b> Jede Seite außerhalb der Karte lässt sich ohne Maus bedienen, und der Fokusrahmen wird nie entfernt.'
  works_skip: '<b>Zum Inhalt springen.</b> Das Erste, was eine Tastatur auf jeder Seite erreicht, und es überspringt Hinweisleisten, statt auf ihnen zu landen.'
  works_contrast: '<b>Kontrast.</b> Text wurde über die gesamte Website und die Kartenoberfläche gegen den eigenen Hintergrund gemessen, im hellen wie im dunklen Kartenthema, und die Mängel wurden behoben.'
  works_targets: '<b>Touch-Ziele.</b> Jedes Bedienelement, das wir zeichnen, erreicht die 24px-Untergrenze, geprüft auf einem Telefon statt in einem schmal gezogenen Browserfenster.'
  works_zoom: '<b>Zoom.</b> Text lässt sich auf 200% vergrößern, ohne dass etwas abgeschnitten wird oder seitlich gescrollt werden muss.'
  works_motion: '<b>Keine Bewegung, um die Sie nicht gebeten haben.</b> Nichts spielt von selbst, nichts blinkt, und es gibt kein Karussell.'
  h_gaps: 'Was noch nicht funktioniert'
  gaps_intro: 'Diese sind real, und wir verschweigen sie nicht.'
  gap_map: '<b>Die Karte ist mit einem Screenreader nicht nutzbar.</b> Sie ist eine Zeichnung auf einem Canvas, und ein Bild zu verschieben und zu zoomen hat ohne Sehen keine Bedeutung. Das ist die größte Lücke auf der Website, und wir haben keine schnelle Lösung dafür. Unten steht, was Sie stattdessen nutzen können.'
  gap_vendor: '<b>Einige Kartenbedienelemente sind nicht unsere.</b> Die Zoom-Schaltflächen und der Attributionsschalter stammen aus der Kartenbibliothek. Sie erreichen die Untergrenze, sind aber kleiner, als wir sie zeichnen würden, und ohne Fork lassen sie sich nicht umgestalten.'
  gap_audit: '<b>Niemand von außen hat das geprüft.</b> Alles oben wurde von den Leuten gemessen, die die Website gebaut haben, und das ist nicht dasselbe wie ein Test durch jemanden, der täglich einen Screenreader nutzt.'
  gap_translations: '<b>Übersetzungen hinken dem Englischen hinterher.</b> Neue Formulierungen erscheinen zuerst auf Englisch, eine Seite in einer anderen Sprache kann also kurz gemischt sein.'
  h_instead: 'Was Sie statt der Karte nutzen können'
  instead_pre: 'Alles, was die Karte zeichnet, gibt es auch als Text oder als Daten. Die'
  instead_regions: 'Regionenseiten'
  instead_mid: ' listen auf, was an jedem Ort gefunden wurde, als gewöhnliche Überschriften und Listen. Die'
  instead_api: 'offene API'
  instead_post: ' liefert dieselben Daten an jedes Werkzeug, das Sie bevorzugen. Keines von beiden ist ein vollwertiger Ersatz, und das wissen wir.'
  h_legal: 'Wie wir rechtlich stehen'
  legal_body: 'Wir behaupten keine Konformität mit dem <b>European Accessibility Act</b>, weil unklar ist, ob er für uns gilt. Das Gesetz nennt bestimmte Verbraucherdienste, eine kostenlose offene Karte ist nicht offensichtlich einer davon, und Kleinstunternehmen, die Dienste erbringen, sind ohnehin ausgenommen. Das sagen wir lieber offen, als eine Pflicht anzudeuten, die wir vielleicht nicht haben. Wir halten uns an WCAG, weil es richtig ist, nicht weil jemand uns dazu zwingt.'
  h_how: 'Wie das geprüft wurde'
  how_body: 'Von Hand, in einem echten Browser, auf einem echten Telefon: Tastaturdurchläufe, Kontrast gegen den tatsächlich gerenderten Hintergrund gemessen, und Touch-Ziele vor Ort gemessen statt aus dem Stylesheet geraten. Ein Teil davon ist durch automatische Tests abgesichert, damit es nicht still zurückfällt. Ein Accessibility-Overlay kam nicht zum Einsatz und wird es nie: die machen eine Website für genau die Menschen schlechter, denen sie zu helfen vorgeben.'
  footer_pre: 'Diese Seite ist nur etwas wert, wenn sie sich ändert. Wenn Ihnen etwas begegnet, das hier fehlt,'
  footer_link: 'sagen Sie es uns'
  footer_post: ' und es kommt auf die Liste.'

