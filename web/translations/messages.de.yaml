home:
  eyebrow: 'OFFENE RADDATEN · EINE VORSCHAU DESSEN, WAS SEIN KÖNNTE'
  h1: 'Jede Straße.<br/>Jeder Weg.<br/>Ein <em>offener Atlas</em><span class="endp">.</span>'
  lede: 'Eine von der Community erstellte Karte der besten Touren der Welt — Anstiege, Wasser, Aussichten, fahrradfreundliche Übernachtungen — kostenlos für jeden zum Nutzen, Aufbauen und Verbessern.'
  cta_map: 'Karte erkunden'
  cta_contribute: 'Beitragen'
  tick_label: 'Start'
  tick_year: '2026'
  corner_br: 'SCROLLEN ↓'
  disc_label: 'FÜR JEDE ART DES RADFAHRENS —'
  frag_kicker: 'EIN ORT, NICHT EIN DUTZEND APPS'
  frag_h2: 'Radfahrwissen ist verstreut. The Commons bündelt es.'
  frag_lead1: 'Heute lebt jede Ebene in ihrem eigenen Silo — eine App für Anstiege, eine andere für Routen, eine andere für fahrradfreundliche Übernachtungen, eine andere für Straßenbedingungen — und die meisten sind geschlossen. Radfahrer fügen ein Dutzend Tools zusammen und die Daten verbinden sich nie. The Commons bringt das nicht-persönliche Wissen an einen offenen Ort, frei abfragbar und aufbaubar.'
  frag_lead2: 'Und wo gute offene Daten bereits existieren, bauen wir sie nicht neu auf — wir <b>kooperieren</b>. Wir verlinken und interagieren mit anderen Open-Data-Communities (wie offene Gastfreundschaftsnetzwerke für Schlafmöglichkeiten) anstatt unsere eigene Kopie einzusperren. Offene Daten sollten sich verbinden, nicht weiter fragmentieren.'
  frag_panel_h: 'Heute. Ein Dutzend Apps für deine Tour.'
