meta:
  home_title: 'Cycling Commons'
  home_description: 'Eine offene, gemeinschaftlich erstellte Karte der besten Radstrecken der Welt.'
  about_title: 'Cycling Commons — Über uns'
  about_description: 'Cycling Commons ist eine offene, gemeinschaftlich erstellte Karte der besten Radstrecken der Welt. Offene Daten für alle, verwaltet von den Radfahrenden, die sie aufbauen.'
  regions_title: 'Cycling Commons — Regionen'
  regions_description: 'Der Cycling Commons ist in Regionen ungefähr der Größe von Wallonien/Flandern unterteilt — durchsuche sie nach Kontinent.'
  coverage_title: 'Cycling Commons — Abdeckung'
  coverage_description: 'Wie vollständig ist die Karte? Sieh, was abgedeckt ist, wo es dünn ist und wo du helfen kannst — transparente Überwachung des offenen Cycling Commons.'
  developers_title: 'Cycling Commons — Entwickler'
  developers_description: 'Eine offene API, kostenlos für alle nutzbar. Abfragen im Commons nach Typ und Gebiet, oder vollständige Dumps pro Land herunterladen — standardmäßig offen.'
  licenses_title: 'Cycling Commons — Lizenz'
  licenses_description: 'Die Kurzversion in verständlicher Sprache — was du mit Commons-Daten, Medien und Code machen kannst — ODbL-Daten, CC BY-SA-Medien, PolyForm Shield (quelloffener) Code.'
  join_title: 'Cycling Commons — Mitmachen'
  join_description: 'Hilf beim Aufbau des offenen Cycling Commons — Radfahrende mit lokalem Wissen, Entwickler, Social Media, Fundraising und Recht. Code, Wissen oder ein paar Stunden Expertise: Es gibt Platz für dich.'
  contributors_title: 'Cycling Commons — Mitwirkende'
  contributors_description: 'Von Radfahrenden aufgebaut. Anerkennung ohne Überwachung — wir feiern Beiträge zum offenen Commons, niemals persönliche Daten.'
  region_title: 'Cycling Commons — Region'
  region_description: 'Walloniens beste Radstrecken in einer offenen Ebene — die Ardennen-Klassiker: Anstiege, Aussichten und Routen, aktuell gehalten von denen, die sie kennen.'
  privacy_title: 'Cycling Commons — Datenschutz'
  privacy_description: 'Wie der Cycling Commons mit persönlichen Daten umgeht — in verständlicher Sprache. So wenig wie möglich, und deine Beiträge bleiben von deiner Identität getrennt. DSGVO-konform.'
  terms_title: 'Cycling Commons — Nutzungsbedingungen'
  terms_description: 'Die Nutzungsbedingungen für die Cycling Commons-Website und dein Konto — kurz, lesbar und abgestimmt auf die offenen Lizenzen. Anwendbares Recht: Niederlande.'
  pages_title: 'Cycling Commons — Alle Seiten'
  pages_description: 'Der gesamte Commons, Seite für Seite — eine Übersicht jeder öffentlichen, Mitwirkenden- und Kuratoren-Seite.'
  login_title: 'Cycling Commons — Konto'
  login_description: 'Werde Teil des Atlas. Melde dich an, um Anstiege, Orte und Korrekturen zum offenen Cycling Commons beizutragen.'
  register_title: 'Cycling Commons — Konto erstellen'
  register_description: 'Erstelle ein kostenloses Cycling Commons-Konto, um Anstiege, Orte und Korrekturen zum offenen Cycling Atlas beizutragen.'
  register_check_email_title: 'Cycling Commons — E-Mail bestätigen'
  register_check_email_description: 'Schau in deinen Posteingang, um deine E-Mail-Adresse zu bestätigen und dein Konto zu aktivieren.'
  reset_request_title: 'Cycling Commons — Passwort zurücksetzen'
  reset_request_description: 'Fordere einen Link zum Zurücksetzen des Passworts für dein Cycling Commons-Konto an.'
  reset_check_email_title: 'Cycling Commons — E-Mail bestätigen'
  reset_check_email_description: 'Ein Link zum Zurücksetzen wurde gesendet, falls ein Konto mit dieser E-Mail-Adresse existiert.'
  reset_new_title: 'Cycling Commons — Neues Passwort festlegen'
  reset_new_description: 'Lege ein neues Passwort für dein Cycling Commons-Konto fest.'
  profile_title: 'Cycling Commons — Dein Profil'
  profile_description: 'Dein Mitwirkenden-Profil im Cycling Commons.'
  settings_title: 'Cycling Commons — Einstellungen'
  settings_description: 'Verwalte die Einstellungen deines Cycling Commons-Kontos.'
  twofa_setup_title: 'Cycling Commons — Zwei-Faktor-Authentifizierung (2FA) einrichten'
  twofa_setup_description: 'Füge eine Authenticator-App hinzu, um dein Cycling Commons-Konto zu schützen.'
  twofa_enabled_title: 'Cycling Commons — Zwei-Faktor-Authentifizierung (2FA) aktiv'
  twofa_enabled_description: 'Die Zwei-Faktor-Authentifizierung (2FA) schützt jetzt dein Cycling Commons-Konto.'
  moderate_title: 'Cycling Commons — Moderation'
  moderate_description: 'Kuratoren-Bereich des Commons — Einreichungen prüfen, Meldungen bearbeiten und den offenen Cycling Atlas zuverlässig halten.'
  contribute_title: 'Cycling Commons — Beitragen'
  contribute_description: 'Wähle, was du zum Cycling Commons beitragen möchtest — Anstiege, Wasser, Belag, Gefahren, Unterkünfte, Aussichten und mehr. Ein offener Atlas, aufgebaut von Radfahrenden.'
  add_climb_title: 'Cycling Commons — Anstieg hinzufügen'
  add_climb_description: 'Füge einen Anstieg zum Commons hinzu — suche den Ort, zeichne die Route nach und erfasse Belag, Verkehr und Steigung für jeden Fahrertyp.'
  vote_title: 'Cycling Commons — Abstimmung'
  vote_description: 'Bewerte das beste Radfahren dieser Region. Die Community bestimmt die Saison-Highlights, aktuell gehalten von den Radfahrenden vor Ort.'
  improve_title: 'Cycling Commons — Ort verbessern / hinzufügen'
  improve_description: 'Verbessere einen Ort im Commons — korrigiere Details, melde Zustände und halte den offenen Cycling Atlas für alle Radfahrenden aktuell.'
  propose_route_title: 'Cycling Commons — Route vorschlagen'
  propose_route_description: 'Teile eine empfohlene Fahrt: Lade dein GPX hoch, ein Kurator prüft es, die Community verifiziert und stimmt ab.'
