legend:
  kicker: 'Kartenlegende'
  title: 'Jede Markierung auf der Karte'
  lead: 'Eine Nadel stapelt einige unabhängige Signale auf einer Form: woher der Eintrag kommt, was für ein Ort es ist und was mit ihm geschieht. Diese Seite ist die vollständige Legende.'
  axis_shape_h: 'Form'
  axis_shape_t: 'In welchem Bestand der Eintrag lebt. Eine kleine Scheibe oder ein Tropfen sind importierte Basisdaten; eine Tropfennadel ist ein Eintrag, den diese Gemeinschaft führt.'
  axis_fill_h: 'Füllfarbe'
  axis_fill_t: 'Die Kategorie. Wasser, Toiletten, Anstiege, Services. Die Füllfarbe sagt nie etwas anderes; was ein Ort innerhalb seiner Kategorie ist, steckt im Symbol.'
  axis_border_h: 'Rand'
  axis_border_t: 'Wer den Eintrag brachte und sein Stand bei uns: schwarz-weiße Strichelung = von Radfahrenden ergänzt, dicker roter Rand = wartet auf Moderation, oranger Ring = wird alt.'
  axis_badge_h: 'Abzeichen'
  axis_badge_t: 'Ein Fakt, der Farbenblindheit überleben muss. Oben rechts: ein „?" heißt noch von niemandem bestätigt, ein kleiner papierfarbener Punkt heißt jemand stand dort und hat es geprüft. Oben links: ein rotes „!" heißt gerade nicht nutzbar, eine Uhr heißt vorhanden, aber nicht immer.'
  tag_live: 'Auf der Karte'
  tag_plan: 'Geplant'
  plan_note: 'Mit „Geplant" markierte Zeichen sind entworfen, aber noch nicht auf der Karte. Sie stehen hier, damit sichtbar ist, wohin die Legende geht; die Karte zeichnet sie, sobald die Daten dahinter da sind.'
  tiers_h: 'Woher ein Eintrag kommt'
  tiers_note: 'Die Ebene, die du liest, ob du es weißt oder nicht. Beschreiben zwei Einträge denselben Ort, behält die Karte den, der dem Ende dieser Liste am nächsten ist.'
  tier_osm_h: 'Importierte Basis'
  tier_osm_t: 'Kleine Scheibe, Kategoriefarbe, dünner dunkler Ring. Der Großteil der Karte. Heute OpenStreetMap, ergänzt um öffentliche Register, sobald sie importiert sind. Das Panel nennt immer die echte Quelle.'
  tier_provider_h: 'Amtliches Register, unbestätigt'
  tier_provider_t: 'Eine für diese Art Ort zuständige Stelle steht dafür ein, und noch kein Radfahrer hier hat es bestätigt. Der Herausgeber steht im Datenblatt. Volle Farbe, das "?"-Abzeichen, und der gestrichelte Rand der Radfahrer-Nadel umgekehrt: weiße Striche auf Schwarz.'
  tier_community_h: 'Unbestätigt'
  tier_community_t: 'Schwarz-weiß gestrichelter Rand und ein „?"-Abzeichen. Jemand aus der Gemeinschaft oder ein öffentliches Register hat ihn gesetzt, bestätigt hat ihn noch niemand. Wer vorbeifährt: kurz prüfen.'
  tier_ours_h: 'Unser Katalog'
  tier_ours_t: 'Tropfennadel in voller Farbe mit papierfarbenem Rand. Ein Eintrag, den diese Gemeinschaft führt: kuratiert, bearbeitet oder von jemandem bestätigt.'
  tier_verified_h: 'Geprüft'
  tier_verified_t: 'Dieselbe Nadel mit kleinem papierfarbenem Punkt. Jemand stand dort und hat gesagt: das ist echt.'
  kinds_h: 'Was ein Ort ist, innerhalb seiner Kategorie'
  kinds_note: 'Das Symbol unterscheidet Arten innerhalb einer Kategorie, und Arten werden nie über Kategorien hinweg verglichen: ein Hahn, aus dem man nicht trinken kann, ist eine andere Art von Ding, kein kaputtes. Nur Kategorien mit mehr als einer Art stehen hier.'
  kind_b_tap_h: 'Trinkwasserhahn'
  kind_b_tap_t: 'Ein blauer Tropfen. OSM erfasst es als Trinkwasser und nichts sagt das Gegenteil. Vor Ort prüfen.'
  kind_b_no_h: 'Kein Trinkwasser'
  kind_b_no_t: 'Ein durchgestrichener Tropfen. Als nicht trinkbar getaggt, oder jemand hat es gemeldet.'
  kind_b_unk_h: 'Hahn, nichts gesagt'
  kind_b_unk_t: 'Ein leerer Tropfen. Eine Wasserstelle, zu der niemand etwas gesagt hat; als unbekannt behandeln.'
  kind_b_food_h: 'Verpflegungsstopp'
  kind_b_food_t: 'Messer und Gabel auf der Kategoriescheibe. Eine Bäckerei, ein Laden, ein Café.'
  kind_b_food_water_h: 'Verpflegungsstopp mit Wasser'
  kind_b_food_water_t: 'Dasselbe mit einem kleinen blauen Tropfen: der Ort gibt auch Trinkwasser.'
  kind_d_shop_h: 'Fahrradladen'
  kind_d_shop_t: 'Ein Zahnrad.'
  kind_d_station_h: 'Reparaturstation'
  kind_d_station_t: 'Hammer und Pickel: eine Selbsthilfestation mit Werkzeug.'
  kind_d_pump_h: 'Pumpe'
  kind_d_pump_t: 'Ein eingekreistes Plus: Druckluft oder eine öffentliche Pumpe.'
  state_h: 'Was mit einem Eintrag geschieht'
  state_note: 'Diese Zeichen liegen auf jeder Nadel. Sie beschreiben unseren Umgang mit dem Eintrag, nicht den Ort selbst.'
  state_stale_h: 'Wird alt'
  state_stale_t: 'Ein oranger Ring ersetzt den papierfarbenen Rand. Lange von niemandem bestätigt; die Karte fragt „noch da?"'
  state_pending_h: 'Wartet auf Moderation'
  state_pending_t: 'Ein dicker roter Rand. Jemand hat dies vorgeschlagen und noch niemand hat entschieden. Sichtbar für die einreichende Person und für Kuratorinnen und Kuratoren.'
  state_cluster_h: 'Zu viele zum Zeichnen'
  state_cluster_t: 'Eine Zählblase in der Kategoriefarbe. Beim Hineinzoomen zerfällt sie.'
  state_look_h: 'Hier schauen'
  state_look_t: 'Ein pulsierender oranger Ring zeigt, wo ein berührtes Ergebnis oder ein Ort liegt. Derselbe Puls umgibt eine Nadel, die die Suche zeigt, während dein Anzeigemodus sie verbirgt.'
  state_camera_h: 'Straßenfoto-Kamera'
  state_camera_t: 'Eine grüne Nadel markiert, wo das geöffnete Straßenfoto aufgenommen wurde. Sie wandert mit, während du durch die Bilder gehst.'
  fact_h: 'Was mit dem Ort selbst geschieht'
  fact_note: 'Ein Hahn, der heute kaputt ist, ist der eine Fakt, den eine durstige Person braucht. Diese Zeichen tragen solche Fakten.'
  fact_broken_h: 'Außer Betrieb'
  fact_broken_t: 'Ein rotes „!"-Abzeichen oben links, unabhängig von Farbe und Ebene der Nadel. Jemand hat es als defekt oder geschlossen gemeldet.'
  fact_hours_h: 'Nicht immer erreichbar'
  fact_hours_t: 'Ein Uhr-Abzeichen oben links für Orte, die nicht immer verfügbar sind: nur tagsüber, hinter einem Tor, oder ein saisonaler Hahn in den Monaten, in denen er abgestellt ist. Ein Abzeichen, keine Farbe: Die Nadel behält ihre Kategorie.'
  cats_h: 'Die Kategorien'
  cats_note: 'Die Füllfarbe beantwortet nur „was für ein Ort". Ein Icon-Satz speist die Nadeln, die Ebenenliste und diese Seite.'
  cats_practical: 'Praktisch, mit Ziel voller Abdeckung'
  cats_voted: 'Von Radfahrenden auf die Karte gewählt'
  cats_overlays: 'Karten-Overlays'
  overlay_surface_h: 'Beläge'
  overlay_routes_h: 'Radnetz'
  overlay_switch: 'Overlay-Schalter'
  overlay_note: 'Overlays sind Schalter im Ebenen-Panel, keine Datenebenen: Sie färben die Straßen selbst. Der Belag lebt hier, und seine Legende ist zugleich ein Filter: nur Schotter angehakt, nur Schotter auf der Karte.'
  lines_h: 'Linien'
  lines_note: 'Alles, was die Karte als Strich zeichnet. Die kleine Legende auf der Karte zeigt den Belag- und Netzteil dieser Liste.'
  lines_surfaces: 'Beläge'
  line_unverified_t: 'Rote Striche: Die Straße hat noch keinen Belag-Tag. Der Strich ist die Bedeutung: „braucht einen Tag".'
  line_ticks_h: 'Qualitätsstiche'
  line_ticks_t: 'Kleine Stiche über einer Linie, von Grün (ausgezeichnet) über Bernstein bis Rot (sehr schlecht), sichtbar beim Hineinzoomen.'
  lines_climbs: 'Anstiege'
  line_climb_up_h: 'Anstiegslinie, bergauf'
  line_climb_up_t: 'Violette Bänder nach Steilheit, passend zu den Profilbalken: hell unter 5 %, am dunkelsten ab 16 %.'
  line_climb_down_h: 'Anstiegslinie, bergab'
  line_climb_down_t: 'Dieselben Bänder in Blau für fallende Abschnitte.'
  line_summit_h: 'Gipfelflagge'
  line_summit_t: 'Wo der Anstieg endet. Die Nadel steht am Fuß.'
  line_steep_h: 'Steilstes Stück, gemessen'
  line_steep_t: 'Die steilsten durchgehenden 100 m, die das Modell sehen kann.'
  line_rider_h: 'Steilster Punkt, von Radfahrenden markiert'
  line_rider_t: 'Wo die Wand wirklich steht. Bewusst andere Farbe und Form als die gemessene Markierung.'
  lines_routes: 'Routen'
  line_route_rest_h: 'Empfohlene Route'
  line_route_rest_t: 'Blasses Orange über papierfarbener Einfassung.'
  line_route_sel_h: 'Empfohlene Route, ausgewählt'
  line_route_sel_t: 'Volles Orange und breiter; die anderen Routen dimmen, solange eine offen ist.'
  line_knoop_h: 'Knotenpunkt'
  line_knoop_t: 'Weiße Scheibe, violetter Ring und Nummer, genau wie die Netz-Kacheln es zeichnen.'
  back_to_map: 'Zurück zur Karte'
