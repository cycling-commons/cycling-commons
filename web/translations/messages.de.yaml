about:
  kicker: 'Über uns'
  title: 'Die Karte gehört allen.'
  lead1: 'Jeder Radfahrer trägt eine eigene private Karte in sich: den Brunnen, der einen heißen Juli rettete, den Anstieg, der die extra Stunde wert war, die Nebenstraße, die irgendwie immer leer ist. Dieses Wissen lebt heute in einem Kopf und stirbt dort. Cycling Commons ist der Ort, wo es stattdessen lebt.'
  lead2: 'Eine offene, von der Community erstellte Karte der besten Touren der Welt, für jede Art des Radfahrens. Offene Daten, die jeder nutzen kann, verwaltet von den Fahrern, die sie aufbauen.'
  problem_kicker: 'Das Problem'
  problem_title: 'Eine andere App für alles.'
  problem_lead1: 'Anstiege in einer App, Routen in einer anderen, Übernachtungsmöglichkeiten in einer dritten, Straßenzustand nirgendwo, das meiste davon geschlossen, nichts davon verknüpft. Radfahrer bezahlen für ein Dutzend Tools und sehen trotzdem nicht das große Bild. Das meiste Wissen existiert; es ist nur verstreut und/oder eingesperrt.'
  problem_lead2: 'The Commons bündelt das nicht-persönliche Wissen, die Karte, niemals der Fahrer, an einem offenen Ort. Frei abfragbar, frei exportierbar, frei bebaubar, für alle.'
  believe_kicker: 'Was wir glauben'
  believe_princ1_num: 'II'
  believe_princ1_title: 'Die Karte, nicht der Fahrer.'
  believe_princ1_body: 'Offene Fakten über Orte, nicht über Menschen, The Commons sammelt nichts darüber, wie, wo oder wann du fährst.'
  believe_princ2_num: 'III'
  believe_princ2_title: 'Offen für alle.'
  believe_princ2_body: 'ODbL-Daten, CC BY-SA 4.0-Medien, eine kostenlose API, nutzbar von jedem, kommerziell oder nicht.'
  believe_princ3_num: 'I'
  believe_princ3_title: 'Kuratierung statt Überflutung.'
  believe_princ3_body: 'Das Beste einer Region, von Fahrern gewählt, kein endloser Datenberg.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Verwaltet, nicht nur veröffentlicht.'
  believe_princ4_body: 'Aufgebaut auf Elinor Ostroms Prinzipien für Commons, die weder kollabieren noch vereinnahmt werden.'
  believe_ostrom: 'zeigte, dass Gemeinschaften eine gemeinsame Ressource verwalten können, ohne sie zu privatisieren und ohne zentralen Eigentümer. Den Wirtschaftsnobelpreis 2009 teilte sie sich mit Oliver E. Williamson, ihre Hälfte für ihre Analyse der Allmende. Die'
  believe_ostrom_link: 'Governance-Seite'
  believe_ostrom_suffix: 'ordnet jedes Prinzip einem Teil des Systems zu.'
  made_kicker: 'So entsteht es'
  made_title: 'Fünf Arten von Menschen, ein Kreislauf.'
  made_ride: '<b>Radfahrer</b> finden Wasser, Reparaturstationen, Anstiege und Schlafplätze auf einer Karte und prüfen eine Route, bevor sie losfahren.'
  made_add: '<b>Beitragende</b> tragen ein, was sie finden. Ein Kurator prüft es, bevor es auf die Karte kommt.'
  made_curate: '<b>Kuratoren</b> kümmern sich um eine Region, die sie kennen.'
  made_extend: '<b>Macher</b> lassen die Plattform wachsen: Code, Datenpipelines, Design, Übersetzungen, Finanzierung.'
  made_build: '<b>Bauende</b> nehmen die offenen Daten in ihre eigenen Apps, und es kommt zurück zu den Radfahrern.'
  partners_kicker: 'Partner, keine Silos'
  partners_title: 'Wo gute offene Daten existieren, schließen wir uns an.'
  partners_lead1_pre: 'The Commons ist nicht dazu da, neu aufzubauen, was andere bereits geöffnet haben. Wir bauen auf'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'auf und tragen dazu bei. Und für die Ebenen, die wir nicht besitzen, wie fahrradfreundliche Übernachtungsmöglichkeiten, möchten wir lieber'
  partners_lead1_partner: 'arbeiten wir lieber mit offenen Communities zusammen'
  partners_lead1_post: ', etwa offene Gastfreundschaftsnetzwerke, als eine private Kopie ihrer Daten einzusperren.'
  partners_lead2: 'Offene Daten sollten verbinden, nicht weiter fragmentieren. Jede Partnerschaft macht den gesamten Atlas reicher, ohne ihn einzuschränken.'
  steward_kicker: 'Wer ihn betreut'
  steward_title: 'Heute BikeCoders, morgen eine Stiftung.'
  steward_lead: 'BikeCoders gründet und betreut The Commons heute. Aber die Zusage ist von Anfang an öffentlich: offene Lizenz, getrennte Daten und Konten, und ein Weg zur Ausgliederung in eine unabhängige Stiftung, sobald es eine Community gibt, die sie verwaltet. Die offene Lizenz und die getrennte Eigentümerschaft machen eine spätere Einschränkung schwer, still durchzuführen.'
  steward_cta_map: 'Karte erkunden →'
  steward_cta_account: 'Kostenloses Konto erstellen'
privacy:
  kicker: 'Datenschutz'
  title: 'Was wir erheben, und warum.'
  lead: 'Klare Sprache. Der Cycling-Commons-Datensatz ist nicht-personenbezogen — offene Geodaten über Orte, niemals über Menschen. Das <b>Plattformkonto</b> ist eine andere Sache: es enthält personenbezogene Daten (E-Mail, Zugangsdaten, Sitzungsprotokolle). Hier ist, was wir vorhalten, warum und welche Kontrolle du darüber hast.'
  last_updated: 'Zuletzt aktualisiert 27. August 2026'
  h_responsible: 'Wer verantwortlich ist'
  responsible_p1_pre: 'Der Verantwortliche ist'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', mit Sitz in den Niederlanden, das Cycling Commons heute betreut. Wie in unserer'
  responsible_p1_governance: 'Governance'
  responsible_p1_post: 'dargelegt, ist The Commons verpflichtet, in eine unabhängige niederländische Stiftung auszugliedern; der Verantwortliche überträgt entsprechend, und diese Seite wird aktualisiert.'
  responsible_p2_pre: 'Fragen zu deinen Daten:'
  responsible_p2_mid: '. Du hast auch das Recht, eine Beschwerde bei der niederländischen Aufsichtsbehörde einzureichen, der'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'Wir haben <b>keine Datenschutzbeauftragte und keinen Datenschutzbeauftragten bestellt</b>, und das Gesetz verlangt es von uns auch nicht: wir sind ein kleiner Betrieb, wir überwachen niemanden in großem Umfang, und besondere Kategorien personenbezogener Daten gehören nicht zu unserer Tätigkeit (DSGVO Art. 37). Fragen und Anträge zum Datenschutz gehen an dieselbe Adresse wie alles andere,'
  dpo_post: ', und ein Mensch liest sie. Sollte sich das ändern und wir doch jemanden bestellen, wird diese Seite den Namen nennen.'
  h_collect: 'Was wir erheben'
  collect_intro: 'Wir fragen nur das Minimum ab, das nötig ist, um eine offene, rechenschaftspflichtige Karte zu betreiben. Wir fragen nie nach deinem echten Namen.'
  h3_account: 'Wenn du ein Konto erstellst'
  collect_account_email: 'Deine <b>E-Mail-Adresse</b> — um dich anzumelden, das Konto zu sichern und wichtige Servicenachrichten zu senden.'
  collect_account_password: 'Ein <b>Passwort</b>, das wir nur als gesalzenen Hash speichern — wir sehen oder behalten den Klartext nie.'
  collect_account_displayname: 'Einen <b>Anzeigenamen</b>, den du selbst wählst. Er darf ein Pseudonym sein, und wir fragen nie nach deinem echten Namen. Dein Profil ist <b>standardmäßig aus</b>: solange es aus ist, trägt das, was du beiträgst, gar keinen Namen. Schaltest du es ein, werden dein Anzeigename, dein Land, der Monat deines Beitritts und die Anzahl deiner Beiträge öffentlich.'
  collect_account_2fa: 'Wenn du die <b>Zwei-Faktor-Authentifizierung (2FA)</b> aktivierst, speichern wir das TOTP-Geheimnis <b>verschlüsselt im Ruhezustand</b>, und deine Backup-Codes nur als Hashes.'
  collect_account_base: 'Ein optionaler <b>Standort</b> — ein Punkt auf Ortsebene (~1 km Genauigkeit) und ein Fahrradius, falls du einen festlegst. Wird nur verwendet, um deine eigene Kartenansicht einzugrenzen; wird nie anderen Fahrer:innen gezeigt und ist nie Teil des Commons-Datensatzes.'
  h3_contribute: 'Wenn du beiträgst'
  collect_contribute_items: '<b>Alles, was du in The Commons schreibst.</b> Ein Ort, ein Anstieg, eine Route, eine Korrektur, eine Stimme, eine Prüfung vor Ort, eine Regionsbeschreibung, eine Übersetzung, eine Meldung, eine Nachricht an eine Kuratorin oder einen Kurator: wenn du es getippt und abgeschickt hast, haben wir es. Zu jedem halten wir fest, dass ein Konto es gemacht hat; das macht ein Zurückschreiben möglich und zeigt anderen, dass die Karte von Menschen gepflegt wird. Solange dein Profil aus ist, trägt nichts davon deinen Namen.'
  collect_contribute_media: 'Die <b>Fotos</b>, die du hochlädst. Ein Foto kann verborgene Daten enthalten (EXIF), etwa den Aufnahmeort: die entfernen wir und kodieren die Datei neu, was wir veröffentlichen trägt also nichts davon. Danach schreiben wir eine Sache zurück: einen Vermerk, dass das Bild unter CC BY-SA 4.0 steht, und einen Link auf seine Seite hier. <b>Dein Name kommt nie in die Datei.</b> Über diesen Link findet jemand, der das Foto weiterverwendet, wen er nennen muss, und diese Seite nennt dich nur, solange dein Profil öffentlich ist.'
  collect_contribute_profile: 'Optionale öffentliche Profilangaben, die du ausfüllst (Bio, Links, welche Beiträge gezeigt werden sollen). Profile sind'
  collect_contribute_profile_link: 'opt-in'
  collect_contribute_profile_post: ' und standardmäßig deaktiviert.'
  h3_auto: 'Automatisch, wenn du die Seite nutzt'
  collect_auto_technical: '<b>Technische Daten</b> — IP-Adresse, Browsertyp und Zeitstempel in unseren Serverprotokollen, aufbewahrt zum Betrieb und zur Absicherung des Dienstes.'
  collect_auto_ratelimit: "<b>Limitzähler</b> — wenn Sie ein Werkzeug ohne Konto nutzen, etwa die Tourenprüfung, zählen wir Ihre Nutzung über einen gesalzenen Einweg-Hash Ihrer IP-Adresse statt über die Adresse selbst. So gilt ein faires Tageslimit, ohne dass wir festhalten, wer zu Besuch war. Hashen ist keine Anonymisierung: der Zähler bleibt personenbezogenes Datum, und alles auf dieser Seite gilt dafür."
  banner_bold: 'Kein Tourentracking.'
  banner_body: 'The Commons ist eine Karte von Orten, nicht von Menschen. Wir erheben <b>keine</b> GPS-Spuren, deine Routen, deinen aktuellen Standort oder irgendwelche Aufzeichnungen darüber, wo du fährst.'
  h_why: 'Warum wir es verwenden (Rechtsgrundlagen)'
  why_contract: '<b>Zur Bereitstellung deines Kontos und des Dienstes</b>: Erfüllung eines Vertrages (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">DSGVO Art. 6 Abs. 1 lit. b</a>).'
  why_consent: '<b>Deinen Namen zeigen.</b> Ein öffentliches Profil, und namentlich genannt zu werden für das, was du beigetragen hast, beruht auf deiner Einwilligung (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">DSGVO Art. 6 Abs. 1 lit. a</a>). Du kannst sie jederzeit widerrufen in deinen'
  why_consent_link: 'Einstellungen'
  why_consent_post: ', dann verschwindet dein Name von diesen Seiten. Bei uns geschieht das sofort. Eine Kartendatei, die der Browser einer anderen Person schon geladen hat, kann bis zu eine Stunde alt sein, und eine selbst gespeicherte Kopie einer Seite liegt ganz außerhalb unserer Reichweite.'
  why_licence: '<b>Veröffentlichen, was du beiträgst.</b> Ein Foto oder eine Bearbeitung, die du The Commons gibst, wird unter der Lizenz veröffentlicht, der du beim Absenden zugestimmt hast, und das gehört zu unserer Vereinbarung mit dir (Art. 6 Abs. 1 lit. b). Diese Lizenz ist nach ihren eigenen Bedingungen <b>unwiderruflich</b>: eine widerrufene Einwilligung nimmt deinen Namen von der Seite, macht den Beitrag selbst aber nicht rückgängig. Eine Ausnahme zählt: zeigt das Foto <b>dich</b>, sind das deine personenbezogenen Daten, und eine Urheberrechtslizenz unterschreibt deine Datenschutzrechte nicht weg. Jede Fotoseite hat einen Link, um die Entfernung zu beantragen.'
  why_updates: '<b>Dir sagen, wenn eine Version erscheint.</b> Nur wenn du darum gebeten hast: der Schalter in deinen Einstellungen ist deine Einwilligung (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">DSGVO Art. 6 Abs. 1 lit. a</a>), und ihn auszuschalten widerruft sie. Jede Nachricht trägt außerdem eine Abmeldung mit einem Klick, für die du dich nicht anmelden musst. Nur Release-Notizen, nie Werbung, und die Liste wird nie weitergegeben oder verkauft.'
  why_legitimate: '<b>Sicherheit, Missbrauchsverhinderung und aggregierte Analysen</b>: unsere berechtigten Interessen daran, The Commons ehrlich und funktionsfähig zu halten (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">Art. 6 Abs. 1 lit. f</a>).'
  why_legal: '<b>Erfüllung gesetzlicher Pflichten</b>: wo das Gesetz es verlangt (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">Art. 6 Abs. 1 lit. c</a>).'
  h_cookies: 'Cookies & Analysen'
  cookies_body: 'Wir halten das simpel. Wir setzen <b>zwei Cookies</b>, beide unbedingt erforderlich und beide unten vollständig aufgeführt. Für Nutzungsstatistiken betreiben wir <b>selbst gehostete Analytics</b> auf unserem eigenen Server unter <b>analytics.bikecoders.life</b>: Sie erhalten die Seiten-URL, den Referrer, die Bildschirmgröße und den Browsertyp, und sie erhalten deine <b>IP-Adresse</b>, die personenbezogen ist, <b>speichern sie aber nicht</b>. Die Adresse dient nur dazu, einen ungefähren Ort zu bestimmen (Land, Region und Stadt) und daraus eine Einweg-Sitzungskennung abzuleiten, und wird danach verworfen. Es werden keine Analytics-Cookies gesetzt, kein Besucher erhält eine dauerhafte Kennung oder wird mit einem Konto verknüpft, und es gibt kein Cross-Site- oder Cross-Device-Tracking. Die Analysedaten bleiben auf unserer eigenen Infrastruktur und werden niemals an Dritte weitergegeben oder verkauft.'
  h3_cookie_table: 'Die Cookies, die wir setzen'
  ck_h_name: 'Name'
  ck_h_purpose: 'Wofür es da ist'
  ck_h_life: 'Wie lange es bleibt'
  ck_session_purpose: 'Hält dich angemeldet und trägt das Token, das jedes Formular der Seite gegen Cross-Site Request Forgery (CSRF) schützt, einen Angriff, bei dem eine fremde Website deinen Browser dazu bringt, hier ein Formular in deinem Namen abzuschicken. Es wird gesetzt, wenn du dich anmeldest, und auf den wenigen Seiten mit einem Formular, das wir uns für dich merken müssen, etwa der Kontaktseite. Wer nur die Karte und den Rest der Seite liest, bekommt gar kein Cookie. Darin steht eine zufällige Kennung und sonst nichts: kein Name, keine E-Mail-Adresse, keine Aufzeichnung dessen, was du angesehen hast.'
  ck_session_life: 'Bis du den Browser schließt'
  ck_remember_purpose: 'Meldet dich beim nächsten Besuch wieder an, ohne nach deinem Passwort zu fragen. Wird <b>nur</b> gesetzt, wenn du beim Anmelden <b>Angemeldet bleiben</b> ankreuzt, und verschwindet beim Abmelden.'
  ck_remember_life: '7 Tage'
  cookies_none_body: 'Das ist die ganze Liste. Wir setzen <b>kein</b> Werbe-Cookie, <b>kein</b> Analyse-Cookie und <b>kein</b> Cross-Site-Tracking-Cookie, auf keiner Seite. Beide Cookies oben sind unbedingt erforderlich, um etwas zu liefern, worum du selbst gebeten hast, deshalb verlangt das Gesetz dafür keine Einwilligung, und darum gibt es hier kein Cookie-Banner. Sollten wir je etwas hinzufügen, das eines braucht, fragen wir dich vorher, statt es anzunehmen.'
  cookies_local_body: 'Die Karte merkt sich außerdem ein paar deiner eigenen Einstellungen im <b>lokalen Speicher</b> deines Browsers: das helle oder dunkle Kartenthema, den zuletzt betrachteten Ausschnitt und die aktiven Filter. Das ist kein Cookie, es wird nie an unseren Server geschickt, und es verschwindet, wenn du deine Browserdaten löschst. <b>Keine andere Website kann es lesen.</b> Ein Browser hält den lokalen Speicher jeder Seite streng getrennt, was hier liegt, kann also nur diese Seite lesen.'
  h_share: 'Mit wem wir es teilen'
  share_infra: '<b>Die Unternehmen, die unsere Infrastruktur betreiben.</b> Hosting, Backups, Konto-E-Mails und die Kartendienste, die dein Browser direkt abruft. Alle sind in den beiden Tabellen unten namentlich genannt, mit dem, was sie tun, und dem, was sie sehen können.'
  share_osm_pre: 'OpenStreetMap — Beiträge, die du zurückgeben möchtest, werden Teil der offenen Karte unter der'
  share_osm_link: 'ODbL'
  share_osm_post: '. Das sind öffentliche, offene Daten, keine personenbezogenen Daten über dich.'
  share_noone: '<b>Niemand sonst.</b> Wir verkaufen keine personenbezogenen Daten und betreiben kein Drittanbieter-Werbetracking.'
  share_selfhosted: 'Zuerst, was <b>nicht</b> in diesen Listen steht. Wir betreiben so viel wie möglich selbst: die Kartendaten, die Routenplanung, das Höhenmodell hinter den Steigungen, den Fotospeicher und sogar die Nutzungsstatistik laufen auf unseren eigenen Maschinen. Zwei Dienste, die wir früher von außen geholt haben, für Routen und für Höhen, sind 2026 genau deswegen zu uns gewandert. So zu bauen dauert länger und kostet mehr. Es ist auch der Grund, warum dein Browser mit fünf fremden Diensten spricht statt mit zwanzig, und warum die Tabellen unten so kurz sind: jeder Name darin ist einer, den wir nicht vernünftig selbst betreiben konnten.'
  h3_processors: 'Die Unternehmen, die Daten für uns verarbeiten'
  processors_intro: 'Drei Unternehmen halten oder verarbeiten deine Daten in unserem Auftrag. Sie sind unsere <b>Auftragsverarbeiter</b>: sie dürfen nur tun, was wir ihnen vorgeben, auf Grundlage eines schriftlichen Vertrags, und sie dürfen deine Daten für nichts Eigenes verwenden.'
  pr_h_who: 'Wer'
  pr_h_where: 'Wo'
  pr_h_what: 'Was sie für uns tun'
  pr_h_sees: 'Was sie sehen können'
  pr_hetzner_where: 'Falkenstein, Deutschland (EWR)'
  pr_hetzner_what: 'Betreibt die Maschinen: die Website, die Datenbank und den Speicher für hochgeladene Fotos.'
  pr_hetzner_sees: 'Im Prinzip alles, was wir speichern, denn es liegt auf ihrer Hardware: deine E-Mail-Adresse, deine Beiträge, deine Fotos und die Serverprotokolle. Passwörter und Zwei-Faktor-Geheimnisse sind auch dort unlesbar (siehe <b>Wie wir es schützen</b>).'
  pr_scaleway_where: 'Europäischer Wirtschaftsraum'
  pr_scaleway_what: 'Stellt die E-Mails zu, die die Seite selbst verschickt (Adressbestätigung, Passwort-Zurücksetzung, Löschcode, Moderationsnachrichten), und bewahrt die nächtlichen Backups auf.'
  pr_scaleway_sees: 'Deine E-Mail-Adresse und den Inhalt der Nachrichten, die die Seite dir schickt. Die Backups werden auf unseren eigenen Servern verschlüsselt, bevor sie das Haus verlassen, ihr Inhalt ist am anderen Ende also nicht lesbar.'
  pr_proton_where: 'Schweiz (durch einen EU-Angemessenheitsbeschluss gedeckt)'
  pr_proton_what: 'Beherbergt das Postfach des Projekts, die Adresse auf dieser Seite, und die Antworten, die ein Mensch hier zurückschreibt.'
  pr_proton_sees: 'Deine E-Mail-Adresse und alles, was du uns geschrieben hast, solange das Gespräch aufbewahrt wird.'
  h3_browser_services: 'Dienste, die dein Browser direkt kontaktiert'
  browser_services_intro: 'Die Karte wird in deinem Browser zusammengesetzt, ein paar Teile kommen deshalb direkt von denen, die sie veröffentlichen, und nicht über uns. Wir geben ihnen nie dein Konto, deinen Anzeigenamen oder deine E-Mail-Adresse. Sie sehen aber die Netzwerkadresse, von der deine Anfrage kommt, denn jede Anfrage im Internet trägt eine. Nichts aus dieser Liste lädt, bevor du eine Seite öffnest, die es benutzt.'
  bs_h_service: 'Dienst'
  bs_h_what: 'Wofür er da ist'
  bs_h_sees: 'Was er erhält'
  bs_sees_ip: 'Deine IP-Adresse und welche Kartenkacheln du angefordert hast.'
  bs_openfreemap_what: 'Die Grundkarte: die Straßen, die Gewässer und die Ortsnamen unter allem anderen.'
  bs_esri_what: 'Die Satellitenansicht, erst wenn du sie einschaltest.'
  bs_esri_sees: 'Deine IP-Adresse und welche Bildkacheln du angefordert hast. Esri sitzt in den Vereinigten Staaten.'
  bs_mapillary_what: 'Straßenbilder, erst wenn du die Straßenansicht öffnest.'
  bs_mapillary_sees: 'Deine IP-Adresse und welche Fotos du geöffnet hast. Mapillary wird von Meta Platforms Ireland Limited in Irland betrieben, und die Bilddateien selbst kommen aus Metas Content-Netzwerk, das weltweit ist.'
  bs_photon_what: 'Ortssuche, während du ins Suchfeld tippst.'
  bs_photon_sees: 'Deine IP-Adresse und die Wörter, die du ins Suchfeld tippst. Photon wird von komoot in Deutschland betrieben.'
  bs_wikimedia_what: 'Referenzfotos einiger Anstiege und Orte, wenn das Bild von Wikimedia Commons stammt.'
  bs_wikimedia_sees: 'Deine IP-Adresse und welches Foto die Seite gezeigt hat. Die Wikimedia Foundation sitzt in den Vereinigten Staaten.'
  browser_services_post: 'Zwei davon liegen außerhalb des Europäischen Wirtschaftsraums (EWR): <b>Esri</b> und die <b>Wikimedia Foundation</b>, beide in den Vereinigten Staaten. Öffnest du die Satellitenebene nie und siehst du nie eine Seite mit einem Commons-Foto, nimmt dein Browser auch nie Kontakt zu ihnen auf. Siehe <b>Internationale Übermittlungen</b> unten.'
  h_transfers: 'Internationale Übermittlungen'
  transfers_body: 'Einige Infrastrukturanbieter können Daten außerhalb des Europäischen Wirtschaftsraums verarbeiten. Wo dies der Fall ist, stützen wir uns auf geeignete Schutzmaßnahmen — wie die Standardvertragsklauseln der Europäischen Kommission oder einen Angemessenheitsbeschluss.'
  h_retention: 'Wie lange wir es aufbewahren'
  retention_account: '<b>Kontodaten.</b> Bis du dein Konto löschst, dann sind sie weg. Die Löschung erfolgt sofort: du forderst sie an, wir mailen dir einen Code, du bestätigst, und in diesem Moment verschwindet das Konto aus der laufenden Datenbank. Die E-Mail-Adresse, der Passwort-Hash, das Zwei-Faktor-Geheimnis und die Backup-Codes gehen mit. Es gibt keine Wartezeit, und es wird nichts für den Fall zurückgehalten, dass du es dir anders überlegst. Zwei Dinge gehören ehrlich dazu. Unsere nächtlichen Backups enthalten den alten Datensatz noch, bis sie ausrotieren, und das dauert <b>höchstens 90 Tage</b>; diese Backups sind verschlüsselt und werden nur zur Wiederherstellung nach einem Ausfall geöffnet. Und wir löschen ein Konto <b>nicht</b> allein deshalb, weil sich jahrelang niemand angemeldet hat. Sollten wir damit je anfangen, schreiben wir dich vorher an und geben dir Zeit, es zu behalten.'
  retention_logs: '<b>Serverprotokolle.</b> <b>30 Tage</b> aufbewahrt und danach automatisch gelöscht. Sie enthalten IP-Adressen: Ein Webserver schreibt die Adresse der Besucherin oder des Besuchers in seine Fehlereinträge und bietet keine Einstellung, die das verhindert. Die Frist ist also die eigentliche Grenze, nicht ein Versprechen über den Inhalt.'
  retention_ratelimit: "<b>Limitzähler.</b> Ein Tag."
  retention_contributions: '<b>Beiträge.</b> Fakten, die du zur offenen Karte beisteuert, bleiben als Teil von The Commons erhalten (mit Provenienz), auch nachdem du gehst; sie sind keine personenbezogenen Daten über dich.'
  retention_consent: '<b>Lizenz-Einwilligungen.</b> Wenn du ein Foto an The Commons lizenzierst, halten wir fest, dass du zugestimmt hast, welchem Wortlaut genau, und wann. Wir bewahren diesen Nachweis unbefristet auf, und er überdauert die Schließung deines Kontos: Er ist unser Beleg dafür, dass die Lizenz erteilt wurde, den wir zur Geltendmachung oder Verteidigung von Rechtsansprüchen benötigen könnten (Art. 17(3)(e)). Er enthält einen Kontoverweis und sonst nichts über dich, und sobald das Konto weg ist, identifiziert dieser Verweis hier niemanden mehr.'
  retention_mail: '<b>E-Mail, die du uns schickst.</b> Wir bewahren ein Gespräch auf, solange die Sache läuft, und löschen es innerhalb von <b>24 Monaten</b> nach ihrem Abschluss. Das deckt dich ab, wenn du ein Jahr später darauf zurückkommst, und uns, wenn spät eine Beschwerde über unseren Umgang damit eintrifft. Gespräche, die zu einer rechtlichen Sache gehören, etwa einer Urheberrechtsbeschwerde oder einem Löschverlangen, bewahren wir auf, bis diese Sache erledigt ist.'
  retention_updates: '<b>Die Release-Liste.</b> Deine Adresse bleibt darauf, bis du sie herunternimmst, in den Einstellungen oder über den Link in jeder Nachricht. Den Nachweis, dass du zugestimmt hast und welchem Wortlaut, bewahren wir wie eine Foto-Lizenzeinwilligung auf: er belegt, dass wir dir schreiben durften.'
  h_security: 'Wie wir es schützen'
  security_intro: 'Das Gesetz verlangt Maßnahmen, die zum Risiko passen (Art. 32). In einfachen Worten:'
  security_passwords: '<b>Dein Passwort wird nie gespeichert.</b> Wir behalten davon nur eine nicht umkehrbare Verschlüsselung, niemand hier kann dein Passwort lesen, und eine gestohlene Datenbank gibt auch niemandem deines in die Hand.'
  security_secrets: '<b>Zwei-Faktor-Geheimnisse und Backup-Codes sind dort verschlüsselt, wo sie liegen</b>, mit dem Schlüssel außerhalb der Datenbank. Wer nur die Datenbank stiehlt, bekommt daraus trotzdem keinen funktionierenden Code.'
  security_transport: '<b>Alles läuft verschlüsselt</b>, zwischen dir und uns und noch einmal, wenn ein Backup unsere Server verlässt. Browsern wird gesagt, eine unverschlüsselte Verbindung zu uns überhaupt abzulehnen.'
  security_access: '<b>Nur wer deine Daten braucht, kommt an sie heran</b>, und jede Moderations- und Verwaltungsanmeldung braucht zwei Faktoren. Wiederholte Fehlanmeldungen werden gebremst und dann gesperrt.'
  security_source_pre: 'Das ist die kurze Fassung. Die genauen Maßnahmen, und die Begründung für jede einzelne, stehen in unserem'
  security_source_link: 'öffentlichen Quellcode'
  security_source_post: '. Genau dafür bauen wir es offen: du musst einen Sicherheitsabsatz nicht auf Treu und Glauben hinnehmen.'
  security_honest: 'Kein System ist perfekt, und wir tun nicht so, als wäre unseres es. Hinter diesem Absatz steht keine Zertifizierung und kein Penetrationstest: was es gibt, ist ein kleines System, das so wenig wie möglich aufbewahrt, und Code, den jeder nachlesen kann.'
  h_breach: 'Wenn doch einmal Daten abfließen'
  breach_pre: 'Wenn personenbezogene Daten verloren gehen, offenliegen oder von jemandem erreicht werden, der sie nicht haben sollte, und das voraussichtlich ein Risiko für die Rechte von Menschen bedeutet, melden wir es der'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>innerhalb von 72 Stunden</b>, nachdem wir davon erfahren (Art. 33). Ist das Risiko für dich persönlich hoch, wenden wir uns außerdem direkt und unverzüglich an dich (Art. 34), in klarer Sprache: was passiert ist, welche deiner Daten betroffen waren, was wir dagegen getan haben und was du tun solltest. Wir führen intern ein Verzeichnis jeder Verletzung, auch der nicht meldepflichtigen, damit das Muster für uns sichtbar bleibt, selbst wenn kein einzelner Fall für sich meldepflichtig ist.'
  h_rights: 'Deine Rechte'
  rights_intro: 'Nach der <a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">DSGVO</a> hast du folgende Rechte:'
  rights_access: '<b>Auskunft (Art. 15)</b> — fordere eine Kopie der personenbezogenen Daten an, die wir über dich vorhalten.'
  rights_correct: '<b>Berichtigung (Art. 16)</b> — korrigiere Unrichtiges oder vervollständige Fehlendes.'
  rights_erase: '<b>Löschung (Art. 17)</b> — lösche dein Konto jederzeit in deinen Kontoeinstellungen. Deine personenbezogenen Daten gehen mit und kommen nicht zurück. Zwei Dinge bleiben bewusst bestehen, und keines davon identifiziert dich danach: die Beiträge, die du zur offenen Karte gegeben hast, und der Nachweis, dass du eine Fotolizenz erteilt hast. Beide sind oben unter <b>Wie lange wir es aufbewahren</b> beschrieben.'
  rights_portability: '<b>Datenübertragbarkeit (Art. 20)</b> — lade alles, was wir über dich gespeichert haben, jederzeit als eine einzige ZIP-Datei in deinen Kontoeinstellungen herunter. Sie enthält deine Kontodaten, deine Beiträge, deine Nachrichten, deine Lizenz-Einwilligungen und deine Fotos als Dateien.'
  rights_restrict: '<b>Einschränkung und Widerspruch (Art. 18–21)</b> — schränke bestimmte Verarbeitungen ein oder widerspreche ihnen.'
  rights_withdraw: '<b>Einwilligung widerrufen</b> jederzeit (z. B. durch Deaktivierung deines öffentlichen Profils) — dies hat keinen Einfluss auf bereits erfolgte Verarbeitungen.'
  rights_third_party_photo: '<b>Kein Konto?</b> Diese Rechte hängen nicht an einem Konto. Bist du auf einem Foto auf unserer Karte erkennbar, trägt jede Fotoseite den Link <b>"dieses Foto zeigt mich"</b>. Melde es dort, ohne Konto und ohne Ausweis, und eine Kuratorin oder ein Kurator antwortet spätestens innerhalb eines Monats.'
  rights_contact_pre: 'Um eines dieser Rechte wahrzunehmen, schreib'
  rights_contact_mid: '. Wir antworten <b>spätestens innerhalb eines Monats</b>, meist deutlich früher. Das Gesetz erlaubt bis zu drei Monate für eine wirklich komplizierte Anfrage, aber nur, wenn wir dir innerhalb des ersten Monats sagen, dass es länger dauert, und warum. Bist du mit unserer Antwort nicht zufrieden, kannst du dich beschweren bei der'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: 'beschweren.'
  h_children: 'Kinder'
  children_body: 'The Commons ist nicht für Kinder unter <b>16</b> Jahren gedacht. Wir erheben wissentlich keine personenbezogenen Daten von Personen unter diesem Alter; wenn du glaubst, dass ein Kind uns Daten übermittelt hat, kontaktiere uns und wir löschen sie.'
  h_automated: 'Automatisierte Entscheidungen'
  automated_body: 'Wir treffen keine Entscheidungen über dich ausschließlich auf automatisiertem Wege und erstellen keine Profile von dir für Werbezwecke.'
  h_changes: 'Änderungen dieser Richtlinie'
  changes_body: 'Wenn wir ändern, wie wir mit Daten umgehen, aktualisieren wir diese Seite und ihr Datum und — bei wesentlichen Änderungen — informieren wir angemeldete Beitragende.'
  changes_versions_pre: 'Du kannst das auch selbst nachsehen, statt uns aufs Wort zu glauben. Die Plattform ist quelloffen einsehbar, diese Seite und ihr Wortlaut liegen also in einem öffentlichen Repository, und jede Änderung daran ist mit Datum und Begründung festgehalten, in der'
  changes_versions_link: 'Seitenhistorie'
  changes_versions_post: '.'
  footer_disc_pre: 'Siehe auch unsere'
  footer_disc_terms: 'Nutzungsbedingungen'
  footer_disc_mid: 'und die Daten-, Medien- und Code-'
  footer_disc_licences: 'Lizenzen'
  footer_disc_post: '.'
terms:
  kicker: 'Nutzungsbedingungen'
  title: 'Die Vereinbarung, in klarer Sprache.'
  lead: 'Diese Bedingungen regeln die Nutzung der Cycling-Commons-Website und des Kontos, in klarer Sprache.'
  last_updated: 'Zuletzt aktualisiert 1. August 2026'
  h1_accepting: 'Akzeptieren dieser Bedingungen'
  accepting_p1_pre: 'Durch die Nutzung der Cycling-Commons-Website oder die Erstellung eines Kontos stimmst du diesen Bedingungen und unserem'
  accepting_p1_privacy: 'Datenschutzhinweis'
  accepting_p1_mid: 'zu. Wenn du nicht zustimmst, nutze den Dienst bitte nicht. The Commons wird betrieben von'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' in den Niederlanden, auf dem Weg zu einer unabhängigen Stiftung wie in unserer'
  accepting_p1_governance: 'Governance'
  accepting_p1_post: 'beschrieben.'
  h2_who: 'Wer es nutzen kann'
  who_body: 'Du musst mindestens <b>16</b> Jahre alt sein, um ein Konto zu erstellen. Die Angaben, die du uns machst (wie deine E-Mail), müssen korrekt und zur Nutzung berechtigt sein.'
  h3_account: 'Dein Konto'
  account_password: 'Halte dein Passwort sicher; du bist für die Aktivitäten unter deinem Konto verantwortlich.'
  account_unauthorised: 'Teile uns umgehend mit, wenn du unbefugten Zugriff vermutest.'
  account_suspend: 'Wir können Konten sperren oder schließen, die für Missbrauch oder Verstöße gegen diese Bedingungen verwendet werden.'
  h4_using: 'Richtige Nutzung'
  using_intro: 'The Commons funktioniert, weil Menschen ihn in gutem Glauben nutzen.'
  using_no_illegal: 'Brich keine Gesetze, belästige niemanden und veröffentliche keine rechtswidrigen, irreführenden oder schädlichen Inhalte.'
  using_no_personal: 'Lade keine <b>personenbezogenen Daten anderer Menschen</b> hoch (zum Beispiel identifizierbare Personen auf Fotos) ohne angemessene Grundlage — The Commons kartiert Orte, nicht Menschen.'
  using_no_reidentify_pre: 'Versuche nicht, Beitragende zu re-identifizieren, und untergrabe nicht die'
  using_no_reidentify_link: 'Datenschutzgrenze'
  using_no_reidentify_post: 'des Projekts zu untergraben, die personenbezogene Daten fernhält.'
  using_no_scrape_pre: 'Scrape den Dienst nicht. Punkt — die'
  using_no_scrape_link: 'API und der Bulk-Export'
  using_no_scrape_post: ' sind der Weg zu den Daten. Beides ist noch nicht live; schreib bis dahin an info@cyclingcommons.org und wir geben dir, was du brauchst.'
  using_no_disrupt: 'Störe den Dienst nicht und umgehe seine Grenzen nicht.'
  h5_contributions: 'Deine Beiträge'
  contributions_p1_pre: 'Du behältst die Urheberschaft an dem, was du beisteuert. Damit The Commons offen sein kann, erteilst du die Lizenzen in unseren'
  contributions_p1_link: 'Beitragendenkonditionen'
  contributions_p1_mid: ': <b>Daten</b> treten The Commons unter der'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: 'bei, und <b>Medien</b> (Fotos, Video) und '
  contributions_p1_mid3: '<b>UI-Übersetzungen</b> unter'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Du bestätigst, dass du das Recht hast, das Eingereichte beizutragen, dass es keine Rechte anderer verletzt und dass es keine personenbezogenen Daten über andere Menschen enthält.'
  h6_opendata: 'Offene Daten & die API'
  opendata_pre: 'Die Commons-Daten, -Medien und UI-Übersetzungen stehen jedem kostenlos zur Verfügung — auch kommerziell — unter ihren'
  opendata_link: 'Lizenzen'
  opendata_mid: 'mit Namensnennung. Siehe die'
  opendata_dev_link: 'Entwicklerdokumentation'
  opendata_post: ' für die Attributionszeile und für API und Massenexport, so wie sie entworfen werden — beides ist noch nicht live.'
  h7_code: 'Unser Code & unsere Marke'
  code_pre: 'Der Plattformquellcode ist <b>source-available</b> unter der'
  code_link: 'PolyForm Shield License 1.0.0'
  code_post: '— nutze ihn für alles außer dem Betrieb eines Produkts, das mit Cycling Commons konkurriert. Der Name „Cycling Commons" und das Logo sind nicht für Verwendungen lizenziert, die eine Billigung oder Zugehörigkeit implizieren.'
  h8_preview: 'Eine Absicht, keine Garantie'
  preview_body: 'The Cycling Commons ist eine Absicht, <b>keine</b> Garantie. Verlass dich nicht darauf für Routen, Straßenzustand oder deine Sicherheit auf der Straße — nutze beim Fahren immer dein eigenes Urteil.'
  h9_warranty: 'Keine Gewährleistung'
  warranty_body: 'Der Dienst wird <b>„wie besehen"</b> und „wie verfügbar" bereitgestellt, ohne jegliche Garantien, soweit gesetzlich zulässig. Wir garantieren nicht, dass er korrekt, unterbrechungsfrei oder fehlerfrei ist.'
  h10_liability: 'Haftung'
  liability_body: 'Soweit nach niederländischem Recht zulässig, haftet BikeCoders nicht für mittelbare oder Folgeschäden, die aus der Nutzung von The Commons entstehen. Nichts in diesen Bedingungen schränkt die Haftung ein, die nicht gesetzlich eingeschränkt werden kann.'
  h11_suspension: 'Sperrung & Beendigung'
  suspension_pre: 'Du kannst dein Konto jederzeit in den'
  suspension_link: 'Einstellungen'
  suspension_post: 'schließen. Wir können den Zugriff sperren oder beenden, wenn diese Bedingungen verletzt werden oder um The Commons oder seine Nutzer zu schützen.'
  suspension_p2: 'Bevor du gehst, kannst du auf derselben Seite <b>alles herunterladen, was wir über dich gespeichert haben</b> — als eine einzige ZIP-Datei. Das Schließen deines Kontos entfernt deine personenbezogenen Daten. Zwei Dinge bleiben, und keines davon nennt dich danach: die Beiträge, die du zur offenen Karte gegeben hast, und der Nachweis, dass du eine Fotolizenz erteilt hast, den wir als Beleg für das Bestehen der Lizenz aufbewahren. Fotos, die freigegeben wurden, bleiben unter CC BY-SA 4.0 in The Commons, und du entscheidest beim Verlassen, ob sie deinen Namen behalten oder anonym werden.'
  h12_moderation: 'Wie die Moderation arbeitet'
  mod_intro: 'Der Commons besteht aus dem, was Radfahrende beitragen, also muss ein Teil davon geprüft werden. Dieser Abschnitt sagt, was wir entfernen, wer entscheidet, was Ihnen mitgeteilt wird und was Sie dagegen tun können.'
  mod_standard_h: 'Was entfernt wird'
  mod_std1: '<b>Alles Rechtswidrige.</b> Auch Inhalte, die die Rechte anderer verletzen.'
  mod_std2: '<b>Personenbezogene Daten über andere.</b> Der Commons kartiert Orte, keine Menschen. Eine erkennbare Person auf einem Foto, ein Name, ein Kennzeichen, ein als Wohnung einer Person bezeichnetes Haus.'
  mod_std3: '<b>Dinge, die schlicht nicht stimmen.</b> Eine Wasserstelle, die es nie gab, ein Belag, der nicht der Wirklichkeit entspricht, ein erfundener Anstieg, um eine Rangliste zu manipulieren.'
  mod_std4: '<b>Missbrauch.</b> Belästigung, Drohungen, oder Inhalte, die auf eine Person zielen statt auf einen Ort.'
  mod_std5: '<b>Werbung.</b> Der Commons ist kein Branchenverzeichnis, und ein Ort steht nicht darauf, weil jemand gezahlt oder gefragt hat.'
  mod_std6: '<b>Fotos, die keine Fotos sind.</b> Ein Bild, das von KI erzeugt oder wesentlich verändert wurde, so gut es auch aussieht. The Commons ist eine Karte der wirklichen Welt, und ein Bild von einem Ort, der nie so ausgesehen hat, ist schlechter als gar kein Bild.'
  h13_ai: 'Wo Maschinen beteiligt sind'
  ai_intro: 'Kurze Liste, und wir sagen sie dir lieber, als dass du raten musst:'
  ai_translation: '<b>Maschinelle Übersetzung.</b> Manche Ortsbeschreibungen stammen aus der Wikipedia in der Landessprache und werden automatisch ins Englische übersetzt. Jede davon ist an Ort und Stelle als <b>auto-translated</b> gekennzeichnet, denn eine maschinelle Übersetzung eines Passes kann auf eine Weise falsch sein, die sich völlig richtig liest.'
  ai_checks: '<b>Automatische Prüfungen.</b> Software durchsucht den Katalog nach Dingen, die falsch aussehen, zwei Brunnen im Abstand von einem Meter, ein Link, der nicht mehr aufgeht, und legt sie einer Kuratorin vor. Sie markiert; sie entscheidet nie.'
  ai_none: '<b>Sonst nichts.</b> Kein Chatbot, kein generierter Text, den wir als unseren ausgeben, keine automatisierte Entscheidung über dich oder dein Konto, und kein Profiling. Sollte sich das je ändern, ändert sich zuerst dieser Abschnitt.'
  ai_uploads: '<b>Was du nicht hochladen darfst.</b> Keine von KI erzeugten Bilder und keine veränderten Szenen. Normales Bearbeiten ist in Ordnung, mit KI-Werkzeugen oder ohne: zuschneiden, gerade rücken, Farben abstimmen, schärfen, entrauschen. Etwas zu erfinden oder wegzunehmen, was da war, ist es nicht, und ein Bild, das ein Modell gemacht hat, auch nicht. Die eine Änderung, um die wir bitten: Gesichter und Kennzeichen vor dem Hochladen unkenntlich machen. Die Einwilligung, die du vor dem Hochladen setzt, sagt das, und es ist ein Grund für die Entfernung.'
  ai_stance: 'Wir behaupten damit keine Konformität mit irgendetwas. Die Transparenzregeln der EU-KI-Verordnung gelten ab dem <b>2. August 2026</b>, und es ist strittig, wie weit sie bis zur Beschreibung eines Wasserhahns reichen. Wir würden es dir so oder so sagen, denn eine Karte taugt nur etwas, wenn du erkennen kannst, was ein Mensch darauf gesetzt hat.'
  mod_who_h: 'Wer entscheidet'
  mod_who: 'Eine <b>Kuratorin</b> oder ein <b>Kurator</b> entscheidet, und das ist ein Mensch. Kuratorinnen und Kuratoren sind Radfahrende, die sich beworben haben und angenommen wurden, sie arbeiten nach einem schriftlichen Regelwerk, und jede Entscheidung wird mit ihrem Namen festgehalten.'
  mod_automated: '<b>Nichts wird allein von Software entfernt.</b> Automatische Prüfungen laufen und markieren Dinge zur Ansicht durch eine Kuratorin oder einen Kurator, aber sie entscheiden nie. Die eine Ausnahme wirkt umgekehrt und schützt Menschen, statt über sie zu urteilen: Eine Meldung über intimes Bildmaterial oder über ein Kind verbirgt das Foto sofort, bevor ein Mensch die Meldung gesehen hat, und anschließend prüft es eine Kuratorin oder ein Kurator.'
  mod_told_h: 'Was Ihnen mitgeteilt wird'
  mod_told_pre: 'Wenn etwas, das Sie beigetragen haben, entfernt oder geändert wird, sagen wir es Ihnen, mit Begründung. Die Nachricht nennt, worum es ging und auf welcher Grundlage entschieden wurde. Sie finden sie in Ihren'
  mod_told_link: 'Nachrichten'
  mod_told_post: '.'
  mod_appeal_h: 'Wenn Sie anderer Meinung sind'
  mod_appeal_pre: 'Antworten Sie auf diese Nachricht, und eine Kuratorin oder ein Kurator liest sie. Wenn Sie das lieber außerhalb des Kontos tun oder keines mehr haben, schreiben Sie uns über die'
  mod_appeal_link: 'Kontaktseite'
  mod_appeal_post: '. Eine Entscheidung ist nicht endgültig, nur weil sie einmal getroffen wurde; wer sich geirrt hat, kann sie zurücknehmen.'
  mod_report_h: 'Etwas melden'
  mod_report_pre: 'Jede und jeder kann Inhalte melden, mit oder ohne Konto. Nutzen Sie die'
  mod_report_link: 'Kontaktseite'
  mod_report_post: ', oder den Meldelink auf dem Foto selbst. Wir bestätigen jede Meldung und sagen Ihnen, was wir entschieden haben. Fotos haben auf jeder Fotoseite ihren eigenen Meldelink.'
  h12_governing: 'Geltendes Recht'
  governing_body: 'Diese Bedingungen unterliegen dem Recht der <b>Niederlande</b>. Streitigkeiten unterliegen den zuständigen niederländischen Gerichten, sofern nicht zwingendes Verbraucherrecht dir andere Rechte einräumt.'
  h13_changes: 'Änderungen'
  changes_body: 'Wir können diese Bedingungen aktualisieren; wir veröffentlichen Änderungen hier mit einem neuen Datum. Die weitere Nutzung von The Commons nach einer Änderung bedeutet, dass du die aktualisierten Bedingungen akzeptierst.'
  h14_contact: 'Kontakt'
  contact_pre: 'Fragen zu diesen Bedingungen:'
  contact_post: '.'
  footer_disc_pre: 'Siehe auch unseren'
  footer_disc_privacy: 'Datenschutzhinweis'
  footer_disc_mid: 'und die Daten-, Medien-, UI-Übersetzungen- und Code-'
  footer_disc_licences: 'Lizenzen'
  footer_disc_post: '.'
licenses:
  kicker: 'Lizenzierung'
  title: 'Die Kurzfassung.'
  lead: 'Klare Sprache, damit du weißt, was du tun kannst. Vier Lizenzen — je eine für die <b>Daten</b>, die <b>Medien</b>, die <b>UI-Übersetzungen</b> und den <b>Code</b>: Daten, Medien und UI-Übersetzungen sind offen, der Code ist source-available.'
  can_h: 'Du kannst'
  must_h: 'Du musst'
  data_h: 'Die Daten'
  data_sub: 'Open Database License 1.0 (ODbL) · Inhalte DbCL 1.0'
  data_tldr: 'Verwende die Daten für alles — auch für kommerzielle Produkte — solange du sie kennzeichnest, verbesserte Datenbanken unter derselben Lizenz zurückgibst und sie offen hältst. Dieselbe Vereinbarung wie OpenStreetMap.'
