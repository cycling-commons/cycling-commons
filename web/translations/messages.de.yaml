admin:
  escalated:
    title: 'Fotos unter rechtlicher Sperre'
    warning_b: 'Mit Sorgfalt behandeln.'
    warning: 'Diese Fotos wurden als mutmaßlich illegale Inhalte eskaliert. Sie sind vor der Öffentlichkeit und vor dem Moderationsplatz verborgen, und nichts in der Anwendung kann sie löschen. Lösche das Material nicht: Wo es meldepflichtig ist, muss die Aufzeichnung bestehen bleiben, bis gemeldet wurde, und die Behörde, der du meldest, entscheidet, wann es gehen darf.'
    lead: 'Eine kuratierende Person hat etwas gesehen, das sie nicht allein entscheiden wollte. Lies, was sie geschrieben hat, bevor du entscheidest, das Bild selbst anzusehen.'
    playbook_link: 'Incident-Playbook öffnen'
    empty: 'Derzeit ist nichts gesperrt.'
    no_item: 'Keinem Ort zugeordnet'
    by: 'Eskaliert von %who% am %when%'
    their_words: 'Was die kuratierende Person schrieb:'
    reveal: 'Foto anzeigen'
    note_label: 'Notiz für die Akte (optional)'
    note_placeholder: 'z. B. den Behörden gemeldet am …, Aktenzeichen …'
    release: 'Sperre aufheben'
    release_help: 'Hebt die Sperre auf und gibt das Foto an die normale Moderation zurück. Es kommt dadurch nicht auf die Karte zurück und es wird nichts gelöscht.'
    released: 'Die Sperre wurde aufgehoben.'
  flood:
    title: 'Playbook: Welle von Fotomeldungen'
    state_open_b: 'Der Schutzschalter für automatisches Zurückhalten ist OFFEN.'
    state_open: 'Anonyme Meldungen verbergen keine Fotos mehr von selbst. Arbeite die Schritte unten ab.'
    state_closed: 'Der Schutzschalter ist geschlossen. Normalbetrieb.'
    lead: 'Der Meldeweg erlaubt jedem zu sagen, dass er auf einem Foto ist — ohne Konto, weil das Recht nicht von einem Konto abhängt. Diese Offenheit ist auch die Schwäche: Ein verteilter Angreifer kann von tausenden Adressen gleichzeitig melden. Diese Seite sagt, was dann zu tun ist.'
    h_what: 'Was bereits automatisch passiert ist'
    what: 'Ein seitenweites Budget begrenzt, wie viele Fotos anonyme Meldungen von selbst verbergen dürfen: %hourly% pro Stunde und %daily% pro Tag. Darüber hinaus treffen dringende Meldungen weiterhin ein und warten auf eine kuratierende Person, verbergen aber nichts mehr; der Moderationsplatz zeigt ein Banner, und die Alarmadresse bekommt stündlich eine E-Mail. Gelöscht oder entfernt wurde nichts: Verborgene Fotos sind weiterhin gespeichert, ihre Beitragenden wurden informiert, dass sie verborgen sind, und nur eine Kuratorenentscheidung entfernt etwas.'
    h_steps: 'Schritte'
    step_verify: 'Sieh dir die wartenden Meldungen an, bevor du etwas tust. Ein echter Notfall und ein Angriff sehen unterschiedlich aus: Echte Meldungen sind selten, konkret über eine Person und zeitlich verteilt.'
    step_restore: 'Stelle in einer Aktion wieder her, was offensichtlich Missbrauch ist — die Beitragenden erfahren, dass ihre Fotos zurück sind. Diese Seite verwirft die Meldungen, statt sie abzulehnen — eine spätere echte Beanstandung zum selben Foto wird also weiterhin gehört.'
    step_zero: 'Hält es an, setze das Stundenbudget auf 0. Anonyme Meldungen verbergen dann nie mehr selbst ein Foto; alles wartet auf eine kuratierende Person. Das ist der Not-Aus und braucht kein Deployment.'
    step_desk: 'Sag den diensthabenden Kuratoren, dass sich der Platz mit Rauschen füllt und sie es nicht massenhaft ablehnen dürfen: Ablehnen ist ein Urteil und schließt diese Kategorie für dieses Foto für immer.'
    step_after: 'Setze die Budgets danach zurück und halte fest, wie die echte Rate aussah. Die richtigen Zahlen sind die, die ein echter Vorfall lehrt.'
    h_dont: 'Nicht tun'
    dont_decline: 'Lehne nicht massenhaft am Moderationsplatz ab. Nutze die Wiederherstellungsseite: Eine Ablehnung immunisiert das Foto dauerhaft gegen die nächste echte Meldung derselben Art.'
    dont_raise: 'Erhöhe die Budgets nicht, damit das Banner verschwindet. Genau das Budget begrenzt den Schaden.'
    dont_disclose: 'Erzähle Meldenden und Hochladenden nichts übereinander, und veröffentliche weder die Schwellen noch den genauen Entscheidungstest noch die am schnellsten wirkende Kategorie. Alles, was eine kuratierende Person darüber weiß, wie ein Foto entfernt wird, ist zugleich ein Skript für Social Engineering.'
    dont_ignore: 'Geh nicht davon aus, dass es ein Angriff ist. Prüfe zuerst; den Hebel gibt es für etwas Echtes.'
    h_real: 'Wenn es echt ist'
    real: 'Sind die Meldungen echt — eine tatsächliche Welle illegaler Bilder auf der Karte — ist der Schutzschalter nicht dein Feind: Meldungen kommen weiter an, nichts geht verloren. Halte selbst vom Moderationsplatz aus zurück, was zurückgehalten werden muss, bewahre die Aufzeichnungen, und ziehe sofort die Eigentümerseite hinzu. Lösche niemals Beweise für illegales Material, bevor es den Behörden gemeldet wurde.'
    h_escalated: 'Wenn eine kuratierende Person etwas als illegal eskaliert'
    escalated_intro: 'Eskalierte Fotos sind bereits vor der Öffentlichkeit und vor dem Moderationsplatz verborgen, und nichts in der Anwendung kann sie löschen. Sie sind hier'
    esc_step_read: 'Lies zuerst die Worte der kuratierenden Person und entscheide, ob du das Bild überhaupt ansehen musst. Oft nicht.'
    esc_step_report: 'Melde es dort, wo es hingehört. Material mit einer Gefahr für Leib oder Leben ist unverzüglich den Strafverfolgungsbehörden zu melden (DSA Art. 18). Bei Missbrauchsdarstellungen von Kindern die Meldestelle (Offlimits / Meldpunt Kinderporno) und/oder die Polizei. Terroristische Inhalte unterliegen einer sechsmonatigen Aufbewahrungspflicht.'
    esc_step_preserve: 'Lösche nichts und bitte niemanden darum. Die Sperre existiert, damit die Aufzeichnung bis zur Meldung bestehen bleibt; die Behörde, der du meldest, entscheidet, wann sie gehen darf.'
    esc_step_release: 'Hebe die Sperre nur auf, wenn es sich als etwas anderes herausstellt. Aufheben gibt es an die normale Moderation zurück — es kommt dadurch nicht auf die Karte zurück.'
    esc_step_curator: 'Frag nach, wie es der kuratierenden Person geht, die eskaliert hat. Sie hat es gesehen, damit es niemand sonst musste — das ist eine Nachricht wert.'
  withheld:
    title: 'Durch eine Meldung zurückgehaltene Fotos'
    lead: 'Jedes Foto, das eine anonyme Meldung von der Karte genommen hat und das noch auf eine Entscheidung wartet. Wiederherstellen setzt sie zurück und hält fest, dass die Meldung nicht echt war — die Kategorie bleibt offen, eine spätere echte Meldung zum selben Foto wird also weiterhin gehört.'
    empty: 'Derzeit hält keine Meldung von Dritten ein Foto zurück.'
    breaker_open_b: 'Der Schutzschalter für automatisches Zurückhalten ist offen.'
    breaker_open: 'Dringende Meldungen treffen weit schneller ein als jede echte Rate, sie entfernen Fotos also nicht mehr von selbst. Stelle unten wieder her, was keine echte Beanstandung ist, und rechne mit mehr.'
