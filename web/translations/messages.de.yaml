home:
  eyebrow: 'OFFENE RADDATEN · EINE VORSCHAU DESSEN, WAS SEIN KÖNNTE'
  h1: 'Jede Straße.<br/>Jeder Weg.<br/>Ein <em>offener Atlas</em><span class="endp">.</span>'
  lede: 'Eine von der Community erstellte Karte der besten Touren der Welt — Anstiege, Wasser, Aussichten, fahrradfreundliche Übernachtungen — kostenlos für jeden zum Nutzen, Aufbauen und Verbessern.'
  cta_map: 'Karte erkunden'
  cta_contribute: 'Beitragen'
  tick_label: 'Start'
  tick_year: '2026'
  corner_br: 'SCROLLEN ↓'
  disc_label: 'FÜR JEDE ART DES RADFAHRENS —'
  frag_kicker: 'EIN ORT, NICHT EIN DUTZEND APPS'
  frag_h2: 'Radfahrwissen ist verstreut. The Commons bündelt es.'
  frag_lead1: 'Heute lebt jede Ebene in ihrem eigenen Silo — eine App für Anstiege, eine andere für Routen, eine andere für fahrradfreundliche Übernachtungen, eine andere für Straßenbedingungen — und die meisten sind geschlossen. Radfahrer fügen ein Dutzend Tools zusammen und die Daten verbinden sich nie. The Commons bringt das nicht-persönliche Wissen an einen offenen Ort, frei abfragbar und aufbaubar.'
  frag_lead2: 'Und wo gute offene Daten bereits existieren, bauen wir sie nicht neu auf — wir <b>kooperieren</b>. Wir verlinken und interagieren mit anderen Open-Data-Communities (wie offene Gastfreundschaftsnetzwerke für Schlafmöglichkeiten) anstatt unsere eigene Kopie einzusperren. Offene Daten sollten sich verbinden, nicht weiter fragmentieren.'
  frag_panel_h: 'Heute. Ein Dutzend Apps für deine Tour.'
  frag_climbs: 'Anstiege &amp; Pässe'
  frag_climbs_tag: 'geschlossenes Silo'
  frag_rides: 'Empfohlene Routen &amp; Bewertungen'
  frag_rides_tag: 'geschlossenes Silo'
  frag_scenic: 'Landschaft, Aussichten &amp; Kultur'
  frag_scenic_tag: 'verstreut'
  frag_stays: 'Fahrradfreundliche Übernachtungen'
  frag_stays_tag: 'geschlossenes Silo'
  frag_road: 'Straßenbelag &amp; -bedingungen'
  frag_road_tag: 'verstreut'
  frag_water: 'Wasser · Essen · Dienstleistungen'
  frag_water_tag: 'verstreut'
  frag_vs: 'The Commons → ein offener Atlas'
  what_kicker: 'DAS PRINZIP'
  what_h2: 'Offene Daten über die Welt — niemals über dich.'
  what_lead: 'The Commons enthält die Karte: Anstiege, Wasser, Gefahren, Übernachtungen — Fakten über Orte, niemals über Menschen. Keine Identität, kein Tracking, nichts Persönliches. Aufgebaut auf OpenStreetMap, an es zurückgegeben, von seiner Community verwaltet.'
  what_in_h: 'Die Tourdaten der Welt'
  what_in_p: 'Anstiege, Wasserstellen, Aussichtspunkte, Kulturdenkmäler, fahrradfreundliche Übernachtungen, Straßenbedingungen — offen unter ODbL.'
  what_out_h: 'Alles Persönliche'
  what_out_p: 'Deine Identität und privaten Daten — The Commons erhebt sie nie. Es kartiert die Welt, nicht den Fahrer.'
  what_free_h: 'Für jeden und alle'
  what_free_p: 'Abfragen, exportieren, aufbauen. Das ist, was es zu einem Commons macht.'
  cur_kicker: 'KURATIERUNG STATT ÜBERFLUTUNG'
  cur_h2: 'Das Beste einer Region, ausgewählt von Fahrern.'
  cur_lead: 'Komme irgendwo neu an und sieh die Anstiege, Aussichten und Routen, die dein Wochenende wert sind — gewählt von den Fahrern, die sie kennen, jede Saison aktualisiert. Utility-Daten wie Wasser streben nach vollständiger Abdeckung; der volle Datenstrom wartet im Backlog, wenn du alles möchtest.'
