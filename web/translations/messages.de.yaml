join:
  kicker: 'Mitmachen'
  title: 'Bau The Commons mit uns.'
  lead1: 'Cycling Commons wird von den Menschen gebaut, die es nutzen — in Code, in lokalem Wissen und in allem, was dazugehört. Es ist früh, es ist offen, und es ist Platz für dich.'
  lead2: 'Ein Commons wächst nicht durch Einstellen; es wächst dadurch, dass Menschen auftauchen. Hier brauchen wir Hände.'
  heart_kicker: 'Das Herzstück'
  heart_h2: 'Fahrer &amp; lokales Wissen.'
  heart_lead: 'The Commons ist nur so gut wie das, was Fahrer wissen: der Anstieg, der den Umweg wert ist, wo das Wasser ist, die Kreuzung, die einen erwischt, die Runde, die still perfekt ist. Dieses Wissen ist der eigentliche Sinn — und es ist das Einzige, das niemand für dich aufbauen kann.'
  hnote_b: 'Ehrlicher Hinweis — das Beitragssystem ist noch nicht live.'
  hnote_body: 'Was du gerade siehst, ist ein funktionierender Prototyp: die Abläufe sind echt, aber nichts wird gespeichert. So kannst du The Commons <i>heute</i> schon bereichern, ohne zu warten:'
  howto1_b: 'Objektive Fakten in OpenStreetMap kartieren.'
  howto1_body_pre: 'Wasserstellen, Reparaturstationen, Beläge — jetzt zu'
  howto1_body_post: 'hinzufügen. Wir bauen auf OSM auf und tragen zurück, so fließt es in The Commons ein. Hier nichts nötig.'
  howto2_b: 'Den Prototypen mitgestalten.'
  howto2_body_pre: 'Klick durch'
  howto2_themap: 'die Karte'
  howto2_mid1: ', '
  howto2_addclimb: 'einen Anstieg hinzufügen'
  howto2_mid2: ', oder eine Abstimmungsrunde, dann'
  howto2_email: 'schreib uns'
  howto2_mid3: ' — oder'
  howto2_issue: 'öffne ein Issue'
  howto2_post: '— wo es nicht mit dem übereinstimmt, wie du deine Daten tatsächlich eingeben würdest. Im Moment <i>ist</i> Feedback der Beitrag.'
  howto3_b: 'Lokales Wissen einsenden.'
  howto3_link: 'Einen Ort auf GitHub beitragen'
  howto3_post: ' — einen Anstieg, eine Gefahr, eine tolle Tour — und wir kuratieren ihn, während The Commons sich füllt.'
  howto4_b: 'Als Erste dabei sein.'
  howto4_link: 'E-Mail hinterlassen'
  howto4_post: ' und wir sagen dir Bescheid, sobald offenes Beitragen live geht.'
  skills_kicker: 'Deine Fähigkeiten einbringen'
  skills_h2: 'Hilf beim Aufbau und beim Erhalt.'
  role1_rk: '01 · AUFBAUEN'
  role1_h: 'Entwickler'
  role1_p: 'Die echte Plattform: Backend &amp; API (Symfony 7 LTS), das MapLibre-Frontend und die Geodaten-Pipeline (PostGIS, Routing, Höhenmodell, OSM-Import).'
  role1_link: 'Auf GitHub starten →'
  role2_rk: '02 · WACHSEN'
  role2_h: 'Social Media &amp; Community'
  role2_p: 'Die Geschichte erzählen, die Fahrerbasis ausbauen, Neulinge willkommen heißen und die Community gesund halten, während sie wächst.'
  role2_link: 'In Kontakt treten →'
  role3_rk: '03 · ERHALTEN'
  role3_h: 'Fundraiser &amp; Antragssteller'
  role3_p: 'Open-Data- und nachhaltige-Mobilität-Fördermittel, EU-Radförderung — die Basis, die The Commons frei und unabhängig hält.'
  role3_link: 'In Kontakt treten →'
  role4_rk: '04 · SCHÜTZEN'
  role4_h: 'Recht &amp; Governance'
  role4_p: 'Die niederländische <i>Stichting</i> (Stiftung)-Gründung, ODbL / CC-Lizenzierung, Beitragendenkonditionen und DSGVO — die Struktur, die es dauerhaft offen hält.'
  role4_link: 'In Kontakt treten →'
  also_welcome: '<b>Ebenfalls willkommen:</b> Übersetzer, Designer, OpenStreetMap-Mapper, Fotografen und Partnerschaftsaufbauer (Radvereine, Tourismusbüros, fahrradfreundliche Unterkünfte). Siehst du deine Rolle nicht?'
  also_tell: 'Sag uns, was du einbringst.'
  start_kicker: 'Jetzt starten'
  start_h2: 'Ein Commons wächst, wenn Menschen auftauchen.'
  start_lead: 'Code, lokales Wissen oder ein paar Stunden Expertise — all das treibt die Karte voran. Die Tür steht offen.'
  start_cta_code: 'Code beitragen →'
  start_cta_email: 'Das Team anschreiben'
