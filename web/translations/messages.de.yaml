  lead: 'Scout ist ein Feldrekorder mit einem Fingertipp, für deinen Radcomputer. Markiere eine Gefahrenstelle, eine Sperrung, einen Belagswechsel oder eine Wasserstelle genau dann, wenn du vorbeifährst — ohne anzuhalten, ohne Handy, ohne Tippen. Jede Markierung wird direkt in deine Aufzeichnung geschrieben, in einem offenen, dokumentierten Format.'
  plat_garmin: 'Garmin Edge'
  plat_android: 'Android'
  plat_karoo: 'Hammerhead Karoo'
  plat_available: 'Jetzt verfügbar'
  plat_soon: 'Demnächst'
  plat_planned: 'Geplant'
  shot_garmin_alt: 'Das Scout-Markierungsmenü auf einem Garmin Edge, mit den sechs Typen und einem Überholzähler'
  logo_alt: 'Das Scout-Logo'
  shot_garmin_cap: 'Am Lenker'
  shot_android_alt: 'Scout auf einem Android-Telefon, mit der Markierungstaste und den Markierungen dieser Fahrt'
  shot_android_cap: 'In der Tasche'
  what_h: 'Was es macht'
  what_p1: 'Du bist die einzige Person, die weiß, dass die Straße gesperrt ist, dass hier der Schotter anfängt oder dass der Brunnen am Platz läuft. Normalerweise verfliegt dieses Wissen, bevor du zu Hause bist. Scout hält es in dem Moment fest, in dem du vorbeifährst: ein Tippen, und es steht da — mit Position und Uhrzeit.'
  what_p2: 'Scout <b>steht für sich</b>. Die App und ihr Format funktionieren mit oder ohne Cycling Commons — deine Markierungen gehören dir, in deiner eigenen Datei, lesbar für alles, was sie lesen kann.'
  step1_no: '01'
  step1_h: 'Tippen beim Fahren'
  step1_p: 'Eine Markierung ist ein Tippen. Wähle im Untermenü einen Typ, wenn du genau sein willst, oder lass es und kläre es später.'
  step2_no: '02'
  step2_h: 'Sie landet in deiner Aufzeichnung'
  step2_p: 'Jede Markierung wird in die Aktivität geschrieben, die dein Computer ohnehin aufzeichnet, in einem offenen Format — nichts Separates zum Synchronisieren oder Verlieren.'
  step3_no: '03'
  step3_h: 'Danach aufräumen'
  step3_p: 'Zu Hause korrigierst du einen Fehlgriff, schiebst eine Markierung an die richtige Stelle der Straße und schickst sie — wenn du magst — ans Commons, wo sie dieselbe Prüfung durchläuft wie jeder andere Beitrag.'
  tags_h: 'Was du markieren kannst'
  tags_lead: 'Sechs Markierungstypen, plus einer automatisch, wenn du mit Radar fährst.'
  tags_col_tag: 'Markierung'
  tags_col_what: 'Wofür'
  tag_resupply: 'Nachschub'
  tag_resupply_p: 'Wasser, Essen oder ein Stopp für Reparatur und Pumpe.'
  tag_closure: 'Sperrung'
  tag_closure_p: 'Straße dicht oder Umleitung — und ungefähr, wie lange es deiner Meinung nach dauert, womit die Karte sie später von selbst zurückziehen kann.'
  tag_surface: 'Belag'
  tag_surface_p: 'Markiere einen Abschnitt mit einem Starttyp und einem END, damit er als Segment erfasst wird und nicht als Punkt. An die surface-Werte von OpenStreetMap angelehnt.'
  tag_notice: 'Achtung'
  tag_notice_p: 'Eine üble Kurve, eine Kreuzung, Schlaglöcher oder sonst etwas Heikles.'
  tag_scenery: 'Aussicht'
  tag_scenery_p: 'Ein Anblick, den man behalten will.'
  tag_other: 'Sonstiges'
  tag_other_p: 'Alles andere. Ein Tippen, kein Untermenü — was es war, entscheidest du zu Hause.'
  tag_radar: 'Überholvorgänge'
  tag_radar_p: 'Mit gekoppeltem Varia-kompatiblem Radar zählt Scout automatisch die Fahrzeuge, die dich überholen. Das ist das Nächste an einem objektiven Maß dafür, wie viel Verkehr eine Straße wirklich hat.'
  privacy_h: 'Deine Fahrt bleibt deine'
  review_title: 'Eine Fahrt durchsehen'
  review_pick: 'Fahrtdatei wählen'
  review_close: 'Schließen'
  review_send_all: 'Den Rest senden'
  review_photo_drop: 'Wähle ein Foto, oder zieh eins hierher'
  review_hint: 'Die .fit-Datei, in die deine Fahrt aufgezeichnet wurde — oder zieh sie hierher.'
  review_approved: 'ans Commons geschickt'
  privacy_p: 'Wenn du Tags an das Commons schickst, <b>reisen nur die Tags</b> — der Punkt, den du getippt hast, wofür du ihn gehalten hast, und wann. Deine Route wird in deinem eigenen Browser gelesen und nie hochgeladen, nie gespeichert, nie von uns aufbewahrt.'
