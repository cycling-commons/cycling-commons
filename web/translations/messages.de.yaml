developers:
  kicker: 'Auf The Commons aufbauen'
  title: 'Offene Daten. Eine offene API. Für alle zum Aufbauen.'
  lead: 'Frage The Commons nach Gebiet und Typ ab, binde unsere Vektor-Tiles in deinen eigenen Kartenstil ein, oder hoste den kostenlosen periodischen Massenexport selbst. Die Daten sind offen (ODbL) — das macht es zu einem Commons. Der Zugang ist Self-Service: ein kostenloser Schlüssel, eine kostenlose Stufe, und bezahlte Kontingente nur für intensive, immer aktuelle Nutzung.'
  status: 'In Entwurf — diese Endpunkte sind der Vertrag, den wir bauen. Sieh dir die <a href="/developers/api">interaktive API-Referenz</a> (Englisch) oder die <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">Spezifikation auf GitHub</a> an.'
