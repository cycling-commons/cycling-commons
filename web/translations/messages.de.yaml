roadmap:
  kicker: 'Fahrplan'
  title: 'Was wir als Nächstes bauen.'
  lead: 'Keine Termine, denn wir würden nur raten. Das ist die Reihenfolge der Arbeit, ehrlich geführt: was gerade gebaut wird, was entschieden ist und wartet, und was wir wollen, aber noch nicht eingeplant haben. Was fertig ist, verlässt diese Seite und steht im Änderungsprotokoll.'
  group_now: 'Jetzt'
  group_now_sub: 'Im Bau. Hier sitzt tatsächlich jemand dran.'
  group_next: 'Als Nächstes'
  group_next_sub: 'Entschieden und wartet auf einen Platz. Ohne Überraschungen folgt das hier.'
  group_later: 'Später'
  group_later_sub: 'Gewollt, nicht eingeplant. Echte Absichten, keine Zusagen zum Wann.'
  item_curator_direct: '<b>Der neue Ort eines Kurators kommt direkt auf die Karte.</b> Änderungen eines Kurators überspringen die Warteschlange schon; ein neuer Ort wartet noch darin. Der Assistent wird die eine Frage stellen, die heute die Warteschlange stellt, ob der Ort schon in OpenStreetMap ist, und veröffentlichen.'
  item_pending_notice: '<b>Dir sagen, wenn ein Ort schon eine Änderung wartend hat.</b> Zwei Fahrer, die denselben Wasserhahn korrigieren, sollten die Arbeit des anderen sehen, bevor sie anfangen, nicht erst nach einem Kurator.'
  item_provider_refresh: '<b>Datenquellen, die sich selbst aktualisieren.</b> Amtliche Quellen wie ein nationales Trinkwasserregister, nach Zeitplan geerntet, mit einem Ausführen-Knopf und einem Formular, um eine Quelle vom Kuratorenpult aus anzulegen.'
  item_release_mail: '<b>Die Release-Mail.</b> Der Liste kannst du dich auf deiner Einstellungsseite schon anschließen; verschickt wurde noch nichts. Die erste Mail geht mit dem nächsten Release raus.'
  item_support_thread: '<b>Ein Support-Gespräch, dem du folgen kannst.</b> Ein angemeldeter Absender behält eine Kopie seiner Nachricht, und die Antwort landet in seinem Konto: eine Frage wird ein Faden statt zwei E-Mails.'
  item_surface_loop: '<b>Belagskorrekturen, die ganze Schleife.</b> Die Korrektur eines Fahrers an einem Straßenbelag erreicht die Kacheln, und ein Kurator kann sie sehen und zurücknehmen.'
  item_photo_link: '<b>Ein Foto per Link hinzufügen.</b> Ein Bild, das schon auf Wikimedia Commons liegt, über seine Adresse hinzugefügt: die Lizenz wird geprüft und die Datei geholt, nie hot-gelinkt.'
  item_phone_map: '<b>Die Seitenkarte auf dem Handy.</b> Das Seitenverzeichnis ist eine Straßenkarte, die auf dem Handy heute seitwärts schiebt. Sie sollte sich zu einer Streifenkarte stapeln, die nach unten scrollt.'
  item_region_vote: '<b>Die saisonale Abstimmung.</b> Anstiege, Unterkünfte, Aussichten und Erbe einer Region ordnen, jede Saison neu. Die Seite ist heute eine Entwurfsvorschau; die Abstimmung dahinter ist geplant.'
  item_heatmap: '<b>Die Fahrten-Heatmap, zurück auf der Karte.</b> Verborgen, bis Fahrer genug Routen beigetragen haben, dass sie etwas aussagt.'
  item_saved_regions: '<b>Gespeicherte Regionen.</b> Die Regionen, in denen du fährst, in einer eigenen Liste behalten.'
  item_observations: '<b>Beobachtungen, die altern.</b> Eine Sperrung oder ein Zustand, der auf einer Fahrt markiert wurde, verblasst nach einer Weile von selbst, es sei denn, jemand bestätigt ihn erneut.'
  item_item_links: '<b>Links von einem Ort hinaus.</b> Ein Ort trägt die Seiten, die ihn beschreiben, etwa eine offizielle Website oder einen Wiki-Artikel.'
  item_standing: '<b>Ansehen als Beitragender.</b> Fahrer, deren Arbeit immer wieder angenommen wird, verdienen eine leichtere Hand, etwa Änderungen, die sofort live gehen, statt sie von Hand zu bekommen.'
  item_curator_room: '<b>Ein Kuratorenzimmer.</b> Eine Tafel im Moderationspult, an der ein Kurator fragen kann, bevor er handelt, und sieht, was andere gefragt haben.'
  item_beta: '<b>Ein Betatester-Programm.</b> Fahrer, die Dinge ausprobieren wollen, bevor sie erscheinen, und ein Weg, uns zu sagen, was kaputtging.'
  item_osm_giveback: '<b>An OpenStreetMap zurückgeben.</b> Was Fahrer hier bestätigen, stromaufwärts angeboten in einer Form, die OpenStreetMap annehmen kann.'
  item_map_a11y: '<b>Die Karte ohne Maus benutzbar machen.</b> Die ehrliche Lücke in unserer Barrierefreiheitserklärung: Tastatur- und Screenreader-Zugang zur Karte selbst, nicht nur zu den Seiten drumherum.'
  item_route_export: '<b>Eine Route mitnehmen.</b> Export auf dein Gerät oder in deinen Planer, und ein dauerhafter Link auf einen Kartenausschnitt.'
  item_roadmap_votes: '<b>Bei dieser Liste mitreden.</b> Abstimmen, was dir wichtig ist, einem Punkt folgen, und selbst einen vorschlagen.'
  foot_shipped_pre: 'Was schon draußen ist, steht im'
  foot_shipped_link: 'Änderungsprotokoll'
  foot_shipped_mid: '. Fehlt etwas, das du brauchst? Sag es uns auf der'
  foot_contact_link: 'Kontaktseite'
  foot_shipped_post: ', ein Mensch liest es.'
changelog:
  kicker: 'Änderungsprotokoll'
  title: 'Was neu ist.'
  lead: 'Jede Version, die neueste zuerst, in einfachen Worten. Die Version hier ist dieselbe, die am Fuß jeder Seite steht, du weißt also immer, was du vor dir hast.'
  feed_title: 'Cycling Commons: was neu ist'
  feed_subtitle: 'Versionen der Cycling-Commons-Plattform.'
  feed_pre: 'Ohne Konto mitlesen: abonniere den'
  feed_link: 'Atom-Feed'
  feed_mid: '. Was als Nächstes kommt, steht im'
  feed_roadmap: 'Fahrplan'
  feed_post: '.'
  v080_map: '<b>Die Karte.</b> Orte, Anstiege und Routen in neunzehn Ländern, mit einer Oberflächenebene, Satelliten- und Straßenbildern und einem hellen wie einem dunklen Thema.'
  v080_photos: '<b>Fotos.</b> Steuere zu jedem Ort ein Foto bei, unter CC BY-SA 4.0. Standortdaten werden vor der Veröffentlichung entfernt, und jedes Foto hat eine eigene Seite.'
  v080_routes: '<b>Routen.</b> Schlage eine Route aus einer GPX-Datei vor, stimme über die ab, die du gefahren bist, und sieh das Beste einer Region.'
  v080_contribute: '<b>Beitragen.</b> Orte direkt von der Karte aus anlegen und korrigieren, bestätigen, dass etwas noch da ist, und nachlesen, was eine Kuratorin entschieden hat und warum.'
  v080_accounts: '<b>Konten.</b> Optionales öffentliches Profil, Anmeldung mit zwei Faktoren, ein vollständiger Datenexport und eine Kontolöschung, die sofort greift.'
  v080_languages: '<b>Fünf Sprachen.</b> Englisch, Französisch, Niederländisch, Deutsch und Spanisch, mit einem Weg für Fahrerinnen und Fahrer, eine bessere Übersetzung vorzuschlagen.'
  v080_legal: '<b>Der Papierkram richtig gemacht.</b> Eine Datenschutzerklärung, die jeden Auftragsverarbeiter nennt, eine Barrierefreiheitserklärung, die aufzählt, was noch nicht geht, und ein Kontaktweg, der bei einem Menschen ankommt.'
unsubscribed:
  kicker: 'Abgemeldet'
  title: 'Du bekommst diese nicht mehr.'
  body: 'Erledigt. Wir schreiben dir nicht mehr wegen Versionen, es sei denn, du bittest darum. Sonst hat sich an deinem Konto nichts geändert, und deine Beiträge sind unberührt.'
