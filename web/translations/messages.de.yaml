export:
  readme: |
    DEINE CYCLING-COMMONS-DATEN
    ===========================

    Erstellt am %generated% für das Konto „%account%".

    Dieses Archiv beantwortet zwei DSGVO-Rechte auf einmal: das Auskunftsrecht
    (Art. 15) und das Recht auf Datenübertragbarkeit (Art. 20). Die
    Übertragbarkeit deckt nur ab, was du uns selbst gegeben hast, die Auskunft
    deckt mehr ab — statt dich zwischen zwei Downloads wählen zu lassen, ist
    dies die Gesamtmenge.

    WAS DRIN IST

      account.json        Dein Konto: E-Mail, Anzeigename, Sprache, Land,
                          Basisstandort, Einstellungen und Zeitstempel.
      contributions.json  Deine Einreichungen und die Feldänderungen, die sie
                          auf der Karte bewirkt haben, nachdem ein Kurator sie
                          angenommen hat.
      community.json      Bestätigungen, Routen-Stimmen, Fahrten,
                          Korrekturvorschläge, Länderanfragen,
                          Kurator-Bewerbungen.
      messages.json       Deine Dashboard-Nachrichten, in beide Richtungen.
      consent.json        Jede erteilte Fotolizenz: welcher Wortlaut, welche
                          Version, und wann.
      translations.json   Deine vorgeschlagenen UI-Übersetzungen. Das sind
                          CC BY-SA 4.0-Beiträge, keine personenbezogenen Daten über
                          den Fahrer.
      photos/index.json   Ein Eintrag pro hochgeladenem Foto, mit Status und
                          der zugehörigen Datei.
      photos/*.webp       Die Fotos selbst.

    WAS NICHT DRIN IST, UND WARUM

      Dein Passwort, dein Zwei-Faktor-Geheimnis und deine Backup-Codes. Das
      sind die Zugangsdaten, die dieses Konto schützen. Ein Export ist eine
      Datei, die Menschen weiterleiten und sichern, und die Schlüssel mit dem
      Inhalt herauszugeben würde dich unsicherer machen, nicht besser
      informiert.

      Die Identität der Kuratoren, die deine Arbeit bearbeitet haben. Was über
      deine Einreichungen entschieden wurde, sind deine Daten und steht hier
      vollständig drin, Notizen inbegriffen. Wer die Entscheidung getroffen
      hat, sind ihre.

    ZU DEN FOTOS

      Das sind unsere verarbeiteten Kopien, nicht die Dateien, die du
      hochgeladen hast. Wir kodieren jedes Foto beim Eingang neu und entfernen
      seine Metadaten, einschließlich jedes von der Kamera aufgezeichneten
      Standorts — die Datei genau so, wie du sie geschickt hast, bewahren wir
      nicht auf. Ein Eintrag im Index mit "file": null ist ein Foto, dessen
      gespeicherte Objekte bereits gelöscht wurden; der Nachweis darüber
      bleibt.

      Fotos, die ein Kurator freigegeben hat, stehen unter CC BY-SA 4.0 und
      bleiben Teil von The Commons. Diese Lizenz kann nicht widerrufen werden.
      Dein Name steht jedoch nicht in den Dateien: Die Namensnennung wird live
      aus deinem Profil aufgelöst — dein Profil auf privat zu stellen oder dein
      Konto zu schließen ändert also, was jede Kopie deines Fotos nennt, auch
      längst heruntergeladene Kopien.

    FRAGEN

      info@cyclingcommons.org
