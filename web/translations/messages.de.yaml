developers:
  kicker: 'Auf The Commons aufbauen'
  title: 'Offene Daten. Eine offene API.<br>Für alle, die darauf bauen wollen.'
  lead: 'Fragen Sie den Commons nach Gebiet und Art ab, oder hosten Sie selbst aus dem periodischen Bulk-Export. Die Daten sind offen (ODbL), und genau das macht sie zu einem Commons. Kein Schlüssel, kein Konto, keine Kosten: ein Ratenlimit und faire Nutzung, mehr nicht.'
  status: 'In Entwurf — diese Endpunkte sind der Vertrag, den wir bauen. Sieh dir die <a href="/developers/api">interaktive API-Referenz</a> (Englisch) oder die <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">Spezifikation auf GitHub</a> an.'
  ep_kicker: 'Endpunkte'
  ep1_path: '/v1/search'
  ep1_desc: 'Abdeckung finden nach <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'ein Eintrag, mit unserer Anreicherung und Herkunft <b>(geplant)</b>'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'Regionspolygon und Abdeckungszahlen <b>(geplant)</b>'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'das Best-of einer Region <b>(geplant)</b>'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'Routendetails und GPX-Download <b>(geplant)</b>'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'Vektorkacheln und TileJSON, für Ihren eigenen MapLibre-Stil <b>(geplant)</b>'
  ep7_path: '/v1/contributions'
  ep7_desc: 'beitragen <b>(geplant)</b>, landet in derselben Prüfschlange wie Beiträge in der App'
  ex_kicker: 'Beispielanfrage'
  resp_kicker: 'Antwort'
  ex_hydrate: 'Antworten sind standardmäßig nur-Referenz: unsere ergänzten Felder plus die <code>osm_ref</code> zum Hydrieren gegen OSM. <code>?hydrate=osm</code> mischt unseren zwischengespeicherten OSM-Teilbestand gleich mit ein.'
  attr_kicker: 'Erforderliche Attribution'
  rules_kicker: 'Die Regeln'
  rules_body: '<b>Faire Nutzung.</b> Lesen steht allen offen, ohne Schlüssel und ohne Konto, mit <b>120 Anfragen pro Minute</b> je Adresse. Das ist ein gleitendes Fenster: eine Spitze leiht sich von der nächsten Minute, statt Sie auszusperren. Für Massen- oder Offline-Nutzung nehmen Sie den <b>periodischen Export</b> und hosten ihn selbst, statt die Live-API zu belasten; das Scrapen des Dienstes ist nicht erlaubt. Lizenzen: Daten <b>ODbL 1.0</b>, Medien <b>CC BY-SA 4.0</b>. Nennen, unter gleichen Bedingungen teilen, offen halten. Kommerzielle Nutzung ist in Ordnung. Siehe die Zusammenfassung in einfacher Sprache:'
