developers:
  demo_label: 'Demo'
  demo_body: '— eine Vorschau der offenen API &amp; Massenexporte. Start 2026.'
  kicker: 'Auf The Commons aufbauen'
  title: 'Eine offene API. Kostenlos. Für alle zum Aufbauen.'
  lead: 'Frage The Commons nach Typ und Gebiet ab oder lade Massenexporte pro Land. Standardmäßig offen — das macht es zu einem Commons. Lesezugriffe sind offen und anonym, innerhalb fairer Nutzungslimits; Schreibzugriffe benötigen ein kostenloses Konto-Token. Wir begrenzen Anfragen und überwachen auf Missbrauch, damit es für alle schnell und kostenlos bleibt.'
  ep_kicker: 'Endpunkte'
  ep1_path: '/v1/features'
  ep1_desc: 'filtern nach <code>type</code>, <code>bbox</code>, <code>region</code>'
  ep2_path: '/v1/regions/{id}/best'
  ep2_desc: 'das kuratierte Beste einer Region'
  ep3_path: '/v1/export/{country}.geojson'
  ep3_desc: 'ODbL-Massenexport'
  ep4_path: '/v1/features'
  ep4_desc: 'beitragen (Token + geht zur Prüfung)'
  ex_kicker: 'Beispielanfrage'
  resp_kicker: 'Antwort'
  attr_kicker: 'Erforderliche Attribution'
  rules_kicker: 'Die Regeln'
  rules_body: '<b>Anfragelimits &amp; faire Nutzung.</b> Anonyme Lesezugriffe sind <b>begrenzt</b> — ein Commons ist kein CDN und wir haben keine unendlichen Server. Ein kostenloser API-Schlüssel erhöht dein Limit; für intensive oder wiederholte Nutzung verwende stattdessen die <b>Massenexporte pro Land</b>, anstatt die Live-API zu belasten. Schreibzugriffe benötigen ein kostenloses Konto-Token und durchlaufen eine Prüfung. Lizenzen: Daten <b>ODbL 1.0</b>, Medien <b>CC BY-SA 4.0</b> — siehe die Zusammenfassung in klarer Sprache. Attribution, Share-alike, offen halten; kommerzielle Nutzung ist in Ordnung.'
