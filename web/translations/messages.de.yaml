  frag_water: 'Wasser · Essen · Dienstleistungen'
  frag_water_tag: 'verstreut'
  frag_vs: 'The Commons → ein offener Atlas'
  what_kicker: 'DAS PRINZIP'
  what_h2: 'Offene Daten über die Welt — niemals über dich.'
  what_lead: 'The Commons enthält die Karte: Anstiege, Wasser, Gefahren, Übernachtungen — Fakten über Orte, niemals über Menschen. Keine Identität, kein Tracking, nichts Persönliches. Aufgebaut auf OpenStreetMap, an es zurückgegeben, von seiner Community verwaltet.'
  what_in_h: 'Die Tourdaten der Welt'
  what_in_p: 'Anstiege, Wasserstellen, Aussichtspunkte, Kulturdenkmäler, fahrradfreundliche Übernachtungen, Straßenbedingungen — offen unter ODbL.'
  what_out_h: 'Alles Persönliche'
  what_out_p: 'Deine Identität und privaten Daten — The Commons erhebt sie nie. Es kartiert die Welt, nicht den Fahrer.'
  what_free_h: 'Für jeden und alle'
  what_free_p: 'Abfragen, exportieren, aufbauen. Das ist, was es zu einem Commons macht.'
  cur_kicker: 'KURATIERUNG STATT ÜBERFLUTUNG'
  cur_h2: 'Das Beste einer Region, ausgewählt von Fahrern.'
  cur_lead: 'Komme irgendwo neu an und sieh die Anstiege, Aussichten und Routen, die dein Wochenende wert sind — gewählt von den Fahrern, die sie kennen, jede Saison aktualisiert. Utility-Daten wie Wasser streben nach vollständiger Abdeckung; der volle Datenstrom wartet im Backlog, wenn du alles möchtest.'
