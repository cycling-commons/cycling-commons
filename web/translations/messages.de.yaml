        help: 'Auf 1 setzen, wenn die Abstimmungsrunden offen sind. Bei 0 bleibt jeder Vote-Aufruf auf der Karte verborgen — ein Knopf für eine Runde, die es nicht gibt, wirkt kaputt.'
      map_curated_default_threshold:
        label: 'Reife für Best-of: Gesamtzahl'
        help: 'Wie viele kuratierte Einträge eine Region insgesamt braucht, bevor ein Kurator sie standardmäßig im Auswahlmodus öffnen darf. Niedriger, um junge Regionen früher freizugeben; höher, um den Qualitätsanspruch zu halten.'
      map_curated_default_min_blocks:
        label: 'Reife für Best-of: Arten von Einträgen'
        help: 'Wie viele verschiedene Blöcke (Belag, Anstiege, Übernachtung, Aussichten, Kultur, beste Routen) jeweils ihr eigenes Minimum erreichen müssen. Auf 1 gesetzt, zählt wieder nur die Gesamtzahl.'
      map_curated_default_min_per_block:
        label: 'Reife für Best-of: Einträge je Art'
        help: 'Was ein Block braucht, um für die Anforderung darüber zu zählen. Zusammen verhindern beide Zahlen, dass eine einzige Ebene eine Region allein trägt.'
      map_confirmation_stale_months:
        label: "Bestätigungen veralten nach (Monaten)"
        help: "Wie lange die Kontrolle einer Radfahrerin an einem Wasserhahn, Laden, WC oder einer Gefahr zählt. Danach gibt die Karte der Nadel einen orangen Ring, damit Vorbeifahrende wissen, dass ein Blick lohnt. Eine Kontrolle setzt die Uhr zurück. Orte, die sich nicht ändern - Anstiege, Aussichtspunkte, Geschichte - veralten nie."
      route_region_active_cap:
        label: 'Aktive Routen je Region'
        help: 'Wie viele Routen eine Region gleichzeitig veröffentlicht haben darf. Wer über die Obergrenze hinaus freigibt, wird gestoppt und gebeten, zuerst etwas außer Dienst zu stellen.'
      route_ride_verify_threshold:
        label: 'Fahrten bis zur Verifizierung einer Route'
        help: 'Wie viele Fahrende außer der einreichenden Person eine Route als gefahren markieren müssen, damit sie sich selbst verifiziert. Niedriger für junge Regionen, in denen Routen sonst nie aus der Warteschlange kämen.'
      moderation_retention_months:
        label: 'Aufbewahrung entschiedener Einträge (Monate)'
        help: 'Wie lange entschiedene Korrekturen und Einreichungen aufbewahrt werden, bevor der Aufräumlauf sie löscht. Die Moderationsentscheidung selbst bleibt in jedem Fall erhalten.'
      media_urgent_breaker_hourly:
        label: 'Budget für automatisches Zurückhalten: pro Stunde'
        help: 'Wie viele Fotos eine anonyme Meldung „intime Aufnahme oder ein Kind" in einer Stunde von selbst von der Karte verbergen darf. Verbergen ist nicht entfernen — nur eine kuratierende Person entfernt ein Foto. Über diesem Budget erreichen Meldungen weiterhin den Moderationsplatz, verbergen aber nichts mehr, und du bekommst eine E-Mail. Auf 0 setzen, um das automatische Verbergen bei einem anhaltenden Angriff ganz abzuschalten.'
      media_urgent_breaker_daily:
        label: 'Budget für automatisches Zurückhalten: pro Tag'
        help: 'Dieselbe Obergrenze über einen Tag gemessen, damit ein langsames Tröpfeln nicht schafft, woran eine Welle scheitert. Beide Budgets brauchen Spielraum, bevor eine Meldung ein Foto von selbst verbergen kann.'
      app_alert_emails:
        label: 'Empfänger von Warnungen'
        help: 'Kommagetrennte E-Mail-Adressen, die betriebliche Warnungen erhalten: das Öffnen des Schutzschalters und jede Eskalation mutmaßlich illegaler Inhalte. Ändere sie, wenn die übliche Person abwesend ist — eine Eskalation muss noch am selben Tag jemanden erreichen. Mindestens eine gültige Adresse ist erforderlich.'
      app_support_emails:
        label: 'Support-Empfänger'
        help: 'Kommagetrennte E-Mail-Adressen, die Nachrichten aus dem Kontaktformular und Fehlermeldungen erhalten. Getrennt von den Alert-Empfängern oben, damit Eingangstür und Pager auf verschiedene Personen zeigen können. LEER lassen, um auf die Alert-Empfänger zurückzufallen.'
