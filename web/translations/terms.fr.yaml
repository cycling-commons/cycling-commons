  h1_accepting: 'Acceptation de ces conditions'
  accepting_p1_pre: 'En utilisant le site web Cycling Commons ou en créant un compte, vous acceptez ces conditions et notre'
  accepting_p1_privacy: 'Politique de confidentialité'
  accepting_p1_mid: '. Si vous n''acceptez pas, veuillez ne pas utiliser le service. Le Commons est exploité par'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' aux Pays-Bas. La façon dont le projet est dirigé, et où il va, est décrite sur notre page de'
  accepting_p1_governance: 'gouvernance'
  accepting_p1_post: '.'
  h2_who: 'Qui peut l''utiliser'
  who_body: 'Vous devez avoir au moins <b>16</b> ans pour créer un compte. Les informations que vous nous fournissez (comme votre email) doivent être exactes et vous appartenir.'
  h3_account: 'Votre compte'
  account_password: 'Gardez votre mot de passe en sécurité ; vous êtes responsable de l''activité sous votre compte.'
  account_unauthorised: 'Signalez-nous rapidement tout accès non autorisé suspecté.'
  account_suspend: 'Nous pouvons suspendre ou supprimer un compte utilisé de manière abusive ou pour enfreindre ces conditions, comme l''explique la section 11.'
  h4_using: 'Une utilisation responsable'
  using_intro: 'Le Commons fonctionne parce que les gens l''utilisent de bonne foi.'
  using_no_illegal: 'N''enfreignez pas la loi, ne harcelez personne et ne publiez pas de contenu illicite, trompeur ou nuisible.'
  using_no_personal: 'Ne téléversez pas de <b>données personnelles sur d''autres personnes</b> (par exemple, des personnes identifiables sur des photos) sans base légale appropriée: le Commons cartographie les lieux, pas les personnes.'
  using_no_reidentify_pre: 'N''essayez pas de ré-identifier des contributeurs ni de compromettre la'
  using_no_reidentify_link: 'frontière de collecte'
  using_no_reidentify_post: ' du projet qui maintient les données personnelles à l''écart.'
  using_no_scrape_pre: 'Ne récupérez pas le service par scraping. La'
  using_no_scrape_link: 'page développeurs'
  using_no_scrape_post: ' indique comment obtenir les données, et pour un usage en masse ou hors ligne, il existe un'
  using_no_scrape_export_link: 'export gratuit'
  using_no_scrape_mid: '. Si ce qu''il vous faut n''y est pas, écrivez-nous via la'
  using_no_scrape_contact_link: 'page de contact'
  using_no_scrape_end: ' et nous verrons ce que nous pouvons faire.'
  using_no_disrupt: 'Ne perturbez pas le service et ne contournez pas ses limites.'
  h5_contributions: 'Vos contributions'
  contributions_p1_pre: 'Vous conservez la paternité de ce que vous contribuez. Pour que le Commons reste ouvert, vous accordez les licences de nos'
  contributions_p1_link: 'conditions de contribution'
  contributions_p1_mid: ': les <b>données</b> rejoignent le Commons sous la licence'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', les <b>médias</b> (photos, vidéos) sous'
  contributions_p1_mid3: ', et le <b>code, l''interface et les traductions</b> sous'
  contributions_p1_agpl: 'AGPL-3.0-only'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Vous confirmez avoir le droit de contribuer ce que vous soumettez, que cela ne viole pas les droits de tiers, et qu''il ne s''agit pas de données personnelles sur d''autres personnes.'
  h6_opendata: 'Données ouvertes & API'
  opendata_pre: 'Les données et les médias du Commons sont librement utilisables par tous, usage commercial compris, sous leurs'
  opendata_link: 'licences'
  opendata_mid: ', avec attribution. Le code, l''interface et les traductions sont eux aussi librement utilisables, sous AGPL-3.0-only, qui demande le code source plutôt que le seul crédit. Consultez la'
  opendata_dev_link: 'documentation développeur'
  opendata_post: ' pour la ligne d''attribution et les façons actuelles d''obtenir les données.'
  opendata_export_pre: 'Pour un usage en masse ou hors ligne, téléchargez notre'
  opendata_export_link: 'export gratuit'
  opendata_export_post: '. Il contient les lieux et les itinéraires du Commons au format GeoJSON, sous l''ODbL 1.0 pour la base de données et la DbCL 1.0 pour son contenu. Chaque enregistrement indique sa source, et ceux dont la licence ne nous permet pas de les transmettre sont laissés de côté. Il ne contient aucune donnée personnelle, rien qui attende encore un curateur, et aucune photo.'
  h7_code: 'Notre code & notre marque'
  code_pre: 'Le code source de la plateforme est un <b>logiciel libre</b> sous la'
  code_link: 'GNU Affero General Public License v3'
  code_post: ' : n''importe qui peut l''exécuter, l''étudier, le modifier et le partager, usage commercial compris. Ce que la licence demande en retour, c''est le code source. Faites tourner une version modifiée et laissez des gens s''en servir par le réseau, et vous devez à ces gens votre code source aussi. Le nom "Cycling Commons" et le logo ne sont <b>pas</b> couverts par cette licence et restent au projet, ce que l''article 7(e) de l''AGPL autorise expressément. Ce que vous pouvez en faire est précisé dans notre'
  code_brand_link: 'politique de marque'
  code_brand_post: '.'
  h8_preview: 'Une intention, pas une garantie'
  preview_body: 'Le Cycling Commons est une intention, <b>pas</b> une garantie. Ne vous y fiez pas pour l''itinéraire, l''état des routes ou votre sécurité sur la route. Utilisez toujours votre propre jugement à vélo.'
  h9_warranty: 'Absence de garantie'
  warranty_body: 'Le service est fourni <b>"tel quel"</b> et "tel que disponible", sans garantie d''aucune sorte, dans toute la mesure permise par la loi. Nous ne garantissons pas qu''il sera exact, ininterrompu ou exempt d''erreurs.'
  h10_liability: 'Responsabilité'
  liability_body: 'Dans toute la mesure permise par le droit néerlandais, BikeCoders n''est pas responsable des pertes indirectes ou consécutives découlant de votre utilisation du Commons. Rien dans ces conditions ne limite une responsabilité qui ne peut être limitée par la loi.'
  h11_suspension: 'Fermeture et suppression des comptes'
  suspension_pre: 'Vous pouvez fermer votre compte à tout moment dans'
  suspension_link: 'les paramètres'
  suspension_post: '.'
  suspension_dormant: 'Un compte auquel personne ne s''est connecté depuis <b>24 mois</b> est supprimé de la même façon. Nous vous écrivons d''abord trois fois, après 12, 22 et 23 mois, et une seule connexion suffit à le garder. Un compte dont l''adresse e-mail n''est pas confirmée dans les <b>7 jours</b> est supprimé sans avertissement, car l''adresse peut appartenir à quelqu''un qui ne s''est jamais inscrit.'
  suspension_p2: 'Avant de partir, vous pouvez <b>télécharger tout ce que nous détenons à votre sujet</b> dans un seul fichier ZIP depuis la même page. La fermeture de votre compte supprime aussitôt vos données personnelles du site ; nos sauvegardes chiffrées les conservent au plus 90 jours, comme l''explique la politique de confidentialité. Vos candidatures de curateur partent avec lui. Une demande d''ouverture d''un pays ne reste que comme un décompte anonyme, sans votre note ni votre proposition d''en être curateur. Certaines choses restent, sans lien avec votre compte : ce que vous avez donné à la carte ouverte, vos confirmations et vos marques « Je l''ai roulé » (sauf sur un itinéraire que vous avez proposé vous-même, où elles n''ont jamais compté et sont supprimées), l''historique des modifications, vos rapports de bug, et l''enregistrement de l''octroi d''une licence photo, que nous conservons comme preuve de l''existence de la licence. Les photos approuvées restent dans le Commons sous CC BY-SA 4.0. Si votre profil est public, vous choisissez au moment de partir si elles gardent votre nom affiché ; sinon elles deviennent anonymes. Ce qui est sous conservation légale, par exemple parce que cela pourrait devoir être transmis aux autorités, est gardé jusqu''à la levée de cette conservation.'
  suspension_admin: 'Un administrateur peut <b>suspendre</b> un compte de 1 à 365 jours, ou le <b>supprimer</b>, s''il est utilisé de manière abusive, pour enfreindre ces conditions, ou pour nuire au Commons ou à ceux qui l''utilisent. Le motif est toujours l''un de ceux-ci : abus, spam, contenu illicite, usage du service contraire à ces conditions (par exemple le récupérer par scraping, le perturber ou contourner ses limites), informations de compte inexactes ou qui ne sont pas les vôtres, contributions fausses, publicité, ou données personnelles sur d''autres personnes. Tant qu''une suspension dure, vous ne pouvez pas vous connecter, et une session déjà ouverte prend fin. Elle se termine d''elle-même à la date et à l''heure que nous vous indiquons. Ce que vous avez ajouté reste en place, et les 24 mois au bout desquels un compte inutilisé est supprimé se comptent à partir de la fin de la suspension. Une suppression est immédiate, et elle efface le compte de la même façon que si vous le fermiez vous-même.'
  suspension_told: 'Dans les deux cas, nous vous envoyons par e-mail un exposé des motifs : ce que nous avons décidé, le motif, les faits, si des signalements y ont mené, et comment le contester. Après une suppression, il part à votre adresse juste après l''effacement du compte. Si vous pensez que nous nous sommes trompés, répondez à cet e-mail ou écrivez-nous via la page de contact ; nous réexaminons la décision et vous disons ce que nous avons décidé.'
  h12_moderation: 'Comment fonctionne la modération'
  mod_intro: 'Le Commons est fait de ce que les cyclistes ajoutent, donc une partie doit être vérifiée. Cette section dit ce que nous retirons, qui décide, ce qui vous est dit et ce que vous pouvez y faire.'
  mod_standard_h: 'Ce qui est retiré'
  mod_std1: '<b>Tout ce qui est illicite.</b> Y compris ce qui porte atteinte aux droits d''autrui.'
  mod_std2: '<b>Des données personnelles sur autrui.</b> Le Commons cartographie des lieux, pas des personnes. Une personne reconnaissable sur une photo, un nom, une plaque, une maison désignée comme le domicile de quelqu''un.'
  mod_std3: '<b>Des choses simplement fausses.</b> Un point d''eau qui n''a jamais existé, un revêtement qui ne correspond pas au terrain, un col inventé pour truquer un classement.'
  mod_std4: '<b>Les abus.</b> Harcèlement, menaces, ou contenu visant une personne plutôt qu''un lieu.'
  mod_std5: '<b>La publicité.</b> Le Commons n''est pas un annuaire, et un lieu n''y figure pas parce que quelqu''un a payé ou demandé.'
  mod_std6: '<b>Des photographies qui n''en sont pas.</b> Une image produite ou substantiellement modifiée par une IA, si réussie soit-elle. Le Commons est une carte du monde réel, et l''image d''un lieu qui n''a jamais ressemblé à cela vaut moins que pas d''image du tout.'
  mod_std7: '<b>Des images intimes, ou une photo qui montre un enfant.</b> Une photo signalée pour ce motif est d''abord masquée puis examinée, comme l''explique « Qui décide ».'
  mod_std8: '<b>Une propriété privée qui ne devrait pas être publique.</b> Une allée privée, un jardin, une vue sur l''intérieur d''une maison. La photo a peut-être été prise légalement ; un curateur examine quand même la demande du propriétaire.'
  mod_std9: '<b>L''œuvre de quelqu''un d''autre.</b> Une photo ou un texte que vous n''avez pas créé et que vous ne pouvez pas partager sous nos licences. Le titulaire des droits peut le signaler comme son œuvre, et la personne qui l''a ajouté peut répondre une fois.'
  mod_accept: 'Un curateur vérifie ce que les cyclistes envoient. Un ajout doit être exact, vérifiable et faire partie de ce que le Commons cartographie ; un curateur refuse ce qui ne l''est pas. Quand deux entrées décrivent le même lieu, un curateur en garde une et retire l''autre de la carte.'
  h13_ai: 'Là où des machines interviennent'
  ai_intro: 'Liste courte, et nous préférons vous la donner plutôt que vous laisser deviner :'
  ai_translation: '<b>Traduction automatique.</b> Certaines descriptions de lieux sont traduites automatiquement depuis une autre langue. Chacune est signalée comme telle là où elle s''affiche, car une traduction automatique de col peut être fausse d''une manière qui se lit parfaitement.'
  ai_none: '<b>Rien d''autre.</b> Pas de robot conversationnel, pas de texte généré présenté comme le nôtre, et aucun profilage. Les rares choses que le logiciel fait seul, comme refuser un fichier infecté ou supprimer un compte jamais confirmé, sont listées sous « Qui décide » à la section 12. Si cette liste s''allonge un jour, ces sections changeront les premières.'
  ai_checks: '<b>Vérifications automatiques.</b> Un logiciel cherche ce qui semble faux, comme deux fontaines à un mètre l''une de l''autre, un lieu qui pourrait être le même qu''un objet d''OpenStreetMap, ou un lien qui figure sur une liste de sites dangereux, et soumet ce qu''il trouve à un curateur. Il signale ; un curateur décide.'
  ai_uploads: '<b>Ce que vous ne pouvez pas envoyer.</b> Aucune image produite par une IA, et aucune scène modifiée. Les retouches ordinaires vont très bien, avec ou sans outils d''IA : recadrer, redresser, régler les couleurs, accentuer la netteté, réduire le bruit. Inventer ou faire disparaître ce qui était là, non, et une image fabriquée par un modèle non plus. Flouter les visages et les plaques d''immatriculation est permis, et bienvenu. Le consentement que vous cochez avant l''envoi dit la même chose, et une photo qui ne le respecte pas peut être retirée.'
  ai_stance: 'Nous ne revendiquons par là aucune conformité. Le règlement européen sur l''IA contient des règles de transparence, et leur portée sur la description d''une fontaine est discutable. Nous vous le disons parce qu''une carte ne vaut que si vous pouvez distinguer ce qu''une personne y a mis.'
  mod_who_h: 'Qui décide'
  mod_who: 'Un <b>curateur</b> ou un <b>administrateur</b> décide, toujours une personne. Ils travaillent selon un règlement écrit, et chaque décision est enregistrée à leur nom.'
  mod_escalate: '<b>Menaces pour la vie ou la sécurité.</b> Quand un contenu laisse soupçonner une infraction qui menace la vie ou la sécurité de quelqu''un, un curateur le transmet à un administrateur. Une photo ou une soumission est aussitôt masquée et placée sous conservation légale. L''administrateur informe la police ou l''autorité judiciaire du pays concerné, ou des Pays-Bas quand ce n''est pas clair, et lui transmet ce que nous détenons et dont elle a besoin, ce qui peut inclure les données du compte de son auteur. Le contenu est conservé jusqu''à ce que cette autorité dise qu''il peut disparaître.'
  mod_automated: '<b>Ce que le logiciel fait seul.</b> La plupart des contrôles automatiques ne font que signaler des éléments à une personne (section 13). Ceux-ci agissent sans attendre personne :'
  mod_auto_files: '<b>Fichiers.</b> Chaque fichier que vous envoyez est analysé contre les logiciels malveillants et vérifié avant d''être publié. Un fichier infecté, illisible, ou hors des formats et tailles que nous acceptons est refusé, et vous en êtes informé.'
  mod_auto_scenic: '<b>Points de vue.</b> Une photo sur un point de vue doit montrer la vue depuis cet endroit. Si elle a été prise à plus de 250 m de l''épingle, ou si nous ne pouvons pas savoir où elle a été prise, elle reste masquée sur ce lieu jusqu''à ce qu''un curateur confirme qu''elle a été prise là.'
  mod_auto_urgent: '<b>Signalements urgents.</b> Un signalement d''image intime ou concernant un enfant masque la photo immédiatement, avant qu''une personne ait vu le signalement, et un curateur l''examine ensuite. Cela protège les personnes ; cela ne les juge pas. Ce masquage automatique a des limites, pour que le formulaire ne puisse pas servir à retirer des photos en masse ; un signalement au-delà passe en tête de la liste des curateurs, et un administrateur est alerté.'
  mod_auto_accounts: '<b>Comptes.</b> Les comptes non confirmés et les comptes inutilisés depuis 24 mois sont supprimés, comme l''explique la section 11. Trop d''échecs de connexion bloquent un moment la connexion à un compte.'
  mod_told_h: 'Ce qui vous est dit'
  mod_told_pre: 'Quand une décision restreint quelque chose que vous avez ajouté, nous vous envoyons un exposé des motifs, dans vos'
  mod_told_link: 'messages'
  mod_told_post: ' et par e-mail. Cela vaut pour une soumission, un itinéraire ou une traduction qu''un curateur refuse ; une photo retirée ; une photo masquée après un signalement urgent, une fois qu''un curateur l''a examinée, y compris quand elle revient ensuite sur la carte ; des photos qu''un curateur écarte en décidant du reste ; un lieu ou un itinéraire retiré de la carte, y compris quand un curateur garde une autre entrée comme le même lieu ; une contribution mise à la corbeille pour abus ; un signalement retenu sur quelque chose que vous avez ajouté ; et un fichier refusé par nos contrôles d''envoi. L''exposé dit ce qui a été décidé et ce que cela couvre, les faits, si un signalement en est à l''origine, si notre logiciel a agi seul, la règle ou la loi sur laquelle la décision repose, et comment la contester. Un curateur qui refuse quelque chose écrit toujours une note, et l''exposé la cite.'
  mod_told_p2: 'Une question d''un curateur sur ce que vous avez envoyé, ou une photo rétablie après un signalement, vous parvient aussi dans vos messages. Certaines décisions n''envoient rien. Une soumission qu''un curateur met à la corbeille comme spam part sans message, comme le permet le règlement européen sur les services numériques ; elle peut être restaurée pendant 30 jours. Ce qui est sous conservation pour les autorités ne donne lieu à aucun exposé tant que dure la conservation ; la décision qui suit, si. Une modification par un curateur ou un autre cycliste n''envoie rien, car elle ne restreint rien de ce qui est à vous. Un exposé sur un lieu va au cycliste dont un curateur a approuvé le nouveau lieu ; un lieu venu d''OpenStreetMap ou d''une autre source n''a pas d''auteur à prévenir. Les textes de région et les fiches de ville n''ont pas d''auteur unique, donc une modification n''y atteint personne.'
  mod_appeal_h: 'Si vous n''êtes pas d''accord'
  mod_appeal_pre: 'Répondez à l''e-mail qui vous a apporté l''exposé, avec sa référence, et nous réexaminons la décision. Si rien ne vous est parvenu, si vous préférez ne pas répondre par e-mail, ou si vous n''avez plus de compte, écrivez-nous via la'
  mod_appeal_link: 'page de contact'
  mod_appeal_post: '. Une décision n''est pas définitive parce qu''elle a été prise une fois ; un curateur qui s''est trompé peut la changer.'
  mod_report_h: 'Signaler quelque chose'
  mod_report_pre: 'N''importe qui peut signaler un contenu, avec ou sans compte. Utilisez la'
  mod_report_link: 'page de contact'
  mod_report_post: ', ou le lien de signalement sur la page ou sur la photo elle-même. Un signalement demande une adresse e-mail, sauf celui qui concerne une image intime ou un enfant, que vous pouvez envoyer sans. Quand nous avons une adresse (connecté, c''est celle de votre compte), nous accusons réception du signalement et nous vous disons ce que nous avons décidé.'
  mod_report_p2: 'Le formulaire propose les motifs ci-dessus, et « Autre chose » pour ce qui n''y entre pas. Un curateur qui donne suite à « Autre chose » nomme d''abord la règle enfreinte.'
  h14_governing: 'Droit applicable'
  governing_body: 'Ces conditions sont régies par le droit des <b>Pays-Bas</b>, et les litiges relèvent des tribunaux néerlandais compétents. Si vous utilisez le Commons en tant que consommateur et vivez dans l''UE, vous gardez la protection du droit impératif de votre pays, et vous pouvez porter un litige devant les tribunaux de votre lieu de résidence. Nous ne pouvons agir contre vous que devant ceux-ci.'
  h15_changes: 'Modifications'
  changes_body: 'Quand ces conditions changent, nous ajoutons ici une nouvelle version, avec sa date et ce qui a changé, et nous affichons un avis aux cyclistes connectés jusqu’à ce qu’ils l’aient lue. Un changement important, comme une nouvelle règle ou un changement de vos droits, est aussi envoyé par e-mail à chaque compte au moins 30 jours avant de s’appliquer, pour que vous puissiez le lire et fermer votre compte d’abord si vous n’êtes pas d’accord. Continuer à utiliser le Commons après l’entrée en vigueur d’un changement signifie que vous l’acceptez.'
  changes_included: 'Ces conditions incluent trois autres textes : les conditions de contribution (section 5), la politique de marque (section 7), et la page des licences avec les textes de licence vers lesquels elle renvoie. Un changement important de l''un d''eux est annoncé comme un changement de ces conditions, par e-mail au moins 30 jours avant de s''appliquer. Les corrections de forme, comme une faute de frappe ou un lien cassé, s''appliquent aussitôt.'
  changes_versions_pre: 'Voir'
  changes_versions_link: 'l''historique des révisions'
  changes_versions_post: ' sur GitHub.'
  h16_contact: 'Contact'
  contact_pre: 'Questions sur ces conditions :'
  contact_post: '.'
  contact_poc_pre: 'Notre'
  contact_poc_link: 'page de contact'
  contact_poc_post: ' est notre point de contact unique pour les cyclistes et pour les autorités, y compris au titre du règlement européen sur les services numériques. Vous pouvez nous écrire en anglais, en français, en néerlandais, en allemand ou en espagnol.'
  footer_disc_pre: 'Voir aussi notre'
  footer_disc_privacy: 'Politique de confidentialité'
  footer_disc_mid: 'et les licences des données, médias, code, interface et traductions'
  footer_disc_licences: 'licences'
  footer_disc_post: '.'
  change:
    v2_data: 'Obtenir les données : les conditions renvoient à la page développeurs, qui indique comment les obtenir, au lieu de dire ce qui est en service, et nomment l''export gratuit pour un usage en masse ou hors ligne. Le scraping reste interdit.'
    v2_code: 'Contributions : le code, l''interface et les traductions sont nommés ensemble, tous sous AGPL-3.0-only.'
    v2_backups: 'Fermer un compte : les conditions disent que nos sauvegardes chiffrées conservent les données personnelles au plus 90 jours, comme le disait déjà la politique de confidentialité.'
    v2_notice: 'Comment nous vous informons des changements : un changement important vous est envoyé par e-mail au moins 30 jours avant de s’appliquer, et un plus petit reçoit une nouvelle version ici.'
    v2_more: 'Modération et comptes : les conditions listent tous les motifs qu''un signalement peut invoquer, ce que le logiciel fait seul, ce qui vous est dit après une décision, quand un compte est supprimé, et qu''un consommateur garde le droit et les tribunaux de son pays.'
    v2_reasons: 'Ce qui vous est dit : quand une décision restreint quelque chose que vous avez ajouté, vous recevez un exposé des motifs dans vos messages et par e-mail, avec les faits, la règle et la façon de le contester. Les conditions disent aussi ce qu''un curateur n''accepte pas.'
    v2_suspension: 'Suspension : un administrateur peut désormais suspendre un compte de 1 à 365 jours, et pas seulement le supprimer. Les conditions listent les motifs, et chacune de ces décisions s''accompagne d''un exposé des motifs par e-mail.'
    v2_authorities: 'Menaces pour la vie ou la sécurité : les conditions disent comment un tel contenu est conservé et comment un administrateur informe la police ou une autorité judiciaire.'
    v2_included: 'Textes inclus : les conditions de contribution, la politique de marque et la page des licences font partie des conditions, et un changement important de ces textes est annoncé de la même façon.'
    v1_first: 'La première version numérotée. Les formulations antérieures figurent dans l’historique des révisions indiqué ci-dessous.'
