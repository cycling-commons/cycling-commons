# The terms of use in English: the whole page in one file, outside the `messages`
# domain the in-site translation system reads (docs/specs/translations.md §6). This
# file's history is the record of every change to the page in English.
terms:
  kicker: 'Terms of Use'
  title: 'The deal, in plain language.'
  lead: 'These terms cover using the Cycling Commons website and account, in plain language.'
  version_line: 'Version %n% · %date%'
  changed_bar: 'Our terms of use changed on %date%.'
  changing_bar: 'Our terms of use change on %date%.'
  changed_read: 'Read what changed'
  upcoming_box: 'A new version applies from %date%.'
  upcoming_link: 'Read the new version'
  next_box: 'This is the new version. It applies from %date%.'
  next_back: 'Read the version that applies now'
  h1_accepting: 'Accepting these terms'
  accepting_p1_pre: 'By using the Cycling Commons website or creating an account, you agree to these terms and to our'
  accepting_p1_privacy: 'Privacy notice'
  accepting_p1_mid: '. If you don''t agree, please don''t use the service. The Commons is operated by'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' in the Netherlands. How the project is run, and where it is heading, is on our'
  accepting_p1_governance: 'governance page'
  accepting_p1_post: '.'
  h2_who: 'Who can use it'
  who_body: 'You need to be at least <b>16</b> to create an account. The information you give us (such as your email) must be accurate and yours to use.'
  h3_account: 'Your account'
  account_password: 'Keep your password safe; you''re responsible for activity under your account.'
  account_unauthorised: 'Tell us promptly if you suspect unauthorised access.'
  account_suspend: 'We may suspend or remove an account that is used for abuse or to break these terms, as section 11 explains.'
  h4_using: 'Using it well'
  using_intro: 'The Commons works because people use it in good faith.'
  using_no_illegal: 'Do not break the law, harass others, or post unlawful, misleading, or harmful content.'
  using_no_personal: 'Do not upload <b>personal data about other people</b> (for example, identifiable individuals in photos) without a proper basis: the Commons maps places, not people.'
  using_no_reidentify_pre: 'Do not try to re-identify contributors or undermine the project''s'
  using_no_reidentify_link: 'sensing boundary'
  using_no_reidentify_post: ' that keeps personal data out.'
  using_no_scrape_pre: 'Do not scrape the service. The'
  using_no_scrape_link: 'developer page'
  using_no_scrape_post: ' lists the ways to get the data, and for bulk or offline use there is a'
  using_no_scrape_export_link: 'free export'
  using_no_scrape_mid: '. If what you need is not there, write to us on the'
  using_no_scrape_contact_link: 'contact page'
  using_no_scrape_end: ' and we will see what we can do.'
  using_no_disrupt: 'Do not disrupt the service or work around its limits.'
  h5_contributions: 'Your contributions'
  contributions_p1_pre: 'You keep authorship of what you contribute. To let the Commons be open, you grant the licences in our'
  contributions_p1_link: 'contributor terms'
  contributions_p1_mid: ': <b>data</b> joins the Commons under the'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', <b>media</b> (photos, video) under'
  contributions_p1_mid3: ', and <b>code, user interface and translations</b> under'
  contributions_p1_agpl: 'AGPL-3.0-only'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'You confirm that you have the right to contribute what you submit, that it doesn''t infringe anyone else''s rights, and that it isn''t personal data about other people.'
  h6_opendata: 'Open data & the API'
  opendata_pre: 'The Commons data and media are free for anyone to use, commercial use included, under their'
  opendata_link: 'licences'
  opendata_mid: ', with attribution. The code, user interface and translations are free to use too, under AGPL-3.0-only, which asks for source rather than credit alone. See the'
  opendata_dev_link: 'developer docs'
  opendata_post: ' for the attribution line and the current ways to get the data.'
  opendata_export_pre: 'For bulk or offline use, download the'
  opendata_export_link: 'free export'
  opendata_export_post: '. It holds the places and routes of the Commons as GeoJSON, under the ODbL 1.0 for the database and the DbCL 1.0 for its contents. Each record names its source, and records whose licence does not let us pass them on are left out. It holds no personal data, nothing still waiting for a curator, and no photos.'
  h7_code: 'Our code & brand'
  code_pre: 'The platform source is <b>free software</b> under the'
  code_link: 'GNU Affero General Public License v3'
  code_post: ': anyone may run it, study it, change it and share it, commercial use included. What the licence asks back is source. Run a changed version and let people use it over a network, and you owe those people your source too. The "Cycling Commons" name and logo are <b>not</b> covered by that licence and stay with the project, which AGPL section 7(e) expressly allows. What you may do with them is set out in our'
  code_brand_link: 'trademark policy'
  code_brand_post: '.'
  h8_preview: 'An intent, not a guarantee'
  preview_body: 'The Cycling Commons is an intent, <b>not</b> a guarantee. Don''t rely on it for routing, road conditions, or your safety on the road. Always use your own judgement when riding.'
  h9_warranty: 'No warranty'
  warranty_body: 'The service is provided <b>"as is"</b> and "as available", without warranties of any kind, to the fullest extent permitted by law. We don''t guarantee it will be accurate, uninterrupted, or error-free.'
  h10_liability: 'Liability'
  liability_body: 'To the fullest extent permitted by Dutch law, BikeCoders is not liable for indirect or consequential loss arising from your use of the Commons. Nothing in these terms limits liability that cannot be limited by law.'
  h11_suspension: 'Closing and removing accounts'
  suspension_pre: 'You can close your account at any time in'
  suspension_link: 'settings'
  suspension_post: '.'
  suspension_dormant: 'An account nobody has signed into for <b>24 months</b> is deleted in the same way. We email you first, three times, after 12, 22 and 23 months, and signing in once is enough to keep it. An account whose email address is not confirmed within <b>7 days</b> is deleted without a warning, because the address may belong to someone who never signed up.'
  suspension_p2: 'Before you go, you can <b>download everything we hold about you</b> as a single ZIP file from the same page. Closing your account removes your personal data from the site at once; our encrypted backups keep it for at most 90 days, as the privacy notice explains. Your curator applications are deleted with it. A request to open a country stays only as an anonymous count, without your note or your offer to curate. Some things stay, without a link to your account: what you gave to the open map, your confirmations and "I rode this" marks (except on a route you proposed yourself, where they never counted and are deleted), the edit history, your bug reports, and the record that you granted a photo licence, which we keep as evidence that the licence exists. Photos that were approved stay in the Commons under CC BY-SA 4.0. If your profile is public, you choose on your way out whether they keep your display name; otherwise they become anonymous. Anything under a legal hold, for example because it may have to go to the authorities, is kept until the hold is lifted.'
  suspension_admin: 'An administrator may <b>suspend</b> an account for 1 to 365 days, or <b>remove</b> it, when it is used for abuse, to break these terms, or to harm the Commons or the people who use it. The ground is always one of these: abuse, spam, unlawful content, misuse of the service (such as scraping it, disrupting it or working around its limits), account details that are not accurate or not your own, contributions that are not true, advertising, or personal data about other people. While a suspension lasts, you cannot sign in, and a session that is already open ends. It ends by itself at the date and time we give you. What you added stays where it is, and the 24 months after which an unused account is deleted count from the end of the suspension. A removal is immediate, and it deletes the account in the same way as closing it yourself.'
  suspension_told: 'Either way, we email you a statement of reasons: what we decided, the ground, the facts, whether reports led to it, and how to contest it. After a removal, it goes to your address right after the account is deleted. If you think we got it wrong, reply to that email or write to us on the contact page; we look at the decision again and tell you what we decided.'
  h12_moderation: 'How moderation works'
  mod_intro: 'The Commons is built from what riders add, so some of it has to be checked. This section says what we take down, who decides, what you are told, and what you can do about it.'
  mod_standard_h: 'What gets taken down'
  mod_std1: '<b>Anything unlawful.</b> Including content that infringes somebody else''s rights.'
  mod_std2: '<b>Personal data about other people.</b> The Commons maps places, not people. A recognisable person in a photo, a name, a number plate, a house that is identified as somebody''s home.'
  mod_std3: '<b>Things that are simply not true.</b> A water point that was never there, a road surface that does not match the ground, a climb invented to game a ranking.'
  mod_std4: '<b>Abuse.</b> Harassment, threats, or content aimed at a person rather than at a place.'
  mod_std5: '<b>Advertising.</b> The Commons is not a listings site, and a place is not on it because somebody paid or asked.'
  mod_std6: '<b>Photographs that are not photographs.</b> An image generated or materially altered by AI, however good it looks. The Commons is a map of the real world, and a picture of a place that has never looked like that is worse than no picture at all.'
  mod_std7: '<b>Intimate imagery, or a photo that shows a child.</b> A photo reported on this ground is hidden first and checked after, as "Who decides" explains.'
  mod_std8: '<b>Private property that should not be public.</b> A private drive, a garden, a view into somebody''s home. Taking the photo may have been lawful; a curator weighs the owner''s request all the same.'
  mod_std9: '<b>Somebody else''s work.</b> A photo or a text you did not make and may not share under our licences. The rights holder can report it as their work, and whoever added it can answer once.'
  mod_accept: 'A curator checks what riders send. An addition has to be accurate, possible to check, and something the Commons maps; a curator turns down what is not. When two entries describe the same place, a curator keeps one and takes the other off the map.'
  h13_ai: 'Where machines are involved'
  ai_intro: 'Short list, and we would rather you knew it than guessed:'
  ai_translation: '<b>Machine translation.</b> Some place descriptions are translated by machine from another language. Each one is labelled as such where it appears, because a machine translation of a mountain pass can be wrong in ways that read perfectly well.'
  ai_none: '<b>Nothing else.</b> No chatbot, no generated text passed off as ours, and no profiling. The few things software does on its own, such as refusing an infected file or deleting an account nobody confirmed, are listed under "Who decides" in section 12. If that list ever grows, these sections change first.'
  ai_checks: '<b>Automatic checks.</b> Software looks for things that look wrong, such as two taps mapped a metre apart, a place that may be the same as one in OpenStreetMap, or a link on a list of unsafe sites, and puts what it finds in front of a curator. It flags; a curator decides.'
  ai_uploads: '<b>What you may not upload.</b> No AI-generated images, and no altered scenes. Ordinary editing is fine, with AI tools or without: crop it, straighten it, tone it, sharpen it, take the noise out. Inventing or removing something that was there is not, and neither is a picture a model made. Blurring faces and number plates is allowed, and welcome. The consent you tick before uploading says the same, and a photo that breaks it can be removed.'
  ai_stance: 'We are not claiming compliance with anything by writing this. The EU AI Act has transparency rules, and it is arguable how far they reach a description of a water tap. We tell you because a map is only worth having if you can tell what a person put on it.'
  mod_who_h: 'Who decides'
  mod_who: 'A <b>curator</b> or an <b>administrator</b> decides, always a person. They work to a written rulebook, and every decision they make is recorded with their name against it.'
  mod_escalate: '<b>Threats to life or safety.</b> When something suggests a crime that threatens somebody''s life or safety, a curator passes it to an administrator. A photo or a submission is hidden at once and kept under a legal hold. The administrator informs the police or judicial authority of the country concerned, or of the Netherlands when that is not clear, and gives them what we hold that they need, which can include the account details of whoever posted it. The material is kept until that authority says it may go.'
  mod_automated: '<b>What software does on its own.</b> Most automated checks only flag things for a person to look at (section 13). These act without waiting for one:'
  mod_auto_files: '<b>Files.</b> Every file you upload is scanned for malware and checked before it is published. A file that is infected, cannot be read, or is not in a format and size we accept is refused, and you are told.'
  mod_auto_scenic: '<b>Scenic views.</b> A photo on a scenic viewpoint has to show the view from that spot. If it was taken more than 250 m from the pin, or we cannot tell where it was taken, it stays hidden on that place until a curator confirms it was taken there.'
  mod_auto_urgent: '<b>Urgent reports.</b> A report of intimate imagery or of a child hides the photo straight away, before any person has seen the report, and a curator then reviews it. This protects people; it does not judge them. The automatic hiding has limits, so that the report form cannot be used to take photos down in bulk; a report beyond them goes to the top of the curators'' list, and an administrator is alerted.'
  mod_auto_accounts: '<b>Accounts.</b> Unconfirmed accounts and accounts unused for 24 months are deleted, as section 11 explains. Too many failed sign-ins pause signing in to an account for a while.'
  mod_told_h: 'What you are told'
  mod_told_pre: 'When a decision restricts something you added, we send you a statement of reasons, in your'
  mod_told_link: 'messages'
  mod_told_post: ' and by email. That covers a submission, route or translation a curator turns down; a photo that is removed; a photo hidden after an urgent report, once a curator has reviewed it, also when it then goes back on the map; photos a curator leaves out when deciding on the rest; a place or route taken off the map, also when a curator keeps another entry as the same place; a contribution moved to the bin as abuse; a report about something you added that a curator upholds; and a file our upload checks refuse. The statement says what was decided and what it covers, the facts, whether a report led to it, whether our software did it on its own, the rule or the law it rests on, and how to contest it. A curator who turns something down always writes a note, and the statement quotes it.'
  mod_told_p2: 'A curator''s question about something you sent, or a photo put back after a report, also reaches your messages. Some decisions send nothing. A submission a curator moves to the bin as spam goes without a message, as the Digital Services Act allows; it can be restored for 30 days. Something held for the authorities gets no statement while the hold lasts; the decision after it does. An edit by a curator or another rider sends nothing, because it restricts nothing of yours. A statement about a place goes to the rider whose new place a curator approved; a place that came from OpenStreetMap or another source has no author to tell. Region texts and town cards have no single author, so a change to them reaches nobody.'
  mod_appeal_h: 'If you disagree'
  mod_appeal_pre: 'Reply to the email that brought the statement, with its reference, and we look at the decision again. If nothing reached you, if you would rather not reply by email, or if you no longer have an account, write to us on the'
  mod_appeal_link: 'contact page'
  mod_appeal_post: '. A decision is not final because it was made once; a curator who got it wrong can change it.'
  mod_report_h: 'Reporting something'
  mod_report_pre: 'Anyone can report content, with or without an account. Use the'
  mod_report_link: 'contact form'
  mod_report_post: ', or the report link on the page or the photo itself. A report needs an email address, except one about intimate imagery or a child, which you can send without one. When we have an address (signed in, it is your account''s), we confirm we have your report and tell you what we decided.'
  mod_report_p2: 'The form offers the grounds listed above, and "Something else" for anything that does not fit. A curator who acts on "Something else" names the rule it breaks first.'
  h14_governing: 'Governing law'
  governing_body: 'These terms are governed by the law of <b>the Netherlands</b>, and disputes go to the competent Dutch courts. If you use the Commons as a consumer and live in the EU, you keep the protection of the mandatory law of your own country, and you can take a dispute to the courts where you live. We can bring a claim against you only there.'
  h15_changes: 'Changes'
  changes_body: 'When these terms change, we add a new version here, with its date and what changed, and show signed-in riders a notice until they have read it. A significant change, such as a new rule or a change to your rights, is also emailed to every account at least 30 days before it applies, so you can read it and close your account first if you do not agree. Continuing to use the Commons after a change applies means you accept it.'
  changes_included: 'These terms include three other texts: the contributor terms (section 5), the trademark policy (section 7), and the licences page with the licence texts it links. A significant change to any of them is announced in the same way as a change to these terms, by email at least 30 days before it applies. Editorial fixes, such as a typo or a broken link, apply at once.'
  changes_versions_pre: 'View the'
  changes_versions_link: 'revision history'
  changes_versions_post: ' on GitHub.'
  h16_contact: 'Contact'
  contact_pre: 'Questions about these terms:'
  contact_post: '.'
  contact_poc_pre: 'Our'
  contact_poc_link: 'contact page'
  contact_poc_post: ' is our single point of contact for riders and for authorities, including under the EU Digital Services Act. You can write to us in English, French, Dutch, German or Spanish.'
  footer_disc_pre: 'See also our'
  footer_disc_privacy: 'Privacy notice'
  footer_disc_mid: 'and the data, media, code, user interface and translations'
  footer_disc_licences: 'licences'
  footer_disc_post: '.'
  change:
    v2_data: 'Getting the data: the terms point to the developer page, which lists the ways to get it, instead of naming what is live, and name the free export for bulk and offline use. Scraping stays prohibited.'
    v2_code: 'Contributions: code, the user interface and translations are named together, all under AGPL-3.0-only.'
    v2_backups: 'Closing an account: the terms say that our encrypted backups keep the personal data for at most 90 days, as the privacy notice already did.'
    v2_notice: 'How we tell you about changes: a significant change is emailed to you at least 30 days before it applies, and a smaller one gets a new version here.'
    v2_more: 'Moderation and accounts: the terms list every ground a report can name, what software does on its own, what you are told after a decision, when an account is removed or deleted, and that a consumer keeps the law and the courts of their own country.'
    v2_reasons: 'What you are told: when a decision restricts something you added, you get a statement of reasons in your messages and by email, with the facts, the rule and how to contest it. The terms also say what a curator does not accept.'
    v2_suspension: 'Suspension: an administrator may now suspend an account for 1 to 365 days, not only remove it. The terms list the grounds, and either decision comes with a statement of reasons by email.'
    v2_authorities: 'Threats to life or safety: the terms say how such content is held and how an administrator informs the police or a judicial authority.'
    v2_included: 'Texts the terms include: the contributor terms, the trademark policy and the licences page are part of the terms, and a significant change to them is announced in the same way.'
    v1_first: 'The first numbered version. Earlier wording is in the revision history linked below.'
