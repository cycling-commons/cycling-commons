# SPDX-License-Identifier: AGPL-3.0-only
# The privacy notice in Spanish: the whole page in one file, outside the `messages`
# domain the in-site translation system reads (docs/specs/privacy-notice.md). This
# file's history is the record of every change to the page in Spanish.
privacy:
  kicker: 'Privacidad'
  title: 'Qué recogemos y por qué.'
  lead: 'En lenguaje claro. El conjunto de datos de Cycling Commons no es personal: son geodatos abiertos sobre lugares, nunca sobre personas. La <b>cuenta de la plataforma</b> es otra cosa: contiene datos personales (correo electrónico, credenciales, registros de sesión). Esto es lo que guardamos, por qué, y el control que tienes sobre ello.'
  h_responsible: 'Quién es el responsable'
  responsible_p1_pre: 'El responsable del tratamiento es'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', con sede en los Países Bajos, que gestiona hoy el Cycling Commons. Como se explica en nuestra'
  responsible_p1_governance: 'gobernanza'
  responsible_p1_post: ', el Commons se ha comprometido a constituirse como fundación neerlandesa independiente; el responsable cambiará en consecuencia y esta página se actualizará.'
  responsible_p2_pre: 'Preguntas sobre tus datos:'
  responsible_p2_mid: '. También tienes derecho a presentar una reclamación ante la autoridad de control neerlandesa, la'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: '<b>No hemos nombrado delegado de protección de datos (DPD)</b>, y la ley tampoco nos obliga: somos una operación pequeña, no vigilamos a nadie a gran escala y las categorías especiales de datos no forman parte de lo que hacemos (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_37">RGPD art. 37</a>). Las preguntas y solicitudes sobre protección de datos van a la misma dirección que todo lo demás,'
  dpo_post: '. Si eso cambia algún día y nombramos a alguien, esta página dirá quién es.'
  h_collect: 'Qué recogemos'
  collect_intro: 'Pedimos el mínimo necesario para mantener un mapa abierto y responsable. Nunca te pedimos tu nombre real.'
  h3_account: 'Cuando creas una cuenta'
  collect_account_email: 'Tu <b>dirección de correo electrónico</b>, para iniciar sesión, proteger la cuenta y enviarte los mensajes de servicio imprescindibles.'
  collect_account_password: 'Una <b>contraseña</b>. Nunca guardamos la contraseña en sí, solo un hash de ella: una especie de huella que no permite recuperar la contraseña. Cuando inicias sesión, calculamos el hash de lo que escribes de la misma manera y comparamos los dos.'
  collect_account_displayname: 'Un <b>nombre visible</b> que eliges tú. Puede ser un seudónimo, y nunca pedimos tu nombre real. Tu perfil está <b>desactivado por defecto</b>: mientras lo esté, lo que aportas muestra tu <b>seudónimo</b>, por ejemplo rider#k3x9q2mf, en lugar de tu nombre visible. Es el mismo en todo lo que añades, así que otros ven que lo hizo una misma persona, pero no quién eres; juntas, esas contribuciones pueden mostrar más o menos por dónde ruedas. Activa tu perfil y tu nombre visible, tu país, el mes en que te uniste, los tipos de bici y estilos de rodaje que elegiste, tus recuentos de contribuciones y las rutas que propusiste pasan a ser públicos.'
  collect_account_2fa: 'Si activas la <b>autenticación en dos factores (2FA)</b>, guardamos el secreto TOTP <b>cifrado en reposo</b>, y tus códigos de respaldo solo como hashes.'
  collect_account_base: 'Una <b>ubicación base</b> opcional y un radio de rodaje, si los configuras. No guardamos el punto que eliges: guardamos un punto al azar a hasta unos 2,5 km de él, así que el punto guardado no dice mucho más que el municipio. También guardamos el nombre del lugar que elegiste con él, y las regiones y países que alcanza tu radio. Solo adapta lo que ves tú: tu vista del mapa, y valores por defecto como la región con la que se abren la página de lo mejor y la votación. Nunca se muestra a otros ciclistas y nunca forma parte del conjunto de datos del Commons.'
  collect_account_timezone: 'Tu <b>zona horaria</b>, para que las horas que mostramos sean las tuyas: la que eliges en tu configuración o, mientras esté en automático, la que indica tu navegador (por ejemplo Europe/Amsterdam). Es el nombre de una zona, no una ubicación.'
  collect_account_prefs: '<b>Tus ajustes.</b> Tu idioma, unidades y formato de fecha, el tema y el modo del mapa, los tipos de bici y estilos de rodaje que eliges, que deciden lo que el mapa te muestra primero, y los consejos que cerraste. También guardamos la fecha en que confirmaste tener 16 años o más, y la fecha en que entraste por última vez, desde la que cuenta la regla de los 24 meses de <b>Cuánto tiempo lo conservamos</b>.'
  h3_contribute: 'Cuando aportas algo'
  collect_contribute_items: '<b>Todo lo que escribes en el Commons.</b> Un lugar, un puerto, una ruta, una corrección, un voto, una comprobación sobre el terreno, una descripción de región, una traducción, un aviso, un mensaje a una persona curadora: si lo escribiste y lo enviaste, lo tenemos. Cada uno queda vinculado a la cuenta que lo envió, para que un curador pueda responderte. Los mensajes a los curadores y los avisos quedan entre tú y los curadores: nunca aparecen en el mapa ni en el conjunto de datos.'
  collect_contribute_media: 'Las <b>fotos</b> que subes. Una foto puede llevar datos ocultos (EXIF), como dónde se tomó: los quitamos y volvemos a codificar el archivo, así que lo que publicamos no lleva nada de eso. Después escribimos una sola cosa dentro: una marca de que la imagen está bajo CC BY-SA 4.0, y un enlace a su página en Cycling Commons. <b>Tu nombre nunca se escribe en el archivo.</b> Ese enlace es como alguien que reutilice la foto encuentra a quién acreditar, y esa página solo te nombra mientras tu perfil sea público.'
  collect_contribute_traffic: '<b>Resúmenes del tráfico</b>, solo si envías uno desde la revisión de salidas de Scout con un radar trasero. Por cada tramo de vía que recorriste, un resumen contiene: el tramo y tu sentido en él, cuánto recorriste y cuánto tiempo, cuántos coches te adelantaron y a qué velocidad, tu propia velocidad media, la parte del día (noche, hora punta de la mañana, día, hora punta de la tarde o noche temprana), un grupo de al menos cuatro fechas del mismo tipo en lugar de la fecha, el trimestre, y si era laborable o fin de semana. En un carril bici separado contiene cuántos coches vio el radar cerca, en lugar de los coches que te adelantaron. Cada línea lleva además valores de control sacados de la salida, para que la misma salida nunca cuente dos veces. Tu archivo de salida nunca sale de tu dispositivo, y un resumen no contiene ninguna traza GPS; las vías que recorriste, con la parte del día, sí. Nunca se envía en un resumen nada a menos de 500 m del inicio o del final de una salida. Para asignar la salida a las vías, tu navegador carga desde nuestro servidor los datos del mapa de esa zona, como hace el mapa con cualquier zona que miras. Nada de lo que guardamos te nombra ni te codifica. Cada línea espera, cifrada, hasta que su vía tiene suficientes salidas de varios días, y entonces pasa a totales simples por vía; así una salida llega a los totales por partes, mezclada con otras. Los curadores solo ven tranquila, moderada o con mucho tráfico por vía. Los resultados solo los ven los curadores, y nunca con tu nombre. Desde la misma revisión de salidas también puedes enviar las <b>etiquetas</b> que pusiste durante la salida. Una etiqueta envía su lugar en el mapa, que puedes mover antes, el nombre y los detalles que le das, las fotos que añades, y la hora en que la pusiste, de la que solo guardamos la fecha. Una etiqueta para un tramo de vía, como su firme, envía además la parte de tu salida entre los dos extremos que eliges. Cada etiqueta se convierte en una aportación normal y pasa por la misma revisión que cualquier otra. Ambas cosas son opcionales: en cada salida eliges qué envías, y puedes no enviar nada. Scout tendrá más funciones; si alguna cambia lo que se envía, este aviso cambia antes.'
  collect_contribute_rode: '<b>Marcas de "La he hecho".</b> Cuando marcas una ruta como hecha, guardamos la marca con el tipo de bici que elegiste y la fecha. En la ruta solo se muestra cuántos ciclistas la marcaron.'
  collect_contribute_bugs: '<b>Avisos de error.</b> Cuando nos avisas de un error, guardamos lo que escribiste, las capturas de pantalla que añades, la dirección de la página en la que estabas, tu navegador y su versión, el tamaño de tu ventana, y tu dirección de correo si quieres respuesta. Si tienes la sesión iniciada, el aviso queda vinculado a tu cuenta. Un curador puede publicar un error en nuestra página de problemas conocidos y como incidencia en GitHub, con un título y un texto que escribe el curador; tu dirección de correo, la dirección de la página y tus capturas nunca van allí.'
  collect_contribute_curator: '<b>Solicitudes para ser curador y peticiones de país.</b> Si solicitas ser curador, guardamos el país y la zona que pides, lo que escribes sobre ti, un enlace si añades uno, y tu nombre de usuario de OpenStreetMap si lo das. Nuestro servidor busca ese nombre en OpenStreetMap para ver si existe y cuántas ediciones tiene. Si nos pides abrir un país, guardamos el país, la región que nombras, si serías curador allí, y tu nota.'
  collect_contribute_profile: 'Los datos de perfil opcionales que eliges, como tu país, tus tipos de bici y tus estilos de rodaje. Solo aparecen en tu perfil público mientras esté activado. Los perfiles son'
  collect_contribute_profile_link: 'voluntarios'
  collect_contribute_profile_post: ' y están desactivados por defecto.'
  h3_auto: 'De forma automática, al usar el sitio'
  collect_auto_technical: '<b>Datos técnicos</b>: dirección IP, tipo de navegador y marcas de tiempo en los registros del servidor, conservados para operar y proteger el servicio.'
  collect_auto_ratelimit: '<b>Contadores de uso y direcciones codificadas.</b> Para que un solo visitante no pueda agotar una herramienta para todos, ni inundar un formulario, contamos las peticiones. Con la sesión iniciada, contamos sobre tu cuenta. Sin cuenta, la mayoría de los contadores, como el de la comprobación de salidas, cuentan sobre un código sacado de tu dirección IP, que no permite recuperar la dirección. Unos pocos cuentan sobre la dirección en sí: el formulario de avisos, la API pública, los datos de cobertura del mapa, las descargas de la exportación masiva y la comprobación que protege algunos formularios. El mismo tipo de código se guarda con un aviso sobre contenido, un aviso de error o un mensaje de contacto que envías, para que podamos detectar una avalancha. Ese código sigue siendo un dato personal, así que todo lo que dice esta página se le aplica.'
  collect_auto_errors: '<b>Registros de fallos del servidor.</b> Cuando algo falla en nuestro servidor, este escribe un registro del fallo: qué falló, la página, el momento y lo que envió la petición, con las contraseñas y otros secretos ocultos. Dejamos fuera lo que envías en formularios con contenido personal, como el inicio de sesión, tu cuenta y tus mensajes. Un registro de fallo nunca contiene tu dirección IP. Los registros se quedan en nuestras propias máquinas en la UE, con todo lo demás que hacemos funcionar (ver <b>Las empresas que tratan datos por encargo nuestro</b>).'
  banner_bold: 'Sin seguimiento de rutas.'
  banner_body: 'El Commons es un mapa de lugares, no de personas. <b>No</b> seguimos por dónde ruedas y nunca vemos tu ubicación en tiempo real. Solo tenemos una línea que recorriste si la envías a propósito: una ruta que propones, o el tramo de una salida que cubre una etiqueta de Scout. Un resumen del tráfico desde la revisión de salidas de Scout no es una traza GPS, pero sí dice por qué vías pasaste y en qué parte del día, y una marca de "La he hecho" dice que hiciste esa ruta (ver <b>Cuando aportas algo</b>). La comprobación de salidas lee en nuestro servidor un archivo de salida que le das, para encontrar lugares a lo largo del recorrido, y no guarda nada de él.'
  banner_locate: '<b>Mostrar mi ubicación</b> en el mapa lee tu posición en tu propio navegador, solo cuando lo pulsas, y no la envía a ninguna parte: ninguna petición a nosotros ni a nadie la lleva. Después, el mapa carga las imágenes de esa zona, como cada vez que mueves el mapa.'
  h_why: 'Por qué lo usamos (bases jurídicas)'
  why_contract: '<b>Para prestarte la cuenta y el servicio</b>: ejecución de un contrato (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6.1.b</a>).'
  why_consent: '<b>Mostrar tu nombre.</b> Un perfil público, y que se te acredite por tu nombre en lo que aportaste, se basa en tu consentimiento (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6.1.a</a>). Puedes retirarlo cuando quieras en tus'
  why_consent_link: 'ajustes'
  why_consent_post: ', y tu nombre desaparece de esas páginas. Por nuestra parte ocurre al instante. Una copia de página que otra persona guardó queda fuera de nuestro alcance.'
  why_licence: '<b>Publicar lo que aportas.</b> Una foto o una edición que das al Commons se publica bajo la licencia que aceptaste al enviarla, y eso forma parte de nuestro acuerdo contigo (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6.1.b</a>). Esa licencia es <b>irrevocable</b> por sus propios términos: retirar el consentimiento quita tu nombre de la página, pero no despublica la aportación en sí. Hay una excepción que importa: si en la foto sales <b>tú</b>, eso son datos personales tuyos, y una licencia de derechos de autor no firma la renuncia a tus derechos de protección de datos. Cada página de foto lleva un enlace para pedir que se retire. Una foto que no tenías derecho a licenciar nunca tuvo una licencia válida: avísanos por el mismo enlace y también se retira.'
  why_updates: '<b>Contarte las novedades.</b> Solo si lo pediste: el ajuste de tu cuenta es tu consentimiento (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6.1.a</a>), y desactivarlo lo retira. En tus ajustes eliges cada cuánto: <b>solo las grandes novedades</b> o <b>cada actualización</b>. Cada mensaje lleva además un enlace para darte de baja con un clic, sin iniciar sesión. Solo noticias del Commons, nunca publicidad, y la lista nunca se comparte ni se vende.'
  why_legitimate: '<b>Seguridad, prevención de abusos y analítica agregada</b>: nuestro interés legítimo en mantener el Commons honesto y en funcionamiento (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6.1.f</a>).'
  why_legal: '<b>Cumplimiento de obligaciones legales</b>: cuando la ley lo exige (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6.1.c</a>). Eso incluye la exposición de motivos que te debemos cuando restringimos algo que añadiste o tu cuenta (Reglamento de Servicios Digitales, art. 17), y avisar a la policía o a una autoridad judicial de una amenaza para la vida o la seguridad de alguien (mismo Reglamento, art. 18).'
  h_cookies: 'Cookies y analítica'
  cookies_body: 'Aquí vamos ligeros. Ponemos <b>dos cookies</b>, ambas estrictamente necesarias y ambas listadas al completo más abajo. Para las estadísticas de uso alojamos nuestra propia <b>analítica</b> en nuestra propia infraestructura: recibe la URL de la página, el referente, el tamaño de pantalla y el tipo de navegador, y recibe tu <b>dirección IP</b>, que es un dato personal, pero <b>no la guarda</b>. La dirección solo sirve para deducir una ubicación aproximada (país, región y ciudad) y para derivar un identificador de sesión de un solo sentido, y después se descarta. No se instala ninguna cookie de analítica, ningún visitante recibe un identificador persistente ni queda vinculado a una cuenta, y no hay seguimiento entre sitios ni entre dispositivos. Los datos de analítica permanecen en nuestra propia infraestructura y nunca se comparten ni se venden a terceros.'
  h3_cookie_table: 'Las cookies que ponemos'
  ck_h_name: 'Nombre'
  ck_h_purpose: 'Para qué sirve'
  ck_h_life: 'Cuánto dura'
  ck_session_purpose: 'Mantiene tu sesión iniciada y lleva el token que protege los formularios que usas con la sesión iniciada contra la falsificación de petición en sitios cruzados (CSRF), un ataque en el que otra web hace que tu navegador envíe aquí un formulario en tu nombre. Se pone cuando inicias sesión, o cuando usas un formulario que tiene que recordar algo de una página a otra, como restablecer tu contraseña. Leer el mapa y el resto del sitio, incluida la página de contacto, no pone ninguna cookie. Contiene un identificador aleatorio y nada más: ni nombre, ni dirección de correo, ni registro de lo que miraste.'
  ck_session_life: 'Hasta que cierras el navegador'
  ck_remember_purpose: 'Vuelve a iniciar tu sesión en la siguiente visita sin pedirte la contraseña. Se pone <b>solo</b> si marcas <b>Recordarme</b> al iniciar sesión, y se retira al cerrar sesión. No lo recomendamos en un ordenador que usan otras personas.'
  ck_remember_life: '7 días'
  cookies_none_body: 'Esa es la lista completa. No ponemos <b>ninguna</b> cookie publicitaria, <b>ninguna</b> cookie de analítica y <b>ninguna</b> cookie de seguimiento entre sitios, en ninguna página. Las dos de arriba son estrictamente necesarias para darte algo que tú mismo pediste, así que la ley no exige consentimiento, y por eso aquí no hay aviso de cookies. Si algún día añadiéramos algo que sí lo necesita, te lo preguntaríamos antes en lugar de darlo por hecho.'
  cookies_local_body: 'Tu navegador también guarda algunas cosas de este sitio en tu propio dispositivo. En su <b>almacenamiento local</b>: tus preferencias de visualización y de mapa, como el tema, la zona que miraste por última vez, tus filtros y el tamaño de un panel, y una zona de casa si la fijas sin cuenta. Un aviso de error que aún no enviaste se guarda como borrador, con sus capturas, en la base de datos propia del navegador (IndexedDB). Mientras editas, parte del trabajo en curso está en el <b>almacenamiento de sesión</b>, que el navegador borra al cerrar la pestaña. Nada de esto es una cookie. Todo se queda en tu navegador: nunca lo leemos de ahí, y un borrador solo nos llega cuando lo envías. Borrar los datos del navegador lo elimina. Otras webs no pueden leerlo: un navegador mantiene separado el almacenamiento de cada sitio. Aun así, dos cosas pueden leerlo. Cualquier persona que use el mismo navegador en el mismo ordenador, y cualquier script que se ejecute en este sitio, como una extensión del navegador que instalaste. Una zona de casa dice más o menos dónde vives, así que en un ordenador compartido quizá prefieras no fijarla.'
  h_share: 'Con quién lo compartimos'
  share_infra: '<b>Los servicios que sostienen nuestra infraestructura, y los pocos a los que pedimos una comprobación.</b> Alojamiento, copias de seguridad, correo, los servicios de mapa que tu navegador pide directamente, y las comprobaciones que hace nuestro servidor. Cada uno aparece con nombre más abajo, con lo que hace y lo que puede ver.'
  share_osm_pre: 'OpenStreetMap: las aportaciones que decidas devolver pasan a formar parte del mapa abierto bajo la'
  share_osm_link: 'ODbL'
  share_osm_post: '. Eso son datos públicos y abiertos, no datos personales sobre ti.'
  share_authorities: '<b>La policía o una autoridad judicial, cuando la ley lo exige.</b> Si algo publicado en el Commons hace sospechar un delito que amenaza la vida o la seguridad de alguien, tenemos que avisar a la autoridad policial o judicial competente del país afectado, o de los Países Bajos si no está claro (Reglamento de Servicios Digitales, art. 18). Le damos lo que necesita para actuar: lo que vio el curador, la referencia, las fechas, dónde apareció, y los datos que tenemos de la cuenta de quien lo publicó (número de cuenta, nombre visible, dirección de correo y fecha de alta). El material en sí solo se envía si lo pide. La base jurídica es nuestra obligación legal (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6.1.c</a>).'
  share_noone: '<b>Con nadie más.</b> No vendemos datos personales y no usamos seguimiento publicitario de terceros.'
  share_selfhosted: 'Primero, lo que <b>no</b> está en estas listas. Alojamos por nuestra cuenta todo lo que podemos: los datos del mapa, el cálculo de rutas, el modelo de elevación que hay detrás de los desniveles, el almacenamiento de fotos, las estadísticas de uso e incluso los registros de fallos están en nuestras propias máquinas. Dos servicios que antes pedíamos fuera, el de rutas y el de altitud, se vinieron a casa justo por esto. Construirlo así lleva más tiempo y cuesta más. También es la razón de que tu navegador hable con un puñado de servicios externos, cada uno citado abajo, y no con veinte, y de que las tablas de abajo sean tan cortas: cada nombre que aparece en ellas es uno que no podíamos mantener nosotros de forma razonable.'
  h3_processors: 'Las empresas que tratan datos por encargo nuestro'
  processors_intro: 'Las empresas de abajo guardan o manejan tus datos siguiendo nuestras instrucciones. Son nuestros <b>encargados del tratamiento</b>: solo pueden hacer lo que les indicamos, bajo contrato escrito, y no pueden usar tus datos para nada propio.'
  pr_h_who: 'Quién'
  pr_h_where: 'Dónde'
  pr_h_what: 'Qué hacen para nosotros'
  pr_h_sees: 'Qué pueden ver'
  pr_hetzner_where: 'Espacio Económico Europeo'
  pr_hetzner_what: 'Hace funcionar las máquinas: el sitio web, la base de datos, el almacenamiento de las fotos subidas y los registros de fallos.'
  pr_hetzner_sees: 'En principio todo lo que guardamos, porque está en su hardware: tu dirección de correo, tus aportaciones, tus fotos, los registros del servidor y los registros de fallos. Las contraseñas y los secretos de doble factor siguen siendo ilegibles también ahí (ver <b>Cómo lo protegemos</b>).'
  pr_scaleway_where: 'Espacio Económico Europeo'
  pr_scaleway_what: 'Entrega el correo que el sitio te envía, y guarda las copias de seguridad nocturnas.'
  pr_scaleway_sees: 'Tu dirección de correo y el contenido de los mensajes que el sitio te envía. Las copias de seguridad se cifran en nuestros propios servidores antes de salir, así que su contenido no se puede leer al otro lado.'
  pr_proton_where: 'Suiza (amparada por una decisión de adecuación de la UE)'
  pr_proton_what: 'Aloja el buzón del proyecto, la dirección que aparece en esta página, y las respuestas que una persona de aquí te escribe.'
  pr_proton_sees: 'Tu dirección de correo y lo que hayas decidido escribirnos, mientras se conserve la conversación.'
  h3_browser_services: 'Servicios que tu navegador contacta directamente'
  browser_services_intro: 'El mapa se arma en tu navegador, así que algunas piezas vienen directamente de quien las publica en lugar de pasar por nosotros. Nunca les damos tu cuenta, tu nombre visible ni tu dirección de correo. Sí ven la dirección de red desde la que sale tu petición, porque toda petición en internet lleva una. Nada de esta lista se carga hasta que abres una página que lo usa.'
  bs_h_service: 'Servicio'
  bs_h_what: 'Para qué es'
  bs_h_sees: 'Qué recibe'
  bs_sees_ip: 'Tu dirección IP y qué teselas de mapa pediste.'
  bs_openfreemap_what: 'El mapa base: las carreteras, el agua y los nombres de lugar bajo todo lo demás.'
  bs_esri_what: 'La vista por satélite, solo cuando la activas.'
  bs_esri_sees: 'Tu dirección IP y qué teselas de imagen pediste. Esri está en Estados Unidos.'
  bs_mapillary_what: 'Fotos a pie de calle, solo cuando abres la vista de calle.'
  bs_mapillary_sees: 'Tu dirección IP y qué fotos abriste. Mapillary lo opera Meta Platforms Ireland Limited, en Irlanda, y los archivos de imagen vienen de la red de contenido de Meta, que es mundial.'
  bs_photon_what: 'La búsqueda de lugares: en el buscador del mapa, en la búsqueda de lugar del formulario de aportación y en el campo de ubicación base de tus ajustes.'
  bs_photon_sees: 'Tu dirección IP, lo que escribes en una búsqueda de lugar y el idioma de la página. Desde el buscador del mapa, también la región o el país al que se limita la búsqueda. Photon lo opera komoot, en Alemania.'
  browser_services_post: 'Dos de ellos pueden salir del Espacio Económico Europeo (EEE): <b>Esri</b> está en Estados Unidos, y los archivos de imagen de Mapillary vienen de la red mundial de Meta. Si nunca abres la vista de satélite ni la vista de calle, tu navegador no contacta con ninguno de los dos. Ver <b>Transferencias internacionales</b> más abajo.'
  h3_server_services: 'Servicios a los que pregunta nuestro servidor'
  server_services_body: 'Algunas comprobaciones salen de nuestro servidor, así que estos servicios ven la dirección de nuestro servidor, nunca la tuya. Cuando alguien añade un enlace web a un lugar, nuestro servidor puede preguntar a <b>Google Safe Browsing</b>, en Estados Unidos, si ese enlace se conoce como dañino, cuando esa comprobación está activada; solo envía el enlace. Cuando enviamos un error publicado a <b>GitHub</b>, en Estados Unidos, nuestro servidor abre allí una incidencia con el título y el texto públicos del error, que nunca nombran a nadie. Ninguno de estos dos servicios recibe datos personales tuyos. Cuando solicitas ser curador, nuestro servidor busca en <b>OpenStreetMap</b> el nombre de usuario que diste; ese nombre ya es público allí.'
  h_transfers: 'Transferencias internacionales'
  transfers_body: 'Tu cuenta, tus aportaciones, tus fotos y nuestras copias de seguridad se quedan en el Espacio Económico Europeo (EEE). Un puñado de servicios externos pueden ver algo desde fuera, cada uno citado arriba. <b>Proton</b>, en Suiza, aloja nuestro buzón y por eso ve los correos que nos escribes. La UE ha decidido que la ley suiza protege los datos personales tan bien como la ley de la UE (una decisión de adecuación), así que no hace falta ningún contrato adicional. <b>Esri</b>, en Estados Unidos, sirve la vista de satélite. Solo cuando activas esa vista, tu navegador pide las imágenes a Esri, y Esri ve entonces tu dirección IP y qué imágenes pediste. Nosotros no enviamos nada a Esri. Las fotos a pie de calle de Mapillary llegan por la red mundial de Meta, que puede servirlas desde fuera del EEE; ve lo mismo que Esri, y solo cuando abres la vista de calle. Desde nuestro servidor, y nunca con tu dirección IP: <b>Google Safe Browsing</b>, en Estados Unidos, puede recibir los enlaces web que los ciclistas añaden a los lugares, cuando esa comprobación está activada, y <b>GitHub</b>, en Estados Unidos, recibe los errores que publica un curador, tal como el curador los escribió.'
  h_retention: 'Cuánto tiempo lo conservamos'
  retention_account: '<b>Datos de la cuenta.</b> Hasta que borres la cuenta, y entonces desaparecen. El borrado es inmediato: lo pides, te enviamos un código por correo, lo confirmas, y en ese momento la cuenta sale de la base de datos en servicio. La dirección de correo, el hash de la contraseña, el secreto de doble factor y los códigos de respaldo se van con ella. No hay periodo de espera ni se guarda nada por si cambias de idea. Nuestras copias de seguridad nocturnas todavía contienen el registro antiguo hasta que rotan, y eso tarda <b>90 días como máximo</b>; están cifradas y solo se abren para recuperarse de un desastre. Una cuenta en la que nadie ha entrado durante <b>24 meses</b> se borra de la misma manera. Antes te escribimos tres veces: a los 12, 22 y 23 meses, cada vez con la fecha en que se cerrará. Basta con entrar una vez para conservarla. También tras ese borrado, nuestras copias de seguridad guardan el registro antiguo hasta que se renuevan, 90 días como máximo. Si un administrador elimina tu cuenta por incumplir nuestras condiciones, leemos tu dirección de correo justo antes del borrado y la usamos una sola vez, justo después, para enviarte la exposición de motivos. Después desaparece, como en cualquier borrado. Si ese correo no sale, guardamos la dirección con la exposición de motivos hasta que la volvamos a enviar o decidamos no hacerlo, y entonces borramos ambas.'
  retention_unconfirmed: '<b>Cuentas sin confirmar.</b> Una cuenta cuya dirección de correo no se confirma en <b>7 días</b> se borra, sin correo de aviso. La dirección puede ser de alguien que nunca se registró, y el único correo que podríamos enviar le llegaría a esa persona.'
  retention_ratelimit: '<b>Contadores de uso y direcciones codificadas.</b> Un contador caduca solo, como muy tarde dos días después de tu último uso. El contador de descargas de la exportación masiva es la excepción: solo existe en la memoria de nuestro servidor web, nunca se escribe en ningún sitio, y se borra cuando una descarga posterior necesita su sitio o el servidor se reinicia. Una dirección codificada guardada con un aviso sobre contenido o un aviso de error se queda mientras se quede el aviso. La guardada con un mensaje de contacto se borra con el mensaje, dentro de los 24 meses siguientes al cierre de la conversación.'
  retention_logs: '<b>Registros del servidor.</b> Se conservan <b>90 días</b> como máximo y después se eliminan automáticamente. Algunas entradas contienen una dirección IP completa, por seguridad y para atender abusos. Se eliminan dentro de los mismos 90 días. Los registros de fallos también se eliminan dentro de 90 días.'
  retention_contributions: '<b>Aportaciones.</b> Los hechos que devuelves al mapa abierto permanecen como parte del Commons (con su procedencia), incluso después de que te vayas; no son datos personales sobre ti. Tus confirmaciones, tus marcas de "La he hecho" (salvo en una ruta que propusiste tú, donde nunca contaron y se borran) y el historial de tus ediciones también se quedan cuando te vas, sin ningún vínculo con tu cuenta.'
  retention_traffic: '<b>Resúmenes del tráfico.</b> Una línea espera, cifrada, hasta que su vía tiene suficientes salidas, pasa a los totales por vía y se borra. Los totales permanecen como parte del Commons. No contienen ningún ciclista, así que no se borra nada de ellos con tu cuenta.'
  retention_messages: '<b>Mensajes sobre tus aportaciones.</b> Los mensajes entre tú y los curadores sobre lo que aportaste se conservan mientras exista tu cuenta y se borran con ella. Lo mismo ocurre con las exposiciones de motivos que te enviamos cuando una decisión restringe algo que añadiste, tus aportaciones rechazadas o que retiraste antes de que un curador decidiera y tus solicitudes para ser curador. Una petición de abrir un país solo se queda como un recuento anónimo, sin tu nota ni tu oferta de ser curador allí. Lo que un curador aprobó se queda en el mapa, sin tu nombre. Una aportación retenida por un asunto legal se conserva, con sus mensajes, mientras dure la retención. Cada exposición de motivos te llega también por correo; la que trata de tu cuenta, solo por correo.'
  retention_suspension: '<b>Suspensiones.</b> Si un administrador suspende tu cuenta, guardamos en ella cuándo empezó y cuándo termina la suspensión, el motivo, los hechos tal como te los enviamos y qué administrador lo decidió. Eso se queda hasta que una suspensión posterior lo sustituye o se borra la cuenta. Si se borra la cuenta de ese administrador, se quita el vínculo con él. Tu exportación de datos lo incluye todo, salvo quién lo decidió. Nuestro registro de administración anota la cuenta, el motivo y la fecha de fin, nunca los hechos ni tu dirección.'
  retention_consent: '<b>Consentimientos de licencia.</b> Cuando licencias una foto o una traducción al Commons registramos que aceptaste, el texto exacto que aceptaste y cuándo. Ese registro lo conservamos indefinidamente y sobrevive al cierre de tu cuenta: es nuestra prueba de que la licencia se concedió, y podemos necesitarla para formular o defender reclamaciones (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_17">RGPD art. 17.3.e</a>). Contiene una referencia a tu cuenta y nada más sobre ti. Cuando eliminas tu cuenta, quitamos esa referencia, y el registro queda vinculado solo a la foto o la traducción.'
  retention_mail: '<b>El correo y los mensajes del formulario de contacto que nos envías.</b> Guardamos una conversación mientras el asunto sigue abierto, y la borramos dentro de los <b>24 meses</b> siguientes a su cierre. Eso te cubre si vuelves sobre ello un año después, y nos cubre si llega tarde una reclamación sobre cómo lo tratamos. Las conversaciones que forman parte de un asunto legal, como una reclamación de derechos o una retirada, se conservan hasta que ese asunto termina.'
  retention_bugs: '<b>Avisos de error.</b> Un aviso de error se conserva, como parte del registro de qué estaba roto y cómo se arregló. Si tenías la sesión iniciada, queda vinculado a tu cuenta hasta que la borres; después se queda sin ese vínculo. La dirección de correo que diste para nuestra respuesta se guarda mientras el error sigue abierto, y se borra <b>24 meses</b> después de comunicarte el resultado, el mismo plazo que para el correo que nos envías.'
  retention_reports: '<b>Avisos sobre contenido.</b> Cuando avisas de algo en el sitio, también de una foto en la que sales tú, guardamos la dirección que dejas para nuestra respuesta hasta que hayamos decidido sobre tu aviso: actuamos, no encontramos nada mal o lo cerramos porque ya no procede. Borramos la dirección <b>90 días</b> después de esa decisión. El aviso en sí se conserva, como registro de lo que nos dijeron y de lo que hicimos al respecto. Si la foto avisada queda retenida por un asunto legal, guardamos la dirección hasta que se levante esa retención.'
  retention_authorities: '<b>Avisos a las autoridades.</b> Cuando avisamos a una autoridad sobre algo publicado aquí, registramos cuándo, qué autoridad, su referencia y qué administrador lo registró. Ese registro se queda con la foto o el envío mientras exista, y el material se conserva hasta que la autoridad diga que puede borrarse. Una línea en nuestro registro de administración, con la referencia y la autoridad pero nada del material, se conserva sin fecha de fin. Si se borra la cuenta del administrador, se quita el vínculo con él y el registro se queda.'
  retention_updates: '<b>La lista de versiones.</b> Tu dirección sigue en ella hasta que la quites, desde tus ajustes o desde el enlace de cualquier mensaje. Guardamos el registro de que aceptaste, y con qué texto, igual que un consentimiento de licencia de foto: es la prueba de que podíamos escribirte.'
  h_security: 'Cómo lo protegemos'
  security_intro: 'La ley nos pide medidas acordes al riesgo (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32">RGPD art. 32</a>). En palabras llanas:'
  security_passwords: '<b>Tu contraseña no se guarda nunca.</b> Solo conservamos una transformación irreversible: nadie aquí puede leer tu contraseña, y una base de datos robada tampoco se la entrega a nadie.'
  security_secrets: '<b>Los secretos de doble factor y los códigos de respaldo están cifrados donde reposan</b>, con la clave fuera de la base de datos. Quien robe solo la base de datos sigue sin poder producir un código válido.'
  security_transport: '<b>Todo viaja cifrado</b>, entre tú y nosotros y otra vez cuando una copia de seguridad sale de nuestros servidores. A los navegadores se les indica que rechacen por completo una conexión sin cifrar con nosotros.'
  security_access: '<b>Solo quien necesita tus datos puede llegar a ellos</b>, y toda cuenta de moderación o administración entra con doble factor. Los intentos fallidos repetidos se frenan y luego se bloquean.'
  security_source_pre: 'Esa es la versión corta. Las medidas exactas, y el razonamiento detrás de cada una, están en nuestro'
  security_source_link: 'código fuente público'
  security_source_post: '. Para eso lo construimos a la vista: no tienes que creerte un párrafo de seguridad sin más.'
  security_honest: 'Ningún sistema es perfecto y no vamos a fingir que el nuestro lo sea. Detrás de este párrafo no hay certificación ni prueba de intrusión: lo que hay es un sistema pequeño que guarda lo menos posible, y código que cualquiera puede revisar.'
  h_breach: 'Si alguna vez se filtran datos'
  breach_pre: 'Si se pierden datos personales, quedan expuestos o llega a ellos alguien que no debería, y eso puede poner en riesgo los derechos de las personas, lo comunicamos a la'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>en un plazo de 72 horas</b> desde que lo sabemos (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_33">RGPD art. 33</a>). Si el riesgo para ti en concreto es alto, además te lo comunicamos directamente y sin demora (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_34">RGPD art. 34</a>), en lenguaje claro: qué ha pasado, cuáles de tus datos estaban implicados, qué hemos hecho al respecto y qué deberías hacer tú. Llevamos un registro interno de cada brecha, incluidas las que no estamos obligados a comunicar, para que el patrón siga siendo visible aunque ningún caso suelto sea notificable.'
  h_rights: 'Tus derechos'
  rights_intro: 'El <a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679">RGPD</a> te reconoce los siguientes derechos:'
  rights_access: '<b>Acceso (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_15">RGPD art. 15</a>)</b>: solicitar una copia de los datos personales que tenemos sobre ti.'
  rights_correct: '<b>Rectificación (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_16">RGPD art. 16</a>)</b>: corregir lo que sea inexacto o completar lo que falte.'
  rights_erase: '<b>Supresión (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_17">RGPD art. 17</a>)</b>: borra tu cuenta cuando quieras desde los ajustes. Tus datos personales se van con ella y no vuelven: los datos de tu cuenta, tus mensajes, tus votos, tus solicitudes para ser curador, y tus aportaciones rechazadas o que retiraste. Algunas cosas se quedan un tiempo más: nuestras copias de seguridad cifradas guardan el registro antiguo hasta que se sustituyen, como mucho 90 días, y una aportación retenida por un asunto legal se conserva mientras dure la retención. Algunas cosas se quedan a propósito, sin ningún vínculo con tu cuenta: las aportaciones que diste al mapa abierto, tus confirmaciones y marcas de "La he hecho" (salvo en una ruta que propusiste tú, donde nunca contaron y se borran), el historial de ediciones, tus avisos de error y el registro de que concediste una licencia. Una petición de abrir un país solo se queda como un recuento anónimo, sin tu nota ni tu oferta de ser curador allí. Tus fotos aprobadas también se quedan, atribuidas a un ciclista anónimo, salvo que tu perfil sea público y elijas mantener tu nombre en ellas al irte. Todo esto se describe arriba en <b>Cuánto tiempo lo conservamos</b>.'
  rights_portability: '<b>Portabilidad (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_20">RGPD art. 20</a>)</b>: descarga lo que tenemos sobre ti en un único archivo ZIP desde los ajustes de tu cuenta, hasta 3 veces al día. Ese límite solo sirve para frenar abusos. Incluye, entre otras cosas, los datos de la cuenta, tus aportaciones, tus mensajes y exposiciones de motivos, tus consentimientos de licencia y tus fotos como archivos. No incluye lo que otra persona escribió al denunciar una de tus fotos, porque esas palabras son suyas. Mientras un curador aún revisa una denuncia así, o mientras una foto está retenida para las autoridades, tampoco incluye el motivo; la decisión te lo dice.'
  rights_restrict: '<b>Limitación y oposición (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_18">RGPD arts. 18 a 21</a>)</b>: limitar determinados tratamientos u oponerte a ellos.'
  rights_withdraw: '<b>Retirar el consentimiento</b> en cualquier momento, por ejemplo desactivando tu perfil público o los correos de novedades. Desde ese momento dejamos de hacer aquello a lo que diste tu consentimiento. Lo que hicimos con tu consentimiento antes sigue siendo lícito (<a href="https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_7">RGPD art. 7.3</a>).'
  rights_third_party_photo: '<b>¿No tienes cuenta?</b> Estos derechos no dependen de tener una. Si se te reconoce en una foto de nuestro mapa, cada página de foto lleva un enlace <b>"esta foto me muestra"</b>. Avísanos ahí, sin cuenta y sin documento de identidad, y una persona curadora responde en un plazo máximo de un mes.'
  rights_contact_pre: 'Para ejercer cualquiera de ellos, escribe a'
  rights_contact_mid: '. Respondemos <b>en un plazo máximo de un mes</b>, y normalmente mucho antes. La ley permite hasta tres meses para una solicitud realmente complicada, pero solo si dentro del primer mes te decimos que tardaremos más, y por qué. Si no te convence nuestra respuesta, puedes reclamar ante la'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Menores'
  children_body: 'El Commons no está destinado a menores de <b>16</b> años. No recogemos a sabiendas datos personales de nadie por debajo de esa edad; si crees que un menor nos ha facilitado datos, escríbenos y los borraremos.'
  h_automated: 'Decisiones automatizadas'
  automated_body: 'No tomamos decisiones sobre ti por medios exclusivamente automatizados, y no elaboramos perfiles con fines publicitarios.'
  h_changes: 'Cambios en esta política'
  changes_body: 'Si cambiamos cómo tratamos los datos, añadimos aquí una nueva versión, con su fecha y lo que cambió, y mostramos un aviso a los ciclistas con sesión iniciada hasta que la hayan leído. Un cambio importante, como una nueva finalidad, un nuevo destinatario o un nuevo país, se envía además por correo a cada cuenta al menos 30 días antes de aplicarse, para que puedas leerlo y cerrar tu cuenta antes si no estás de acuerdo. Tu cuenta guarda la última versión de cada página que viste.'
  changes_versions_pre: 'Consulta el'
  changes_versions_link: 'historial de revisiones'
  changes_versions_post: ' en GitHub.'
  footer_disc_pre: 'Consulta también nuestras'
  footer_disc_terms: 'Condiciones de uso'
  footer_disc_mid: 'y las'
  footer_disc_licences: 'licencias'
  footer_disc_post: ' de los datos, los medios y el código.'
  version_line: 'Versión %n% · %date%'
  changed_bar: 'Nuestro aviso de privacidad cambió el %date%.'
  changing_bar: 'Nuestro aviso de privacidad cambia el %date%.'
  upcoming_box: 'A partir del %date% se aplica una nueva versión.'
  upcoming_link: 'Leer la nueva versión'
  next_box: 'Esta es la nueva versión. Se aplica a partir del %date%.'
  next_back: 'Leer la versión que se aplica ahora'
  changed_read: 'Ver qué ha cambiado'
  change:
    v1_first: 'La primera versión numerada. La redacción anterior está en el historial de revisiones enlazado abajo.'
    v2_traffic: 'Nuevo: desde la revisión de salidas de Scout puedes enviar un <b>resumen del tráfico</b> de una salida con radar: por vía, la distancia, los coches y la parte del día. Un resumen no contiene ninguna traza GPS. Mira qué recogemos y cuánto tiempo lo guardamos.'
    v2_time_zone: 'Nuevo: guardamos tu <b>zona horaria</b>, la que eliges en tu configuración o la que indica tu navegador, para mostrar las horas en ella.'
    v2_pseudonym: 'Corregido: con el perfil desactivado, tus contribuciones muestran tu <b>seudónimo</b> fijo, no ningún nombre.'
    v2_base_location: 'Cambiado: tu <b>ubicación base</b> se guarda como un punto al azar a hasta unos 2,5 km del punto que eliges, en lugar de un punto redondeado a aproximadamente 1 km.'
    v2_clearer: 'Más fácil de leer. El aviso dice que las dos cosas que puedes enviar desde Scout, los resúmenes del tráfico y las etiquetas, son decisión tuya en cada salida. Explica con palabras sencillas cómo guardamos tu contraseña, por qué contamos cuántas veces se usa una herramienta sin cuenta y qué guarda el mapa en tu propio navegador. Para cada servicio fuera del EEE dice qué ve ese servicio. Cada artículo del RGPD que menciona enlaza al texto de la ley.'
    v2_errors: 'Añadido: los <b>registros de fallos</b> de nuestro servidor, qué contienen, y que se quedan en nuestras propias máquinas.'
    v2_notice: 'Añadido: cómo te avisamos de los cambios. Un cambio importante te llega por correo al menos 30 días antes de aplicarse; uno más pequeño recibe aquí una nueva versión.'
    v2_more: 'Añadido: qué envía una etiqueta de Scout; qué guardamos de los avisos de error, las solicitudes para ser curador y las marcas de "La he hecho"; tus otros ajustes; dónde guardamos direcciones IP codificadas, y durante cuánto tiempo; que los enlaces añadidos a los lugares pueden comprobarse con Google Safe Browsing; y qué pasa con cada tipo de datos cuando borras tu cuenta.'
    v2_statements: 'Añadido: las <b>exposiciones de motivos</b> que enviamos cuando una decisión restringe algo que añadiste: se guardan con tus mensajes mientras exista tu cuenta, forman parte de tu exportación de datos y te llegan por correo.'
    v2_suspension: 'Añadido: qué guardamos cuando un administrador <b>suspende</b> una cuenta, durante cuánto tiempo y qué incluye de ello tu exportación de datos; y que una eliminación por incumplimiento usa tu dirección de correo una sola vez, para enviarte los motivos.'
    v2_authorities: 'Añadido: cuándo la ley nos obliga a avisar a la <b>policía o a una autoridad judicial</b> de una amenaza para la vida o la seguridad de alguien, qué le damos, con qué base jurídica y cuánto tiempo guardamos el registro.'
