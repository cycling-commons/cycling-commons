developers:
  demo_label: 'Demo'
  demo_body: '— een vooruitblik op de open API &amp; bulkexports. Lancering 2026.'
  kicker: 'Bouw op de Commons'
  title: 'Een open API. Gratis. Voor iedereen om op te bouwen.'
  lead: 'Bevraag de Commons op type en gebied, of haal bulkdumps per land op. Standaard open — dat is wat het een commons maakt. Leesbewerkingen zijn open en anoniem, binnen eerlijk-gebruik-tarieflimieten; schrijfbewerkingen vereisen een gratis accounttoken. We passen tarieflimieten toe en monitoren op misbruik zodat het snel en gratis blijft voor iedereen.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/features'
  ep1_desc: 'filter op <code>type</code>, <code>bbox</code>, <code>region</code>'
  ep2_path: '/v1/regions/{id}/best'
  ep2_desc: 'het gecureerde beste van een regio'
  ep3_path: '/v1/export/{country}.geojson'
  ep3_desc: 'bulk ODbL-dump'
  ep4_path: '/v1/features'
  ep4_desc: 'bijdragen (token + gaat ter beoordeling)'
  ex_kicker: 'Voorbeeldverzoek'
  resp_kicker: 'Antwoord'
  attr_kicker: 'Verplichte naamsvermelding'
  rules_kicker: 'De regels'
  rules_body: '<b>Tarieflimieten &amp; eerlijk gebruik.</b> Anonieme leesbewerkingen zijn <b>tariefgelimiteerd</b> — een commons is geen CDN en we hebben geen oneindige servers. Een gratis API-sleutel verhoogt je limiet; gebruik voor zwaar of herhaald gebruik de <b>bulkexports per land</b> in plaats van de live API te overbelasten. Schrijfbewerkingen vereisen een gratis accounttoken en gaan ter beoordeling. Licenties: data <b>ODbL 1.0</b>, media <b>CC BY-SA 4.0</b> — zie de samenvatting in gewone taal. Naamsvermelding, gelijk delen, open houden; commercieel gebruik is toegestaan.'
