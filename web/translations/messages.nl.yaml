      map_curated_default_threshold:
        label: 'Klaar voor Best-of: totaal aantal items'
        help: 'Hoeveel geselecteerde items een regio in totaal nodig heeft voordat een curator hem standaard in Selectie-modus mag openen. Verlaag het om jonge regio’s eerder vrij te geven, verhoog het om de lat hoog te houden.'
      map_curated_default_min_blocks:
        label: 'Klaar voor Best-of: soorten items'
        help: 'Hoeveel verschillende blokken (wegdek, klimmen, slapen, uitzichten, erfgoed, beste routes) elk hun eigen minimum moeten halen. Zet het op 1 om er weer een kaal totaal van te maken.'
      map_curated_default_min_per_block:
        label: 'Klaar voor Best-of: items per soort'
        help: 'Wat een blok nodig heeft om mee te tellen voor de eis hierboven. Samen voorkomen deze twee dat één volle laag een regio in zijn eentje draagt.'
      map_confirmation_stale_months:
        label: "Bevestigingen verlopen na (maanden)"
        help: "Hoe lang de controle van een fietser op een kraan, winkel, toilet of gevaar meetelt. Daarna geeft de kaart de speld een oranje ring, zodat een fietser die langskomt weet dat het de moeite waard is om te kijken. Eén controle zet de klok terug. Plekken die niet veranderen - beklimmingen, uitzichten, erfgoed - verlopen nooit."
      route_region_active_cap:
        label: 'Actieve routes per regio'
        help: 'Hoeveel routes een regio tegelijk live mag hebben. Een curator die boven het plafond goedkeurt, wordt geblokkeerd en gevraagd eerst iets uit roulatie te nemen.'
      route_ride_verify_threshold:
        label: 'Ritten nodig om een route te verifiëren'
        help: 'Hoeveel fietsers anders dan de indiener een route als gereden moeten markeren voordat hij zichzelf verifieert. Verlaag het voor jonge regio’s waar routes anders nooit uit de wachtrij komen.'
      moderation_retention_months:
        label: 'Bewaartermijn afgehandelde items (maanden)'
        help: 'Hoe lang afgehandelde correcties en inzendingen bewaard blijven voordat de opruimronde ze verwijdert. Het moderatiebesluit zelf blijft hoe dan ook bewaard.'
      media_urgent_breaker_hourly:
        label: 'Budget automatisch offline halen: per uur'
        help: 'Hoeveel foto''s een anonieme melding van ''intiem beeld of een kind'' in één uur zelf van de kaart mag verbergen. Verbergen is niet verwijderen — alleen een curator verwijdert een foto. Boven dit budget bereiken meldingen nog steeds het moderatiebureau maar verbergen ze niets meer, en krijg je een e-mail. Zet het op 0 om automatisch verbergen tijdens een aanhoudende aanval helemaal uit te zetten.'
      media_urgent_breaker_daily:
        label: 'Budget automatisch offline halen: per dag'
        help: 'Hetzelfde plafond over een dag gemeten, zodat een langzame druppel niet lukt wat een golf niet lukt. Beide budgetten moeten ruimte hebben voordat een melding zelf een foto kan verbergen.'
      app_alert_emails:
        label: 'Ontvangers van waarschuwingen'
        help: 'E-mailadressen, gescheiden door komma''s, die operationele waarschuwingen krijgen: het opengaan van de noodrem en elke escalatie van vermoedelijk illegale inhoud. Pas het aan als de gebruikelijke lezer weg is — een escalatie moet dezelfde dag iemand bereiken. Minstens één geldig adres is verplicht.'
      app_support_emails:
        label: 'Ontvangers ondersteuning'
        help: 'Door komma''s gescheiden e-mailadressen die berichten uit het contactformulier en bugmeldingen ontvangen. Los van de alertontvangers hierboven, zodat de voordeur en de pieper naar verschillende mensen kunnen wijzen. Laat het LEEG om terug te vallen op de alertontvangers.'
