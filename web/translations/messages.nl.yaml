  scout_h: 'Scout — markeer het terwijl je rijdt'
  scout_p: 'Het meeste van wat de Commons weet begon als iets dat een fietser in het voorbijgaan opmerkte. Scout is de recorder met één druk die dat vastlegt: gevaren, afsluitingen, veranderingen van ondergrond en waterpunten, rechtstreeks in je ritbestand. Garmin nu, Android en Hammerhead Karoo heel binnenkort.'
