roadmap:
  kicker: 'Routekaart'
  title: 'Wat we hierna bouwen.'
  lead: 'Geen datums, want dan zouden we alleen gokken. Wat we nu bouwen, wat hierna komt, en wat we willen maar nog niet hebben ingepland. De volgorde binnen elke groep ligt niet vast.'
  group_now: 'Nu'
  group_now_sub: 'In aanbouw. Hier zit echt iemand op.'
  group_next: 'Hierna'
  group_next_sub: 'Besloten en wachtend op een beurt. Behoudens verrassingen komt dit hierna.'
  group_later: 'Later'
  group_later_sub: 'Gewenst, niet ingepland. Echte voornemens, geen beloftes over wanneer.'
  item_going_live: '<b>De lancering.</b> De eerste weken online: testers vinden, snel oplossen waar zij tegenaan lopen, en de Commons bekend maken onder fietsers.'
  item_provider_refresh: '<b>Meer databronnen die zichzelf bijwerken.</b> Officiële open bronnen, zoals een nationaal drinkwaterregister, toegevoegd vanaf de moderatiedesk en volgens een vast schema ververst.'
  item_region_vote: '<b>De seizoensstemming.</b> Stem op de beste beklimmingen, routes, uitzichten, erfgoed en slaapplekken van een regio, seizoen per seizoen. De stemming is gebouwd en gaat open na de lancering.'
  item_heatmap: '<b>Waar fietsers graag komen.</b> Een warmtelaag die de plekken uitlicht die veel fietsers waarderen, zoals uitzichten en beklimmingen. Alleen uit anonieme punten, en een plek verschijnt pas als genoeg verschillende fietsers erachter staan, zodat hij nooit naar één persoon wijst.'
  item_standing: '<b>Aanzien van bijdragers.</b> Fietsers wier werk steeds wordt goedgekeurd verdienen een lichtere hand, zoals bewerkingen die meteen live gaan, in plaats van het handmatig te krijgen.'
  item_osm_giveback: '<b>Teruggeven aan OpenStreetMap.</b> Wat fietsers hier bevestigen, stroomopwaarts aangeboden in een vorm die OpenStreetMap kan opnemen.'
  item_map_a11y: '<b>De kaart bruikbaar maken zonder muis.</b> Het eerlijke gat in onze toegankelijkheidsverklaring: toetsenbord- en schermlezertoegang tot de kaart zelf, niet alleen tot de pagina''s eromheen.'
  item_route_export: '<b>Neem een route mee.</b> Vorm een route rond wat de kaart laat zien en stuur hem naar de planner of het toestel dat je al gebruikt.'
  item_region_portrait: '<b>Een portret van elke regio.</b> De regiopagina telt wat er is. Ze zou moeten zeggen hoe het fietsen er is: hoe heuvelachtig, hoeveel verhard, de grote klimmen, het bewegwijzerde netwerk, water en toiletten per honderd kilometer, de routes die fietsers aanraden, en hoe vers de gegevens zijn.'
  item_reviews: '<b>Je eigen woorden bij elke plek.</b> Een korte notitie van jezelf bij een kraan, een klim, een overnachting of een route, naast de feiten: hoe het was toen jij er was. Meerdere fietsers, meerdere notities. Geen cijfer.'
  item_favourites: '<b>Je favoriete plekken.</b> Bewaar een tappunt, een klim, een overnachting of een route in een favorietenlijst in je profiel, zodat je hem voor de volgende rit terugvindt.'
  item_roadmap_votes: '<b>Meepraten over deze lijst.</b> Stemmen op wat jou uitmaakt, een punt volgen, en zelf iets voorstellen.'
  item_more_countries: '<b>Meer landen en regio''s.</b> De Commons opent in nieuwe landen, elk met regiobeheerders die de wegen kennen. Vraag jouw land aan via de aanmeldpagina.'
  item_scout_devices: '<b>Scout op meer toestellen.</b> Markeer wat je passeert, eerst op Android, daarna op Hammerhead Karoo en iPhone.'
  item_open_api: '<b>De open-data-API, compleet.</b> Elke plek, beklimming en route leesbaar via één stabiele, gedocumenteerde API, plus bulkdownloads van de data en de kaarttegels, zodat iedereen op de Commons kan bouwen of er een kopie van kan hosten.'
  foot_shipped_pre: 'Wat al uit is staat in het'
  foot_shipped_link: 'wijzigingslogboek'
  foot_shipped_mid: '. Mis je iets dat je nodig hebt? Laat het weten via de'
  foot_contact_link: 'contactpagina'
  foot_shipped_post: ' en een mens leest het.'
changelog:
  kicker: 'Wijzigingslogboek'
  title: 'Wat er nieuw is.'
  lead: 'Elke uitgave, nieuwste eerst, in gewone woorden. De versie hier is dezelfde als die onderaan elke pagina staat, dus je weet altijd waar je naar kijkt.'
  feed_title: 'Cycling Commons: wat er nieuw is'
  feed_subtitle: 'Uitgaves van het Cycling Commons-platform.'
  feed_pre: 'Volg het zonder account: abonneer je op de'
  feed_link: 'Atom-feed'
  feed_mid: '. Wat er hierna komt staat op de'
  feed_roadmap: 'routekaart'
  feed_post: '.'
  v091_banner: "<b>De kaart zegt waar hij nog niet komt.</b> Buiten de landen die hij dekt, zegt een balk dat, en toont hoe je kunt helpen er een bij te halen."
  v091_climbs: "<b>Markeer het steilste punt van een klim.</b> In de klimeditor kun je aangeven waar een klim het steilst is, en ook lange klimmen krijgen nu hun hellingsprofiel."
  v091_languages: "<b>Engels en Nederlands.</b> De site is er in het Engels en het Nederlands; een adres in een andere taal leidt naar een van die twee."
  v091_reset: "<b>Wachtwoord herstellen in je eigen taal.</b> De herstelmail komt in de taal waarin je de site gebruikt, met de link ook als tekst uitgeschreven."
  v091_bugs: "<b>Een bug melden gaat makkelijker.</b> De bugknop kan een schermafbeelding van de pagina voor je maken, het venster kan groter, en het antwoordt in je eigen taal."
  v091_safety: "<b>Elke afbeelding wordt gecontroleerd voordat iemand hem ziet.</b> Schermafbeeldingen in bugmeldingen worden op de achtergrond op virussen gecontroleerd en opnieuw getekend, en foto's van Wikimedia Commons tonen we altijd vanuit onze eigen kopie."
  section_public: "Publieke site"
  section_rider: "Fietsersaccount"
  section_curator: "Curatoraccount"
  v095_privacy: "<b>Een duidelijkere privacyverklaring die laat weten wanneer ze verandert.</b> Ze heeft een versienummer en een lijst van wat er veranderde. Ben je ingelogd, dan zie je een melding tot je de nieuwe versie hebt gelezen. Ze gebruikt gewone woorden, noemt elke dienst buiten de EU en wat die ziet, en elk AVG-artikel linkt direct naar dat artikel."
  v095_terms: "<b>Voorwaarden en foto-toestemming die hetzelfde zeggen.</b> De voorwaarden tonen een versienummer, de datum en wat er veranderde, net als de privacyverklaring, en beide linken naar hun volledige revisiegeschiedenis. De foto-toestemming zegt nu wat de voorwaarden zeggen: gewone bewerking zoals bijsnijden mag, iets toevoegen of weghalen niet. Je vinkt haar bij je volgende upload nog één keer aan. Ben je ingelogd, dan zie je een melding tot je de nieuwe voorwaarden hebt gelezen. Een grote wijziging van een van beide pagina's mailen we je minstens 30 dagen voordat ze geldt."
  v095_reasons: "<b>Een uitleg bij elke beslissing over wat je toevoegde.</b> Wijst een regiobeheerder iets af wat je toevoegde, of verbergt of verwijdert die het, dan krijg je een bericht en een e-mail met wat er besloten is, waarom, welke regel geldt en hoe je bezwaar maakt. Een account kan nu een vaste tijd worden geschorst in plaats van verwijderd, en de houder hoort waarom."
  v095_export: "<b>De hele kaart als wekelijkse download.</b> Elke plek en route op de kaart staat op de ontwikkelaarspagina in één GeoJSON-download, elke week opnieuw gemaakt, onder de Open Database License."
  v095_security: "<b>Meerdere verbeteringen aan beveiliging en privacy.</b>"
  v095_fixes: "<b>Onder de kleinere verbeteringen:</b> elk onderdeel van de voorwaarden heeft een eigen nummer, een fotobeschrijving opslaan werkt weer, de rode markering staat op de plek die je koos, en de iconen voor schuilplekken staan in de legenda."
  v095_traffic: "<b>Laat zien hoe druk een weg echt is.</b> Rij je met een achterradar, dan kan het nakijken van een rit in Scout een verkeerssamenvatting versturen: per weg hoe ver je reed, hoeveel auto's je passeerden en hoe snel die auto's reden, en of je op een fietspad, een fietsstrook of de weg reed. Je ritbestand en GPS-spoor blijven op je apparaat. Je kiest het per rit."
  v095_rides: "<b>Meerdere ritten tegelijk nakijken.</b> Kies of sleep meerdere .fit-bestanden, of één zip met .fit-bestanden, zoals een Scout-export. De kaart toont de wegen die je reed, en één samenvatting telt ze allemaal op."
  v095_time_zone: "<b>Tijden in je eigen tijdzone.</b> Kies een tijdzone in je instellingen, of houd Automatisch aan om die van je browser te gebruiken. Elke datum en tijd op de site volgt die."
  v095_base: "<b>Je uitvalsbasis is privéer.</b> We bewaren een willekeurig punt tot 2,5 km van de plek die je kiest, zodat het niet meer laat zien dan ongeveer welke plaats."
  v095_traffic_desk: "<b>Zie hoe druk wegen zijn.</b> Gemeten verkeer staat onder Meer op het bureau. Het toont rustig, matig of druk voor elke weg zodra er genoeg ritten op meerdere dagen binnen zijn. Vanaf de eerste rit toont het hoeveel wegen gegevens hebben, per land en regio."
  v095_kinds: "<b>Plekken zeggen wat ze zijn.</b> Een mooi uitzicht is een uitkijkpunt, een waterval, een rotswand of een grot; een historische plek een kasteel, een ruïne of een gedenkteken; een schuilplek een picknickhut, een afdak of een hut. Elke soort heeft een eigen icoon op de kaart en in de legenda. Het zijn de soorten van OpenStreetMap, zodat wat wij toevoegen daarheen terug kan."
  v095_map: "<b>Een rustigere kaart.</b> Uitgezoomd toont een zachte waas waar OpenStreetMap plekken heeft, en de iconen verschijnen als je inzoomt, water eerst. Onze eigen pinnen groeien als je inzoomt, plekiconen liggen boven routes, en de top- en hellinglabels van klimmen verschijnen pas van dichterbij."
  v095_search: "<b>Beter zoeken.</b> Een plek staat er één keer, met haar regio. Een lange naam krijgt twee regels, en de lijst komt terug als je opnieuw in het zoekveld klikt."
  v095_scout_tags: "<b>Scout-tags onthouden wat je koos.</b> Tag je tijdens een rit gaten in de weg of een waterval, dan toont de ritreview dat antwoord. Bij een mooi uitzicht of een historische plek vraagt hij wat voor plek het is, zoals een uitkijkpunt of een kasteel."
  v095_hints: "<b>Sluit een melding als je haar gelezen hebt.</b> De melding over je pinnen die op beoordeling wachten heeft een sluitknop, en blijft dicht op al je apparaten."
  v095_curator_kinds: "<b>De soort komt direct na de naam.</b> Op elk formulier is Type het tweede veld, alfabetisch gesorteerd in jouw taal. Een Scout-tag komt binnen met de soort al ingevuld als de rijder er een koos."
  v095_grant: "<b>Curatorrechten komen met hun gebieden.</b> Maakt een beheerder iemand curator, dan kiest die eerst de gebieden, of vinkt Alle gebieden aan, in dezelfde stap."
  v094_ballot: "<b>Stem op het beste van je regio, een seizoen vooruit.</b> Kies tot 5 beklimmingen, routes, uitzichten, erfgoedplekken of slaapplekken per lijst, in je eigen volgorde. Je nummer één krijgt de meeste punten. Zodra je indient, telt je stembrief."
  v094_best: "<b>Zie wat fietsers elk seizoen het mooist vonden, ten noorden en ten zuiden van de evenaar.</b> De beste-van-pagina toont de winnaars van elk seizoen, regio per regio, te beginnen met die van jou. Elke regio volgt haar eigen seizoenen. Ontbreekt een favoriet? Zet hem nu op de kaart, zodat je erop kunt stemmen."
  v094_fair: "<b>Elke plek krijgt een eerlijke kans.</b> De stembrief toont plekken van A tot Z, en niemand ziet een tussenstand zolang het stemmen open is. De top 5 van vorig jaar krijgt een kleine achterstand, zodat ook andere of nieuwe plekken kunnen winnen."
  v094_climbs: "<b>Zie waar een beklimming het meest pijn doet.</b> Het profiel toont de steilste 250 m en het steilste punt, en een rustige klim lijkt niet meer op een muur. Voeg je een beklimming toe, dan zoekt de kaart het steilste punt voor je; sleep het als het fout is. Het formulier start met de bekende hoogtemeters en het gemiddelde stijgingspercentage."
  v094_map: "<b>Vind plekken sneller op de kaart.</b> Pinnen op dezelfde plek waaieren uit, zodat je elk ervan kunt aantikken. Overal zoeken vindt ook beklimmingen en routes. Een link naar een plek uit OpenStreetMap opent die op de kaart. Op een telefoon opent het profiel van een beklimming boven het onderste paneel."
  v094_security: "<b>Verschillende beveiligingsverbeteringen</b> voor inloggen, twee-factor-authenticatie en onze e-mails."
  v094_fixes: "<b>Onder de kleinere verbeteringen:</b> filters zien er op elke pagina hetzelfde uit en werken overal hetzelfde, en Franse en Nederlandse teksten hebben hun apostrofs terug."
  v094_name: "<b>Weet hoe anderen je zien.</b> Je instellingen tonen de naam die andere fietsers zien: je anonieme naam zolang je profiel privé is, je weergavenaam zodra het openbaar is."
  v094_confirmations: "<b>Vind je bevestigingen en stemmen snel terug.</b> De plekken die je bevestigde hebben een eigen tabblad, pagina per pagina, en je stemmen tonen wat je koos."
  v094_bugs: "<b>Sorteer bugmeldingen sneller.</b> Bugmeldingen hebben nu de categorieën API, berichten en bureaus. Een melding zonder adres van de melder hoeft geen antwoord als je ze sluit."
  v094_providers: "<b>Vul in wat een hele gegevensbron gemeen heeft.</b> Op het bureau Aanbieders stel je standaardwaarden per categorie in, bijvoorbeeld: elke RIVM-kraan is een gratis drinkwaterkraan. Een vernieuwing vult een standaardwaarde alleen in waar een plek geen waarde heeft, en nooit over de wijziging van een fietser heen. \"Nog zoals op de kaart?\" krijgt nooit een standaardwaarde: alleen een fietser die heeft gekeken kan dat beantwoorden."
  v094_desk: "<b>Niets wacht ongezien.</b> Ongelezen-tellers op de tabbladen van de bureaus zijn oranje, zoals elke andere teller. Het supportadres krijgt een e-mail voor elke curatoraanvraag en elk verzoek om een nieuw land."
  v093_climbs: "<b>Een klim telt als je tot boven rijdt.</b> Een route rijdt een klim alleen als ze het grootste deel ervan oprijdt en dicht bij de top eindigt. De ritcheck toont de klimmen op je rit."
  v093_texts: "<b>Schrijf de tekst voor je gemeente of regio.</b> Iedereen die is aangemeld kan een tekst voor een gemeente of regio voorstellen, en zegt of die bewerkt is van Wikipedia of in eigen woorden geschreven. De curator van de regio keurt hem goed. De bronvermelding noemt de schrijver, en linkt alleen naar Wikipedia als de tekst erop gebaseerd is."
  v093_contributions: "<b>Al je bijdragen in één lijst.</b> Plaatsen en routes staan samen, nieuwste eerst. Een route die je voorstelde kun je op de kaart openen en bewerken, ook de foto's, tot een curator beslist."
  v093_signin: "<b>Aanmelden is duidelijker.</b> Aangemeld blijven zegt dat het 7 dagen duurt in deze browser, en dat je het niet op een gedeeld toestel gebruikt. Je eerste aanmelding na het bevestigen van je e-mail opent je instellingen."
  v093_updates: "<b>Kies hoe vaak we schrijven.</b> Houd me op de hoogte, in je instellingen, vraagt nu hoe vaak: groot nieuws hoogstens 4 keer per jaar, of elke update hoogstens 2 keer per maand."
  v093_privacy: "<b>Meer privacy.</b> Elke fietser heeft een willekeurige anonieme naam, en een fietser zonder openbaar profiel is alleen via die naam te vinden. Je instellingen tonen hem. De kaart toont niet langer hoe ver een fotograaf van de pin stond. De berichten over je bijdragen blijven bewaard zolang je account bestaat en worden ermee gewist, en een account dat 24 maanden niemand gebruikte wordt gewist. Contactberichten gaan 24 maanden nadat de zaak is afgerond, en het antwoordadres van een melding 90 dagen na de beslissing."
  v093_messages: "<b>Ongelezen blijft ongelezen tot je het opent.</b> Een bericht, een post in de ruimte of nieuw werk op een bureau houdt zijn markering tot je het opent, niet wanneer een lijst het alleen toont. De naam van een plaats of route in een bericht staat tussen aanhalingstekens en cursief."
  v093_access: "<b>Makkelijker op telefoon en toetsenbord.</b> Het telefoonmenu bereikt elke hoofdpagina. De keuzes voor regio en Doe mee werken met alleen het toetsenbord, en elk formulierveld toont waar je bent. De dekkingskaart is een lichtere lavendel."
  v093_fixes: "<b>Onder de vele kleinere verbeteringen:</b> e-mails hebben een echte platte-tekstversie, lange lijsten langs een route klappen dicht na twee regels, een plaats uit twee bronnen houdt het record van de bron die we het meest vertrouwen, Bekijk op de kaart in je berichten opent de plaats zelf, taallijsten tonen alleen de talen van de site, en de wegdeklegende flitst niet meer op als de kaart opent."
  v093_curators: "<b>Voor curatoren.</b> Het regelboek staat op de site, in tabbladen, en elke regel klopt met hoe de site werkt. De wachtrij en Geschiedenis filteren op categorie. Je verbetert een tekstsuggestie en keurt ze goed op hetzelfde formulier, waar je ook beslist of de Wikipedia-vermelding blijft. Tekstsuggesties dragen een gemeente- of regiopictogram. De prullenbak bewaart iets 30 dagen, en je kunt het terugzetten vanaf de pagina Prullenbak."
  v092_area: "<b>De kaart laadt jouw gebied, niet de hele wereld.</b> Alleen de regio's waar je naar kijkt worden gedownload, dus de kaart start sneller en gebruikt veel minder data. Andere regio's laden als je erheen gaat."
  v092_search: "<b>Overal zoeken, routes inbegrepen.</b> Met Overal aan vindt de zoekfunctie onze plekken in elk land, en het vakje Routes voegt routes toe aan de resultaten. Kies er een en die opent op de kaart."
  v092_fresh: "<b>Pins laten zien hoe recent iemand keek.</b> Een plek die 6 maanden niemand bevestigde, krijgt een oranje rand, na 12 maanden een rode."
  v092_key: "<b>De legenda is compleet.</b> Het paneel Legenda legt elke markering op de kaart uit met een voorbeeld, en de badges op de pins zijn groter en beter leesbaar."
  v092_similar: "<b>Vergelijkbare plekken voordat je er een toevoegt.</b> Als je een plek toevoegt, toont het formulier plekken van dezelfde soort in de buurt. Markeer de plekken die dezelfde zijn, en die van jou vervangt ze zodra ze is goedgekeurd."
  v092_bugs: "<b>Het foutenpaneel bewaart je concept.</b> Het zegt wanneer het een niet-verzonden melding voor je heeft bewaard, en één knop wist alles."
  v092_speed: "<b>Snellere pagina's als je niet ingelogd bent.</b> Beste en de andere openbare pagina's laden sneller, ook nadat je een pagina opent die vraagt om in te loggen. Log je in, dan worden de pagina's voor jou gemaakt en laden ze op de gewone snelheid."
  v092_confirm: "<b>Bevestig je e-mail voordat je inlogt.</b> Een nieuw account kan inloggen zodra het e-mailadres bevestigd is. De link in de mail werkt 24 uur. Een verlopen link brengt je naar een pagina waar je een nieuwe kunt vragen."
  v092_strava: "<b>Fiets met ons op Strava.</b> De voettekst linkt naar de club van Cycling Commons op Strava."
  v090_towns: "<b>Plaatsen op de kaart.</b> Een plaats opent nu een eigen kaartje, gemarkeerd met de eigen speld van de site."
  v090_fresh: "<b>De kaartgegevens verversen zichzelf.</b> Elke nacht leest de site OpenStreetMap opnieuw voor de regio's die hij dekt, dus wat je ziet is hooguit dagen oud, geen maanden."
  v090_surface: "<b>Wegdek en routes, wekelijks opnieuw opgebouwd.</b> De wegdek- en routelagen worden volgens schema opnieuw gegenereerd in plaats van met de hand."
  v090_photos: "<b>Elke foto wordt gescand voordat hij verschijnt.</b> Een upload wordt op de achtergrond gecontroleerd en pas gepubliceerd als hij is goedgekeurd."
  v090_accounts: "<b>Nooit bevestigde accounts worden verwijderd.</b> Wordt een aanmelding niet afgerond, dan blijft het record niet staan."
  v080_map: '<b>De kaart.</b> Plekken, beklimmingen en routes in negentien landen, met een ondergrondlaag, satelliet- en straatbeelden, en een licht en een donker thema.'
  v080_photos: '<b>Foto''s.</b> Draag een foto bij aan elke plek, onder CC BY-SA 4.0. Locatiegegevens gaan eruit vóór publicatie, en elke foto heeft een eigen pagina.'
  v080_routes: '<b>Routes.</b> Stel een route voor vanuit een GPX-bestand, stem op wat je gereden hebt, en zie het beste van een regio.'
  v080_contribute: '<b>Bijdragen.</b> Plekken toevoegen en verbeteren vanaf de kaart zelf, bevestigen dat iets er nog staat, en volgen wat een regiobeheerder besloot en waarom.'
  v080_accounts: '<b>Accounts.</b> Optioneel openbaar profiel, inloggen met twee factoren, een volledige gegevensexport, en accountverwijdering die meteen ingaat.'
  v080_languages: '<b>Vijf talen.</b> Engels, Frans, Nederlands, Duits en Spaans, met een manier voor rijders om een betere vertaling voor te stellen.'
  v080_legal: '<b>Het papierwerk goed geregeld.</b> Een privacyverklaring die elke verwerker noemt, een toegankelijkheidsverklaring die opsomt wat nog niet werkt, en een contactroute die bij een mens uitkomt.'
