  what_h: 'Wat het doet'
  what_p1: 'Jij bent de enige die weet dat de weg dicht is, dat het grind hier begint, of dat de kraan op het plein het doet. Normaal verdampt die kennis voor je thuis bent. Scout vangt het op het moment dat je erlangs rijdt: één druk, en het staat er met je positie en de tijd.'
  what_p2: 'Scout <b>staat op zichzelf</b>. De app en het formaat werken met of zonder de Cycling Commons — je markeringen zijn van jou, in je eigen ritbestand, leesbaar voor alles wat het kan lezen.'
