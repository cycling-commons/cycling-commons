meta:
  home_title: 'Cycling Commons'
  home_description: 'Een open, door de gemeenschap gebouwde kaart van de mooiste fietsroutes ter wereld.'
  about_title: 'Cycling Commons — Over'
  about_description: 'Cycling Commons is een open, door de gemeenschap gebouwde kaart van de mooiste fietsroutes ter wereld. Open data die iedereen kan gebruiken, beheerd door de fietsers die het bouwen.'
  regions_title: 'Cycling Commons — Regio''s'
  regions_description: 'Cycling Commons is ingedeeld in regio''s van ruwweg de omvang van Wallonië of Vlaanderen — blader per continent.'
  coverage_title: 'Cycling Commons — Dekking'
  coverage_description: 'Hoe volledig is de kaart? Zie wat er gedekt is, wat er ontbreekt en waar jij kunt helpen — transparante monitoring van de open fiets-Commons.'
  developers_title: 'Cycling Commons — Ontwikkelaars'
  developers_description: 'Een open API, gratis voor iedereen om op te bouwen. Bevraag de Commons per type en gebied, of download bulkdumps per land — standaard open.'
  licenses_title: 'Cycling Commons — Licentie'
  licenses_description: 'De korte versie, in gewone taal — wat je kunt doen met Commons-data, media en code — ODbL-data, CC BY-SA-media, PolyForm Shield-code (broncode beschikbaar).'
  join_title: 'Cycling Commons — Doe mee'
  join_description: 'Help de open fiets-Commons bouwen — fietsers met lokale kennis, ontwikkelaars, social media, fondsenwervers en juristen. Code, kennis of een paar uur expertise: er is ruimte voor jou.'
  contributors_title: 'Cycling Commons — Bijdragers'
  contributors_description: 'Gebouwd door fietsers. Erkenning zonder surveillance — we vieren bijdragen aan de open Commons, nooit persoonsgegevens.'
  region_title: 'Cycling Commons — Regio'
  region_description: 'De mooiste fietsroutes in Wallonië in één open laag — de Ardennen-klassiekers: klimmen, uitzichten en routes, bijgehouden door de fietsers die ze kennen.'
  privacy_title: 'Cycling Commons — Privacy'
  privacy_description: 'Hoe Cycling Commons omgaat met persoonsgegevens — in gewone taal. Gebouwd om zo weinig mogelijk te verzamelen en jouw bijdragen gescheiden te houden van wie je bent. AVG-conform.'
  terms_title: 'Cycling Commons — Gebruiksvoorwaarden'
  terms_description: 'De voorwaarden voor het gebruik van de Cycling Commons-site en je account — kort, leesbaar en afgestemd op de open licenties. Naar het recht van Nederland.'
  pages_title: 'Cycling Commons — Alle pagina''s'
  pages_description: 'De hele Commons, pagina voor pagina — een overzicht van elk openbaar, bijdrager- en curatoroppervlak.'
  login_title: 'Cycling Commons — Account'
  login_description: 'Word lid van de atlas. Log in om klimmen, plaatsen en correcties bij te dragen aan de open fiets-Commons.'
  register_title: 'Cycling Commons — Account aanmaken'
  register_description: 'Maak een gratis Cycling Commons-account aan om klimmen, plaatsen en correcties bij te dragen aan de open fietsatlas.'
  register_check_email_title: 'Cycling Commons — Controleer je e-mail'
  register_check_email_description: 'Controleer je inbox om je e-mailadres te bevestigen en je account te activeren.'
  reset_request_title: 'Cycling Commons — Wachtwoord opnieuw instellen'
  reset_request_description: 'Vraag een link aan om je wachtwoord voor je Cycling Commons-account opnieuw in te stellen.'
  reset_check_email_title: 'Cycling Commons — Controleer je e-mail'
  reset_check_email_description: 'Er is een resetlink verstuurd als er een account met dat e-mailadres bestaat.'
  reset_new_title: 'Cycling Commons — Nieuw wachtwoord instellen'
  reset_new_description: 'Stel een nieuw wachtwoord in voor je Cycling Commons-account.'
  profile_title: 'Cycling Commons — Jouw profiel'
  profile_description: 'Jouw bijdragersprofiel op Cycling Commons.'
  settings_title: 'Cycling Commons — Instellingen'
  settings_description: 'Beheer de instellingen van je Cycling Commons-account.'
  twofa_setup_title: 'Cycling Commons — Tweestapsverificatie instellen'
  twofa_setup_description: 'Voeg een authenticator-app toe om je Cycling Commons-account te beveiligen.'
  twofa_enabled_title: 'Cycling Commons — Tweestapsverificatie ingeschakeld'
  twofa_enabled_description: 'Tweestapsverificatie (2FA) beschermt nu je Cycling Commons-account.'
  moderate_title: 'Cycling Commons — Moderatie'
  moderate_description: 'Curatoroppervlak voor de Commons — beoordeel inzendingen, los meldingen op en houd de open fietsatlas betrouwbaar.'
  contribute_title: 'Cycling Commons — Bijdragen'
  contribute_description: 'Kies wat je wilt bijdragen aan Cycling Commons — klimmen, water, wegdek, gevaren, overnachtingen, uitzichten en meer. Één open atlas, gebouwd door fietsers.'
  add_climb_title: 'Cycling Commons — Klim toevoegen'
  add_climb_description: 'Voeg een klim toe aan de Commons — zoek de locatie, teken de route en leg wegdek, verkeer en stijgingspercentage vast voor elk type fietser.'
  vote_title: 'Cycling Commons — Stemmen'
  vote_description: 'Rangschik het mooiste fietsen van deze regio. De community bepaalt de seizoensfavorieten, actueel gehouden door de fietsers die er rijden.'
  improve_title: 'Cycling Commons — Locatie verbeteren of toevoegen'
  improve_description: 'Verbeter een locatie in de Commons — corrigeer details, meld omstandigheden en houd de open fietsatlas accuraat voor elke fietser.'
  propose_route_title: 'Cycling Commons — Stel een route voor'
  propose_route_description: 'Deel een aanbevolen rit: upload je GPX, een curator beoordeelt hem, de community verifieert en stemt.'
