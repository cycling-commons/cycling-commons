    media_removed_on_report: 'Een van je foto''s is verwijderd na een melding. Een regiobeheerder heeft de melding gelezen en gaf de melder gelijk. Dit gaat over dat ene beeld, niet over je bijdrage, en dank daarvoor. We kunnen niet zeggen wie de melding deed, in geen van beide richtingen: die persoon weet ook niet wie de foto uploadde. Vind je de verwijdering onterecht, reageer dan op dit bericht; een regiobeheerder leest het.'
    media_hidden_pending_review: 'Iemand heeft een van je foto''s gemeld, en vanwege wat de melding beweert hebben we hem meteen van de kaart verborgen terwijl een regiobeheerder ernaar kijkt. Verborgen is niet verwijderd: de foto blijft van jou, staat er nog, en er is niets gewist. Houdt de melding geen stand, dan staat hij binnen enkele dagen terug en laten we het je weten. Alleen een regiobeheerder kan een foto verwijderen, nooit een melding op zichzelf. En we kunnen je niet zeggen wie meldde, net zoals die persoon niet te horen kreeg wie uploadde.'
    media_restored_after_review: 'Iemand heeft een van je foto''s gemeld, en vanwege wat de melding beweerde hebben we hem meteen van de kaart verborgen terwijl een regiobeheerder ernaar keek. De melding hield geen stand, dus de foto staat weer op de kaart, precies zoals hij was. Eerst verbergen is hoe we zorgen dat een echte klacht nooit dagenlang blijft staan, en dat betekent dat er af en toe een foto voor niets even weg is. We kunnen je niet zeggen wie meldde, net zoals die persoon niet te horen kreeg wie uploadde.'
    media_ready: 'De controles van je foto waren klaar nadat je gestopt was met wachten. Hij staat nu op de kaart en gaat net als elke andere bijdrage naar een regiobeheerder.'
    media_scan_rejected: 'We konden die foto niet accepteren. Onze controles vonden iets in het bestand, of konden het helemaal niet als afbeelding lezen. Niemand heeft naar de foto gekeken: dit is een automatische controle van het bestand zelf. Probeer een andere foto, of dezelfde opnieuw opgeslagen als JPEG.'
