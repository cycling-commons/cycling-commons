  disc_label: 'VOOR ELKE VORM VAN FIETSEN —'
  frag_kicker: 'ÉÉN PLEK, NIET EEN DOZIJN APPS'
  frag_h2: 'Fietskennis is verspreid. De Commons brengt het samen.'
  frag_lead1: 'Vandaag leeft elke laag in zijn eigen silo — één app voor klimmen, een andere voor routes, een andere voor fietsvriendelijke overnachtingen, een andere voor wegomstandigheden — en de meeste zijn gesloten. Fietsers lappen een dozijn tools aan elkaar en de data sluit nooit op elkaar aan. De Commons brengt de niet-persoonlijke kennis op één open plek samen, vrij te bevragen en op te bouwen.'
  frag_lead1_short: 'Elke laag leeft in zijn eigen app, en de meeste zijn gesloten. Fietsers lappen een dozijn tools aan elkaar en de data sluit nooit aan.'
  frag_lead2: 'En waar goede open data al bestaat, bouwen we die niet opnieuw — we werken <b>samen</b>. We koppelen en werken samen met andere open-datagemeenschappen (zoals open gastvrijheidsnetwerken voor slaapplaatsen) in plaats van onze eigen kopie af te schermen. Open data moet samenkomen, niet verder fragmenteren.'
  frag_lead2_short: 'De Commons brengt die kennis op één open plek. Waar goede open data al bestaat, werken we <b>samen</b> in plaats van die te kopiëren.'
