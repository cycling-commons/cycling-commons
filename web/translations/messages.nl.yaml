a11y:
  kicker: 'Toegankelijkheid'
  title: 'Wat werkt, en wat nog niet.'
  lead: 'Een eerlijk verslag van hoe bruikbaar deze site is, inclusief de delen die niet goed genoeg zijn. Als iets je tegenhoudt, laat het weten en we lossen het op.'
  last_updated: 'Laatst bijgewerkt 27 augustus 2026'
  report_pre: 'Zit iets je hier in de weg?'
  report_link: 'Meld een drempel'
  report_post: '. Geen account nodig. We antwoorden binnen een maand, en eerder waar dat kan.'
  h_aim: 'Waar we naar streven'
  aim_body: 'We houden deze site aan <b>WCAG 2.2, niveau AA</b>. Dat is een doel waar we naartoe werken, geen keurmerk dat we hebben: delen van de site voldoen er vandaag aan en delen niet, en de twee lijsten hieronder zeggen welke.'
  h_works: 'Wat vandaag werkt'
  works_intro: 'Elk hiervan is gemeten, niet aangenomen.'
  works_keyboard: '<b>Toetsenbord.</b> Elke pagina buiten de kaart is zonder muis te gebruiken, en de focusrand wordt nooit weggehaald.'
  works_skip: '<b>Naar de inhoud springen.</b> Het eerste dat een toetsenbord op elke pagina bereikt, en het stapt over meldingsbalken heen in plaats van erop te landen.'
  works_contrast: '<b>Contrast.</b> Tekst is gemeten tegen de eigen achtergrond over de hele site en de kaartschil, in zowel het lichte als het donkere kaartthema, en de tekortkomingen zijn opgelost.'
  works_targets: '<b>Aanraakvlakken.</b> Elke knop die wij tekenen haalt de 24px-ondergrens, gecontroleerd op een telefoon in plaats van in een smal gemaakt browservenster.'
  works_zoom: '<b>Zoomen.</b> Tekst kan tot 200% worden vergroot zonder dat er iets wegvalt of zijwaarts gescrold moet worden.'
  works_motion: '<b>Geen beweging waar je niet om vroeg.</b> Niets speelt vanzelf af, niets knippert, en er is geen carrousel.'
  h_gaps: 'Wat nog niet werkt'
  gaps_intro: 'Deze zijn echt en we verzwijgen ze niet.'
  gap_map: '<b>De kaart is niet bruikbaar met een schermlezer.</b> Het is een tekening op een canvas, en het verschuiven en zoomen van een plaatje heeft zonder zicht geen betekenis. Dit is de grootste tekortkoming op de site en we hebben er geen snelle oplossing voor. Zie hieronder wat je in plaats daarvan kunt gebruiken.'
  gap_vendor: '<b>Sommige kaartknoppen zijn niet van ons.</b> De zoomknoppen en de attributieschakelaar komen uit de kaartbibliotheek. Ze halen de ondergrens, maar ze zijn kleiner dan wij ze zouden tekenen, en we kunnen ze niet aanpassen zonder de bibliotheek te forken.'
  gap_audit: '<b>Niemand van buiten heeft dit gecontroleerd.</b> Alles hierboven is gemeten door de mensen die de site hebben gebouwd, en dat is niet hetzelfde als getest zijn door iemand die dagelijks een schermlezer gebruikt.'
  gap_translations: '<b>Vertalingen lopen achter op het Engels.</b> Nieuwe teksten verschijnen eerst in het Engels, dus een pagina in een andere taal kan kort een mengeling tonen.'
  h_instead: 'Wat je in plaats van de kaart kunt gebruiken'
  instead_pre: 'Alles wat de kaart tekent bestaat ook als tekst of als data. De'
  instead_regions: 'regiopagina''s'
  instead_mid: ' noemen wat er in elke plaats is gevonden, als gewone koppen en lijsten. De'
  instead_api: 'open API'
  instead_post: ' levert dezelfde data aan elk hulpmiddel dat je liever gebruikt. Geen van beide is een volledige vervanging, en dat weten we.'
  h_legal: 'Hoe we er juridisch voor staan'
  legal_body: 'We claimen geen naleving van de <b>European Accessibility Act</b>, omdat niet duidelijk is dat die op ons van toepassing is. De wet noemt bepaalde consumentendiensten, een gratis open kaart is daar niet duidelijk een van, en micro-ondernemingen die diensten leveren zijn sowieso uitgezonderd. We zeggen dat liever ronduit dan een plicht te suggereren die we misschien niet hebben. We houden ons aan WCAG omdat het hoort, niet omdat iemand ons dwong.'
  h_how: 'Hoe dit is gecontroleerd'
  how_body: 'Met de hand, in een echte browser, op een echte telefoon: doorlopen met het toetsenbord, contrast gemeten tegen de werkelijk getoonde achtergrond, en aanraakvlakken ter plekke gemeten in plaats van geraden uit de stylesheet. Een deel is vastgelegd in geautomatiseerde tests zodat het niet stilletjes kan terugvallen. Er is geen toegankelijkheidsoverlay bij gebruikt, en die komt er ook niet: die maken een site slechter voor juist de mensen die ze zeggen te helpen.'
  footer_pre: 'Deze pagina is alleen iets waard als hij verandert. Kom je iets tegen dat er niet in staat,'
  footer_link: 'laat het ons weten'
  footer_post: ' en het komt op de lijst.'

