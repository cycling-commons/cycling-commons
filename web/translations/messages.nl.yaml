  twofa_enabled_title: 'Cycling Commons — Tweestapsverificatie ingeschakeld'
  twofa_enabled_description: 'Tweestapsverificatie (2FA) beschermt nu je Cycling Commons-account.'
  moderate_history_title: 'Afgehandelde bijdragen'
  moderate_history_description: 'Het register van besliste bijdragen.'
  moderate_trash_title: 'Prullenbak'
  moderate_traffic_title: 'Gemeten verkeer'
  moderate_trash_description: 'Wat regiobeheerders naar de prullenbak verplaatsten, 30 dagen bewaard en terug te zetten.'
  moderate_takedowns_title: 'Verzoeken om foto''s te verwijderen'
  moderate_takedowns_description: 'Rechtenverzoeken die op een beslissing wachten.'
  moderate_translations_title: 'Vertaalvoorstellen'
  moderate_translations_description: 'Niet-Engelse sitetekst beoordelen en publiceren.'
  moderate_rulebook_title: 'Handboek voor regiobeheerders'
  moderate_rulebook_description: 'De regels waar de moderatiebureaus op draaien.'
  moderate_room_title: 'Regiobeheerderskamer'
  moderate_room_description: 'Het interne prikbord voor regiobeheerders.'
  moderate_dashboard_title: 'Regiobeheerdersdashboard'
  moderate_dashboard_description: 'Elke moderatiebalie en het openstaande werk op één pagina.'
  rider_dashboard_title: 'Dashboard'
  rider_dashboard_description: 'Je openstaande werk en wat op jou wacht, op één pagina.'
  moderate_title: 'Cycling Commons — Moderatie'
  moderate_description: 'Regiobeheerdersoppervlak voor de Commons — beoordeel inzendingen, los meldingen op en houd de open fietsatlas betrouwbaar.'
  contribute_title: 'Cycling Commons — Bijdragen'
  contribute_description: 'Kies wat je wilt bijdragen aan Cycling Commons — klimmen, water, wegdek, gevaren, overnachtingen, uitzichten en meer. Één open atlas, gebouwd door fietsers.'
  vote_title: 'Cycling Commons — Stemmen'
  vote_description: 'Stem op de beste klimmen, routes, uitzichten, erfgoed en overnachtingen van je regio, seizoen na seizoen.'
  improve_title: 'Cycling Commons — Locatie verbeteren of toevoegen'
  improve_description: 'Verbeter een locatie in de Commons — corrigeer details, meld omstandigheden en houd de open fietsatlas accuraat voor elke fietser.'
  propose_route_title: 'Cycling Commons — Stel een route voor'
  propose_route_description: 'Deel een aanbevolen rit: upload je GPX, een regiobeheerder beoordeelt hem, de community verifieert en stemt.'
  propose_route_edit_title: 'Cycling Commons · Je routevoorstel bewerken'
  propose_route_edit_description: 'Pas je routevoorstel aan zolang het op beoordeling wacht.'
  route_photos_title: 'Cycling Commons · Foto''s toevoegen aan een route'
  route_photos_description: 'Voeg je eigen foto''s toe aan een aanbevolen route. Een regiobeheerder beoordeelt ze voordat ze op de kaart verschijnen.'
  contact_title: 'Cycling Commons — Contact'
  contact_description: 'Schrijf de Cycling Commons zonder mailprogramma en zonder account. Een formulier, een gepubliceerd adres, en wie de site juridisch beheert.'
  bug_report_title: 'Cycling Commons — Bug melden'
  report_guide_title: 'Cycling Commons — Een pagina of foto melden'
  report_guide_description: 'Waar de meldlink staat voor een plek, route, regio, fietser, bericht of foto, en een vak dat vanuit een Commons-link het juiste formulier opent.'
  bug_report_description: 'Is er iets stuk op de Cycling Commons? Vertel het ons, met of zonder account.'
  known_issues_title: 'Cycling Commons — Bekende problemen'
  known_issues_description: 'Wat we al weten dat stuk is op de Cycling Commons, bevestigd door een regiobeheerder, zodat je het niet twee keer hoeft te melden.'
  accessibility_title: 'Cycling Commons — Toegankelijkheid'
  accessibility_description: 'Hoe bruikbaar de Cycling Commons is, inclusief de delen die nog niet goed genoeg zijn, en hoe je een drempel meldt.'
  map_key_title: 'Cycling Commons — Kaartlegenda'
  map_key_description: 'Elke markering op de kaart van de Cycling Commons en wat die betekent: spelden, schijfjes, randen, badges, lijnen en clusters.'
  roles_title: 'Cycling Commons: bijdragers en regiobeheerders'
  roles_description: 'Wat een bijdrager doet en wat een regiobeheerder doet op de Cycling Commons-kaart, en hoe een bewerking bevestigd raakt.'
legend:
  kicker: 'Kaartlegenda'
  title: 'Elke markering op de kaart'
  lead: 'Een speld stapelt een paar losse signalen op één vorm: waar het record vandaan komt, wat voor plek het is, en wat ermee gebeurt.'
  axes_h: 'Zo lees je een speld'
  axis_shape_h: 'Vorm'
  axis_shape_t: 'Een kleine schijf of een druppel. De schijf is de basis: een record dat een algemene bron beheert, OpenStreetMap inbegrepen. De druppel is een record dat een gespecialiseerde bron of deze gemeenschap beheert.'
  axis_fill_h: 'Vulkleur'
  axis_fill_t: 'Welke categorie. Water, toiletten, beklimmingen, diensten. De vulkleur zegt nooit iets anders; wat een plek binnen zijn categorie is, zit in het symbool.'
  axis_border_h: 'Rand'
  axis_border_t: 'Wie het record beheert. Kleine schijf: een algemene bron. Inktstreepjes: een gespecialiseerde bron voor dit soort plek en deze regio. Vol papier: deze gemeenschap. Een oranje ring betekent dat niemand het in %months% maanden bevestigd heeft; een dikke rode rand, in %months_red% maanden.'
  axis_badge_h: 'Badge'
  axis_badge_t: 'Rechtsboven: een "?" betekent dat niemand hier gestaan heeft, voor zover bekend; geen "?" betekent dat een gedateerde getuige vastligt. Linksboven: een rode "!" betekent nu niet bruikbaar, een klok betekent aanwezig, maar niet altijd.'
  tag_live: 'Op de kaart'
  tiers_h: 'Waar een record vandaan komt'
  tiers_note: 'Wie het record beheert dat je leest. Als twee records één plek beschrijven, houdt de kaart het record dat het dichtst bij de onderkant van deze lijst staat. Niets hiervan zegt hoe goed de plek is; alleen het badge zegt of iemand er gestaan heeft.'
  tier_baseline_h: 'Geïmporteerde basis'
  tier_baseline_t: 'Een kleine schijf. Iemand zette dit op een openbare kaart en niemand hier heeft het record overgenomen. Het paneel noemt de bron.'
  tier_external_h: 'Beheerd door iemand anders'
  tier_external_t: 'Een gestreepte rand. Een gespecialiseerde bron voor dit soort plek en deze regio beheert dit record. Het paneel noemt ze en linkt ernaar.'
  tier_ours_h: 'Onze catalogus'
  tier_ours_t: 'Een volle papieren rand. Deze gemeenschap beheert het record: een fietser voegde het toe, of fietsers bevestigden het en namen het over.'
  tier_unconfirmed_h: 'Niemand heeft hier gestaan'
  tier_unconfirmed_t: 'Een "?"-badge, op elk van de drie iconen hierboven. Geen gedateerde opname en geen bevestiging van een fietser. Kom je langs, controleer het.'
  basemap_h: 'Van de basiskaart'
  basemap_note: 'Tekens die de basiskaart voor een fietser tekent, in het voorbijgaan te lezen. Het zijn geen plekken in de catalogus: geen speld, geen paneel, niets te bevestigen.'
  basemap_bollard_h: 'Paaltje'
  basemap_bollard_t: 'Een paal op de weg. Auto''s stoppen hier, fietsen kunnen erlangs.'
  basemap_gate_h: 'Hek'
  basemap_gate_t: 'Een hek over de weg. Het kan dicht zijn; reken op stoppen.'
  basemap_bicycle_parking_h: 'Fietsenstalling'
  basemap_bicycle_parking_t: 'Een plek om een fiets vast te zetten.'
  basemap_cycle_barrier_h: 'Fietssluis'
  basemap_cycle_barrier_t: 'Een sluis. Te passeren, maar niet op snelheid.'
  kinds_h: 'Wat een plek is, binnen zijn categorie'
  kinds_note: 'Het symbool onderscheidt soorten binnen één categorie, en soorten worden nooit over categorieën heen vergeleken: een kraan waar je niet uit kunt drinken is een ander soort ding, geen kapot ding. Alleen categorieën met meer dan één soort staan hier.'
  kind_b_tap_h: 'Drinkwaterkraan'
  kind_b_tap_t: 'Een blauwe druppel. OSM karteert het als drinkwater en niets zegt het tegendeel. Bevestig ter plekke.'
  kind_b_no_h: 'Geen drinkwater'
  kind_b_no_t: 'Een druppel met een rode streep erdoor. Getagd als niet drinkbaar, of een fietser zei het.'
  kind_b_unk_h: 'Drinkbaarheid onbekend'
  kind_b_unk_t: 'Een lege druppel. Of niemand heeft gezegd of je hier kunt drinken, of iemand heeft gekeken en kon het niet zeggen. Beschouw het als onbekend.'
  kind_b_food_h: 'Eetstop'
  kind_b_food_t: 'Vork en mes op het categorieschijfje. Een bakker, een winkel, een café.'
  kind_b_food_water_h: 'Eetstop met water'
  kind_b_food_water_t: 'Dezelfde, met een kleine blauwe druppel: de plek geeft ook drinkwater.'
  kind_d_shop_h: 'Fietsenwinkel'
  kind_d_shop_t: 'Een tandwiel.'
  kind_d_station_h: 'Reparatiezuil'
  kind_d_station_t: 'Hamer en houweel: een zelfhulpzuil met gereedschap.'
  kind_d_pump_h: 'Pomp'
  kind_d_pump_t: 'Een omcirkelde plus: perslucht of een openbare pomp.'
  kind_g_basic_hut_h: 'Eenvoudige hut'
  kind_g_basic_hut_t: 'Een kleine hut met een deur. In OSM: shelter_type=basic_hut.'
  kind_g_dugout_h: 'Ondergrondse schuilplaats'
  kind_g_dugout_t: 'Een heuvel met een opening. In OSM: shelter_type=dugout.'
  kind_g_field_shelter_h: 'Veldschuur'
  kind_g_field_shelter_t: 'Een schuur met een open voorkant. In OSM: shelter_type=field_shelter.'
  kind_g_gazebo_h: 'Prieel'
  kind_g_gazebo_t: 'Een dak op palen. In OSM: shelter_type=gazebo.'
  kind_g_lean_to_h: 'Afdak'
  kind_g_lean_to_t: 'Een dak dat tot de grond afloopt. In OSM: shelter_type=lean_to.'
  kind_g_pavilion_h: 'Paviljoen'
  kind_g_pavilion_t: 'Een breed dak op zuilen. In OSM: shelter_type=pavilion.'
  kind_g_picnic_shelter_h: 'Picknickschuilhut'
  kind_g_picnic_shelter_t: 'Een dak boven een picknicktafel. In OSM: shelter_type=picnic_shelter.'
  kind_g_rock_shelter_h: 'Rotsoverhang'
  kind_g_rock_shelter_t: 'Een overhangende rots. In OSM: shelter_type=rock_shelter.'
  kind_g_sun_shelter_h: 'Zonnescherm'
  kind_g_sun_shelter_t: 'Een zonnescherm. In OSM: shelter_type=sun_shelter.'
  kind_g_weather_shelter_h: 'Schuilhut'
  kind_g_weather_shelter_t: 'Een gesloten schuilhut met een bank. In OSM: shelter_type=weather_shelter.'
  kind_g_wildlife_hide_h: 'Vogelkijkhut'
  kind_g_wildlife_hide_t: 'Een kijkhut op poten met een kijkspleet. In OSM: shelter_type=wildlife_hide.'
  kind_g_bus_shelter_h: 'Bushokje'
  kind_g_bus_shelter_t: 'Een bushaltebord. In OSM: shelter_type=public_transport.'
  kind_g_defibrillator_h: 'AED'
  kind_g_defibrillator_t: 'Een hart met een bliksem. In OSM: emergency=defibrillator.'
  kind_p_viewpoint_h: 'Uitzichtpunt'
  kind_p_viewpoint_t: 'Een verrekijker: een plek om te stoppen en te kijken. In OSM: tourism=viewpoint.'
  kind_p_peak_h: 'Bergtop'
  kind_p_peak_t: 'Een top. In OSM: natural=peak.'
  kind_p_waterfall_h: 'Waterval'
  kind_p_waterfall_t: 'Water dat over een rand valt. In OSM: waterway=waterfall.'
  kind_p_rapids_h: 'Stroomversnelling'
  kind_p_rapids_t: 'Woelig water in een rivier. In OSM: waterway=rapids.'
  kind_p_cliff_h: 'Klif'
  kind_p_cliff_t: 'Een rotswand. In OSM: natural=cliff.'
  kind_p_cave_h: 'Grotingang'
  kind_p_cave_t: 'Een donkere opening in de rots. In OSM: natural=cave_entrance.'
  kind_p_arch_h: 'Rotsboog'
  kind_p_arch_t: 'Een natuurlijke boog van rots. In OSM: natural=arch.'
  kind_p_rock_h: 'Rots'
  kind_p_rock_t: 'Een opvallende rots. In OSM: natural=rock.'
  kind_p_stone_h: 'Zwerfsteen'
  kind_p_stone_t: 'Een losse steen op de grond. In OSM: natural=stone.'
  kind_q_castle_h: 'Kasteel'
  kind_q_castle_t: 'Een toren met kantelen. In OSM: historic=castle.'
  kind_q_fort_h: 'Fort'
  kind_q_fort_t: 'Muren met bastions. In OSM: historic=fort.'
  kind_q_ruins_h: 'Ruïne'
  kind_q_ruins_t: 'Een kapotte muur. In OSM: historic=ruins.'
  kind_q_monument_h: 'Monument'
  kind_q_monument_t: 'Een obelisk. In OSM: historic=monument.'
  kind_q_memorial_h: 'Gedenkteken'
  kind_q_memorial_t: 'Een gedenksteen. In OSM: historic=memorial.'
  kind_q_archaeological_h: 'Archeologische vindplaats'
  kind_q_archaeological_t: 'Een amfoor. In OSM: historic=archaeological_site.'
  kind_q_manor_h: 'Landhuis'
  kind_q_manor_t: 'Een groot huis. In OSM: historic=manor.'
  kind_q_monastery_h: 'Klooster'
  kind_q_monastery_t: 'Een kloostergang met klokkentoren. In OSM: historic=monastery.'
  kind_q_museum_h: 'Museum'
  kind_q_museum_t: 'Een tempelgevel. In OSM: tourism=museum.'
  kind_q_worship_h: 'Gebedshuis'
  kind_q_worship_t: 'Een kerk met torenspits. In OSM: amenity=place_of_worship.'
  kind_p_nature_h: 'Natuur'
  kind_p_nature_t: 'Een boom: een mooi stuk om te rijden, zoals een weg door een bos. Alleen bij ons: geen OSM-tag beschrijft het.'
  kind_q_heritage_h: 'Erfgoed'
  kind_q_heritage_t: 'Een schild: erfgoed dat geen enkele OSM-soort is. Alleen bij ons.'
  kind_q_architecture_h: 'Architectuur'
  kind_q_architecture_t: 'Een gevel met boogramen: een gebouw dat de stop waard is om zijn architectuur. Alleen bij ons.'
  state_h: 'Wat er met een record gebeurt'
  state_note: 'Deze liggen bovenop elke speld. Ze beschrijven onze omgang met het record, niet de plek zelf.'
  state_stale_h: 'Wordt oud'
  state_stale_t: 'Een oranje ring vervangt de papierkleurige rand. Niemand heeft dit in %months% maanden bevestigd, dus de kaart vraagt "nog steeds daar?"'
  state_lapsed_h: 'Lang niet bevestigd'
  state_lapsed_t: 'Een dikke rode rand vervangt de papierkleurige rand. Niemand heeft dit in %months_red% maanden bevestigd: controleer het voordat je erop rekent.'
  state_pending_h: 'Wacht op een regiobeheerder'
  state_pending_t: 'Een rode speld met een zandloper. Iemand stelde dit voor en nog geen regiobeheerder heeft beslist. Alleen de indiener en regiobeheerders zien hem.'
  state_cluster_h: 'Te veel om te tekenen'
  state_cluster_t: 'Een telbubbel in de categoriekleur. Zoom in en hij valt uiteen.'
  state_look_h: 'Kijk hier'
  state_look_t: 'Een pulserende oranje ring toont waar een aangewezen resultaat of plaats ligt. Dezelfde puls omringt een speld die de zoekfunctie toont terwijl je weergavemodus hem verbergt.'
  state_camera_h: 'Straatfotocamera'
  state_camera_t: 'Een groene speld markeert waar de geopende straatfoto is genomen. Hij beweegt mee terwijl je door de beelden loopt.'
  fact_h: 'Wat er met de plek zelf gebeurt'
  fact_note: 'Een kraan die vandaag kapot is, is hét feit dat een dorstige fietser nodig heeft. Deze markeringen dragen dat soort feiten.'
  fact_broken_h: 'Buiten dienst'
  fact_broken_t: 'Een rode "!"-badge linksboven, los van de kleur en de laag van de speld. Een fietser meldde het als buiten dienst of gesloten.'
  fact_hours_h: 'Niet altijd bereikbaar'
  fact_hours_t: 'Een klokbadge linksboven voor plekken die niet altijd beschikbaar zijn: alleen overdag, achter een hek, of een seizoenskraan in de maanden dat hij dicht is. Een badge, geen kleur, zodat de speld zijn categorie houdt.'
  cats_h: 'De categorieën'
  cats_note: 'De vulkleur beantwoordt alleen "wat voor plek". Eén iconenset voedt de spelden, de lagenlijst en deze pagina, dus elke tegel is aan elke speld te koppelen.'
  cats_practical: 'Praktisch, gericht op volledige dekking'
  cats_voted: 'Door fietsers op de kaart gestemd'
  cats_overlays: 'Kaart-overlays'
  overlay_surface_h: 'Wegdek'
  overlay_routes_h: 'Routenetwerk'
  overlay_switch: 'Overlay-schakelaar'
  overlay_note: 'Overlays zijn schakelaars in het lagenpaneel, geen datalagen: ze kleuren de wegen zelf. Wegdek leeft hier, en zijn legenda is ook een filter: vink alleen gravel aan en de kaart toont alleen gravel.'
  lines_h: 'Lijnen'
  lines_note: 'Alles wat de kaart als streep tekent. De kleine legenda op de kaart zelf toont het wegdek- en netwerkdeel van deze lijst.'
  lines_surfaces: 'Wegdek'
  line_unverified_t: 'Rode streepjes: de weg heeft nog geen wegdek-tag. Het streepje is de betekenis: "heeft een tag nodig".'
  line_ticks_h: 'Kwaliteitsstiksels'
  line_ticks_t: 'Kleine stiksels over een lijn, van groen (uitstekend) via amber naar rood (heel slecht), zichtbaar bij inzoomen.'
  lines_climbs: 'Beklimmingen'
  line_climb_up_h: 'Klimlijn, omhoog'
  line_climb_up_t: 'Paarse banden per steilte, gelijk aan de profielbalken: licht onder 5%, donkerst vanaf 16%.'
  line_climb_down_h: 'Klimlijn, omlaag'
  line_climb_down_t: 'Dezelfde banden in blauw voor dalende stukken.'
  line_summit_h: 'Topvlag'
  line_summit_t: 'Waar de klim eindigt. De speld staat aan de voet.'
  line_steep_h: 'Steilste stuk, gemeten'
  line_steep_t: 'De steilste aanhoudende 250 m die het model kan zien.'
  line_rider_h: 'Steilste punt, door een fietser gemarkeerd'
  line_rider_t: 'Waar de muur volgens een fietser echt staat. Bewust een andere kleur en vorm dan de gemeten markering.'
  lines_routes: 'Routes'
  line_route_rest_h: 'Aanbevolen route'
  line_route_rest_t: 'Lichtoranje over een papierkleurige omlijning.'
  line_route_sel_h: 'Aanbevolen route, geselecteerd'
  scout_h: 'Rit nakijken (Scout)'
  scout_none_h: 'Niet verstuurd'
  scout_none_t: 'Deel van de rit met de radar aan waarvoor geen weg is gevonden. Het blijft op je apparaat.'
  scout_gps_h: 'Je GPS-spoor'
  scout_gps_t: 'Waar je apparaat zegt dat je reed. Het kan naast de weg liggen; het wordt nooit verstuurd.'
  scout_path_h: 'Alleen fietsen'
  scout_path_t: 'Verstuurd. Een fietspad of fietsstraat, apart van de auto’s.'
  scout_lane_h: 'Fietsstrook'
  scout_lane_t: 'Verstuurd. Een strook op de weg geschilderd, naast de auto’s.'
  scout_road_h: 'Gedeelde weg'
  scout_road_t: 'Verstuurd. Je reed tussen de auto’s.'
  scout_car_h: 'Passerende auto, snelheid in %unit%'
  scout_car_t: 'Een auto die je radar je zag inhalen. Het getal is zijn snelheid in %unit%.'
  scout_near_h: 'Auto in de buurt, snelheid in %unit%'
  scout_near_t: 'Een auto op de weg naast je fietspad. Hij haalde je niet in: lawaai, geen gevaar.'
  line_route_sel_t: 'Vol oranje en breder; de andere routes dimmen zolang er één open is.'
  line_knoop_h: 'Knooppunt'
  line_knoop_t: 'Witte schijf, paarse ring en nummer, precies zoals de netwerktegels het tekenen.'
  back_to_map: 'Terug naar de kaart'
