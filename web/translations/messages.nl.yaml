  step2_no: '02'
  step2_h: 'Het landt in je ritbestand'
  step2_p: 'Elke markering wordt geschreven in de activiteit die je computer toch al opnam, in een open formaat — niets aparts om te synchroniseren of kwijt te raken.'
  step3_no: '03'
  step3_h: 'Werk het thuis bij'
  step3_p: 'Thuis corrigeer je een misklik, verschuif je een markering naar de juiste plek op de weg en stuur je hem — als je wilt — naar de Commons, waar hij dezelfde beoordeling doorloopt als elke andere bijdrage.'
