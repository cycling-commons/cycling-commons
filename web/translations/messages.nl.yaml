join:
  kicker: 'Doe mee'
  title: 'Bouw de Commons met ons.'
  lead1: 'De Cycling Commons wordt gebouwd door de mensen die hem gebruiken — in code, in lokale kennis, en in alles daaromheen. Het is vroeg, het is open, en er is ruimte voor jou.'
  lead2: 'Een commons groeit niet door inhuren; het groeit doordat mensen komen opdagen. Hier hebben we handen nodig.'
  heart_kicker: 'De kern ervan'
  heart_h2: 'Fietsers &amp; lokale kennis.'
  heart_lead: 'De Commons is zo goed als wat fietsers weten: de klim die de omweg waard is, waar het water is, de kruising die gevaarlijk is, het rondje dat stil perfect is. Die kennis is het hele punt — en het is het enige dat niemand voor je kan bouwen.'
  hnote_b: 'Eerlijke noot — het bijdragesysteem is nog niet live.'
  hnote_body: 'Wat je hier ziet is een werkend prototype: de flows zijn echt, maar niets wordt opgeslagen. Zo kun je de Commons <i>vandaag</i> al voeden, geen wachten vereist:'
  howto1_b: 'Voeg objectieve feiten toe in OpenStreetMap.'
  howto1_body_pre: 'Waterplaatsen, reparatiestations, wegdekken — voeg ze nu toe aan'
  howto1_body_post: '. We bouwen op OSM en dragen terug bij, dus het stroomt de Commons in. Hier niets voor nodig.'
  howto2_b: 'Vorm het prototype.'
  howto2_body_pre: 'Klik door'
  howto2_themap: 'de kaart'
  howto2_mid1: ', '
