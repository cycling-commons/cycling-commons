  data_sub: 'Open Database License 1.0 (ODbL) · inhoud DbCL 1.0'
  data_tldr: 'Gebruik de data voor alles — ook commerciële producten — zolang je bronvermelding geeft, eventuele verbeterde databases onder dezelfde licentie deelt, en ze open houdt. Dezelfde afspraak als OpenStreetMap.'
  data_can1: 'Gebruik, kopieer en deel het — gratis'
  data_can2: 'Pas het aan en bouw er producten op'
  data_can3: 'Gebruik het commercieel'
