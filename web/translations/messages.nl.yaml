about:
  kicker: 'Over ons'
  title: 'De kaart is van iedereen.'
  lead1: 'Elke fietser draagt een eigen kaart mee: de fontein die redding bracht op een hete julidag, de klim die het extra uur meer dan waard was, de achterweg die altijd leeg is. Vandaag leeft die kennis in één hoofd en sterft daar mee. Cycling Commons is de plek waar ze in plaats daarvan leeft.'
  lead2: 'Het is een open, door de gemeenschap gebouwde kaart van de mooiste fietsroutes ter wereld — voor elke vorm van fietsen. Open data die iedereen kan gebruiken, beheerd door de fietsers die hem bouwen.'
  problem_kicker: 'Het probleem'
  problem_title: 'Een andere app voor alles.'
  problem_lead1: 'Klimmen in één app, routes in een andere, slaapplaatsen in een derde, wegomstandigheden nergens — het meeste gesloten, niets samenhangend. Fietsers betalen voor een dozijn tools en zien nog steeds niet het hele plaatje. De kennis bestaat; ze is gewoon verspreid en opgesloten.'
  problem_lead2: 'De Commons brengt de niet-persoonlijke kennis — de kaart, nooit de fietser — op één open plek samen. Vrij te bevragen, vrij te exporteren, vrij om op te bouwen, voor iedereen.'
  believe_kicker: 'Wat wij geloven'
  believe_princ1_num: 'I'
  believe_princ1_title: 'De kaart, niet de fietser.'
  believe_princ1_body: 'Open feiten over plaatsen, niet over mensen — de Commons verzamelt niets over hoe, waar of wanneer je fietst.'
  believe_princ2_num: 'II'
  believe_princ2_title: 'Open voor iedereen.'
  believe_princ2_body: 'ODbL-data, CC BY-SA-media, een gratis API — bruikbaar door iedereen, commercieel of niet.'
  believe_princ3_num: 'III'
  believe_princ3_title: 'Curatie, geen overload.'
  believe_princ3_body: 'Het beste van een regio, gestemd door fietsers, geen eindeloze dump.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Bestuurd, niet alleen gepubliceerd.'
  believe_princ4_body: 'Gebaseerd op Elinor Ostrom''s principes voor commons die niet instorten of worden overgenomen.'
  believe_ostrom: 'won de Nobelprijs Economie 2009 door aan te tonen dat gemeenschappen een gedeelde hulpbron duurzaam kunnen beheren — zonder privatisering en zonder centrale eigenaar — als een paar ontwerpprincipes aanwezig zijn: duidelijke grenzen, regels die zijn opgesteld door de betrokkenen, toezicht en graduele sancties. De Cycling Commons past ze toe; de'
  believe_ostrom_link: 'bestuurspagina'
  believe_ostrom_suffix: 'koppelt elk principe aan een deel van het systeem.'
  partners_kicker: 'Partners, geen silo''s'
  partners_title: 'Waar goede open data bestaat, sluiten we ons daarbij aan.'
  partners_lead1_pre: 'De Commons is er niet om te herbouwen wat anderen al hebben geopend. We bouwen op'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'en dragen er aan bij. En voor de lagen die we niet bezitten — zoals fietsvriendelijke slaapplaatsen — werken we liever samen met'
  partners_lead1_partner: 'open gemeenschappen'
  partners_lead1_post: ', zoals open gastvrij­heidsnetwerken, dan dat we een privékopie van hun data afschermen.'
  partners_lead2: 'Open data moet verbinden, niet verder fragmenteren. Elke samenwerking maakt de hele atlas rijker zonder dat iemand hem insluit.'
  steward_kicker: 'Wie het beheert'
  steward_title: 'BikeCoders vandaag — een stichting morgen.'
  steward_lead: 'BikeCoders start en beheert de Commons vandaag. Maar de belofte is vanaf dag één publiek: open licentie, gescheiden data en accounts, en een pad om uit te groeien tot een onafhankelijke stichting (een Nederlandse'
  steward_stichting: 'Stichting'
  steward_lead_post: ') zodra er een gemeenschap is om die te besturen. De open licentie en het afzonderlijke eigendom maken latere insluiting moeilijk in stilte te doen.'
  steward_cta_map: 'Verken de kaart →'
  steward_cta_account: 'Maak een gratis account aan'
privacy:
  kicker: 'Privacy'
  title: 'Wat we verzamelen, en waarom.'
  lead: 'Gewone taal. De Cycling Commons-dataset is niet-persoonlijk — open geodata over plaatsen, nooit over mensen. Het <b>platformaccount</b> is een ander verhaal: dat bevat persoonsgegevens (e-mail, inloggegevens, sessielogboeken). Dit is wat we bijhouden, waarom, en de controle die je hebt.'
  prototype_bold: 'Dit is een prototype — een eerste schets van onze intenties, geen definitief of bindend beleid.'
  prototype_body: 'Het beschrijft hoe we de Cycling Commons met persoonsgegevens willen omgaan, opgesteld in lijn met de AVG en de Nederlandse UAVG. Dit verandert nog vóór de lancering.'
  last_updated: 'Laatst bijgewerkt 29 juni 2026 · concept v0.2'
  h_responsible: 'Wie is verantwoordelijk'
  responsible_p1_pre: 'De verwerkingsverantwoordelijke is'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', gevestigd in Nederland, dat de Cycling Commons vandaag beheert. Zoals beschreven in ons'
  responsible_p1_governance: 'bestuursdocument'
  responsible_p1_post: ', heeft de Commons de intentie om over te gaan naar een onafhankelijke Nederlandse stichting (<i>Stichting</i>); de verwerkingsverantwoordelijke wordt dan overgedragen en deze pagina wordt bijgewerkt.'
  responsible_p2_pre: 'Vragen over jouw gegevens:'
  responsible_p2_mid: '. Je hebt ook het recht om een klacht in te dienen bij de Nederlandse toezichthouder, de'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  h_collect: 'Wat we verzamelen'
  collect_intro: 'We vragen het minimum dat nodig is om een open, betrouwbare kaart te beheren. We vragen nooit naar je echte naam.'
  h3_account: 'Wanneer je een account aanmaakt'
  collect_account_email: 'Je <b>e-mailadres</b> — om je in te loggen, het account te beveiligen en essentiële serviceberichten te sturen.'
  collect_account_password: 'Een <b>wachtwoord</b>, dat we uitsluitend als gezouten hash opslaan — we zien of bewaren de platte tekst nooit.'
  collect_account_displayname: 'Een <b>weergavenaam</b> die je zelf kiest — het kan een pseudoniem zijn, en het is het enige dat anderen van je zien.'
  collect_account_2fa: 'Als je <b>twee-factor-authenticatie (2FA)</b> inschakelt, slaan we het TOTP-geheim <b>versleuteld op</b>, en je back-upcodes uitsluitend als hashes.'
  h3_contribute: 'Wanneer je bijdraagt'
  collect_contribute_items: 'De <b>klimmen, plaatsen, verbeteringen en stemmen</b> die je indient, en het gegeven dat een account ze heeft ingediend (herkomst). Als je profiel privé is, blijven bijdragen anoniem.'
  collect_contribute_media: 'Eventuele <b>foto''s of video''s</b> die je uploadt. Media kan ingebedde metadata (EXIF) bevatten, zoals een locatie — we verwijderen locatiemetadata uit geüploade media aan onze kant.'
  collect_contribute_profile: 'Optionele publieke-profielgegevens die je invult (bio, links, welke bijdragen te tonen). Profielen zijn'
  collect_contribute_profile_link: 'opt-in'
  collect_contribute_profile_post: ' en standaard uitgeschakeld.'
  h3_auto: 'Automatisch, wanneer je de site gebruikt'
  collect_auto_technical: '<b>Technische gegevens</b> — IP-adres, browsertype en tijdstempels in onze serverlogboeken, bijgehouden om de dienst te beheren en te beveiligen.'
  banner_bold: 'Geen routeregistratie.'
  banner_body: 'De Commons is een kaart van plaatsen, niet van mensen. We verzamelen <b>geen</b> GPS-sporen, jouw routes, je live locatie, of enige registratie van waar je fietst.'
  h_why: 'Waarom we het gebruiken (rechtsgronden)'
  why_contract: '<b>Om je account en de dienst te leveren</b> — uitvoering van een overeenkomst (AVG art. 6 lid 1 sub b).'
  why_consent: '<b>Optioneel openbaar profiel en mediaweergave</b> — jouw toestemming (art. 6 lid 1 sub a), die je op elk moment kunt intrekken in je'
  why_consent_link: 'instellingen'
  why_consent_post: '.'
  why_legitimate: '<b>Beveiliging, misbruikpreventie en geaggregeerde analyses</b> — onze gerechtvaardigde belangen om de Commons eerlijk en werkend te houden (art. 6 lid 1 sub f).'
  why_legal: '<b>Wettelijke verplichtingen nakomen</b> — waar de wet dit vereist (art. 6 lid 1 sub c).'
  h_cookies: 'Cookies & analyses'
  cookies_body: 'We houden dit licht. We gebruiken één <b>essentiële cookie</b> om je ingelogd te houden — geen reclame- of cross-site-trackingcookies. Voor gebruiksstatistieken draaien we <b>zelf-gehoste, cookieloze analyses</b> (Umami, op onze eigen infrastructuur): we tellen paginaweergaven en verwijzers in de aggregaat — <b>geen analysecookies, geen persoonsgegevens, en geen cross-site- of cross-device-tracking</b>. Niets wordt gedeeld met of verkocht aan advertentienetwerken of datamakelaars.'
  h_share: 'Met wie we het delen'
  share_infra: '<b>Infrastructuurproviders</b> die ons helpen de site te beheren (hosting, en voor de kaart: de tegel- en straatbeeldproviders zoals de kaartbibliotheek CDN en Mapillary). Deze kunnen je IP-adres verwerken om inhoud te leveren. Ze treden op als onze verwerkers of als onafhankelijke verwerkingsverantwoordelijken voor die levering.'
  share_osm_pre: 'OpenStreetMap — bijdragen die je kiest terug te geven worden deel van de open kaart onder de'
  share_osm_link: 'ODbL'
  share_osm_post: '. Dat zijn publieke, open data — geen persoonsgegevens over jou.'
  share_noone: '<b>Niemand anders.</b> We verkopen geen persoonsgegevens en we zetten geen advertentietracking van derden in.'
  h_transfers: 'Internationale overdrachten'
  transfers_body: 'Sommige infrastructuurproviders kunnen gegevens verwerken buiten de Europese Economische Ruimte. Waar dat het geval is, steunen we op passende waarborgen — zoals de Standaard Contractuele Clausules van de Europese Commissie of een adequaatheidsbesluit.'
  h_retention: 'Hoe lang we het bewaren'
  retention_account: '<b>Accountgegevens</b> — zolang je account actief is, plus een korte respijtperiode nadat je het sluit.'
  retention_logs: '<b>Serverlogboeken</b> — kort bewaard voor beveiliging en probleemoplossing, daarna verwijderd of geanonimiseerd.'
  retention_contributions: '<b>Bijdragen</b> — feiten die je teruggaf aan de open kaart blijven bestaan als onderdeel van de Commons (met herkomst), ook nadat je vertrekt; het zijn geen persoonsgegevens over jou.'
  h_rights: 'Jouw rechten'
  rights_intro: 'Onder de AVG heb je de volgende rechten:'
  rights_access: '<b>Inzage (art. 15)</b> — vraag een kopie op van de persoonsgegevens die we over je bewaren.'
  rights_correct: '<b>Rectificatie (art. 16)</b> — corrigeer onjuiste gegevens, of vul ontbrekende gegevens aan.'
  rights_erase: '<b>Verwijdering (art. 17)</b> — verwijder je account en alle bijbehorende persoonsgegevens. Je kunt dit op elk moment zelf doen vanuit je accountinstellingen; de verwijdering is permanent.'
  rights_portability: '<b>Gegevensoverdraagbaarheid (art. 20)</b> — ontvang je gegevens in een gestructureerd, machineleesbaar formaat. Een zelfbedieningsexport volgt op korte termijn; stuur ons in de tussentijd een e-mail en we sturen het op.'
  rights_restrict: '<b>Beperking en bezwaar (art. 18–21)</b> — beperk of maak bezwaar tegen bepaalde verwerkingen.'
  rights_withdraw: '<b>Toestemming intrekken</b> op elk moment (bijv. door je openbare profiel uit te zetten) — dit heeft geen invloed op verwerking die al heeft plaatsgevonden.'
  rights_contact_pre: 'Stuur voor de uitoefening van elk van deze rechten een e-mail naar'
  rights_contact_mid: '. We reageren binnen één maand. Ben je niet tevreden met onze reactie, dan kun je een klacht indienen bij de'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Kinderen'
  children_body: 'De Commons is niet bedoeld voor kinderen jonger dan <b>16</b>. We verzamelen niet bewust persoonsgegevens van mensen onder die leeftijd; als je denkt dat een kind ons gegevens heeft verstrekt, neem dan contact op en we verwijderen ze.'
  h_automated: 'Geautomatiseerde beslissingen'
  automated_body: 'We nemen geen beslissingen over je op basis van uitsluitend geautomatiseerde verwerking, en we profileren je niet voor advertenties.'
  h_changes: 'Wijzigingen in dit beleid'
  changes_body: 'Als we wijzigen hoe we omgaan met gegevens, bijwerken we deze pagina en de datum ervan, en — bij wezenlijke wijzigingen — laten we ingelogde bijdragers dat weten.'
  footer_disc_pre: 'Zie ook onze'
  footer_disc_terms: 'Gebruiksvoorwaarden'
  footer_disc_mid: 'en de data-, media- en code-'
  footer_disc_licences: 'licenties'
  footer_disc_post: '.'
terms:
  kicker: 'Gebruiksvoorwaarden'
  title: 'De afspraak, in gewone taal.'
  lead: 'Deze voorwaarden gelden voor het gebruik van de Cycling Commons-website en -account. Ze zijn kort, leesbaar en gebaseerd op dezelfde open principes als de rest van het project.'
  prototype_bold: 'Dit is een prototype — een eerste schets van onze intenties, geen definitief of bindend beleid.'
  prototype_body: 'Het beschrijft hoe we de Cycling Commons willen laten werken. Dit verandert nog vóór de lancering.'
  last_updated: 'Laatst bijgewerkt 22 juni 2026 · concept v0.1'
  h1_accepting: 'Deze voorwaarden aanvaarden'
  accepting_p1_pre: 'Door de Cycling Commons-website te gebruiken of een account aan te maken, ga je akkoord met deze voorwaarden en onze'
  accepting_p1_privacy: 'Privacyverklaring'
  accepting_p1_mid: '. Als je het er niet mee eens bent, gebruik dan de dienst niet. De Commons wordt beheerd door'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' in Nederland, op weg naar een onafhankelijke stichting zoals beschreven in ons'
  accepting_p1_governance: 'bestuursdocument'
  accepting_p1_post: '.'
  h2_who: 'Wie het mag gebruiken'
  who_body: 'Je moet minimaal <b>16</b> jaar oud zijn om een account aan te maken. De informatie die je ons geeft (zoals je e-mailadres) moet juist zijn en van jou.'
  h3_account: 'Jouw account'
  account_password: 'Houd je wachtwoord veilig; jij bent verantwoordelijk voor activiteit onder je account.'
  account_unauthorised: 'Laat het ons direct weten als je ongeautoriseerde toegang vermoedt.'
  account_suspend: 'We kunnen accounts opschorten of sluiten die worden gebruikt voor misbruik of om deze voorwaarden te schenden.'
  h4_using: 'Het goed gebruiken'
  using_intro: 'De Commons werkt omdat mensen hem te goeder trouw gebruiken. Doe dit niet:'
  using_no_illegal: 'De wet overtreden, anderen lastigvallen of onwettige, misleidende of schadelijke inhoud plaatsen.'
  using_no_personal: '<b>Persoonsgegevens over andere mensen</b> uploaden (bijvoorbeeld herkenbare personen op foto''s) zonder een goede rechtsgrond — de Commons brengt plaatsen in kaart, niet mensen.'
  using_no_reidentify_pre: 'Proberen bijdragers te identificeren of de'
  using_no_reidentify_link: 'privacygrens'
  using_no_reidentify_post: ' van het project te ondermijnen die persoonsgegevens buiten houdt.'
  using_no_scrape_pre: 'Scrapen of massaal exporteren buiten wat de open'
  using_no_scrape_link: 'API'
  using_no_scrape_post: ' en de datalicentie toestaan, of de dienst verstoren.'
  h5_contributions: 'Jouw bijdragen'
  contributions_p1_pre: 'Je behoudt het auteurschap van wat je bijdraagt. Om de Commons open te houden, verleen je de licenties in onze'
  contributions_p1_link: 'bijdragevoorwaarden'
  contributions_p1_mid: ': <b>data</b> komt in de Commons terecht onder de'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', en <b>media</b> (foto''s, video) onder'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Je bevestigt dat je het recht hebt om in te dienen wat je indient, dat het de rechten van anderen niet schendt, en dat het geen persoonsgegevens over andere mensen bevat.'
  h6_opendata: 'Open data & de API'
  opendata_pre: 'De Commons-data en -media zijn voor iedereen vrij te gebruiken — ook commercieel — onder hun'
  opendata_link: 'licenties'
  opendata_mid: ', met naamsvermelding. Zie de'
  opendata_dev_link: 'ontwikkelaarsdocumentatie'
  opendata_post: ' voor de API, bulkexport en de attributieregel.'
  h7_code: 'Onze code & merknaam'
  code_pre: 'De platformbroncode is <b>source-available</b> onder de'
  code_link: 'PolyForm Shield License 1.0.0'
  code_post: ' — gebruik hem voor alles behalve het draaien van een product dat concurreert met de Cycling Commons. De naam "Cycling Commons" en het logo zijn niet gelicentieerd voor gebruik dat instemming of affiliatie impliceert.'
  h8_preview: 'Een preview, geen garantie'
  preview_bold: 'Dit is een evoluerend voorbeeld met proefdata.'
  preview_body: 'De Commons is <b>geen</b> navigatie- of veiligheidstool. Vertrouw er niet op voor routering, wegomstandigheden of je veiligheid op de weg — gebruik altijd je eigen oordeel wanneer je fietst.'
  h9_warranty: 'Geen garantie'
  warranty_body: 'De dienst wordt geleverd <b>"zoals hij is"</b> en "zoals beschikbaar", zonder garanties van welke aard dan ook, voor zover toegestaan door de wet. We garanderen niet dat hij nauwkeurig, ononderbroken of foutloos zal zijn.'
  h10_liability: 'Aansprakelijkheid'
  liability_body: 'Voor zover toegestaan door het Nederlandse recht is BikeCoders niet aansprakelijk voor indirecte of gevolgschade die voortvloeit uit jouw gebruik van de Commons. Niets in deze voorwaarden beperkt aansprakelijkheid die wettelijk niet kan worden beperkt.'
  h11_suspension: 'Opschorting & beëindiging'
  suspension_pre: 'Je kunt je account op elk moment sluiten in je'
  suspension_link: 'instellingen'
  suspension_post: '. We kunnen de toegang opschorten of beëindigen als deze voorwaarden worden geschonden of om de Commons of haar gebruikers te beschermen.'
  h12_governing: 'Toepasselijk recht'
  governing_body: 'Deze voorwaarden worden beheerst door het recht van <b>Nederland</b>. Geschillen vallen onder de bevoegde Nederlandse rechters, tenzij dwingend consumentenrecht je andere rechten geeft.'
  h13_changes: 'Wijzigingen'
  changes_body: 'We kunnen deze voorwaarden bijwerken; we plaatsen wijzigingen hier met een nieuwe datum. Door de Commons na een wijziging te blijven gebruiken, aanvaard je de bijgewerkte voorwaarden.'
  h14_contact: 'Contact'
  contact_pre: 'Vragen over deze voorwaarden:'
  contact_post: '.'
  footer_disc_pre: 'Zie ook onze'
  footer_disc_privacy: 'Privacyverklaring'
  footer_disc_mid: 'en de data-, media- en code-'
  footer_disc_licences: 'licenties'
  footer_disc_post: '.'
licenses:
