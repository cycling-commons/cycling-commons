join:
  kicker: 'Doe mee'
  title: 'Bouw de Commons met ons.'
  lead1: 'De Cycling Commons wordt gebouwd door de mensen die hem gebruiken — in code, in lokale kennis, en in alles daaromheen. Het is vroeg, het is open, en er is ruimte voor jou.'
  lead2: 'Een commons groeit niet door inhuren; het groeit doordat mensen komen opdagen. Hier hebben we handen nodig.'
  skills_kicker: 'Leen je vaardigheden'
  skills_h2: 'Help het te bouwen en in stand te houden.'
  role1_rk: '01 · BOUWEN'
  role1_h: 'Ontwikkelaars'
  role1_p: 'Bouw aan het platform zelf: de Symfony-backend en API, de MapLibre-kaart, en de datapijplijn in Python en PostGIS (routering, hoogte, OpenStreetMap-import).'
  role1_link: 'Begin op GitHub →'
  role2_rk: '02 · GROEIEN'
  role2_h: 'Social media & gemeenschap'
  role2_p: 'Vertel het verhaal en laat de groep groeien: het blog schrijven, de kanalen draaien, nieuwkomers welkom heten, en de gemeenschap gezond houden terwijl die groeit.'
  role2_link: 'Neem contact op →'
  role3_rk: '03 · VOLHOUDEN'
  role3_h: 'Fondsenwerver & subsidieaanvragers'
  role3_p: 'Open-data- en duurzame-mobiliteitsbeurzen, EU-fietsfinanciering — de start­baan die de Commons vrij en onafhankelijk houdt.'
  role3_link: 'Neem contact op →'
  role4_rk: '04 · BESCHERMEN'
  role4_h: 'Juridisch & bestuur'
  role4_p: 'De oprichting van de onafhankelijke stichting, ODbL- / CC-licenties, bijdragevoorwaarden en AVG — de structuur die het voor altijd open houdt.'
  role4_link: 'Neem contact op →'
  also_welcome: '<b>Ook welkom:</b> vertalers, ontwerpers, OpenStreetMap-mappers, fotografen en partnership-builders (fietsclubs, toeristische bureaus, fietsvriendelijke overnachtingen). Zie je jouw rol niet?'
