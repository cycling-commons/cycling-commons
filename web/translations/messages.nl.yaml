  rules_kicker: 'De regels'
  rules_body: '<b>Selfservice &amp; eerlijk gebruik.</b> Leesbewerkingen gebruiken een gratis selfservice-sleutel met een gratis maandquotum; betaalde tiers voegen doorvoer en altijd-verse data toe voor intensief gebruik. Neem voor bulk- of offlinegebruik de <b>gratis periodieke export</b> en host die zelf in plaats van de live API te overbelasten — scrapen van de dienst is niet toegestaan. <b>Schrijfbewerkingen zijn gepland (fase 2)</b> en doorlopen dezelfde beoordeling als bijdragen in de app. Licenties: data <b>ODbL 1.0</b>, media <b>CC BY-SA 4.0</b> — naamsvermelding, gelijk delen, open houden; commercieel gebruik is toegestaan. Zie de samenvatting in gewone taal:'
