    media_takedown_granted: 'Je foto is uit de Commons gehaald en onze kopieën ervan zijn verwijderd. Kopieën die anderen onder de licentie hebben gedownload kunnen wij niet bereiken, maar de pagina die jou vermeldde noemt niemand meer.'
    media_takedown_declined: 'Een curator heeft je verwijderverzoek bekeken en er geen reden in gevonden die met persoonsgegevens te maken heeft, dus de foto is weer gepubliceerd. Als we je verkeerd hebben begrepen — zeker als je zelf op de foto staat — reageer dan op dit bericht of mail info@cyclingcommons.org, dan kijken we opnieuw.'
    media_removed_on_report: 'Een van je foto''s is verwijderd na een melding dat er een herkenbare persoon op staat die niet met publicatie heeft ingestemd. Dit gaat over dat ene beeld, niet over je bijdrage — dank daarvoor. We kunnen niet zeggen wie de melding deed, in geen van beide richtingen: die persoon weet ook niet wie de foto uploadde. Vind je de verwijdering onterecht, reageer dan op dit bericht; een curator leest het.'
    media_hidden_pending_review: 'Iemand heeft een van je foto''s gemeld, en vanwege wat de melding beweert hebben we hem meteen van de kaart verborgen terwijl een curator ernaar kijkt. Verborgen is niet verwijderd: de foto blijft van jou, staat er nog, en er is niets gewist. Houdt de melding geen stand, dan staat hij binnen enkele dagen terug en laten we het je weten. Alleen een curator kan een foto verwijderen, nooit een melding op zichzelf — en we kunnen je niet zeggen wie meldde, net zoals die persoon niet te horen kreeg wie uploadde.'
    media_restored_after_review: 'De melding over je foto hield geen stand, dus hij staat weer op de kaart, precies zoals hij was. Dank voor je geduld — eerst verbergen is hoe we zorgen dat een echte klacht nooit dagenlang blijft staan, en dat betekent dat er af en toe een foto voor niets even weg is.'
    media_ready: 'De controles van je foto waren klaar nadat je gestopt was met wachten. Hij staat nu op de kaart en gaat net als elke andere bijdrage naar een curator.'
    media_scan_rejected: 'We konden die foto niet accepteren. Onze controles vonden iets in het bestand, of konden het helemaal niet als afbeelding lezen. Niemand heeft naar de foto gekeken: dit is een automatische controle van het bestand zelf. Probeer een andere foto, of dezelfde opnieuw opgeslagen als JPEG.'
