  frag_water: 'Water · eten · diensten'
  frag_water_tag: 'verspreid'
  frag_vs: 'De Commons → één open atlas'
  what_kicker: 'HET PRINCIPE'
  what_h2: 'Open data over de wereld — nooit over jou.'
  what_lead: 'De Commons bevat de kaart: klimmen, water, gevaren, overnachtingen — feiten over plaatsen, nooit over mensen. Geen identiteit, geen tracking, niets persoonlijks. Gebouwd op OpenStreetMap, teruggegeven aan OpenStreetMap, bestuurd door de gemeenschap.'
  what_in_h: 'De fietsdata van de wereld'
  what_in_p: 'Klimmen, waterplaatsen, schilderachtige uitzichten, erfgoed-POI''s, fietsvriendelijke overnachtingen, wegomstandigheden — open onder ODbL.'
  what_out_h: 'Alles persoonlijks'
  what_out_p: 'Jouw identiteit en privédata — de Commons verzamelt dat nooit. Het brengt de wereld in kaart, niet de fietser.'
  what_free_h: 'Voor iedereen'
  what_free_p: 'Bevraag het, exporteer het, bouw erop. Dat is wat het een commons maakt.'
