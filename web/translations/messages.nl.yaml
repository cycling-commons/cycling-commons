admin:
  col_id: 'ID'
  escalated:
    title: 'Foto''s onder juridische blokkade'
    warning_b: 'Voorzichtig behandelen.'
    warning: 'Deze foto''s zijn geëscaleerd als vermoedelijk illegale inhoud. Ze zijn verborgen voor het publiek en voor het moderatiebureau, en niets in de applicatie kan ze verwijderen. Verwijder het materiaal niet: waar het om meldplichtige inhoud gaat, moet de vastlegging blijven bestaan tot het gemeld is, en de instantie waaraan je meldt bepaalt wanneer het weg mag.'
    lead: 'Een regiobeheerder zag iets wat hij niet alleen wilde beslissen. Lees wat hij schreef voordat je besluit de afbeelding zelf te bekijken.'
    playbook_link: 'Open het incident-playbook'
    empty: 'Er staat op dit moment niets vast.'
