join:
  kicker: 'Doe mee'
  title: 'Bouw de Commons met ons.'
  lead1: 'De Cycling Commons wordt gebouwd door de mensen die hem gebruiken — in code, in lokale kennis, en in alles daaromheen. Het is vroeg, het is open, en er is ruimte voor jou.'
  lead2: 'Een commons groeit niet door inhuren; het groeit doordat mensen komen opdagen. Hier hebben we handen nodig.'
  heart_kicker: 'De kern ervan'
  heart_h2: 'Fietsers &amp; lokale kennis.'
  heart_lead: 'De Commons is zo goed als wat fietsers weten: de klim die de omweg waard is, waar het water is, de kruising die gevaarlijk is, het rondje dat stil perfect is. Die kennis is het hele punt — en het is het enige dat niemand voor je kan bouwen.'
  howto1_b: 'Voeg objectieve feiten toe in OpenStreetMap.'
  howto1_body_pre: 'Waterpunten, reparatiepunten, wegdek: voeg ze toe aan'
  howto1_body_post: '. We bouwen op OSM en dragen terug bij, dus het stroomt de Commons in. Hier niets voor nodig.'
  howto2_b: 'Voeg toe wat jij weet, hier.'
  howto2_body_pre: 'Open'
  howto2_themap: 'de kaart'
  howto2_mid1: 'en verbeter een plek, of ga meteen naar'
  howto2_addclimb: 'een klim toevoegen'
  howto2_mid2: '. Een curator leest elke inzending. Waar de flow niet aansluit op hoe jij je gegevens zou invoeren,'
  howto2_email: 'mail ons'
  howto2_mid3: 'of'
  howto2_issue: 'open een issue'
  howto2_post: ': dat bepaalt de volgende ronde.'
  howto3_b: 'Voeg een plek toe die je kent.'
  howto3_link: 'Kies een categorie en zet het op de kaart'
  howto3_post: ' — een waterpunt, een gevaar, een uitzichtpunt, een fietsvriendelijke overnachting. Een curator leest het voordat iemand anders het ziet.'
  howto4_b: 'Houd het gebied om je heen kloppend.'
  howto4_link: 'Open de kaart waar je fietst'
  howto4_post: 'en loop langs wat er al staat. Bevestig wat nog klopt, herstel wat verplaatst is, voeg toe wat ontbreekt. Geen rol en niets om je voor aan te melden: het is het nuttigste wat iemand kan doen, en zo houdt een regio op een gok te zijn.'
  howto5_b: 'Neem een regio echt op je.'
  howto5_link: 'Bekijk welke regio''s een curator zoeken'
  howto5_post: 'of vraag om een land dat de Commons nog niet bereikt heeft. Beide beginnen op dezelfde pagina.'
  skills_kicker: 'Leen je vaardigheden'
  skills_h2: 'Help het te bouwen en in stand te houden.'
  role1_rk: '01 · BOUWEN'
  role1_h: 'Ontwikkelaars'
  role1_p: 'Het echte platform: de backend &amp; API (Symfony 7 LTS), de MapLibre-frontend, en de geospatiale pipeline (PostGIS, routering, hoogte, OSM-import).'
  role1_link: 'Begin op GitHub →'
  role2_rk: '02 · GROEIEN'
  role2_h: 'Social media & gemeenschap'
  role2_p: 'Vertel het verhaal en laat de groep groeien: het blog schrijven, de kanalen draaien, nieuwkomers welkom heten, en de gemeenschap gezond houden terwijl die groeit.'
  role2_link: 'Neem contact op →'
  role3_rk: '03 · VOLHOUDEN'
  role3_h: 'Fondsenwerver & subsidieaanvragers'
  role3_p: 'Open-data- en duurzame-mobiliteitsbeurzen, EU-fietsfinanciering — de start­baan die de Commons vrij en onafhankelijk houdt.'
  role3_link: 'Neem contact op →'
  role4_rk: '04 · BESCHERMEN'
  role4_h: 'Juridisch & bestuur'
  role4_p: 'De oprichting van de onafhankelijke stichting, ODbL- / CC-licenties, bijdragevoorwaarden en AVG — de structuur die het voor altijd open houdt.'
  role4_link: 'Neem contact op →'
  also_welcome: '<b>Ook welkom:</b> vertalers, ontwerpers, OpenStreetMap-mappers, fotografen en partnership-builders (fietsclubs, toeristische bureaus, fietsvriendelijke overnachtingen). Zie je jouw rol niet?'
  also_tell: 'Vertel ons wat je zou bijdragen.'
  start_kicker: 'Begin nu'
