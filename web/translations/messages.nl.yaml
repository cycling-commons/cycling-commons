  cur_lead: 'Kom ergens nieuw aan en zie de klimmen, uitzichten en routes die je weekend waard zijn — gestemd door de fietsers die het kennen, elke ronde vernieuwd. Praktische data zoals water streeft naar volledige dekking; de volledige stroom wacht in de achtergrond als je alles wilt.'
