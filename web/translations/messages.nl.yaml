  role2_rk: '02 · GROEIEN'
  role2_h: 'Social media &amp; gemeenschap'
  role2_p: 'Vertel het verhaal, laat de fietsersbasis groeien, verwelkom nieuwkomers, en houd de gemeenschap gezond terwijl ze opschaalt.'
  role2_link: 'Neem contact op →'
  role3_rk: '03 · VOLHOUDEN'
  role3_h: 'Fondsenwerver &amp; subsidieaanvragers'
  role3_p: 'Open-data- en duurzame-mobiliteitsbeurzen, EU-fietsfinanciering — de start­baan die de Commons vrij en onafhankelijk houdt.'
  role3_link: 'Neem contact op →'
  role4_rk: '04 · BESCHERMEN'
  role4_h: 'Juridisch &amp; bestuur'
