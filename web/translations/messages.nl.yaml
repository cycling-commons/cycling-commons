    note_label: 'Notitie voor het dossier (optioneel)'
    note_placeholder: 'bijv. gemeld bij de autoriteiten op …, kenmerk …'
    release: 'Blokkade opheffen'
    release_help: 'Heft de blokkade op en geeft de foto terug aan de normale moderatie. Het zet hem niet terug op de kaart en verwijdert niets.'
    released: 'De blokkade is opgeheven.'
    release_failed: 'De foto kon niet terug uit de privéopslag, dus de blokkade blijft. Probeer het later opnieuw.'
  flood:
    title: 'Playbook: golf van fotomeldingen'
    state_open_b: 'De noodrem op automatisch offline halen staat OPEN.'
    state_open: 'Anonieme meldingen verbergen niet langer zelf foto''s. Werk de stappen hieronder af.'
    state_closed: 'De noodrem is dicht. Normale werking.'
    lead: 'Via de meldroute kan iedereen zeggen dat hij op een foto staat, zonder account, omdat de wet dat recht niet van een account laat afhangen. Die openheid is ook de zwakte: een verspreide aanvaller kan vanaf duizenden adressen tegelijk melden. Deze pagina zegt wat je dan doet.'
    h_what: 'Wat er al automatisch is gebeurd'
    what: 'Een sitebreed budget begrenst hoeveel foto''s anonieme meldingen zelf mogen verbergen: %hourly% per uur en %daily% per dag. Daarboven komen dringende meldingen nog steeds binnen en wachten ze op een regiobeheerder, maar verbergen ze niets meer; het moderatiebureau toont een banner en het waarschuwingsadres krijgt één e-mail per uur. Er is niets gewist of verwijderd: verborgen foto''s staan er nog, hun bijdragers is verteld dat ze verborgen zijn, en alleen een regiobeheerder die toewijst verwijdert iets.'
    h_steps: 'Stappen'
    step_verify: 'Bekijk de wachtende meldingen voor je iets doet. Een echte noodsituatie en een aanval zien er anders uit: echte meldingen zijn zeldzaam, specifiek over een persoon, en verspreid in de tijd.'
    step_restore: 'Herstel in één actie wat duidelijk misbruik is — de bijdragers horen dat hun foto''s terug zijn. Die pagina verwerpt de meldingen in plaats van ze af te wijzen, dus een latere echte claim over dezelfde foto wordt nog steeds gehoord.'
    step_zero: 'Houdt het aan, zet dan het uurbudget op 0. Anonieme meldingen verbergen dan nooit zelf een foto; alles wacht op een regiobeheerder. Dit is de noodstop en er is geen deploy voor nodig.'
    step_desk: 'Zeg de dienstdoende regiobeheerders dat het bureau vol ruis loopt en dat ze het niet massaal mogen afwijzen: afwijzen is een oordeel en sluit die categorie voor die foto voorgoed.'
    step_after: 'Zet na afloop de budgetten terug en noteer hoe het echte tempo eruitzag. De juiste getallen zijn die welke een echt incident je leert.'
    h_dont: 'Niet doen'
    dont_decline: 'Wijs niet massaal af op het moderatiebureau. Gebruik de herstelpagina: afwijzen maakt de foto permanent immuun voor de volgende echte melding van dezelfde soort.'
    dont_raise: 'Verhoog de budgetten niet om de banner weg te krijgen. Het budget is juist wat de schade begrenst.'
    dont_disclose: 'Vertel melders en uploaders niets over elkaar, en publiceer niet de drempels, de precieze beslistoets of welke categorie het snelst werkt. Alles wat een regiobeheerder weet over hoe je een foto laat verwijderen, is ook een script voor social engineering.'
    dont_ignore: 'Ga er niet van uit dat het een aanval is. Controleer eerst; de hendel bestaat voor iets echts.'
    h_real: 'Als het echt is'
    real: 'Zijn de meldingen echt — een werkelijke golf illegale beelden op de kaart — dan is de noodrem niet je vijand: meldingen komen nog binnen en er gaat niets verloren. Houd zelf vanaf het moderatiebureau offline wat offline moet, bewaar de vastleggingen, en betrek onmiddellijk de site-eigenaar. Verwijder nooit bewijs van illegaal materiaal voordat het bij de autoriteiten is gemeld.'
    h_escalated: 'Als een regiobeheerder iets als illegaal escaleert'
    escalated_intro: 'Geëscaleerde foto''s zijn al verborgen voor het publiek en voor het moderatiebureau, en niets in de applicatie kan ze verwijderen. Ze staan hier'
    esc_step_read: 'Lees eerst de woorden van de regiobeheerder en beslis of je de afbeelding überhaupt moet bekijken. Vaak hoeft dat niet.'
    esc_step_report: 'Meld het waar het hoort. Materiaal met een bedreiging voor iemands leven of veiligheid moet onverwijld bij de politie worden gemeld (DSA art. 18). Voor kindermisbruikmateriaal: gebruik het meldpunt (Offlimits / Meldpunt Kinderporno) en/of de politie. Terroristische inhoud kent een bewaarplicht van zes maanden.'
    esc_step_preserve: 'Verwijder niets en vraag niemand dat te doen. De blokkade bestaat zodat de vastlegging blijft bestaan tot er gemeld is; de instantie waaraan je meldt bepaalt wanneer het weg mag.'
    esc_step_release: 'Hef de blokkade alleen op als blijkt dat het niet was wat het leek. Opheffen geeft het terug aan de normale moderatie — het zet het niet terug op de kaart.'
    esc_step_curator: 'Vraag hoe het gaat met de regiobeheerder die escaleerde. Die heeft het gezien zodat niemand anders dat hoefde; dat verdient een bericht.'
  withheld:
    title: 'Foto''s die door een melding offline staan'
    lead: 'Elke foto die een anonieme melding van de kaart heeft verborgen en die nog op een beslissing wacht. Verborgen, niet verwijderd: er is niets gewist, en de bijdrager heeft te horen gekregen dat de foto verborgen is en waarom. Herstellen zet ze terug, licht de bijdrager in en legt vast dat de melding niet echt was — het sluit de categorie niet, dus een latere echte melding over dezelfde foto wordt nog steeds gehoord.'
