  title: 'De korte versie.'
  lead: 'Gewone taal, zodat je weet wat je kunt doen. Drie licenties — één voor de <b>data</b>, één voor de <b>media</b> en één voor de <b>code</b>: de data en media zijn open, de code is source-available.'
  prototype_bold: 'Dit is een prototype — een eerste schets van onze intenties, geen definitief of bindend beleid.'
  prototype_body: 'De onderstaande licenties beschrijven de richting die we beogen voor de Commons, in gewone taal — kan nog wijzigen vóór de lancering.'
