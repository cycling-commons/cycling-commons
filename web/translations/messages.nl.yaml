    s1_b: 'From-headers zijn te vervalsen, en “ik schrijf vanaf mijn nieuwe adres want het oude is weg” is de standaardopening van een overname. Weergavenaam, bijdragen en aanmelddatum zijn openbaar — die kennen bewijst niets.'
    s2_t: 'Anker 1 — de oude mailbox'
    s2_b: 'Antwoord aan het adres in het dossier (ingetypt vanuit dit admin, nooit via reply) met een eenmalige code en eis die terug. Kan de persoon daar ontvangen, dan is de wijziging laag risico.'
    s3_t: 'Anker 2 — een ingelogde sessie'
    s3_b: 'Oude mailbox zogenaamd dood? Dicteer een actie in het account (“zet je fietsradius op 120 km”, “plak deze code een uur in je weergavenaam”) en controleer dat het gebeurd is. Dat bewijst het wachtwoord — en op ingeschreven accounts ook de 2FA-factor.'
    s4_t: 'Geen anker meer = weigeren'
    s4_b: 'Niet kunnen ontvangen op het oude adres ÉN niet kunnen inloggen: er is geen eerlijke manier om eigenaar en aanvaller te onderscheiden. Het veilige antwoord is “maak een nieuw account”. Hier weigeren is precies waarvoor het handmatige proces bestaat, geen supportfout.'
    s5_t: 'Ook na verificatie: dek je in'
    s5_b: 'Informeer het oude adres met een “dit was ik niet”-bezwaartermijn, stel uitvoering 48–72 uur uit en leg de wijziging vast met een auditnotitie op de gebruiker.'
    rule: 'Urgentie is een rood signaal, nooit een reden om een stap over te slaan — de echte eigenaar overleeft 48 uur vertraging; het venster van de aanvaller meestal niet.'
    spec: 'Canonieke versie: docs/specs/account-and-auth.md §8 “Support playbook” — houd beide synchroon.'
  settings:
    title: 'Systeemconfiguratie'
    intro: 'De redactionele getallen waarop de site draait. Een wijziging geldt vanaf het volgende verzoek — geen deploy, geen herstart. Elke wijziging komt met oude en nieuwe waarde in het activiteitenlogboek.'
    infra_note: 'Infrastructuurwaarden (dekkingstegels, de manifest-URL, de Content-Security-Policy-host van de kaart) staan hier bewust niet: die worden in de omgeving gezet en wijzigen vraagt een deploy.'
    save: 'Instellingen opslaan'
    reset: 'Terugzetten'
    overridden: 'Hier gewijzigd'
    default_note: 'Standaard: %value%'
    range_note: 'Toegestaan: %min%–%max%'
    error_range: 'Vul een heel getal tussen %min% en %max% in.'
    error_required: 'Dit mag niet leeg zijn — elke instelling heeft een waarde nodig.'
    error_text: 'Die waarde is niet toegestaan voor deze instelling.'
    group:
      map: 'Kaart'
      routes: 'Routes'
      moderation: 'Moderatie'
      media: 'Foto''s'
      alerts: 'Waarschuwingen'
      community: 'Community'
    field:
      community_voting_live:
        label: 'Seizoensstemmen is live'
        help: 'Zet op 1 wanneer de stemrondes open zijn. Op 0 blijft elke stem-knop op de kaart verborgen — een knop voor een ronde die niet bestaat lijkt kapot.'
      traffic_grouping:
        label: 'Gemeten verkeer: tijdgroepen'
        help: 'Hoe curatoren gemeten verkeer zien: all (één groep per weg), daytype (werkdagen en weekenden apart) of daytype_band (hetzelfde, in vijf delen van de dag). Eén indeling tegelijk, zodat geen groep uit twee andere af te leiden is. Elke wijziging wordt gelogd.'
      traffic_map_layer_live:
        label: 'Gemeten verkeer: op de kaart'
        help: 'Zet op 1 om curatoren de laag met gemeten verkeer op de kaart te tonen. Bij 0 zijn de laag en haar knoppen verborgen: ze is nog niet in gebruik.'
      map_confirmed_default_threshold:
        label: 'Klaar voor Bevestigd: gecontroleerde plekken'
        help: 'Hoeveel plekken die iemand heeft gecontroleerd een regio nodig heeft voordat een regiobeheerder hem standaard in Bevestigd-modus mag openen. Er is geen spreiding over soorten nodig, alleen genoeg om de modus niet leeg te laten lijken.'
      map_curated_default_threshold:
        label: 'Klaar voor Best-of: totaal aantal items'
        help: 'Hoeveel geselecteerde items een regio in totaal nodig heeft voordat een regiobeheerder hem standaard in Selectie-modus mag openen. Verlaag het om jonge regio’s eerder vrij te geven, verhoog het om de lat hoog te houden.'
      map_curated_default_min_blocks:
        label: 'Klaar voor Best-of: soorten items'
        help: 'Hoeveel verschillende blokken (wegdek, klimmen, slapen, uitzichten, erfgoed, beste routes) elk hun eigen minimum moeten halen. Zet het op 1 om er weer een kaal totaal van te maken.'
      map_curated_default_min_per_block:
        label: 'Klaar voor Best-of: items per soort'
        help: 'Wat een blok nodig heeft om mee te tellen voor de eis hierboven. Samen voorkomen deze twee dat één volle laag een regio in zijn eentje draagt.'
      map_confirmation_stale_months:
        label: "Bevestigingen verlopen na (maanden)"
        help: "Hoe lang de controle van een fietser op een kraan, winkel, toilet of gevaar meetelt. Daarna geeft de kaart de speld een oranje ring, zodat een fietser die langskomt weet dat het de moeite waard is om te kijken. Eén controle zet de klok terug. Plekken die niet veranderen - beklimmingen, uitzichten, erfgoed - verlopen nooit."
      map_item_verify_threshold:
        label: 'Fietsers nodig om een plek te bevestigen'
        help: 'Hoeveel fietsers behalve de indiener een plek moeten bevestigen voordat die zichzelf bevestigt en zijn "?" verliest. Een regiobeheerder regelt het nog steeds met één tik. Zet hem lager voor rustige regio''s waar twee fietsers anders nooit bij dezelfde kraan staan.'
      route_region_active_cap:
        label: 'Actieve routes per regio'
        help: 'Hoeveel routes een regio tegelijk live mag hebben. Een regiobeheerder die boven het plafond goedkeurt, wordt geblokkeerd en gevraagd eerst iets uit roulatie te nemen.'
      route_ride_verify_threshold:
        label: 'Ritten nodig om een route te verifiëren'
        help: 'Hoeveel fietsers anders dan de indiener een route als gereden moeten markeren voordat hij zichzelf verifieert. Verlaag het voor jonge regio’s waar routes anders nooit uit de wachtrij komen.'
      moderation_retention_months:
        label: 'Afgewezen foto''s: bestanden bewaard (maanden)'
        help: 'Hoe lang de bestanden van een afgewezen foto bewaard blijven voordat de opruimronde ze verwijdert. Het fotorecord en het moderatiebesluit blijven. Afgewezen bijdragen en hun berichten volgen deze termijn niet: ze blijven zolang het account van de fietser bestaat.'
      media_urgent_breaker_hourly:
        label: 'Budget automatisch offline halen: per uur'
        help: 'Hoeveel foto''s een anonieme melding van ''intiem beeld of een kind'' in één uur zelf van de kaart mag verbergen. Verbergen is niet verwijderen — alleen een regiobeheerder verwijdert een foto. Boven dit budget bereiken meldingen nog steeds het moderatiebureau maar verbergen ze niets meer, en krijg je een e-mail. Zet het op 0 om automatisch verbergen tijdens een aanhoudende aanval helemaal uit te zetten.'
      media_urgent_breaker_daily:
        label: 'Budget automatisch offline halen: per dag'
        help: 'Hetzelfde plafond over een dag gemeten, zodat een langzame druppel niet lukt wat een golf niet lukt. Beide budgetten moeten ruimte hebben voordat een melding zelf een foto kan verbergen.'
      app_alert_emails:
        label: 'Ontvangers van waarschuwingen'
        help: 'E-mailadressen, gescheiden door komma''s, die operationele waarschuwingen krijgen: het opengaan van de noodrem en elke escalatie van vermoedelijk illegale inhoud. Pas het aan als de gebruikelijke lezer weg is — een escalatie moet dezelfde dag iemand bereiken. Minstens één geldig adres is verplicht.'
      app_support_emails:
        label: 'Ontvangers ondersteuning'
        help: 'Door komma''s gescheiden e-mailadressen die berichten uit het contactformulier en bugmeldingen ontvangen. Los van de alertontvangers hierboven, zodat de voordeur en de pieper naar verschillende mensen kunnen wijzen. Laat het LEEG om terug te vallen op de alertontvangers.'
