  howto2_mid2: ', of een stemronde, en'
  howto2_email: 'mail ons'
  howto2_mid3: ' — of'
  howto2_issue: 'open een issue'
  howto2_post: '— waar het niet overeenkomt met hoe je je data echt zou invoeren. Op dit moment <i>is</i> feedback de bijdrage.'
  howto3_b: 'Stuur lokale kennis.'
  howto3_link: 'Draag een plek bij op GitHub'
  howto3_post: ' — een klim, een gevaar, een mooie rit — en we cureren het terwijl de Commons zich vult.'
  howto4_b: 'Wees er als eerste bij.'
  howto4_link: 'Laat je e-mailadres achter'
  howto4_post: ' en we vertellen je het zodra open bijdragen live gaat.'
  skills_kicker: 'Leen je vaardigheden'
  skills_h2: 'Help het te bouwen en in stand te houden.'
  role1_rk: '01 · BOUWEN'
  role1_h: 'Ontwikkelaars'
  role1_p: 'Het echte platform: de backend &amp; API (Symfony 7 LTS), de MapLibre-frontend, en de geospatiale pipeline (PostGIS, routering, hoogte, OSM-import).'
