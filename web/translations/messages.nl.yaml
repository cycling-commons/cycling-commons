  gaps_kicker: 'Grootste hiaten: waar je kunt helpen'
  gap_body: '%count% in beeld in de hele atlas. Momenteel een van de dunste lagen.'
  gaps_cta_pre: 'Deze hiaten worden gedicht door mensen, niet door algoritmen:'
