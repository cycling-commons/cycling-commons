about:
  kicker: 'Over ons'
  title: 'De kaart is van iedereen.'
  lead1: 'Elke fietser draagt een eigen kaart mee: de fontein die redding bracht op een hete julidag, de klim die het extra uur meer dan waard was, de achterweg die altijd leeg is. Nu zit die kennis in één hoofd en verdwijnt ze daarmee. Cycling Commons geeft haar een plek waar ze blijft.'
  lead2: 'Het is een open, door de gemeenschap gebouwde kaart van ''s werelds beste fietsbelevingen, voor elke vorm van fietsen. Open data die iedereen kan gebruiken, beheerd door de fietsers die hem bouwen.'
  problem_kicker: 'Het probleem'
  problem_title: 'Een andere app voor alles.'
  problem_lead1: 'Klimmen in één app, routes in een andere, slaapplaatsen in een derde, wegomstandigheden nergens, het meeste gesloten, niets samenhangend. Fietsers betalen voor een dozijn tools en zien nog steeds niet het hele plaatje. De meeste kennis bestaat al; ze is alleen versnipperd, of zit vast in één app.'
  problem_lead2: 'De Commons brengt de niet-persoonlijke kennis, de kaart, nooit de fietser, op één open plek samen. Vrij te bevragen, vrij te exporteren, vrij om op te bouwen, voor iedereen.'
  believe_kicker: 'Wat wij geloven'
  believe_princ1_num: 'II'
  believe_princ1_title: 'De kaart, niet de fietser.'
  believe_princ1_body: 'Open feiten over plaatsen, niet over mensen, de Commons verzamelt niets over hoe, waar of wanneer je fietst.'
  believe_princ2_num: 'III'
  believe_princ2_title: 'Open voor iedereen.'
  believe_princ2_body: 'ODbL-data, CC BY-SA 4.0-media, een gratis API, bruikbaar door iedereen, commercieel of niet.'
  believe_princ3_num: 'I'
  believe_princ3_title: 'Curatie, geen overload.'
  believe_princ3_body: 'Het beste van een regio, gestemd door fietsers, geen eindeloze dump.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Bestuurd, niet alleen gepubliceerd.'
  believe_princ4_body: 'Gebaseerd op Elinor Ostrom''s principes voor commons die niet instorten of worden overgenomen.'
  believe_ostrom: 'toonde aan dat gemeenschappen een gedeelde hulpbron kunnen beheren zonder privatisering en zonder centrale eigenaar. Ze deelde de Nobelprijs voor Economie 2009 met Oliver E. Williamson, haar helft voor haar analyse van de commons. De'
  believe_ostrom_link: 'bestuurspagina'
  believe_ostrom_suffix: 'koppelt elk principe aan een deel van het systeem.'
  made_kicker: 'Zo wordt het gemaakt'
  made_title: 'Vijf soorten mensen, één kringloop.'
  made_ride: '<b>Fietsers</b> vinden water, eten, reparatiepunten, beklimmingen en slaapplekken op één kaart. Ze checken een route voordat ze vertrekken, of plannen hem rond wat de kaart laat zien en maken hem af in de planner die ze al gebruiken.'
  made_add: '<b>Bijdragers</b> voegen toe wat ze onderweg vinden, van een nieuw kraantje tot een afgesloten brug. Een regiobeheerder controleert elke toevoeging voordat die online komt.'
  made_curate: '<b>Regiobeheerders</b> zorgen voor een regio die ze kennen: ze beoordelen wat fietsers insturen, houden dat deel van de kaart kloppend en brengen de Commons onder de aandacht van fietsers daar.'
  made_extend: '<b>Makers</b> bouwen het platform zelf: code, datapijplijnen, ontwerp, vertalingen en financiering.'
  made_build: '<b>Bouwers</b> nemen de open data mee in hun eigen apps en tools, gratis onder een open licentie, zodat die fietsers bereikt waar ze ook rijden. Op termijn komt wat hun gebruikers toevoegen terug via dezelfde API.'
  partners_kicker: 'Partners, geen silo''s'
  partners_title: 'Waar goede open data bestaat, sluiten we ons daarbij aan.'
  partners_lead1_pre: 'De Commons is er niet om te herbouwen wat anderen al hebben geopend. We bouwen op'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'en dragen er aan bij. En voor de lagen die we niet bezitten, zoals fietsvriendelijke slaapplaatsen, werken we liever samen met'
  partners_lead1_partner: 'open gemeenschappen'
  partners_lead1_post: ', zoals open gastvrij­heidsnetwerken, dan dat we een privékopie van hun data afschermen.'
  partners_lead2: 'Open data moet verbinden, niet verder fragmenteren. Elke samenwerking maakt de hele atlas rijker zonder dat iemand hem insluit.'
  steward_kicker: 'Wie het beheert'
  steward_title: 'BikeCoders vandaag, een stichting morgen.'
  steward_lead: 'BikeCoders start en beheert de Commons vandaag. Maar de belofte is vanaf dag één publiek: open licentie, gescheiden data en accounts, en een pad om uit te groeien tot een onafhankelijke stichting zodra er een gemeenschap is om die te besturen. Alles wat al is vrijgegeven, code en data, blijft voorgoed open: geen toekomstige eigenaar, verkoop of koerswijziging kan het terugnemen.'
  steward_cta_map: 'Verken de kaart →'
  steward_cta_account: 'Maak een gratis account aan'
coverage:
  kicker: 'Stand van de Atlas'
  title: 'Hoe compleet is de kaart?'
  lead: 'Wat gedekt is, wat dun is, en waar hulp welkom is. Live cijfers, rechtstreeks uit de database.'
  kpi_pois: 'Referentie-items in beeld'
  kpi_items: 'Catalogusitems'
  kpi_routes: 'Aanbevolen routes'
  kpi_countries: 'Gestarte landen'
  table_kicker: 'Dekking per land'
  terms_reference: '<b>Referentie-items</b>: de basis die we per gebied volgen, geoogst uit OpenStreetMap. Deze laag is volledig OSM; data uit andere bronnen komt binnen als catalogusitem, waar het zijn eigen herkomst houdt.'
  terms_catalog: '<b>Catalogusitems</b>: wat de Commons zelf beheert, met eigen kenmerken, geschiedenis en bevestigingen. De tweede regel zegt waar die rijen vandaan komen: <b>OSM</b> overgenomen uit OpenStreetMap, <b>partner</b> geïmporteerd uit een open dataset die iemand anders bijhoudt, <b>fietsers</b> hier bijgedragen, <b>afgeleid</b> berekend door de pijplijn.'
  terms_bars: '<b>Per %u%</b>: dichtheid over het aangesloten gebied, zodat een klein land eerlijk naast een groot land staat. De balk is datzelfde cijfer, geschaald tegen het dichtstbevolkte land.'
  th_country: 'Land'
  th_regions: 'Regio''s'
  th_pois: 'Referentie-items'
