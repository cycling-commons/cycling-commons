export:
  readme: |
    JOUW CYCLING COMMONS-GEGEVENS
    =============================

    Gegenereerd op %generated% voor het account "%account%".

    Dit archief beantwoordt twee AVG-rechten tegelijk: het recht op inzage
    (art. 15) en het recht op gegevensoverdraagbaarheid (art. 20).
    Overdraagbaarheid dekt alleen wat je ons zelf hebt gegeven en inzage dekt
    meer dan dat, dus in plaats van je te laten kiezen tussen twee downloads
    is dit het geheel.

    WAT ERIN ZIT

      account.json        Je account: e-mail, weergavenaam, taal, land,
                          basislocatie, voorkeuren en tijdstempels.
      contributions.json  De inzendingen die je deed, en de veldwijzigingen die
                          ze op de kaart opleverden nadat een regiobeheerder ze
                          accepteerde.
      community.json      Bevestigingen, seizoensstemmen, ritten,
                          correctievoorstellen, landverzoeken,
                          regiobeheerdersaanmeldingen.
      messages.json       Je dashboardberichten, in beide richtingen.
      consent.json        Elke fotolicentie die je verleende: welke tekst,
                          welke versie, en wanneer.
      translations.json   Jouw voorgestelde UI-vertalingen. Dit zijn
                          AGPL-3.0-only-bijdragen, geen persoonsgegevens over de
                          fietser.
      photos/index.json   Eén regel per geüploade foto, met status en het
                          bijbehorende bestand.
      photos/*.webp       De foto's zelf.

    WAT ER NIET IN ZIT, EN WAAROM

      Je wachtwoord, je tweefactorgeheim en je back-upcodes. Dat zijn de
      inloggegevens die dit account beschermen. Een export is een bestand dat
      mensen doorsturen en back-uppen, en de sleutels meeleveren met de inhoud
      zou je minder veilig maken, niet beter geïnformeerd.

      De identiteit van de regiobeheerders die je werk behandelden. Wat er over je
      inzendingen besloten is, is jouw gegeven en staat hier volledig in,
      notities inbegrepen. Wie de beslissing nam, is die van hen.

    OVER DE FOTO'S

      Dit zijn onze verwerkte kopieën, niet de bestanden die je uploadde. We
      hercoderen elke foto bij binnenkomst en verwijderen de metadata, ook elke
      locatie die de camera vastlegde, dus het bestand precies zoals jij het
      stuurde bewaren we niet. Een regel in de index met "file": null is een
      foto waarvan de opgeslagen objecten al verwijderd zijn; de vastlegging
      ervan blijft.

      Foto's die een regiobeheerder goedkeurde zijn gelicentieerd onder CC BY-SA 4.0
      en blijven deel van de Commons. Die licentie kan niet worden ingetrokken.
      Je naam staat echter niet in de bestanden: de naamsvermelding wordt live
      uit je profiel opgehaald, dus je profiel privé maken of je account
      sluiten verandert wat elke kopie van je foto vermeldt, ook kopieën die
      lang geleden zijn gedownload.

    VRAGEN

      info@cyclingcommons.org
