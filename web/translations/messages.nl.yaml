about:
  kicker: 'Over ons'
  title: 'De kaart is van iedereen.'
  lead1: 'Elke fietser draagt een eigen kaart mee: de fontein die redding bracht op een hete julidag, de klim die het extra uur meer dan waard was, de achterweg die altijd leeg is. Vandaag leeft die kennis in één hoofd en sterft daar mee. Cycling Commons is de plek waar ze in plaats daarvan leeft.'
  lead2: 'Het is een open, door de gemeenschap gebouwde kaart van de mooiste fietsroutes ter wereld — voor elke vorm van fietsen. Open data die iedereen kan gebruiken, beheerd door de fietsers die hem bouwen.'
  problem_kicker: 'Het probleem'
  problem_title: 'Een andere app voor alles.'
  problem_lead1: 'Klimmen in één app, routes in een andere, slaapplaatsen in een derde, wegomstandigheden nergens — het meeste gesloten, niets samenhangend. Fietsers betalen voor een dozijn tools en zien nog steeds niet het hele plaatje. De kennis bestaat; ze is gewoon verspreid en opgesloten.'
  problem_lead2: 'De Commons brengt de niet-persoonlijke kennis — de kaart, nooit de fietser — op één open plek samen. Vrij te bevragen, vrij te exporteren, vrij om op te bouwen, voor iedereen.'
  believe_kicker: 'Wat wij geloven'
  believe_princ1_num: 'I'
  believe_princ1_title: 'De kaart, niet de fietser.'
  believe_princ1_body: 'Open feiten over plaatsen, niet over mensen — de Commons verzamelt niets over hoe, waar of wanneer je fietst.'
  believe_princ2_num: 'II'
  believe_princ2_title: 'Open voor iedereen.'
  believe_princ2_body: 'ODbL-data, CC BY-SA-media, een gratis API — bruikbaar door iedereen, commercieel of niet.'
  believe_princ3_num: 'III'
  believe_princ3_title: 'Curatie, geen overload.'
  believe_princ3_body: 'Het beste van een regio, gestemd door fietsers, geen eindeloze dump.'
  believe_princ4_num: 'IV'
  believe_princ4_title: 'Bestuurd, niet alleen gepubliceerd.'
  believe_princ4_body: 'Gebaseerd op Elinor Ostrom''s principes voor commons die niet instorten of worden overgenomen.'
  believe_ostrom: 'won de Nobelprijs Economie 2009 door aan te tonen dat gemeenschappen een gedeelde hulpbron duurzaam kunnen beheren — zonder privatisering en zonder centrale eigenaar — als een paar ontwerpprincipes aanwezig zijn: duidelijke grenzen, regels die zijn opgesteld door de betrokkenen, toezicht en graduele sancties. De Cycling Commons past ze toe; de'
  believe_ostrom_link: 'bestuurspagina'
  believe_ostrom_suffix: 'koppelt elk principe aan een deel van het systeem.'
  partners_kicker: 'Partners, geen silo''s'
  partners_title: 'Waar goede open data bestaat, sluiten we ons daarbij aan.'
  partners_lead1_pre: 'De Commons is er niet om te herbouwen wat anderen al hebben geopend. We bouwen op'
  partners_lead1_osm: 'OpenStreetMap'
  partners_lead1_mid: 'en dragen er aan bij. En voor de lagen die we niet bezitten — zoals fietsvriendelijke slaapplaatsen — werken we liever samen met'
  partners_lead1_partner: 'open gemeenschappen'
  partners_lead1_post: ', zoals open gastvrij­heidsnetwerken, dan dat we een privékopie van hun data afschermen.'
  partners_lead2: 'Open data moet verbinden, niet verder fragmenteren. Elke samenwerking maakt de hele atlas rijker zonder dat iemand hem insluit.'
  steward_kicker: 'Wie het beheert'
  steward_title: 'BikeCoders vandaag — een stichting morgen.'
  steward_lead: 'BikeCoders start en beheert de Commons vandaag. Maar de belofte is vanaf dag één publiek: open licentie, gescheiden data en accounts, en een pad om uit te groeien tot een onafhankelijke stichting zodra er een gemeenschap is om die te besturen. De open licentie en het afzonderlijke eigendom maken latere insluiting moeilijk in stilte te doen.'
  steward_cta_map: 'Verken de kaart →'
  steward_cta_account: 'Maak een gratis account aan'
privacy:
  kicker: 'Privacy'
  title: 'Wat we verzamelen, en waarom.'
  lead: 'Gewone taal. De Cycling Commons-dataset is niet-persoonlijk — open geodata over plaatsen, nooit over mensen. Het <b>platformaccount</b> is een ander verhaal: dat bevat persoonsgegevens (e-mail, inloggegevens, sessielogboeken). Dit is wat we bijhouden, waarom, en de controle die je hebt.'
  last_updated: 'Laatst bijgewerkt 27 augustus 2026'
  h_responsible: 'Wie is verantwoordelijk'
  responsible_p1_pre: 'De verwerkingsverantwoordelijke is'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', gevestigd in Nederland, dat de Cycling Commons vandaag beheert. Zoals beschreven in ons'
  responsible_p1_governance: 'bestuursdocument'
  responsible_p1_post: ', heeft de Commons de intentie om over te gaan naar een onafhankelijke Nederlandse stichting; de verwerkingsverantwoordelijke wordt dan overgedragen en deze pagina wordt bijgewerkt.'
  responsible_p2_pre: 'Vragen over jouw gegevens:'
  responsible_p2_mid: '. Je hebt ook het recht om een klacht in te dienen bij de Nederlandse toezichthouder, de'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'We hebben <b>geen functionaris voor gegevensbescherming (FG) aangesteld</b>, en dat hoeft ook niet: we zijn een kleine club, we volgen mensen niet op grote schaal, en bijzondere persoonsgegevens horen niet bij wat we doen (AVG art. 37). Vragen en verzoeken over gegevensbescherming gaan naar hetzelfde adres als al het andere,'
  dpo_post: ', en er leest een mens mee. Verandert dat ooit en stellen we wel iemand aan, dan komt die naam op deze pagina.'
  h_collect: 'Wat we verzamelen'
  collect_intro: 'We vragen het minimum dat nodig is om een open, betrouwbare kaart te beheren. We vragen nooit naar je echte naam.'
  h3_account: 'Wanneer je een account aanmaakt'
  collect_account_email: 'Je <b>e-mailadres</b> — om je in te loggen, het account te beveiligen en essentiële serviceberichten te sturen.'
  collect_account_password: 'Een <b>wachtwoord</b>, dat we uitsluitend als gezouten hash opslaan — we zien of bewaren de platte tekst nooit.'
  collect_account_displayname: 'Een <b>weergavenaam</b> die je zelf kiest. Het mag een pseudoniem zijn, en we vragen nooit om je echte naam. Je profiel staat <b>standaard uit</b>: zolang het uit staat, draagt wat je bijdraagt helemaal geen naam. Zet je het aan, dan worden je weergavenaam, je land, de maand waarin je begon en het aantal bijdragen openbaar.'
  collect_account_2fa: 'Als je <b>twee-factor-authenticatie (2FA)</b> inschakelt, slaan we het TOTP-geheim <b>versleuteld op</b>, en je back-upcodes uitsluitend als hashes.'
  collect_account_base: 'Een optionele <b>uitvalsbasis</b> — een punt op stadsniveau (~1 km nauwkeurig) en een rijradius, als je die instelt. Wordt alleen gebruikt om je eigen kaartweergave af te bakenen; nooit getoond aan andere fietsers, en nooit onderdeel van de Commons-dataset.'
  h3_contribute: 'Wanneer je bijdraagt'
  collect_contribute_items: '<b>Alles wat je in de Commons schrijft.</b> Een plek, een beklimming, een route, een correctie, een stem, een controle ter plaatse, een regiobeschrijving, een vertaling, een melding, een bericht aan een curator: als je het typte en verstuurde, hebben wij het. Bij elk daarvan leggen we vast dat een account het maakte; dat is wat een curator laat terugschrijven en wat andere rijders laat zien dat de kaart door mensen wordt bijgehouden. Zolang je profiel uit staat, draagt niets ervan je naam.'
  collect_contribute_media: 'De <b>foto''s</b> die je uploadt. Een foto kan verborgen gegevens bevatten (EXIF), zoals waar hij genomen is: die halen we eruit en we coderen het bestand opnieuw, dus wat we publiceren draagt er niets meer van. Daarna schrijven we één ding terug: een stempel dat de foto onder CC BY-SA 4.0 valt, en een link naar zijn pagina hier. <b>Je naam komt nooit in het bestand.</b> Via die link vindt iemand die de foto hergebruikt wie hij moet noemen, en die pagina noemt jou alleen zolang je profiel openbaar is.'
  collect_contribute_profile: 'Optionele publieke-profielgegevens die je invult (bio, links, welke bijdragen te tonen). Profielen zijn'
  collect_contribute_profile_link: 'opt-in'
  collect_contribute_profile_post: ' en standaard uitgeschakeld.'
  h3_auto: 'Automatisch, wanneer je de site gebruikt'
  collect_auto_technical: '<b>Technische gegevens</b> — IP-adres, browsertype en tijdstempels in onze serverlogboeken, bijgehouden om de dienst te beheren en te beveiligen.'
  collect_auto_ratelimit: "<b>Limiettellers</b> — gebruik je een hulpmiddel zonder account, zoals de ritcontrole, dan tellen we je gebruik op een gezouten eenrichtingshash van je IP-adres in plaats van het adres zelf. Zo kunnen we een eerlijke daglimiet toepassen zonder een lijst bij te houden van wie er langskwam. Hashen is geen anonimisering: de teller blijft persoonsgegevens en alles op deze pagina geldt ervoor."
  banner_bold: 'Geen routeregistratie.'
  banner_body: 'De Commons is een kaart van plaatsen, niet van mensen. We verzamelen <b>geen</b> GPS-sporen, jouw routes, je live locatie, of enige registratie van waar je fietst.'
  h_why: 'Waarom we het gebruiken (rechtsgronden)'
  why_contract: '<b>Om je account en de dienst te leveren</b>: uitvoering van een overeenkomst (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">AVG art. 6 lid 1 sub b</a>).'
  why_consent: '<b>Je naam tonen.</b> Een openbaar profiel, en met naam genoemd worden bij wat je bijdroeg, berust op jouw toestemming (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">AVG art. 6 lid 1 sub a</a>). Je trekt die op elk moment in bij je'
  why_consent_link: 'instellingen'
  why_consent_post: ' en je naam verdwijnt van die pagina''s. Bij ons gebeurt dat meteen. Een kaartbestand dat de browser van iemand anders al had opgehaald kan tot een uur oud zijn, en een kopie van een pagina die iemand zelf bewaarde is helemaal buiten ons bereik.'
  why_licence: '<b>Publiceren wat je bijdraagt.</b> Een foto of een bewerking die je aan de Commons geeft, wordt gepubliceerd onder de licentie waarmee je akkoord ging toen je hem stuurde, en dat hoort bij onze overeenkomst met jou (art. 6 lid 1 sub b). Die licentie is volgens haar eigen voorwaarden <b>onherroepelijk</b>, dus je toestemming intrekken haalt je naam van de pagina maar maakt de bijdrage zelf niet ongedaan. Eén uitzondering telt: staat <b>jij</b> op de foto, dan zijn dat jouw persoonsgegevens, en een auteursrechtlicentie tekent je gegevensbeschermingsrechten niet weg. Elke fotopagina heeft een link om te vragen of hij weggehaald kan worden.'
  why_updates: '<b>Je laten weten als er een uitgave komt.</b> Alleen als je erom vroeg: de schakelaar in je instellingen is jouw toestemming (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">AVG art. 6 lid 1 sub a</a>), en hem uitzetten trekt die in. Elk bericht heeft bovendien een afmeldlink van één klik waarvoor je niet hoeft in te loggen. Alleen release-notities, nooit reclame, en de lijst wordt nooit gedeeld of verkocht.'
  why_legitimate: '<b>Beveiliging, misbruikpreventie en geaggregeerde analyses</b>: onze gerechtvaardigde belangen om de Commons eerlijk en werkend te houden (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">art. 6 lid 1 sub f</a>).'
  why_legal: '<b>Wettelijke verplichtingen nakomen</b>: waar de wet dit vereist (<a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">art. 6 lid 1 sub c</a>).'
  h_cookies: 'Cookies & analyses'
  cookies_body: 'We houden dit licht. We plaatsen <b>twee cookies</b>, allebei strikt noodzakelijk, en allebei hieronder volledig opgesomd. Voor gebruiksstatistieken draaien we <b>zelfgehoste analytics</b> op onze eigen server op <b>analytics.bikecoders.life</b>: die ontvangt de pagina-URL, de verwijzende pagina, je schermgrootte en je browsertype, en ontvangt je <b>IP-adres</b>, dat een persoonsgegeven is, maar <b>bewaart het niet</b>. Het adres wordt alleen gebruikt om een globale locatie te bepalen (land, regio en stad) en om er een eenrichtings-sessiekenmerk uit af te leiden, en wordt daarna weggegooid. Er worden geen analytics-cookies geplaatst, geen bezoeker krijgt een blijvend kenmerk of wordt aan een account gekoppeld, en er is geen cross-site- of cross-device-tracking. Analytics-gegevens blijven op onze eigen infrastructuur en worden nooit gedeeld met of verkocht aan derden.'
  h3_cookie_table: 'De cookies die we plaatsen'
  ck_h_name: 'Naam'
  ck_h_purpose: 'Wat die doet'
  ck_h_life: 'Hoe lang die blijft'
  ck_session_purpose: 'Houdt je ingelogd en draagt het token dat elk formulier op de site beschermt tegen cross-site request forgery (CSRF), een aanval waarbij een andere website jouw browser hier een formulier laat versturen alsof jij het bent. Hij wordt gezet als je inlogt, en op de paar pagina''s met een formulier dat we voor je moeten onthouden, zoals de contactpagina. Alleen de kaart en de rest van de site lezen zet geen enkele cookie. Er staat een willekeurige code in en verder niets: geen naam, geen e-mailadres, geen registratie van wat je bekeek.'
  ck_session_life: 'Tot je je browser sluit'
  ck_remember_purpose: 'Logt je bij je volgende bezoek weer in zonder om je wachtwoord te vragen. Wordt <b>alleen</b> gezet als je bij het inloggen <b>Onthoud mij</b> aanvinkt, en verdwijnt zodra je uitlogt.'
  ck_remember_life: '7 dagen'
  cookies_none_body: 'Dat is de hele lijst. We plaatsen <b>geen</b> advertentiecookie, <b>geen</b> analysecookie en <b>geen</b> cross-site-trackingcookie, op geen enkele pagina. Beide cookies hierboven zijn strikt nodig om iets te leveren waar je zelf om vroeg, dus vraagt de wet er geen toestemming voor, en daarom staat er hier geen cookiebanner. Zouden we ooit iets toevoegen dat er wél een nodig heeft, dan vragen we het je eerst in plaats van het aan te nemen.'
  cookies_local_body: 'De kaart bewaart ook een paar van je eigen instellingen in de <b>lokale opslag</b> van je browser: het lichte of donkere kaartthema, het gebied waar je het laatst keek, en welke filters aanstonden. Dat is geen cookie, het gaat nooit naar onze server, en het verdwijnt zodra je je browsergegevens wist. <b>Geen enkele andere website kan het lezen.</b> Je browser houdt de lokale opslag van elke site streng gescheiden, dus wat hier wordt bewaard is alleen door deze site te lezen.'
  h_share: 'Met wie we het delen'
  share_infra: '<b>De bedrijven die onze infrastructuur draaien.</b> Hosting, back-ups, accountmail, en de kaartdiensten die je browser rechtstreeks ophaalt. Ze staan allemaal met naam in de twee tabellen hieronder, met wat ze doen en wat ze kunnen zien.'
  share_osm_pre: 'OpenStreetMap — bijdragen die je kiest terug te geven worden deel van de open kaart onder de'
  share_osm_link: 'ODbL'
  share_osm_post: '. Dat zijn publieke, open data — geen persoonsgegevens over jou.'
  share_noone: '<b>Niemand anders.</b> We verkopen geen persoonsgegevens en we zetten geen advertentietracking van derden in.'
  share_selfhosted: 'Eerst wat er <b>niet</b> in deze lijsten staat. We draaien zoveel mogelijk zelf: de kaartgegevens, de routeplanning, het hoogtemodel achter de stijgingspercentages, de foto-opslag en zelfs de gebruiksstatistieken staan op onze eigen machines. Twee diensten die we vroeger extern aanriepen, voor routes en voor hoogte, hebben we in 2026 juist daarom naar binnen gehaald. Zo bouwen kost meer tijd en meer geld. Het is ook waarom je browser met vijf externe diensten praat in plaats van twintig, en waarom de tabellen hieronder zo kort zijn: elke naam erin is er een die we niet redelijkerwijs zelf konden draaien.'
  h3_processors: 'De bedrijven die gegevens voor ons verwerken'
  processors_intro: 'Drie bedrijven bewaren of verwerken je gegevens in onze opdracht. Zij zijn onze <b>verwerkers</b>: ze mogen alleen doen wat wij ze opdragen, onder een schriftelijk contract, en ze mogen je gegevens nergens voor zichzelf voor gebruiken.'
  pr_h_who: 'Wie'
  pr_h_where: 'Waar'
  pr_h_what: 'Wat ze voor ons doen'
  pr_h_sees: 'Wat ze kunnen zien'
  pr_hetzner_where: 'Falkenstein, Duitsland (EER)'
  pr_hetzner_what: 'Draait de machines: de website, de database en de opslag met geüploade foto''s.'
  pr_hetzner_sees: 'In principe alles wat we bewaren, want het staat op hun hardware: je e-mailadres, je bijdragen, je foto''s en de serverlogboeken. Wachtwoorden en tweefactorgeheimen zijn ook daar onleesbaar (zie <b>Hoe we het beschermen</b>).'
  pr_scaleway_where: 'Europese Economische Ruimte'
  pr_scaleway_what: 'Bezorgt de e-mail die de site zelf verstuurt (adresbevestiging, wachtwoordherstel, verwijdercode, moderatieberichten) en bewaart de nachtelijke back-ups.'
  pr_scaleway_sees: 'Je e-mailadres en de inhoud van de berichten die de site je stuurt. De back-ups worden op onze eigen servers versleuteld voordat ze verstuurd worden, dus aan de andere kant is de inhoud niet te lezen.'
  pr_proton_where: 'Zwitserland (gedekt door een EU-adequaatheidsbesluit)'
  pr_proton_what: 'Beheert de mailbox van het project, het adres dat op deze pagina staat, en de antwoorden die een mens hier terugschrijft.'
  pr_proton_sees: 'Je e-mailadres en wat je ons ook maar schreef, zolang het gesprek bewaard blijft.'
  h3_browser_services: 'Diensten die je browser rechtstreeks benadert'
  browser_services_intro: 'De kaart wordt in je browser samengesteld, dus een paar onderdelen komen rechtstreeks van de partij die ze publiceert en niet via ons. We geven ze nooit je account, je weergavenaam of je e-mailadres. Ze zien wel het netwerkadres waar je verzoek vandaan komt, want elk verzoek op internet draagt er een. Niets in deze lijst laadt voordat je een pagina opent die het gebruikt.'
  bs_h_service: 'Dienst'
  bs_h_what: 'Waarvoor het is'
  bs_h_sees: 'Wat die ontvangt'
  bs_sees_ip: 'Je IP-adres en welke kaartvakjes je opvroeg.'
  bs_openfreemap_what: 'De basiskaart: de wegen, het water en de plaatsnamen onder al het andere.'
  bs_esri_what: 'De satellietweergave, pas zodra je die aanzet.'
  bs_esri_sees: 'Je IP-adres en welke beeldvakjes je opvroeg. Esri zit in de Verenigde Staten.'
  bs_mapillary_what: 'Straatbeeldfoto''s, pas zodra je het straatbeeld opent.'
  bs_mapillary_sees: 'Je IP-adres en welke foto''s je opende. Mapillary wordt gerund door Meta Platforms Ireland Limited, in Ierland, en de beeldbestanden zelf komen van het contentnetwerk van Meta, dat wereldwijd is.'
  bs_photon_what: 'Plaatszoeken, terwijl je in het zoekvak typt.'
  bs_photon_sees: 'Je IP-adres en de woorden die je in het zoekvak typt. Photon draait bij komoot, in Duitsland.'
  bs_wikimedia_what: 'Referentiefoto''s van sommige beklimmingen en plekken, als de foto van Wikimedia Commons komt.'
  bs_wikimedia_sees: 'Je IP-adres en welke foto de pagina toonde. De Wikimedia Foundation zit in de Verenigde Staten.'
  browser_services_post: 'Twee daarvan zitten buiten de Europese Economische Ruimte (EER): <b>Esri</b> en de <b>Wikimedia Foundation</b>, allebei in de Verenigde Staten. Open je de satellietlaag nooit en bekijk je nooit een pagina met een Commons-foto, dan neemt je browser ook nooit contact met ze op. Zie <b>Internationale overdrachten</b> hieronder.'
  h_transfers: 'Internationale overdrachten'
  transfers_body: 'Sommige infrastructuurproviders kunnen gegevens verwerken buiten de Europese Economische Ruimte. Waar dat het geval is, steunen we op passende waarborgen — zoals de Standaard Contractuele Clausules van de Europese Commissie of een adequaatheidsbesluit.'
  h_retention: 'Hoe lang we het bewaren'
  retention_account: '<b>Accountgegevens.</b> Tot je je account verwijdert, en dan zijn ze weg. Verwijderen gebeurt direct: je vraagt het aan, wij mailen je een code, je bevestigt, en op dat moment verdwijnt het account uit de live database. Het e-mailadres, de wachtwoordhash, het tweefactorgeheim en de back-upcodes gaan mee. Er is geen wachttijd en er wordt niets achtergehouden voor het geval je van gedachten verandert. Twee dingen horen er eerlijk bij. Onze nachtelijke back-ups bevatten het oude record nog tot ze uitrouleren, en dat duurt <b>hoogstens 90 dagen</b>; die back-ups zijn versleuteld en gaan alleen open om van een ramp te herstellen. En we verwijderen een account <b>niet</b> alleen omdat er jaren niemand op ingelogd heeft. Beginnen we daar ooit mee, dan schrijven we je eerst en krijg je de tijd om het te houden.'
  retention_logs: '<b>Serverlogboeken.</b> <b>30 dagen</b> bewaard en daarna automatisch verwijderd. Ze bevatten IP-adressen: een webserver schrijft het adres van de bezoeker in zijn foutmeldingen en biedt geen instelling om dat weg te laten. Die termijn is dus de begrenzing, niet een belofte over de inhoud.'
  retention_ratelimit: "<b>Limiettellers.</b> Één dag."
  retention_contributions: '<b>Bijdragen.</b> Feiten die je teruggaf aan de open kaart blijven bestaan als onderdeel van de Commons (met herkomst), ook nadat je vertrekt; het zijn geen persoonsgegevens over jou.'
  retention_consent: '<b>Licentietoestemmingen.</b> Wanneer je een foto onder licentie aan de Commons geeft, leggen we vast dat je akkoord ging, met welke tekst precies, en wanneer. We bewaren die vastlegging onbeperkt, en ze blijft bestaan nadat je je account sluit: het is ons bewijs dat de licentie is verleend, dat we nodig kunnen hebben om een rechtsvordering in te stellen of te verdedigen (art. 17(3)(e)). Ze bevat een accountverwijzing en verder niets over jou, en zodra het account weg is, identificeert die verwijzing hier niemand meer.'
  retention_mail: '<b>E-mail die je ons stuurt.</b> We bewaren een gesprek zolang de zaak loopt, en verwijderen het binnen <b>24 maanden</b> nadat die is afgerond. Dat dekt jou als je er een jaar later op terugkomt, en het dekt ons als er laat een klacht komt over hoe we het hebben aangepakt. Gesprekken die deel uitmaken van een juridische kwestie, zoals een auteursrechtclaim of een verwijderverzoek, bewaren we tot die kwestie is afgehandeld.'
  retention_updates: '<b>De uitgavelijst.</b> Je adres blijft erop tot je het er zelf afhaalt, via je instellingen of via de link in elk bericht. We bewaren de vastlegging dat je akkoord ging, en met welke tekst, net als bij een fotolicentie: dat is het bewijs dat we je mochten schrijven.'
  h_security: 'Hoe we het beschermen'
  security_intro: 'De wet vraagt ons maatregelen te nemen die bij het risico passen (art. 32). In gewone woorden:'
  security_passwords: '<b>Je wachtwoord wordt nooit bewaard.</b> We houden er alleen een onomkeerbare versleuteling van, dus niemand hier kan je wachtwoord lezen en een gestolen database geeft niemand het jouwe in handen.'
  security_secrets: '<b>Tweefactorgeheimen en back-upcodes zijn versleuteld waar ze staan</b>, met de sleutel buiten de database. Wie alleen de database steelt, krijgt er nog steeds geen werkende code uit.'
  security_transport: '<b>Alles gaat versleuteld</b>, tussen jou en ons, en opnieuw wanneer een back-up onze servers verlaat. Browsers krijgen te horen dat ze een onversleutelde verbinding met ons helemaal moeten weigeren.'
  security_access: '<b>Alleen wie je gegevens nodig heeft kan erbij</b>, en elke moderator en beheerder moet met twee factoren inloggen. Herhaalde mislukte inlogpogingen worden afgeremd en daarna geblokkeerd.'
  security_source_pre: 'Dat is de korte versie. De precieze maatregelen, en de redenering achter elke keuze, staan in onze'
  security_source_link: 'openbare broncode'
  security_source_post: '. Daar bouwen we het in de openbaarheid voor: je hoeft een veiligheidsalinea niet op ons woord te geloven.'
  security_honest: 'Geen systeem is perfect en we doen niet alsof het onze dat wel is. Er zit geen certificering achter deze alinea en geen pentest: wat er wel is, is een klein systeem dat zo weinig mogelijk bewaart, en code die iedereen kan nakijken.'
  h_breach: 'Als er ooit gegevens uitlekken'
  breach_pre: 'Als persoonsgegevens verloren gaan, blootliggen of bereikt worden door iemand die dat niet hoort, en dat waarschijnlijk een risico vormt voor de rechten van mensen, melden we het bij de'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>binnen 72 uur</b> nadat we het weten (art. 33). Is het risico voor jou persoonlijk hoog, dan nemen we ook rechtstreeks en zonder uitstel contact met je op (art. 34), in gewone taal: wat er gebeurd is, welke van je gegevens erbij betrokken waren, wat we eraan gedaan hebben en wat jij moet doen. We houden intern een register bij van elk datalek, ook de lekken die we niet hoeven te melden, zodat het patroon voor ons zichtbaar blijft ook als geen enkel geval op zichzelf meldingsplichtig is.'
  h_rights: 'Jouw rechten'
  rights_intro: 'Onder de <a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj">AVG</a> heb je de volgende rechten:'
  rights_access: '<b>Inzage (art. 15)</b> — vraag een kopie op van de persoonsgegevens die we over je bewaren.'
  rights_correct: '<b>Rectificatie (art. 16)</b> — corrigeer onjuiste gegevens, of vul ontbrekende gegevens aan.'
  rights_erase: '<b>Verwijdering (art. 17)</b> — verwijder je account op elk moment vanuit je accountinstellingen. Je persoonsgegevens gaan mee en komen niet terug. Twee dingen blijven bewust bestaan, en geen van beide identificeert je daarna: de bijdragen die je aan de open kaart gaf, en de vastlegging dat je een fotolicentie hebt verleend. Beide staan hierboven beschreven onder <b>Hoe lang we het bewaren</b>.'
  rights_portability: '<b>Gegevensoverdraagbaarheid (art. 20)</b> — download alles wat we over je bewaren als één ZIP-bestand, wanneer je maar wilt, vanuit je accountinstellingen. Het bevat je accountgegevens, je bijdragen, je berichten, je licentietoestemmingen en je foto''s als bestanden.'
  rights_restrict: '<b>Beperking en bezwaar (art. 18–21)</b> — beperk of maak bezwaar tegen bepaalde verwerkingen.'
  rights_withdraw: '<b>Toestemming intrekken</b> op elk moment (bijv. door je openbare profiel uit te zetten) — dit heeft geen invloed op verwerking die al heeft plaatsgevonden.'
  rights_third_party_photo: '<b>Geen gebruiker?</b> Deze rechten hangen niet af van een account. Sta je herkenbaar op een foto op onze kaart, dan heeft elke fotopagina een link <b>"deze foto toont mij"</b>. Meld het daar, zonder account en zonder identiteitsbewijs, en een curator antwoordt uiterlijk binnen een maand.'
  rights_contact_pre: 'Stuur voor de uitoefening van elk van deze rechten een e-mail naar'
  rights_contact_mid: '. We antwoorden <b>uiterlijk binnen een maand</b>, en meestal veel eerder. De wet staat tot drie maanden toe voor een verzoek dat echt ingewikkeld is, maar alleen als we je binnen die eerste maand laten weten dat het langer duurt, en waarom. Ben je niet tevreden met ons antwoord, dan kun je klagen bij de'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Kinderen'
  children_body: 'De Commons is niet bedoeld voor kinderen jonger dan <b>16</b>. We verzamelen niet bewust persoonsgegevens van mensen onder die leeftijd; als je denkt dat een kind ons gegevens heeft verstrekt, neem dan contact op en we verwijderen ze.'
  h_automated: 'Geautomatiseerde beslissingen'
  automated_body: 'We nemen geen beslissingen over je op basis van uitsluitend geautomatiseerde verwerking, en we profileren je niet voor advertenties.'
  h_changes: 'Wijzigingen in dit beleid'
  changes_body: 'Als we wijzigen hoe we omgaan met gegevens, bijwerken we deze pagina en de datum ervan, en — bij wezenlijke wijzigingen — laten we ingelogde bijdragers dat weten.'
  changes_versions_pre: 'Je kunt dat ook zelf nakijken in plaats van ons op ons woord te geloven. Het platform is source-available, dus deze pagina en de tekst erop staan in een openbare repository, en elke wijziging staat er met datum en reden in de'
  changes_versions_link: 'paginageschiedenis'
  changes_versions_post: '.'
  footer_disc_pre: 'Zie ook onze'
  footer_disc_terms: 'Gebruiksvoorwaarden'
  footer_disc_mid: 'en de data-, media- en code-'
  footer_disc_licences: 'licenties'
  footer_disc_post: '.'
terms:
  kicker: 'Gebruiksvoorwaarden'
  title: 'De afspraak, in gewone taal.'
  lead: 'Deze voorwaarden gelden voor het gebruik van de Cycling Commons-website en -account, in gewone taal.'
  last_updated: 'Laatst bijgewerkt 1 augustus 2026'
  h1_accepting: 'Deze voorwaarden aanvaarden'
  accepting_p1_pre: 'Door de Cycling Commons-website te gebruiken of een account aan te maken, ga je akkoord met deze voorwaarden en onze'
  accepting_p1_privacy: 'Privacyverklaring'
  accepting_p1_mid: '. Als je het er niet mee eens bent, gebruik dan de dienst niet. De Commons wordt beheerd door'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' in Nederland, op weg naar een onafhankelijke stichting zoals beschreven in ons'
  accepting_p1_governance: 'bestuursdocument'
  accepting_p1_post: '.'
  h2_who: 'Wie het mag gebruiken'
  who_body: 'Je moet minimaal <b>16</b> jaar oud zijn om een account aan te maken. De informatie die je ons geeft (zoals je e-mailadres) moet juist zijn en van jou.'
  h3_account: 'Jouw account'
  account_password: 'Houd je wachtwoord veilig; jij bent verantwoordelijk voor activiteit onder je account.'
  account_unauthorised: 'Laat het ons direct weten als je ongeautoriseerde toegang vermoedt.'
  account_suspend: 'We kunnen accounts opschorten of sluiten die worden gebruikt voor misbruik of om deze voorwaarden te schenden.'
  h4_using: 'Het goed gebruiken'
  using_intro: 'De Commons werkt omdat mensen hem te goeder trouw gebruiken.'
  using_no_illegal: 'Overtreed de wet niet, val anderen niet lastig en plaats geen onwettige, misleidende of schadelijke inhoud.'
  using_no_personal: 'Upload geen <b>persoonsgegevens over andere mensen</b> (bijvoorbeeld herkenbare personen op foto''s) zonder een goede rechtsgrond — de Commons brengt plaatsen in kaart, niet mensen.'
  using_no_reidentify_pre: 'Probeer bijdragers niet te identificeren en ondermijn de'
  using_no_reidentify_link: 'privacygrens'
  using_no_reidentify_post: ' van het project te ondermijnen die persoonsgegevens buiten houdt.'
  using_no_scrape_pre: 'Scrape de dienst niet. Punt — de'
  using_no_scrape_link: 'API en bulkexport'
  using_no_scrape_post: ' zijn de manier om aan de data te komen. Geen van beide is al live, dus mail tot die tijd info@cyclingcommons.org en we bezorgen je wat je nodig hebt.'
  using_no_disrupt: 'Verstoor de dienst niet en werk niet om de limieten heen.'
  h5_contributions: 'Jouw bijdragen'
  contributions_p1_pre: 'Je behoudt het auteurschap van wat je bijdraagt. Om de Commons open te houden, verleen je de licenties in onze'
  contributions_p1_link: 'bijdragevoorwaarden'
  contributions_p1_mid: ': <b>data</b> komt in de Commons terecht onder de'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', en <b>media</b> (foto''s, video) en '
  contributions_p1_mid3: '<b>UI-vertalingen</b> onder'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Je bevestigt dat je het recht hebt om in te dienen wat je indient, dat het de rechten van anderen niet schendt, en dat het geen persoonsgegevens over andere mensen bevat.'
  h6_opendata: 'Open data & de API'
  opendata_pre: 'De Commons-data, -media en UI-vertalingen zijn voor iedereen vrij te gebruiken — ook commercieel — onder hun'
  opendata_link: 'licenties'
  opendata_mid: ', met naamsvermelding. Zie de'
  opendata_dev_link: 'ontwikkelaarsdocumentatie'
  opendata_post: ' voor de attributieregel, en voor de API en bulkexport zoals die ontworpen worden — geen van beide is al live.'
  h7_code: 'Onze code & merknaam'
  code_pre: 'De platformbroncode is <b>source-available</b> onder de'
  code_link: 'PolyForm Shield License 1.0.0'
  code_post: ' — gebruik hem voor alles behalve het draaien van een product dat concurreert met de Cycling Commons. De naam "Cycling Commons" en het logo zijn niet gelicentieerd voor gebruik dat instemming of affiliatie impliceert.'
  h8_preview: 'Een intentie, geen garantie'
  preview_body: 'De Cycling Commons is een intentie, <b>geen</b> garantie. Vertrouw er niet op voor routes, wegomstandigheden of je veiligheid op de weg — gebruik altijd je eigen oordeel tijdens het fietsen.'
  h9_warranty: 'Geen garantie'
  warranty_body: 'De dienst wordt geleverd <b>"zoals hij is"</b> en "zoals beschikbaar", zonder garanties van welke aard dan ook, voor zover toegestaan door de wet. We garanderen niet dat hij nauwkeurig, ononderbroken of foutloos zal zijn.'
  h10_liability: 'Aansprakelijkheid'
  liability_body: 'Voor zover toegestaan door het Nederlandse recht is BikeCoders niet aansprakelijk voor indirecte of gevolgschade die voortvloeit uit jouw gebruik van de Commons. Niets in deze voorwaarden beperkt aansprakelijkheid die wettelijk niet kan worden beperkt.'
  h11_suspension: 'Opschorting & beëindiging'
  suspension_pre: 'Je kunt je account op elk moment sluiten in je'
  suspension_link: 'instellingen'
  suspension_post: '. We kunnen de toegang opschorten of beëindigen als deze voorwaarden worden geschonden of om de Commons of haar gebruikers te beschermen.'
  suspension_p2: 'Voordat je gaat, kun je op dezelfde pagina <b>alles wat we over je bewaren downloaden</b> als één ZIP-bestand. Het sluiten van je account verwijdert je persoonsgegevens. Twee dingen blijven, en geen van beide noemt je daarna: de bijdragen die je aan de open kaart gaf, en de vastlegging dat je een fotolicentie hebt verleend, die we bewaren als bewijs dat de licentie bestaat. Foto''s die waren goedgekeurd blijven in de Commons onder CC BY-SA 4.0, en je kiest bij je vertrek of ze je naam behouden of anoniem worden.'
  h12_moderation: 'Hoe moderatie werkt'
  mod_intro: 'De Commons bestaat uit wat renners toevoegen, dus een deel moet worden gecontroleerd. Hier staat wat we weghalen, wie beslist, wat je te horen krijgt en wat je ertegen kunt doen.'
  mod_standard_h: 'Wat wordt weggehaald'
  mod_std1: '<b>Alles wat onrechtmatig is.</b> Ook inhoud die de rechten van iemand anders schendt.'
  mod_std2: '<b>Persoonsgegevens over anderen.</b> De Commons brengt plekken in kaart, geen mensen. Een herkenbare persoon op een foto, een naam, een kenteken, een huis dat als iemands woning wordt aangewezen.'
  mod_std3: '<b>Dingen die simpelweg niet kloppen.</b> Een waterpunt dat er nooit was, een wegdek dat niet overeenkomt met de werkelijkheid, een klim verzonnen om een ranglijst te bespelen.'
  mod_std4: '<b>Misbruik.</b> Intimidatie, bedreigingen, of inhoud die op een persoon is gericht in plaats van op een plek.'
  mod_std5: '<b>Reclame.</b> De Commons is geen advertentiesite, en een plek staat er niet op omdat iemand betaalde of erom vroeg.'
  mod_std6: '<b>Foto''s die geen foto''s zijn.</b> Een beeld dat door AI is gemaakt of wezenlijk is aangepast, hoe goed het er ook uitziet. De Commons is een kaart van de echte wereld, en een plaatje van een plek die er nooit zo uitgezien heeft is slechter dan helemaal geen plaatje.'
  h13_ai: 'Waar machines aan te pas komen'
  ai_intro: 'Korte lijst, en we vertellen hem liever dan dat je moet gokken:'
  ai_translation: '<b>Machinevertaling.</b> Sommige plaatsbeschrijvingen komen uit Wikipedia in de plaatselijke taal en worden automatisch naar het Engels vertaald. Elk daarvan is ter plekke gelabeld als <b>auto-translated</b>, want een machinevertaling van een bergpas kan fout zijn op een manier die prima leest.'
  ai_checks: '<b>Automatische controles.</b> Software scant de catalogus op dingen die verkeerd lijken, twee kranen op een meter van elkaar, een link die niet meer werkt, en legt ze voor aan een curator. Ze signaleert; ze beslist nooit.'
  ai_none: '<b>Verder niets.</b> Geen chatbot, geen gegenereerde tekst die we als de onze presenteren, geen geautomatiseerd besluit over jou of je account, en geen profilering. Verandert dat ooit, dan verandert deze paragraaf als eerste.'
  ai_uploads: '<b>Wat je niet mag uploaden.</b> Geen door AI gemaakte of door AI aangepaste beelden. Gewoon bewerken mag: bijsnijden, rechtzetten, schaduwen ophalen. Iets verzinnen of weghalen dat er stond mag niet, en een plaatje dat een model maakte ook niet. De toestemming die je vóór het uploaden aanvinkt zegt dit, en het is een grond voor verwijdering.'
  ai_stance: 'We claimen hiermee geen naleving van wat dan ook. De transparantieregels van de Europese AI-verordening gaan op <b>2 augustus 2026</b> gelden, en het valt te betwisten hoe ver ze reiken tot een beschrijving van een drinkwaterkraan. We zouden het je hoe dan ook vertellen, want een kaart is alleen wat waard als je kunt zien wat een mens erop gezet heeft.'
  mod_who_h: 'Wie beslist'
  mod_who: 'Een <b>curator</b> beslist, en een curator is een mens. Curatoren zijn renners die zich hebben aangemeld en zijn aangenomen, ze werken volgens een geschreven reglement, en elke beslissing wordt vastgelegd met hun naam erbij.'
  mod_automated: '<b>Niets wordt door software alleen verwijderd.</b> Er draaien wel geautomatiseerde controles, en die markeren dingen zodat een curator ernaar kijkt, maar ze beslissen nooit. De ene uitzondering werkt andersom en is er om mensen te beschermen, niet om ze te beoordelen: een melding over intiem beeldmateriaal of over een kind verbergt de foto direct, voordat een mens de melding heeft gezien, en daarna beoordeelt een curator hem.'
  mod_told_h: 'Wat je te horen krijgt'
  mod_told_pre: 'Als iets dat je hebt toegevoegd wordt weggehaald of gewijzigd, laten we het je weten, met de reden erbij. Het bericht noemt waar het over ging en op welke grond is beslist. Je vindt het in je'
  mod_told_link: 'berichten'
  mod_told_post: '.'
  mod_appeal_h: 'Als je het er niet mee eens bent'
  mod_appeal_pre: 'Reageer op dat bericht en een curator leest het. Wil je het liever buiten je account om doen, of heb je er geen meer, schrijf ons dan via de'
  mod_appeal_link: 'contactpagina'
  mod_appeal_post: '. Een beslissing is niet definitief omdat hij één keer is genomen; een curator die zich vergiste kan het terugzetten.'
  mod_report_h: 'Iets melden'
  mod_report_pre: 'Iedereen kan inhoud melden, met of zonder account. Gebruik de'
  mod_report_link: 'het contactformulier'
  mod_report_post: ', of de meldlink op de foto zelf. We bevestigen elke melding en we laten weten wat we besloten. Foto''s hebben hun eigen meldlink op elke fotopagina.'
  h12_governing: 'Toepasselijk recht'
  governing_body: 'Deze voorwaarden worden beheerst door het recht van <b>Nederland</b>. Geschillen vallen onder de bevoegde Nederlandse rechters, tenzij dwingend consumentenrecht je andere rechten geeft.'
  h13_changes: 'Wijzigingen'
  changes_body: 'We kunnen deze voorwaarden bijwerken; we plaatsen wijzigingen hier met een nieuwe datum. Door de Commons na een wijziging te blijven gebruiken, aanvaard je de bijgewerkte voorwaarden.'
  h14_contact: 'Contact'
  contact_pre: 'Vragen over deze voorwaarden:'
  contact_post: '.'
  footer_disc_pre: 'Zie ook onze'
  footer_disc_privacy: 'Privacyverklaring'
  footer_disc_mid: 'en de data-, media-, UI-vertalingen- en code-'
  footer_disc_licences: 'licenties'
  footer_disc_post: '.'
licenses:
  kicker: 'Licenties'
  title: 'De korte versie.'
  lead: 'Gewone taal, zodat je weet wat je kunt doen. Vier licenties — één voor de <b>data</b>, één voor de <b>media</b>, één voor de <b>UI-vertalingen</b> en één voor de <b>code</b>: de data, media en UI-vertalingen zijn open, de code is source-available.'
  can_h: 'Je mag'
  must_h: 'Je moet'
  data_h: 'De data'
  data_sub: 'Open Database License 1.0 (ODbL) · inhoud DbCL 1.0'
  data_tldr: 'Gebruik de data voor alles — ook commerciële producten — zolang je bronvermelding geeft, eventuele verbeterde databases onder dezelfde licentie deelt, en ze open houdt. Dezelfde afspraak als OpenStreetMap.'
  data_can1: 'Gebruik, kopieer en deel het — gratis'
  data_can2: 'Pas het aan en bouw er producten op'
  data_can3: 'Gebruik het commercieel'
  data_must1_b: 'Naamsvermelding'
  data_must1_body: '— vermeld Cycling Commons en de bron waar de data vandaan komt: OpenStreetMap, en de andere open datasets die we importeren, elk <a href="%url%">met zijn licentie vermeld</a>.'
  data_must2_b: 'Gelijk delen'
  data_must2_body: '— publiceer een aangepaste database onder ODbL'
  data_must3_b: 'Houd het open'
  data_must3_body: '— geen DRM of afsluiting van de data'
  media_h: 'De media'
  media_sub: 'Creative Commons Naamsvermelding-GelijkDelen 4.0 (CC BY-SA 4.0)'
  media_tldr: 'Gebruik de foto''s en video voor alles — ook commercieel — als je de maker en de Commons vermeldt, en eventuele bewerkingen onder dezelfde licentie vrijgeeft.'
  media_can1: 'Gebruik, kopieer en deel het — gratis'
  media_can2: 'Bewerk, snij bij en remix het'
  media_can3: 'Gebruik het commercieel'
  media_must1_b: 'Naamsvermelding'
  media_must1_body: '— vermeld de maker en de Cycling Commons'
  media_must2_b: 'Gelijk delen'
  media_must2_body: '— geef bewerkingen vrij onder CC BY-SA 4.0'
  ui_h: 'De UI-vertalingen'
  ui_sub: 'Creative Commons Naamsvermelding-GelijkDelen 4.0 (CC BY-SA 4.0)'
  ui_tldr: 'Gebruik op de website ingediende UI-vertalingen voor alles — ook commercieel — als je de Commons vermeldt (en de vertaler wanneer die vermeld staat), en eventuele bewerkingen onder dezelfde licentie vrijgeeft. Dit zijn niet de door ontwikkelaars meegeleverde locale-bestanden in git.'
  ui_can1: 'Gebruik, kopieer en deel ze — gratis'
  ui_can2: 'Bewerk en remix ze'
  ui_can3: 'Gebruik ze commercieel'
  ui_must1_b: 'Naamsvermelding'
  ui_must1_body: '— vermeld de Cycling Commons, en de vertaler indien vermeld'
  ui_must2_b: 'Gelijk delen'
  ui_must2_body: '— geef bewerkingen vrij onder CC BY-SA 4.0'
