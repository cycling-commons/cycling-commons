developers:
  kicker: 'Bouw op de Commons'
  title: 'Open data. Een open API.<br>Voor iedereen om op te bouwen.'
  lead: 'Bevraag de Commons per gebied en type, of download de wekelijkse bulkexport en host die zelf. De data is open (ODbL), en dat maakt het een commons. Geen sleutel, geen account, geen kosten: een snelheidslimiet en fair use, meer niet.'
  status: 'In ontwerp — deze endpoints zijn het contract dat we bouwen. Bekijk de <a href="/developers/api">interactieve API-referentie</a> (Engels) of de <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">specificatie op GitHub</a>.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/search'
  ep1_desc: 'zoek dekking op <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'één item, met onze verrijking en herkomst <b>(gepland)</b>'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'regiopolygoon en dekkingscijfers <b>(gepland)</b>'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'de best-of van een regio <b>(gepland)</b>'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'routedetail en GPX-download <b>(gepland)</b>'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'vectortegels en TileJSON, voor je eigen MapLibre-stijl <b>(gepland)</b>'
  ep7_path: '/v1/contributions'
  ep7_desc: 'bijdragen <b>(gepland)</b>, komt in dezelfde beoordelingsrij als bijdragen in de app'
  ex_kicker: 'Voorbeeldverzoek'
  resp_kicker: 'Antwoord'
  ex_hydrate: 'Antwoorden zijn standaard alleen-referentie: onze toegevoegde velden plus de <code>osm_ref</code> om bij OSM te hydrateren. <code>?hydrate=osm</code> voegt onze gecachte OSM-subset alvast samen.'
  attr_kicker: 'Verplichte naamsvermelding'
  rules_kicker: 'De regels'
  rules_body: '<b>Fair use.</b> Lezen staat open voor iedereen, zonder sleutel en zonder account, binnen een snelheidslimiet per adres waar een gewone app ver onder blijft. Voor bulk of offline gebruik: download de <b>wekelijkse bulkexport</b> en host die zelf, in plaats van de live API te belasten; het scrapen van de dienst is niet toegestaan. Licenties: data <b>ODbL 1.0</b>, media <b>CC BY-SA 4.0</b>. Vermeld de bron, deel onder dezelfde voorwaarden, houd het open. Commercieel gebruik mag. Zie de samenvatting in gewone taal:'
  ep_export_desc: 'de hele dataset als GeoJSON, elke week opnieuw gebouwd:'
  export_link: 'bulkexport'
  ep_export_pending: 'Bulkexport: de hele dataset als GeoJSON, elke week opnieuw gebouwd. De eerste export komt eraan.'
data_export:
  # The bulk export's page (docs/specs/api-strategy.md section 3.1).
  meta_title: 'Bulkexport van Cycling Commons'
  meta_description: 'Download de hele open dataset van Cycling Commons als GeoJSON, elke week opnieuw gebouwd, onder de Open Database License.'
  kicker: 'Bouw op de Commons'
  title: 'De bulkexport'
  lead: 'De hele open dataset in twee bestanden: elke plek en elke route op de kaart, als GeoJSON, elke week opnieuw gebouwd. Download hem één keer en host hem zelf, in plaats van de site of de API af te struinen.'
  latest_kicker: 'Nieuwste momentopname'
  empty: 'Er is nog geen momentopname gepubliceerd. De eerste verschijnt hier na de eerste wekelijkse bouw.'
  built: 'Gebouwd op %when%.'
  file_places: '%n% plekken'
  file_routes: '%n% routes'
  manifest_desc: 'wat de momentopname bevat: bouwtijd, licentie en naamsvermelding per bron, aantallen, groottes en sha256-controlesommen'
  latest_links: 'Voor scripts een link die altijd naar de nieuwste momentopname leidt:'
  holds_kicker: 'Wat erin zit'
  holds_body: 'Elke plek en route die de kaart toont, met de velden die de API ze geeft: naam, typeletter, positie of lijn, niveau, betrouwbaarheid en het bewijs erachter, regio, land, en de OpenStreetMap-verwijzing als die er is. Elk record noemt zijn <b>bron</b>, zodat je de naamsvermelding kunt geven die de licentie vraagt.'
  source_counts: '%places% plekken, %routes% routes'
  leaves_kicker: 'Wat eruit blijft'
  leaves_body: 'Niets over mensen: geen accounts, namen, e-mailadressen, notities of moderatiegegevens. Niets wat een curator niet op de kaart heeft toegelaten: geen bijdragen die wachten, afgewezen zijn of in de prullenbak liggen, en geen wijziging die nog op beoordeling wacht. Geen foto''s. En geen record waarvan de licentie van de bron delen onder de ODbL niet toestaat; die worden hier geteld.'
  left_out_unknown: 'Bron zonder bekende licentie'
  attr_kicker: 'Verplichte naamsvermelding'
  licence_body: 'De database valt onder de <b>Open Database License 1.0</b>, de inhoud onder de <b>Database Contents License 1.0</b>. Gebruik hem waarvoor je wilt, ook commercieel: vermeld de bron zoals aangegeven, deel een database die je ervan afleidt onder dezelfde licentie, en houd hem open. Bronnen die een eigen vermelding vragen staan hierboven en in het manifest. Zie de samenvatting in gewone taal:'
  cadence_kicker: 'Hoe vaak'
  cadence_body: 'Elke week wordt een nieuwe momentopname gebouwd. De nieuwste %keep% blijven beschikbaar, oudere worden verwijderd. Een momentopname verandert na publicatie nooit meer, dus een controlesom die je bewaarde blijft geldig. Voor data die verser is dan een week: gebruik de API.'
  format_body: 'Elk bestand is een met gzip gecomprimeerde GeoJSON-<code>FeatureCollection</code> in WGS84 (EPSG:4326), één feature per regel, met <code>licence</code> en <code>attribution</code> bovenaan. Coördinaten hebben zes decimalen.'
