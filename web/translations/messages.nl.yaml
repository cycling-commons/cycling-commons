developers:
  kicker: 'Bouw op de Commons'
  title: 'Open data. Een open API. Voor iedereen om op te bouwen.'
  lead: 'Bevraag de Commons per gebied en type, koppel onze vectortegels aan je eigen kaartstijl, of host zelf de gratis periodieke bulkexport. De data is open (ODbL) — dat is wat het een commons maakt. Toegang is selfservice: een gratis sleutel, een gratis tier, en betaalde quota alleen voor intensief, altijd-vers gebruik.'
