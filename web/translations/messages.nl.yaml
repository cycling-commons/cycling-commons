developers:
  kicker: 'Bouw op de Commons'
  title: 'Open data. Een open API.<br>Voor iedereen om op te bouwen.'
  lead: 'Bevraag de Commons per gebied en type, of host zelf vanaf de periodieke bulkexport. De data is open (ODbL), en dat maakt het een commons. Geen sleutel, geen account, geen kosten: een snelheidslimiet en fair use, meer niet.'
  status: 'In ontwerp — deze endpoints zijn het contract dat we bouwen. Bekijk de <a href="/developers/api">interactieve API-referentie</a> (Engels) of de <a href="https://github.com/cycling-commons/cycling-commons/blob/main/docs/specs/public-api.md">specificatie op GitHub</a>.'
  ep_kicker: 'Endpoints'
  ep1_path: '/v1/search'
  ep1_desc: 'zoek dekking op <code>bbox</code>, <code>letter</code>, <code>tier</code>'
  ep2_path: '/v1/items/{id}'
  ep2_desc: 'één item, met onze verrijking en herkomst <b>(gepland)</b>'
  ep3_path: '/v1/regions/{id}'
  ep3_desc: 'regiopolygoon en dekkingscijfers <b>(gepland)</b>'
  ep4_path: '/v1/regions/{id}/best'
  ep4_desc: 'de best-of van een regio <b>(gepland)</b>'
  ep5_path: '/v1/routes/{id}.gpx'
  ep5_desc: 'routedetail en GPX-download <b>(gepland)</b>'
  ep6_path: 'coverage.pmtiles'
  ep6_desc: 'vectortegels en TileJSON, voor je eigen MapLibre-stijl <b>(gepland)</b>'
  ep7_path: '/v1/contributions'
  ep7_desc: 'bijdragen <b>(gepland)</b>, komt in dezelfde beoordelingsrij als bijdragen in de app'
  ex_kicker: 'Voorbeeldverzoek'
  resp_kicker: 'Antwoord'
  ex_hydrate: 'Antwoorden zijn standaard alleen-referentie: onze toegevoegde velden plus de <code>osm_ref</code> om bij OSM te hydrateren. <code>?hydrate=osm</code> voegt onze gecachte OSM-subset alvast samen.'
  attr_kicker: 'Verplichte naamsvermelding'
  rules_kicker: 'De regels'
  rules_body: '<b>Fair use.</b> Lezen staat open voor iedereen, zonder sleutel en zonder account, met <b>120 verzoeken per minuut</b> per adres. Dat is een schuivend venster: een piek leent van de volgende minuut in plaats van je buiten te sluiten. Voor bulk of offline gebruik: neem de <b>periodieke export</b> en host die zelf, in plaats van de live API te belasten; het scrapen van de dienst is niet toegestaan. Licenties: data <b>ODbL 1.0</b>, media <b>CC BY-SA 4.0</b>. Vermeld de bron, deel onder dezelfde voorwaarden, houd het open. Commercieel gebruik mag. Zie de samenvatting in gewone taal:'
