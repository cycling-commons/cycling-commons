# SPDX-License-Identifier: AGPL-3.0-only
# The privacy notice in French: the whole page in one file, outside the `messages`
# domain the in-site translation system reads (docs/specs/privacy-notice.md). This
# file's history is the record of every change to the page in French.
privacy:
  kicker: 'Confidentialité'
  title: 'Ce que nous collectons, et pourquoi.'
  lead: 'En langage clair. Le jeu de données Cycling Commons est non personnel : géodonnées ouvertes sur des lieux, jamais sur des personnes. Le <b>compte de plateforme</b> est une autre affaire : il contient des données personnelles (email, identifiants, journaux de session). Voici ce que nous conservons, pourquoi, et le contrôle que vous avez.'
  h_responsible: 'Qui est responsable'
  responsible_p1_pre: 'Le responsable du traitement est'
  responsible_p1_bikecoders: 'BikeCoders'
  responsible_p1_mid: ', basé aux Pays-Bas, qui gère Cycling Commons aujourd''hui. Comme indiqué dans notre page de'
  responsible_p1_governance: 'gouvernance'
  responsible_p1_post: ', le Commons s''est engagé à devenir une fondation néerlandaise indépendante ; le responsable du traitement changera en conséquence, et cette page sera mise à jour.'
  responsible_p2_pre: 'Questions sur vos données :'
  responsible_p2_mid: '. Vous avez également le droit de déposer une plainte auprès de l''autorité de contrôle néerlandaise, la'
  responsible_p2_ap: 'Autoriteit Persoonsgegevens'
  responsible_p2_post: '.'
  dpo_pre: 'Nous n''avons <b>pas désigné de délégué à la protection des données (DPD)</b>, et la loi ne nous y oblige pas : nous sommes une petite structure, nous ne surveillons personne à grande échelle, et les données sensibles ne font pas partie de notre activité (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_37">RGPD art. 37</a>). Les questions et demandes relatives à la protection des données vont à la même adresse que tout le reste,'
  dpo_post: '. Si cela change un jour et que nous en désignons un, cette page le nommera.'
  h_collect: 'Ce que nous collectons'
  collect_intro: 'Nous demandons le minimum nécessaire pour gérer une carte ouverte et transparente. Nous ne vous demandons jamais votre vrai nom.'
  h3_account: 'Quand vous créez un compte'
  collect_account_email: 'Votre <b>adresse email</b>, pour vous connecter, sécuriser le compte et envoyer des messages de service essentiels.'
  collect_account_password: 'Un <b>mot de passe</b>. Nous ne stockons jamais le mot de passe lui-même, seulement une forme brouillée qui ne permet pas de le retrouver. Quand vous vous connectez, nous brouillons ce que vous tapez de la même façon et comparons les deux.'
  collect_account_displayname: 'Un <b>nom d''affichage</b> de votre choix. Ce peut être un pseudonyme, et nous ne demandons jamais votre vrai nom. Votre profil est <b>désactivé par défaut</b> : tant qu''il l''est, vos contributions affichent votre <b>pseudonyme</b>, par exemple rider#k3x9q2mf, au lieu de votre nom d''affichage. Il est le même sur tout ce que vous ajoutez : on voit qu''une même personne en est l''auteur, mais pas qui vous êtes ; ensemble, ces contributions peuvent montrer à peu près où vous roulez. Activez votre profil et votre nom d''affichage, votre pays, le mois de votre inscription, les types de vélo et styles de pratique que vous avez choisis, le nombre de vos contributions et les itinéraires que vous avez proposés deviennent publics.'
  collect_account_2fa: 'Si vous activez l''<b>authentification à deux facteurs (2FA)</b>, nous stockons le secret TOTP <b>chiffré au repos</b>, et vos codes de secours uniquement sous forme de hachages.'
  collect_account_base: 'Une <b>localisation de base</b> facultative et un rayon de pratique, si vous en définissez une. Nous ne stockons pas le point que vous choisissez : nous stockons un point au hasard jusqu''à environ 2,5 km de celui-ci, de sorte que le point stocké n''indique guère plus que la commune. Nous gardons aussi le nom de lieu choisi avec lui, et les régions et pays que votre rayon atteint. Il sert uniquement à adapter ce que vous voyez vous-même : votre vue de la carte, et des choix par défaut comme la région sur laquelle s''ouvrent la page des meilleurs lieux et le vote. Il n''est jamais montré aux autres cyclistes et ne fait jamais partie du jeu de données Commons.'
  collect_account_timezone: 'Votre <b>fuseau horaire</b>, pour que les heures affichées soient les vôtres : celui que vous choisissez dans vos paramètres ou, s’il est sur automatique, le fuseau que signale votre navigateur (par exemple Europe/Amsterdam). C’est un nom de fuseau, pas une position.'
  collect_account_prefs: '<b>Vos réglages.</b> Votre langue, vos unités et votre format de date, le thème et le mode de la carte, les types de vélo et styles de pratique que vous choisissez, qui décident de ce que la carte vous montre d''abord, et les astuces que vous avez fermées. Nous gardons aussi la date à laquelle vous avez confirmé avoir 16 ans ou plus, et la date de votre dernière connexion, à partir de laquelle se compte la règle des 24 mois décrite sous <b>Combien de temps nous les conservons</b>.'
  h3_contribute: 'Quand vous contribuez'
  collect_contribute_items: '<b>Tout ce que vous écrivez dans le Commons.</b> Un lieu, une ascension, un itinéraire, une correction, un vote, une vérification sur place, une description de région, une traduction, un signalement, un message à un curateur : si vous l''avez tapé et envoyé, nous l''avons. Chacun est lié au compte qui l''a envoyé, pour qu''un curateur puisse vous répondre. Les messages aux curateurs et les signalements restent entre vous et les curateurs : ils n''apparaissent jamais sur la carte ni dans le jeu de données.'
  collect_contribute_media: 'Les <b>photos</b> que vous envoyez. Une photo peut contenir des données cachées (EXIF), comme le lieu de la prise de vue : nous les retirons et ré-encodons le fichier, ce que nous publions n''en porte donc rien. Nous y réinscrivons ensuite une seule chose : une mention indiquant que l''image est sous licence CC BY-SA 4.0, et un lien vers sa page sur Cycling Commons. <b>Votre nom n''est jamais écrit dans le fichier.</b> Ce lien permet à quelqu''un qui réutilise la photo de trouver qui créditer, et cette page ne vous nomme que tant que votre profil est public.'
  collect_contribute_traffic: '<b>Les résumés du trafic</b>, seulement si vous en envoyez un depuis la revue de sortie de Scout avec un radar arrière. Pour chaque tronçon parcouru, un résumé contient : le tronçon et votre sens de circulation, la distance et le temps passé dessus, le nombre de voitures qui vous ont dépassé et leur vitesse, votre propre vitesse moyenne, le moment de la journée (nuit, pointe du matin, journée, pointe du soir ou soirée), un groupe d''au moins quatre dates du même type au lieu de la date, le trimestre, et s''il s''agissait d''un jour ouvré ou d''un week-end. Sur une piste cyclable, il contient le nombre de voitures que le radar a vues à proximité au lieu des voitures qui vous dépassent. Chaque ligne porte aussi des valeurs de contrôle tirées de la sortie, pour qu''une même sortie ne soit jamais comptée deux fois. Votre fichier de sortie ne quitte jamais votre appareil, et un résumé ne contient aucune trace GPS ; les routes parcourues, avec le moment de la journée, oui. Rien de ce qui se trouve à moins de 500 mètres du départ ou de l''arrivée d''une sortie n''est jamais envoyé dans un résumé. Pour rattacher la sortie aux routes, votre navigateur charge depuis notre serveur les données cartographiques de la zone, comme la carte le fait pour toute zone que vous regardez. Rien de ce que nous stockons ne vous nomme ni ne vous code. Chaque ligne attend, chiffrée, que sa route ait assez de sorties sur plusieurs jours, puis rejoint des totaux simples par route : une sortie arrive donc dans les totaux par morceaux, mêlée à d''autres. Les curateurs ne voient que calme, modéré ou chargé par route. Les résultats ne vont qu''aux curateurs, et jamais avec votre nom. Depuis la même revue de sortie, vous pouvez aussi envoyer les <b>étiquettes</b> posées pendant la sortie. Une étiquette envoie son emplacement sur la carte, que vous pouvez d''abord déplacer, le nom et les détails que vous lui donnez, les photos que vous ajoutez, et l''heure à laquelle vous l''avez posée, dont nous ne gardons que la date. Une étiquette pour un tronçon de route, comme son revêtement, envoie aussi la partie de votre sortie entre les deux extrémités que vous choisissez. Chaque étiquette devient une contribution ordinaire et passe par la même relecture que les autres. Les deux sont facultatifs : pour chaque sortie, vous choisissez ce que vous envoyez, et vous pouvez ne rien envoyer. Scout recevra d''autres fonctions ; si l''une change ce qui est envoyé, cette notice change d''abord.'
  collect_contribute_rode: '<b>Les marques « J''ai roulé ici ».</b> Quand vous indiquez avoir roulé un itinéraire, nous gardons cette marque avec le type de vélo choisi et la date. Sur l''itinéraire, seul le nombre de cyclistes qui l''ont marqué s''affiche.'
  collect_contribute_bugs: '<b>Signalements de bogue.</b> Quand vous signalez un bogue, nous gardons ce que vous avez écrit, les captures d''écran que vous ajoutez, l''adresse de la page où vous étiez, votre navigateur et sa version, la taille de votre fenêtre, et votre adresse électronique si vous voulez une réponse. Si vous êtes connecté, le signalement est lié à votre compte. Un curateur peut publier un bogue sur notre page des problèmes connus et comme ticket sur GitHub, avec un titre et un texte qu''il rédige lui-même ; votre adresse électronique, l''adresse de la page et vos captures d''écran n''y vont jamais.'
  collect_contribute_curator: '<b>Candidatures de curateur et demandes de pays.</b> Si vous proposez de devenir curateur, nous gardons le pays et la zone demandés, ce que vous écrivez sur vous, un lien si vous en ajoutez un, et votre nom d''utilisateur OpenStreetMap si vous le donnez. Notre serveur cherche ce nom sur OpenStreetMap pour voir s''il existe et combien de modifications il compte. Si vous nous demandez d''ouvrir un pays, nous gardons le pays, la région que vous nommez, si vous y seriez curateur, et votre note.'
  collect_contribute_profile: 'Les détails de profil facultatifs que vous choisissez, comme votre pays, vos types de vélo et vos styles de pratique. Ils n''apparaissent sur votre profil public que tant qu''il est activé. Les profils sont'
  collect_contribute_profile_link: 'optionnels'
  collect_contribute_profile_post: ' et désactivés par défaut.'
  h3_auto: 'Automatiquement, quand vous utilisez le site'
  collect_auto_technical: '<b>Données techniques</b> : adresse IP, type de navigateur et horodatages dans nos journaux serveur, conservés pour exploiter et sécuriser le service.'
  collect_auto_ratelimit: '<b>Compteurs d''utilisation et adresses codées.</b> Pour qu''un seul visiteur ne puisse pas épuiser un outil pour tout le monde, ni inonder un formulaire, nous comptons les requêtes. Connecté, nous comptons sur votre compte. Sans compte, la plupart des compteurs, comme celui de la vérification de parcours, comptent sur un code tiré de votre adresse IP, qui ne permet pas de retrouver l''adresse. Quelques-uns comptent sur l''adresse elle-même : le formulaire de signalement, l''API publique, les données de couverture de la carte, les téléchargements de l''export en masse, et la vérification qui protège certains formulaires. Le même genre de code est conservé avec un signalement de contenu, un signalement de bogue ou un message de contact que vous envoyez, pour que nous puissions repérer un afflux. Ce code reste une donnée personnelle, donc tout ce qui figure sur cette page s''y applique.'
  collect_auto_errors: '<b>Rapports d''erreur.</b> Quand quelque chose casse sur notre serveur, il écrit un rapport d''erreur : ce qui n''a pas marché, l''adresse de la page et le moment. Il ne contient jamais votre adresse IP, votre nom, votre adresse e-mail ni ce que vous avez tapé dans un formulaire. Les rapports restent sur nos propres machines chez Hetzner, avec tout ce que nous faisons tourner (voir <b>Les entreprises qui traitent des données pour nous</b>).'
  banner_bold: 'Pas de suivi de parcours.'
  banner_body: 'Le Commons est une carte de lieux, pas de personnes. Nous ne suivons <b>pas</b> vos sorties et ne voyons jamais votre position en direct. Nous ne détenons une ligne que vous avez parcourue que si vous l''envoyez exprès : un itinéraire que vous proposez, ou le tronçon d''une sortie couvert par une étiquette Scout. Un résumé du trafic envoyé depuis la revue de sortie de Scout n''est pas une trace GPS, mais il indique quelles routes vous avez parcourues et à quel moment de la journée, et une marque « J''ai roulé ici » dit que vous avez roulé cet itinéraire (voir <b>Quand vous contribuez</b>). La vérification de parcours lit sur notre serveur un fichier de sortie que vous lui donnez, pour trouver des lieux le long du parcours, et n''en garde rien.'
  banner_locate: '<b>Afficher ma position</b> sur la carte lit votre position dans votre propre navigateur, seulement quand vous le touchez, et ne l''envoie nulle part : aucune requête vers nous ni vers quiconque ne la transporte. La carte charge ensuite les images de cette zone, comme chaque fois que vous déplacez la carte.'
  h_why: 'Pourquoi nous l''utilisons (bases légales)'
  why_contract: '<b>Pour fournir votre compte et le service</b>: exécution d''un contrat (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD Art. 6(1)(b)</a>).'
  why_consent: '<b>Afficher votre nom.</b> Un profil public, et être crédité nommément pour ce que vous avez contribué, repose sur votre consentement (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6(1)(a)</a>). Vous pouvez le retirer à tout moment dans vos'
  why_consent_link: 'paramètres'
  why_consent_post: ', et votre nom disparaît de ces pages. Chez nous, c''est immédiat. Une copie de page que quelqu''un a enregistrée nous échappe.'
  why_licence: '<b>Publier ce que vous contribuez.</b> Une photo ou une modification que vous donnez au Commons est publiée sous la licence que vous avez acceptée en l''envoyant, ce qui relève de notre accord avec vous (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6(1)(b)</a>). Cette licence est <b>irrévocable</b> selon ses propres termes : retirer votre consentement ôte votre nom de la page mais ne dépublie pas la contribution elle-même. Une exception compte : si une photo vous <b>représente</b>, ce sont vos données personnelles, et une licence de droit d''auteur ne signe pas l''abandon de vos droits en la matière. Chaque page photo porte un lien pour en demander le retrait. Une photo que vous n''aviez pas le droit de mettre sous licence n''a jamais été valablement sous licence : dites-le-nous par le même lien et elle est retirée aussi.'
  why_updates: '<b>Vous dire ce qui est nouveau.</b> Seulement si vous l''avez demandé : le réglage de votre compte est votre consentement (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD art. 6(1)(a)</a>), et le désactiver le retire. Dans vos réglages, vous choisissez la fréquence : <b>seulement les grandes nouveautés</b> ou <b>chaque mise à jour</b>. Chaque message porte aussi un lien de désinscription en un clic, sans connexion. Uniquement des nouvelles du Commons, jamais de publicité, et la liste n''est jamais partagée ni vendue.'
  why_legitimate: '<b>Sécurité, prévention des abus et analyses agrégées</b>: nos intérêts légitimes à maintenir le Commons fiable et fonctionnel (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD Art. 6(1)(f)</a>).'
  why_legal: '<b>Respect des obligations légales</b>: lorsque la loi l''exige (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD Art. 6(1)(c)</a>). Cela comprend l''exposé des motifs que nous vous devons quand nous restreignons quelque chose que vous avez ajouté ou votre compte (règlement sur les services numériques, art. 17), et l''information de la police ou d''une autorité judiciaire en cas de menace pour la vie ou la sécurité de quelqu''un (même règlement, art. 18).'
  h_cookies: 'Cookies & analyses'
  cookies_body: 'Nous faisons simple. Nous déposons <b>deux cookies</b>, tous deux strictement nécessaires et tous deux listés en entier ci-dessous. Pour les statistiques d''usage, nous hébergeons nous-mêmes nos <b>analyses</b> sur notre propre infrastructure : il reçoit l''URL de la page, le référent, la taille d''écran et le type de navigateur, et il reçoit votre <b>adresse IP</b>, qui est une donnée personnelle, mais ne la <b>conserve pas</b>. L''adresse sert uniquement à déterminer une localisation approximative (pays, région et ville) et à dériver un identifiant de session à sens unique, puis elle est supprimée. Aucun cookie de mesure n''est déposé, aucun visiteur ne reçoit d''identifiant persistant ni n''est rattaché à un compte, et il n''y a aucun suivi intersites ou multi-appareils. Les données d''analyse restent sur notre propre infrastructure et ne sont jamais partagées ni vendues à des tiers.'
  h3_cookie_table: 'Les cookies que nous déposons'
  ck_h_name: 'Nom'
  ck_h_purpose: 'À quoi il sert'
  ck_h_life: 'Combien de temps il dure'
  ck_session_purpose: 'Vous garde connecté, et porte le jeton qui protège les formulaires que vous utilisez une fois connecté contre la falsification de requête intersite (CSRF), une attaque dans laquelle un autre site fait envoyer à votre navigateur un formulaire ici en votre nom. Il est déposé quand vous vous connectez, ou quand vous utilisez un formulaire qui doit retenir quelque chose d''une page à l''autre, comme la réinitialisation de votre mot de passe. Lire la carte et le reste du site, page de contact comprise, ne dépose aucun cookie. Il contient un identifiant aléatoire et rien d''autre : ni nom, ni adresse e-mail, ni trace de ce que vous avez consulté.'
  ck_session_life: 'Jusqu''à la fermeture de votre navigateur'
  ck_remember_purpose: 'Vous reconnecte à votre prochaine visite sans redemander votre mot de passe. Déposé <b>uniquement</b> si vous cochez <b>Se souvenir de moi</b> à la connexion, et retiré à la déconnexion. Nous le déconseillons sur un ordinateur que d''autres personnes utilisent.'
  ck_remember_life: '7 jours'
  cookies_none_body: 'Voilà toute la liste. Nous ne déposons <b>aucun</b> cookie publicitaire, <b>aucun</b> cookie de mesure d''audience et <b>aucun</b> cookie de suivi intersites, sur aucune page. Les deux cookies ci-dessus sont strictement nécessaires à un service que vous avez demandé, la loi n''exige donc aucun consentement, et c''est pourquoi il n''y a pas de bandeau cookies ici. Si nous ajoutions un jour quelque chose qui en réclame un, nous vous le demanderions plutôt que de le supposer.'
  cookies_local_body: 'Votre navigateur garde aussi quelques éléments pour ce site sur votre propre appareil. Dans son <b>stockage local</b> : vos préférences d''affichage et de carte, comme le thème, la zone que vous avez regardée en dernier, vos filtres et la taille d''un panneau, et une zone de résidence si vous en définissez une sans compte. Un signalement de bogue pas encore envoyé est gardé comme brouillon, avec ses captures d''écran, dans la base de données du navigateur (IndexedDB). Pendant que vous modifiez quelque chose, un travail en cours se trouve dans le <b>stockage de session</b>, que le navigateur efface quand vous fermez l''onglet. Rien de tout cela n''est un cookie. Tout reste dans votre navigateur : nous ne le lisons jamais là, et un brouillon ne nous parvient que quand vous l''envoyez. Effacer les données de votre navigateur le supprime. Les autres sites ne peuvent pas le lire : un navigateur sépare le stockage de chaque site. Deux choses peuvent quand même le lire. Toute personne qui utilise le même navigateur sur le même ordinateur, et tout script qui tourne sur ce site, comme une extension de navigateur que vous avez installée. Une zone de résidence dit à peu près où vous habitez : sur un ordinateur partagé, vous préférerez peut-être ne pas en définir.'
  h_share: 'Avec qui nous les partageons'
  share_infra: '<b>Les services qui font tourner notre infrastructure, et les quelques-uns à qui nous demandons une vérification.</b> Hébergement, sauvegardes, courriels, les services cartographiques que votre navigateur va chercher directement, et les vérifications que fait notre serveur. Chacun est nommé ci-dessous, avec ce qu''il fait et ce qu''il peut voir.'
  share_osm_pre: 'OpenStreetMap : les contributions que vous choisissez de reverser font partie de la carte ouverte sous la licence'
  share_osm_link: 'ODbL'
  share_osm_post: '. Il s''agit de données publiques et ouvertes, pas de données personnelles vous concernant.'
  share_authorities: '<b>La police ou une autorité judiciaire, quand la loi l''exige.</b> Si un contenu publié sur le Commons laisse soupçonner une infraction qui menace la vie ou la sécurité de quelqu''un, nous devons en informer l''autorité répressive ou judiciaire compétente du pays concerné, ou des Pays-Bas quand ce n''est pas clair (règlement sur les services numériques, art. 18). Nous lui donnons ce dont elle a besoin pour agir : ce que le curateur a vu, la référence, les dates, l''endroit où le contenu est apparu, et les données que nous détenons sur le compte de son auteur (numéro de compte, nom affiché, adresse e-mail et date d''inscription). Le contenu lui-même ne lui est transmis que si elle le demande. La base juridique est notre obligation légale (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_6">RGPD Art. 6(1)(c)</a>).'
  share_noone: '<b>Personne d''autre.</b> Nous ne vendons pas de données personnelles et ne faisons pas de suivi publicitaire tiers.'
  share_selfhosted: 'D''abord, ce qui ne figure <b>pas</b> dans ces listes. Nous hébergeons nous-mêmes tout ce que nous pouvons : les données cartographiques, le calcul d''itinéraire, le modèle d''élévation derrière les pourcentages, le stockage des photos, les statistiques d''usage et jusqu''aux rapports d''erreur tournent sur nos propres machines. Deux services que nous appelions à l''extérieur, pour les itinéraires et pour l''altitude, sont rentrés chez nous précisément pour cela. Construire ainsi prend plus de temps et coûte plus cher. C''est aussi pourquoi votre navigateur parle à une poignée de services extérieurs, chacun cité ci-dessous, et non à vingt, et pourquoi les tableaux ci-dessous sont aussi courts : chaque nom qui s''y trouve est un service que nous ne pouvions raisonnablement pas faire tourner nous-mêmes.'
  h3_processors: 'Les entreprises qui traitent des données pour nous'
  processors_intro: 'Les entreprises ci-dessous détiennent ou manipulent vos données sur nos instructions. Ce sont nos <b>sous-traitants</b> : elles ne peuvent faire que ce que nous leur demandons, dans le cadre d''un contrat écrit, et ne peuvent pas utiliser vos données pour leur propre compte.'
  pr_h_who: 'Qui'
  pr_h_where: 'Où'
  pr_h_what: 'Ce qu''elles font pour nous'
  pr_h_sees: 'Ce qu''elles peuvent voir'
  pr_hetzner_where: 'Espace économique européen'
  pr_hetzner_what: 'Fait tourner les machines : le site, la base de données, le stockage des photos envoyées, et les rapports d''erreur.'
  pr_hetzner_sees: 'En principe tout ce que nous stockons, puisque cela repose sur leur matériel : votre adresse électronique, vos contributions, vos photos, les journaux serveur et les rapports d''erreur. Les mots de passe et les secrets à deux facteurs y restent illisibles (voir <b>Comment nous les protégeons</b>).'
  pr_scaleway_where: 'Espace économique européen'
  pr_scaleway_what: 'Achemine les courriels que le site vous envoie, et conserve les sauvegardes nocturnes.'
  pr_scaleway_sees: 'Votre adresse électronique et le contenu des messages que le site vous envoie. Les sauvegardes sont chiffrées sur nos propres serveurs avant de partir : leur contenu est donc illisible à l''arrivée.'
  pr_proton_where: 'Suisse (couverte par une décision d''adéquation de l''UE)'
  pr_proton_what: 'Héberge la boîte aux lettres du projet, l''adresse imprimée sur cette page, et les réponses qu''une personne d''ici vous écrit.'
  pr_proton_sees: 'Votre adresse électronique et tout ce que vous avez choisi de nous écrire, tant que l''échange est conservé.'
  h3_browser_services: 'Services que votre navigateur contacte directement'
  browser_services_intro: 'La carte est assemblée dans votre navigateur, quelques morceaux viennent donc directement de ceux qui les publient plutôt que de passer par nous. Nous ne leur transmettons jamais votre compte, votre nom affiché ni votre adresse électronique. Ils voient en revanche l''adresse réseau d''où part votre requête, car toute requête sur internet en porte une. Rien dans cette liste ne se charge avant que vous n''ouvriez une page qui l''utilise.'
  bs_h_service: 'Service'
  bs_h_what: 'À quoi il sert'
  bs_h_sees: 'Ce qu''il reçoit'
  bs_sees_ip: 'Votre adresse IP, et les tuiles de carte que vous avez demandées.'
  bs_openfreemap_what: 'Le fond de carte : les routes, l''eau et les noms de lieux sous tout le reste.'
  bs_esri_what: 'La vue satellite, seulement une fois que vous y passez.'
  bs_esri_sees: 'Votre adresse IP, et les tuiles d''image que vous avez demandées. Esri est aux États-Unis.'
  bs_mapillary_what: 'Les photos au niveau de la rue, seulement une fois que vous ouvrez la vue de rue.'
  bs_mapillary_sees: 'Votre adresse IP, et les photos que vous avez ouvertes. Mapillary est exploité par Meta Platforms Ireland Limited, en Irlande, et les fichiers image eux-mêmes viennent du réseau de diffusion de Meta, qui est mondial.'
  bs_photon_what: 'La recherche de lieux : dans la recherche de la carte, dans la recherche de lieu du formulaire de contribution, et dans le champ de localisation de base de vos paramètres.'
  bs_photon_sees: 'Votre adresse IP, ce que vous tapez dans une recherche de lieu, et la langue de la page. Depuis la recherche de la carte, aussi la région ou le pays auquel la recherche est limitée. Photon est exploité par komoot, en Allemagne.'
  browser_services_post: 'Deux d''entre eux peuvent sortir de l''Espace économique européen (EEE) : <b>Esri</b> est aux États-Unis, et les fichiers image de Mapillary viennent du réseau mondial de Meta. Si vous n''ouvrez jamais la vue satellite ni la vue de rue, votre navigateur ne contacte ni l''un ni l''autre. Voir <b>Transferts internationaux</b> ci-dessous.'
  h3_server_services: 'Services que notre serveur interroge'
  server_services_body: 'Quelques vérifications partent de notre serveur : ces services voient l''adresse de notre serveur, jamais la vôtre. Quand quelqu''un ajoute un lien web à un lieu, notre serveur peut demander à <b>Google Safe Browsing</b>, aux États-Unis, si ce lien est connu comme dangereux, quand cette vérification est activée ; il n''envoie que le lien. Quand nous envoyons un bogue publié sur <b>GitHub</b>, aux États-Unis, notre serveur y ouvre un ticket avec le titre et le texte publics du bogue, qui ne nomment jamais personne. Aucun de ces deux services ne reçoit de données personnelles vous concernant. Quand vous proposez de devenir curateur, notre serveur cherche le nom d''utilisateur que vous avez donné sur <b>OpenStreetMap</b> ; ce nom y est déjà public.'
  h_transfers: 'Transferts internationaux'
  transfers_body: 'Votre compte, vos contributions, vos photos et nos sauvegardes restent dans l''Espace économique européen (EEE). Une poignée de services extérieurs peuvent voir quelque chose depuis l''extérieur de l''EEE, chacun cité plus haut. <b>Proton</b>, en Suisse, héberge notre boîte mail et voit donc les e-mails que vous nous écrivez. L''UE a décidé que le droit suisse protège les données personnelles aussi bien que le droit de l''UE (une décision d''adéquation), donc aucun contrat supplémentaire n''est nécessaire. <b>Esri</b>, aux États-Unis, fournit la vue satellite. Ce n''est que lorsque vous activez cette vue que votre navigateur demande les images à Esri, qui voit alors votre adresse IP et les images demandées. Nous n''envoyons rien à Esri nous-mêmes. Les photos au niveau de la rue de Mapillary passent par le réseau mondial de Meta, qui peut les servir depuis l''extérieur de l''EEE ; il voit la même chose qu''Esri, et seulement une fois que vous ouvrez la vue de rue. Depuis notre serveur, et jamais avec votre adresse IP : <b>Google Safe Browsing</b>, aux États-Unis, peut recevoir les liens web que les cyclistes ajoutent aux lieux, quand cette vérification est activée, et <b>GitHub</b>, aux États-Unis, reçoit les bogues qu''un curateur publie, tels que le curateur les a écrits.'
  h_retention: 'Combien de temps nous les conservons'
  retention_account: '<b>Données de compte.</b> Jusqu''à ce que vous supprimiez votre compte, et là elles disparaissent. La suppression est immédiate : vous la demandez, nous vous envoyons un code par courriel, vous confirmez, et à cet instant le compte quitte la base de données en service. L''adresse électronique, l''empreinte du mot de passe, le secret à deux facteurs et les codes de secours partent avec lui. Il n''y a pas de délai d''attente et rien n''est gardé au cas où vous changeriez d''avis. Nos sauvegardes nocturnes contiennent encore l''ancien enregistrement jusqu''à leur rotation, ce qui prend <b>90 jours au maximum</b> ; elles sont chiffrées et ne sont ouvertes que pour se relever d''un sinistre. Un compte auquel personne ne s''est connecté depuis <b>24 mois</b> est supprimé de la même façon. Nous vous écrivons d''abord, trois fois : après 12, 22 et 23 mois, chaque fois avec la date de fermeture. Une seule connexion suffit pour le garder. Après cette suppression aussi, nos sauvegardes conservent l''ancien enregistrement jusqu''à leur rotation, 90 jours au maximum. Si un administrateur supprime votre compte pour un manquement à nos conditions, nous lisons votre adresse électronique juste avant la suppression et l''utilisons une seule fois, juste après, pour vous envoyer l''exposé des motifs. Elle disparaît ensuite, comme pour toute suppression. Si cet e-mail ne part pas, nous gardons l''adresse avec l''exposé des motifs jusqu''à ce que nous le renvoyions ou décidions de ne pas le faire, puis nous supprimons les deux.'
  retention_unconfirmed: '<b>Comptes non confirmés.</b> Un compte dont l''adresse email n''est pas confirmée sous <b>7 jours</b> est supprimé, sans email d''avertissement. L''adresse peut appartenir à quelqu''un qui ne s''est jamais inscrit, et le seul email que nous pourrions envoyer lui parviendrait.'
  retention_logs: '<b>Journaux serveur.</b> Conservés <b>90 jours</b> au maximum, puis supprimés automatiquement. Certaines entrées contiennent une adresse IP complète, pour la sécurité et le traitement des abus. Elles sont supprimées dans les mêmes 90 jours.'
  retention_ratelimit: '<b>Compteurs d''utilisation et adresses codées.</b> Un compteur expire de lui-même, au plus tard deux jours après votre dernière utilisation. Le compteur des téléchargements de l''export en masse fait exception : il n''existe que dans la mémoire de notre serveur web, n''est jamais écrit nulle part, et s''efface quand un téléchargement ultérieur a besoin de sa place ou quand le serveur redémarre. Une adresse codée conservée avec un signalement de contenu ou de bogue reste aussi longtemps que le signalement. Celle conservée avec un message de contact est supprimée avec le message, dans les 24 mois qui suivent la fin de l''échange.'
  retention_contributions: '<b>Contributions.</b> Les faits que vous reversez à la carte ouverte persistent dans le Commons (avec provenance), même après votre départ ; ils ne constituent pas des données personnelles vous concernant. Vos confirmations, vos marques « J''ai roulé ici » (sauf sur un itinéraire que vous avez proposé vous-même, où elles n''ont jamais compté et sont supprimées) et l''historique de vos modifications restent aussi quand vous partez, sans aucun lien avec votre compte.'
  retention_traffic: '<b>Résumés du trafic.</b> Une ligne attend, chiffrée, que sa route ait assez de sorties, puis rejoint les totaux par route et est supprimée. Les totaux restent dans le Commons. Ils ne contiennent aucun cycliste ; rien n''y est donc supprimé avec votre compte.'
  retention_messages: '<b>Messages sur vos contributions.</b> Les messages échangés entre vous et les curateurs à propos de vos contributions sont conservés tant que votre compte existe, et supprimés avec lui. Il en va de même pour les exposés des motifs que nous vous envoyons quand une décision restreint quelque chose que vous avez ajouté, vos contributions refusées ou que vous avez retirées avant qu''un curateur ne se prononce, et vos candidatures de curateur. Une demande d''ouverture d''un pays ne reste que comme un décompte anonyme, sans votre note ni votre proposition d''en être curateur. Ce qu''un curateur a approuvé reste sur la carte, sans votre nom. Une contribution retenue pour une affaire juridique est conservée, avec ses messages, tant que dure cette retenue. Chaque exposé des motifs vous est aussi envoyé par e-mail ; celui qui concerne votre compte part uniquement par e-mail.'
  retention_suspension: '<b>Suspensions.</b> Si un administrateur suspend votre compte, nous conservons sur celui-ci la date de début et de fin de la suspension, le motif, les faits tels que nous vous les avons envoyés, et l''administrateur qui a décidé. Cela reste jusqu''à ce qu''une suspension ultérieure le remplace ou que le compte soit supprimé. Si le compte de cet administrateur est supprimé, le lien vers lui est effacé. Votre export de données contient tout cela, sauf qui a décidé. Notre journal d''administration enregistre le compte, le motif et la date de fin, jamais les faits ni votre adresse.'
  retention_consent: '<b>Consentements de licence.</b> Lorsque vous placez une photo ou une traduction sous licence pour le Commons, nous enregistrons votre accord, le texte exact auquel vous avez consenti et la date. Nous conservons cet enregistrement indéfiniment, et il survit à la fermeture de votre compte : c''est notre preuve que la licence a bien été accordée, dont nous pourrions avoir besoin pour constater ou défendre un droit en justice (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_17">RGPD Art. 17(3)(e)</a>). Il contient une référence à votre compte et rien d''autre à votre sujet. Quand vous supprimez votre compte, nous retirons cette référence, et le registre reste lié uniquement à la photo ou à la traduction.'
  retention_mail: '<b>Les courriels et les messages du formulaire de contact que vous nous envoyez.</b> Nous conservons un échange tant que l''affaire est ouverte, et le supprimons dans les <b>24 mois</b> qui suivent sa clôture. Cela vous couvre si vous y revenez un an plus tard, et cela nous couvre si une plainte sur notre façon de l''avoir traitée arrive tardivement. Les échanges qui relèvent d''une affaire juridique, comme une revendication de droits ou une demande de retrait, sont conservés jusqu''à la fin de cette affaire.'
  retention_bugs: '<b>Signalements de bogue.</b> Un signalement de bogue est conservé, comme trace de ce qui ne fonctionnait pas et de la façon dont cela a été corrigé. Si vous étiez connecté, il est lié à votre compte jusqu''à ce que vous supprimiez le compte ; il reste ensuite sans ce lien. L''adresse électronique que vous avez donnée pour notre réponse est conservée tant que le bogue est ouvert, puis supprimée <b>24 mois</b> après que nous vous avons communiqué le résultat, le même délai que pour les courriels que vous nous envoyez.'
  retention_reports: '<b>Signalements de contenu.</b> Lorsque vous signalez quelque chose sur le site, y compris une photo sur laquelle vous apparaissez, nous gardons l''adresse que vous laissez pour notre réponse jusqu''à ce que nous ayons décidé de votre signalement : nous avons agi, nous n''avons rien trouvé d''anormal, ou nous l''avons clos parce qu''il ne s''applique plus. Nous supprimons l''adresse <b>90 jours</b> après cette décision. Le signalement lui-même est conservé, comme trace de ce qui nous a été signalé et de ce que nous en avons fait. Si la photo signalée est retenue pour une affaire juridique, nous gardons l''adresse jusqu''à la levée de cette retenue.'
  retention_authorities: '<b>Signalements aux autorités.</b> Quand nous informons une autorité au sujet d''un contenu publié ici, nous enregistrons quand, quelle autorité, sa référence, et quel administrateur l''a enregistré. Cet enregistrement reste avec la photo ou la soumission tant qu''elle existe, et le contenu est conservé jusqu''à ce que l''autorité dise qu''il peut disparaître. Une ligne dans notre journal d''administration, avec la référence et l''autorité mais rien du contenu, est conservée sans date de fin. Si le compte de l''administrateur est supprimé, le lien vers lui est effacé et l''enregistrement reste.'
  retention_updates: '<b>La liste des versions.</b> Votre adresse y reste jusqu''à ce que vous l''en retiriez, depuis vos réglages ou depuis le lien de n''importe quel message. Nous gardons la trace de votre accord, et du texte accepté, comme pour un consentement de licence photo : c''est la preuve que nous avions le droit de vous écrire.'
  h_security: 'Comment nous les protégeons'
  security_intro: 'La loi nous demande des mesures adaptées au risque (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_32">RGPD art. 32</a>). En clair :'
  security_passwords: '<b>Votre mot de passe n''est jamais stocké.</b> Nous n''en gardons qu''une empreinte irréversible : personne ici ne peut lire votre mot de passe, et une base de données volée ne le livre pas davantage.'
  security_secrets: '<b>Les secrets à deux facteurs et les codes de secours sont chiffrés là où ils reposent</b>, la clé étant conservée hors de la base de données. Voler la seule base de données ne permet toujours pas de produire un code valable.'
  security_transport: '<b>Tout circule chiffré</b>, entre vous et nous, puis de nouveau quand une sauvegarde quitte nos serveurs. Les navigateurs reçoivent l''instruction de refuser purement et simplement une connexion non chiffrée vers nous.'
  security_access: '<b>Seules les personnes qui en ont besoin accèdent à vos données</b>, et toute modération ou administration exige une connexion à deux facteurs. Les échecs de connexion répétés sont ralentis puis bloqués.'
  security_source_pre: 'Voilà la version courte. Les mesures exactes, et le raisonnement derrière chacune, se trouvent dans notre'
  security_source_link: 'code source public'
  security_source_post: '. C''est bien pour cela que nous construisons à ciel ouvert : vous n''avez pas à croire un paragraphe de sécurité sur parole.'
  security_honest: 'Aucun système n''est parfait et nous ne prétendrons pas que le nôtre l''est. Il n''y a derrière ce paragraphe ni certification ni test d''intrusion : ce qu''il y a, c''est un petit système qui garde le moins possible, et du code que chacun peut vérifier.'
  h_breach: 'Si des données fuitent un jour'
  breach_pre: 'Si des données personnelles sont perdues, exposées, ou atteintes par quelqu''un qui ne devrait pas y accéder, et que cela risque de porter atteinte aux droits des personnes, nous le signalons à l''autorité de contrôle néerlandaise, la'
  breach_ap: 'Autoriteit Persoonsgegevens'
  breach_post: ' <b>dans les 72 heures</b> suivant le moment où nous l''apprenons (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_33">RGPD art. 33</a>). Si le risque vous concernant est élevé, nous vous contactons aussi directement et sans délai (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_34">RGPD art. 34</a>), en langage clair : ce qui s''est passé, lesquelles de vos données étaient concernées, ce que nous avons fait, et ce que vous devriez faire. Nous tenons un registre interne de chaque violation, y compris celles que nous ne sommes pas tenus de signaler, pour que la tendance reste visible même quand aucun cas pris isolément n''est à notifier.'
  h_rights: 'Vos droits'
  rights_intro: 'En vertu du <a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679">RGPD</a>, vous disposez des droits suivants :'
  rights_access: '<b>Accès (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_15">RGPD Art. 15</a>)</b>: demander une copie des données personnelles que nous détenons sur vous.'
  rights_correct: '<b>Rectification (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_16">RGPD Art. 16</a>)</b>: corriger toute inexactitude ou compléter ce qui manque.'
  rights_erase: '<b>Effacement (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_17">RGPD art. 17</a>)</b> : supprimez votre compte à tout moment depuis les paramètres de votre compte. Vos données personnelles partent avec lui et ne reviennent pas : les données de votre compte, vos messages, vos votes, vos candidatures de curateur, et vos contributions refusées ou que vous avez retirées. Certaines choses restent un peu plus longtemps : nos sauvegardes chiffrées gardent l''ancien enregistrement jusqu''à leur remplacement, 90 jours au plus, et une contribution retenue pour une affaire juridique est conservée tant que dure la retenue. Certaines choses restent délibérément, sans aucun lien avec votre compte : les contributions que vous avez données à la carte ouverte, vos confirmations et marques « J''ai roulé ici » (sauf sur un itinéraire que vous avez proposé vous-même, où elles n''ont jamais compté et sont supprimées), l''historique des modifications, vos signalements de bogue, et la trace que vous avez accordé une licence. Une demande d''ouverture d''un pays ne reste que comme un décompte anonyme, sans votre note ni votre proposition d''en être curateur. Vos photos approuvées restent aussi, créditées à un cycliste anonyme, sauf si votre profil est public et que vous choisissez d''y garder votre nom en partant. Tout cela est décrit plus haut sous <b>Combien de temps nous les conservons</b>.'
  rights_portability: '<b>Portabilité des données (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_20">RGPD art. 20</a>)</b> : téléchargez ce que nous détenons à votre sujet dans un seul fichier ZIP depuis les paramètres de votre compte, jusqu''à 3 fois par jour. Cette limite sert uniquement à empêcher les abus. Il contient entre autres les données de votre compte, vos contributions, vos messages et exposés des motifs, vos consentements de licence et vos photos sous forme de fichiers. Il ne contient pas ce qu''une autre personne a écrit en signalant l''une de vos photos, car ces mots sont les siens. Tant qu''un curateur examine encore un tel signalement, ou qu''une photo est retenue pour les autorités, il ne contient pas non plus le motif ; la décision vous le dit.'
  rights_restrict: '<b>Limitation et opposition (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_18">RGPD Arts. 18–21</a>)</b>: limiter ou s''opposer à certains traitements.'
  rights_withdraw: '<b>Retirer votre consentement</b> à tout moment, par exemple en désactivant votre profil public ou les e-mails de nouvelles. Dès ce moment, nous cessons ce à quoi vous aviez consenti. Ce que nous avons fait avec votre consentement avant cela reste licite (<a href="https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679#art_7">RGPD art. 7(3)</a>).'
  rights_third_party_photo: '<b>Vous n''avez pas de compte ?</b> Ces droits ne dépendent pas d''un compte. Si vous êtes reconnaissable sur une photo de notre carte, chaque page photo porte un lien <b>"cette photo me montre"</b>. Signalez-le là, sans compte ni pièce d''identité, et un curateur répond dans un délai d''un mois au plus tard.'
  rights_contact_pre: 'Pour exercer l''un de ces droits, écrivez à'
  rights_contact_mid: '. Nous répondons <b>dans un délai d''un mois au plus tard</b>, et normalement bien avant. La loi autorise jusqu''à trois mois pour une demande vraiment complexe, mais seulement si nous vous prévenons dans le premier mois que ce sera plus long, et pourquoi. Si notre réponse ne vous satisfait pas, vous pouvez porter plainte auprès de la'
  rights_contact_ap: 'Autoriteit Persoonsgegevens'
  rights_contact_post: '.'
  h_children: 'Enfants'
  children_body: 'Le Commons n''est pas destiné aux enfants de moins de <b>16</b> ans. Nous ne collectons pas sciemment de données personnelles de personnes de moins de cet âge ; si vous pensez qu''un enfant nous a fourni des données, contactez-nous et nous les supprimerons.'
  h_automated: 'Décisions automatisées'
  automated_body: 'Nous ne prenons pas de décisions vous concernant par des moyens exclusivement automatisés, et nous ne vous profilons pas à des fins publicitaires.'
  h_changes: 'Modifications de cette politique'
  changes_body: 'Si nous changeons notre façon de traiter les données, nous ajoutons ici une nouvelle version, avec sa date et ce qui a changé, et nous affichons un avis aux cyclistes connectés jusqu’à ce qu’ils l’aient lue. Un changement important, comme une nouvelle finalité, un nouveau destinataire ou un nouveau pays, est aussi envoyé par e-mail à chaque compte au moins 30 jours avant de s’appliquer, pour que vous puissiez le lire et fermer votre compte d’abord si vous n’êtes pas d’accord. Votre compte enregistre la dernière version de chaque page que vous avez vue.'
  changes_versions_pre: 'Voir'
  changes_versions_link: 'l''historique des révisions'
  changes_versions_post: ' sur GitHub.'
  footer_disc_pre: 'Voir aussi nos'
  footer_disc_terms: 'Conditions d''utilisation'
  footer_disc_mid: 'et les'
  footer_disc_licences: 'licences des données, des médias et du code'
  footer_disc_post: '.'
  version_line: 'Version %n% · %date%'
  changed_bar: 'Notre politique de confidentialité a changé le %date%.'
  changing_bar: 'Notre politique de confidentialité change le %date%.'
  upcoming_box: 'Une nouvelle version s’applique à partir du %date%.'
  upcoming_link: 'Lire la nouvelle version'
  next_box: 'Voici la nouvelle version. Elle s’applique à partir du %date%.'
  next_back: 'Lire la version qui s’applique aujourd’hui'
  changed_read: 'Voir ce qui a changé'
  change:
    v1_first: 'La première version numérotée. Les formulations antérieures figurent dans l’historique des révisions indiqué ci-dessous.'
    v2_traffic: 'Nouveau : depuis la revue de sortie de Scout, vous pouvez envoyer un <b>résumé du trafic</b> d''une sortie avec radar : par route, la distance, les voitures et le moment de la journée. Un résumé ne contient aucune trace GPS. Voyez ce que nous collectons et combien de temps nous le gardons.'
    v2_time_zone: 'Nouveau : nous enregistrons votre <b>fuseau horaire</b>, celui que vous choisissez dans vos paramètres ou celui que signale votre navigateur, pour afficher les heures dans ce fuseau.'
    v2_pseudonym: 'Corrigé : profil désactivé, vos contributions affichent votre <b>pseudonyme</b> fixe, et non aucun nom.'
    v2_base_location: 'Modifié : votre <b>localisation de base</b> est stockée comme un point au hasard jusqu''à environ 2,5 km du point que vous choisissez, au lieu d''un point arrondi à environ 1 km.'
    v2_clearer: 'Plus facile à lire. La notice dit que les deux choses que vous pouvez envoyer depuis Scout, les résumés du trafic et les étiquettes, sont votre choix pour chaque sortie. Elle explique en mots simples comment nous gardons votre mot de passe, pourquoi nous comptons combien de fois un outil est utilisé sans compte, et ce que la carte garde dans votre propre navigateur. Pour chaque service hors de l''EEE, elle dit ce que ce service voit. Chaque article du RGPD cité renvoie au texte de loi lui-même.'
    v2_errors: 'Ajouté : les <b>rapports d''erreur</b> de notre serveur, ce qu''ils contiennent, et qu''ils restent sur nos propres machines.'
    v2_notice: 'Ajouté : comment nous vous informons des changements. Un changement important vous est envoyé par e-mail au moins 30 jours avant de s’appliquer ; un changement plus petit reçoit une nouvelle version ici.'
    v2_more: 'Ajouté : ce qu''envoie une étiquette Scout ; ce que nous gardons des signalements de bogue, des candidatures de curateur et des marques « J''ai roulé ici » ; vos autres réglages ; où nous gardons des adresses IP codées, et combien de temps ; que les liens ajoutés aux lieux peuvent être vérifiés avec Google Safe Browsing ; et ce que devient chaque type de données quand vous supprimez votre compte.'
    v2_statements: 'Ajouté : les <b>exposés des motifs</b> que nous envoyons quand une décision restreint quelque chose que vous avez ajouté : conservés avec vos messages aussi longtemps que votre compte, inclus dans votre export de données, et envoyés par e-mail.'
    v2_suspension: 'Ajouté : ce que nous conservons quand un administrateur <b>suspend</b> un compte, combien de temps, et ce que votre export de données en contient ; et qu''une suppression pour manquement utilise votre adresse e-mail une seule fois, pour vous envoyer les motifs.'
    v2_authorities: 'Ajouté : quand la loi nous oblige à informer la <b>police ou une autorité judiciaire</b> d''une menace pour la vie ou la sécurité de quelqu''un, ce que nous lui transmettons, sur quelle base juridique, et combien de temps nous gardons la trace.'
