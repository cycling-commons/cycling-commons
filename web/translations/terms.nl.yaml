terms:
  kicker: 'Gebruiksvoorwaarden'
  title: 'De afspraak, in gewone taal.'
  lead: 'Deze voorwaarden gelden voor het gebruik van de Cycling Commons-website en -account, in gewone taal.'
  version_line: 'Versie %n% · %date%'
  changed_bar: 'Onze gebruiksvoorwaarden zijn gewijzigd op %date%.'
  changing_bar: 'Onze gebruiksvoorwaarden veranderen op %date%.'
  changed_read: 'Lees wat er is veranderd'
  upcoming_box: 'Vanaf %date% geldt een nieuwe versie.'
  upcoming_link: 'Lees de nieuwe versie'
  next_box: 'Dit is de nieuwe versie. Die geldt vanaf %date%.'
  next_back: 'Lees de versie die nu geldt'
  h1_accepting: 'Deze voorwaarden aanvaarden'
  accepting_p1_pre: 'Door de Cycling Commons-website te gebruiken of een account aan te maken, ga je akkoord met deze voorwaarden en onze'
  accepting_p1_privacy: 'Privacyverklaring'
  accepting_p1_mid: '. Als je het er niet mee eens bent, gebruik dan de dienst niet. De Commons wordt beheerd door'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' in Nederland. Hoe het project wordt bestuurd, en waar het naartoe gaat, staat op onze'
  accepting_p1_governance: 'bestuurspagina'
  accepting_p1_post: '.'
  h2_who: 'Wie het mag gebruiken'
  who_body: 'Je moet minimaal <b>16</b> jaar oud zijn om een account aan te maken. De informatie die je ons geeft (zoals je e-mailadres) moet juist zijn en van jou.'
  h3_account: 'Jouw account'
  account_password: 'Houd je wachtwoord veilig; jij bent verantwoordelijk voor activiteit onder je account.'
  account_unauthorised: 'Laat het ons direct weten als je ongeautoriseerde toegang vermoedt.'
  account_suspend: 'We kunnen een account schorsen of verwijderen dat wordt gebruikt voor misbruik of om deze voorwaarden te schenden, zoals paragraaf 11 uitlegt.'
  h4_using: 'Het goed gebruiken'
  using_intro: 'De Commons werkt omdat mensen hem te goeder trouw gebruiken.'
  using_no_illegal: 'Overtreed de wet niet, val anderen niet lastig en plaats geen onwettige, misleidende of schadelijke inhoud.'
  using_no_personal: 'Upload geen <b>persoonsgegevens over andere mensen</b> (bijvoorbeeld herkenbare personen op foto''s) zonder een goede rechtsgrond: de Commons brengt plaatsen in kaart, niet mensen.'
  using_no_reidentify_pre: 'Probeer bijdragers niet te identificeren en ondermijn niet de'
  using_no_reidentify_link: 'privacygrens'
  using_no_reidentify_post: ' van het project die persoonsgegevens buiten houdt.'
  using_no_scrape_pre: 'Scrape de dienst niet. De'
  using_no_scrape_link: 'ontwikkelaarspagina'
  using_no_scrape_post: ' vermeldt hoe je aan de data komt, en voor gebruik in bulk of offline is er een'
  using_no_scrape_export_link: 'gratis export'
  using_no_scrape_mid: '. Staat wat je nodig hebt er niet bij, schrijf ons dan via de'
  using_no_scrape_contact_link: 'contactpagina'
  using_no_scrape_end: ' en we kijken wat we kunnen doen.'
  using_no_disrupt: 'Verstoor de dienst niet en werk niet om de limieten heen.'
  h5_contributions: 'Jouw bijdragen'
  contributions_p1_pre: 'Je behoudt het auteurschap van wat je bijdraagt. Om de Commons open te houden, verleen je de licenties in onze'
  contributions_p1_link: 'bijdragevoorwaarden'
  contributions_p1_mid: ': <b>data</b> komt in de Commons terecht onder de'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', <b>media</b> (foto''s, video) onder'
  contributions_p1_mid3: ', en <b>code, gebruikersinterface en vertalingen</b> onder'
  contributions_p1_agpl: 'AGPL-3.0-only'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Je bevestigt dat je het recht hebt om in te dienen wat je indient, dat het de rechten van anderen niet schendt, en dat het geen persoonsgegevens over andere mensen bevat.'
  h6_opendata: 'Open data & de API'
  opendata_pre: 'De Commons-data en -media zijn voor iedereen vrij te gebruiken, ook commercieel, onder hun'
  opendata_link: 'licenties'
  opendata_mid: ', met naamsvermelding. Ook de code, gebruikersinterface en vertalingen zijn vrij te gebruiken, onder AGPL-3.0-only, die om broncode vraagt in plaats van om een vermelding alleen. Zie de'
  opendata_dev_link: 'ontwikkelaarsdocumentatie'
  opendata_post: ' voor de attributieregel en de huidige manieren om aan de data te komen.'
  opendata_export_pre: 'Voor gebruik in bulk of offline download je de'
  opendata_export_link: 'gratis export'
  opendata_export_post: '. Die bevat de plekken en routes van de Commons als GeoJSON, onder de ODbL 1.0 voor de database en de DbCL 1.0 voor de inhoud. Elk record noemt zijn bron, en records waarvan de licentie ons niet toestaat ze door te geven, laten we weg. Er staan geen persoonsgegevens in, niets wat nog op een regiobeheerder wacht, en geen foto''s.'
  h7_code: 'Onze code & merknaam'
  code_pre: 'De platformbroncode is <b>vrije software</b> onder de'
  code_link: 'GNU Affero General Public License v3'
  code_post: ': iedereen mag hem draaien, bestuderen, aanpassen en delen, commercieel gebruik inbegrepen. Wat de licentie terugvraagt is broncode. Draai je een aangepaste versie en laat je mensen die over een netwerk gebruiken, dan ben je die mensen ook jouw broncode schuldig. De naam "Cycling Commons" en het logo vallen <b>niet</b> onder die licentie en blijven bij het project, wat artikel 7(e) van de AGPL uitdrukkelijk toestaat. Wat je ermee mag doen staat in ons'
  code_brand_link: 'merkbeleid'
  code_brand_post: '.'
  h8_preview: 'Een intentie, geen garantie'
  preview_body: 'De Cycling Commons is een intentie, <b>geen</b> garantie. Vertrouw er niet op voor routes, wegomstandigheden of je veiligheid op de weg. Gebruik altijd je eigen oordeel tijdens het fietsen.'
  h9_warranty: 'Geen garantie'
  warranty_body: 'De dienst wordt geleverd <b>"zoals hij is"</b> en "zoals beschikbaar", zonder garanties van welke aard dan ook, voor zover toegestaan door de wet. We garanderen niet dat hij nauwkeurig, ononderbroken of foutloos zal zijn.'
  h10_liability: 'Aansprakelijkheid'
  liability_body: 'Voor zover toegestaan door het Nederlandse recht is BikeCoders niet aansprakelijk voor indirecte of gevolgschade die voortvloeit uit jouw gebruik van de Commons. Niets in deze voorwaarden beperkt aansprakelijkheid die wettelijk niet kan worden beperkt.'
  h11_suspension: 'Accounts sluiten en verwijderen'
  suspension_pre: 'Je kunt je account op elk moment sluiten in je'
  suspension_link: 'instellingen'
  suspension_post: '.'
  suspension_dormant: 'Een account waarop <b>24 maanden</b> niemand heeft ingelogd, wordt op dezelfde manier verwijderd. We mailen je eerst drie keer, na 12, 22 en 23 maanden, en één keer inloggen is genoeg om het te houden. Een account waarvan het e-mailadres niet binnen <b>7 dagen</b> is bevestigd, wordt zonder waarschuwing verwijderd, omdat het adres kan toebehoren aan iemand die zich nooit heeft aangemeld.'
  suspension_p2: 'Voordat je gaat, kun je op dezelfde pagina <b>alles wat we over je bewaren downloaden</b> als één ZIP-bestand. Het sluiten van je account verwijdert je persoonsgegevens meteen van de site; onze versleutelde back-ups bewaren ze hooguit 90 dagen, zoals de privacyverklaring uitlegt. Je aanmeldingen als regiobeheerder verdwijnen mee. Een verzoek om een land te openen blijft alleen als anonieme telling, zonder je toelichting en zonder je aanbod om er regiobeheerder te worden. Sommige dingen blijven, zonder koppeling aan je account: wat je aan de open kaart gaf, je bevestigingen en je "Ik heb dit gereden"-markeringen (behalve op een route die je zelf voorstelde: die telden nooit mee en worden verwijderd), de bewerkingsgeschiedenis, je bugmeldingen, en de vastlegging dat je een fotolicentie hebt verleend, die we bewaren als bewijs dat de licentie bestaat. Goedgekeurde foto''s blijven in de Commons onder CC BY-SA 4.0. Is je profiel openbaar, dan kies je bij je vertrek of ze je weergavenaam houden; anders worden ze anoniem. Wat onder juridische bewaring staat, bijvoorbeeld omdat het misschien naar de autoriteiten moet, blijft tot de bewaring is opgeheven.'
  suspension_admin: 'Een beheerder kan een account <b>schorsen</b> voor 1 tot 365 dagen, of het <b>verwijderen</b>, als het wordt gebruikt voor misbruik, om deze voorwaarden te schenden, of om de Commons of de mensen die er gebruik van maken te schaden. De grond is altijd een van deze: misbruik, spam, onrechtmatige inhoud, de dienst gebruiken tegen deze voorwaarden in (zoals hem scrapen, verstoren of zijn limieten omzeilen), accountgegevens die niet kloppen of niet van jou zijn, bijdragen die niet kloppen, reclame, of persoonsgegevens over andere mensen. Zolang een schorsing duurt, kun je niet inloggen, en een sessie die al open is, eindigt. Ze loopt vanzelf af op de datum en het tijdstip die we je noemen. Wat je toevoegde blijft staan, en de 24 maanden waarna een ongebruikt account wordt verwijderd, tellen vanaf het einde van de schorsing. Verwijderen gebeurt meteen, en het wist het account op dezelfde manier als wanneer je het zelf sluit.'
  suspension_told: 'In beide gevallen mailen we je een motivering: wat we besloten, de grond, de feiten, of meldingen ertoe leidden, en hoe je bezwaar maakt. Na een verwijdering gaat die naar je adres direct nadat het account is gewist. Denk je dat we het mis hebben, antwoord dan op die e-mail of schrijf ons via de contactpagina; we bekijken het besluit opnieuw en laten je weten wat we besloten.'
  h12_moderation: 'Hoe moderatie werkt'
  mod_intro: 'De Commons bestaat uit wat renners toevoegen, dus een deel moet worden gecontroleerd. Hier staat wat we weghalen, wie beslist, wat je te horen krijgt en wat je ertegen kunt doen.'
  mod_standard_h: 'Wat wordt weggehaald'
  mod_std1: '<b>Alles wat onrechtmatig is.</b> Ook inhoud die de rechten van iemand anders schendt.'
  mod_std2: '<b>Persoonsgegevens over anderen.</b> De Commons brengt plekken in kaart, geen mensen. Een herkenbare persoon op een foto, een naam, een kenteken, een huis dat als iemands woning wordt aangewezen.'
  mod_std3: '<b>Dingen die simpelweg niet kloppen.</b> Een waterpunt dat er nooit was, een wegdek dat niet overeenkomt met de werkelijkheid, een klim verzonnen om een ranglijst te bespelen.'
  mod_std4: '<b>Misbruik.</b> Intimidatie, bedreigingen, of inhoud die op een persoon is gericht in plaats van op een plek.'
  mod_std5: '<b>Reclame.</b> De Commons is geen advertentiesite, en een plek staat er niet op omdat iemand betaalde of erom vroeg.'
  mod_std6: '<b>Foto''s die geen foto''s zijn.</b> Een beeld dat door AI is gemaakt of wezenlijk is aangepast, hoe goed het er ook uitziet. De Commons is een kaart van de echte wereld, en een plaatje van een plek die er nooit zo uitgezien heeft is slechter dan helemaal geen plaatje.'
  mod_std7: '<b>Intiem beeldmateriaal, of een foto waarop een kind staat.</b> Een foto die op deze grond wordt gemeld, wordt eerst verborgen en daarna bekeken, zoals "Wie beslist" uitlegt.'
  mod_std8: '<b>Privé-eigendom dat niet openbaar hoort te zijn.</b> Een eigen oprit, een tuin, een blik in iemands huis. De foto is misschien rechtmatig gemaakt; een regiobeheerder weegt het verzoek van de eigenaar toch.'
  mod_std9: '<b>Werk van iemand anders.</b> Een foto of tekst die je niet zelf hebt gemaakt en niet onder onze licenties mag delen. De rechthebbende kan het melden als eigen werk, en wie het toevoegde kan één keer reageren.'
  mod_accept: 'Een regiobeheerder controleert wat renners sturen. Een toevoeging moet kloppen, te controleren zijn en iets zijn wat de Commons in kaart brengt; wat dat niet is, wijst een regiobeheerder af. Beschrijven twee vermeldingen dezelfde plek, dan houdt een regiobeheerder er één en haalt de andere van de kaart.'
  h13_ai: 'Waar machines aan te pas komen'
  ai_intro: 'Korte lijst, en we vertellen hem liever dan dat je moet gokken:'
  ai_translation: '<b>Machinevertaling.</b> Sommige plaatsbeschrijvingen zijn machinaal vertaald uit een andere taal. Elk daarvan is ter plekke als zodanig gelabeld, want een machinevertaling van een bergpas kan fout zijn op een manier die prima leest.'
  ai_none: '<b>Verder niets.</b> Geen chatbot, geen gegenereerde tekst die we als de onze presenteren, en geen profilering. Het weinige dat software zelf doet, zoals een besmet bestand weigeren of een nooit bevestigd account verwijderen, staat onder "Wie beslist" in paragraaf 12. Wordt die lijst ooit langer, dan veranderen deze paragrafen als eerste.'
  ai_checks: '<b>Automatische controles.</b> Software zoekt naar dingen die verkeerd lijken, zoals twee kranen op een meter van elkaar, een plek die dezelfde kan zijn als een object in OpenStreetMap, of een link die op een lijst van onveilige sites staat, en legt wat ze vindt voor aan een regiobeheerder. Ze signaleert; een regiobeheerder beslist.'
  ai_uploads: '<b>Wat je niet mag uploaden.</b> Geen door AI gemaakte beelden, en geen aangepaste scènes. Gewoon bewerken mag, met of zonder AI-gereedschap: bijsnijden, rechtzetten, kleuren bijstellen, verscherpen, ruis weghalen. Iets verzinnen of weghalen dat er stond mag niet, en een plaatje dat een model maakte ook niet. Gezichten en kentekens onherkenbaar maken mag, en is welkom. De toestemming die je vóór het uploaden aanvinkt zegt hetzelfde, en een foto die ertegenin gaat kan worden verwijderd.'
  ai_stance: 'We claimen hiermee geen naleving van wat dan ook. De Europese AI-verordening heeft transparantieregels, en het valt te betwisten hoe ver ze reiken tot een beschrijving van een drinkwaterkraan. We vertellen het je omdat een kaart alleen wat waard is als je kunt zien wat een mens erop gezet heeft.'
  mod_who_h: 'Wie beslist'
  mod_who: 'Een <b>regiobeheerder</b> of een <b>beheerder</b> beslist, altijd een mens. Ze werken volgens een geschreven reglement, en elke beslissing wordt vastgelegd met hun naam erbij.'
  mod_escalate: '<b>Bedreigingen voor leven of veiligheid.</b> Wijst iets op een misdrijf dat iemands leven of veiligheid bedreigt, dan geeft een regiobeheerder het door aan een beheerder. Een foto of een inzending wordt meteen verborgen en onder juridische bewaring gezet. De beheerder informeert de politie of de justitiële autoriteit van het betrokken land, of van Nederland als dat niet duidelijk is, en geeft hun wat we hebben en wat ze nodig hebben; daar kunnen de accountgegevens van de plaatser bij horen. Het materiaal blijft bewaard tot die autoriteit zegt dat het weg mag.'
  mod_automated: '<b>Wat software zelf doet.</b> De meeste geautomatiseerde controles markeren alleen iets voor een mens (paragraaf 13). Deze handelen zonder op iemand te wachten:'
  mod_auto_files: '<b>Bestanden.</b> Elk bestand dat je uploadt wordt op malware gescand en gecontroleerd voordat het verschijnt. Een bestand dat besmet of onleesbaar is, of niet in een formaat en grootte die we aannemen, wordt geweigerd, en dat laten we je weten.'
  mod_auto_scenic: '<b>Uitzichtpunten.</b> Een foto bij een uitzichtpunt moet het uitzicht vanaf die plek tonen. Is hij meer dan 250 m van de pin genomen, of kunnen we niet zien waar, dan blijft hij bij die plek verborgen tot een regiobeheerder bevestigt dat hij daar is genomen.'
  mod_auto_urgent: '<b>Dringende meldingen.</b> Een melding over intiem beeldmateriaal of over een kind verbergt de foto meteen, voordat een mens de melding heeft gezien, en daarna beoordeelt een regiobeheerder hem. Dat beschermt mensen; het oordeelt niet over ze. Dit automatisch verbergen heeft grenzen, zodat het meldformulier niet kan worden gebruikt om foto''s massaal weg te halen; een melding daarbovenop komt bovenaan de lijst van de regiobeheerders, en een beheerder wordt gewaarschuwd.'
  mod_auto_accounts: '<b>Accounts.</b> Onbevestigde accounts en accounts die 24 maanden ongebruikt zijn, worden verwijderd, zoals paragraaf 11 uitlegt. Te veel mislukte inlogpogingen zetten het inloggen op een account een tijdje stil.'
  mod_told_h: 'Wat je te horen krijgt'
  mod_told_pre: 'Beperkt een beslissing iets dat je toevoegde, dan sturen we je een motivering, in je'
  mod_told_link: 'berichten'
  mod_told_post: ' en per e-mail. Dat geldt voor een inzending, route of vertaling die een regiobeheerder afwijst; een foto die wordt weggehaald; een foto die na een dringende melding is verborgen, zodra een regiobeheerder hem heeft beoordeeld, ook als hij daarna terug op de kaart komt; foto''s die een regiobeheerder weglaat bij een beslissing over de rest; een plek of route die van de kaart gaat, ook als een regiobeheerder een andere vermelding als dezelfde plek houdt; een bijdrage die als misbruik naar de prullenbak gaat; een gegrond verklaarde melding over iets dat je toevoegde; en een bestand dat onze uploadcontroles weigeren. De motivering zegt wat er is besloten en waar dat over gaat, de feiten, of een melding de aanleiding was, of onze software het zelf deed, op welke regel of wet het berust, en hoe je bezwaar maakt. Een regiobeheerder die iets afwijst, schrijft altijd een toelichting, en de motivering citeert die.'
  mod_told_p2: 'Een vraag van een regiobeheerder over iets dat je stuurde, of een foto die na een melding is teruggezet, komt ook in je berichten. Sommige beslissingen sturen niets. Een inzending die een regiobeheerder als spam naar de prullenbak verplaatst, verdwijnt zonder bericht, zoals de digitaledienstenverordening toestaat; ze kan 30 dagen worden teruggezet. Wat voor de autoriteiten wordt bewaard, krijgt geen motivering zolang de bewaring duurt; de beslissing daarna wel. Een bewerking door een regiobeheerder of een andere renner stuurt niets, omdat ze niets van jou beperkt. Een motivering over een plek gaat naar de renner wiens nieuwe plek een regiobeheerder goedkeurde; een plek die uit OpenStreetMap of een andere bron komt, heeft geen auteur om te informeren. Regioteksten en stadskaarten hebben niet één auteur, dus een wijziging daaraan bereikt niemand.'
  mod_appeal_h: 'Als je het er niet mee eens bent'
  mod_appeal_pre: 'Antwoord op de e-mail met de motivering, met de referentie erin, en we bekijken de beslissing opnieuw. Kreeg je niets, antwoord je liever niet per e-mail, of heb je geen account meer, schrijf ons dan via de'
  mod_appeal_link: 'contactpagina'
  mod_appeal_post: '. Een beslissing is niet definitief omdat hij één keer is genomen; een regiobeheerder die zich vergiste kan hem veranderen.'
  mod_report_h: 'Iets melden'
  mod_report_pre: 'Iedereen kan inhoud melden, met of zonder account. Gebruik het'
  mod_report_link: 'contactformulier'
  mod_report_post: ', of de meldlink op de pagina of op de foto zelf. Een melding vraagt om een e-mailadres, behalve een melding over intiem beeldmateriaal of een kind, die je zonder kunt sturen. Hebben we een adres (ingelogd is het dat van je account), dan bevestigen we je melding en laten we weten wat we besloten.'
  mod_report_p2: 'Het formulier biedt de gronden hierboven, en "Iets anders" voor wat er niet in past. Een regiobeheerder die op "Iets anders" ingaat, noemt eerst de regel die is overtreden.'
  h14_governing: 'Toepasselijk recht'
  governing_body: 'Deze voorwaarden worden beheerst door het recht van <b>Nederland</b>, en geschillen gaan naar de bevoegde Nederlandse rechter. Gebruik je de Commons als consument en woon je in de EU, dan houd je de bescherming van het dwingende recht van je eigen land, en kun je een geschil voorleggen aan de rechter waar je woont. Wij kunnen alleen daar een zaak tegen jou beginnen.'
  h15_changes: 'Wijzigingen'
  changes_body: 'Als deze voorwaarden veranderen, voegen we hier een nieuwe versie toe, met de datum en wat er veranderde, en tonen we ingelogde fietsers een melding tot ze die gelezen hebben. Een belangrijke wijziging, zoals een nieuwe regel of een wijziging van je rechten, mailen we ook naar elk account, minstens 30 dagen voordat ze ingaat, zodat je ze kunt lezen en eerst je account kunt sluiten als je het er niet mee eens bent. Door de Commons te blijven gebruiken nadat een wijziging is ingegaan, aanvaard je die.'
  changes_included: 'Deze voorwaarden omvatten drie andere teksten: de bijdragevoorwaarden (paragraaf 5), het merkbeleid (paragraaf 7), en de licentiepagina met de licentieteksten waarnaar ze linkt. Een belangrijke wijziging in een daarvan kondigen we aan zoals een wijziging van deze voorwaarden, per e-mail minstens 30 dagen voordat ze ingaat. Redactionele verbeteringen, zoals een tikfout of een kapotte link, gelden meteen.'
  changes_versions_pre: 'Bekijk de'
  changes_versions_link: 'revisiegeschiedenis'
  changes_versions_post: ' op GitHub.'
  h16_contact: 'Contact'
  contact_pre: 'Vragen over deze voorwaarden:'
  contact_post: '.'
  contact_poc_pre: 'Onze'
  contact_poc_link: 'contactpagina'
  contact_poc_post: ' is ons centrale contactpunt voor fietsers en voor autoriteiten, ook onder de Europese digitaledienstenverordening. Je kunt ons schrijven in het Engels, Frans, Nederlands, Duits of Spaans.'
  footer_disc_pre: 'Zie ook onze'
  footer_disc_privacy: 'Privacyverklaring'
  footer_disc_mid: 'en de data-, media-, code-, interface- en vertalings-'
  footer_disc_licences: 'licenties'
  footer_disc_post: '.'
  change:
    v2_data: 'Aan de data komen: de voorwaarden verwijzen naar de ontwikkelaarspagina, die vermeldt hoe dat kan, in plaats van te noemen wat live is, en noemen de gratis export voor gebruik in bulk of offline. Scrapen blijft verboden.'
    v2_code: 'Bijdragen: code, gebruikersinterface en vertalingen worden samen genoemd, allemaal onder AGPL-3.0-only.'
    v2_backups: 'Een account sluiten: de voorwaarden zeggen dat onze versleutelde back-ups de persoonsgegevens hooguit 90 dagen bewaren, zoals de privacyverklaring al deed.'
    v2_notice: 'Hoe we je over wijzigingen vertellen: een belangrijke wijziging mailen we je minstens 30 dagen voordat ze ingaat, en een kleinere krijgt hier een nieuwe versie.'
    v2_more: 'Moderatie en accounts: de voorwaarden noemen elke grond die een melding kan aanvoeren, wat software zelf doet, wat je na een beslissing te horen krijgt, wanneer een account wordt verwijderd, en dat een consument het recht en de rechter van het eigen land houdt.'
    v2_reasons: 'Wat je te horen krijgt: beperkt een beslissing iets dat je toevoegde, dan krijg je een motivering in je berichten en per e-mail, met de feiten, de regel en hoe je bezwaar maakt. De voorwaarden zeggen ook wat een regiobeheerder niet aanneemt.'
    v2_suspension: 'Schorsing: een beheerder kan een account nu ook 1 tot 365 dagen schorsen, niet alleen verwijderen. De voorwaarden noemen de gronden, en bij beide beslissingen hoort een motivering per e-mail.'
    v2_authorities: 'Bedreigingen voor leven of veiligheid: de voorwaarden zeggen hoe zulke inhoud wordt bewaard en hoe een beheerder de politie of een justitiële autoriteit informeert.'
