# domain the in-site translation system reads (docs/specs/translations.md §6). This
# file's history is the record of every change to the page in Dutch.
terms:
  kicker: 'Gebruiksvoorwaarden'
  title: 'De afspraak, in gewone taal.'
  lead: 'Deze voorwaarden gelden voor het gebruik van de Cycling Commons-website en -account, in gewone taal.'
  last_updated: 'Laatst bijgewerkt 1 augustus 2026'
  h1_accepting: 'Deze voorwaarden aanvaarden'
  accepting_p1_pre: 'Door de Cycling Commons-website te gebruiken of een account aan te maken, ga je akkoord met deze voorwaarden en onze'
  accepting_p1_privacy: 'Privacyverklaring'
  accepting_p1_mid: '. Als je het er niet mee eens bent, gebruik dan de dienst niet. De Commons wordt beheerd door'
  accepting_p1_bikecoders: 'BikeCoders'
  accepting_p1_mid2: ' in Nederland, op weg naar een onafhankelijke stichting zoals beschreven in ons'
  accepting_p1_governance: 'bestuursdocument'
  accepting_p1_post: '.'
  h2_who: 'Wie het mag gebruiken'
  who_body: 'Je moet minimaal <b>16</b> jaar oud zijn om een account aan te maken. De informatie die je ons geeft (zoals je e-mailadres) moet juist zijn en van jou.'
  h3_account: 'Jouw account'
  account_password: 'Houd je wachtwoord veilig; jij bent verantwoordelijk voor activiteit onder je account.'
  account_unauthorised: 'Laat het ons direct weten als je ongeautoriseerde toegang vermoedt.'
  account_suspend: 'We kunnen accounts opschorten of sluiten die worden gebruikt voor misbruik of om deze voorwaarden te schenden.'
  h4_using: 'Het goed gebruiken'
  using_intro: 'De Commons werkt omdat mensen hem te goeder trouw gebruiken.'
  using_no_illegal: 'Overtreed de wet niet, val anderen niet lastig en plaats geen onwettige, misleidende of schadelijke inhoud.'
  using_no_personal: 'Upload geen <b>persoonsgegevens over andere mensen</b> (bijvoorbeeld herkenbare personen op foto''s) zonder een goede rechtsgrond — de Commons brengt plaatsen in kaart, niet mensen.'
  using_no_reidentify_pre: 'Probeer bijdragers niet te identificeren en ondermijn de'
  using_no_reidentify_link: 'privacygrens'
  using_no_reidentify_post: ' van het project te ondermijnen die persoonsgegevens buiten houdt.'
  using_no_scrape_pre: 'Scrape de dienst niet. Punt — de'
  using_no_scrape_link: 'API en bulkexport'
  using_no_scrape_post: ' zijn de manier om aan de data te komen. Geen van beide is al live, dus mail tot die tijd info@cyclingcommons.org en we bezorgen je wat je nodig hebt.'
  using_no_disrupt: 'Verstoor de dienst niet en werk niet om de limieten heen.'
  h5_contributions: 'Jouw bijdragen'
  contributions_p1_pre: 'Je behoudt het auteurschap van wat je bijdraagt. Om de Commons open te houden, verleen je de licenties in onze'
  contributions_p1_link: 'bijdragevoorwaarden'
  contributions_p1_mid: ': <b>data</b> komt in de Commons terecht onder de'
  contributions_p1_odbl: 'ODbL 1.0'
  contributions_p1_mid2: ', <b>media</b> (foto''s, video) onder'
  contributions_p1_mid3: ', en <b>UI-vertalingen</b> onder'
  contributions_p1_agpl: 'AGPL-3.0-only'
  contributions_p1_ccbysa: 'CC BY-SA 4.0'
  contributions_p1_post: '.'
  contributions_p2: 'Je bevestigt dat je het recht hebt om in te dienen wat je indient, dat het de rechten van anderen niet schendt, en dat het geen persoonsgegevens over andere mensen bevat.'
  h6_opendata: 'Open data & de API'
  opendata_pre: 'De Commons-data en -media zijn voor iedereen vrij te gebruiken, ook commercieel, onder hun'
  opendata_link: 'licenties'
  opendata_mid: ', met naamsvermelding. UI-vertalingen zijn ook vrij te gebruiken, onder de codelicentie, die om broncode vraagt in plaats van om een vermelding alleen. Zie de'
  opendata_dev_link: 'ontwikkelaarsdocumentatie'
  opendata_post: ' voor de attributieregel, en voor de API en bulkexport zoals die ontworpen worden — geen van beide is al live.'
  h7_code: 'Onze code & merknaam'
  code_pre: 'De platformbroncode is <b>vrije software</b> onder de'
  code_link: 'GNU Affero General Public License v3'
  code_post: ': iedereen mag hem draaien, bestuderen, aanpassen en delen, commercieel gebruik inbegrepen. Wat de licentie terugvraagt is broncode. Draai je een aangepaste versie en laat je mensen die over een netwerk gebruiken, dan ben je die mensen ook jouw broncode schuldig. De naam "Cycling Commons" en het logo vallen <b>niet</b> onder die licentie en blijven bij het project, wat artikel 7(e) van de AGPL uitdrukkelijk toestaat. Wat je ermee mag doen staat in ons'
  code_brand_link: 'merkbeleid'
  code_brand_post: '.'
  h8_preview: 'Een intentie, geen garantie'
  preview_body: 'De Cycling Commons is een intentie, <b>geen</b> garantie. Vertrouw er niet op voor routes, wegomstandigheden of je veiligheid op de weg — gebruik altijd je eigen oordeel tijdens het fietsen.'
  h9_warranty: 'Geen garantie'
  warranty_body: 'De dienst wordt geleverd <b>"zoals hij is"</b> en "zoals beschikbaar", zonder garanties van welke aard dan ook, voor zover toegestaan door de wet. We garanderen niet dat hij nauwkeurig, ononderbroken of foutloos zal zijn.'
  h10_liability: 'Aansprakelijkheid'
  liability_body: 'Voor zover toegestaan door het Nederlandse recht is BikeCoders niet aansprakelijk voor indirecte of gevolgschade die voortvloeit uit jouw gebruik van de Commons. Niets in deze voorwaarden beperkt aansprakelijkheid die wettelijk niet kan worden beperkt.'
  h11_suspension: 'Opschorting & beëindiging'
  suspension_pre: 'Je kunt je account op elk moment sluiten in je'
  suspension_link: 'instellingen'
  suspension_post: '. We kunnen de toegang opschorten of beëindigen als deze voorwaarden worden geschonden of om de Commons of haar gebruikers te beschermen.'
  suspension_p2: 'Voordat je gaat, kun je op dezelfde pagina <b>alles wat we over je bewaren downloaden</b> als één ZIP-bestand. Het sluiten van je account verwijdert je persoonsgegevens. Twee dingen blijven, en geen van beide noemt je daarna: de bijdragen die je aan de open kaart gaf, en de vastlegging dat je een fotolicentie hebt verleend, die we bewaren als bewijs dat de licentie bestaat. Foto''s die waren goedgekeurd blijven in de Commons onder CC BY-SA 4.0, en je kiest bij je vertrek of ze je naam behouden of anoniem worden.'
  h12_moderation: 'Hoe moderatie werkt'
  mod_intro: 'De Commons bestaat uit wat renners toevoegen, dus een deel moet worden gecontroleerd. Hier staat wat we weghalen, wie beslist, wat je te horen krijgt en wat je ertegen kunt doen.'
  mod_standard_h: 'Wat wordt weggehaald'
  mod_std1: '<b>Alles wat onrechtmatig is.</b> Ook inhoud die de rechten van iemand anders schendt.'
  mod_std2: '<b>Persoonsgegevens over anderen.</b> De Commons brengt plekken in kaart, geen mensen. Een herkenbare persoon op een foto, een naam, een kenteken, een huis dat als iemands woning wordt aangewezen.'
  mod_std3: '<b>Dingen die simpelweg niet kloppen.</b> Een waterpunt dat er nooit was, een wegdek dat niet overeenkomt met de werkelijkheid, een klim verzonnen om een ranglijst te bespelen.'
  mod_std4: '<b>Misbruik.</b> Intimidatie, bedreigingen, of inhoud die op een persoon is gericht in plaats van op een plek.'
  mod_std5: '<b>Reclame.</b> De Commons is geen advertentiesite, en een plek staat er niet op omdat iemand betaalde of erom vroeg.'
  mod_std6: '<b>Foto''s die geen foto''s zijn.</b> Een beeld dat door AI is gemaakt of wezenlijk is aangepast, hoe goed het er ook uitziet. De Commons is een kaart van de echte wereld, en een plaatje van een plek die er nooit zo uitgezien heeft is slechter dan helemaal geen plaatje.'
  h13_ai: 'Waar machines aan te pas komen'
  ai_intro: 'Korte lijst, en we vertellen hem liever dan dat je moet gokken:'
  ai_translation: '<b>Machinevertaling.</b> Sommige plaatsbeschrijvingen komen uit Wikipedia in de plaatselijke taal en worden automatisch naar het Engels vertaald. Elk daarvan is ter plekke gelabeld als <b>auto-translated</b>, want een machinevertaling van een bergpas kan fout zijn op een manier die prima leest.'
  ai_checks: '<b>Automatische controles.</b> Software scant de catalogus op dingen die verkeerd lijken, twee kranen op een meter van elkaar, een link die niet meer werkt, en legt ze voor aan een regiobeheerder. Ze signaleert; ze beslist nooit.'
  ai_none: '<b>Verder niets.</b> Geen chatbot, geen gegenereerde tekst die we als de onze presenteren, geen geautomatiseerd besluit over jou of je account, en geen profilering. Verandert dat ooit, dan verandert deze paragraaf als eerste.'
  ai_uploads: '<b>Wat je niet mag uploaden.</b> Geen door AI gemaakte beelden, en geen aangepaste scènes. Gewoon bewerken mag, met of zonder AI-gereedschap: bijsnijden, rechtzetten, kleuren bijstellen, verscherpen, ruis weghalen. Iets verzinnen of weghalen dat er stond mag niet, en een plaatje dat een model maakte ook niet. De ene aanpassing die we wél vragen: maak gezichten en kentekens onherkenbaar voordat je uploadt. De toestemming die je vóór het uploaden aanvinkt zegt dit, en het is een grond voor verwijdering.'
  ai_stance: 'We claimen hiermee geen naleving van wat dan ook. De transparantieregels van de Europese AI-verordening gaan op <b>2 augustus 2026</b> gelden, en het valt te betwisten hoe ver ze reiken tot een beschrijving van een drinkwaterkraan. We zouden het je hoe dan ook vertellen, want een kaart is alleen wat waard als je kunt zien wat een mens erop gezet heeft.'
  mod_who_h: 'Wie beslist'
  mod_who: 'Een <b>regiobeheerder</b> beslist, en een regiobeheerder is een mens. Regiobeheerders zijn renners die zich hebben aangemeld en zijn aangenomen, ze werken volgens een geschreven reglement, en elke beslissing wordt vastgelegd met hun naam erbij.'
  mod_automated: '<b>Niets wordt door software alleen verwijderd.</b> Er draaien wel geautomatiseerde controles, en die markeren dingen zodat een regiobeheerder ernaar kijkt, maar ze beslissen nooit. De ene uitzondering werkt andersom en is er om mensen te beschermen, niet om ze te beoordelen: een melding over intiem beeldmateriaal of over een kind verbergt de foto direct, voordat een mens de melding heeft gezien, en daarna beoordeelt een regiobeheerder hem.'
  mod_told_h: 'Wat je te horen krijgt'
  mod_told_pre: 'Als iets dat je hebt toegevoegd wordt weggehaald of gewijzigd, laten we het je weten, met de reden erbij. Het bericht noemt waar het over ging en op welke grond is beslist. Je vindt het in je'
  mod_told_link: 'berichten'
  mod_told_post: '.'
  mod_appeal_h: 'Als je het er niet mee eens bent'
  mod_appeal_pre: 'Reageer op dat bericht en een regiobeheerder leest het. Wil je het liever buiten je account om doen, of heb je er geen meer, schrijf ons dan via de'
  mod_appeal_link: 'contactpagina'
  mod_appeal_post: '. Een beslissing is niet definitief omdat hij één keer is genomen; een regiobeheerder die zich vergiste kan het terugzetten.'
  mod_report_h: 'Iets melden'
  mod_report_pre: 'Iedereen kan inhoud melden, met of zonder account. Gebruik de'
  mod_report_link: 'het contactformulier'
  mod_report_post: ', of de meldlink op de foto zelf. We bevestigen elke melding en we laten weten wat we besloten. Foto''s hebben hun eigen meldlink op elke fotopagina.'
  h12_governing: 'Toepasselijk recht'
  governing_body: 'Deze voorwaarden worden beheerst door het recht van <b>Nederland</b>. Geschillen vallen onder de bevoegde Nederlandse rechters, tenzij dwingend consumentenrecht je andere rechten geeft.'
  h13_changes: 'Wijzigingen'
  changes_body: 'We kunnen deze voorwaarden bijwerken; we plaatsen wijzigingen hier met een nieuwe datum. Door de Commons na een wijziging te blijven gebruiken, aanvaard je de bijgewerkte voorwaarden.'
  h14_contact: 'Contact'
  contact_pre: 'Vragen over deze voorwaarden:'
  contact_post: '.'
  footer_disc_pre: 'Zie ook onze'
  footer_disc_privacy: 'Privacyverklaring'
  footer_disc_mid: 'en de data-, media-, UI-vertalingen- en code-'
  footer_disc_licences: 'licenties'
  footer_disc_post: '.'
