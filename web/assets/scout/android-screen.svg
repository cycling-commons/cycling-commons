<!--
  PLACEHOLDER — replace this file with a real Android screenshot.

  The phone frame around it is CSS (templates/partials/_scout_devices.html.twig),
  so swapping the screen is exactly this: drop a 9:19.5-ish image in at this
  path, keep the filename, change nothing else. PNG or SVG, either is fine.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 563" role="img" aria-label="Scout on an Android phone">
  <rect width="260" height="563" fill="#101E16"/>

  <!-- status bar -->
  <g font-family="monospace" font-size="11" fill="#8FB6A8">
    <text x="16" y="26">9:41</text>
    <text x="244" y="26" text-anchor="end">▮▮▮</text>
  </g>

  <!-- title -->
  <text x="16" y="62" font-family="sans-serif" font-size="20" font-weight="600" fill="#EFE6D4">Scout</text>
  <text x="16" y="82" font-family="monospace" font-size="10" fill="#FF5A1F">RECORDING · 1H 12M</text>

  <!-- the big tag button -->
  <circle cx="130" cy="196" r="74" fill="#FF5A1F"/>
  <text x="130" y="192" font-family="monospace" font-size="15" fill="#101E16" text-anchor="middle">TAG</text>
  <text x="130" y="212" font-family="monospace" font-size="10" fill="#101E16" text-anchor="middle" opacity=".75">TAP TO MARK</text>

  <!-- recent tags list -->
  <text x="16" y="308" font-family="monospace" font-size="10" fill="#8FB6A8">THIS RIDE</text>
  <g font-family="sans-serif" font-size="13">
    <g>
      <rect x="16" y="320" width="228" height="46" rx="8" fill="#1C3A2A"/>
      <circle cx="40" cy="343" r="11" fill="#C8923A"/>
      <text x="62" y="340" fill="#EFE6D4">Gravel starts</text>
      <text x="62" y="356" font-family="monospace" font-size="10" fill="#8FB6A8">SURFACE · 4.2 km</text>
    </g>
    <g>
      <rect x="16" y="374" width="228" height="46" rx="8" fill="#1C3A2A"/>
      <circle cx="40" cy="397" r="11" fill="#8FB6A8"/>
      <text x="62" y="394" fill="#EFE6D4">Fountain, village square</text>
      <text x="62" y="410" font-family="monospace" font-size="10" fill="#8FB6A8">RESUPPLY · 11.8 km</text>
    </g>
    <g>
      <rect x="16" y="428" width="228" height="46" rx="8" fill="#1C3A2A"/>
      <circle cx="40" cy="451" r="11" fill="#D92D20"/>
      <text x="62" y="448" fill="#EFE6D4">Road shut — bridge</text>
      <text x="62" y="464" font-family="monospace" font-size="10" fill="#8FB6A8">CLOSURE · WEEKS · 19.3 km</text>
    </g>
  </g>

  <!-- send bar -->
  <rect x="16" y="496" width="228" height="44" rx="8" fill="none" stroke="#2C5440" stroke-width="1.5"/>
  <text x="130" y="523" font-family="monospace" font-size="12" fill="#8FB6A8" text-anchor="middle">REVIEW &amp; SEND</text>
</svg>
