<!--
  PLACEHOLDER — replace this file with a real Garmin Edge screenshot.

  The device frame around it is CSS (templates/partials/_scout_devices.html.twig),
  so swapping the screen is exactly this: drop a 246x322-ish image in at this
  path, keep the filename, change nothing else. A PNG works just as well as an
  SVG; only the aspect ratio matters, and the frame crops gracefully either way.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 322" role="img" aria-label="Scout tag menu on a bike computer">
  <rect width="246" height="322" fill="#101E16"/>

  <!-- status strip -->
  <rect x="0" y="0" width="246" height="26" fill="#0a1610"/>
  <text x="12" y="18" font-family="monospace" font-size="12" fill="#8FB6A8">SCOUT</text>
  <text x="234" y="18" font-family="monospace" font-size="12" fill="#8FB6A8" text-anchor="end">2:47</text>

  <!-- tag grid: the six field tags -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <g>
      <rect x="12" y="38" width="108" height="62" rx="6" fill="#1C3A2A" stroke="#2C5440" stroke-width="1.5"/>
      <text x="66" y="66" fill="#EFE6D4">RESUPPLY</text>
      <text x="66" y="84" fill="#8FB6A8" font-size="10">WATER · FOOD</text>
    </g>
    <g>
      <rect x="126" y="38" width="108" height="62" rx="6" fill="#1C3A2A" stroke="#2C5440" stroke-width="1.5"/>
      <text x="180" y="66" fill="#EFE6D4">CLOSURE</text>
      <text x="180" y="84" fill="#8FB6A8" font-size="10">HOW LONG?</text>
    </g>
    <g>
      <rect x="12" y="108" width="108" height="62" rx="6" fill="#1C3A2A" stroke="#2C5440" stroke-width="1.5"/>
      <text x="66" y="136" fill="#EFE6D4">SURFACE</text>
      <text x="66" y="154" fill="#C8923A" font-size="10">GRAVEL</text>
    </g>
    <g>
      <rect x="126" y="108" width="108" height="62" rx="6" fill="#1C3A2A" stroke="#2C5440" stroke-width="1.5"/>
      <text x="180" y="136" fill="#EFE6D4">NOTICE</text>
      <text x="180" y="154" fill="#8FB6A8" font-size="10">POTHOLES</text>
    </g>
    <g>
      <rect x="12" y="178" width="108" height="62" rx="6" fill="#1C3A2A" stroke="#2C5440" stroke-width="1.5"/>
      <text x="66" y="206" fill="#EFE6D4">SCENERY</text>
      <text x="66" y="224" fill="#8FB6A8" font-size="10">VIEW</text>
    </g>
    <g>
      <rect x="126" y="178" width="108" height="62" rx="6" fill="#FF5A1F"/>
      <text x="180" y="206" fill="#101E16">OTHER</text>
      <text x="180" y="224" fill="#101E16" font-size="10" opacity=".75">ONE TAP</text>
    </g>
  </g>

  <!-- overtake counter, the radar arm -->
  <rect x="12" y="252" width="222" height="54" rx="6" fill="#0a1610" stroke="#2C5440" stroke-width="1.5"/>
  <text x="24" y="274" font-family="monospace" font-size="10" fill="#8FB6A8">OVERTAKES</text>
  <text x="24" y="296" font-family="monospace" font-size="20" fill="#EFE6D4">37</text>
  <text x="222" y="296" font-family="monospace" font-size="10" fill="#8FB6A8" text-anchor="end">RADAR PAIRED</text>
</svg>
