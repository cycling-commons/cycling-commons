# Traffic measurements (docs/specs/traffic-measurements.md). The grouping is
# the default of a system setting an admin can change (SettingsRegistry
# TRAFFIC_GROUPING); `daytype` shows workday and weekend apart.
parameters:
    traffic.grouping: daytype
    # Default of the setting that shows curators the traffic layer on the map
    # (SettingsRegistry TRAFFIC_MAP_LAYER_LIVE): off while it is not in use.
    traffic.map_layer_live: 0
