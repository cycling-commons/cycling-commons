framework:
    cache:
        # Redis, not the filesystem — because production is a cluster.
        #
        # Everything that has to agree across nodes lives in this pool: every
        # rate limiter, the media auto-withhold circuit breaker, and the
        # proof-of-work store behind the anonymous photo-report route. On the
        # filesystem each frontend kept its own copy, which meant published rate
        # limits were really per-node (so doubled), the "site-wide" withhold
        # budget in photo-uploads.md was not site-wide, and a proof-of-work
        # challenge issued by one node could not be verified by the other.
        #
        # The test env overrides this with the array adapter (test/framework.yaml)
        # so the suite needs no Redis and no state survives a kernel reboot.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'
