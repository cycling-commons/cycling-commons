#
# GlitchTip speaks the Sentry protocol. An empty SENTRY_DSN (dev, tests) makes
# the bundle a no-op. `capture_soft_fails: false` reports a Messenger message
# once its retries are exhausted, not on every retry.
sentry:
    dsn: '%env(SENTRY_DSN)%'
    messenger:
        enabled: true
        capture_soft_fails: false
    options:
        environment: '%env(APP_ENV)%'
        send_default_pii: false
        # The request body, up to 10 KB, so a failure can be replayed locally
        # and an abuse attempt read (owner 2026-10-10). SentryBeforeSend runs
        # it through App\Support\SentryRequestScrubber: secret fields masked
        # everywhere, and no body or query at all from the forms with really
        # personal content (sign-in, account, contact, messages, Scout, ...).
        max_request_body_size: medium
        # Drops the site answering a stranger correctly (a scanner's Host, a
        # bot's 404, the login page for a visitor not signed in) and names
        # the build on everything else: cyclingcommons@<tag>+<sha12>. No
        # `ignore_exceptions`: it matches by class alone, and each of those
        # classes also carries real faults (SentryNoise says which).
        before_send: 'App\Support\SentryBeforeSend'
    # Errors only. The default wraps every DBAL query in a span; traces are
    # not collected today, so that is cost without a reader.
    tracing:
        enabled: false
