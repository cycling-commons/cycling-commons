#
# GlitchTip speaks the Sentry protocol. An empty SENTRY_DSN (dev, tests) makes
# the bundle a no-op. `capture_soft_fails: false` reports a Messenger message
# once its retries are exhausted, not on every retry.
sentry:
    dsn: '%env(SENTRY_DSN)%'
    messenger:
        enabled: true
        capture_soft_fails: false
    options:
        environment: '%env(APP_ENV)%'
        send_default_pii: false
        # Not errors: the site answering correctly. A 404 is mostly bots
        # probing for WordPress files and leaked .env files; an
        # AccessDeniedException is a visitor who is not signed in, sent to
        # the login page. Both filled the tracker (owner 2026-09-28). Matched
        # with is_a, so subclasses go too. A signed-in rider refused a page
        # (AccessDeniedHttpException, a 403) is still reported: that can be
        # a real permission mistake.
        ignore_exceptions:
            - 'Symfony\Component\HttpKernel\Exception\NotFoundHttpException'
            - 'Symfony\Component\Security\Core\Exception\AccessDeniedException'
    # Errors only. The default wraps every DBAL query in a span; traces are
    # not collected today, so that is cost without a reader.
    tracing:
        enabled: false
