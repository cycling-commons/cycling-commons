framework:
    cache:
        pools:
            # Dedicated pools, all inheriting `cache.app` — which is Redis in
            # dev/prod and the per-kernel array adapter in test. Inheriting is
            # what makes that test swap actually happen: these pools used to
            # name `cache.adapter.filesystem` outright, so the test override
            # never reached them and limiter counters persisted across phpunit
            # runs while DAMA reused user ids.
            cache.route_propose_limiter:
                adapter: cache.app
            cache.route_suggest_limiter:
                adapter: cache.app
            cache.ride_check_limiter:
                adapter: cache.app
            cache.elevation_limiter:
                adapter: cache.app
            cache.coverage_read_limiter:
                adapter: cache.app
            cache.country_interest_limiter:
                adapter: cache.app
            cache.curator_application_limiter:
                adapter: cache.app
            cache.curator_reauth_limiter:
                adapter: cache.app
            cache.media_upload_limiter:
                adapter: cache.app
            cache.data_export_limiter:
                adapter: cache.app
            cache.media_report_limiter:
                adapter: cache.app
            cache.media_report_urgent_limiter:
                adapter: cache.app
            cache.media_urgent_breaker_limiter:
                adapter: cache.app
            cache.media_urgent_alert_limiter:
                adapter: cache.app
            cache.media_pow:
                adapter: cache.app
            cache.public_api_limiter:
                adapter: cache.app
    rate_limiter:
        contribution_submit:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Route-domain spec §5.5: proposals are heavier than pin edits — the
        # supply gate starts at intake.
        route_propose:
            policy: sliding_window
            limit: 3
            interval: '1 day'
            cache_pool: cache.route_propose_limiter
        # Route-domain spec §13 P3-D4: the suggest channel is the flood vector
        # (each pending row is a curator task); vote/rode-it self-bound by UNIQUE.
        route_suggest:
            policy: sliding_window
            limit: 5
            interval: '1 day'
            cache_pool: cache.route_suggest_limiter
        # Ride-check (spec 2026-07-14 §4.1): read-only compute (parse + two
        # PostGIS corridor queries, nothing persisted) — more generous than
        # intake, still bounded per rider per day.
        ride_check:
            policy: sliding_window
            limit: 20
            interval: '1 day'
            cache_pool: cache.ride_check_limiter
        # Climb-editor elevation profiling (review 2026-08-16 finding 5): every
        # call is an upstream Valhalla request, and Valhalla is shared
        # infrastructure. Per MINUTE, not per day: redrawing a climb
        # legitimately re-profiles several times in one editing session, so the
        # budget is generous for a human and a wall for a loop.
        elevation:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
            cache_pool: cache.elevation_limiter
        # Coverage query plane (coverage-provider.md §5): the
        # app's first anonymous-read limiter — per-IP sliding window, generous
        # for normal map use, bounded against scraping (access-terms rule).
        coverage_read:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
            cache_pool: cache.coverage_read_limiter
        # Country requests and curator signup.
        # A rider
        # may reasonably ask for a handful of countries; nobody needs 200.
        country_interest:
            policy: sliding_window
            limit: 10
            interval: '1 day'
            cache_pool: cache.country_interest_limiter
        # An application is a task for a human reviewer, so this is the tighter
        # of the two.
        curator_application:
            policy: sliding_window
            limit: 3
            interval: '1 day'
            cache_pool: cache.curator_application_limiter
        # Confirming a password before sending an application from a
        # remember-me session (account-and-auth.md). Its own limiter, never the
        # application's: that one allows 3 a DAY, so two typos would have cost a
        # rider their ability to apply until tomorrow. Sized like the firewall's
        # own login throttling instead, because that is what this is.
        curator_reauth:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.curator_reauth_limiter
        # Photo uploads (photo-uploads.md §7): generous for a real day of
        # contributing, bounded against bulk abuse. Each accepted upload costs
        # an Imagick decode plus three encodes, so this is a compute gate as
        # much as a storage one.
        media_upload:
            policy: sliding_window
            limit: 30
            interval: '1 day'
            cache_pool: cache.media_upload_limiter
        # Data export (account-and-auth.md §11): the heaviest read the app
        # offers — fourteen queries plus every stored photo streamed through
        # a temp file. Nobody legitimately needs a second copy of an unchanged
        # account minutes after the first, and GDPR Art. 12(5) explicitly allows
        # refusing requests that are "manifestly unfounded or excessive, in
        # particular because of their repetitive character".
        data_export:
            policy: sliding_window
            limit: 3
            interval: '1 day'
            cache_pool: cache.data_export_limiter
        # Third-party photo reports (photo-uploads.md §6c): anonymous, per-IP.
        # Five genuine complaints in a day is already an unusual day; fifty is
        # a campaign. No CAPTCHA and no third-party bot service — the abuse
        # story is this limiter, the queue-not-withhold design, the site-wide
        # circuit breaker below, and the local proof-of-work the breaker turns
        # on when it opens.
        media_report:
            policy: sliding_window
            limit: 5
            interval: '1 day'
            cache_pool: cache.media_report_limiter
        # The auto-withholding category is the one lever an anonymous visitor
        # has that changes anything, so its budget is one pull per IP per day.
        media_report_urgent:
            policy: sliding_window
            limit: 1
            interval: '1 day'
            cache_pool: cache.media_report_urgent_limiter
        # NOTE: the auto-withhold circuit breaker (photo-uploads.md §6c) is
        # deliberately NOT declared here. Its two budgets are runtime-editable
        # settings (system-configuration.md §2), so UrgentWithholdBreaker
        # builds its sliding windows itself around the current values and only
        # borrows the cache pool below. A limiter whose limit is fixed at
        # deploy time would be the wrong shape for a dial an owner may need to
        # turn during an attack.
        # How often the breaker may mail a human. The flood that opens the
        # breaker keeps arriving, so an alert per report would be thousands of
        # messages aimed at the one person who has to read them.
        media_urgent_alert:
            policy: sliding_window
            limit: 1
            interval: '1 hour'
            cache_pool: cache.media_urgent_alert_limiter
        # Public API v1 (public-api.md §2.2 PoC): same shape as coverage_read
        # but its own pool, so external consumers never eat the site map's
        # budget and a noisy integration throttles only itself.
        public_api_read:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
            cache_pool: cache.public_api_limiter

when@test:
    framework:
        cache:
            pools:
                cache.route_propose_limiter:
                    adapter: cache.adapter.array
                cache.route_suggest_limiter:
                    adapter: cache.adapter.array
                cache.ride_check_limiter:
                    adapter: cache.adapter.array
                cache.elevation_limiter:
                    adapter: cache.adapter.array
                cache.coverage_read_limiter:
                    adapter: cache.adapter.array
                cache.country_interest_limiter:
                    adapter: cache.adapter.array
                cache.curator_application_limiter:
                    adapter: cache.adapter.array
                cache.curator_reauth_limiter:
                    adapter: cache.adapter.array
                cache.media_upload_limiter:
                    adapter: cache.adapter.array
                cache.data_export_limiter:
                    adapter: cache.adapter.array
                cache.media_report_limiter:
                    adapter: cache.adapter.array
                cache.media_report_urgent_limiter:
                    adapter: cache.adapter.array
                cache.media_urgent_breaker_limiter:
                    adapter: cache.adapter.array
                cache.media_urgent_alert_limiter:
                    adapter: cache.adapter.array
                cache.media_pow:
                    adapter: cache.adapter.array
                cache.public_api_limiter:
                    adapter: cache.adapter.array
