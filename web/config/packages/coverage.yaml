# Coverage tiles (coverage-provider.md §4/§8) — rollout
# flag + manifest location. Committed defaults live in web/.env; dev-stack
# overrides in developers/docker/ (compose passes them through).
parameters:
    coverage.tiles_enabled: '%env(bool:COVERAGE_TILES)%'
    coverage.manifest_url: '%env(COVERAGE_MANIFEST_URL)%'
    # Browser-facing tile origin for CSP connect-src. A dedicated param, NOT
    # derived from coverage.manifest_url: the manifest is fetched server-side
    # (dev: http://minio:9000 from the app container) while the browser
    # range-reads tiles from another origin (dev: http://localhost:9100) —
    # the two hosts legitimately differ. Empty = no coverage host in the policy.
    coverage.csp_host: '%env(COVERAGE_CSP_HOST)%'
    # Road-surface line tiles. The manifest is the normal path — the build
    # publishes three artifacts under one stamp and repoints it, so a rebuild
    # goes live without a config change. The three URLs below PIN a specific
    # build and win when set: the hatch for bisecting a rendering problem, or
    # for serving an artifact that was never published. Empty = follow the
    # manifest.
    surface.manifest_url: '%env(ROAD_SURFACE_MANIFEST_URL)%'
    surface.tiles_url: '%env(ROAD_SURFACE_TILES_URL)%'
    surface.todo_url: '%env(ROAD_SURFACE_TODO_URL)%'
    surface.gaps_url: '%env(ROAD_SURFACE_GAPS_URL)%'
    # Cycle-route network tiles (route=bicycle/mtb corridors + knooppunten).
    # Same manifest-or-pin contract as the surface set, its own manifest
    # because the two builds run as separate invocations.
    routes.manifest_url: '%env(ROUTES_MANIFEST_URL)%'
    routes.tiles_url: '%env(ROUTES_TILES_URL)%'
    # Road pieces for traffic matching (traffic-measurements.md §2). Same
    # manifest-or-pin contract, read only by Scout's ride review.
    roadpieces.manifest_url: '%env(ROADPIECES_MANIFEST_URL)%'
    roadpieces.tiles_url: '%env(ROADPIECES_TILES_URL)%'

# Tests never read the dev stack's published road pieces: the container's
# ROADPIECES_MANIFEST_URL would otherwise win over .env.test.
when@test:
    parameters:
        roadpieces.manifest_url: ''
        roadpieces.tiles_url: ''
