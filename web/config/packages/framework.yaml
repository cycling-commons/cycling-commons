framework:
    secret: '%env(APP_SECRET)%'
    handle_all_throwables: true
    php_errors:
        log: true
    router:
        utf8: true
    session:
        # Redis, not PHP's file handler: production runs two frontends behind a
        # load balancer, and on-disk sessions mean a rider who logs in on one
        # node is logged out on the other. The test env swaps in
        # `session.storage.factory.mock_file` (test/framework.yaml), so the
        # suite still needs no Redis.
        handler_id: '%env(REDIS_URL)%'
        cookie_secure: auto
        cookie_samesite: lax

# Proxy trust is prod-only: dev talks to PHP-FPM directly and must keep seeing
# the real peer address (review 2026-08-16 finding 3). Without this, behind the
# LB + nginx frontends getClientIp() returns the proxy, so every per-IP rate
# limiter (coverage_read, media_report*) collapses into one shared bucket.
when@prod:
    framework:
        # The cluster's private network: the load balancer and both nginx
        # frontends. Never REMOTE_ADDR alone once a second hop exists.
        trusted_proxies: '%env(TRUSTED_PROXIES)%'
        # Locked to exactly the two headers nginx sets. Anything wider
        # (Forwarded, X-Forwarded-Host) is spoof surface we do not use.
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']
