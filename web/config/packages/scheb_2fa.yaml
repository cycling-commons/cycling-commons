# Configuration reference: https://symfony.com/bundles/SchebTwoFactorBundle/index.html
scheb_two_factor:
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken

    totp:
        enabled: true
        issuer: 'Cycling Commons'
        template: security/2fa_login.html.twig
        # One window either side, so a phone clock that drifts by a few seconds
        # is not a lockout (owner, 2026-08-30). At the bundle default of 0, a
        # code typed at second 29 of its own window arrives in the next one and
        # is refused: the failure mode is a correct person being told they are
        # wrong, with nothing on screen to explain it.
        #
        # The cost is stated plainly: a code stays valid for about 90 seconds
        # rather than 30, so an attacker who can SEE one has three times as long
        # to use it. That is a shoulder-surfing window, not a guessing one; the
        # guess space is unchanged at a million per attempt, and the login
        # limiter is what bounds attempts. Every authenticator app and most
        # services make the same trade for the same reason.
        leeway: 1

    backup_codes:
        enabled: true

# Dev only: no second factor (owner 2026-08-12).
#
# Every elevated fixture account is fully enrolled, which is right — a curator
# desk that can be reached without 2FA in prod is not a desk we would ship. But
# on a local stack it means every scripted browser check has to compute a TOTP
# from the fixture seed, and when that goes wrong (as it did tonight) the failure
# looks like a broken page rather than a failed login.
#
# Turning the PROVIDER off is the narrow way to do it: the accounts keep their
# enrolment, the entity keeps its logic, nothing about the prod path changes, and
# the switch is one word in a `when@dev` block rather than a flag some deploy can
# read. `when@dev` cannot leak: prod and staging never load it.
when@dev:
    scheb_two_factor:
        totp:
            enabled: false
        backup_codes:
            enabled: false
