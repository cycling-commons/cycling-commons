security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_users: { entity: { class: App\Entity\User, property: email } }

    firewalls:
        dev: { pattern: ^/(_(profiler|wdt)|css|images|js)/, security: false }
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: profile
                success_handler: App\Security\LoginSuccessHandler  # enforces 2FA setup for elevated roles; else default target
            logout: { path: logout, target: home, enable_csrf: true }
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                secure: auto
                samesite: lax
            login_throttling:
                max_attempts: 5        # Symfony's built-in throttle; the User-field lockout (Task 7) adds a hard lock + cooldown
            two_factor:                # scheb: interstitial after primary auth for users who have 2FA enabled
                auth_form_path: 2fa_login
                check_path: 2fa_login_check

    access_control:
        # Localized routes carry an optional two-letter locale prefix (English is
        # clean); the `(/[a-z]{2})?` group keeps these rules matching both. A
        # WILDCARD, not the literal locale list (owner, 2026-08-17): a new
        # locale (ja, zh, ...) must not silently fall outside these rules the
        # day it lands. Routing runs before the firewall, so a prefix that is
        # not a real locale 404s and the wider match never serves anything.
        # `logout`, `verify`, scheb's `/2fa` interstitial, `/api`, and `/admin`
        # stay unprefixed (see i18n design).
        - { path: '^(/[a-z]{2})?/(login|register|reset-password)', roles: PUBLIC_ACCESS }
        - { path: ^/verify, roles: PUBLIC_ACCESS }
        # Crawler entry points. Explicit PUBLIC_ACCESS for the same scheb
        # lazy-firewall reason as /map/catalog.json below — a session read here
        # would make both uncacheable, and these are fetched by every crawler.
        - { path: '^/(robots\.txt|sitemap\.xml)$', roles: PUBLIC_ACCESS }
        # Public rider profiles (spec 2026-07-14): explicit PUBLIC_ACCESS for the
        # same scheb lazy-firewall reason as /map/catalog.json below.
        - { path: '^(/[a-z]{2})?/riders/', roles: PUBLIC_ACCESS }
        # Explicit PUBLIC_ACCESS (not just "no rule matches") so scheb's lazy-firewall
        # TwoFactorAccessListener treats the path as publicly accessible and skips
        # tokenStorage->getToken() — otherwise it forces a session read on every
        # request, which downgrades this cacheable endpoint's Cache-Control to
        # "private, must-revalidate" (AbstractSessionListener). See
        # TwoFactorAccessDecider::isPubliclyAccessible().
        - { path: ^/map/catalog\.json$, roles: PUBLIC_ACCESS }
        - { path: ^/map/best-of$, roles: PUBLIC_ACCESS }
        - { path: '^/map/item/\d+/history$', roles: PUBLIC_ACCESS }
        # Region spotlight polygon (map-and-search.md §4.5): the cacheable
        # DB boundary that replaced the Nominatim fetch. Same lazy-firewall
        # rationale as /map/catalog.json above.
        - { path: '^/map/region/[a-z0-9-]+/boundary$', roles: PUBLIC_ACCESS }
        # The My-area scope boundary (same response shape, same cacheability);
        # it was added after this list and missed the treatment — the one
        # cacheable /map endpoint scheb was still session-reading (frontend
        # review 2026-08-09 #2).
        - { path: '^/map/scope/boundary$', roles: PUBLIC_ACCESS }
        # Same cacheability rationale as /map/catalog.json above: explicit
        # PUBLIC_ACCESS so scheb's TwoFactorAccessListener skips the session
        # read that would downgrade Cache-Control to private.
        - { path: '^/routes/\d+\.gpx$', roles: PUBLIC_ACCESS }
        # Water/utility confirmation tallies are PUBLIC (anyone sees the counts;
        # only the confirm POST — enforced in-controller as a 401 — needs a
        # login). Explicit PUBLIC_ACCESS for the same lazy-firewall reason as the
        # map endpoints above.
        - { path: '^/items/\d+/confirmations$', roles: PUBLIC_ACCESS }
        # The target of the attribution link embedded in every stored photo
        # (docs/specs/photo-uploads.md §5d). Explicit PUBLIC_ACCESS for the same
        # scheb lazy-firewall cacheability reason as /map/catalog.json above —
        # and because a reuser following a link out of an image file must never
        # be asked to sign in.
        - { path: '^/photo/[0-9a-fA-F-]{36}$', roles: PUBLIC_ACCESS }
        # The third-party report route (docs/specs/photo-uploads.md §6c): the
        # people it protects mostly have no account, and GDPR Art. 17 does not
        # require one. Explicitly public so nobody is ever bounced to login.
        - { path: '^/photo/[0-9a-fA-F-]{36}/report$', roles: PUBLIC_ACCESS }
        # Coverage query plane (coverage-provider.md §5):
        # anonymous cacheable JSON over the coverage_poi cache — explicit
        # PUBLIC_ACCESS for the same scheb lazy-firewall cacheability reason
        # as /map/catalog.json above.
        - { path: '^/map/coverage/(search|nearby|counts)$', roles: PUBLIC_ACCESS }
        - { path: '^/map/coverage/poi/(node|way)/\d+$', roles: PUBLIC_ACCESS }
        # /2fa/setup is reached by a FULLY authenticated user (elevated role, no secret yet) → ROLE_USER.
        # Must precede the ^/2fa rule below, which guards scheb's interstitial (/2fa, /2fa_check)
        # where the token is only IS_AUTHENTICATED_2FA_IN_PROGRESS, not yet fully authenticated.
        - { path: '^(/[a-z]{2})?/2fa/setup', roles: ROLE_USER }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: '^(/[a-z]{2})?/(profile|settings)', roles: ROLE_USER }
        # Backstops mirroring the controllers' own IsGranted attributes (review
        # 2026-08-16 finding 7): if a route is ever added to these controllers
        # without the attribute, it stays behind login anyway. Deliberately NOT
        # listed: /media/* and /contribute/elevation - they follow THE
        # stateless-JSON pattern (security-architecture.md §5.1) whose clean
        # in-controller 401 an access_control rule would replace with a 302 to
        # the login page; their auth is pinned by their own controller tests.
        - { path: '^(/[a-z]{2})?/messages', roles: ROLE_USER }
        - { path: ^/scout/tags, roles: ROLE_USER }
        - { path: '^(/[a-z]{2})?/moderate', roles: ROLE_CURATOR }
        - { path: ^/admin, roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_CURATOR: ROLE_USER
        ROLE_ADMIN: [ROLE_CURATOR, ROLE_USER]

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4          # Lowest possible value for bcrypt
                time_cost: 3     # Lowest possible value for argon
                memory_cost: 10  # Lowest possible value for argon
