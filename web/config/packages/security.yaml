security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_users: { entity: { class: App\Entity\User, property: email } }

    firewalls:
        dev: { pattern: ^/(_(profiler|wdt)|css|images|js)/, security: false }
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: home
            logout: { path: logout, target: home }
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                secure: auto
                samesite: lax
            login_throttling:
                max_attempts: 5        # Symfony's built-in throttle; the User-field lockout (Task 7) adds a hard lock + cooldown
            # two_factor:              # TODO Task 6 (scheb) — wired when scheb auth_form_path + check_path are tested end-to-end
            #     auth_form_path: 2fa_login
            #     check_path: 2fa_login_check

    access_control:
        - { path: ^/(login|register|reset-password|verify), roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/(profile|settings), roles: ROLE_USER }
        - { path: ^/moderate, roles: ROLE_CURATOR }
        - { path: ^/admin, roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_CURATOR: ROLE_USER
        ROLE_ADMIN: [ROLE_CURATOR, ROLE_USER]

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4          # Lowest possible value for bcrypt
                time_cost: 3     # Lowest possible value for argon
                memory_cost: 10  # Lowest possible value for argon
