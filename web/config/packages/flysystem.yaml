# Rider photo storage, one storage per continent (photo-uploads.md §1.2, §2).
#
# Every environment except test talks S3 through media.s3_client: dev points it
# at the dev stack's MinIO, staging and production at their own Cycling Commons
# buckets. One code path, endpoint and credentials supplied by the environment —
# the same arrangement pipeline/coverage/publish.py already uses. Riders'
# browsers never address the bucket directly; they fetch from MEDIA_PUBLIC_BASE,
# which in production is the owner-run caching proxy routing on the first path
# segment (the continent code).
#
# There is deliberately no when@prod and no when@dev block. Storage stays purely
# env-driven: one code path, the bucket decided by MEDIA_S3_*. Gating it on
# when@prod would mean a second, near-duplicate block under when@staging (which
# staging now needs — see routing/doctrine/asset_mapper), and the day someone
# updates one and not the other, staging writes rider photos onto a box's local
# disk. Env-driven configuration cannot have that gap.
#
# when@test is the one exception: the in-memory adapter keeps suites hermetic.
#
# Onboarding a continent: add a bucket, add a storage here, add one line to the
# App\Media\MediaStorage $storages map in services.yaml. No code changes.
flysystem:
    storages:
        media.storage.eu:
            adapter: 'asyncaws'
            options:
                client: 'media.s3_client'
                bucket: '%env(MEDIA_S3_BUCKET_EU)%'
                # Environment folder inside the SHARED bucket (owner
                # 2026-08-18: no extra buckets for staging): staging and
                # production write under their own top-level key prefix.
                # Transparent to all code; the media proxy adds the same
                # folder when routing /cc-media-eu/ to the bucket.
                prefix: '%env(MEDIA_S3_PREFIX)%'

        # The quarantine, and only the quarantine
        # (media-storage-architecture.md §2.2). ONE bucket, not one per
        # continent: nothing here is ever addressed by a browser, so there is
        # no proxy to route and no region to be near - an unscanned object
        # lives here for the seconds between the upload and the worker's
        # verdict, and then it is deleted.
        #
        # The bucket carries NO anonymous-read policy. That is the whole
        # point: a quarantine prefix inside the anonymous-read public bucket
        # would be world-readable the moment it was written, which is exactly
        # the state scanning exists to prevent.
        media.storage.private:
            adapter: 'asyncaws'
            options:
                client: 'media.s3_client'
                bucket: '%env(MEDIA_S3_BUCKET_PRIVATE)%'
                # Same environment folder as the public side, same reason.
                prefix: '%env(MEDIA_S3_PREFIX)%'

when@test:
    flysystem:
        storages:
            media.storage.eu:
                adapter: 'memory'
            media.storage.private:
                adapter: 'memory'
