# Rider photo storage (photo-uploads.md §2, media-storage-architecture.md §2.1).
#
# There are deliberately NO storages declared for dev/staging/prod: MediaStorage
# addresses buckets BY THE FULL NAME each row records, building an S3-backed
# filesystem on demand from media.s3_client (services.yaml). A bundle storage
# per bucket would have to be repointed or grown as generations advance, which
# is exactly the coupling the recorded-bucket-name model removes.
#
# when@test is the one exception: the suite preloads these two in-memory
# filesystems into MediaStorage under fixture bucket names, keeping tests
# hermetic; an unknown bucket name is then a refusal, which tests rely on.
flysystem:
    storages: []

when@test:
    flysystem:
        storages:
            media.storage.eu01:
                adapter: 'memory'
            media.storage.private:
                adapter: 'memory'
