# Frontend review 2026-07-12 W61: translation catalogs are contributor-editable
# (public repo), so rich copy rendered from them goes through this sanitizer —
# the |rich Twig filter — instead of a blanket |raw. The allowlist mirrors the
# markup the catalogs actually use (grep '<' translations/messages.en.yaml).
framework:
    html_sanitizer:
        sanitizers:
            app.rich_translations:
                allow_elements:
                    b: []
                    strong: []
                    i: []
                    em: []
                    code: []
                    br: []
                    span: ['class']
                    a: ['href', 'class', 'target', 'rel']
                allowed_link_schemes: ['http', 'https', 'mailto']
                allow_relative_links: true
                # `style` left the allowlist on 2026-08-09: the CSP ships
                # style-src 'unsafe-inline', so a hostile translation merged
                # into the public catalogs could inject overlay/phishing CSS
                # through it, and the sanitizer cannot filter style VALUES.
                # The two strings that used it (settings email_hint, the email
                # footer) colour their links from the surrounding template now.
