doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Exclude PostGIS extension schemas AND the pipeline-owned coverage_*
        # cache tables (coverage-provider.md §2: pipeline
        # DDL, never a Doctrine migration) from Doctrine's schema diff tool
        schema_filter: '~^(?!topology\.|coverage_)~'
        types:
            # AES-256-GCM at-rest encryption (key derived from APP_SECRET) for the TOTP secret
            encrypted_string: App\Doctrine\EncryptedStringType
            geometry: App\Catalog\Doctrine\GeometryType

    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            World:
                is_bundle: false
                dir: '%kernel.project_dir%/src/World/Entity'
                prefix: 'App\World\Entity'
                alias: World
            Catalog:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Entity'
                prefix: 'App\Catalog\Entity'
                alias: Catalog
            Provider:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Provider/Entity'
                prefix: 'App\Provider\Entity'
                alias: Provider
            Messaging:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Messaging/Entity'
                prefix: 'App\Messaging\Entity'
                alias: Messaging
            Moderation:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Moderation/Entity'
                prefix: 'App\Moderation\Entity'
                alias: Moderation
            Community:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Community/Entity'
                prefix: 'App\Community\Entity'
                alias: Community
            Media:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Media/Entity'
                prefix: 'App\Media\Entity'
                alias: Media
            Translation:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Translation/Entity'
                prefix: 'App\Translation\Entity'
                alias: Translation
            Support:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Support/Entity'
                prefix: 'App\Support\Entity'
                alias: Support
            Blog:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Blog/Entity'
                prefix: 'App\Blog\Entity'
                alias: Blog

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

# Staging is a deployed environment and must behave like prod. Symfony has no
# `when@prod|staging`, so the prod block above is mirrored deliberately. Without
# it staging regenerates proxies on every request and caches no query metadata.
when@staging:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
