doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Exclude PostGIS extension schemas from Doctrine's schema diff tool
        schema_filter: '~^(?!topology\.)~'
        types:
            # AES-256-GCM at-rest encryption (key derived from APP_SECRET) for the TOTP secret
            encrypted_string: App\Doctrine\EncryptedStringType
            geometry: App\Catalog\Doctrine\GeometryType

    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            World:
                is_bundle: false
                dir: '%kernel.project_dir%/src/World/Entity'
                prefix: 'App\World\Entity'
                alias: World
            Catalog:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Entity'
                prefix: 'App\Catalog\Entity'
                alias: Catalog
            Messaging:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Messaging/Entity'
                prefix: 'App\Messaging\Entity'
                alias: Messaging

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
