# Route-domain editorial config (route-domain.md §6) — thresholds are config,
# not constants (README threshold principle).
#
# These are DEFAULTS, not the live values: both keys are runtime-editable from
# the admin system-config page, and an override in `system_setting` wins
# (system-configuration.md §2). Edit here to move the default a fresh database
# starts from; edit in the admin to change what production is doing now.
parameters:
    route.region_active_cap: 30
    # Seasonal voting go-live dial (SettingsRegistry::COMMUNITY_VOTING_LIVE):
    # 0 hides every vote call-to-action; flipped at /admin/system-config when
    # ballots ship (vote-feature-deferred).
    community.voting_live: 0
    route.ride_verify_threshold: 3
