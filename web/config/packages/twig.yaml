twig:
    file_name_pattern: '*.twig'
    globals:
        # Injected into the map shell; empty disables street-level imagery (parity
        # with the config.js placeholder). Real value lives only in .env.local.
        mapillary_token: '%env(MAPILLARY_TOKEN)%'
        # The satellite base layer's key. Empty disables satellite and the map
        # falls back to the standard base — the layer has always been optional.
        esri_api_key: '%env(ESRI_API_KEY)%'
        # The road-surface line-tile artifact (its own pmtiles, separate from
        # coverage). Empty hides the Surfaces toggle entirely — a control for a
        # layer whose tiles do not exist is worse than no control.
        surface_tiles_url: '%env(SURFACE_TILES_URL)%'

when@test:
    twig:
        strict_variables: true
