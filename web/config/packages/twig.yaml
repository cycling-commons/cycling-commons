# SPDX-License-Identifier: AGPL-3.0-only
twig:
    file_name_pattern: '*.twig'
    globals:
        # Injected into the map shell; empty disables street-level imagery (parity
        # with the config.js placeholder). Real value lives only in .env.local.
        mapillary_token: '%env(MAPILLARY_TOKEN)%'
        # The satellite base layer's key. Empty disables satellite and the map
        # falls back to the standard base — the layer has always been optional.
        esri_api_key: '%env(ESRI_API_KEY)%'
        # The road-surface tile URLs are NOT globals: they come from
        # MapController via App\Coverage\SurfaceManifest, which resolves the
        # published build (or an operator's pin). A global reading the env
        # directly would be a second source for the same value, and the two
        # would drift the first time somebody published without editing config.

when@test:
    twig:
        strict_variables: true
