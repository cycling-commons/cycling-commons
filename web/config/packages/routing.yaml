framework:
    router:
        # Configure how to generate URLs in non-HTTP contexts, such as CLI commands.
        # See https://symfony.com/doc/current/routing.html#generating-urls-in-commands
        default_uri: '%env(DEFAULT_URI)%'

when@prod:
    framework:
        router:
            strict_requirements: null

# Staging is a deployed environment and must behave like prod. Symfony has no
# `when@prod|staging`, so every prod block below is mirrored deliberately.
when@staging:
    framework:
        router:
            strict_requirements: null
