#
# The async tier (media-storage-architecture.md; plan task 1). One bus, one
# transport on the app's own Postgres, a failure transport - and NO when@prod
# gating: the same env-driven single-path rule the storage layer follows, for
# the same reason (a prod block would need a duplicate staging twin to stay
# honest). The DSN is the difference between environments, not the wiring.
#
# Postgres, not a Redis stream (decided 2026-09-21). The message row commits
# in the same transaction as the upload row, so a rolled-back upload sends
# nothing and a queued message survives any restart; the Redis instances the
# deployment runs keep no append log, so a crash there lost every message
# since the last snapshot. Each worker takes a row with
# `SELECT ... FOR UPDATE SKIP LOCKED`, so two workers never receive the same
# message and there is no consumer name to configure. `redeliver_timeout` in
# the DSN must stay above the slowest handler, or a second worker takes a
# message the first is still on; 900 s is far above a photo scan.
#
# The retry strategy is for the SCANNER's failure mode: a clamd blip should
# not reject a rider's photo, so a handler error retries with a growing delay
# and only then lands on the failure transport, where messenger:failed:*
# commands can inspect and re-dispatch it. An infected verdict is NOT an
# error - the handler settles it in one pass. A message whose retries are
# exhausted is also reported to GlitchTip (config/packages/sentry.yaml).
framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 4
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Media\Message\ScanAndReleaseUpload: async
            App\Media\Message\FetchCommonsPhoto: async
            App\Media\Message\ResolveWikidataImage: async
            App\Town\Message\ResolveTownSummary: async

# The suite holds messages instead of running them, and that is the point: the
# flow under test is ASYNCHRONOUS, so a sync transport would make the one state
# the architecture exists to create - received, quarantined, nothing published -
# unobservable from a test. Hermetic either way, and no consumer is needed:
# tests drain the transport deliberately, which is also how they assert that a
# redelivered message changes nothing.
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
