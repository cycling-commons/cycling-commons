# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            - route-community
            - ride-check
            - elevation
            # /contribute/route road snap, the stateless sibling of 'elevation'.
            - route-snap
            - scout-tags
            - my-area
            - country-interest
            - curator-application
