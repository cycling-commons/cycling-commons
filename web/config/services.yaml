services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/World/Entity/'
            - '../src/World/Resources/'
            - '../src/Catalog/Entity/'

    _instanceof:
        App\Service\UserDeletionHookInterface:
            tags: ['app.user_deletion_hook']

    App\Service\UserDeletionService:
        arguments:
            $hooks: !tagged_iterator app.user_deletion_hook

    # The six editorial thresholds are no longer bound as constructor scalars:
    # their consumers take SettingsProviderInterface and read through it, so an
    # admin edit takes effect on the next request instead of needing a deploy
    # (system-configuration.md §3). The %parameters% they used to bind still
    # exist — SettingsRegistry reads them as the defaults, which is what keeps a
    # fresh database behaving exactly as this file used to make it behave.
    App\Settings\SettingsProviderInterface: '@App\Settings\SystemSettings'

    # The three coverage.* values stay bound scalars on purpose. They are
    # infrastructure — a feature flag, a bucket URL, a CSP host — and a web form
    # that rewrites a Content-Security-Policy host is an XSS-relaxation surface.
    # Changing these must keep needing deploy access (owner decision 2026-07-29).
    App\Coverage\CoverageManifest:
        arguments:
            $tilesEnabled: '%coverage.tiles_enabled%'
            $manifestUrl: '%coverage.manifest_url%'

    App\EventSubscriber\CspSubscriber:
        arguments:
            $coverageCspHost: '%coverage.csp_host%'

when@test:
    services:
        App\Community\CountryInterestService:
            public: true
            autowire: true
