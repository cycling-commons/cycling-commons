services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/World/Entity/'
            - '../src/World/Resources/'
            - '../src/Catalog/Entity/'

    _instanceof:
        App\Service\UserDeletionHookInterface:
            tags: ['app.user_deletion_hook']

    App\Service\UserDeletionService:
        arguments:
            $hooks: !tagged_iterator app.user_deletion_hook

    App\Moderation\RouteModerationService:
        arguments:
            $regionActiveCap: '%route.region_active_cap%'

    App\Moderation\RouteQueue:
        arguments:
            $regionActiveCap: '%route.region_active_cap%'

    App\Community\RouteCommunityService:
        arguments:
            $rideVerifyThreshold: '%route.ride_verify_threshold%'

    App\Moderation\RetentionService:
        arguments:
            $retentionMonths: '%moderation.retention_months%'

    App\Coverage\CoverageManifest:
        arguments:
            $tilesEnabled: '%coverage.tiles_enabled%'
            $manifestUrl: '%coverage.manifest_url%'

    App\EventSubscriber\CspSubscriber:
        arguments:
            $coverageCspHost: '%coverage.csp_host%'

    # Standalone derivation service (region-scoping-design.md §3); no consumer
    # wired yet (lands with BaseLocationService's settings-save re-derivation and
    # the map's set-my-area endpoint), so it must be public or Symfony's compiler
    # prunes it as unused before KernelTestCase can fetch it.
    App\Service\BaseAreaResolver:
        public: true
