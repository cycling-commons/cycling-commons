services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/World/Entity/'
            - '../src/World/Resources/'
            - '../src/Catalog/Entity/'
            - '../src/Translation/Entity/'

    _instanceof:
        App\Service\UserDeletionHookInterface:
            tags: ['app.user_deletion_hook']

    App\Service\UserDeletionService:
        arguments:
            $hooks: !tagged_iterator app.user_deletion_hook

    # The six editorial thresholds are no longer bound as constructor scalars:
    # their consumers take SettingsProviderInterface and read through it, so an
    # admin edit takes effect on the next request instead of needing a deploy
    # (system-configuration.md §3). The %parameters% they used to bind still
    # exist — SettingsRegistry reads them as the defaults, which is what keeps a
    # fresh database behaving exactly as this file used to make it behave.
    App\Settings\SettingsProviderInterface: '@App\Settings\SystemSettings'

    # The three coverage.* values stay bound scalars on purpose. They are
    # infrastructure — a feature flag, a bucket URL, a CSP host — and a web form
    # that rewrites a Content-Security-Policy host is an XSS-relaxation surface.
    # Changing these must keep needing deploy access (owner decision 2026-07-29).
    App\Coverage\CoverageManifest:
        arguments:
            $tilesEnabled: '%coverage.tiles_enabled%'
            $manifestUrl: '%coverage.manifest_url%'

    App\Coverage\SurfaceManifest:
        arguments:
            $manifestUrl: '%surface.manifest_url%'
            $pinnedClassifiedUrl: '%surface.tiles_url%'
            $pinnedTodoUrl: '%surface.todo_url%'
            $pinnedGapsUrl: '%surface.gaps_url%'

    App\Coverage\RoutesManifest:
        arguments:
            $manifestUrl: '%routes.manifest_url%'
            $pinnedTilesUrl: '%routes.tiles_url%'

    App\EventSubscriber\CspSubscriber:
        arguments:
            $coverageCspHost: '%coverage.csp_host%'
            $mediaCspHost: '%media.csp_host%'

    # Elevation for climb profiles. Points at Valhalla's /height, which reads
    # its rasters from additional_data.elevation at request time, so changing
    # dataset is a tile swap and a restart rather than a code change
    # (climb-elevation.md §2b-i). Unset ELEVATION_URL disables profiles
    # entirely: no elevation, no gradients, never a guess (§2d).
    App\Service\BuildVersion:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $envFallback: '%env(default::APP_BUILD_VERSION)%'

    # English catalogue projection for /translate search (translations.md §3.1).
    App\Translation\CatalogueSync:
        arguments:
            $englishYamlPath: '%kernel.project_dir%/translations/messages.en.yaml'

    # Overlay merge: YAML default, then per-locale DB overlays (translations.md §3).
    # Priority -10 puts OverlayTranslator outside DataCollectorTranslator in dev
    # (higher decoration_priority = innermost). WarmableInterface delegates warm-up inward.
    App\Translation\OverlayTranslator:
        decorates: translator
        decoration_priority: -10
        arguments:
            $inner: '@.inner'

    # /translate live display: YAML via decorator inner (no double overlay).
    App\Translation\CatalogueBrowser:
        arguments:
            $yamlTranslator: '@App\Translation\OverlayTranslator.inner'

    # Google Safe Browsing for rider-submitted links. Empty key = the layer is
    # OFF and every verdict is "unknown", which the two callers then treat in
    # OPPOSITE directions (fail open at submit, fail closed at render). See
    # App\Catalog\Links\SafeBrowsing.
    App\Catalog\Links\SafeBrowsing:
        arguments:
            $apiKey: '%env(SAFE_BROWSING_KEY)%'

    App\Elevation\ElevationClient:
        arguments:
            $valhallaUrl: '%env(ELEVATION_URL)%'
            $demSource: '%env(ELEVATION_DEM_SOURCE)%'
            $endpoints: '@App\Elevation\ElevationEndpoints'

    # Same Valhalla, same master switch, same per-continent selection — the
    # climb editor's road snapping (replaced the OSRM demo server, whose policy
    # forbids production reliance; external-systems audit 2026-08-09).
    App\Elevation\RouteSnapper:
        arguments:
            $valhallaUrl: '%env(ELEVATION_URL)%'
            $endpoints: '@App\Elevation\ElevationEndpoints'

    # One Valhalla per continent, each serving only the .hgt tiles it holds, so
    # a climb outside Europe has to be asked of the instance that has its ground
    # (climb-elevation.md §2b-i). ELEVATION_URL remains both the default and the
    # master switch; ELEVATION_URLS unset means single-instance behaviour.
    App\Elevation\ElevationEndpoints:
        arguments:
            $defaultUrl: '%env(ELEVATION_URL)%'
            $map: '%env(ELEVATION_URLS)%'

    # S3 client shared by every continent's storage: one set of credentials, one
    # endpoint, many buckets (photo-uploads.md §2). Dev points it at the dev
    # stack's MinIO, production at the Cycling Commons buckets — the signing
    # region is ignored by MinIO and accepted by Hetzner, which is what lets one
    # code path serve both (see pipeline/coverage/publish.py).
    media.s3_client:
        class: AsyncAws\S3\S3Client
        arguments:
            - endpoint: '%env(MEDIA_S3_ENDPOINT)%'
              region: '%env(MEDIA_S3_REGION)%'
              accessKeyId: '%env(MEDIA_S3_KEY)%'
              accessKeySecret: '%env(MEDIA_S3_SECRET)%'
              pathStyleEndpoint: true

    # Where each CONTINENT's new photos go (media-storage-architecture.md
    # §2.1): one env var per continent, the FULL bucket name, used verbatim
    # for writes and stored verbatim on the row - retired buckets need no
    # entry here to stay addressable, storage builds a filesystem for any
    # recorded name on demand. The name's last five characters (-eu-01) are
    # the public URL segment, so advancing a continent = bump its var + add
    # the nginx location for the new segment; nothing here changes shape.
    App\Media\MediaStorage:
        arguments:
            $client: '@media.s3_client'
            $activeBuckets:
                AF: '%env(MEDIA_S3_PUBLIC_BUCKET_AF)%'
                AS: '%env(MEDIA_S3_PUBLIC_BUCKET_AS)%'
                EU: '%env(MEDIA_S3_PUBLIC_BUCKET_EU)%'
                NA: '%env(MEDIA_S3_PUBLIC_BUCKET_NA)%'
                OC: '%env(MEDIA_S3_PUBLIC_BUCKET_OC)%'
                SA: '%env(MEDIA_S3_PUBLIC_BUCKET_SA)%'
            $privateBucket: '%env(MEDIA_S3_PRIVATE_BUCKET)%'
            $publicBase: '%media.public_base%'

    # The release gate's scanner (media plan task 3). CLAMAV_REQUIRED decides
    # what "no scanner" means: true throws (every real environment - it sits
    # on the deploy checklist beside APP_SECRET), false answers a logged
    # skipped-verdict so contributor stacks without ClamAV still upload.
    App\Media\Scan\VirusScannerInterface: '@App\Media\Scan\ClamAvScanner'
    App\Media\Scan\ClamAvScanner:
        arguments:
            $tcpAddr: '%env(CLAMAV_TCP_ADDR)%'
            $required: '%env(bool:CLAMAV_REQUIRED)%'

when@test:
    services:
        # Fetched directly by the link-verdict tests.
        App\Catalog\Links\LinkVerdictStore:
            public: true
            autowire: true

        # A scanner the suite can steer, over the real one
        # (media-storage-architecture.md §3.1). It lives HERE and not in
        # config/packages/test/services.yaml because this file is loaded last:
        # the binding above would win over anything a package file said.
        App\Tests\Media\FakeScanner:
            public: true
        App\Media\Scan\VirusScannerInterface: '@App\Tests\Media\FakeScanner'

        # Fetched directly by the media tests. Repeated in full rather than
        # patched with `public: true`, because a second definition of the same
        # id REPLACES the first — it does not merge into it.
        App\Media\MediaStorage:
            public: true
            arguments:
                # LITERALS, not %env()%: real environment variables beat every
                # .env* file, so inside the dev container the compose-provided
                # values would silently replace .env.test's fixtures. No S3
                # client either: only the preloaded in-memory buckets exist,
                # and an unknown bucket name is a refusal, which the suite
                # relies on.
                $client: null
                $activeBuckets:
                    EU: 'test-bucket-eu-01'
                $privateBucket: 'test-bucket-private'
                $publicBase: 'https://media.test/img'
                $filesystems:
                    'test-bucket-eu-01': '@media.storage.eu01'
                    'test-bucket-private': '@media.storage.private'

        App\Media\ContinentResolver:
            public: true
            autowire: true

        # Fetched directly by the Commons photo-cache tests
        # (coverage-provider.md §7).
        App\Media\Commons\CommonsPhotoRepository:
            public: true
            autowire: true
        App\Media\Commons\WikidataImageRepository:
            public: true
            autowire: true

        App\Community\CountryInterestService:
            public: true
            autowire: true

        App\Community\CuratorApplicationService:
            public: true
            autowire: true

        # Fetched directly by ProposalServiceTest (and used by TranslateController).
        App\Translation\ProposalService:
            public: true
            autowire: true
