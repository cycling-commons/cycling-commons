# Known issues seeded from the backlog (docs/TODO.md), so the public list at
# /known-issues says the same thing in every environment. Each entry becomes
# a public bug report once; the seed command skips a public title it already
# finds, so a curator's later edits on the desk survive a re-run.
#
# severity: critical | major | minor | cosmetic
# area: map | search | contributing | photos | routes | account | regions | translations | pages | unsure
# status: new | planned | in_progress | needs_testing | resolved
# steps (optional): how to test it, shown to curators on the bug page
#
# Filed 2026-09-06 (owner: "update the buglist with things from the todo").
issues:
  - public_title: 'Surfaces view: a road without a surface tag draws nothing'
    severity: major
    area: map
    status: resolved
    body: |
      In the Surfaces view a classified road that OpenStreetMap carries no surface tag for was drawn as nothing at all, so a stretch of ordinary tarmac could look like a gap in the road.
      Fixed: an untagged road is its own class now and draws as red dashes, meaning "nobody has recorded this yet". A blank is a blank again.
  - public_title: 'Three Belgian climbs have unconfirmed start and end points'
    severity: minor
    area: map
    status: resolved
    body: |
      Côte de la Redoute, Mur de Huy and Côte de Stockeu were drawn from a first pass, and their foot and summit had not been checked against a reference.
      Fixed: all three were checked on 2026-09-14 against published climb profiles, and foot height, summit height, length and climb agree. Côte de la Redoute measures 2.0 km with 180 m of climbing, Côte de Stockeu 2.3 km with 226 m, and Mur de Huy 1.4 km at 9.7% with 135 m.
      Mur de Huy's line also cut the corners of the road, because it was stored with too few points. It now follows the road.
  - public_title: 'Susten Pass shows a 10% descent inside the climb'
    severity: minor
    area: map
    status: new
    body: |
      One segment of the Susten Pass reads as a 10% descent on a 28 km climb. That is plausible on a pass, but it has not been checked against the elevation source for that stretch. Listed here so nobody reports it twice.
  - public_title: 'Some places are filed under the wrong country, or shown as a single pin'
    severity: minor
    area: regions
    status: new
    body: |
      The Matterhorn is filed under Switzerland but its summit point lies in Italy. Sixteen large areas, Yosemite National Park among them, are shown as one pin at their centre rather than as an outline.
  - public_title: 'The Spanish site has had one pass by one translator'
    severity: minor
    area: translations
    status: planned
    body: |
      The Spanish text was written in one pass in August 2026 and has not yet been read by a native speaker. If a phrase reads oddly, Translate mode on any page lets you propose a better one.
  - public_title: 'Country and region pickers are not yet checked for keyboard use'
    severity: minor
    area: pages
    status: new
    body: |
      The country and region pickers on Regions and Get involved have not been tested with a keyboard alone. If Tab and Enter do not get you through them, that is this issue.
  # Filed 2026-09-08 (owner: "what part of the site is not including the API,
  # add those to the bug list and look for other missing base elements").
  - public_title: 'The public API answers two of the twelve endpoints in its contract'
    severity: minor
    area: pages
    status: planned
    body: |
      The contract at /developers/api describes twelve endpoints. Two answer today: /v1/map-config and /v1/search. The other ten do not exist yet: the item-type catalogue, one item by id, coverage counts, regions and their best-of, the route list, one route and its GPX under /v1, and the write path for contributions.
      A GPX still downloads from /routes/{id}.gpx, outside the versioned API.
      The reference page now says how far along this is, counted rather than claimed, so the number here cannot go stale.
  - public_title: 'The API reference says the API is not live, and lives outside the site'
    severity: cosmetic
    area: pages
    status: in_progress
    body: |
      The banner on /developers/api read "Draft contract, API not live yet" while two endpoints answered.
      Fixed: it now reads how many of the contract's endpoints answer, counted from the contract and the router rather than written by hand, so shipping an endpoint updates it. The page is also in the sitemap now.
      Still open: the page is English only and sits outside the site chrome.
  - public_title: 'The sitemap leaves out the blog, its posts, the map key, the API reference and the vote page'
    severity: minor
    area: pages
    status: resolved
    body: |
      /sitemap.xml listed the fixed pages and every region, but not the blog index, the blog posts, the map key, the API reference or the vote page. A search engine found them only by following links.
      Fixed: the blog index, the map key, the API reference and every published blog post are listed. A post appears only under the languages that actually serve it, so a Dutch-only post is not promised in four languages that answer 404 for it.
      The vote page is left out on purpose. It is behind a sign-in, so listing it would send a search engine to a login screen and nothing else. What is actually missing is a public page showing what riders have voted for, which is a page to build rather than a line to add here.
  - public_title: 'There is no public page showing what riders voted best in a region'
    severity: minor
    area: pages
    status: in_progress
    body: |
      The seasonal ranking is public data already: the map's Curated mode reads it, and anyone can fetch it. But it has no page of its own. A reader who has not signed in cannot see what riders rate best anywhere, and a search engine cannot find it at all.
      The only vote page today is behind a sign-in and says voting is not live yet, which is a preview of the ballot rather than a view of the result.
      A public design preview now exists at /best, with real places and invented tallies, so the shape can be argued about before the ballot is built. It is not in the sitemap and will not be while the numbers are made up.
  - public_title: 'A town card shows no population when Wikidata has no recent count'
    severity: minor
    area: map
    status: resolved
    body: |
      The town card read its two facts from Wikidata alone, and a count older than 25 years, or undated, is not shown. A survey of 100 places across ten countries found Wikidata could answer only 66% of them, and under half of all villages.
      Fixed: when Wikidata has no count, the figure is read from the Wikipedia article the card already shows. That takes it to 89% of places and 82% of villages. Wikidata still wins whenever it has a recent count, because mixing the two can put a district's population on a village card.
      Still true for some places: eight of the hundred surveyed have no population in any source, and the founding date is missing for most towns because Wikidata has none.
  - public_title: 'A town card does not list the routes that pass through the town'
    severity: minor
    area: map
    status: resolved
    body: |
      The card listed the races Wikidata ties to a town, but not the routes that pass through it: the Westfriese Omringdijk for Hoorn, the Great Divide for Banff. Those live in the map's own routes layer and need geometry, not Wikidata.
      Fixed: the card now lists the recommended routes passing within a kilometre of the town, nearest first, each opening on the map.
  # Filed 2026-09-15 (owner: "add the issues to the known issue tickets with a
  # good description how to test also").
  - public_title: 'The "+ add" links on a route open a page with no route fields'
    severity: minor
    area: routes
    status: new
    body: |
      In a recommended route's drawer, the "+ add" links beside empty details (quietness, scenic rating, best direction and others) open the general improve page, which has no fields for a route. Routes can only be proposed, and have photos added, through the route form.
    steps: |
      1. Open a recommended route with empty details, for example /map?route=24.
      2. In the drawer, click "+ add" beside "Quietness rating".
      3. Expected: a form to fill in that detail. Seen: the general improve page, with no route fields.
  - public_title: 'A photo still being scanned is left out when a curator saves their own change'
    severity: minor
    area: photos
    status: new
    body: |
      A curator's own edit to a place, or their own photo on a live route, applies at once. A photo that is still in the virus scan at that moment is not attached, and stays waiting with no decision left that would attach it. The same happens for places and routes.
    steps: |
      1. Sign in as a curator.
      2. Open an existing place on /improve (or a live route on /propose-route?route=<id>) and add a large photo.
      3. Submit straight away, while the photo still shows it is being checked.
      4. Expected: the photo appears on the place once the scan ends. Seen: the change is saved, but the photo never shows and stays pending.
  - public_title: 'In the ride check list, hovering a climb rings the wrong spot'
    severity: minor
    area: map
    status: new
    body: |
      Hovering a climb row in the ride check ("along your ride") rings the climb's stored point, not its foot where the pin stands. For climbs whose stored point is not at the foot, such as Mont-le-Soie (about 3 km away), the ring lands next to nothing. The route drawer's climbs list rings the foot correctly.
    steps: |
      1. Sign in and load a GPX that rides Mont-le-Soie in the ride check.
      2. In the results, hover the Mont-le-Soie row.
      3. Expected: the ring sits on the climb's pin at its foot. Seen: the ring sits about 3 km away.
  - public_title: 'On an out-and-back route a climb can be missed in "Climbs on this route"'
    severity: minor
    area: routes
    status: new
    body: |
      A climb counts on a route only when the route rides it foot to summit. When a route goes up and comes back down the same road, the direction check sees both passes on the same stretch and can read the ascent as a descent, so the climb is left out.
    steps: |
      1. Take or propose a route that climbs a listed climb and returns down the same road.
      2. Open the route on the map and read "Climbs on this route".
      3. Expected: the climb is listed at the km where the route starts up it. Seen: it may be missing.
  - public_title: 'A route that crosses a border opens scoped to one country'
    severity: minor
    area: routes
    status: new
    body: |
      Opening a route from a link sets the map's scope to the country of the route's first point. A route that crosses into another country is then partly outside the scope, so places along that part are hidden.
    steps: |
      1. Open a route that starts in Belgium and crosses into Luxembourg or Germany, for example Liège-Bastogne-Liège via /map?route=<id>.
      2. Pan along the route past the border.
      3. Expected: the scope covers every country the route crosses. Seen: places on the far side of the border are hidden.
  - public_title: 'Liège-Bastogne-Liège rides Mont-le-Soie and Forges downhill in its track'
    severity: minor
    area: routes
    status: new
    body: |
      "Climbs on this route" for the proposed Liège-Bastogne-Liège route leaves out Côte de Mont-le-Soie and Côte de Forges, because the route's track rides both from summit to foot. The race climbs them. Either the GPX has a wrong turn there or the climb lines run the wrong way; worth checking both before the route is approved.
    steps: |
      1. As a curator, open /map?route=111.
      2. Read "Climbs on this route" and compare with the race's list of côtes.
      3. Open Côte de Mont-le-Soie and Côte de Forges and compare their foot and summit with the route's direction of travel.
