#
# Test-env service overrides. Imported after config/services.yaml (see
# MicroKernelTrait::configureContainer), so definitions here win over the
# `App\` autowiring prototype.
services:
    # RouteProposalService has no src consumer yet (Task 6 wires the controller),
    # so RemoveUnusedDefinitionsPass — a mark-and-sweep reachable only from public
    # roots — prunes it, and with it RegionResolver (whose sole consumer is this
    # service). Re-declare the intake service public (still autowired) in the test
    # env only, so KernelTestCase can fetch it directly; that public root also
    # keeps RegionResolver reachable, so RegionResolverTest resolves it too.
    App\Contribution\RouteProposalService:
        autowire: true
        public: true
