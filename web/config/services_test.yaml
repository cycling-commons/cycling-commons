#
# Test-env service overrides. Imported after config/services.yaml (see
# MicroKernelTrait::configureContainer), so definitions here win over the
# `App\` autowiring prototype.
services:
    # Public only in test: no controller wires MessageService in yet (its
    # callers land in Tasks 3-9), so the container's unused-service removal
    # would otherwise inline/drop it before MessageServiceTest can fetch it.
    App\Messaging\MessageService:
        autowire: true
        autoconfigure: true
        public: true
