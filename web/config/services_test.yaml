#
# Test-environment service overrides — loaded after config/services.yaml so
# these definitions win over the App\: resource glob.
#
# Why AdminActionLogger needs this: it has no compile-time consumers in the
# DI graph, so RemoveUnusedDefinitionsPass removes it before
# TestServiceContainerRealRefPass can wire it into test.private_services_locator.
# Making it public prevents that removal and keeps it accessible via
# KernelTestCase::getContainer()->get().
services:
    App\Service\AdminActionLogger:
        public: true
        autowire: true
        autoconfigure: true

    App\Service\UserAdminService:
        public: true
        autowire: true
        autoconfigure: true
