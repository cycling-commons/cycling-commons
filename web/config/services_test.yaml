#
# Test-only overrides, imported after config/services.yaml (env-suffixed
# import in MicroKernelTrait::configureContainer) so these win over the
# App\ prototype-loaded defaults.
services:
    # CatalogProvider has no consumer yet — Task 3 wires it into MapController.
    # Until then it is a genuinely unused private service, so Symfony's
    # RemoveUnusedDefinitionsPass prunes it from the compiled container even
    # under framework.test: true (that flag only preserves services reachable
    # by at least one real reference). Making it public here lets the test
    # suite fetch it directly; drop this override once Task 3 lands.
    App\Catalog\CatalogProvider:
        autowire: true
        public: true
