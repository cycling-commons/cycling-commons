regions:
  # Region labels are the strings this tool exists to draft, and 74 keys in
  # every real catalogue carry a hyphen. Both shapes sit here so the walker's
  # indentation stack is exercised by a hyphenated parent AND by the ordinary
  # one that follows it: before the key pattern admitted a hyphen, this
  # section's `label:` lines all resolved to the phantom path `regions.label`
  # and every real key here was refused as "does not exist".
