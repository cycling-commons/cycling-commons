# SPDX-License-Identifier: AGPL-3.0-only
#
# Machine-readable companion to docs/specs/public-api.md. That document owns
# the rationale (transports, auth model, reference-only policy, versioning);
# this file pins the concrete request/response shapes and is what the
# /developers/api reference page renders. Keep the two in sync: endpoint- or
# field-level changes land in both. tests/Api/ContractTest.php asks every
# path here and fails on one that does not answer.
openapi: 3.1.0

info:
  title: Cycling Commons Public API
  version: 1.0.0
  summary: The public API of the Cycling Commons, open cycling data under the ODbL.
  description: |
    The API exposes the **Commons layer only**: community and curated cycling
    knowledge (water points, bike services, places to sleep, climbs, hazards,
    routes, region coverage). The account layer (emails, IP logs, moderation
    internals) is never reachable through any endpoint or tile, and neither
    is text a person wrote: a rider's notes stay on the site.

    ## Access

    Every read is open: no key, `Access-Control-Allow-Origin: *`, at most
    120 requests a minute from one address (a `429` with `Retry-After`
    beyond that). Responses are public and cacheable, with an `ETag`. Keys
    and monthly quotas for reads are planned, not built: nothing here asks
    for one yet.

    Writes are for **registered partner apps** only: `POST
    /v1/contributions` and the two calls beside it need a partner key in
    `Authorization: Bearer <key>`. A partner key belongs on a server, never
    in a browser, so the write calls answer no cross-origin request.

    ## Reference-only responses

    Item responses are **reference-only by default**: our added fields plus
    the `osm_ref` needed to hydrate detail from OpenStreetMap directly. We do
    not republish OpenStreetMap's tags as ours. `?hydrate=osm` merges the
    cached OpenStreetMap subset we hold into the response as a convenience;
    every response carries `© OpenStreetMap contributors`.

    ## Vector tiles (not REST)

    Dense ambient layers travel as **data-only vector tiles**, not through
    these endpoints: per-country PMTiles archives read by HTTP byte-range.
    `/v1/map-config` names the current archives and their source-layers;
    bind them into your own MapLibre style. See docs/specs/public-api.md §2.1.

    ## Paging

    Collections page by an opaque `cursor`: pass the previous page's
    `next_cursor`, which is absent on the last page. A cursor starts after
    the last row it saw, so rows added meanwhile are neither repeated nor
    skipped.

    ## Bulk export

    For bulk or offline use, take the free **weekly bulk export** and
    self-host it instead of crawling the live API; scraping the service is
    prohibited. The Commons catalogue, as gzip-compressed GeoJSON with a
    manifest of sources, licences and sha256 checksums, at
    https://cyclingcommons.org/developers/export (the newest files always at
    `/developers/export/latest/places`, `/developers/export/latest/routes` and
    `/developers/export/latest/manifest`). The export is always free and
    open (ODbL).
  contact:
    name: Cycling Commons
    email: info@cyclingcommons.org
    url: https://cyclingcommons.org/developers
  license:
    name: Data licensed ODbL 1.0 (photos under the licence named with each photo)
    url: https://opendatacommons.org/licenses/odbl/1-0/

servers:
  - url: https://api.cyclingcommons.org
    description: The API origin.
  - url: https://cyclingcommons.org
    description: The main site answers the same /v1 paths.

# Reads are open; the write calls name their own requirement.
security: []

tags:
  - name: Catalog
    description: What each catalogue letter is, its kinds and its fields, and the map bootstrap.
  - name: Items
    description: Search, one item, and counts in an area (reference-only by default).
  - name: Regions
    description: The regions, what they hold, and their best-of lists.
  - name: Routes
    description: Recommended routes with their whole line, and as GPX.
  - name: Contributions
    description: |
      The write path, for registered partner apps. A contribution enters the
      same review queue as one from the site's own form, under the same
      rules; a curator decides. The app's user needs no Cycling Commons
      account: the app sends an opaque, stable reference for its author, and
      optionally the name the author chose to share. Partner apps are
      registered under a partner agreement; write to info@cyclingcommons.org.

paths:
  /v1/map-config:
    get:
      tags: [Catalog]
      operationId: getMapConfig
      summary: Map bootstrap for external consumers
      description: >
        Everything an external map needs to wire the Commons overlays in one
        call: the routes PMTiles archives, one per country (empty when none
        is published, then skip the routes overlay), the per-country
        source-layer naming contract, the route style groups, the coverage
        (raw OpenStreetMap) PMTiles archives, one per country, with their
        per-letter source-layer contract, the category table (practical
        letters A-M and experiential N-Z, with colours, glyphs and the Best
        of flag), and the attribution string the consumer must display.
        Cacheable for an hour; the tile URLs change when a new build is
        published, which is why consumers read them here instead of
        hardcoding them.
      responses:
        '200':
          description: The bootstrap payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapConfig'
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Item-type catalogue
      description: >
        Every catalogue letter (practical A-M, experiential N-Z): its slug,
        name, geometry, the kinds a place of that letter can be, and every
        field of its form, with the values a pick list allows, whether
        `/v1/items/{id}` serves it (`served`) and whether
        `/v1/contributions` takes it (`accepted`). The same form the site's
        own wizard renders, so a partner app offers its users the same
        choices a rider gets. English labels. Cacheable for an hour.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/search:
    get:
      tags: [Items]
      operationId: searchItems
      summary: Search and browse items
      description: >
        Items by bounding box, by name, or both, filtered by catalogue letter
        and tier. Returns a GeoJSON `FeatureCollection` of reference-only
        features. At least one of `bbox` or `q` is required; `bbox` spans at
        most 10x10 degrees (`bbox_too_large`).


        Recommended routes (letter R) come only when asked for:
        `routes=include` adds them, `letter=R` gives routes alone. A route
        hit is one point on the route, with its length and climb; its line
        is at `/v1/routes/{id}`.


        A browse (no `q`) pages with `cursor`: items by id first, then
        routes. A name search answers its best matches in one page and takes
        no cursor (`invalid_cursor`). The Commons map's own worldwide search
        asks this endpoint with `q`.
      parameters:
        - $ref: '#/components/parameters/bbox'
        - name: q
          in: query
          description: >
            Words in the item's name, anywhere in the world (`invalid_q`
            outside 3 to 100 characters). Case and accents do not matter.
            Names that start with the words come first, then the closest
            matches. With `bbox`, only matches inside the box.
          schema: { type: string, minLength: 3, maxLength: 100 }
          example: spa
        - $ref: '#/components/parameters/letter'
        - $ref: '#/components/parameters/tier'
        - name: routes
          in: query
          description: >
            `include` adds recommended routes (letter R) to the hits;
            absent keeps them out (`invalid_routes` for anything else).
          schema: { type: string, enum: [include] }
        - $ref: '#/components/parameters/hydrate'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Matching features. Cacheable for five minutes.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/SearchCollection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/items/{id}:
    get:
      tags: [Items]
      operationId: getItem
      summary: One item
      description: >
        One item in full: the search feature's properties, then where it
        comes from (`source`, `osm_ref`), its kind, the attributes picked
        from a list or measured (never free text a person wrote), and its
        photos, each with its licence and credit. `?hydrate=osm` merges the
        cached OpenStreetMap subset in under `osm`. An item that is not
        served (waiting for review, rejected, retired, reported gone) is a
        404 like one that never existed.
      parameters:
        - name: id
          in: path
          required: true
          description: Commons item id (the `id` property of a search feature).
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/hydrate'
      responses:
        '200':
          description: The item. Cacheable for five minutes.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/coverage/counts:
    get:
      tags: [Items]
      operationId: getCoverageCounts
      summary: Per-letter counts in an area
      description: >
        Per-letter counts in a box, for chips and summaries: `counts` are the
        items `/v1/search` serves there (and `R`, the recommended routes that
        cross it); `coverage` are the OpenStreetMap points the coverage tiles
        draw there that no item stands for. Never added together: the two
        are different kinds of knowledge. The box spans at most 2x2 degrees,
        because the coverage count reads every point in it.
      parameters:
        - $ref: '#/components/parameters/bboxRequired'
      responses:
        '200':
          description: Counts keyed by catalogue letter. Cacheable for five minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counts'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/regions:
    get:
      tags: [Regions]
      operationId: listRegions
      summary: All regions
      description: >
        The regions the site lists on /regions, by slug, each drawn by its
        coarse outline (a few hundred points; one region's own call has the
        detailed boundary) with its `bbox` and what it holds.
      parameters:
        - name: country
          in: query
          description: Only this country's regions (ISO 3166-1 alpha-2, `invalid_country` otherwise).
          schema: { type: string, pattern: '^[A-Za-z]{2}$' }
          example: BE
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Region features. Cacheable for an hour.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/RegionCollection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/regions/{id}:
    get:
      tags: [Regions]
      operationId: getRegion
      summary: One region
      description: >
        One region, drawn by its boundary simplified to about 100 m (the
        shape the map draws), with its counts per letter.
      parameters:
        - $ref: '#/components/parameters/regionId'
      responses:
        '200':
          description: The region. Cacheable for an hour.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/RegionFeature'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/regions/{id}/best:
    get:
      tags: [Regions]
      operationId: getRegionBest
      summary: The region's best-of lists
      description: >
        What riders voted best in the region, one list per votable category
        (climbs, places to sleep, scenic views, history and culture,
        recommended routes), for the season under way. Each list comes from
        a ballot that has closed: riders voted in the season before. A list
        with too few voters to rank (`ranked: false`) has no entries; it is
        not dressed up as a ranking. While community voting is not open
        (`voting: false`) there are no lists at all. Entries are places, not
        tallies: their place in the list and the points the closed round
        gave them. An entry's `id` is a route (`/v1/routes/{id}`) for letter
        R and an item (`/v1/items/{id}`) for every other letter.
      parameters:
        - $ref: '#/components/parameters/regionId'
      responses:
        '200':
          description: The lists. Cacheable for an hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestOf'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/routes:
    get:
      tags: [Routes]
      operationId: listRoutes
      summary: Routes in an area
      description: >
        The recommended routes that cross a box (at most 10x10 degrees),
        each with its whole line, by id.
      parameters:
        - $ref: '#/components/parameters/bboxRequired'
        - $ref: '#/components/parameters/tier'
        - name: limit
          in: query
          description: Page size; a whole line weighs more than a point, so the cap is lower than search's.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Route features (LineString geometry). Cacheable for five minutes.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/RouteCollection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/routes/{id}:
    get:
      tags: [Routes]
      operationId: getRoute
      summary: One route
      description: >
        One route in full: the list's properties, then a curator's ratings,
        the measured surface mix, the elevation profile, its photos and the
        GPX link.
      parameters:
        - $ref: '#/components/parameters/routeId'
      responses:
        '200':
          description: The route. Cacheable for five minutes.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/routes/{id}.gpx:
    get:
      tags: [Routes]
      operationId: getRouteGpx
      summary: Route as GPX
      description: The route's track as a GPX 1.1 file to download, the same file the site offers.
      parameters:
        - $ref: '#/components/parameters/routeId'
      responses:
        '200':
          description: The route as a GPX 1.1 document. Cacheable for an hour.
          content:
            application/gpx+xml:
              schema:
                type: string
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/contributions:
    post:
      tags: [Contributions]
      operationId: createContribution
      summary: Contribute a place or an edit
      description: >
        Opens a submission exactly as the site's own form does: it enters
        the review queue, a curator decides, and the same rules apply. A new
        place needs `letter`, `name` and `geometry`; one taken from an
        OpenStreetMap object also names `osm_ref`. An edit names `item_id`
        (a served item, or the same author's own new place still waiting for
        review, to revise it or answer a curator's question) and sends only
        what changes: `fields`, a new `name`,
        or a moved `geometry`; `null` clears a field. Letters and fields are
        those `/v1/catalog` marks `contributions` and `accepted`. A second
        edit by the same author to the same item, while the first still
        waits, amends it rather than queueing a twin. No photos yet.


        Limits: 600 contributions an hour per app, and 20 an hour per
        author, the same as a rider on the site.
      security:
        - partnerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributionRequest'
      responses:
        '202':
          description: >
            Accepted into the review queue. A new place's `item_id` answers
            at `/v1/items/{id}` once a curator approves it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/contributions/{id}:
    get:
      tags: [Contributions]
      operationId: getContribution
      summary: Where a contribution stands
      description: >
        One of this app's contributions: waiting, approved, or turned down,
        with what the curator wrote to its author, for the app to pass on.
        Another app's contribution is a 404 like one that never existed.
      security:
        - partnerKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: The `submission_id` the contribution was accepted with.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The contribution's state. Not cached by shared caches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/authors/{ref}:
    delete:
      tags: [Contributions]
      operationId: forgetAuthor
      summary: An author deleted their account
      description: >
        Relay that one of your users deleted their account with you. The
        name they shared is removed from every contribution they sent
        through your app, so wherever it was shown it now reads anonymous.
        The reference itself stays: it identifies nobody but to you. The
        answer is the same whether or not the reference ever sent anything.
      security:
        - partnerKey: []
      parameters:
        - name: ref
          in: path
          required: true
          description: The author's reference, as sent in `author.ref`.
          schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
      responses:
        '204':
          description: Done.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    partnerKey:
      type: http
      scheme: bearer
      description: >
        A registered partner app's key, sent as `Authorization: Bearer
        <key>`. Issued under a partner agreement; never send it from a
        browser, and never as a query parameter.

  parameters:
    bbox:
      name: bbox
      in: query
      description: 'Bounding box: `minLon,minLat,maxLon,maxLat` (WGS84).'
      schema: { type: string }
      example: '5.6,50.3,6.1,50.6'
    bboxRequired:
      name: bbox
      in: query
      required: true
      description: 'Bounding box: `minLon,minLat,maxLon,maxLat` (WGS84).'
      schema: { type: string }
      example: '5.6,50.3,6.1,50.6'
    letter:
      name: letter
      in: query
      description: Catalogue letter (see `/v1/catalog`). Practical categories use A-M, experiential categories N-Z.
      schema:
        type: string
        pattern: '^[A-Z]$'
      example: B
    tier:
      name: tier
      in: query
      description: Restrict to a tier (`invalid_tier` otherwise).
      schema:
        $ref: '#/components/schemas/Tier'
    hydrate:
      name: hydrate
      in: query
      description: >
        `osm` merges the cached OpenStreetMap subset we hold into each item
        feature's `properties.osm` (null when we hold none). Responses stay
        `© OpenStreetMap contributors`-attributed either way.
      schema:
        type: string
        enum: [osm]
    limit:
      name: limit
      in: query
      description: Page size cap.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    cursor:
      name: cursor
      in: query
      description: The opaque `next_cursor` of the previous page (`invalid_cursor` otherwise).
      schema: { type: string }
    regionId:
      name: id
      in: path
      required: true
      description: Region slug (the `region_id` of items and routes).
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      example: wallonia
    routeId:
      name: id
      in: path
      required: true
      description: Route id.
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Malformed parameters or body; `error` says which.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No partner key, an unknown one, or a suspended app.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The key may not do this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Over the limit; `Retry-After` says when to try again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code.
          example: invalid_bbox
        message:
          type: string
          example: bbox must be minLon,minLat,maxLon,maxLat
        field:
          type: [string, 'null']
          description: Only on `invalid_contribution`, the field the review intake refused, when it names one.

    Tier:
      type: string
      enum: [community, curated]
      description: >
        `community` is contributed knowledge; `curated` is verified, by
        enough riders or by a curator.

    Grade:
      type: string
      enum: [claimed, attested, minimum, high]
      description: >
        The coarse trust grade, derived from the evidence ladder
        (data-provider-hierarchy.md §6.7.7): `claimed` = somebody typed it
        and nothing dates it; `attested` = a live source republished it,
        or a dated witness is on record; `minimum` = verified, by the
        threshold of riders or by a curator; `high` = verified and five or
        more riders stood here. Derived, so the formula may move; the
        receipt fields beside it are raw and never do.
    Custody:
      type: string
      enum: [gross, specialty, ours]
      description: >
        Who keeps the record: `gross` = a general provider such as
        OpenStreetMap, `specialty` = a provider registered for this kind of
        place in this region, `ours` = this community. Says nothing about
        quality.

    Point:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          description: '[lon, lat] (WGS84)'

    OsmSubset:
      type: [object, 'null']
      description: >
        Only with `?hydrate=osm`: the OpenStreetMap object we hold for the
        item, with the tags the map shows, or null when we hold none.
      properties:
        ref: { type: string, example: node/4207030426 }
        name: { type: [string, 'null'] }
        tags:
          type: object
          additionalProperties: { type: string }
          example: { amenity: drinking_water, wheelchair: 'yes' }

    ItemProperties:
      type: object
      description: >
        A closed list, in this order; no other key appears. The trust
        envelope (`grade` to `verified_by`) is computed by the same code
        that colours a pin on the map, so the two never disagree.
      required: [id, letter, name, tier, grade, custody, confirmations, last_confirmed, last_seen_upstream, verified_by, region_id]
      properties:
        id: { type: integer, example: 4512 }
        letter: { type: string, example: B }
        name: { type: string, example: 'Fountain · Spa' }
        tier: { $ref: '#/components/schemas/Tier' }
        grade: { $ref: '#/components/schemas/Grade' }
        custody: { $ref: '#/components/schemas/Custody' }
        confirmations:
          type: integer
          minimum: 0
          description: How many riders have stood here and vouched for it, one per rider.
          example: 2
        last_confirmed:
          type: [string, 'null']
          format: date
          description: The day of the newest rider confirmation, or null.
          example: '2026-08-22'
        last_seen_upstream:
          type: [string, 'null']
          format: date
          description: The day the publisher's export last carried this record, for a record a data provider keeps; null for our own.
          example: '2026-09-06'
        verified_by:
          type: [string, 'null']
          enum: [riders, curator, null]
          description: The receipt behind a `curated` tier, null while unverified.
        region_id:
          type: [string, 'null']
          description: The slug of the region the item lies in (`/v1/regions/{id}`), or null.
          example: brussels
        osm: { $ref: '#/components/schemas/OsmSubset' }

    ItemFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: { type: string, const: Feature }
        geometry: { $ref: '#/components/schemas/Point' }
        properties: { $ref: '#/components/schemas/ItemProperties' }

    RouteHitProperties:
      type: object
      description: >
        A recommended route as a search hit (letter R): one point on the
        route, its length and its climb. The line is at `/v1/routes/{id}`.
      required: [id, letter, name, tier, distance_m, ascent_m, region_id]
      properties:
        id: { type: integer, example: 111 }
        letter: { type: string, const: R }
        name: { type: string, example: 'Liège Bastogne Liège' }
        tier: { $ref: '#/components/schemas/Tier' }
        distance_m: { type: integer, example: 12300 }
        ascent_m: { type: integer, example: 210 }
        region_id: { type: [string, 'null'], example: wallonia }

    SearchCollection:
      type: object
      required: [type, features, licence, attribution]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/Point' }
              properties:
                oneOf:
                  - $ref: '#/components/schemas/ItemProperties'
                  - $ref: '#/components/schemas/RouteHitProperties'
        licence: { type: string, const: ODbL-1.0 }
        attribution:
          type: string
          example: '© Cycling Commons contributors (ODbL) · © OpenStreetMap contributors'
        next_cursor:
          type: string
          description: Where the next page starts; absent on the last page and on a name search.

    Photo:
      type: object
      description: >
        One photo with its licence and credit, both to be shown with it. A
        rider's photo is credited by link: `credit_url` is its photo page,
        which names the photographer as they chose, at the moment it is
        read. A Wikimedia Commons photo carries the author and links
        Commons publishes.
      required: [url, thumb, licence, credit, credit_url, source]
      properties:
        url: { type: string, format: uri }
        thumb: { type: [string, 'null'], format: uri }
        licence: { type: [string, 'null'], example: CC BY-SA 4.0 }
        credit: { type: [string, 'null'], description: 'The author as Commons names them; null for a rider''s photo.' }
        credit_url: { type: [string, 'null'], format: uri }
        source: { type: [string, 'null'], format: uri, description: 'The file''s page on Wikimedia Commons; null for a rider''s photo.' }

    ItemDetail:
      type: object
      required: [type, geometry, properties, licence, attribution]
      properties:
        type: { type: string, const: Feature }
        geometry:
          type: object
          description: A Point, or a LineString for a road surface stretch (A).
        properties:
          allOf:
            - $ref: '#/components/schemas/ItemProperties'
            - type: object
              required: [country, osm_ref, source, kind, attributes, photos]
              properties:
                country: { type: [string, 'null'], example: BE }
                osm_ref:
                  type: [string, 'null']
                  description: The OpenStreetMap object this item stands for, or null.
                  example: node/4207030426
                source:
                  type: string
                  description: >
                    Where the row comes from, as the bulk export names it:
                    `cycling-commons` for our own, `osm` or `wikidata` for a
                    mirrored copy, or a registered provider's key.
                  example: cycling-commons
                kind:
                  type: [string, 'null']
                  description: The place's kind (see `/v1/catalog`, `kinds`), for letters that have one.
                  example: station
                attributes:
                  type: object
                  description: >
                    The served fields of the letter's form (`/v1/catalog`,
                    `served`): values picked from a list, measured numbers,
                    and the place's own website. Never text a person wrote.
                  additionalProperties: true
                  example: { potable: 'Yes (public supply)', seasonal: Year-round }
                photos:
                  type: array
                  items: { $ref: '#/components/schemas/Photo' }
        licence: { type: string, const: ODbL-1.0 }
        attribution: { type: string }

    Counts:
      type: object
      required: [bbox, counts, coverage, attribution]
      properties:
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        counts:
          type: object
          additionalProperties: { type: integer }
          description: 'Letter -> items `/v1/search` serves in the box, and `R` the routes crossing it, e.g. `{"B": 41, "R": 2}`.'
        coverage:
          type: object
          additionalProperties: { type: integer }
          description: 'Letter -> OpenStreetMap points in the coverage tiles that no item stands for.'
        attribution: { type: string }

    RegionProperties:
      type: object
      required: [region_id, name, names, country, area_km2, stats]
      properties:
        region_id: { type: string, example: wallonia }
        name: { type: string, example: Wallonia }
        names:
          type: object
          additionalProperties: { type: string }
          description: The name per language where we hold one.
          example: { en: Wallonia, fr: Wallonie, nl: Wallonië }
        country: { type: string, example: BE }
        area_km2: { type: [integer, 'null'], example: 16901 }
        stats:
          type: object
          required: [items, verified, routes]
          properties:
            items: { type: integer, description: 'Items served in the region.' }
            verified: { type: integer, description: 'Of those, verified.' }
            routes: { type: integer, description: 'Recommended routes served in the region.' }
            items_by_letter:
              type: object
              additionalProperties: { type: integer }
              description: Only on one region. Letter -> items served (and `R` -> routes).
            coverage_by_letter:
              type: object
              additionalProperties: { type: integer }
              description: Only on one region. Letter -> OpenStreetMap points no item stands for.

    RegionFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { type: string, const: Feature }
        id: { type: string, example: wallonia }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: West, south, east, north. West above east is a region across the antimeridian.
        geometry:
          type: [object, 'null']
          description: A MultiPolygon.
        properties: { $ref: '#/components/schemas/RegionProperties' }

    RegionCollection:
      type: object
      required: [type, features, licence, attribution]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items: { $ref: '#/components/schemas/RegionFeature' }
        licence: { type: string, const: ODbL-1.0 }
        attribution: { type: string }
        next_cursor: { type: string }

    BestOf:
      type: object
      required: [region_id, voting, lists]
      properties:
        region_id: { type: string, example: wallonia }
        voting:
          type: boolean
          description: Whether community voting is open; no lists while it is not.
        lists:
          type: array
          items:
            type: object
            required: [letter, category, season, year, ranked, entries]
            properties:
              letter: { type: string, example: N }
              category: { type: string, example: climbs }
              season: { type: string, enum: [spring, summer, autumn, winter] }
              year: { type: string, example: '2026-27', description: 'The season''s year; a winter spans two.' }
              ranked: { type: boolean, description: 'Whether enough riders voted for a ranking.' }
              entries:
                type: array
                items:
                  type: object
                  required: [id, letter, name, place, shared, points, on_map]
                  properties:
                    id: { type: integer }
                    letter: { type: string }
                    name: { type: string }
                    place: { type: [integer, 'null'], description: 'The place in the list: 1 is first.' }
                    shared: { type: boolean, description: 'Another entry holds the same place.' }
                    points: { type: [integer, 'null'], description: 'The points the closed round gave it.' }
                    on_map: { type: boolean, description: 'Whether it is still on the map today.' }
        licence: { type: string, const: ODbL-1.0 }
        attribution: { type: string }

    RouteProperties:
      type: object
      description: A closed list, in this order. Never who proposed the route, their note, votes or moderation state.
      required: [id, letter, name, tier, distance_m, ascent_m, region_id, difficulty, dominant_surface, season, bike_types]
      properties:
        id: { type: integer, example: 23 }
        letter: { type: string, const: R }
        name: { type: string, example: 'Spa · Sankt Vith' }
        tier: { $ref: '#/components/schemas/Tier' }
        distance_m: { type: integer, example: 126076 }
        ascent_m: { type: integer, example: 1722 }
        region_id: { type: [string, 'null'], example: wallonia }
        difficulty:
          type: [object, 'null']
          properties:
            score: { type: integer, minimum: 1, maximum: 5 }
            label: { type: string, enum: [Easy, Moderate, Challenging, Hard, Very hard] }
        dominant_surface: { type: [string, 'null'], example: Asphalt }
        season:
          type: array
          items: { type: string }
          example: [Spring, Summer]
        bike_types:
          type: array
          items: { type: string }

    RouteFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: { type: string, const: Feature }
        geometry:
          type: object
          description: A LineString.
        properties: { $ref: '#/components/schemas/RouteProperties' }

    RouteCollection:
      type: object
      required: [type, features, licence, attribution]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items: { $ref: '#/components/schemas/RouteFeature' }
        licence: { type: string, const: ODbL-1.0 }
        attribution: { type: string }
        next_cursor: { type: string }

    RouteDetail:
      type: object
      required: [type, geometry, properties, licence, attribution]
      properties:
        type: { type: string, const: Feature }
        geometry:
          type: object
          description: A LineString.
        properties:
          allOf:
            - $ref: '#/components/schemas/RouteProperties'
            - type: object
              required: [ratings, surfaces, gradient_limited, best_direction, elevation, photos, gpx]
              properties:
                ratings:
                  type: object
                  description: A curator's marks from 1 to 5, not a vote tally; null where none is given.
                  properties:
                    quietness: { type: [integer, 'null'] }
                    scenic: { type: [integer, 'null'] }
                    friendliness: { type: [integer, 'null'] }
                surfaces:
                  type: [object, 'null']
                  description: The measured surface mix along the line.
                  properties:
                    parts:
                      type: array
                      items:
                        type: object
                        properties:
                          surface: { type: string }
                          pct: { type: integer }
                    covered: { type: [number, 'null'], description: 'The share of the line the mix covers, 0 to 1.' }
                gradient_limited: { type: [string, 'null'] }
                best_direction: { type: [string, 'null'] }
                elevation:
                  type: [array, 'null']
                  items: { type: number }
                  description: Heights in metres at even steps along the line.
                photos:
                  type: array
                  items: { $ref: '#/components/schemas/Photo' }
                gpx: { type: string, example: /v1/routes/23.gpx }
        licence: { type: string, const: ODbL-1.0 }
        attribution: { type: string }

    ContributionRequest:
      type: object
      required: [author, licence]
      additionalProperties: false
      properties:
        letter:
          type: string
          description: A letter `/v1/catalog` marks `contributions`. Required for a new place; on an edit, the item's own.
          example: B
        item_id:
          type: integer
          description: Set when editing a served item.
        osm_ref:
          type: string
          description: A new place taken from this OpenStreetMap object.
          pattern: '^(node|way)/\d{1,16}$'
        name:
          type: string
          maxLength: 200
          description: Required for a new place; on an edit, a new name.
        geometry: { $ref: '#/components/schemas/Point' }
        fields:
          type: object
          description: >
            The letter's `accepted` fields (`/v1/catalog`): a pick list takes
            one of its values, a multi-pick a list of them, a link an http(s)
            address, text at most the form's length. `null` clears a field
            on an edit.
          additionalProperties: true
          example: { potable: 'Yes (public supply)', note: 'Behind the church.' }
        author:
          type: object
          required: [ref]
          properties:
            ref:
              type: string
              pattern: '^[A-Za-z0-9._:-]{1,64}$'
              description: >
                Your stable, opaque reference for the person, the same every
                time (an HMAC of your user id, say). Never their email or
                name: we cannot and should not be able to tell who it is.
            name:
              type: string
              maxLength: 80
              description: The name the person chose to share, shown to curators. Omit for anonymous.
        licence:
          type: string
          const: ODbL-1.0
          description: >
            The author agrees the contribution is published under the Open
            Database License. Your partner agreement is what makes this
            assertion binding.

    ContributionAccepted:
      type: object
      required: [submission_id, status, kind, letter, item_id, status_url]
      properties:
        submission_id: { type: integer, example: 136 }
        status: { type: string, const: queued_for_review }
        kind: { type: string, enum: [new, edit] }
        letter: { type: string, example: B }
        item_id: { type: [integer, 'null'], example: 46168 }
        status_url: { type: string, example: /v1/contributions/136 }

    ContributionStatus:
      type: object
      required: [submission_id, kind, letter, item_id, status, decided_at, decision_note]
      properties:
        submission_id: { type: integer }
        kind: { type: string, enum: [new, edit] }
        letter: { type: string }
        item_id: { type: [integer, 'null'] }
        status:
          type: string
          enum: [pending, needs_info, approved, rejected, withdrawn, trashed]
          description: >
            `needs_info`: the curator asked a question (see
            `decision_note`); `trashed`: removed by a curator.
        decided_at: { type: [string, 'null'], format: date-time }
        decision_note:
          type: [string, 'null']
          description: What the curator wrote to the author.

    Catalog:
      type: object
      required: [version, letters, tiers, grades, custodies, attribution]
      properties:
        version: { type: string, example: '1' }
        letters:
          type: array
          items:
            type: object
            required: [letter, slug, key, name, half, geometry, kind_field, kinds, contributions, fields]
            properties:
              letter: { type: string, example: D }
              slug: { type: string, example: bike-services }
              key: { type: string, example: services }
              name: { type: string, example: Bike services }
              half: { type: string, enum: [practical, experiential] }
              geometry: { type: string, enum: [point, line, surface] }
              kind_field:
                type: [string, 'null']
                description: The field that holds the kind (`serviceKind` or `type`), null for letters without kinds.
              kinds:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string, example: station }
                    label: { type: string, example: Repair stand }
              contributions: { type: boolean, description: 'Whether `/v1/contributions` takes this letter.' }
              fields:
                type: array
                items:
                  type: object
                  required: [key, label, type, values, labels, served, accepted]
                  properties:
                    key: { type: string, example: pumpValve }
                    label: { type: string, example: Pump valve }
                    type: { type: string, enum: [select, multiselect, text, textarea, url, links, measured] }
                    values:
                      type: array
                      items: { type: string }
                      description: The values a pick list allows; empty for other types.
                    labels:
                      type: object
                      additionalProperties: { type: string }
                      description: Where a stored value is a key, its label (`station` -> Repair stand).
                    served: { type: boolean, description: 'Whether `/v1/items/{id}` serves it.' }
                    accepted: { type: boolean, description: 'Whether `/v1/contributions` takes it.' }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        grades:
          type: array
          items: { $ref: '#/components/schemas/Grade' }
        custodies:
          type: array
          items: { $ref: '#/components/schemas/Custody' }
        attribution: { type: string }

    MapConfig:
      type: object
      description: >
        The consumer bootstrap. Rendering metadata only: tiles and GeoJSON
        carry data, never styling, so this is where the Commons look is
        offered for consumers that want to match it.
      required: [version, attribution, routes, categories]
      properties:
        version: { type: string, example: '0.2' }
        attribution:
          type: string
          description: The string a consumer must display while Commons overlays are visible.
          example: '© Cycling Commons contributors (ODbL) · © OpenStreetMap contributors'
        routes:
          type: object
          properties:
            tiles:
              type: object
              description: >
                The published archives, keyed by lowercase country code, or `*`
                for one archive that covers every country. Empty when none is
                published.
              additionalProperties:
                type: object
                properties:
                  tiles:
                    type: object
                    properties:
                      routes: { type: string, format: uri }
                  bounds:
                    type: array
                    items: { type: number }
                    minItems: 4
                    maxItems: 4
                  stamp: { type: string, example: '20260816-2223' }
            countries:
              type: array
              items: { type: string }
              description: Lowercase country codes; one source-layer per country.
              example: [be, nl, de]
            sourceLayers:
              type: object
              description: 'Naming contract: replace `{cc}` with each country code.'
              properties:
                lines: { type: string, example: 'routes_{cc}' }
                nodes: { type: string, example: 'knoop_{cc}' }
            style:
              type: object
              properties:
                groups:
                  type: array
                  items:
                    type: object
                    properties:
                      key: { type: string, example: national }
                      nets:
                        type: array
                        items: { type: string }
                        example: [icn, ncn]
                      color: { type: string, example: '#C84E64' }
                badgeMinZoom: { type: integer, example: 10 }
        coverage:
          type: object
          description: The dense raw-OpenStreetMap layer as data-only vector tiles.
          properties:
            tiles:
              type: object
              description: >
                The published archives, keyed by lowercase country code, or `*`
                for one archive that covers every country. Empty when none is
                published.
              additionalProperties:
                type: object
                properties:
                  tiles:
                    type: object
                    properties:
                      points: { type: string, format: uri }
                  bounds:
                    type: array
                    items: { type: number }
                    minItems: 4
                    maxItems: 4
                  stamp: { type: string, example: '20260915-1901' }
            countries:
              type: array
              items: { type: string }
              description: Lowercase country codes plus the 'zz' unstamped bucket.
              example: [be, nl, de, zz]
            sourceLayers:
              type: object
              properties:
                points: { type: string, example: '{letter}_{cc}' }
            letters:
              type: array
              items: { type: string }
              description: Lowercase catalogue letters the artifact carries.
              example: [b, c, d, f, g, o, p, q]
            minZoom: { type: integer, example: 9 }
        categories:
          type: array
          items:
            type: object
            properties:
              letter: { type: string, example: B }
              key: { type: string, example: water }
              label: { type: string, example: Water & food }
              color: { type: string, example: '#8FB6A8' }
              glyph: { type: string, example: 💧 }
              kind: { type: string, enum: [point, line, surface] }
              bestOf:
                type: boolean
                description: Whether the Commons map's Best of view shows this category.
