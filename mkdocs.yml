site_name: Cycling Commons Wiki
site_url: https://wiki.cyclingcommons.org/
site_description: >-
  Reference documentation for the Cycling Commons — the open, non-personal
  cycling-data commons. Manifesto, data catalog, curation & voting, governance.
site_author: Cycling Commons contributors
copyright: >-
  Data ODbL 1.0 · Media & wiki text CC BY-SA 4.0 ·
  © Cycling Commons contributors + OpenStreetMap · stewarded by BikeCoders

repo_url: https://github.com/cycling-commons/cycling-commons
repo_name: cycling-commons/cycling-commons
edit_uri: edit/main/wiki/

# The markdown lives in wiki/; the hand-built map demo lives in atlas/demo/. Build the
# wiki to wiki-dist/ (not mkdocs's default ./site) to keep build output out of the tree.
docs_dir: wiki
site_dir: wiki-dist

theme:
  name: material
  custom_dir: overrides       # overrides/main.html injects site-wide visitor analytics
  language: en
  logo: assets/logo-nav.svg
  favicon: assets/favicon.svg
  font:
    text: Hanken Grotesk
    code: Spline Sans Mono
  palette:
    # Two schemes + a toggle. `atlas` is the warm paper original; `atlas-dark`
    # is its night counterpart (both defined in stylesheets/extra.css). Each
    # entry's media query means the OS preference picks the first view, and the
    # toggle then overrides it — so a reader on a dark desktop never lands on a
    # bright page, and can still switch.
    - media: "(prefers-color-scheme: light)"
      scheme: atlas
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: atlas-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_javascript:
  # Bump ?v= when diagrams.js changes — MkDocs does not fingerprint extra_*.
  - javascripts/diagrams.js?v=3

extra_css:
  # ?v= is a cache-buster. MkDocs fingerprints the theme's own assets but NOT
  # extra_css, so a browser holds the previous copy after an edit and shows a
  # stale sidebar or stale code styling — which reads as "the fix didn't work"
  # rather than "you have an old file". Bump this when extra.css changes.
  - stylesheets/extra.css?v=15

# Ordered to match the "Start here" list on the wiki home page.
nav:
  - Home: index.md
  - Manifesto: manifesto.md
  - Data catalog: data-catalog.md
  - The landscape: landscape.md
  - Curation & voting: curation-and-voting.md
  - Moderator rulebook: moderator-rulebook.md
  - How data earns its place: data-priority.md
  - Contributing: contributing.md
  - Location & privacy: location-privacy.md
  - Governance: governance.md
  - Country onboarding: country-onboarding.md
  - Building the Commons: building.md
  - For developers:
      - GIS in CC:
          - Start here: developers/gis/index.md
          - 1 · The Earth is awkward: developers/gis/coordinates.md
          - 2 · The shapes: developers/gis/shapes.md
          - 3 · Metres vs degrees: developers/gis/metres-vs-degrees.md
          - 4 · Asking spatial questions: developers/gis/spatial-questions.md
          - 5 · Making it fast: developers/gis/making-it-fast.md
          - 6 · From OpenStreetMap to our database: developers/gis/osm-to-database.md
          - 7 · Tiles: developers/gis/tiles.md
          - 8 · Putting it on screen: developers/gis/on-screen.md
          - 9 · Lines that mean something: developers/gis/routes.md
          - 10 · Pitfalls and glossary: developers/gis/pitfalls.md
      - Beyond GIS in CC:
          - Start here: developers/gis-beyond/index.md
          - B1 · Reprojection: developers/gis-beyond/reprojection.md
          - B2 · Relations and complex shapes: developers/gis-beyond/relations.md
          - B3 · Geocoding, both directions: developers/gis-beyond/geocoding.md
          - B4 · Routing: developers/gis-beyond/routing.md
          - B5 · Elevation and terrain: developers/gis-beyond/elevation.md
          - B6 · Edge cases that bite: developers/gis-beyond/edge-cases.md
      - Data operations:
          - Harvesting OSM coverage: developers/data-ops/harvesting.md
          - Onboarding a new country: developers/data-ops/onboarding-a-country.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Mermaid via superfences' custom fence: Material renders ```mermaid blocks
  # natively once the fence is registered, no extra JS include and no CDN.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          # cc-diagram, NOT mermaid: Material's own integration claims the
          # `mermaid` class and (9.7.6 + a floating mermaid@11) blanks every
          # block. javascripts/diagrams.js renders these instead, pinned.
          class: cc-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

plugins:
  - search

# Build-time hook: any inline `path/to/file.ext` that exists in the repo becomes
# a link to that file on GitHub, opening in a new tab. Nothing in the Markdown
# changes, and a path that does not exist is left as plain code rather than
# becoming a dead link.
hooks:
  - tools/mkdocs_github_links.py
