name: App CI
# pipeline/contract/** is in scope deliberately: web/tests/Catalog/CoverageContractTest.php
# pins that contract file (serviceKind parity + TAG_WHITELIST subset of storedTagKeys,
# coverage-provider.md §7). Without this path the guard never runs on the change it
# exists to catch — editing the contract alone triggered no workflow at all.
on:
  pull_request:
    paths: ['web/**', 'pipeline/contract/**', '.github/workflows/ci-app.yml']
  push:
    # staging and symfony-base are deploy sources (deploy-staging.yaml) —
    # without them here, a push could deploy code that never passed CI.
    # `production` is a deploy source too (deploy-production.yaml). It was
    # missing here, so a push straight to production ran no CI at all and the
    # deploy fired anyway.
    branches: [main, staging, symfony-base, production]
    paths: ['web/**', 'pipeline/contract/**', '.github/workflows/ci-app.yml']
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc
          POSTGRES_DB: cyclingcommons_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql://cc:cc@127.0.0.1:5432/cyclingcommons_test?serverVersion=18&charset=utf8"
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # imagick and redis are hard requires in composer.json (photo
          # processing, and sessions/cache/messenger), and setup-php does not
          # ship either by default — without them `composer install` fails the
          # platform check before a single test runs.
          extensions: ctype, iconv, imagick, pdo, pdo_pgsql, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./tools/check-spdx.sh
      - run: ./tools/check-licenses.sh
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/psalm --no-cache
      - name: Rector (advisory)
        run: vendor/bin/rector process --dry-run
        continue-on-error: true
      - run: php bin/console doctrine:migrations:migrate -n --env=test
      # World reference data (continents, countries, ISO 3166-2 subdivisions)
      # is seeded out-of-band, never by a migration — `make test-db-reset` does
      # exactly this step for the local test DB. The region, country-interest
      # and moderator-area tests validate country codes against those rows, so
      # a database that is migrated but empty of countries fails 24 tests with
      # `"ES" is not a known country code`.
      - run: php bin/console app:world:import --env=test
      - run: php bin/phpunit
      # Map scope-model smoke tests (07-20 review finding 8) — plain node:test,
      # no npm install; the runner image ships Node.
      - run: node --test tests/js/*.test.cjs
      # .mjs separately, exactly as `make scope-test` does: the ES-module tests
      # (vendored Scout FIT reader, outbound links, OSM tag values) are invisible
      # to the .cjs glob above and were running nowhere in CI.
      - run: node --test tests/js/*.test.mjs
