name: App CI
on:
  pull_request:
    paths: ['web/**', '.github/workflows/ci-app.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/ci-app.yml']
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc
          POSTGRES_DB: cyclingcommons_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql://cc:cc@127.0.0.1:5432/cyclingcommons_test?serverVersion=18&charset=utf8"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./tools/check-spdx.sh
      - run: ./tools/check-licenses.sh
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/psalm --no-cache
      - name: Rector (advisory)
        run: vendor/bin/rector process --dry-run
        continue-on-error: true
      - run: php bin/console doctrine:migrations:migrate -n --env=test
      - run: php bin/phpunit
      # Map scope-model smoke tests (07-20 review finding 8) — plain node:test,
      # no npm install; the runner image ships Node.
      - run: node --test tests/js/*.test.cjs
