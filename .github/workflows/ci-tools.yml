name: ci-tools
on:
  pull_request:
    paths: ['tools/**', '.github/workflows/ci-tools.yml']
  push:
    # staging is a deploy source (deploy-staging.yaml); without it here, a
    # push could deploy code that never passed CI. symfony-base-clean does not
    # deploy and runs no CI.
    # production included: deploy-production.yaml ships from that branch.
    branches: [main, staging, production]
    paths: ['tools/**', '.github/workflows/ci-tools.yml']
jobs:
  wallonia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pytest
      # Every tools suite, same set as `make tools-test`. The divisions suite
      # moved to pipeline/ with the code (ci-pipeline.yml runs it).
      - run: cd tools && python3 -m pytest wallonia/tests wikimedia/tests -q
