name: ci-tools
on:
  pull_request:
    paths: ['tools/**', '.github/workflows/ci-tools.yml']
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/ci-tools.yml']
jobs:
  wallonia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pyproj: export_divisions imports it at module level, so the divisions
      # suite needs it even offline (duckdb stays lazy inside _connect()).
      - run: pip install pytest pyproj
      # Both tools suites, same set as `make tools-test` — the divisions suite
      # was missing here since Phase 2 added it (07-20 review, finding 8 sweep).
      - run: cd tools && python3 -m pytest wallonia/tests divisions/tests -q
