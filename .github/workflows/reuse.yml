# SPDX-License-Identifier: AGPL-3.0-only
#
# Machine-verifiable per-file licensing (reuse.software): every file in the
# tree must resolve to a licence, either through its own SPDX header
# (check-spdx.sh's rule) or through REUSE.toml (binaries, data, fonts).
# The licence texts live in LICENSES/.
name: REUSE compliance
on:
  push:
    # staging and production are deploy sources; a licence regression must
    # fail before a release, not after it. symfony-base is where the work
    # itself happens, and licence headers get written there one file at a
    # time, so a half-finished sweep has to fail on the branch that made it
    # rather than weeks later at the merge.
    branches: [main, staging, production, symfony-base]
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5
