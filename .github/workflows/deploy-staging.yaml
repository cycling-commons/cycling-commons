name: Deploy — staging

# Deploys to the shared web infrastructure: two web hosts behind a load
# balancer, NOT the single box the old workflow targeted. That one leaned on a
# forced `ssh deploy@host staging` command belonging to another project's
# deploy script; here each domain is deployed explicitly with
# deploy-symfony.sh.
#
# Required secrets:
#   DEPLOY_SSH_KEY     private key authorized for the deploy user on BOTH hosts
#   DEPLOY_HOST_WEB1   web-1 address
#   DEPLOY_HOST_WEB2   web-2 address
#   DEPLOY_PORT        SSH port
#   DEPLOY_USER        deploy
#
# Deliberately NOT required: a GitHub token. deploy-symfony.sh only rewrites the
# clone URL when GITHUB_PAT is set; unset, it clones the plain HTTPS URL, which
# git resolves through the deploy user's credential helper on the host - already
# rendered from the vault as deploy-bot. The credential stays server-side and is
# rotated in one place, and CI cannot leak what it never holds.
# Requires: deploy-bot has read access to this repo while it is private.
#
# Deliberately NOT required: a staging basic-auth password. `/health` carries
# `auth_basic off` in the staging vhost template, so the health check below
# reaches it unauthenticated. A sibling project's workflow passes a
# STAGING_HTPASSWD secret that does not exist and has never mattered, for
# exactly this reason.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wiki
            domain: staging-wiki.cyclingcommons.org
          - name: app
            domain: staging.cyclingcommons.org
    name: ${{ matrix.name }} → ${{ matrix.domain }}

    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          WEB1: ${{ secrets.DEPLOY_HOST_WEB1 }}
          WEB2: ${{ secrets.DEPLOY_HOST_WEB2 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for h in "$WEB1" "$WEB2"; do
            ssh-keyscan -p "$PORT" "$h" >> ~/.ssh/known_hosts 2>/dev/null
          done

      # Sequential, and `set -e` means a failure on web-1 stops before web-2.
      # This is the guard against the failure mode that once left a sibling
      # project's production release on one host for three months: a half-completed
      # two-host deploy must fail the workflow, not pass quietly.
      - name: Deploy to both web hosts
        env:
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          WEB1: ${{ secrets.DEPLOY_HOST_WEB1 }}
          WEB2: ${{ secrets.DEPLOY_HOST_WEB2 }}
        run: |
          set -euo pipefail
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
          BRANCH="${{ github.ref_name }}"
          for host in "$WEB1" "$WEB2"; do
            echo "::group::${{ matrix.domain }} → $host"
            ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
              "$USER@$host" \
              "deploy-symfony.sh '${{ matrix.domain }}' '$REPO_URL' '$BRANCH'"
            echo "::endgroup::"
          done

      # deploy-symfony.sh already health-checks each host locally and rolls back
      # on failure. This checks the public path through the load balancer, which
      # the per-host check cannot see. No credentials: staging sits behind basic
      # auth, but `/health` carries `auth_basic off` in the vhost template, which
      # is why this curl needs none (see the note at the top).
      - name: Health check through the load balancer
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null "https://${{ matrix.domain }}/health"; then
              echo "healthy"
              exit 0
            fi
            echo "waiting… ($i/15)"
            sleep 2
          done
          echo "health check FAILED for ${{ matrix.domain }}"
          exit 1

      # Both hosts sit behind one load balancer, so they must serve the same
      # code. The release DIRECTORY names cannot be compared for that: each
      # host stamps its own release from its own clock, so the names always
      # differ by the seconds between the two sequential deploys (proven on
      # the first two runs of this workflow, which failed on nothing else).
      # The deployed commit is the fact that has to agree, so compare that.
      - name: Verify both hosts run the same commit
        env:
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          WEB1: ${{ secrets.DEPLOY_HOST_WEB1 }}
          WEB2: ${{ secrets.DEPLOY_HOST_WEB2 }}
        run: |
          set -euo pipefail
          # A release is a git clone today; if the deploy script ever strips
          # .git and leaves a REVISION file (the usual deployer trade), the
          # check keeps working - both forms name the deployed commit.
          read_commit() {
            ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
              "$USER@$1" \
              "cd /var/www/${{ matrix.domain }}/current && { cat REVISION 2>/dev/null || git rev-parse HEAD; }"
          }
          C1="$(read_commit "$WEB1")"
          C2="$(read_commit "$WEB2")"
          echo "web-1: $C1"
          echo "web-2: $C2"
          if [ "$C1" != "$C2" ]; then
            echo "HOSTS DIVERGED - the load balancer would serve two different commits"
            exit 1
          fi
