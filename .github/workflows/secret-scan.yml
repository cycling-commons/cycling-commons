name: Secret scan
# Full-history secret scanning on every push and PR, so no credential can slip
# into git after launch. Two complementary engines (run as pinned binaries —
# license-free for an org repo, and reproducible):
#   - gitleaks  : regex/entropy rules over the whole history (uses .gitleaks.toml,
#                 which allowlists the one known false positive). Fails on any hit.
#   - trufflehog: verifying detectors; --only-verified so it fails ONLY on a
#                 confirmed-LIVE secret (dev/docker placeholder creds don't trip it).
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  TRUFFLEHOG_VERSION: "3.95.9"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history — the scanners need every commit

      - name: gitleaks (full history)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --config .gitleaks.toml
          # gitleaks exits non-zero when a non-allowlisted leak is found → fails the job.

      - name: trufflehog (verified/live secrets only)
        run: |
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" | tar -xz trufflehog
          ./trufflehog git "file://${PWD}" --only-verified --fail --no-update \
            --exclude-detectors=lob
          # --fail exits non-zero if a VERIFIED (live) secret is found → fails the job.
          #
          # WHY LOB IS EXCLUDED (2026-08-14). Lob is a US direct-mail/print API.
          # Its sandbox keys are `test_…`, and its detector matches — then
          # "verifies" — any `test_*` identifier, because Lob's test endpoint
          # accepts malformed test keys. In a Python repo every pytest function
          # is `test_something`, so the scan reported **12 verified secrets**,
          # all of them function names in pipeline/tests/ and tools/*/tests/:
          #   test_parse_fixture_payload_extracts_json, and eleven siblings.
          #
          # This is the one case where `--only-verified` protects nothing: the
          # detector's own verifier is what produces the false positive, so the
          # count grows with every test we write. Left alone it trains everyone
          # to read a red secret-scan as noise, which is the failure mode this
          # job exists to prevent.
          #
          # The exclusion is safe HERE and is not a general licence: this
          # project has no Lob integration — no dependency, no client, no key,
          # nothing in composer.json, requirements.txt or web/src. If one is
          # ever added, delete this flag; a real Lob key would then be
          # indistinguishable from the noise. Every other detector stays on,
          # and gitleaks above still scans the same history with its own rules.
